    min_project: 用自己所在组织说清：哪些事属于项目、哪些属于项目集、哪些属于组合
    note: 高项与中项真正的分水岭。七块内容：三者辨析、OPM 与 PMO、绩效域与价值交付、IT 治理与审计、运筹与工程经济、组织通用管理、新技术与数字化转型。其中「项目管理科学基础」是中项完全没有的，也是案例计算题的来源，不能只当选择题背。

# ── 知识点树 ─────────────────────────────────────────────
# 题目挂 kp_id，kp 挂 module_id；parent 支持层级，用于根因归因（错题向上归因）
#
knowledge_points:
  # S1 的五个知识点带讲义（note），所以从 flow style 改成 block style ——
  # 单行 {...} 里塞不下多行正文。其余模块仍是 flow style，两种写法 js-yaml 一视同仁。
  - id: KP-0101
    module_id: S1
    parent: null
    name: 项目与项目管理的基本概念
    ref: "第9章"
    note:
      summary: 项目是为创造独特产物而做的临时性工作，管的是「一次做成」，与重复性的运营相对。
      body: |
        ### 要素

        **项目三个特征**，判别一个事是不是项目只看这三条：
        - 临时性：有明确起点和终点，做完就结束，不是长期存在
        - 独特性：产出是以前没做过的，哪怕类似也不完全相同
        - 渐进明细：一开始只有大方向，细节随推进逐步清晰

        任一条件不满足，它就不是项目。最常见的误判是「长期重复」——每月出报表、每年做审计，都是运营。

        **项目与运营的区别**，考试问到时按三条答：
        | 比较项 | 项目 | 运营 |
        | --- | --- | --- |
        | 目的 | 创造新东西，改变现状 | 维持业务正常转 |
        | 特性 | 临时、独特 | 持续、重复 |
        | 结束 | 有明确终点，交付即结束 | 没有终点，是持续过程 |

        **项目管理的三重约束**：范围、进度、成本。三者联动，任何一方变动另两方必受影响（这就是为什么要走变更流程，见 S2）。

        现代口径在铁三角之外补两个：质量与相关方满意。教材里把它表述为「项目成功不仅要按期按预算交付，还要让相关方满意」。

        **项目管理**的定义：把知识、技能、工具与技术应用于项目活动，以满足项目的要求。注意落脚点是「满足要求」，不是「管住人」。

        ### 例题

        某市政务云平台建设项目，合同工期 18 个月，为全市 40 个委办局搭建统一数据交换环境。以下判断正确的是：

        A. 该项目属于运营，因为它要长期对外提供服务
        B. 该项目属于项目，因为建设期有明确终点、产出是一次性的
        C. 该项目既有项目属性又有运营属性，无法归类
        D. 该项目是项目还是运营，取决于投资规模

        **答案 B。** 判别依据是「建设这件事」而不是「建成后怎么用」。建设期 18 个月有终点（临时性），40 个委办局的交换环境是第一次建（独特性），所以它是项目。建成后的运维才是运营。

        C 看起来像个"聪明"的选项，但教材不给「两者兼有」这种归类——一个事要么是项目要么是运营，判别标准只看当前做的这件事。这是最常见的失分点：被"长期提供服务"这个描述带偏。

        ### 怎么考

        **单选题**最爱考「下列属于项目的是 / 不属于项目的是」。判别只用三条：临时、独特、渐进明细。凡出现「每月」「每年」「日常」「例行」「持续」，一律运营。

        **判断题**爱考两句：
        - 「项目管理就是管好进度和成本」——错，范围、质量、相关方也在里面
        - 「项目结束的标志是产品交付」——不完整，还要完成验收、移交、归档、经验教训总结（收尾过程组）

        **下午卷简答题**问「项目与运营的区别」，标准答法是上面那张表的三行。不要写「项目更重要」这类评价语，阅卷看点只认区别本身。

        **一层容易漏的**：渐进明细常被忽略。它意味着「一开始说不清全部需求」是正常的，不是项目经理失职——这一点在案例题里用来解释「为什么需求变更频繁」。

  - id: KP-0102
    module_id: S1
    parent: null
    name: 五大过程组
    ref: "第9章"
    note:
      summary: 五大过程组是按「做什么类型的事」做的逻辑分组，不是时间先后顺序，同一时间可以并行。
      body: |
        ### 要素

        五个过程组，以及各自的核心动作与产出：

        | 过程组 | 干的事 | 典型产出 |
        | --- | --- | --- |
        | 启动 | 定义一个项目或阶段，授权它开始 | 项目章程、识别相关方 |
        | 规划 | 定目标、定路线、定怎么做 | 各专项管理计划、基准 |
        | 执行 | 照计划干活，把资源变成成果 | 可交付成果、工作绩效数据 |
        | 监控 | 跟踪进展、比对计划、纠偏 | 变更请求、工作绩效报告 |
        | 收尾 | 正式结束项目或阶段 | 验收移交、归档、经验教训 |

        **最重要的一句**：过程组是逻辑分组，不是阶段。它们可以交叠、可以反复：
        - 规划不是「只在开头做一次」——每到一个新阶段要重新规划
        - 执行和监控同时进行——一边干一边看
        - 收尾在一个阶段结束时也要做，不必等整个项目完

        把它当阶段背，就会答错「以下属于监控过程组的是」这类题：节点不在时间轴上，在动作性质上。

        **监控的两个动作要分清**：监控项目工作（整体看进展，确认是否偏离）与实施整体变更控制（有人提变更时，走流程决定批不批）。后者属于监控过程组，很多人误答成执行。

        **执行与监控里最易混的一对**：
        - 质量保证 → 执行（保证过程对）
        - 质量控制 → 监控（检查结果对不对）

        记忆法：保证是「做事时保证」，控制是「做完后检查」。前者在执行中发生，后者在监控中发生。

        ### 例题

        项目经理正在组织团队编写用户操作手册，同时安排专人核对已完工程的验收报告。这两个活动分别属于：

        A. 都是执行过程组
        B. 编写手册属执行，核对验收报告属监控
        C. 编写手册属规划，核对验收报告属收尾
        D. 都是监控过程组

        **答案 B。** 抓动词：「编写」是产出可交付成果 → 执行；「核对」是比对与审查 → 监控。

        C 的陷阱在「验收报告」。看到「验收」就想到收尾是常见误判——收尾是正式验收移交整个项目或阶段，而「核对一份已完工程的验收报告」是过程中的检查动作，属监控（控制质量／确认范围）。判据是：这一动作是在**产生**成果，还是在**检查**成果。

        ### 怎么考

        **单选题**最高频的形态是「以下活动属于哪个过程组」。判据抓动词，五组各一组词：
        - 启动：授权、批准、发起、识别相关方
        - 规划：制定、编制、规划、估算、定义
        - 执行：实施、指导、管理、产出、组建、建设
        - 监控：监督、控制、核实、审查、比对、变更控制
        - 收尾：正式结束、移交、归档、总结

        注意「实施」两个字有坑：「实施整体变更控制」含「实施」但属监控，因为它的实质是审批。这类只能靠记住名单，不能靠猜动词。

        **判断题**常考「五大过程组必须按顺序依次进行」——错。以及「项目开始时五个过程组各执行一次就够」——错，每个阶段都会重走。

        **案例题**爱问「这个项目缺了哪个过程组的工作」，要能给证据。答法：「缺少收尾过程组的工作，表现为项目交付后未做验收归档与经验教训总结，导致同类问题在二期重复出现」。只说「缺收尾」不给证据不给分。

  - id: KP-0103
    module_id: S1
    parent: null
    name: 十大知识领域
    ref: "第9章"
    note:
      summary: 十知识领域是按「管什么」划分的十个专业方向，每个方向横跨多个过程组，与过程组构成二维矩阵。
      body: |
        ### 要素

        十个知识领域（第 6 版口径，中项教材按此讲）：

        1. 整合管理 — 统领其余九个，唯一横跨全部五个过程组
        2. 范围管理 — 做什么、不做什么
        3. 进度管理 — 什么时候做完
        4. 成本管理 — 花多少钱
        5. 质量管理 — 做到什么程度算合格
        6. 资源管理 — 谁来做、用什么做
        7. 沟通管理 — 信息怎么对齐
        8. 风险管理 — 可能出什么岔子
        9. 采购管理 — 哪些从外面买
        10. 相关方管理 — 谁在意这个项目

        **记忆法**：先记「整合」是横着的那条线，其余九个对应「要管的一件具体东西」——范围、时间、钱、质量、人、信息、风险、外部、相关方。九个各自是一个维度，不需要背顺序，需要能「看到一件事就归到某个维度」。

        **三个容易混的边界**：
        - **资源 vs 采购**：团队自己人属资源；从外部买来的（货物、服务、外包）属采购
        - **沟通 vs 相关方**：相关方是「对象」，沟通是「对对象做的事」。识别相关方属相关方管理，制定沟通计划属沟通管理
        - **质量 vs 范围**：范围问「做没做全」，质量问「做得好不好」。少做一个功能是范围问题，功能能跑但天天崩是质量问题

        **整合管理为什么独一份**：范围、进度、成本三个计划各自最优，合起来未必最优——取舍只能由整合管理来做。制定项目管理计划、实施整体变更控制、结束项目或阶段，这三个核心过程都在整合管理里。

        这也解释了案例题里一个高频问法：「各专业计划都做了，项目还是失控」——答「缺整合，各计划之间没有对齐，没有统一基准」。

        ### 例题

        项目经理正在做以下四件事：①编制 WBS ②估算各活动所需工时 ③制定风险管理计划 ④确定项目需要采购哪些外部服务。它们分别属于：

        A. 范围、进度、风险、采购
        B. 范围、成本、风险、采购
        C. 整合、进度、质量、采购
        D. 范围、进度、风险、资源

        **答案 A。** ①WBS 是范围管理的核心工具；②「估算活动所需工时」是进度管理的活动持续时间估算（估**工时/工期**属进度，估**钱**才属成本）；③明写风险；④明写采购。

        B 是最容易选的错项：看到「估算」就归成本。判据是估算对象——`估算活动持续时间` → 进度；`估算成本` → 成本。这两个过程名只差几个字，考题就爱在这里做文章。

        ### 怎么考

        **单选题**形态稳定：给活动问知识领域。这类题没有推理空间，只能靠「动词 + 对象」的配对记忆。给几个高频配对：
        - 出现 WBS、范围基准、确认范围、控制范围 → 范围
        - 出现活动、里程碑、关键路径、历时、进度压缩 → 进度
        - 出现 PV / EV / AC / 挣值 / 储备分析（成本）→ 成本
        - 出现质量审计、测试、因果图、控制图 → 质量
        - 出现 RACI、团队建设、冲突管理 → 资源

        **判断题**有两个固定错项：
        - 「十大知识领域就是项目的十个阶段」——错，领域是横向的，阶段是纵向的
        - 「整合管理只发生在启动阶段」——错，整合贯穿全程，这正是它特殊的地方

        **案例题**常问「这个项目在哪个知识领域管理薄弱」，要求从现象反推。典型对应：
        - 需求反复变、没有变更记录 → 范围管理
        - 反复延期、没有里程碑 → 进度管理
        - 超支但说不清花在哪 → 成本管理
        - 交付后被退回返工 → 质量管理
        - 关键人一走就停摆 → 资源管理
        - 各方理解不一致、会上才发现 → 沟通管理
        - 出了问题才说「没想到」 → 风险管理
        - 供应商交付不合格却已付款 → 采购管理

        这张反推表比分清十个名字有用得多——案例题给的都是现象，不是术语。

  - id: KP-0104
    module_id: S1
    parent: null
    name: 项目生命周期与组织结构
    ref: "第9章"
    note:
      summary: 生命周期把项目切成阶段，组织结构决定项目经理有多大实权，两者共同决定这个项目好不好管。
      body: |
        ### 要素

        **通用生命周期四阶段**（预测型）：启动 → 组织与准备 → 执行项目工作 → 结束项目。

        **生命周期的三条曲线**，考试直接用：

        | 维度 | 什么时候最高 | 说明 |
        | --- | --- | --- |
        | 成本与人力投入 | 执行阶段 | 干活的人最多、花钱最快 |
        | 风险与不确定性 | 启动阶段 | 越往后越清楚，风险越低 |
        | 变更的代价 | 启动时最低，越往后越高 | 改需求在开头很便宜，在收尾极贵 |

        这三条要合起来记一句话：**越早改越便宜，但越早越看不清**。所以变更管理要在早期多做评审，不是拖到后期救火。

        **开发方法的三种形态**：
        - 预测型（瀑布）：需求一开始就能定清，按阶段推进
        - 迭代型 / 增量型：分块交付，逐步完善
        - 适应型（敏捷）：需求高度不确定，短周期小步走

        选型判据是「需求确定性」，不是「项目大小」。

        **组织结构三类（加矩阵的强弱）**，判据只有一个：**项目经理对资源和预算有没有控制权**。

        | 结构 | PM 的角色 | 团队 | 预算权 |
        | --- | --- | --- | --- |
        | 职能型 | 协调员，无实权 | 兼职，分散在各职能 | 无 |
        | 弱矩阵 | 协调员，仍无实权 | 兼职 | 无或极弱 |
        | 平衡矩阵 | 项目经理，有部分权 | 部分专职 | 部分 |
        | 强矩阵 | 项目经理，有较大权 | 多为专职 | 有 |
        | 项目型 | 项目经理，完全权 | 全职集中 | 完全 |

        从职能型往项目型走，PM 的权力单调递增。考「哪种结构下 PM 权力最大」→ 项目型；「最容易资源冲突」→ 职能型和弱矩阵。

        ### 例题

        某公司项目经理小王负责一个数据中台项目。他需要的人由各技术部门经理指派，成员绩效考核由部门经理决定，项目预算也需部门审批。小王每周只能召集一次例会同步进度。这个组织属于：

        A. 项目型
        B. 强矩阵
        C. 弱矩阵
        D. 职能型

        **答案 C。** 三个信号都对上弱矩阵：人由部门指派（不专职）、考核权在部门（PM 无实权）、预算需部门批（无预算权）。

        D 与 C 的区分常被混淆：题干里明确出现了「项目经理」这个身份，说明已经有跨部门的项目角色（哪怕没实权），所以是弱矩阵而不是纯职能型。纯职能型的描述里通常连「项目经理」都不出现，只写「由某部门牵头」。这条区分点很细，但卷面上就是靠「有没有 PM 这个岗位」来分。

        ### 怎么考

        **单选题**给一段组织描述问类型。只抓三个信号，按顺序判：
        1. 团队成员是全职还是兼职 → 兼职多半在矩阵或职能
        2. 绩效考核权在谁手上 → 在部门经理 = 弱；在 PM = 强或项目型
        3. 预算谁批 → 部门批 = 弱；PM 批 = 强或项目型

        三个信号一致时直接定；不一致时按「权力最小的那一项」定，因为组织形态的约束性由最弱的环节体现。

        **判断题**高频两个：
        - 「项目生命周期中风险最高的阶段是执行阶段」——错，是启动阶段（越不确定越靠前）
        - 「变更在项目后期提出代价最小」——错，越往后越贵

        这两条几乎是轮流出现，因为它们反直觉：人的直觉是「越往后越熟练、改起来越容易」，实际是「越往后牵连的已完成工作和已签合同越多」。

        **案例题**会借组织结构出题：「项目经理反复协调不动资源，进度停滞，请分析原因并给对策」。标准答法两段：
        - 原因：组织为弱矩阵（或职能型），PM 无人事权与预算权，只有协调权
        - 对策：短期靠发起人升级、建立项目章程明确授权；长期建议转为强矩阵或设置专职 PM，把考核权与预算权一部分给项目

        只答「加强沟通」不得分——题目问的是结构性原因，沟通解决不了权力问题。

  - id: KP-0105
    module_id: S1
    parent: null
    name: 项目经理的角色与职责
    ref: "第9章"
    note:
      summary: 项目经理不自己干活，而是把事、人、信息三样在约束下调出结果；在矩阵环境里他常常没有直接人事权。
      body: |
        ### 要素

        **三重角色**：
        - 管理者：定计划、分资源、控进度
        - 领导者：给方向、带团队、解决冲突
        - 整合者：把各专业、各相关方的诉求拧成一个方案

        三者里「整合者」最容易被忽略，而它恰恰是 PM 不可替代的部分——各专业工程师都能把本专业做到最好，只有 PM 负责在它们之间做取舍。

        **五种权力来源**（法兰奇与雷文），判据是「服从是因为什么」：

        | 权力 | 服从的理由 | 典型表现 | 持久性 |
        | --- | --- | --- | --- |
        | 法定权 | 他是这个职位 | 「按制度该听他的」 | 中（离岗即失） |
        | 奖励权 | 跟着有好处 | 「干好了给奖金」 | 弱（无奖励即失） |
        | 惩罚权（强制权） | 怕被罚 | 「不干就扣绩效」 | 最弱（用多必反） |
        | 专家权 | 他真懂 | 「听他的不会错」 | 强 |
        | 参照权 | 认同这个人 | 「我愿意跟他干」 | 最强 |

        一句可用的结论：**专家权与参照权最持久，惩罚权最易失效**。案例题里凡是「PM 靠处罚推项目，团队离心」的题，答案方向都是「改用具专业判断与信任建立的方式」。

        **PMI 人才三角**（三种能力）：技术项目管理、领导力、战略与商业管理。中项考「项目经理最需要补哪一块」时，三种都可能，看题干缺什么。

        **职责清单**（答简答题时按序列）：
        1. 对项目目标负责（范围、进度、成本、质量）
        2. 组建团队并建设团队
        3. 识别与管理相关方期望
        4. 识别风险并制定应对
        5. 建立并维护沟通机制
        6. 推动变更走流程，而不是绕流程

        **两条容易答错的边界**：
        - PM 对项目**目标**负责，但项目成败还受组织环境、发起人支持、市场变化影响 —— 说「负全部责任」不准确
        - PM 与发起人的分工：发起人**授权并提供资源**（签章程、给预算、关键时刻升级），PM**执行并交付**

        ### 例题

        项目中期，团队两名核心成员因技术方案争执不下，进度受影响。项目经理老张把两人叫来，用自己十五年的架构经验当场判定了方案，并要求按此执行。此后两人不再争执，但遇到技术分歧都直接找老张，老张成了瓶颈，进度反而更慢。

        老张这次主要用了哪种权力？问题出在哪？

        A. 法定权；问题是他越权
        B. 专家权；问题是他没有培养团队的决策能力，形成单点依赖
        C. 惩罚权；问题是他态度强硬
        D. 参照权；问题是他过于受欢迎

        **答案 B。** 团队服从是因为「他真懂」（十五年架构经验），这是专家权。问题不在用错权力，而在**只用了这一种**：每次都由他判定，团队既没建立判断标准，也没获得授权，于是所有分歧都上浮到他这里。

        注意这题不是问「哪种权力最好」。专家权本身是持久的、正面的，问题在于把个人能力当成组织能力用，结果制造了瓶颈。这类题的正确选项往往带「而没有……」这层转折，只夸权力类型不指出副作用的选项，通常不是答案。

        ### 怎么考

        **单选题**给情境判权力类型，判据是「服从的理由」：
        - 因为职位/制度 → 法定权
        - 因为能带来好处 → 奖励权
        - 因为怕后果 → 惩罚权
        - 因为专业能力过硬 → 专家权
        - 因为认同、佩服这个人 → 参照权

        题干里出现「佩服」「愿意跟随」「人品」→ 参照权；出现「懂行」「经验丰富」「判断准确」→ 专家权。这两个最容易混，区别是：佩服他的**本事**是专家权，佩服他的**人**是参照权。

        **案例题**高频问法是「项目经理应该怎么做」。答题套路固定四步，不要答「加强沟通」「提高重视」这类空话：
        1. 先了解事实（分别沟通，搞清分歧点在哪）
        2. 再分析影响（对范围/进度/成本的影响有多大）
        3. 然后按规则处理（技术分歧找专家评审，需求变更走变更流程）
        4. 最后留痕与同步（记录结论，通知相关方）

        阅卷看的是这四步有没有走全，而不是结论多正确。

        **判断题**两个固定错项：
        - 「项目经理应该是团队里技术最强的人」——错，PM 的核心是整合与协调
        - 「项目经理对项目成败负全部责任」——不准确，PM 对目标负责，成败还受组织与发起人影响

  - id: KP-0201
    module_id: S2
    parent: null
    name: 启动过程组
    ref: "第10章"
    note:
      summary: 启动过程组只有两个过程——制定项目章程和识别相关方，作用是让项目正式立项、有人认账。
      body: |-
        ### 要素

        **启动过程组只有两个过程**，是五大组里最少的一组。少了反而不容易混，考试问「下列属于启动过程组的是」时，只要记住这两件事，干扰项一眼就能排除：

        - **制定项目章程**：由项目发起人签发，正式宣布项目存在，并授予项目经理动用组织资源的权力
        - **识别相关方**：找出所有受项目影响、或能影响项目的人与组织，产出相关方登记册

        **为什么章程必须由发起人签发**：章程是授权文件，授权者必须比被授权者层级高。项目经理自己写章程等于自己给自己授权，逻辑上不成立。项目经理可以**参与编写**（实际上常常是主要执笔人），但发布与批准权在发起人。

        **章程里必须有这几项**，问「章程应包含什么」按这个清单答：

        | 内容 | 作用 |
        | --- | --- |
        | 项目目的与可测量的目标 | 判断成败的依据 |
        | 高层级需求与项目边界 | 划清做什么、不做什么 |
        | 总体里程碑与总体预算 | 高层级的时间与钱 |
        | 审批要求与退出标准 | 谁批、什么情况可以停 |
        | 委派的项目经理及职责职权 | 授权凭据 |
        | 发起人姓名与职权 | 谁认账 |

        **章程与项目管理计划的区别**是关键对比。章程是**授权**，回答「准不准做、谁负责」；计划是**执行依据**，回答「怎么做、分几步、花多少」。章程由发起人批，计划由项目经理编、批准后执行。章程一旦批准，改动要走变更流程。

        **识别相关方为什么放在启动阶段**：越晚识别，返工代价越大。教材强调的是「尽早」加「持续」——相关方登记册在整个项目期间都在更新，不是一次性文档。登记册至少记三类：身份信息（姓名职务联系方式）、评估信息（期望、影响、态度）、分类信息（内外部、支持中立反对、权力与利益）。

        ### 例题

        某市政数据中心项目已获市发改委批复，公司任命老张为项目经理。老张上任后第一件事是召集技术骨干编写项目章程，写完后提交公司总经理批准。以下说法正确的是：

        A. 做法正确，项目经理本就该负责编写章程
        B. 做法错误，章程应由项目发起人发布，项目经理可参与编写但无权发布
        C. 做法正确，只要最终由总经理批准即可
        D. 做法错误，章程应由客户发布，公司无权批准

        **答案 B。** 错在把「发布者」和「执笔人」混成一件事。项目经理参与编写完全正常，但章程的发布主体必须是发起人。

        C 的迷惑性在于「有批准」看起来流程完整，但批准不等于发布——授权链的起点必须是那个为项目出资源、对结果认账的人。

        D 的干扰来自把「客户」等同于「发起人」。发起人可以是客户，也可以是本公司高层，看项目性质。判断题不能只看头衔，要看「谁出钱、谁认账」。

        ### 怎么考

        **单选题**两个高频点：「项目章程由谁发布」（发起人）、「项目经理何时被任命」（在章程中被授权，早于计划编制）。

        **判断题**常见两句：
        - 「项目经理应独自编写项目章程」——错，是参与编写
        - 「相关方登记册在启动时一次性完成」——错，要持续识别更新

        **案例题**常考「立项流程缺失」：项目没有章程就直接开工，后期无人对范围负责、资源调不动。标准答法三步：点出未制定章程导致缺乏正式授权，补识别相关方并建立登记册，再说明章程应包含目标、边界、里程碑、预算与项目经理授权。

        **一层容易漏的**：章程里的目标必须**可测量**。写「提升管理水平」不算目标；写「2027 年 6 月前完成 40 个委办局数据接入，接入率 100%」才是。问「项目目标存在什么问题」，答「目标不可测量、无法作为验收依据」是标准得分点。

  - id: KP-0202
    module_id: S2
    parent: null
    name: 规划过程组
    ref: "第11章"
    note:
      summary: 规划过程组是五大组里过程最多的一组，产出各专项计划与三大基准，原则是近细远粗、渐进明细。
      body: |-
        ### 要素

        **规划过程组在五大组里过程最多**，原因很直接：每个知识领域都要先做计划再干活，而知识领域有十个。所以「下列属于规划过程组的是」这种题，反而不该靠数字记，要靠「这件事是在定规矩还是在干活」来判断。

        **三大基准**是规划过程组最硬的产出，三者合起来构成**绩效测量基准**：

        | 基准 | 由什么构成 | 后面拿来比什么 |
        | --- | --- | --- |
        | 范围基准 | 范围说明书 + WBS + WBS 词典 | 判断「做没做完」 |
        | 进度基准 | 经批准的进度模型（含里程碑） | 判断「快还是慢」 |
        | 成本基准 | 经批准的分时段预算（不含管理储备） | 判断「超没超」 |

        **注意成本基准不含管理储备**，管理储备在成本基准之外，动用要高层批准——这是常考细节。

        **项目管理计划不是一份文件，是一套**：各专项子计划（范围、进度、成本、质量、资源、沟通、风险、采购、相关方参与）加三大基准，再加其他附件，整合成一份。整合的责任人是项目经理，不是各专业各自为政。

        **范围管理的前三步全在规划组**：收集需求 → 定义范围 → 创建 WBS。（第四步「控制范围」在监控组，这是常见归属陷阱。）

        **WBS 四条硬规矩**：
        - 面向**可交付成果**分解，不按部门或职能分解
        - **100% 规则**：子层全部工作相加必须等于父层，不多不少
        - 工作包粒度参考 **8 到 80 小时**，太粗无法估算，太细管理成本反超收益
        - 每个工作包有**唯一责任人**，WBS 词典补上验收标准、资源、成本、质量要求

        **进度计划的编制链条**：活动定义 → 排列活动顺序（四种依赖：完成到 Start、Start 到 Start、完成到完成、Start 到完成，最常用是完成到 Start）→ 估算活动资源 → 估算活动历时（三点估算最常考）→ 制定进度计划（关键路径法）。

        **滚动式规划**是这个组的灵魂：近期的工作分解到工作包级别，远期只分到规划包，随项目推进再细化。它解释了为什么「一开始计划不可能很细」不是失职，而是正确做法。

        ### 例题

        某系统集成项目 WBS 共分四层，第一层按项目阶段分为「需求、设计、开发、测试、上线」五项，第二层把所有工作包继续拆到 2 小时粒度，共 1800 个工作包。项目经理认为这样管控最细最安全。以下评价正确的是：

        A. 正确，分解越细越容易控制
        B. 正确，符合 100% 规则
        C. 不正确，工作包过细会使管理成本超过收益，一般以 8 到 80 小时为宜
        D. 不正确，WBS 应按组织结构而不是阶段分解

        **答案 C。** WBS 的粒度是有成本的：1800 个工作包意味着 1800 次进度更新、1800 份完成确认，管理开销会把项目压垮。100% 规则讲的是「工作量加总对不对」，不管粒度——所以 B 偷换了概念。

        D 的错在方向：按组织结构分解恰恰是 WBS 要避开的，那样会让同一个可交付成果被切到多个部门，责任边界反而模糊。

        ### 怎么考

        **单选题**三类：一是归属判断（哪件事属于规划过程组），二是 WBS 100% 规则的含义，三是滚动式规划指什么。

        **判断题**常考两句：
        - 「三大基准一经确定不得更改」——错，可以改，但要走变更控制流程
        - 「项目管理计划由各专业负责人分别编制」——错，由项目经理整合

        **案例题**在规划组失分最集中的三种情形：没有编制计划就开工、计划未经评审与批准（等于没有基准）、WBS 分解不完整导致范围遗漏。答这类题要落到「缺少什么、导致什么、应该补什么」，不要只写「计划不完善」。

        **一层容易漏的**：规划过程组是可反复的。项目执行中发现新信息，回到规划组细化计划是正常循环，不是「计划失败了」。这一点在解释「为什么项目要定期滚动修订计划」时用得上。

  - id: KP-0203
    module_id: S2
    parent: null
    name: 执行过程组
    ref: "第12章"
    note:
      summary: 执行过程组按计划干活并管人，产出可交付成果与工作绩效数据，凡是跟人打交道的活大多在这一组。
      body: |-
        ### 要素

        **执行过程组的定位**：把计划变成成果，同时把人管住。判断「这件事属于执行还是规划」，看它是「在定规矩」还是「在按规矩干活」。

        **核心过程与产出**：

        | 过程 | 主要产出 |
        | --- | --- |
        | 指导与管理项目工作 | 可交付成果、工作绩效数据、变更请求、问题日志更新 |
        | 管理项目知识 | 经验教训登记册更新 |
        | 获取资源 | 实物资源与团队派工 |
        | 建设团队 | 团队绩效提升、团队章程 |
        | 管理团队 | 冲突解决、变更请求 |
        | 管理沟通 | 沟通记录、项目信息发布 |
        | 实施风险应对 | 风险应对执行记录 |
        | 实施采购 | 选定的卖方、协议 |
        | 管理相关方参与 | 相关方参与计划更新 |

        **工作绩效数据在执行组产生**，这是绩效三件套的起点，务必分清三级：

        | 层级 | 长什么样 | 谁产出 |
        | --- | --- | --- |
        | 工作绩效数据 | 原始记录，如「已完成 3 个模块、花了 12 万」 | 执行组 |
        | 工作绩效信息 | 与计划对比后的结论，如「进度落后 8%」 | 各控制过程 |
        | 工作绩效报告 | 汇总成决策材料，如状态报告、仪表盘 | 监控项目工作 |

        **塔克曼阶梯**是执行组最常考的知识点，五个阶段顺序固定：形成期 → 震荡期 → 规范期 → 成熟期 → 解散期。

        关键在于**震荡期冲突最多，这是团队成长的必要阶段，不是管理失败**。此时项目经理的动作是引导建立规则、明确角色与决策方式，而不是压制冲突或换人。跳过震荡直接想进成熟期，基本等于把矛盾压到后面爆发。

        **建设团队的具体手段**：集中办公（同地点办公，最有效但成本高）、虚拟团队、培训、团队建设活动、认可与奖励、制定团队章程。奖励要奖励**可达成且与目标一致**的行为，教材特别提醒：奖励加班会诱导无效加班，属于反向激励。

        **管理团队与建设团队的区别**：建设团队是「提升能力、凝聚人心」，管理团队是「跟踪绩效、解决冲突、处理问题成员」。选择题常把两者混在一起考。

        ### 例题

        某项目团队组建三周，成员对技术方案分歧很大，会上经常争执，有两名骨干提出调岗。项目经理的做法中，最恰当的是：

        A. 立即更换提出调岗的两名骨干，避免影响进度
        B. 由项目经理拍板确定技术方案，禁止继续争论
        C. 引导团队建立决策规则与角色分工，推动团队进入规范期
        D. 取消例会，减少成员接触以降低冲突

        **答案 C。** 三周、方案分歧、争执——典型的**震荡期**特征。震荡期的任务就是建立规则、理顺角色，C 正对这个阶段。

        B 的问题在于用权力压掉了过程，方案分歧会转入私下抵制，冲突不会消失只会延后。

        A 与 D 都是回避型处理，成本高或掩盖问题。替换成员会把震荡期重置——新人进来团队又回形成期。

        ### 怎么考

        **单选题**三个高频：绩效数据、信息、报告分别由谁产出；塔克曼五阶段的顺序与特征；冲突处理方式的适用场景（合作、妥协、缓和、强迫、回避）。

        **判断题**常见两句：
        - 「经验教训只能在项目结束时总结」——错，执行期就要持续更新登记册
        - 「团队冲突应当尽量消除」——错，适度冲突对决策有益，要管理而非消灭

        **案例题**执行组失分点集中在三处：团队建设缺失（无团队章程、无培训、无激励）、沟通机制缺失（无例会、无信息分发渠道）、相关方参与不足（关键相关方未纳入）。答题要写具体动作，比如「应制定团队章程并明确角色职责」，而不是「应加强团队管理」。

        **一层容易漏的**：管理项目知识的过程产出是**经验教训登记册**，它是收尾阶段的输入。执行期不记，收尾时写不出来——这是案例题里解释「项目结束无法沉淀经验」的直接原因。

  - id: KP-0204
    module_id: S2
    parent: null
    name: 监控过程组
    ref: "第13章"
    note:
      summary: 监控过程组拿实际比计划，产出变更请求与绩效报告，确认范围虽在这一组，做的人却是客户。
      body: |-
        ### 要素

        **监控过程组的动作是测量、比较、纠偏**，它不产出产品，产出的判断和变更请求。

        **过程清单**：监控项目工作、实施整体变更控制、确认范围、控制范围、控制进度、控制成本、控制质量、控制资源、监控沟通、监控风险、控制采购、监督相关方参与。（「监督相关方参与」有的版本译作「监控相关方参与」，指同一个过程。）

        **确认范围是这一组最容易被误解的过程**。它做的是**正式验收已完成的核可交付成果**，验完通过就更新验收状态、走移交。两条关键区分：

        | 对比项 | 确认范围 | 控制质量 |
        | --- | --- | --- |
        | 谁做 | 客户或发起人 | 项目团队内部 |
        | 验什么 | 是否满足需求、能不能接收 | 是否符合质量标准 |
        | 什么时候 | 成果完成后 | 过程中与完成后都可 |
        | 不通过的后果 | 不能交付，退回处理 | 返工，内部消化 |

        顺序上一般是**先控制质量、后确认范围**：自己先检查合格，再请客户验收。跳过自检直接送客户，返工代价高且影响信任。

        **监控项目工作的输出是工作绩效报告**，它把各控制过程算出的工作绩效信息汇总成状态报告、进展报告、仪表盘。这一份报告是决策与沟通的输入，不是给人看热闹的。

        **控制采购包含合同收尾**。老版本单列过「结束采购」，现行口径已并入控制采购——这是判断题爱设的坑：问「合同收尾属于哪个过程」，答控制采购。

        **进度控制的两把刀**：赶工（Crash，加资源或加班，会推高成本）与快速跟进（Fast Tracking，把顺序工作改成并行，会增加返工风险）。考试常问「在成本受限时选哪个」——选快速跟进；「在风险敏感时选哪个」——选赶工。

        **成本控制的主武器就是挣值分析**（见 KP-0206），这里不重复，但要记住监控组的成本控制输出同样是变更请求与预测更新。

        ### 例题

        某项目模块开发完成，项目团队先做了内部测试，发现 12 个缺陷并已修复。随后项目经理提交客户验收，客户提出 3 项与合同需求不符之处。以下说法正确的是：

        A. 客户提出的问题属于质量问题，应由开发团队返工
        B. 客户的验收活动属于确认范围，发现的是需求符合性问题
        C. 内部测试属于确认范围，客户验收属于质量控制
        D. 已通过内部测试即说明成果合格，客户无权拒收

        **答案 B。** 内部测试是控制质量（是否符合标准），客户验收是确认范围（是否满足需求）。客户挑出的是「与合同需求不符」，属需求符合性，不是质量缺陷。

        C 把两者完全对调了，是本题最像的干扰项。判断方法很简单：**内部做的都是质量控制，外部（客户、发起人）做的才是确认范围。**

        D 错在把「符合标准」当成「满足需求」。这两个是不同维度：可以每个指标都达标，但做出来的不是客户要的东西。

        ### 怎么考

        **单选题**四个高频：确认范围与质量控制的区别（几乎每年都有）、绩效数据、信息、报告的流转、进度压缩两法的代价、合同收尾归属。

        **判断题**常见两句：
        - 「确认范围由项目团队执行」——错，由客户或发起人执行
        - 「监控过程组只在项目后期进行」——错，全过程组并行贯穿

        **案例题**监控组是最容易出分的地方，因为失分点高度固定：变更未走整体变更控制、进度偏差未采取纠偏、质量未做过程控制只做终检、验收未形成书面记录。答题时把「发现偏差 → 分析原因 → 提出纠偏或变更 → 更新计划」这条链条写全，比罗列问题得分高。

        **一层容易漏的**：监控是**贯穿全程**的，不是后期才做。项目一开始就要有监控，否则前期偏差会累积到无法纠正——这一点在解释「为什么项目后期才发现严重超支」时是核心答案。

  - id: KP-0205
    module_id: S2
    parent: null
    name: 收尾过程组
    ref: "第14章"
    note:
      summary: 收尾过程组只做一件事——把项目或阶段正式关闭，核心产物是移交、归档和经验教训。
      body: |-
        ### 要素

        **收尾过程组只有一个过程：结束项目或阶段**。过程少不代表事少，它要做完六件事才算真收尾：

        1. 确认全部计划工作已完成并通过验收
        2. 移交最终产品、服务或成果给接收方
        3. 归档项目文件（合同、变更记录、验收单、财务凭证）
        4. 释放项目资源（人员返岗、设备退租、账户回收）
        5. 总结并归档经验教训
        6. 人员安置与必要的庆功

        **行政收尾与合同收尾必须分清**：

        | 对比项 | 行政收尾 | 合同收尾 |
        | --- | --- | --- |
        | 对象 | 整个项目或阶段 | 每一份具体合同 |
        | 关注 | 文档归档、验收完成、资源释放 | 合同条款履行完毕、索赔结清、尾款支付 |
        | 在哪完成 | 结束项目或阶段 | 控制采购（旧版单列「结束采购」） |

        一个项目有多份合同时，**合同收尾要做多次，行政收尾只做一次**。这是常考的数量关系。

        **提前终止也要收尾**。无论项目是正常完工、被客户叫停、预算被砍还是需求消失，都必须执行收尾。原因很实际：合同要结、资源要还、文档要归、经验要沉淀。判断题问「项目被取消可以不收尾」，答案是不行。

        **经验教训是必须项，不是加分项**。它的价值不在本次项目，而在组织过程资产：经验教训库、模板改进、估算参数校正，都是下一个项目的输入。项目结束不总结，等于把学费白交。

        **收尾的产物里最容易被忽略的是组织过程资产更新**。很多人只记得「交付物移交」，其实更新的资产清单更长：经验教训登记册、项目档案、历史估算数据、风险清单、供应商绩效记录。

        ### 例题

        某政务系统项目在实施 8 个月后，因机构改革被主管部门要求终止，剩余工作不再进行。项目经理随即解散团队、通知成员回原部门，并停止了所有记录工作。以下评价正确的是：

        A. 正确，项目终止后无需再履行项目流程
        B. 不正确，项目终止仍须执行收尾，完成合同清算、文档归档与经验教训总结
        C. 正确，只要客户不再支付费用即可终止
        D. 不正确，必须先完成全部剩余工作才能收尾

        **答案 B。** 终止不等于免收尾。B 列的三件事正好是终止场景下最容易被跳过的：合同清算（可能涉及违约金与已完工程量结算）、文档归档、经验教训。

        A 是典型错误认知，也是案例题最爱设的失分点。

        D 走过头了——提前终止的定义就是「剩余工作不做」，收尾针对的是已完成部分和合同关系，不是把活干完。

        ### 怎么考

        **单选题**常考：收尾过程组有几个过程（一个）、合同收尾属于哪个过程（控制采购）、行政收尾与合同收尾的区别、经验教训登记册的归属。

        **判断题**常见三句：
        - 「项目被取消可以不收尾」——错
        - 「经验教训总结是可选的」——错，是必须的
        - 「收尾就是交付产品」——不完整，还有归档、释放资源、总结

        **案例题**问「项目收尾阶段存在哪些问题」，标准得分点：未组织正式验收、文档未归档、资源未释放、未总结经验教训、合同未清算、未移交运维。六条能覆盖绝大多数题目。

        **一层容易漏的**：收尾不仅是行政动作，也是**相关方关系收尾**。客户、供应商、监管方的关系要有明确结束交代，否则后续运维交接会扯皮。这一点在案例题里答出来，明显高于只答文档归档的答案。

  - id: KP-0206
    module_id: S2
    parent: KP-0204
    name: 挣值分析（EVM）
    ref: "第13章"
    note:
      summary: 挣值分析把进度与成本合成一把尺子，SPI 看快慢、CPI 看贵贱，两者都小于 1 就是又慢又超支。
      body: |-
        ### 要素

        **四个基础量必须先认清**，认错一个，后面全错：

        | 符号 | 名称 | 口径 |
        | --- | --- | --- |
        | PV | 计划价值 | 到检查点为止，**计划**要完成的工作的预算 |
        | EV | 挣值 | 到检查点为止，**实际已完成**的工作的预算 |
        | AC | 实际成本 | 到检查点为止，**实际花掉**的钱 |
        | BAC | 完工预算 | 整个项目的总预算 |

        **最关键的一条**：EV 用的是「已完成工作的**预算**价值」，不是实际花的钱，也不是计划量。它是把「进度」翻译成「钱」的桥。

        **两个偏差，看正负**：

        - 进度偏差 SV = EV − PV。小于 0 表示进度落后，大于 0 表示提前
        - 成本偏差 CV = EV − AC。小于 0 表示成本超支，大于 0 表示节约

        **两个指数，看是否大于 1**：

        - 进度绩效指数 SPI = EV ÷ PV。小于 1 表示比计划慢
        - 成本绩效指数 CPI = EV ÷ AC。小于 1 表示比计划贵

        SPI 与 CPI 同时小于 1，就是「又慢又超支」——这是案例题最常见的描述，答「进度滞后且成本超支」即可。

        **预测三件套**：

        - ETC：完工尚需估算，剩余工作还要花多少
        - EAC：完工估算，整个项目最终要花多少
        - VAC：完工偏差 = BAC − EAC，正数表示还剩，负数表示会超

        **EAC 的两种算法，选哪种取决于「偏差会不会继续」**：

        | 情形 | 判断依据 | 公式 |
        | --- | --- | --- |
        | 典型偏差 | 当前偏差会持续到完工，没采取纠正 | EAC = BAC ÷ CPI |
        | 非典型偏差 | 偏差是偶发的，已纠正，剩余按计划走 | EAC = AC + (BAC − EV) |

        **这道判断是整道题的分数所在**。题里出现「按当前趋势继续」「未采取任何措施」就是典型；出现「已查明原因并纠正」「剩余工作按原计划执行」就是非典型。

        **TCPI（完工尚需绩效指数）** = (BAC − EV) ÷ (BAC − AC)，含义是「剩余每一元钱要干出多少产值的活才不超预算」。大于 1 说明必须比原效率更高才行，通常意味着要动措施。

        ### 例题

        某项目总预算 BAC = 800 万元。到检查点时，计划应完成 40% 的工作，实际完成 35%，实际已支出 320 万元。项目经理判断当前偏差会持续到项目结束。则 CPI 与 EAC 分别为：

        **先算基础量**：EV = 800 × 35% = 280 万元，PV = 800 × 40% = 320 万元，AC = 320 万元。

        **CPI** = EV ÷ AC = 280 ÷ 320 = **0.875**，小于 1，成本超支。

        **EAC**（典型偏差）= BAC ÷ CPI = 800 ÷ 0.875 = **914.3 万元**，比原预算超约 114 万元。

        顺带可算 SPI = 280 ÷ 320 = 0.875，也是慢。SV = −40 万元，CV = −40 万元。

        **常见错误**有三种：把 PV 与 EV 弄反（算出 SPI 大于 1 的假提前）、用 AC 当 EV（算出 CPI 恒等于 1）、该用非典型公式时用了典型公式（EAC 算成 AC + 剩余预算 = 320 + 520 = 840 万元）。看清题干那句「偏差会持续」再选公式。

        ### 怎么考

        **上午卷计算题必考**，通常一到两道，分值稳定。出题形式固定：给 PV、EV、AC 或给比例，问 SPI、CPI、EAC、项目状态。

        **判断题**常考概念辨析：
        - 「CV 为负表示进度落后」——错，CV 管成本
        - 「SPI 为 1.2 表示进度超前 20%」——对，但要注意这不一定意味着能提前交付，关键路径才是决定因素

        **案例题**里挣值常作为「判断项目状态」的工具出现，答题要点三句：先算指标、再判状态、最后给措施。只算不判会丢一半分。

        **一层容易漏的**：SV 为负并不必然导致最终延期。如果落后的是非关键路径上的活动，且总时差足够，完工日期可能不受影响。这一点在问「进度落后是否一定影响交付」时是区分高分的答案。

  - id: KP-0207
    module_id: S2
    parent: KP-0204
    name: 变更控制流程
    ref: "第13章"
    note:
      summary: 变更控制的核心是没审批不许动，六步流程跳一步就是失分点，口头变更一律先书面化。
      body: |-
        ### 要素

        **变更的来源**要先能说清：客户需求调整、法规或标准更新、技术方案变更、执行偏差需要纠偏、风险发生后的应对。来源不同，但走的流程完全相同——**没有例外通道**。

        **变更控制六步，顺序不能换**：

        1. **提出书面变更申请**：申请人填变更申请单，写清变更内容、理由、期望时间
        2. **记录并初审**：纳入变更日志，判断是否属于变更（有的只是澄清，不走流程）
        3. **影响分析**：分析对范围、进度、成本、质量、风险、资源的影响，这是最实质的一步
        4. **CCB 审批**：变更控制委员会决定批准、否决或推迟
        5. **实施变更**：批准后由执行团队按更新后的计划实施
        6. **验证并归档**：确认变更结果符合预期，更新基准与配置项，记录归档

        **CCB 的定位要清楚**：它是**审批机构**，不是执行机构。成员通常包括发起人、客户代表、技术负责人、商务负责人。CCB 不负责改代码、不负责写方案，只负责决定「做不做、什么时候做」。

        **基准必须跟着变更走**。批准变更后如果不更新范围基准、进度基准、成本基准，下一次挣值分析就会拿新实际比旧基准，偏差全是假的。这是案例题里「为什么监控数据不可信」的标准答案之一。

        **配置管理是变更控制的底座**，四个动作：识别配置项、建立基线、版本控制、配置审计。变更实施后要同步更新配置项版本，否则会出现「文档是旧的、系统是新的」。

        **口头变更一律不接受**。哪怕是客户负责人口头同意，也要先书面化再进流程。这不是官僚，是留证据——项目后期扯皮几乎都源于「当时说好的」没有纸面记录。

        **紧急变更**可以边处置边报批，但必须在事后补齐审批与记录，不能变成「先做后不报」的常态。

        ### 例题

        项目已进入开发阶段，客户方业务部门负责人在例会上口头要求增加一个数据导出功能，称「这个很简单，你们顺手做了吧」。项目经理最恰当的处理是：

        A. 需求简单，安排开发人员直接实现，避免影响客户关系
        B. 记录为待办事项，等下个版本一起做
        C. 请客户提交书面变更申请，组织影响分析后提交 CCB 审批，批准后实施并更新基准
        D. 拒绝客户要求，说明已进入开发阶段不再接受变更

        **答案 C。** 完整走完六步是唯一正确路径。注意 C 里三个动作一个都不能少：书面化、影响分析、CCB 审批。

        A 是最常见也最危险的做法——「顺手做」的变更没有记录、没有评估、没有更新基准，最终表现为「进度莫名延期、成本莫名超支」。

        B 的问题是「下个版本」这个承诺本身就没经过评估，等于私下批准了变更。

        D 走另一个极端。变更控制不是拒绝变更，而是让变更可控。开发阶段当然可以变，只是要走流程。

        ### 怎么考

        **案例题最高频考点，几乎没有之一**。题干通常描述「客户提出新需求，项目经理直接安排实施」，问存在什么问题、应该怎么做。

        标准答法按四层写：
        - 问题：未建立变更控制流程，变更未书面化、未做影响分析、未经 CCB 审批
        - 影响：范围蔓延、基准失真、进度与成本失控、验收争议
        - 措施：建立变更控制流程，所有变更书面提出，组织影响分析，提交 CCB 决策，批准后更新基准与配置项，实施后验证归档
        - 配套：建立变更日志，配置管理与变更控制联动

        **单选题**常考：变更流程的第一步是什么（提出书面申请，不是影响分析）、CCB 的职责（审批不是实施）、谁有权批准基准变更（CCB）。

        **判断题**常见两句：
        - 「紧急变更可以先实施，事后无需补审批」——错，要补
        - 「变更被否决后不需要记录」——错，否决也要记录，供后续参考

        **一层容易漏的**：变更日志要记录**被否决的变更**。它的价值在于避免同一个变更被反复提出，也为将来复盘提供依据。答题时提这一句，明显比只写「记录批准的变更」完整。


  - id: KP-0301
    module_id: S3
    parent: null
    name: 信息化发展
    ref: "第1章"
    note:
      summary: 信息化是把信息资源转化为生产力的长期过程，本章考的是新基建、工业互联网、数字中国这一层概念。
      body: |-
        ### 要素

        **信息化的基本内涵**：在社会生产和社会活动中，通过普遍采用信息技术、深入开发利用信息资源，推动经济发展和社会进步，使信息经济在国民经济中的比重逐步上升直至占主导地位的过程。注意三个隐含特征——**长期性**（不是一次性工程）、**全方位**（不只经济领域）、**以信息资源为核心**（不是以设备为核心）。

        **现代化基础设施：新基建三大类**，这是本章最稳定的考点：

        | 类别 | 指向 | 典型例子 |
        | --- | --- | --- |
        | 信息基础设施 | 通信网络、新技术、算力 | 5G、数据中心、人工智能平台、工业互联网 |
        | 融合基础设施 | 传统基建被数字化改造 | 智能交通、智慧能源、智慧水利 |
        | 创新基础设施 | 支撑科研与技术开发 | 重大科技基础设施、科教基础设施、产业技术创新设施 |

        判别方法：**「新建的数字底座」是信息，「被改造的老基建」是融合，「搞研发用的」是创新**。三者常混在选项里，靠这个口径区分最快。

        **工业互联网三大体系**：网络（基础，含标识解析）、平台（核心，承载工业知识与模型）、安全（保障）。教材强调平台是核心，因为它把数据、模型、应用聚在一起。

        **数字经济的两条腿**：
        - **数字产业化**：把信息技术本身做成产业（芯片、软件、云服务），是**基础**
        - **产业数字化**：用信息技术改造传统产业（智能制造、智慧农业），是**主战场**

        考试爱问「产业数字化与数字产业化哪个是主战场」，答案是产业数字化——因为传统产业的体量远大于信息产业本身。

        **数字中国的基本框架**：数字经济（发展引擎）、数字政府（治理现代化）、数字社会（民生服务）、数字生态（数据要素与环境）。数字政府的抓手是「一网通办」「跨省通办」「最多跑一次」，指向的是政务数据共享与流程再造。

        **两化融合**指信息化与工业化融合，路径是「信息化带动工业化、工业化促进信息化」。它在概念上与产业数字化重叠，但更强调工业侧。

        ### 例题

        某市拟建设三类项目：① 建设全市统一的政务云数据中心；② 对现有供水管网加装智能监测终端并接入调度平台；③ 建设面向本地半导体产业的中试研发平台。以下归类正确的是：

        A. ①②③均属信息基础设施
        B. ①属信息基础设施，②属融合基础设施，③属创新基础设施
        C. ①属融合基础设施，②属信息基础设施，③属创新基础设施
        D. ①②属信息基础设施，③属融合基础设施

        **答案 B。** 按「新建数字底座、改造老基建、支撑研发」三条判：政务云是新建的数字底座，供水管网是既有设施被数字化改造，中试平台是研发支撑。

        C 把①②对调，是最像的干扰项。判断关键在**对象是不是既有的传统设施**：数据中心本来不存在，属于新建；供水管网本来就存在，属于改造。

        D 的错在把研发平台当成融合。中试平台不面向公众提供服务，也不改造传统设施，它是给技术开发用的。

        ### 怎么考

        **单选题**三类：新基建三类归属、数字经济两条腿的定位、工业互联网三大体系哪个是核心。

        **判断题**常见两句：
        - 「信息化是一次性的系统建设」——错，是长期持续过程
        - 「数字产业化是主战场」——错，产业数字化才是

        **问答题**在下午卷偶有出现，问「工业互联网的三大体系及关系」。标准答法：网络是基础，提供连接与标识解析；平台是核心，沉淀工业知识与模型、承载应用；安全是保障，贯穿全程。三者相互支撑，缺一不可。

        **一层容易漏的**：本章概念多但都很浅，真正的失分点是**把相近概念的值域记混**。比如把「数字政府」与「智慧城市」当同义——数字政府侧重治理与政务服务，智慧城市侧重城市运行管理。这类题不需要深挖，只需要不混。

  - id: KP-0302
    module_id: S3
    parent: null
    name: 信息技术发展（云大物移智区）
    ref: "第2章"
    note:
      summary: 云大物移智区是本章主线，考的是每种技术的分层、服务模式与关键特征，而不是技术细节。
      body: |-
        ### 要素

        **云计算**。五个基本特征：按需自助服务、广泛的网络访问、资源池化、快速弹性伸缩、可计量付费。三种服务模式必须能分辨：

        | 模式 | 用户拿到什么 | 用户自己管什么 |
        | --- | --- | --- |
        | IaaS | 虚拟机、存储、网络 | 操作系统以上全自己管 |
        | PaaS | 开发运行环境、中间件、数据库 | 只管应用与数据 |
        | SaaS | 直接可用的软件 | 什么都不用管 |

        判别口诀：**IaaS 给地基，PaaS 给工地，SaaS 给成品房**。四种部署形态：公有云、私有云、混合云、社区云。

        **大数据**。特征用 5V 记：Volume（量大）、Velocity（速度快）、Variety（类型多）、Veracity（真实性）、Value（价值密度低）。处理流程五段：采集 → 存储 → 处理 → 分析 → 呈现。典型技术栈：HDFS 存储、MapReduce 批处理、YARN 资源调度、Hive 数据仓库、HBase 列式存储、Spark 内存计算。

        **物联网**。**三层架构是必考**：感知层（采集，传感器、RFID、摄像头）、网络层（传输，接入网与承载网）、应用层（处理与业务）。四大支撑技术：RFID、传感器、嵌入式系统、纳米与微机电技术。RFID 的核心价值是**非接触式自动识别**，常用于物流与资产管理。

        **区块链**。本质是**分布式账本**，四个特征：去中心化、不可篡改、可追溯、公开透明（联盟链是部分透明）。共识机制常见 PoW（工作量证明）、PoS（权益证明）。智能合约是「自动执行的代码化合约」。按准入分三类：

        | 类型 | 谁能参与 | 典型场景 |
        | --- | --- | --- |
        | 公有链 | 任何人 | 加密货币 |
        | 联盟链 | 特定机构组成的联盟 | 供应链金融、政务存证 |
        | 私有链 | 单一组织内部 | 内部审计 |

        **考试最近爱考联盟链**，因为它才对应绝大多数企业级与政务场景。

        **5G 三大应用场景**：eMBB（增强移动宽带，大带宽，如高清视频）、mMTC（海量机器通信，大连接，如物联网）、uRLLC（超可靠低时延，如工业控制、远程手术）。三个场景对应三组不同指标，别混。

        **边缘计算与云计算的关系**：不是替代，是分工。云做全局、长周期、大数据量分析；边缘做本地、实时、低时延处理。工业现场的控制指令不能等云端往返，所以要下沉到边缘。

        ### 例题

        某制造企业希望实现车间设备状态实时监控与毫秒级异常停机保护，同时把历史数据汇总到总部做产能分析。以下技术组合最合理的是：

        A. 全部数据上传公有云，由云端统一做实时控制
        B. 车间部署边缘计算节点做实时控制，历史数据汇聚到云端做分析
        C. 车间本地部署私有云完成全部功能，不与总部联通
        D. 使用区块链存储设备数据，实现实时控制

        **答案 B。** 题里有两个矛盾的需求：**毫秒级实时**与**历史数据全局分析**。边缘计算解决前者，云计算解决后者，这正是两者分工的标准场景。

        A 的错在时延：公网往返达不到毫秒级，而且断网即停机，风险不可接受。

        C 的错在割裂：总部要做产能分析就必须汇聚数据，本地闭环满足不了。

        D 混淆了区块链的定位。区块链擅长的是不可篡改的存证与多方互信，不是实时控制，也不是高频数据的高效存储。

        ### 怎么考

        **单选题**极高频：IaaS、PaaS、SaaS 的分辨（每年必考至少一题）、物联网三层架构、5G 三大场景对应关系、区块链的分类与特征。

        **判断题**常见三句：
        - 「SaaS 用户需要自己维护操作系统」——错，那是 IaaS
        - 「区块链数据不可篡改所以不需要备份」——错，不可篡改不等于不会丢
        - 「边缘计算将取代云计算」——错，是互补分工

        **案例题**里这些技术通常作为**方案要素**出现，考的是「选得对不对、理由说不说得通」。答题时不要只罗列技术名词，要写清「这个技术解决哪个具体问题」，例如「采用边缘计算降低现场控制时延」。

        **一层容易漏的**：大数据 5V 里的 **Value 是「价值密度低」**，不是「价值高」。这个反向表述是判断题的经典陷阱：海量数据里真正有用的比例很低，所以需要清洗与挖掘。

  - id: KP-0303
    module_id: S3
    parent: null
    name: 信息技术服务
    ref: "第3章"
    note:
      summary: 信息技术服务考的是 ITSS 体系与 IT 服务生命周期的五个阶段，核心是把服务当产品来管。
      body: |-
        ### 要素

        **IT 服务的定义**：供方为满足需方的业务需求，基于信息技术所提供的服务。关键在「**基于信息技术**」与「**满足业务需求**」——不是卖硬件，也不是单纯修电脑，落点是业务价值。

        **ITSS（信息技术服务标准）体系**是本章骨架，按性质分四类：

        | 类别 | 作用 |
        | --- | --- |
        | 基础标准 | 术语、分类、代码等共同语言 |
        | 服务管控标准 | 服务治理、服务管理（对齐 ISO 20000 思路） |
        | 服务业务标准 | 针对咨询、设计、运维、运营、数据等具体业务 |
        | 服务安全标准 | 服务过程中的安全要求 |

        **IT 服务生命周期五个阶段**，顺序必须记牢：

        1. **规划设计**：从需方业务战略出发，做服务目录、服务级别、能力规划
        2. **部署实施**：把规划落地，完成资源调配、流程上线、人员到位
        3. **服务运营**：日常提供服务，处理请求与事件，保证 SLA 达成
        4. **持续改进**：度量服务绩效，找短板，做优化
        5. **监督管理**：对服务质量、过程、合规性进行监督与评价

        **这五个阶段是闭环不是直线**：持续改进与监督管理会反馈回规划设计，这是「服务生命周期」区别于「项目生命周期」的核心——项目有终点，服务没有。

        **SLA（服务级别协议）**是服务管理的核心工具，写清四件事：服务内容与范围、服务水平指标（可用性、响应时间、解决时间）、双方责任、违约处理。与 SLA 配套的还有**服务目录**（有哪些服务可选）和**服务台**（唯一联系入口）。

        **运维服务的四类活动**：例行操作（巡检、备份）、响应支持（事件与请求处理）、优化改善（性能调优）、咨询评估（规划建议）。这四类常被拿来问「某活动属于哪一类」。

        **服务模式**：远程服务（成本低、响应快，适合标准化问题）、现场服务（适合硬件与复杂问题）、混合服务（最常见）。

        ### 例题

        某单位将办公终端运维外包，合同约定：服务台 7×24 小时受理，一般故障 2 小时内响应、8 小时内解决，关键业务系统中断 30 分钟内到场。运行三个月后，需方发现有 12 起一般故障超过 8 小时才解决，但供方称「已按 2 小时响应，不算违约」。以下判断正确的是：

        A. 供方说法正确，响应达标即履约完成
        B. 供方说法错误，8 小时解决时限是服务水平指标，未达成即构成违约
        C. 该约定不属于 SLA，只是服务承诺
        D. 只有关键业务系统中断才构成违约

        **答案 B。** 合同里同时约定了**响应时限**与**解决时限**，这是两个独立指标，不能用一个满足来抵消另一个。这题的实质是考查「SLA 指标是并列条件」这一常识。

        A 的错在概念偷换：响应只是「开始处理」，解决才是「问题消除」。

        C 错在定性：写清了服务内容、指标、责任的合同附件就是 SLA。

        D 错在抽样理解：三类指标都在合同里，任何一类未达成都是违约。

        ### 怎么考

        **单选题**三类：IT 服务生命周期五阶段的顺序、ITSS 四类标准的归属、运维四类活动的分类。

        **判断题**常见两句：
        - 「IT 服务就是 IT 运维」——错，运维只是服务业务之一，还有咨询、设计、运营、数据服务
        - 「服务生命周期到运营结束」——错，还有持续改进与监督管理，且形成闭环

        **案例题**常以「运维服务质量不达标」出现，问原因与改进。标准答法从四个角度写：服务目录不清（提供什么没界定）、SLA 指标不可度量（写「及时」而不写「2 小时」）、服务过程无记录（无法举证）、缺少持续改进机制（问题重复发生）。

        **一层容易漏的**：**服务台是单一联系点（SPOC）**，不是「修电脑的地方」。它的职责是受理、分类、派单、跟踪、关闭，而不是自己解决所有问题。把服务台当技术支援组，是案例题里很常见的认知错误。

  - id: KP-0304
    module_id: S3
    parent: null
    name: 信息系统架构
    ref: "第4章"
    note:
      summary: 信息系统架构考的是分层怎么分、服务怎么松耦合，重点在企业架构四视图与 SOA、微服务的区别。
      body: |-
        ### 要素

        **架构的定义**：系统的基本组织结构，包括组成元素、元素之间的关系、以及指导其设计与演进的原则。注意「演进」二字——架构不是一次性设计，它要能支撑变化。

        **企业架构四视图**，这是最稳定的考点：

        | 视图 | 回答什么问题 | 主要产物 |
        | --- | --- | --- |
        | 业务架构 | 做什么业务、流程怎么走 | 业务流程模型、组织与职责 |
        | 数据架构 | 有哪些数据、怎么流转 | 数据模型、数据分布、数据标准 |
        | 应用架构 | 有哪些系统、怎么交互 | 应用清单、集成关系 |
        | 技术架构 | 用什么技术支撑 | 技术标准、中间件、基础设施 |

        判断某个内容属于哪个视图，用「业务问做什么、数据问有什么、应用问用哪个系统、技术问靠什么实现」四句话对位即可。

        **分层架构的常见五层**（由下往上）：

        1. 基础设施层：网络、服务器、存储、机房
        2. 数据资源层：数据库、数据仓库、数据湖
        3. 应用支撑层：中间件、公共服务组件、统一认证
        4. 业务应用层：具体业务系统
        5. 展现层：门户、移动端、大屏

        贯穿各层的还有**安全保障体系**与**运维管理体系**，两条竖线，这也是常考的「两体系」。

        **SOA（面向服务的架构）的要点**：把业务能力封装成**可复用、松耦合、粗粒度**的服务，通过标准接口对外提供，服务之间通过企业服务总线（ESB）进行路由、转换与编排。SOA 的价值在于复用与解耦，代价是 ESB 本身容易变成单点与瓶颈。

        **微服务与 SOA 的区别**，这是高频对比：

        | 对比项 | SOA | 微服务 |
        | --- | --- | --- |
        | 服务粒度 | 粗粒度，按业务域 | 细粒度，按业务能力 |
        | 通信方式 | 重，常经 ESB | 轻，常用 REST/HTTP 或消息 |
        | 数据管理 | 倾向共享数据库 | 每服务独立数据库 |
        | 部署 | 常整体部署 | 独立部署、独立扩缩 |
        | 治理 | 中心化 | 去中心化 |

        **中间件的定位**：位于操作系统与应用之间，屏蔽底层差异、提供通用能力。常见类型：应用服务器、消息队列、事务中间件、数据访问中间件。

        **单点登录（SSO）** 解决的是「多个系统一次登录」，技术路径通常是统一认证中心加令牌（票据）传递。它是应用支撑层的典型组件，考试常问「SSO 属于哪一层」——答应用支撑层。

        ### 例题

        某集团有 20 个业务系统，各自维护用户与权限，员工离职后账号在部分系统中未被停用。集团计划改造为统一身份认证，并支持一次登录访问全部系统。以下方案中最符合架构分层原则的是：

        A. 在每个业务系统内各自增加账号同步脚本
        B. 在应用支撑层建设统一认证中心，通过令牌实现单点登录，各系统对接认证接口
        C. 在数据资源层建一张用户总表，各系统直接读取该表
        D. 在展现层做统一门户，门户内嵌各系统的登录页面

        **答案 B。** 认证是**跨系统的公共能力**，属于应用支撑层的职责。B 把能力上收到公共层，各业务系统只负责校验令牌，职责清晰。

        A 是把公共能力分散到 N 个地方，20 个系统就有 20 套逻辑，维护成本随系统数线性增长——这正是当前故障的成因。

        C 看似集中，但让业务系统直接读用户总表意味着**认证逻辑仍在各系统内**，且数据库层被多系统直连，耦合更重。

        D 最容易迷惑：门户内嵌登录页只是「同一个地方点开多个登录框」，本质仍是多次登录，不是 SSO。

        ### 怎么考

        **单选题**四类：企业架构四视图的归属、分层架构中各组件属于哪一层、SOA 与微服务的区别、ESB 的作用。

        **判断题**常见两句：
        - 「微服务就是更细的 SOA」——不准确，两者在数据管理与治理思路上有本质差异（去中心化 vs 中心化）
        - 「分层越多系统越好」——错，层数增加会带来调用链变长与性能损耗

        **案例题**常考「系统烟囱式建设」的问题与改造思路。标准答法：问题是各系统独立建设、数据不通、重复投资、公共能力重复实现；改造思路是梳理业务架构与数据架构，抽取公共能力到应用支撑层（统一认证、统一消息、统一日志），通过标准化接口集成，并建立架构管控机制。

        **一层容易漏的**：架构评估里有个常被忽略的维度是**可演进性**。只评价当前功能是否满足是不够的，还要问「三年后业务变了，这套架构改得动吗」。答题时提这一句，能明显区分深度。

  - id: KP-0305
    module_id: S3
    parent: null
    name: 软件工程
    ref: "第5章"
    note:
      summary: 软件工程考开发模型的选择、UML 图的用途与测试的分层，落脚点是过程可控而不是技术先进。
      body: |-
        ### 要素

        **软件生命周期**六个阶段：可行性研究与计划、需求分析、设计（概要设计与详细设计）、编码、测试、运行维护。注意**维护占成本比例最高**，教材常引用「维护成本占全生命周期的大部分」。

        **开发模型怎么选**，这是本章的核心判断能力：

        | 模型 | 适用条件 | 风险 |
        | --- | --- | --- |
        | 瀑布 | 需求明确稳定、技术成熟、合同严格 | 后期变更代价极大 |
        | 原型 | 需求不清、需要与用户确认 | 原型易被当成成品 |
        | 增量 | 可拆分交付、希望早期见效 | 需良好架构支撑 |
        | 迭代 | 需求逐步清晰 | 迭代节奏与范围管理难 |
        | 螺旋 | 大型高风险项目 | 管理复杂、成本高 |
        | 敏捷 | 需求变化快、小团队、可频繁交付 | 对文档与合同形式要求高时不适配 |

        **螺旋模型的标志是「风险驱动」**——每一圈都先做风险分析再开发。这个特征在选择题里几乎是唯一判据。

        **敏捷与 Scrum**：三个角色（产品负责人、Scrum Master、开发团队）、四个会议（冲刺计划、每日站会、冲刺评审、冲刺回顾）、三个产物（产品待办列表、冲刺待办列表、增量）。核心是短周期（通常 2 到 4 周）交付可用增量。

        **UML 图的用途要能分辨**：

        | 图 | 画什么 | 判据 |
        | --- | --- | --- |
        | 用例图 | 谁用系统做什么 | 出现参与者与用例 |
        | 类图 | 静态结构与关系 | 出现类、属性、关联 |
        | 时序图 | 对象间消息的先后 | 有生命线与按时间排列的消息 |
        | 活动图 | 业务流程与并发 | 有判断、分支、并行 |
        | 状态图 | 一个对象的状态迁移 | 有状态与迁移条件 |
        | 部署图 | 软硬件部署关系 | 有节点与构件 |

        **用例图三要素**：参与者（Actor）、用例（Use Case）、关系（关联、包含、扩展、泛化）。参与者是**角色不是人**——同一个人可以有多个角色。

        **测试分层**：单元测试（开发做，针对函数或模块）、集成测试（模块间接口）、系统测试（整系统功能与非功能）、验收测试（用户做，含 Alpha 内部试用与 Beta 外部试用）。**顺序是从小到大，责任从开发转向用户**。

        **黑盒与白盒**：黑盒不看内部结构，方法有等价类划分、边界值分析、因果图、场景法、错误推测；白盒看代码逻辑，方法有语句覆盖、判定覆盖、条件覆盖、路径覆盖。**边界值最常考**——因为绝大多数缺陷出现在边界上。

        **CMMI 五级**：初始级（混乱）、已管理级（项目级可管理）、已定义级（组织级标准过程）、量化管理级（用数据管理）、优化级（持续改进）。顺序与关键词都要记。

        **软件维护四类**：改正性（修 bug）、适应性（适应环境变化）、改善性也称完善性（加功能、提性能）、预防性（提前改造以防未来问题）。**改善性维护占比最高**，这是常考事实。

        ### 例题

        某项目需求在签约时只有概要描述，客户内部对流程细节意见不一，且要求 3 个月内看到可运行的界面以争取预算。以下开发模型最合适的是：

        A. 瀑布模型
        B. 螺旋模型
        C. 原型模型
        D. CMMI 模型

        **答案 C。** 两个条件同时指向原型：需求不清（需要边做边确认）、需要尽早看到界面（可视化反馈）。原型的本质就是**用可运行的界面把需求问出来**。

        A 的前提恰恰是需求稳定，与题干相反。

        B 的判据是风险驱动与大型项目，题干没有给出高风险特征，且 3 个月的时间窗撑不起多圈螺旋。

        D 不是开发模型，是过程能力成熟度模型——这是最常见的概念混淆项，CMMI 评的是组织能力，不是选来开发某个项目的方法。

        ### 怎么考

        **单选题**四类：模型选择的适用场景、UML 图的识别、测试类型的顺序与责任、CMMI 等级特征。

        **判断题**常见两句：
        - 「单元测试由用户执行」——错，开发人员执行
        - 「敏捷开发不需要文档」——错，是「可工作的软件重于详尽的文档」，不是不要文档

        **案例题**常考「需求变更频繁导致返工」，问原因与对策。标准角度：需求阶段未充分确认（缺原型或原型未评审）、采用瀑布模型而需求本身不稳定（模型与场景不匹配）、缺少变更控制、缺少迭代交付导致问题暴露晚。对策对应写：引入原型确认需求、改用迭代或敏捷、建立变更流程、缩短交付周期。

        **一层容易漏的**：**验收测试的两个变体**——Alpha 由开发方组织、用户在开发场所测试；Beta 由用户在实际使用环境中测试。这两个的差别在「谁组织、在哪测」，常被简写成「都是用户测」而丢分。

  - id: KP-0306
    module_id: S3
    parent: null
    name: 数据工程
    ref: "第6章"
    note:
      summary: 数据工程考的是数据仓库的四个特征与数据治理的六个域，核心是把数据当资产管理而不是当副产物。
      body: |-
        ### 要素

        **数据仓库的四个特征**，必须能背：

        - **面向主题**：按分析主题组织（如客户、产品、财务），不按业务系统组织
        - **集成**：来自多个源系统的数据经统一编码、命名、度量口径后入库
        - **相对稳定**：以查询分析为主，数据一次装入很少修改
        - **反映历史变化**：保留时间维度，能看趋势与同比

        **OLTP 与 OLAP 的分工**：

        | 对比项 | OLTP（业务库） | OLAP（数据仓库） |
        | --- | --- | --- |
        | 用途 | 日常交易处理 | 分析与决策 |
        | 操作 | 增删改查，频繁小事务 | 大批量读与聚合 |
        | 数据 | 当前明细 | 历史汇总 |
        | 设计 | 规范化，减少冗余 | 反规范化，容忍冗余换查询效率 |

        **ETL 三步**：抽取（Extract）、转换（Transform，含清洗与标准化）、加载（Load）。转换是最重的一步，也是数据质量的主要控制点。

        **维度建模的两个核心表**：
        - **事实表**：存业务度量值（金额、数量），行多列少，外键指向维度
        - **维度表**：存描述性属性（时间、地区、产品），行少列多

        **星型模型 vs 雪花模型**：星型的维度表不再规范化，结构像星星，查询快、易理解；雪花的维度表继续规范化拆分层级，冗余少但关联多、查询慢。**做分析优先星型**。

        **数据湖与数据仓库的区别**：数据湖存原始格式（结构化、半结构化、非结构化都能放），先存后算，适合探索与机器学习；数据仓库存加工后的结构化数据，先建模后存，适合稳定报表。实务中常并存，形成「湖仓一体」。

        **数据治理的六个域**：

        | 域 | 管什么 |
        | --- | --- |
        | 数据标准 | 统一编码、命名、口径 |
        | 元数据 | 数据的数据（结构、来源、血缘） |
        | 主数据 | 跨系统共享的核心实体（客户、组织、产品） |
        | 数据质量 | 完整性、准确性、一致性、及时性、唯一性、有效性 |
        | 数据安全 | 分类分级、权限、脱敏、审计 |
        | 数据生命周期 | 产生、存储、使用、归档、销毁 |

        **数据分类分级**按影响程度分三级：一般数据、重要数据、核心数据。**级别越高，管控越严**，核心数据通常要求境内存储、最严审批。

        ### 例题

        某集团有 12 个业务系统，同一客户在不同系统中编号不同、名称写法不一致，导致月度经营分析中客户数出现三个不同口径。以下治理措施中最先应做的是：

        A. 建数据仓库，把 12 个系统的数据全部抽过来做报表
        B. 识别客户为主数据，建立统一编码与唯一标识，各系统按标准改造
        C. 采购数据可视化工具，让各部门自行取数
        D. 要求各系统每月导出 Excel 由人工核对

        **答案 B。** 症状是「同一实体多个标识」，这是**主数据缺失**的典型表现。治理顺序必须是先解决主数据与数据标准，再谈集成与分析——否则把脏数据搬进仓库，只是把问题换了个地方。

        A 是常见错误顺序：不先统一口径就集成，仓库里会同时存在三份客户数据，报表依旧对不上。

        C 只解决展示，不解决口径。工具越方便，错得越快。

        D 是人工兜底，成本随系统数增长，且无法根治。

        ### 怎么考

        **单选题**四类：数据仓库四特征、OLTP 与 OLAP 的区别、星型与雪花模型的取舍、数据质量维度。

        **判断题**常见两句：
        - 「数据仓库的数据是实时更新的」——错，相对稳定，通常是批量装载
        - 「数据湖就是更大的数据仓库」——错，两者在存储格式与建模时序上不同

        **案例题**常考「数据不一致、报表对不上」，问原因与治理方案。标准答法：先定位是标准问题（编码与口径不统一）、主数据问题（同一实体多标识）、还是质量问题（录入缺失与错误）；对策按「建标准 → 管主数据 → 建质量规则与稽核 → 建元数据与血缘 → 定安全分级」的顺序写，顺序本身就是得分点。

        **一层容易漏的**：元数据的价值在于**血缘分析**——能追出「这个报表数字从哪个系统的哪个字段、经过哪几步加工得来」。案例题里出现「数据出错无法定位来源」，标准答案就是「缺少元数据管理」。

  - id: KP-0307
    module_id: S3
    parent: null
    name: 软硬件系统集成
    ref: "第7章"
    note:
      summary: 软硬件系统集成考的是集成分类、网络分层与综合布线六子系统，全是可背可判的硬知识。
      body: |-
        ### 要素

        **系统集成的五个层面**，从低到高：

        | 层面 | 集成什么 | 难点 |
        | --- | --- | --- |
        | 设备集成 | 硬件设备的物理连接与选型 | 接口与兼容性 |
        | 网络集成 | 网络架构、协议、地址规划 | 性能与可靠性 |
        | 软件集成 | 操作系统、中间件、应用的适配 | 版本与依赖 |
        | 数据集成 | 数据格式、编码、同步 | 口径与一致性 |
        | 应用集成 | 业务流程与系统间的协同 | 业务逻辑耦合 |

        **层次越高价值越大、难度也越大**。考试问「系统集成最难的是哪一层」，答案通常指应用集成（业务集成），因为它牵涉流程再造。

        **OSI 七层与 TCP/IP 四层的对应**是必考：

        | OSI 七层 | 主要功能 | TCP/IP |
        | --- | --- | --- |
        | 应用层、表示层、会话层 | 面向应用的数据处理与对话 | 应用层 |
        | 传输层 | 端到端可靠传输（TCP）或无连接传输（UDP） | 传输层 |
        | 网络层 | 路由与寻址（IP） | 网际层 |
        | 数据链路层、物理层 | 帧传输与物理介质 | 网络接口层 |

        **常见协议与端口要记**：HTTP 80、HTTPS 443、FTP 20 与 21、SSH 22、Telnet 23、SMTP 25、DNS 53、SNMP 161。这些几乎每年抽一两个考。

        **局域网技术**：以太网是主流，交换机负责二层转发，VLAN 用于逻辑隔离广播域。三层交换机兼具路由功能。**VLAN 的价值是隔离广播、划分安全域、简化管理**。

        **综合布线六个子系统**，这是本章最稳的考点：

        1. **工作区子系统**：终端到信息插座（含跳线）
        2. **水平子系统**：信息插座到楼层配线架
        3. **垂直干线子系统**：楼层配线架到设备间主配线架
        4. **设备间子系统**：主配线架、网络设备所在
        5. **管理子系统**：配线架与跳线管理（有的教材并入设备间）
        6. **建筑群子系统**：楼与楼之间的连接

        判别方法：**看两端接哪里**。工作区是「终端到插座」，水平是「插座到楼层架」，垂直是「楼层架到主机房」，建筑群是「楼到楼」。

        **机房工程要点**：UPS 保障断电续航、精密空调控制温湿度、防雷接地、气体消防（不能用喷水）、防静电地板、门禁与监控。

        ### 例题

        某办公楼共 12 层，需建设办公网络。设计要求：每层设楼层配线间，一层设中心机房，各楼层信息点至本层配线间采用双绞线，楼层配线间至中心机房采用光纤。以下对应正确的是：

        A. 信息点到本层配线间属垂直干线子系统
        B. 楼层配线间至中心机房属垂直干线子系统
        C. 楼层配线间至中心机房属建筑群子系统
        D. 信息插座本身属于设备间子系统

        **答案 B。** 楼层配线间到中心机房（设备间）的跨层连接就是**垂直干线子系统**，题干里的光纤正是干线的常见介质。

        A 把水平与垂直弄反了。信息点到本层配线架是水平子系统，因为它在**同一楼层平面内**。

        C 错在建筑群的定义：那是**不同建筑物之间**的连接。同一栋楼内的跨层不是建筑群。

        D 把末端部件归错了层，信息插座属于工作区子系统的边界。

        ### 怎么考

        **单选题**四类：OSI 分层与协议归属、端口号、综合布线六子系统的判别、集成五个层面的定位。

        **判断题**常见两句：
        - 「交换机工作在网络层」——错，普通交换机工作在数据链路层（三层交换机才具路由功能）
        - 「水平子系统使用光纤」——通常错，水平子系统一般用双绞线，光纤用于垂直干线

        **案例题**常考「网络改造或机房建设方案评审」，问方案缺陷。常见失分点：未做地址与 VLAN 规划、未考虑冗余（单链路、单电源）、机房消防用了水喷淋、综合布线未按六子系统划分导致责任不清。

        **一层容易漏的**：**集成不只是技术活，还包括接口责任的界定**。多个厂商的设备拼在一起，出问题时谁负责？标准做法是明确接口规范与联调责任，必要时由总集成方统一负责。案例题里出现「互相推诿」，答案就要落到「缺少集成总体责任与接口管理」。

  - id: KP-0308
    module_id: S3
    parent: null
    name: 信息安全工程
    ref: "第8章"
    note:
      summary: 信息安全工程考 CIA 三要素、等级保护五级、对称与非对称加密的分工，落脚点是可落地的防护措施。
      body: |-
        ### 要素

        **信息安全的基本属性**，CIA 三要素先记牢：

        - **保密性**：信息不被未授权者获取（靠加密、权限、脱敏）
        - **完整性**：信息不被未授权篡改（靠哈希校验、数字签名）
        - **可用性**：授权者需要时能正常访问（靠冗余、备份、抗攻击）

        在此之上常补两条：**可控性**（信息传播可控）与**不可否认性**（行为不可抵赖，靠数字签名实现）。

        **等级保护五个级别**，对应关系要清楚：

        | 级别 | 名称 | 侵害客体与程度 |
        | --- | --- | --- |
        | 第一级 | 自主保护 | 公民、法人合法权益，轻微损害 |
        | 第二级 | 指导保护 | 公民法人权益或社会秩序，严重损害 |
        | 第三级 | 监督保护 | 社会秩序与公共利益，严重损害 |
        | 第四级 | 强制保护 | 社会秩序与公共利益，特别严重损害 |
        | 第五级 | 专控保护 | 国家安全，特别严重损害 |

        **多数政务与重要行业系统定三级**，这是常识性判断依据。

        **对称加密与非对称加密的分工**是本章最核心的对比：

        | 对比项 | 对称加密 | 非对称加密 |
        | --- | --- | --- |
        | 密钥 | 一把，加解密同一把 | 一对，公钥与私钥 |
        | 算法 | DES、3DES、AES、SM4 | RSA、ECC、SM2 |
        | 速度 | 快 | 慢（约为对称的千分之一量级） |
        | 用途 | 大量数据加密 | 密钥交换、签名、身份认证 |
        | 难点 | 密钥分发 | 计算开销大 |

        **实务中两者配合**：用非对称加密安全地传递对称密钥，再用对称密钥加密业务数据，这就是**混合加密**，HTTPS 就是这么做的。

        **哈希与数字签名**：哈希（MD5、SHA 系列）是单向摘要，用于校验完整性。**数字签名用私钥签名、公钥验证**——注意方向与加密相反（加密是公钥加密、私钥解密），这个反直觉点是必考陷阱。

        **数字证书与 PKI**：CA 为公钥签发证书，解决「公钥是不是真的属于他」的问题。PKI 提供证书签发、吊销、验证的整套体系。

        **常见安全设备与部署位置**：

        | 设备 | 作用 | 部署 |
        | --- | --- | --- |
        | 防火墙 | 访问控制，按规则过滤 | 网络边界，串联 |
        | IDS | 入侵检测，只报警不阻断 | 旁路 |
        | IPS | 入侵防御，检测并阻断 | 串联 |
        | WAF | 防护 Web 应用攻击 | Web 服务器前 |
        | 堡垒机 | 运维操作审计与管控 | 运维入口 |
        | VPN | 加密远程接入 | 边界 |

        **IDS 旁路、IPS 串联**是高频判别点。

        **风险评估四要素**：资产、威胁、脆弱性、风险。关系是「威胁利用脆弱性，对资产造成影响，形成风险」。安全措施的作用是降低脆弱性或削减威胁影响。

        **应急响应四阶段**：准备（预案与演练）、检测（发现与研判）、处置（遏制、根除、恢复）、总结（复盘与改进）。

        ### 例题

        某单位要求：业务数据在网络传输中要防止被窃听，同时要能证明数据确实由指定发送方发出、且中途未被篡改。以下方案正确的是：

        A. 仅用对称加密传输数据即可满足两项要求
        B. 用对称加密保护数据机密性，同时用发送方私钥对数据摘要签名
        C. 用接收方私钥加密数据，即可同时保证机密性与来源真实性
        D. 用哈希算法加密数据，既保密又能验证来源

        **答案 B。** 两个需求对应两种机制：机密性靠加密（对称即可，效率高），来源真实与完整性靠数字签名（发送方私钥签名、接收方用其公钥验证）。

        A 只解决机密性。对称加密无法证明是谁发的，也无法防篡改。

        C 混淆了密钥方向。用**接收方私钥**加密，只有接收方能解，其他人也能用接收方公钥解，等于没有机密性，而且完全不涉及发送方身份。

        D 把哈希当加密。哈希是单向摘要，不可逆，不能用来还原数据，只能校验完整性。

        ### 怎么考

        **单选题**极高频：CIA 三属性的对应措施、等级保护级别判断、对称与非对称的算法归类、IDS 与 IPS 的部署方式、数字签名的密钥方向。

        **判断题**常见三句：
        - 「数字签名用公钥签名、私钥验证」——错，正好相反
        - 「IDS 可以主动阻断攻击」——错，那是 IPS
        - 「等级保护三级由企业自主定级即可」——错，需经专家评审与主管部门备案

        **案例题**常考「安全方案评审」，问缺失项。标准角度：缺边界防护（防火墙、WAF）、缺入侵检测与审计（IDS、日志、堡垒机）、缺数据加密与脱敏、缺权限与身份管理（最小权限、双因素）、缺备份与应急演练、未做等级保护定级备案。

        **一层容易漏的**：**安全是管理与技术两条腿**。只上设备不改制度，等于把门锁好却把钥匙挂在门上。案例题问「安全事件原因」，答「制度缺失、权限过大、无审计、无演练」往往比答「未部署某设备」更得分。


  - id: KP-0401
    module_id: S4
    parent: null
    name: 组织保障（PMO/配置管理）
    ref: "第15章"
    note:
      summary: 组织保障讲两件事——组织结构决定项目经理有多大权，配置管理保证成果不被改乱。
      body: |-
        ### 要素

        **组织结构有三种基本形态，判别标准是「项目经理对资源与预算的控制力」**：

        | 类型 | 项目经理角色 | 权力 | 特点 |
        | --- | --- | --- | --- |
        | 职能型 | 协调员，无实权 | 最小 | 按部门分工，项目跨部门协调难 |
        | 弱矩阵 | 协调员 | 较小 | 有项目组但仍以部门为主 |
        | 平衡矩阵 | 项目经理 | 中等 | 有正式任命的项目经理，权力与职能经理平衡 |
        | 强矩阵 | 项目经理 | 较大 | 有专职项目管理部门，项目经理对资源控制强 |
        | 项目型 | 项目经理 | 最大 | 资源专属项目，项目结束人员解散 |

        权力从小到大排：**职能型 < 弱矩阵 < 平衡矩阵 < 强矩阵 < 项目型**。这个序列几乎每年考一次。

        **矩阵型的固有矛盾**是**双重汇报**——成员同时向职能经理和项目经理汇报，容易出现资源争夺与考核冲突。题目问「矩阵型组织的主要缺点」，答这一条。

        **PMO 的三种类型，按控制力从弱到强**：

        - **支持型**：顾问角色，提供模板、培训、最佳实践与经验库，不要求服从
        - **控制型**：不仅提供支持，还要求项目遵循组织标准与流程，做合规检查
        - **指令型**：直接管理与控制项目，项目经理向 PMO 汇报

        判别口诀：**支持型给工具、控制型查合规、指令型直接管**。

        **组织过程资产与事业环境因素必须分清**，这是高频对比：

        | 对比项 | 组织过程资产 | 事业环境因素 |
        | --- | --- | --- |
        | 性质 | 组织内部积累，越用越多 | 客观存在，通常不可影响 |
        | 能否改变 | 项目可以更新它 | 项目只能适应 |
        | 例子 | 流程、模板、经验教训库、历史数据、配置管理知识库 | 组织文化、行业标准、法规、市场条件、现有基础设施、现有人力资源状况 |

        判别方法：**「能被项目改的」是过程资产，「只能被动接受的」是环境因素**。

        **配置管理四个活动**：配置项识别、配置控制（含变更控制）、配置状态记录、配置审计。

        **配置库分三库，这是本章最稳的考点**：

        | 库 | 性质 | 谁能改 |
        | --- | --- | --- |
        | 开发库（动态库） | 开发过程中随意修改 | 开发人员 |
        | 受控库（主库） | 存入基线，修改要审批 | 经变更批准后由配置管理员操作 |
        | 产品库（静态库） | 对外发布的成品，只读 | 不允许修改 |

        **基线**是「经批准的快照」，一旦建立，只能通过变更控制流程修改。这正是变更控制与配置管理联动的地方：变更批准的产物，落到配置管理上就是「基线更新」。

        **配置审计分两种**：功能配置审计（FCA）验证**功能与性能是否符合需求**；物理配置审计（PCA）验证**实际交付的组成部分与文档是否与基线一致**。一个查「做得对不对」，一个查「给得全不全」。

        **RACI 责任矩阵**：R 负责执行、A 最终批准、C 需咨询、I 需告知。**A 只能有一个**——这是 RACI 的硬规矩，出现两个 A 就是责任不清。

        ### 例题

        某公司设立项目管理办公室，要求所有项目必须使用统一模板、按季度提交合规自查报告，但项目经理的汇报关系仍在本部门。同时开发人员可直接修改需求文档，上线前再由配置管理员统一归档到发布库。以下判断正确的是：

        A. 该 PMO 属指令型；配置管理做法正确
        B. 该 PMO 属控制型；配置管理做法错误，需求文档应纳入受控库管理
        C. 该 PMO 属支持型；配置管理做法正确
        D. 该 PMO 属控制型；配置管理做法正确

        **答案 B。** 两个判断点都要对。

        PMO 判型看是否「管项目」：它只要求模板与合规，不接管项目经理的汇报关系，所以是**控制型**而不是指令型。

        配置管理判错点更关键：需求文档是**基线的一部分**，必须先入受控库、修改走变更审批。题干里「开发人员可直接修改」意味着基线可以被随意改动，后续所有基于需求的工作都会失真。归档到发布库不等于受控——发布库是成品，不是过程管控。

        ### 怎么考

        **单选题**四类：组织结构对应的项目经理权力排序、PMO 三型的判别、三库归属、组织过程资产与事业环境因素的区分。

        **判断题**常见两句：
        - 「强矩阵组织中项目经理对资源有完全控制权」——错，那是项目型
        - 「配置管理只管代码」——错，文档、计划、基线都是配置项

        **案例题**常考「版本混乱、需求对不上」，标准答法：未建立配置管理（配置项未识别、未建基线）；变更未走审批直接改文件；三库不分（开发与受控混用）；未做配置审计。对策对应写：识别配置项、建立基线、三库分离、变更与配置联动、定期配置审计。

        **一层容易漏的**：配置管理员是**独立角色**，不该由开发人员兼任。自己改自己审等于没有控制。案例题里出现「开发兼配置管理」，是可以直接指出的失分点。

  - id: KP-0402
    module_id: S4
    parent: null
    name: 监理基础知识
    ref: "第16章"
    note:
      summary: 监理的四控三管一协调是本章主线，考的是各阶段做什么，以及监理与承建单位的边界在哪。
      body: |-
        ### 要素

        **监理的三方关系必须先立住**：建设单位（业主）委托监理单位，监理单位**对承建单位实施监督**。三个约束：

        - 监理单位与承建单位**不得有隶属关系或其他利害关系**（否则监督无效）
        - 监理单位**只对建设单位负责**，不对承建单位负责
        - 监理**不替代**承建单位的项目管理，也不替代建设单位的决策

        **四控三管一协调**是记忆主干：

        | 类别 | 内容 |
        | --- | --- |
        | 四控 | 投资控制、进度控制、质量控制、变更控制 |
        | 三管 | 合同管理、信息管理、安全管理 |
        | 一协调 | 协调建设方、承建方及相关方关系 |

        **注意「变更控制」在四控里**，不在三管里——这是最常见的记忆错位。

        **监理的三个阶段**：

        - **设计阶段**：审查设计方案与概算的合理性、可实施性，控制设计质量与投资
        - **实施阶段**：这是主战场——审查开工条件、审批施工方案、旁站与巡视、检查材料设备、验收隐蔽工程、审核进度款、处理变更与索赔
        - **验收阶段**：组织或参与验收、审查竣工资料、出具监理报告、协助移交

        **三级监理文件，编制人与审批人要分清**：

        | 文件 | 谁编 | 谁批 | 用途 |
        | --- | --- | --- | --- |
        | 监理大纲 | 监理单位 | 单位技术负责人 | 投标时用，说明怎么监理 |
        | 监理规划 | 总监理工程师 | 监理单位技术负责人 | 中标后编制，指导整个监理工作 |
        | 监理细则 | 专业监理工程师 | 总监理工程师 | 针对具体专业或工序，可操作 |

        顺序是「大纲 →（中标后）规划 →（分专业）细则」，粒度越来越细。

        **监理的四种现场手段**：

        - **旁站**：关键部位、关键工序全过程现场跟班监督
        - **巡视**：日常巡回检查
        - **平行检验**：监理方独立按比例抽检，与承建方自检并行
        - **见证取样**：材料取样送检时监理在场见证，保证样品真实

        判别：「关键工序全程盯着」是旁站；「按比例自己再查一遍」是平行检验；「看着取样封样」是见证取样。

        **总监理工程师的职责边界**：主持监理工作、签发监理文件与指令、审批施工组织设计、组织工程验收、签发工程款支付证书。**总监不得同时担任多个项目的总监**（有数量与条件限制），这一点在判断题里出现过。

        ### 例题

        某政务信息化项目实施阶段，承建单位完成核心机房隐蔽工程施工后，直接封板并通知监理验收。监理工程师要求拆开检查，承建单位以「工期紧」为由拒绝。以下处理正确的是：

        A. 监理可同意先封板，后续再抽查
        B. 隐蔽工程未经验收不得覆盖，承建单位应拆除检查，费用与工期责任由承建单位承担
        C. 由建设单位决定是否拆开，监理无权要求
        D. 只要承建单位出具自检合格报告即可免检

        **答案 B。** 隐蔽工程的核心规则就是「**未经验收不得覆盖**」，因为一旦覆盖就无法验证。责任也在承建单位：未通知验收就自行覆盖，属于程序违规，拆检费用与工期由其承担。

        A 把规则让位于工期压力，等于放弃了质量控制的唯一窗口。

        C 混淆了权限：监理依合同授权实施质量监督，不需要为每个技术判断请示建设单位。

        D 用自检替代他检，这是监理存在的意义所在——平行检验与旁站正是为了不依赖承建方自检。

        ### 怎么考

        **单选题**四类：四控三管一协调的归类、三级监理文件的编制与审批人、四种现场手段的判别、监理与承建单位的关系。

        **判断题**常见三句：
        - 「监理单位可同时接受承建单位委托」——错，存在利害冲突
        - 「监理规划由专业监理工程师编制」——错，由总监理工程师编制
        - 「旁站适用于所有工序」——错，只用于关键部位与关键工序

        **案例题**常考「监理履职不到位」，问问题与改进。标准角度：未审查开工条件、未审批施工方案、关键工序未旁站、材料未见证取样、变更未审核、进度款未核实即签认。改进对策对应到监理手段与文件上。

        **一层容易漏的**：监理的**信息管理**包含会议纪要、监理日志、月报、往来文函的归档。案例题里出现「过程无记录、事后无法举证」，答案就要落到「监理信息管理缺失」——这是很容易被忽略的一条三管。


  - id: KP-0501
    module_id: S5
    parent: null
    name: 法律法规
    ref: "第17章"
    note:
      summary: 法规考的是合同、招标投标、知识产权三条线，重点在时限、金额与责任划分这些硬数字。
      body: |-
        ### 要素

        **合同编要点**：合同成立经**要约**与**承诺**两个环节，承诺生效时合同成立。违约责任四种承担方式：继续履行、采取补救措施、赔偿损失、支付违约金（或定金）。

        两条硬规则：
        - **定金不得超过主合同标的额的 20%**，超过部分不产生定金效力
        - 不可抗力导致不能履行的，**部分或全部免除责任**，但迟延履行后发生不可抗力的不免责

        **招标投标法的硬数字，这一组最容易考**：

        | 事项 | 时限或金额 |
        | --- | --- |
        | 招标文件发售期 | 不少于 5 日 |
        | 投标文件编制时间（发出至截止） | 不少于 20 日 |
        | 中标候选人公示期 | 不少于 3 日 |
        | 中标通知书发出后签订合同 | 30 日内 |
        | 投标保证金 | 不超过招标项目估算价的 2% |
        | 履约保证金 | 不超过中标合同金额的 10% |
        | 邀请招标的被邀请人 | 不少于 3 家 |

        **必须招标的范围**（三条任一即属）：大型基础设施与公用事业等关系社会公共利益、公众安全的项目；全部或部分使用国有资金投资或国家融资的项目；使用国际组织或外国政府资金的项目。

        **废标与无效投标的常见情形**：投标文件未按要求密封、无单位盖章与法人签字、逾期送达、报价超过最高限价、投标人不具备资格。**串通投标**与**以他人名义投标**属违法行为，中标无效。

        **政府采购的六种方式**：公开招标（主方式）、邀请招标、竞争性谈判、单一来源采购、询价、竞争性磋商。**单一来源**适用条件最严：只能从唯一供应商处采购、发生不可预见的紧急情况、需保证一致性或服务配套且追加金额不超过原合同金额 10%。

        **知识产权三类的期限，必须分清起算点**：

        | 类型 | 保护期 | 起算 |
        | --- | --- | --- |
        | 发明专利 | 20 年 | 自申请日 |
        | 实用新型 | 10 年 | 自申请日 |
        | 外观设计 | 15 年 | 自申请日 |
        | 商标权 | 10 年，可无限续展 | 自核准注册日 |
        | 软件著作权（自然人） | 终生加死后 50 年 | — |
        | 软件著作权（法人） | 50 年 | 自首次发表 |

        **专利与商标的期限从申请或注册日起算，不是从授权日起算**，这个差别是典型的失分点。

        **数据与网络三条法律的定位**：网络安全法管网络运行安全与关键信息基础设施保护；数据安全法管数据分类分级与数据出境；个人信息保护法管个人信息处理的合法性基础。个人信息处理的核心原则：**合法、正当、必要、最小化，告知并取得同意**。

        ### 例题

        某国有投资的公司办公系统升级项目，估算价 800 万元。招标文件于 3 月 1 日发出，投标截止定在 3 月 12 日。评标结束后 4 月 10 日发出中标通知书，5 月 20 日签订合同。投标人按要求提交保证金 20 万元。以下说法正确的是：

        A. 该项目可不招标，因属企业内部系统
        B. 投标截止时间与合同签订时间均违反法定时限
        C. 保证金金额符合规定，时限也均合法
        D. 仅合同签订时间违法，投标时间可协商确定

        **答案 B。** 两个违规点：

        投标文件编制时间只有 11 天，**法定不少于 20 日**；合同应在中标通知书发出后 **30 日内**签订，4 月 10 日到 5 月 20 日已 40 天。

        A 错在资金来源：国有资金投资项目属必须招标范围，与「内部系统」无关。

        C 的保证金部分是对的（800 万的 2% 是 16 万，交 20 万其实**已超**），所以 C 整体仍错——这类题要看全每个条件，别只看时限。

        D 错在「可协商」：法定时限是强制性规定，不能由双方约定缩短。

        ### 怎么考

        **单选题**三组高频：招标投标的时限与金额、知识产权保护期与起算点、政府采购方式的适用条件。

        **判断题**常见三句：
        - 「定金可以超过合同额的 30%」——错，上限 20%
        - 「专利权自授权日起算」——错，自申请日
        - 「单一来源采购无需任何论证」——错，需论证与审批

        **案例题**常以「合同纠纷」出现，问责任划分。答题顺序：先定合同是否有效成立，再看是否有一方违约，再看是否有免责事由（不可抗力），最后落到违约责任的承担方式与金额。

        **一层容易漏的**：**软件著作权归属默认规则**——职务作品原则上归单位，委托开发则按合同约定，**合同未约定的归受托方（开发者）**。这一条与直觉相反，是案例题的高频陷阱：甲方出钱开发，若合同没写归属，著作权可能在乙方手里。

  - id: KP-0502
    module_id: S5
    parent: null
    name: 标准规范
    ref: "第17章"
    note:
      summary: 标准规范考的是标准分级与强制、推荐性的区分，以及信息技术服务与文档标准这类可背的号。
      body: |-
        ### 要素

        **标准的五个层级，从高到低**：

        | 层级 | 代号 | 说明 |
        | --- | --- | --- |
        | 国家标准 | GB、GB/T、GB/Z | 全国范围内统一 |
        | 行业标准 | 如 SJ、YD、JR | 某行业范围内统一，需报国务院标准化主管部门备案 |
        | 地方标准 | DB 加行政区划代码 | 本行政区域内统一 |
        | 团体标准 | T 加团体代号 | 学会、协会等社会团体制定，供自愿采用 |
        | 企业标准 | Q 加企业代号 | 企业内部统一 |

        **层级关系**：下一级标准不得与上一级标准相抵触；**企业标准可以严于国家标准，不能低于**。这是常考的一句。

        **代号第三位最能区分性质**：

        - **GB**：强制性国家标准，**必须执行**
        - **GB/T**：推荐性国家标准，**自愿采用**
        - **GB/Z**：指导性技术文件，供参考

        **推荐性标准的约束力有一个转折**：一旦被法律法规引用、或被合同约定采用，就**在该范围内具有强制约束力**。这一条是判断题的经典考点——「推荐性标准可以不执行」这句话只在不被引用时成立。

        **标准化法（2018 年修订）的两个变化**：一是确立**团体标准**的法律地位；二是实行**企业标准自我声明公开**制度，企业不再需要逐级备案，但要公开声明并接受监督。

        **信息技术服务标准（ITSS）** 是国内 IT 服务领域的标准体系，覆盖咨询设计、运维、运营、数据服务等业务，与 KP-0303 的生命周期五阶段配套使用。

        **软件文档标准**：GB/T 8567 规定了软件文档的编制要求。核心文档类型包括可行性研究报告、项目开发计划、软件需求规格说明、概要设计说明、详细设计说明、数据库设计说明、测试计划、测试报告、用户手册、操作手册、开发进度月报、项目开发总结报告。

        **判别用法**：题目问「某文档属于哪个阶段」，按「可行性 → 计划 → 需求 → 设计 → 测试 → 用户文档 → 总结」的顺序对位即可。

        **系统集成资质的变化要清楚**：计算机信息系统集成企业资质**已取消行政审批**，转为行业自律与第三方评估。考试若问「是否仍需取得行政审批」，答不需要。

        ### 例题

        某项目合同技术附件中写明「系统安全设计应符合 GB/T 22239 的要求」，实际实施时承建方称「GB/T 是推荐性标准，可以不执行」，仍按自己的内部规范实施。以下判断正确的是：

        A. 承建方说法正确，推荐性标准不具有约束力
        B. 承建方说法错误，GB/T 一旦被合同引用即在该合同范围内具有约束力
        C. 承建方说法正确，除非该标准被法律法规强制引用
        D. 应由监理单位决定是否采用该标准

        **答案 B。** 推荐性标准的「推荐」是针对**未被引用**的一般情形。合同引用后，它成为双方的约定内容，不执行就是违约——约束力来源从「标准本身」变成了「合同」。

        A 与 C 都在讲标准自身效力，忽略了合同这一层。

        C 把约束力来源限死在「法规引用」，漏掉合同引用这条更常见的路径。

        D 混淆了权限：标准适用性由合同约定，监理只能监督执行，不能替代合同解释。

        ### 怎么考

        **单选题**四类：标准代号的强制性判读（GB、GB/T、GB/Z）、标准层级关系、标准被引用后的效力、常见标准号的适用领域。

        **判断题**常见三句：
        - 「企业标准不得高于国家标准」——错，可以严于
        - 「推荐性标准一律可以不执行」——错，被引用后具有约束力
        - 「系统集成资质仍为行政审批」——错，已取消

        **案例题**偶考「未按标准实施」，问责任。答题要点：先确认该标准是否被合同或法规引用（决定是否强制），再确认承建方偏离的事实，最后落到违约责任与整改要求。

        **一层容易漏的**：标准的**版本时效**。引用标准时要写明年号（如 GB/T 8567-2006），否则默认适用最新版本。案例题里出现「按旧版标准交付导致不达标」，答案就是「未明确标准版本、未跟踪标准更新」。

  - id: KP-0503
    module_id: S5
    parent: null
    name: 职业道德规范
    ref: "第18章"
    note:
      summary: 职业道德考的是几条内核，落到案例上就是该不该做、出了问题报不报，边界比条文重要。
      body: |-
        ### 要素

        **职业道德的六条基本要求**：遵纪守法、诚实守信、客观公正、爱岗敬业、保守秘密、终身学习。

        落到信息系统项目管理师这个角色上，重点在三条**容易产生冲突的场景**：

        **第一，客观公正与利益冲突**。职业判断不能受利益影响：不得收受供应商回扣、礼品、宴请；不得在与项目有利益关系的单位兼职或持股；评估与验收结论必须基于事实而非关系。**遇到利益冲突要主动申报并回避**，「申报回避」这个动作比「拒绝」更专业。

        **第二，保密义务**。范围包括客户业务数据、商业机密、系统漏洞信息、合同价格。关键点有两个：**保密义务不因离职而终止**；**未经授权不得将项目资料用于其他用途**（包括写进自己的作品与案例分享）。

        **第三，发现问题必须报告**。这是职业道德里最容易被考的场景：上级要求伪造测试记录、要求隐瞒质量缺陷、要求虚报进度以领取进度款。正确处理是**拒绝执行并向上级或更高层报告，必要时向监管方反映**。

        注意这里的边界：**服从管理不等于服从违法指令**。以「领导让我这么做的」作为辩解，在职业道德题里永远是错误选项。

        **知识产权与正版化**：不擅自复制、传播他人软件与文档；项目中使用的第三方组件要确认授权；不使用盗版工具开发交付物。这一条与 KP-0501 的知识产权部分相互支撑。

        **对公众安全的责任**。当项目涉及公共安全（如医疗、交通、政务系统）且存在已知风险时，职业责任优先于合同义务与企业利益。典型题：客户要求先上线后补安全整改，项目经理应如实报告风险并坚持整改后再上线。

        **常见的行为边界清单**：

        | 场景 | 正确做法 |
        | --- | --- |
        | 客户送购物卡 | 婉拒，无法拒绝时登记上交 |
        | 上级要求改测试结论 | 拒绝并书面报告，留痕 |
        | 离职后带走项目资料 | 不得带走，保密义务延续 |
        | 供应商邀请旅游 | 拒绝，属利益输送 |
        | 发现系统有严重漏洞 | 内部报告并推动修复，不对外公开 |

        ### 例题

        项目临近验收，测试发现关键模块存在两个高危缺陷。客户方负责人表示「先验收上线，下个版本再修」，项目经理的上级也同意，并暗示「验收报告可以按通过写」。项目经理的正确做法是：

        A. 按上级与客户意见办理，验收报告写通过，缺陷记入下期
        B. 在验收报告如实记录缺陷与风险，书面说明高危缺陷的影响，坚持整改或取得客户书面风险确认后再上线
        C. 直接向媒体或公众披露缺陷，倒逼整改
        D. 辞职并拒绝在验收报告上签字

        **答案 B。** 关键在「如实记录 + 书面留痕 + 风险确认」。项目可能因业务原因必须上线，但**记录不能假**，风险要让决策方书面确认。这样既守住职业底线，也没有越权替客户做决策。

        A 是伪造记录，属明确的职业道德违背，也是本题唯一绝对不能选的。

        C 走过头了：对外披露不是首选路径，应先走内部与监管渠道，且可能违反保密义务。

        D 是回避问题。职业道德要求的是「坚持正确做法」，不是「退出」。

        ### 怎么考

        **单选题**三类：利益冲突的处理方式、保密义务的范围与期限、发现问题的正确处置路径。

        **判断题**常见三句：
        - 「离职后保密义务自动解除」——错
        - 「为赶工期可以简化测试并口头告知客户」——错，缺陷与简化必须书面记录
        - 「客户要求就是最高准则」——错，违法与违背职业规范的要求应拒绝

        **案例题**极少单独考职业道德，但它常作为「质量与验收」类题目的隐含得分点。答「如实记录缺陷并书面报告」比答「与客户协商」更得分，因为前者体现职业底线。

        **一层容易漏的**：职业道德还包括**对同行与团队的公正**。例如不把团队成果据为己有、不因个人好恶评价成员绩效。这类内容在案例题里以「团队士气低落、骨干离职」的形式出现，答「绩效评价不客观、缺少认可机制」即可。


  - id: KP-0601
    module_id: S6
    parent: null
    name: 计算题专项
    ref: "第13章"
    note:
      summary: 计算题专项把上午卷会算的几类题集中练，核心是公式记准、单位统一、先判条件再代数字。
      body: |-
        ### 要素

        **一、三点估算（PERT）**

        - 期望工期 = (乐观 + 4 × 最可能 + 悲观) ÷ 6
        - 标准差 = (悲观 − 乐观) ÷ 6

        标准差用来判断概率：**正负 1 个标准差约 68.26%，正负 2 个约 95.46%，正负 3 个约 99.73%**。题目问「在多少天内完成的概率约 95%」，就是期望值加减两个标准差。

        **二、沟通渠道数**

        渠道数 = n × (n − 1) ÷ 2，n 是包括项目经理在内的人数。

        算「增加了多少条渠道」要用新值减旧值。例：8 人时 28 条，增到 12 人时 66 条，增加 38 条。**人数翻倍，渠道接近四倍**，这是它常被用来解释「团队越大沟通越难」的原因。

        **三、决策树与期望货币值（EMV）**

        各分支用「概率 × 损益」求和，再减去投入，得到净期望值，选净期望值最大的方案。

        **四、净现值与投资回收期**

        - 静态回收期 = 累计净现金流转正的前一年数 + （上年累计绝对值 ÷ 当年净现金流）
        - 净现值为正说明按给定折现率是划算的；多方案比较选净现值大者
        - **动态回收期一定长于静态回收期**，因为折现把未来的钱打折了

        **五、加权评分**

        各方案按权重乘得分求和。注意权重之和须为 1（或 100%），否则先归一化。

        **六、资源平衡与资源平滑**

        | 方法 | 是否改变关键路径 | 是否延长工期 |
        | --- | --- | --- |
        | 资源平衡 | 会 | 通常会延长 |
        | 资源平滑 | 不会（只在时差内调） | 不延长 |

        这是判断题的高频点：**资源平滑不延长工期，资源平衡可能延长**。

        **七、成本估算四法**

        类比估算（自上而下，快、粗、依赖历史数据）、参数估算（用模型与参数，如每功能点成本）、自下而上估算（最准、最费时）、三点估算（应对不确定性）。

        **八、常见失分点清单**

        - 单位不统一（万元与元混用、天与周混用）
        - 把 PV 当 EV（见 KP-0206）
        - 时差算成「两个活动工期之差」
        - 概率题忘记把标准差加减到期望值上，直接拿悲观值回答
        - 决策树忘记减去投入

        ### 例题

        某活动乐观工期 8 天、最可能 12 天、悲观 28 天。项目团队共 8 人，业主要求增加 4 名成员参与。以下两个结果正确的是：

        **第一问：期望工期与标准差**

        期望工期 = (8 + 4×12 + 28) ÷ 6 = (8 + 48 + 28) ÷ 6 = 84 ÷ 6 = **14 天**

        标准差 = (28 − 8) ÷ 6 = 20 ÷ 6 ≈ **3.33 天**

        **第二问：沟通渠道增加数**

        原 8 人：8 × 7 ÷ 2 = 28 条
        增到 12 人：12 × 11 ÷ 2 = 66 条
        增加 **38 条**

        **三个常见错法**：期望值算成 (8+12+28)÷3 = 16（那是简单平均，不是 PERT）；标准差算成 (28−8)÷2 = 10（除错了分母）；沟通渠道只算新增 4 人内部的 6 条（漏掉新人与老人的交叉渠道）。

        顺带一句判断：团队从 8 人增到 12 人，渠道增加 38 条远超原有 28 条，这就是「加人反而更慢」的算术依据——布鲁克斯定律的量化来源。

        ### 怎么考

        **上午卷计算题固定 1 到 3 道**，考法极其稳定：三点估算、沟通渠道、挣值、关键路径、净现值、决策树轮换出现。

        **答题纪律三条**：先写公式再代数字（部分分靠这个）、单位写在结果后面、算出多个结果时按题号分行写清。

        **判断题**常考：资源平滑是否延长工期、动态与静态回收期的大小关系、标准差越小说明风险越大还是越小（越小说明估算越集中、风险越小）。

        **案例题**里计算常作为一小问出现，例如「计算当前 SPI 与 CPI 并判断状态」。这类小问必须拿满，因为它是客观给分，不依赖文字表述。

        **一层容易漏的**：三点估算里「最可能」的权重是 4，不是平均值参与。很多人习惯性除以 3，这是最普遍的错，且一旦错，后面基于期望值的概率题全错。

  - id: KP-0602
    module_id: S6
    parent: null
    name: 关键路径与网络图
    ref: "第11章"
    note:
      summary: 关键路径是网络图里最长的一条路，路径上总时差为零，压缩工期只能压关键活动。
      body: |-
        ### 要素

        **两种网络图必须先分清**：

        | 类型 | 表示方式 | 简称 |
        | --- | --- | --- |
        | 单代号网络图 | 节点表示活动，箭线表示逻辑关系 | AON |
        | 双代号网络图 | 箭线表示活动，节点表示事件 | AOA |

        **双代号里有「虚活动」**：只表示逻辑关系，**不消耗时间也不消耗资源**，用虚箭线表示，作用是把两条并行路径的依赖关系表达清楚。问「虚活动的工期是多少」，答 0。

        **四个时间参数与算法**：

        - ES 最早开始、EF 最早完成：EF = ES + 历时（**正推，取最大值**）
        - LS 最晚开始、LF 最晚完成：LS = LF − 历时（**逆推，取最小值**）
        - 总时差 TF = LS − ES = LF − EF
        - 自由时差 FF = 紧后活动的最早开始最小值 − 本活动最早完成

        记忆要点：**正推取大、逆推取小**。取大是因为一个活动要等所有前置都完成才能开始；取小是因为不能拖累任何一个紧后活动。

        **关键路径的两条等价定义**：

        1. 从起点到终点**历时最长**的路径
        2. 路径上所有活动的**总时差为 0**

        两个定义互为验证。关键路径**可能不止一条**，这一点常被忽略——如果两条路径历时相同，两条都是关键路径。

        **关键路径会变化**，这是最需要理解的动态性质：非关键路径上的活动延误，一旦超过它的总时差，这条路径就变成新的关键路径，原关键路径随之失去关键地位。

        **压缩工期的三条限制**：

        - 只能压**关键活动**，压非关键活动对总工期没用
        - 压到一定程度会出现**关键路径转移**，继续压原来那条不再缩短总工期
        - 压缩有代价：赶工增加成本，快速跟进增加返工风险

        ### 例题

        某项目活动及依赖关系如下：A 历时 3 天；B 历时 4 天，紧前 A；C 历时 2 天，紧前 A；D 历时 5 天，紧前 B 与 C；E 历时 3 天，紧前 D。求关键路径、总工期，以及 C 的总时差与自由时差。

        **第一步，列出所有路径**：

        - 路径一：A → B → D → E = 3 + 4 + 5 + 3 = **15 天**
        - 路径二：A → C → D → E = 3 + 2 + 5 + 3 = **13 天**

        最长的是路径一，所以**关键路径是 A-B-D-E，总工期 15 天**，A、B、D、E 的总时差都是 0。

        **第二步，算 C 的时差**：

        ES(C) = 3（A 完成时），EF(C) = 3 + 2 = 5
        D 的最晚开始 LS(D) = LF(D) − 5，而 LF(D) = LS(E) = 15 − 3 = 12，所以 LS(D) = 7
        LS(C) = LS(D) − 2 = 7 − 2 = 5
        **总时差 TF(C) = LS(C) − ES(C) = 5 − 3 = 2 天**

        **自由时差 FF(C) = ES(D) − EF(C) = 7 − 5 = 2 天**

        两者的含义不同：C 可以晚 2 天开始而不影响总工期（总时差），且晚 2 天也**不影响 D 的最早开始**（自由时差）。此题两者恰好相等，但一般不等。

        **三个常见错法**：把关键路径当成「活动最多的路径」（应看历时之和）；把总时差算成「本活动工期减去最短路径」（没有这个概念）；忘记 D 有两个紧前，导致漏算路径二。

        ### 怎么考

        **上午卷必考一到两道**，形式固定：给活动表求关键路径、总工期、某活动的总时差或自由时差、压缩某活动后的工期变化。

        **判断题**常见三句：
        - 「关键路径只有一条」——错，可能多条
        - 「压缩任何活动都能缩短工期」——错，只能压关键活动
        - 「虚活动消耗资源但不耗时」——错，两个都不消耗

        **案例题**里的用法是「工期延误分析」：某活动延误 5 天，是否影响总工期？判断方法就是拿延误天数与它的总时差比较——小于等于总时差不影响，大于才影响，超出部分顺延。

        **一层容易漏的**：自由时差与总时差不等时，**总时差大的活动更安全**。因为总时差是与终点挂钩的余量，自由时差只与紧后活动挂钩。答题时若只写一个，写总时差更有说服力。

  - id: KP-0603
    module_id: S6
    parent: null
    name: 英文专业术语
    ref: "全篇"
    note:
      summary: 英文题只考术语对应关系，把高频缩写与全称对上号就够，不考语法也不考长句理解。
      body: |-
        ### 要素

        **英文题的真实难度很低**：题面通常是一句定义或一个场景，四个选项是术语。所以准备方法是**只记对应，不背语法**。

        **五大过程组**：

        | 英文 | 中文 |
        | --- | --- |
        | Initiating | 启动 |
        | Planning | 规划 |
        | Executing | 执行 |
        | Monitoring and Controlling | 监控 |
        | Closing | 收尾 |

        **十大知识领域**（按英文首字母顺序更好记）：

        | 英文 | 中文 |
        | --- | --- |
        | Integration | 整合（整体） |
        | Scope | 范围 |
        | Schedule | 进度 |
        | Cost | 成本 |
        | Quality | 质量 |
        | Resource | 资源 |
        | Communications | 沟通 |
        | Risk | 风险 |
        | Procurement | 采购 |
        | Stakeholder | 相关方 |

        **高频缩写对照**：

        | 缩写 | 全称 | 中文 |
        | --- | --- | --- |
        | WBS | Work Breakdown Structure | 工作分解结构 |
        | PMO | Project Management Office | 项目管理办公室 |
        | CCB | Change Control Board | 变更控制委员会 |
        | EVM | Earned Value Management | 挣值管理 |
        | PV / EV / AC | Planned / Earned / Actual Value（Cost） | 计划值 / 挣值 / 实际成本 |
        | SPI / CPI | Schedule / Cost Performance Index | 进度 / 成本绩效指数 |
        | ETC / EAC | Estimate To Complete / At Completion | 完工尚需 / 完工估算 |
        | SLA | Service Level Agreement | 服务级别协议 |
        | RFP | Request for Proposal | 请求建议书 |
        | SOW | Statement of Work | 工作说明书 |
        | RACI | Responsible, Accountable, Consulted, Informed | 责任分配矩阵 |
        | UAT | User Acceptance Testing | 用户验收测试 |
        | POC | Proof of Concept | 概念验证 |
        | ROI | Return on Investment | 投资回报率 |
        | TCO | Total Cost of Ownership | 总拥有成本 |

        **角色与文档**：

        | 英文 | 中文 |
        | --- | --- |
        | Project Sponsor | 项目发起人 |
        | Steering Committee | 指导委员会 |
        | Functional Manager | 职能经理 |
        | Project Charter | 项目章程 |
        | Business Case | 商业论证 |
        | Scope Statement | 范围说明书 |
        | Risk Register | 风险登记册 |
        | Lessons Learned | 经验教训 |
        | Issue Log | 问题日志 |

        **几个最容易混的术语**：

        - **Baseline** 基线，不是「底线」
        - **Milestone** 里程碑，**工期为 0** 的检查点
        - **Float / Slack** 时差，两个词同义
        - **Crashing** 赶工（加资源），**Fast Tracking** 快速跟进（改并行）
        - **Scope Creep** 范围蔓延，指未经控制的逐步扩范围
        - **Deliverable** 可交付成果，不只是「交付物」

        ### 例题

        Which of the following best describes a document that formally authorizes the existence of a project and gives the project manager authority to apply organizational resources?

        A. Business Case
        B. Project Charter
        C. Scope Statement
        D. Work Breakdown Structure

        **答案 B。** 题干三个关键词分别是「正式授权项目存在」「授予项目经理动用组织资源的权力」——这正是 Project Charter 的定义。

        A 的 Business Case 是**立项前的可行性论证**，说明「为什么值得做」，它不授权，是章程的输入。

        C 的 Scope Statement 描述范围，是规划阶段产物，晚于章程。

        D 的 WBS 是范围分解结果，更晚。

        **做这类题的技巧**：不逐词翻译，先抓「时间定位」——这份文档出现在项目哪个阶段？章程是最早的正式文件，凡题干出现 authorize（授权）、exists（存在）这类词，基本都指向它。

        ### 怎么考

        **单选题一到两道**，考法两种：给英文定义选术语、给中文术语选英文缩写。

        **判断题**（少数年份出现英文判断）：重点看否定词与量词，如 not、all、only。**含 all 与 only 的表述通常错**，这是英文题的通用经验。

        **不考的内容要明确**：不考长句语法、不考阅读理解、不考专业文献翻译。所以不要在英文语法上耗时间，把缩写表背熟即可。

        **一层容易漏的**：答题时注意题干里的 **process group**（过程组）与 **knowledge area**（知识领域）是两个维度，选项里常把范围管理的活动与规划过程组混着放。看清问的是哪个维度再选。

  - id: KP-0604
    module_id: S6
    parent: null
    name: 案例题答题结构
    ref: "第10-14章"
    note:
      summary: 案例题得分靠结构不靠文采，按找问题、析原因、给对策、上依据四步写，每条都落到动作。
      body: |-
        ### 要素

        **案例题的分值结构**：下午卷三道案例，每题含若干小问，小问类型就五种——找问题、析原因、提措施、算指标、判是非。**同一道题里通常组合出现**。

        **四步答题骨架**：

        1. **定位**：这个问题出在哪个管理过程（点出过程名，阅卷老师按术语给分）
        2. **原因**：缺什么（缺文件、缺流程、缺角色、缺评审）
        3. **对策**：补什么、谁来做、什么时候做、做到什么程度
        4. **依据**：教材条目或规范要求（一句话即可）

        **得分点的四个特征**，写完自查：

        - **分条**：每行一个点，编号 1.2.3.，不要写成一段
        - **动宾结构**：动词开头。「建立变更控制流程」「组织需求评审」「更新范围基准」
        - **术语准确**：用教材术语，别用口语。写「未建立范围基准」而不是「没有范围标准」
        - **有量化**：写「每周例会」「不超过 2 小时响应」，比「加强沟通」得分高

        **常考领域的万能框架**，按知识领域备好即可套用：

        | 领域 | 常见问题 | 标准对策 |
        | --- | --- | --- |
        | 范围 | 需求未确认、无 WBS、范围蔓延 | 收集需求并签字确认、创建 WBS、建立变更控制 |
        | 进度 | 无进度计划、未识别关键路径、无纠偏 | 编制进度计划、识别关键路径、定期跟踪与纠偏 |
        | 成本 | 无预算、无成本基准、未做挣值分析 | 编制成本基准、用挣值监控、设储备 |
        | 质量 | 无质量标准、只做终检、无评审 | 制定质量计划、过程控制与终检结合、组织评审 |
        | 风险 | 未识别、无应对、无责任人 | 建风险登记册、做定性定量分析、定应对与责任人 |
        | 沟通 | 无机制、无记录、信息不对称 | 定沟通计划、定期例会、形成会议纪要 |
        | 采购 | 合同不清、无验收标准、无索赔管理 | 明确 SOW 与验收标准、按合同验收、建索赔流程 |
        | 相关方 | 未识别关键相关方、参与不足 | 建相关方登记册、定参与策略、定期沟通 |

        **三类高频题的答法要点**：

        - **「指出存在的问题」**：只说事实，不评价人。写「未编制项目管理计划」而不是「项目经理能力不足」
        - **「说明原因」**：往流程与制度上找，不往个人品质上找
        - **「提出改进措施」**：必须可执行，且与前文问题一一对应，不要答非所问

        **计算小问的处理**：先列公式，再代数字，写清单位，最后加一句状态判断。公式本身有分，别直接写结果。

        **时间与卷面**：先通读三题，挑最有把握的先做；每题控制在 30 分钟内；留 10 分钟检查错别字与漏答小问。**漏答小问是下午卷最大的非技术失分**。

        ### 例题

        某系统集成项目合同工期 6 个月，项目经理在启动后直接安排开发，边做边确认需求。开发中期客户提出多项新增需求，项目经理为维护关系均安排实现。项目延期 2 个月，成本超支 30%。验收时客户以部分功能与初期理解不符为由拒绝签收。请指出该项目存在的主要问题。

        **参考答案按四层写**：

        **1. 范围管理问题**
        - 未充分收集并确认需求，未形成经客户签字的需求规格说明书
        - 未创建 WBS，范围边界不清，无法判断新增需求是否属于原范围
        - 未建立变更控制流程，新增需求未经影响分析与审批即实施，形成范围蔓延

        **2. 进度与成本管理问题**
        - 未编制经批准的进度基准与成本基准，无比较依据
        - 未定期监控进度与成本偏差，未在偏差出现初期采取纠偏措施
        - 未识别关键路径，压缩与调整缺乏依据

        **3. 相关方与沟通问题**
        - 未识别关键相关方并制定参与策略，验收标准未在前期达成一致
        - 未建立定期沟通与确认机制，需求理解偏差直到验收才暴露

        **4. 收尾与验收问题**
        - 未在阶段完成时组织确认范围，未形成阶段验收记录
        - 验收标准未写入合同或需求文档，导致争议无据可依

        **这份答案为什么能得分**：每条都是「缺什么」的客观陈述；术语准确（范围基准、变更控制、确认范围）；四条对应四个知识领域，覆盖面广；没有一句在评价个人。

        ### 怎么考

        **下午卷三道案例，共 75 分的一半左右**，是及格的关键。选择题可以蒙，案例题只能靠结构。

        **失分的五类典型**：
        - 只写结论不写动作（「管理不规范」）
        - 空话套话（「加强管理」「提高认识」）
        - 不分条，一大段文字
        - 问题与对策不对应（问问题答措施）
        - 漏答小问

        **一层容易漏的**：**问「问题」时不要顺手写对策**。很多人习惯性把「应该怎么做」混进「存在什么问题」里，看似多写，实际可能不给分——因为阅卷是按小问给分的。问题归问题，措施归措施，分开写。

  - id: KP-0701
    module_id: S7
    parent: null
    name: 论文写作与素材积累
    ref: "高项论文"
    note:
      summary: 论文考的不是文笔，是能不能用教材术语把真实项目的情节写成可核对的过程。
      body: |-
        ### 要素

        **考试形态**：两道题里选一道，120 分钟，通常要求 2000 字以上，机考打字，**不得提前交卷**。
        满分 75，45 及格。三科同次全过才拿证，所以论文一票否决。

        **阅卷看三样，按要素给分**：

        1. **切题**：题目指定写哪个知识领域（或哪个过程组），正文就必须围绕它，不能泛泛而谈项目管理
        2. **结构**：摘要有、背景有、过程论述有、问题有对策、结尾有成效，缺一段就明显丢分
        3. **真实性与术语**：有具体项目情节（工期、人数、金额、指标），并且用教材术语而不是口语

        **五段骨架**：

        | 段 | 字数 | 写什么 |
        | --- | --- | --- |
        | 摘要 | 200—300 | 项目是什么、我是什么角色、这次重点写哪个领域、最终结果如何 |
        | 项目背景 | 300—400 | 建设单位、建设内容、工期、合同额、团队规模、我的职责 |
        | 过程论述 | 800—1000 | 按该领域的过程展开，每个过程写「做了什么动作 + 产出什么文档 + 遇到什么问题怎么解决」 |
        | 问题与对策 | 300—400 | 写 2—3 个真实遇到的问题，每个配一条可执行对策 |
        | 结尾 | 150—200 | 量化成效 + 一处不足 + 改进方向 |

        **素材怎么攒**（这才是真正的难点）：

        不需要准备很多项目，**一个真实项目就能覆盖全部十个领域**。
        做法是拿同一个项目，逐领域问自己五件事：这里我做了什么、产出了什么文档、
        出过什么问题、怎么解决的、结果能拿什么数字衡量。每个领域找出 1—2 个真实情节就够。

        攒够 8 个领域，考场上无论抽到哪个题目都有东西可写。

        ### 例题

        以「某市气象数据平台二期」写「范围管理」的五段提纲：

        1. **摘要**：8 个月、合同额 480 万、12 人团队，我任项目经理，重点论述范围管理，最终按期验收
        2. **背景**：市气象局委托，含数据汇聚、质控、共享服务三部分，涉及 6 个区县气象站数据接入
        3. **过程论述**：收集需求（走访 6 个区县 + 2 轮评审 → 需求规格说明书）、
           定义范围（范围说明书，明确不含硬件采购）、创建 WBS（拆到工作包、每包有责任人）、
           确认范围（分阶段验收，每阶段出验收单）、控制范围（变更日志 + CCB 审批）
        4. **问题与对策**：区县数据格式不一致导致返工 → 建立数据标准评审机制，三方签字后再开发
        5. **结尾**：需求变更次数从预估 15 次降到 7 次，验收一次通过；不足是前期调研周期偏短

        ### 怎么考

        **机考打字，120 分钟，写 2000 字以上。** 时间分配建议：读题与列提纲 15 分钟、
        正文 90 分钟、自查 15 分钟。自查只查两件事：每段是否都在本题范围内、是否有量化数字。

        **最常见的四种失分**：
        - 背范文套用，题目一换就对不上（阅卷一眼能看出模板痕迹）
        - 只有理论没有项目情节，通篇「应当加强」，没有一处「我做了什么」
        - 有情节但没有数字，读起来像编的
        - 只写顺利的部分，不写遇到的问题——而「问题与对策」这一段恰恰是区分真假项目的关键

  - id: KP-0801
    module_id: S8
    parent: null
    name: 项目、项目集与项目组合
    ref: "高项第4版 高级项目管理"
    note:
      summary: 高项在中项之上多考「一堆项目怎么组织起来管」，第一块就是区分项目、项目集、项目组合——判据是「管什么」，不是规模。
      body: |-
        ### 要素

        中项考「把一个项目管好」，高项在这之上多考「一堆项目怎么组织起来管」。
        多出来的部分主要是六块，本模块逐个讲，这是第一块、也是最基础的一块。

        **一、项目 / 项目集 / 项目组合，三者不是规模差别**

        | | 管什么 | 成功的判据 |
        | --- | --- | --- |
        | 项目 | 交付一个独特产物，有明确起止 | 按范围、进度、成本、质量交付 |
        | 项目集 | 一组**相互关联**的项目，协调管理以获得单独管拿不到的收益 | 收益实现（1+1>2） |
        | 项目组合 | 一组项目和项目集的**投资集合**，按战略优先级取舍资源 | 整体投资回报与战略一致 |

        这是最容易考错的一组概念：**项目集的核心是「收益协同」，不是「项目大」；
        项目组合的核心是「投资取舍」，不是「项目多」**。

        **二、三者是怎么叠起来的**

        自下而上一句话就能串起来：

        - **项目组合**先回答「今年的钱和人都投到哪儿」，按战略优先级排出名单；
        - **项目集**在名单里挑出相互关联的那几项，协调管理以拿到单独管拿不到的收益；
        - **项目**把其中每一项按范围、进度、成本、质量交付出来。

        所以三者的汇报节奏也不同：项目管理看**基准达成**，项目集管理看**收益实现**，
        项目组合管理看**投资回报与战略一致性**。案例题问「该往哪一层上升」时，
        看它抱怨的是「这活干不完」还是「这几件事合起来没用」还是「钱不该花在这」。

        **三、再往上就是组织级**

        三者之上还有一层：组织级项目管理（OPM）。它管的不是具体项目，
        而是「这套东西在组织里怎么长期跑得动」——组织架构、流程制度、知识管理、人才梯队。
        这一块单独成点，见 S8 的 OPM 那篇。

        ### 例题

        某集团有 40 个在建信息化项目，分属智慧城市、内部管理、数据中台三条线。
        今年预算削减 20%，需要砍掉一部分。这个决策属于哪个层面？

        答：**项目组合管理**。因为核心动作是「按战略优先级在项目之间做投资取舍」，
        不是协调某几个项目的收益（那是项目集），也不是管好单个项目（那是项目管理）。

        ### 怎么考

        **综合知识选择题里稳定出题**，辨析类为主：给你一个场景问属于项目、项目集还是组合；
        给你一段描述问体现的是哪个绩效域。

        **案例题里常作为一个追问出现**：主体问项目的进度或成本问题，
        最后一小问问「从组织级角度还应做什么」——答 OPM、项目集收益协调、组合优先级调整。

        这部分的性价比很高：概念清晰之后几乎不再错，投入远小于论文。

  - id: KP-0802
    module_id: S8
    parent: null
    name: 组织级项目管理（OPM）与 PMO
    ref: "高项第4版 高级项目管理"
    note:
      summary: OPM 管的是项目管理能力在组织里怎么长期跑得动，三个层面各有成功判据，PMO 分三种权力档。
      body: |-
        ### 要素

        **一、OPM 是什么**

        组织级项目管理（Organizational Project Management，OPM）把项目组合、项目集、
        项目这三类管理与组织的驱动因素（组织架构、文化、技术、人力资源）结合起来，
        目的是让「做项目」这件事在组织里**可重复、可度量、可改进**，而不是靠几个能人。

        分清两句话：
        - **项目管理**回答「这个项目能不能按时按预算交付」
        - **OPM** 回答「我们组织一年做一百个项目，整体能不能稳定交付」

        所以 OPM 的抓手不在项目内部，在四样东西上：**组织架构与治理**（谁决策）、
        **流程与制度**（怎么做）、**知识管理**（经验能否复用）、**人才与梯队**（人从哪来、怎么长）。

        **二、三个层面各对谁负责**

        | 层面 | 核心问题 | 成功判据 | 常见动作 |
        | --- | --- | --- | --- |
        | 项目组合管理 | 该做哪些事 | 投资回报与战略一致 | 项目清单、优先级排序、资源统筹、砍项目 |
        | 项目集管理 | 这组关联的事合起来能拿到什么 | 收益实现（1+1>2） | 收益蓝图、子项目协调、共享资源调度 |
        | 项目管理 | 这件事怎么干成 | 按基准交付 | 过程组与知识领域 |

        项目集管理有五个绩效域，注意**它和单个项目的八个绩效域不是一套**：
        **战略一致性、收益实现、干系人争取、项目集治理、生命周期管理**。
        记这五个不是为了背清单，是为了答题时能说出「这个项目集的问题出在
        收益没定义清楚，不是执行不力」——这一句就能拉开分差。

        **三、PMO 的三种类型**

        - **支持型**：给模板、给培训、给工具，不强制遵守。顾问角色，权力最小。
        - **控制型**：要求按统一流程走，有检查与考核。警察角色，权力居中。
        - **指令型**：直接管项目，项目经理向 PMO 汇报。老板角色，权力最大。

        考法是**给场景判断该建哪种**：
        - 项目各干各的、方法五花八门，但不想激化矛盾 → 支持型起步
        - 已经有一套制度要落地、要考核 → 控制型
        - 多项目严重失控、必须统一指挥 → 指令型

        答这类题不要只说类型，要带上「为什么现在只能到这一档」——直接上指令型在
        多数组织里会先撞上部门墙。

        **四、成熟度：顺序不能跳**

        成熟度模型给的是「我们现在在第几级、下一步该补什么」一个坐标。
        提升路径是固定顺序：**先标准化**（有统一做法）→ **再可度量**（能拿到数）→
        **再可控制**（偏差能被纠回来）→ **最后持续改进**（自己会优化）。

        跳步会白费：没有标准化就上度量，量出来的是各家自己的做法，不可比；
        没有度量就谈控制，控制的是感觉。这一条几乎每年都有题。

        ### 例题

        某集团 12 个信息化项目由各部门各自立项，出现三个问题：重复采购同一套中间件、
        数据标准不一致导致对接返工、年底预算削减 20% 却说不清该砍哪个。
        这三个问题分别暴露了什么？

        答：**没有一个是「某个项目经理不称职」**。
        - 重复采购 → 缺组合层面的资源统筹
        - 标准不一 → 缺组织级架构与标准治理
        - 说不清砍谁 → 缺组合层面的优先级排序

        三个问题里两个落在**组合层面**，一个落在**组织级治理**，这就是高项与中项的分界：
        中项练的是「把这个项目做好」，高项问的是「该做哪些项目、谁说了算」。

        ### 怎么考

        选择题考 PMO 类型辨析、OPM 三个层面的归属、成熟度模型的顺序。
        案例题常作为一个追问收尾：「从组织级角度还应做什么」。

        **加分点在层级递进**：每条先说「项目层没错」，再指出边界之外缺了什么。
        笼统写「管理混乱、需加强领导重视」不得分——那不是机制，是口号。

        **判据一句话**：项目层的问题往上找，找到「谁有权做这个决定」就是对的层。

  - id: KP-0803
    module_id: S8
    parent: null
    name: 项目绩效域与价值交付
    ref: "高项第4版 项目绩效域"
    note:
      summary: 绩效域从「要做出什么结果」看项目，知识领域从「管哪些方面」看，两套切法并存不替代。
      body: |-
        ### 要素

        **一、两套切法，不是替代**

        - **十大知识领域**回答「管哪些方面」——范围、进度、成本、质量、资源、沟通、风险、
          采购、干系人、整合。它是一张**分类清单**。
        - **绩效域**回答「要做出什么结果」——它描述的是一组**结果状态**。

        同一个事实能被两种方式描述：做 WBS，按领域归类属于「范围管理」，
        按结果视角看它服务于「规划」与「交付」。第 4 版教材两套都讲，**不存在谁取代谁**。

        这个区分不是文字游戏，它解释了「流程全做了但项目还是失败」这种常见现象：
        领域视角检查「有没有做」，绩效域视角追问「做出了什么」。

        **二、八个绩效域**

        1. **干系人**——干系人被有效识别并参与
        2. **团队**——团队有共同目标、能协作、能成长
        3. **开发方法与生命周期**——方法与交付节奏匹配业务
        4. **规划**——计划协调一致、可执行、能调整
        5. **项目工作**——工作被有效执行、障碍被清除
        6. **交付**——交付物被验收并产生预期价值
        7. **测量**——用数据判断进展与偏差
        8. **不确定性**——风险与模糊性被主动应对

        不要死记清单，按四组记：
        **人**（干系人、团队）— **法**（开发方法与生命周期、规划）—
        **干**（项目工作、交付）— **看**（测量、不确定性）。

        **三、十二条原则**

        勤勉、尊重和关心他人；营造协作的项目团队环境；促进干系人有效参与；聚焦于价值；
        识别、评估和响应系统交互；展现领导力行为；根据环境进行裁剪；将质量融入到过程和交付物中；
        驾驭复杂性；优化风险应对；拥抱适应性和韧性；为实现预期的未来状态而驱动变革。

        考法通常是「某做法体现了哪条原则」，场景给得很直白：
        「按项目特点删减流程」→ 裁剪；「分阶段交付先上线核心功能」→ 聚焦于价值 / 拥抱适应性；
        「识别到部门间连锁影响后调整方案」→ 响应系统交互。

        **四、价值交付系统：最容易在案例里得分的一条链**

        **项目 → 产品 → 成果 → 价值**

        - 项目产出**产品**（可交付物）
        - 产品被使用才产生**成果**（业务指标真的变了）
        - 成果带来**价值**（对组织或干系人的好处）

        这条链能回答一类高频追问：「系统上线了、验收也过了，为什么说这个项目失败？」
        因为只走到产品这一环，成果没发生——没人用、指标没变。
        **答这个比答「质量管理不到位」高一个档**，因为它指出了失败发生在哪一环。

        ### 例题

        某系统按期上线、验收通过，一年后使用率不足 10%。
        按绩效域视角，问题出在哪几环？

        答：**交付与测量两环**。
        - 交付只做到「交出可交付物」，没做到「价值被承认」
        - 测量只看进度与验收，没看使用率与业务指标

        补法也顺着链条说：交付的定义要加上「被使用」，测量要加业务指标
        （使用率、办理时长、差错率），而不是加更多的进度报表。

        ### 怎么考

        选择题：给场景问体现哪个绩效域或哪条原则；给一段描述问它属于哪种视角。
        案例题：作为「验收了但没效果」那类追问的理论依据。

        **判据一句话**：先问「这个动作产生了什么结果」，再归到结果类型，
        最后用知识领域术语写理由——**理由按领域术语给分**，只写绩效域名不给分。

  - id: KP-0804
    module_id: S8
    parent: null
    name: 信息系统治理与 IT 审计
    ref: "高项第4版 信息系统治理"
    note:
      summary: 治理管做正确的事（评估、指导、监督），管理管把事做对；审计是独立检验，最后一环是后续审计。
      body: |-
        ### 要素

        **一、治理与管理的分界（本章所有辨析题的源头）**

        | | IT 治理 | IT 管理 |
        | --- | --- | --- |
        | 回答什么 | 做正确的事 | 把事做对 |
        | 动作 | 评估（Evaluate）、指导（Direct）、监督（Monitor） | 计划、构建、运行、监控 |
        | 主体 | 董事会 / 高层治理机构 | 管理层与执行团队 |
        | 输出 | 目标、决策权归属、绩效评价 | 具体方案与运行结果 |

        一句话判据：**决定「要不要做、谁说了算、做得对不对」的是治理；
        决定「怎么把它做出来」的是管理。**

        **二、IT 治理的四个目标**

        不是「把 IT 管好」这种笼统说法，教材给的是四条：
        **与业务目标一致**、**有效利用信息与数据**、**风险可控**、**绩效可衡量**。

        四条里最常考第一条，理由是：治理存在的目的是业务价值，不是技术先进性。
        所以「技术很先进但业务用不上」这种场景，答案永远往「与业务目标一致」上写。

        **三、COBIT**

        由 **ISACA** 发布，是目前引用最多的 IT 治理框架。五大原则：

        1. **满足干系人需求**
        2. **覆盖企业端到端**
        3. **应用单一集成框架**
        4. **采用整体化方法**
        5. **区分治理与管理**

        第五条正是上面那张表的来源。复习时把这两处串起来，比单独背原则记得住。

        **四、IT 审计**

        审计是**独立**的检验活动，**独立性是它的生命线**——由被审计方自己做的检查不叫审计。
        这一句是所有审计题的前提。

        - **审计内容**两类：**总体审计**（IT 治理审计、IT 管理审计）与**专项审计**
          （信息系统生命周期审计、信息安全审计、数据审计、绩效审计）。
        - **审计流程**四阶段：**审计准备 → 审计实施 → 审计报告 → 后续审计**。
          最容易漏的是最后一环——报告交完不算完，整改要跟踪。
        - **审计方法**：访谈、检查（文档与配置）、测试（技术验证）、观察、穿行测试。

        考法常在「某做法属于哪个阶段」：收集证据 → 实施；
        出具审计意见书 → 报告；跟踪整改落实 → 后续审计。

        **五、ITSM 不是治理（容易混）**

        IT 服务管理（ITSM）管的是「IT 作为服务怎么稳定交付」，常见框架是 ITIL，
        核心是服务台、事件/问题/变更管理、SLA。它属于**管理**层。

        三者关系一句话：**治理定规则，ITSM 执行规则，审计检查规则有没有被执行。**

        顺带记一条常考辨析：**事件是已经发生的故障，问题是故障背后的根因**。
        事件要快速恢复（可以先用临时方案），问题要彻底消除（要改配置、改流程）。

        ### 例题

        某公司规定「所有投资超过 200 万的 IT 项目须经 IT 战略委员会审批」。
        这条规定属于治理还是管理？

        答：**治理**。它决定的是「什么事必须上报、决策权归谁」，
        属于指导（Direct）与监督（Monitor），不涉及具体怎么实施。

        反例对照着记：如果规定的是「超过 200 万的项目必须做 WBS 和三点估算」，
        那就是管理——它在规定怎么干。

        ### 怎么考

        选择题是主力：治理/管理辨析、COBIT 归属与原则、审计四阶段顺序、审计方法匹配、
        事件与问题的区别。
        案例题偶有「从治理角度提改进建议」，答「建立 IT 治理机构与决策机制、
        定义绩效指标、开展定期审计与整改跟踪」比答「加强管理」具体得多。

        **判据一句话**：问「谁有权决定」是治理，问「怎么执行」是管理，
        问「有没有按规矩做」是审计。

  - id: KP-0805
    module_id: S8
    parent: null
    name: 项目管理科学基础（运筹与工程经济）
    ref: "高项第4版 项目管理科学基础"
    note:
      summary: 高项相对中项独有的一章，也是案例计算题的主要来源——决策树 EMV、净现值与回收期、盈亏平衡，公式固定但过程要给分。
      body: |-
        ### 要素

        这一章是高项相对中项**独有**的，而且是案例题计算部分的来源，值得单独练。
        它的特点是：**概念不难，但必须动手算过一遍**，光看不练考场上会卡在第一步。

        **一、决策树与期望货币值（EMV）**

        ```
        EMV = Σ（每种结果的概率 × 该结果的损益）
        ```

        画法从左往右：**决策节点（方块）→ 方案分支 → 机会节点（圆圈）→ 结果分支**。
        决策规则：收益型选 EMV 最大，成本型选 EMV 最小。

        一个容易错的地方：**沉没成本不参与决策**。已经花掉的钱属于历史，
        决策只看未来现金流。题目里故意给「已投入 80 万」这种数字就是来考这一条的。

        **二、资金时间价值**

        | 指标 | 公式含义 | 判据 |
        | --- | --- | --- |
        | 净现值 NPV | Σ [ CFt ÷ (1+i)^t ] − 初始投资 | **NPV > 0 才值得做** |
        | 内部收益率 IRR | 让 NPV = 0 的折现率 | **IRR > 基准收益率才值得做** |
        | 投资回收期 | 累计净现金流由负转正所需年数 | 越短越好，且要小于可接受上限 |

        回收期的算法是固定的：**逐期累加，找到变号那一年，用「上年累计的绝对值 ÷ 当年现金流」
        算出小数部分**。静态回收期不考虑折现，动态回收期先折现再累加——
        题目问哪个就按哪个算，两个答案不同，看清题。

        NPV 与 IRR 的关系值得单独记一句：**NPV 是「赚多少绝对值」，IRR 是「赚的速率」**。
        两个方案互斥时以 NPV 为准（因为 NPV 直接对应价值增量），
        IRR 高但规模小的方案未必更划算。

        **三、盈亏平衡分析**

        ```
        盈亏平衡产量 Q = 固定成本 ÷ (单价 − 单位变动成本)
        ```

        分母「单价 − 单位变动成本」叫**边际贡献**，是这一节的题眼。

        它能回答两类问题：产量到多少才不亏；降价到什么程度还有得做。
        **如果边际贡献 ≤ 0，产量再大也亏，直接不做**——这个判断比算数更重要，
        案例题里常埋一个「降价后边际贡献变负」的坑。

        **四、线性规划与网络优化**

        线性规划是「在资源约束下让目标最大或最小」，解法有图解法与单纯形法。
        案例里出现时通常只要求你**列出目标函数与约束条件**，不要求求解——
        把「要最大化什么」写成一行、「每个资源约束」写成一行，分就拿到了。

        网络计划优化（工期—成本优化、资源均衡）在进度那一块已经练过，
        这里只多一层运算量，方法不变。

        **五、其他分支：记「问题形态 → 方法」**

        | 问题形态 | 方法 |
        | --- | --- |
        | 资源有限、要最优配置 | 线性规划 |
        | 多阶段依次决策 | 动态规划 |
        | 排队等待、定服务能力 | 排队论 |
        | 双方策略互相影响 | 博弈论 |
        | 最短路径、最小生成树 | 图论 |

        选择题考的就是这张表的匹配，不考推导。**所以背对应关系，别背公式。**

        ### 例题

        某方案投入 100 万，三种市场情形：好的概率 0.3 收益 300 万；
        中的概率 0.5 收益 120 万；差的概率 0.2 收益 20 万。EMV 是多少，值不值得做？

        答：EMV = 0.3×300 + 0.5×120 + 0.2×20 = 90 + 60 + 4 = **154 万**；
        减投入 100 万，**净期望收益 54 万 > 0，值得做**。

        注意答题写两步：**先算毛 EMV，再减投入**。
        很多人只写 154 就下结论，理由不完整——按步骤给分的题，跳步就是白丢分。

        ### 怎么考

        案例题：给现金流表算 NPV 或回收期，给概率损益算 EMV，给成本收入算盈亏平衡点。
        选择题：方法匹配、NPV 与 IRR 的关系、沉没成本是否参与决策。

        **判据一句话**：这类题的分都在过程。把式子写出来比只写答案得分多，
        写出「因为 NPV > 0 所以可行」比只写「可行」多一档。

  - id: KP-0806
    module_id: S8
    parent: null
    name: 组织通用治理与通用管理
    ref: "高项第4版 组织通用治理与管理"
    note:
      summary: 高项把视角从「项目」抬到「组织」——战略链条怎么走、组织架构怎么影响项目权限、知识怎么从人身上沉淀到组织。
      body: |-
        ### 要素

        **一、组织治理与战略链条**

        治理管的是组织的方向与约束，战略是它最直接的产出。这条链的顺序是固定的：

        **使命（为什么存在）→ 愿景（要成为什么）→ 战略目标（分几步走到）→
        年度经营目标 → 部门与项目目标**

        顺序不能倒，也不能跳。考法通常是「某项目目标与组织战略脱节，问题出在哪」——
        答「立项时没有战略对齐机制」，而不是「项目经理执行力不够」。
        这一答法的价值在于：它把问题定位在**上游**，而不是下游的人。

        **二、组织架构决定了项目经理的权限从哪来**

        职能型、项目型、矩阵型（弱/平衡/强）在 S1 已经讲过，这里多一层视角：

        | 架构 | 项目经理是什么角色 | 权限来源 |
        | --- | --- | --- |
        | 职能型 | 协调员 | 靠沟通，没有正式授权 |
        | 弱矩阵 | 协调员，兼做部分工作 | 靠制度给的一点授权 |
        | 平衡矩阵 | 有明确职责，但与职能经理分权 | 制度规定 |
        | 强矩阵 | 真正的管理者 | 制度授予考核权 |
        | 项目型 | 管理者，成员向项目汇报 | 直接管人与钱 |

        **弱/平衡/强三档的分界就在「谁考核项目成员」**。这一条比记名字有用得多。

        **三、组织绩效：平衡计分卡四视角**

        **财务、客户、内部流程、学习与成长**。
        它要回答的问题是「不能只看财务数字」——财务是结果，其余三个是原因。
        案例题里问「怎么评价这套系统的价值」，用四个视角展开比只答「看收益」完整。

        **四、知识管理：显性、隐性与 SECI**

        两类知识：
        - **显性知识**：能写下来的——文档、规范、模板
        - **隐性知识**：在人心里的——经验、直觉、手感

        隐性知识怎么变成显性，是知识管理的核心问题。常用的四步（SECI 模型）：

        | 步骤 | 名字 | 在做什么 |
        | --- | --- | --- |
        | 1 | **社会化** | 人与人待在一起，靠观察和模仿传经验 |
        | 2 | **外化** | 把经验说出来、写下来，变成可复用的文档 |
        | 3 | **组合化** | 把零散文档整理成体系、规范、模板库 |
        | 4 | **内化** | 别人学完变成自己的能力，再去实践 |

        判据要记牢：
        - 「老员工带新人」→ 社会化（也在做内化）
        - 「把经验写成 SOP」→ 外化
        - 「把各部门文档整合成一套规范」→ 组合化
        - 「新人照 SOP 练熟并改进」→ 内化

        **四步里外化最关键**——它决定经验能不能离开人。而组织里最缺的往往正是这一步。

        **五、组织通用管理**

        人力资源（选、育、用、留）、流程管理（流程分级与优化）、市场营销（考得浅，认得即可）。
        这三块在高项里分量不大，选择题偶尔出现。

        ### 例题

        某公司项目做完就散，下一次同类项目又从头踩一遍坑。按知识管理看，缺的是哪一步？

        答：**缺外化，连带缺组合化**。经验留在个别人身上（隐性），没有写成可复用的文档；
        即使写了也没整理成模板库，下次没人找得到。

        补法要说成机制而不是态度：「项目收尾强制产出经验教训、经模板化后入知识库，
        并在下一次立项时必须检索引用」——**能被检查的才算机制**。

        ### 怎么考

        选择题考知识管理四步辨析、战略链条顺序、平衡计分卡四视角、
        组织架构与项目权限的对应。案例题里是「如何提升组织能力」那类追问的答案来源。

        **判据一句话**：这一章考的几乎都是「对应关系」——
        背概念没用，要能说出「A 决定了 B」的那条线。

  - id: KP-0807
    module_id: S8
    parent: null
    name: 新一代信息技术与数字化转型
    ref: "高项第4版 信息化发展"
    note:
      summary: 高项第 1—2 章比中项更深，但考的是「这是什么、解决什么问题、属于哪一层」，不需要懂原理。
      body: |-
        ### 要素

        先把定位说清：这块**考的是「认得并能对应」，不是「懂原理」**。
        题目几乎都是「某场景该用什么技术」「某技术属于哪一层」，不会让你推导算法。

        **一、新一代信息技术的主干**

        | 技术 | 一句话说清是什么 | 考点常在 |
        | --- | --- | --- |
        | 大数据 | 数据量大到常规工具处理不了，需要新的采集—存储—计算体系 | 5V：体量、速度、多样、价值、真实性 |
        | 云计算 | 把计算资源变成按需取用的服务 | IaaS（给机器）/ PaaS（给平台）/ SaaS（给软件） |
        | 物联网 | 让物理世界的东西能感知、能联网、能被控 | 三层：感知层、网络层、应用层 |
        | 区块链 | 多方共同维护、不可篡改的分布式账本 | 去中心化、共识机制、智能合约、可追溯 |
        | 人工智能 | 用数据训练模型完成识别、预测、生成等任务 | 判别式 vs 生成式、大模型 |
        | 数字孪生 | 给物理实体造一个实时同步的数字镜像 | 仿真、预测性维护 |

        **分层的判据特别好用**：
        - 问「部署在哪儿」→ 看云的三层
        - 问「数据从哪来」→ 看物联网三层
        - 问「多方之间怎么建立信任」→ 区块链
        - 问「怎么从历史数据里预测」→ AI

        云三层再补一句区分：**IaaS 给的是机器和网络（你自己装系统），
        PaaS 给的是运行环境（你只管写和部署应用），SaaS 给的是能直接用的软件。**
        判据是「边界停在哪一层」。

        **二、新型基础设施的三类**

        - **信息基础设施**：网络、算力、数据（5G、数据中心、算力中心）
        - **融合基础设施**：传统基础设施 + 数字化改造（智慧交通、智慧能源）
        - **创新基础设施**：科研平台、产业创新平台

        归类题的关键是**看它是不是「改造了某个传统领域」**：
        「某市建城市大脑」→ 融合基础设施（它服务的是城市运行，不是纯算力供给）；
        「某地建智算中心」→ 信息基础设施。

        **三、数字化转型**

        它不是「上系统」，是三件事：**数据驱动决策**、**业务流程重构**、**组织与能力匹配**。

        只上系统不改流程，常见结果就是「系统上线了，人还按老办法干」——
        这正好可以和绩效域那篇的「价值交付链条」串起来答案例：
        产品有了，成果没发生。**这种跨章串联是案例题拿高分的地方。**

        **四、信息系统服务管理（顺带认得）**

        ITSM / ITIL：服务台、事件管理、问题管理、变更管理、配置管理、SLA。

        常考辨析：**事件是已经发生的故障，问题是故障背后的根因**。
        事件要快速恢复（可以先用临时方案顶住），问题要彻底消除（要改配置、改流程、改设计）。
        大量组织只做事件不做问题，所以同样的故障反复发生——这个判断在案例题里很好用。

        ### 例题

        某政务平台要接 20 个委办局的数据，各方互不信任、又都要留存证据备查，
        且有跨部门核验的需求。用哪种技术解决「信任与留痕」这一块？

        答：**区块链**。判据是「多方参与 + 互不信任 + 需要不可篡改的留痕」，
        这正是分布式账本要解决的问题。

        但要说清边界：**它解决的是信任与存证，不解决数据质量与标准**——
        后者要靠数据治理。两者不能互相替代，这一点说出来才是完整的答案。

        ### 怎么考

        选择题是主力：技术归类、云三层与 IoT 三层的归属、新基建三类归类、
        事件与问题的区别。
        案例题里常作为「建议采用什么技术、为什么」的一小问。

        **判据一句话**：答这类题说清「这个技术解决哪一类问题」就够了。
        往上堆原理名词不加分，写错还会扣。


question_policy:
  source_policy: [ai, web, manual]
  per_kp_min: 3
  types: [单选, 多选, 判断, 实操]
  # 每个 kp 至少 1 道非选择题（判断/实操），否则诊断会退化成"认题"
  require_open_question_per_kp: true

# ── 示例题（12 道，用于验证链路，不是完整题库）────────────────
# 字段对齐现有 practice_questions 表，导入时无需转换
#
questions:
  - id: RK-S1-001
    module_id: S1
    kp_id: KP-0101
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: easy
    level: 1
    title: 项目与运营的区别
    body_md: |
      下列关于项目与运营的说法，正确的是？
    options:
      - 项目具有临时性和独特性，运营是持续重复的
      - 项目是持续性的，运营是临时性的
      - 项目不需要明确目标，运营需要
      - 项目和运营都由同一套组织流程管理，无区别
    answer: "A"
    explanation_md: |
      项目的两个本质特征是**临时性**（有明确起止）和**独特性**（产出物唯一）。运营是持续、重复、以维持业务为目的。这是全书最基础的一对概念，后续所有过程组都建立在这个区分上。
    source: manual

  - id: RK-S1-002
    module_id: S1
    kp_id: KP-0102
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 2
    title: 五大过程组的逻辑关系
    body_md: |
      关于五大过程组，下列说法错误的是？
    options:
      - 启动过程组的输出之一是项目章程
      - 五大过程组在项目生命周期中会重复出现
      - 五大过程组必须严格按顺序执行，前一阶段不结束不能进入下一阶段
      - 收尾过程组可能出现在项目的每个阶段末
    answer: "C"
    explanation_md: |
      五大过程组是**逻辑分组**，不是时间顺序。它们在实际项目中高度交叠、循环往复——监控过程组贯穿全程，收尾在每个阶段末都会发生。选 C 的错误在于把逻辑分组当成了瀑布式时序。
    source: manual

  - id: RK-S2-001
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 挣值分析：进度偏差的含义
    body_md: |
      某项目 EV=800，PV=1000，AC=900。关于该项目当前状态，正确的是？
    options:
      - 进度超前，成本节约
      - 进度落后，成本超支
      - 进度落后，成本节约
      - 进度超前，成本超支
    answer: "B"
    explanation_md: |
      SV = EV − PV = 800 − 1000 = **−200**，小于 0 ⇒ 进度落后。CV = EV − AC = 800 − 900 = **−100**，小于 0 ⇒ 成本超支。记忆锚点：SV 看进度、CV 看成本，两个都是「EV 减后面那个」。
    source: manual

  - id: RK-S2-002
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 3
    title: 挣值分析：完整指标计算
    body_md: |
      某项目当前状态：EV=800 万元，PV=1000 万元，AC=900 万元，BAC=2000 万元。

      请计算并写出过程：
      1. 进度偏差 SV、成本偏差 CV
      2. 进度绩效指数 SPI、成本绩效指数 CPI
      3. 按当前绩效预测完工估算 EAC（用 CPI 法）
      4. 逐项判断进度与成本状态
    options: []
    answer: "SV=-200万元（进度落后）；CV=-100万元（成本超支）；SPI=0.8；CPI≈0.889；EAC=BAC/CPI≈2250万元"
    explanation_md: |
      1. SV = EV − PV = 800 − 1000 = −200（<0 进度落后）
      2. CV = EV − AC = 800 − 900 = −100（<0 成本超支）
      3. SPI = EV / PV = 800 / 1000 = 0.8
      4. CPI = EV / AC = 800 / 900 ≈ 0.889
      5. EAC = BAC / CPI = 2000 / 0.889 ≈ **2250 万元**（按当前成本绩效外推，完工要多花 250 万）

      **给分点**：每项写公式 + 代值 + 结论。案例题只写数字不写过程会大量丢分，这是最常见的失分原因。
    source: manual

  - id: RK-S2-003
    module_id: S2
    kp_id: KP-0207
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: medium
    level: 3
    title: 变更管理流程
    body_md: |
      项目执行中，客户提出一项范围变更。请按标准流程写出处理步骤（不少于 5 步）。
    options: []
    answer: "提出变更申请 → 分析变更影响（范围/进度/成本/质量）→ 提交 CCB 审批 → 批准后更新相关计划与基准 → 实施变更 → 验证并记录 → 通知干系人"
    explanation_md: |
      关键是要出现 **CCB（变更控制委员会）审批** 和 **更新基准** 两步，这两步是判分核心。
      常见错误：直接从"客户提出"跳到"开始改"，跳过影响分析和审批——这在真实项目里就是范围失控的起点。

      对照你自己的项目想一遍：上次客户临时加需求，有没有走完这个流程？
    source: manual

  - id: RK-S3-001
    module_id: S3
    kp_id: KP-0302
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 2
    title: 云计算三层服务模型
    body_md: |
      用户只需管理自己的应用和数据，操作系统及以下由云服务商负责。这属于哪种服务模型？
    options:
      - IaaS
      - DaaS
      - SaaS
      - PaaS
    answer: "D"
    explanation_md: |
      判断口诀——**看操作系统归谁管**：
      IaaS = 只给基础设施（虚拟机/存储/网络），操作系统以上自己管；
      PaaS = 平台也给，操作系统和运行时由服务商管，用户只管应用和数据；
      SaaS = 连应用都是别人的，用户只管用。

      本题「操作系统由服务商负责、用户管应用和数据」⇒ PaaS。
    source: manual

  - id: RK-S3-002
    module_id: S3
    kp_id: KP-0308
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: easy
    level: 1
    title: 网络安全等级保护分级
    body_md: |
      我国网络安全等级保护制度将信息系统分为几个安全保护等级？
    options:
      - "3 级"
      - "4 级"
      - "5 级"
      - "6 级"
    answer: "C"
    explanation_md: |
      等保分为**五级**，从第一级（自主保护）到第五级（专控保护），级别越高监管越严。
      政务类系统通常要求三级及以上——这一条和你手上的数据空间项目直接相关，甲方验收会查等保测评报告。
    source: manual

  - id: RK-S3-003
    module_id: S3
    kp_id: KP-0306
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 2
    title: 数据治理与数据管理的区别
    body_md: |
      下列关于数据治理与数据管理的说法，正确的是？
    options:
      - 数据治理是决策权与问责机制的安排，数据管理是具体执行活动
      - 两者是同义词，可以互换使用
      - 数据管理层次高于数据治理
      - 数据治理只关注数据质量
    answer: "A"
    explanation_md: |
      **治理管"谁来决定、谁负责"，管理管"具体怎么做"。**
      类比：治理是董事会定规则，管理是部门按规则干活。数据中台项目里最容易出的问题就是只有管理动作、没有治理机制，
      结果各部门口径不一致，对不上数。
    source: manual

  - id: RK-S4-001
    module_id: S4
    kp_id: KP-0402
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: medium
    level: 1
    title: 信息系统监理的职责范围
    body_md: |
      信息系统工程监理的"四控两管一协调"中，"四控"指的是？
    options:
      - 质量、进度、投资、安全
      - 范围、进度、成本、质量
      - 质量、进度、合同、信息
      - 投资、质量、风险、变更
    answer: "A"
    explanation_md: |
      四控 = **质量、进度、投资、安全**；两管 = 合同管理、信息管理；一协调 = 组织协调。
      注意别和项目管理的"范围/进度/成本/质量"搞混——那是项目管理的四要素，监理的四控里是**投资和安全**，不是范围和成本。
    source: manual

  - id: RK-S5-001
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: hard
    level: 2
    title: 招标投标中的法律性质
    body_md: |
      根据《招标投标法》，中标通知书的法律性质是？
    options:
      - 要约邀请
      - 要约
      - 承诺
      - 意向书
    answer: "C"
    explanation_md: |
      三方链条要记牢：
      **招标公告 = 要约邀请**（请别人来报价）
      **投标文件 = 要约**（正式报价）
      **中标通知书 = 承诺**（接受报价，合同成立）
      这条几乎年年考，也是最容易记反的一组。
    source: manual

  - id: RK-S6-001
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 单选
    difficulty: easy
    level: 1
    title: 英文专业术语（EVM）
    body_md: |
      In project management, "EVM" stands for:
    options:
      - Earned Value Management
      - Enterprise Value Management
      - Estimated Value Method
      - Evaluation and Verification Model
    answer: "A"
    explanation_md: |
      EVM = **Earned Value Management**（挣值管理）。英文题只考术语原义，不考语法。
      备考方式：把十大知识领域、五大过程组的英文对照表过一遍即可，5 道题能拿 3-4 分就是赚的。
    source: manual

  - id: RK-S6-002
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 实操
    difficulty: hard
    level: 4
    title: 案例题答题结构训练
    body_md: |
      某项目进度严重滞后，客户投诉频繁，团队加班严重但产出不增。
      请从项目管理角度分析存在的问题，并提出改进建议。

      要求：问题不少于 4 条，建议必须与问题一一对应。
    options: []
    answer: "问题可从范围/进度/质量/沟通/资源五个方面拆解；建议须一一对应，且要写出具体动作，不能只写「加强管理」"
    explanation_md: |
      **答题结构**（这类题有固定套路，练模板比练知识更有效）：
      1. 先分类，不要一锅端——范围、进度、成本、质量、资源、沟通、风险，逐项扫
      2. 每条问题写成「现象 + 对应管理过程缺失」，例如：
         「加班多但产出不增 ⇒ 进度计划未做资源平衡，未识别关键路径」
      3. 建议必须与问题**一一对应**，且是具体动作：
         ✗「加强进度管理」 → ✓「重排 WBS，识别关键路径，对非关键任务削减投入」
      4. 字数控制：问题 4-5 条、建议 4-5 条，宁少勿滥

      **失分点**：只写问题不写建议、建议与问题不对应、写大词不写动作。
    source: manual

  # ── 第一批补题（2026-10-27）：S1 补齐到每层 3 题 ──────────────
  - id: RK-S1-003
    module_id: S1
    kp_id: KP-0103
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: easy
    level: 1
    title: 十大知识领域：范围管理
    body_md: |
      十大知识领域中，负责「确保项目包含且仅包含成功完成项目所需的工作」的是？
    options:
      - 范围管理
      - 进度管理
      - 质量管理
      - 整合管理
    answer: "A"
    explanation_md: |
      范围管理管的是「做什么、不做什么」，核心产出是需求文件与 WBS。
      进度管理管「什么时候做完」，质量管理管「合格不合格」，整合管理管「各条线怎么拧成一股」。
    source: manual

  - id: RK-S1-004
    module_id: S1
    kp_id: KP-0105
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: easy
    level: 1
    title: 项目经理的核心作用
    body_md: |
      关于项目经理在项目中的核心作用，下列描述最准确的是？
    options:
      - 通过整合资源、协调干系人，达成项目目标
      - 完成技术方案设计与关键代码实现
      - 监督团队成员的考勤与日常纪律
      - 签署项目涉及的全部合同
    answer: "A"
    explanation_md: |
      项目经理的核心是**整合**——把不同专业、不同部门、不同利益的人组织起来达成目标。
      技术方案由技术负责人做，合同签署通常由授权代表或商务负责，考勤属于职能管理。
    source: manual

  - id: RK-S1-005
    module_id: S1
    kp_id: KP-0101
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 2
    title: 衡量项目成功的标准
    body_md: |
      关于衡量项目是否成功，下列说法最正确的是？
    options:
      - 只要在预算内完成就算成功
      - 团队没有加班就算成功
      - 在范围、进度、成本、质量等约束下达成目标，并使关键干系人满意
      - 交付的功能数量越多越成功
    answer: "C"
    explanation_md: |
      项目成功不等于「没超预算」。传统三约束（范围 / 进度 / 成本）之外还要看质量与干系人满意度——
      交付物再准时，如果客户不用、不认，项目仍然失败。这一条在案例题里经常作为失分点出现。
    source: manual

  - id: RK-S1-006
    module_id: S1
    kp_id: KP-0102
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 2
    title: 项目章程的归属与作用
    body_md: |
      项目章程在哪个过程组制定？它的核心作用是什么？
    options:
      - 启动过程组；正式授权项目存在，并授权项目经理动用组织资源
      - 规划过程组；确定详细的项目范围
      - 执行过程组；给团队成员分配具体任务
      - 监控过程组；控制变更是否被批准
    answer: "A"
    explanation_md: |
      项目章程属于**启动过程组**，是项目的「出生证明」，同时是项目经理的「授权书」。
      因为它要授权项目经理，所以不能由项目经理自己签发——这是判断题的高频陷阱。
    source: manual

  - id: RK-S1-007
    module_id: S1
    kp_id: KP-0104
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 3
    title: 职能型组织里的项目经理
    body_md: |
      在职能型组织中，项目经理通常扮演什么角色？
    options:
      - 对项目成员拥有完全指挥权
      - 与职能经理权限完全相同
      - 直接管理项目预算与人员绩效
      - 协调员或联络员，主要靠沟通推动，对资源没有直接控制权
    answer: "D"
    explanation_md: |
      职能型组织里，资源与考核都在职能经理手上，项目经理只能「协调」。
      这也是为什么职能型组织下项目经理常常「责任大、权力小」——这个矛盾是案例题的常客。
    source: manual

  - id: RK-S1-008
    module_id: S1
    kp_id: KP-0104
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 3
    title: 项目型组织的特点
    body_md: |
      与职能型组织相比，项目型组织的主要特点是？
    options:
      - 项目经理权力最小，由职能经理主导
      - 不需要设置项目管理办公室
      - 资源可以在多个项目之间高效共享
      - 项目经理拥有最大权限，但团队成员在项目结束后需要重新安置
    answer: "D"
    explanation_md: |
      项目型组织里，人和资源都归项目，项目经理权力最大，代价是**资源利用率低**——
      项目一结束，团队就要重新找归属。这正好和职能型组织的优缺点互为镜像，常成对考。
    source: manual

  - id: RK-S1-009
    module_id: S1
    kp_id: KP-0103
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 3
    title: 把高层需求拆成工作包属于哪个领域
    body_md: |
      某项目需要把客户的概括性需求逐层分解为可管理、可估算的工作包。这个动作属于哪个知识领域？
    options:
      - 范围管理
      - 进度管理
      - 资源管理
      - 质量管理
    answer: "A"
    explanation_md: |
      逐层分解形成 WBS（工作分解结构），是**范围管理**的核心工具。
      容易混的是进度管理——进度管理用的是 WBS 的产物（工作包）来排活动，但「拆 WBS」这一步属于范围。
    source: manual

  - id: RK-S1-010
    module_id: S1
    kp_id: KP-0104
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: hard
    level: 4
    title: 从资源申请方式反推组织结构
    body_md: |
      某公司项目经理要为本项目申请一名测试工程师，必须向测试部经理提出申请、由测试部经理安排人员，
      且项目经理无权考核该成员的绩效。这最可能是什么组织结构？
    options:
      - 项目型
      - 强矩阵型
      - 职能型
      - 复合型
    answer: "C"
    explanation_md: |
      判据是「资源怎么来、考核在谁手上」：要**申请**、且**无权考核** ⇒ 资源完全在职能经理手里 ⇒ 职能型。
      强矩阵里项目经理对资源有实质调配权，不需要逐次申请；项目型里人本来就归项目。
    source: manual

  - id: RK-S1-011
    module_id: S1
    kp_id: KP-0105
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: hard
    level: 4
    title: 关键干系人不参与怎么办
    body_md: |
      项目进入执行阶段，一名关键干系人（业务部门负责人）始终不参加需求评审，导致需求反复变更。
      项目经理首先应该做的是？
    options:
      - 把该干系人从干系人名单中剔除
      - 先按现有需求开发，出了问题再说
      - 直接上报高层投诉其不配合
      - 识别其对项目的影响与真实诉求，制定针对性的沟通策略
    answer: "D"
    explanation_md: |
      干系人管理的顺序是「识别 → 分析（权力 / 利益）→ 制定策略 → 执行」。跳过分析直接上手段，
      无论是剔除、上报还是硬推，都是把症状当原因。
      案例题里，凡是「首先应该做什么」，答案几乎都落在识别与分析这一步。
    source: manual

  - id: RK-S1-012
    module_id: S1
    kp_id: KP-0102
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: hard
    level: 4
    title: 判断工作落在哪个过程组
    body_md: |
      团队正在制定 WBS、估算工期与成本、识别风险，并汇总形成项目管理计划。这些工作属于哪个过程组？
    options:
      - 启动
      - 规划
      - 执行
      - 监控
    answer: "B"
    explanation_md: |
      「制定计划类」的工作都在**规划过程组**：范围、进度、成本、风险各条线的计划都在这里生成，
      最后整合成项目管理计划。判断口诀：还在「想清楚要怎么做」= 规划；已经「动手做」= 执行。
    source: manual

  - id: RK-S1-013
    module_id: S1
    kp_id: KP-0103
    category: 中项·S1 项目管理框架
    type: 实操
    difficulty: hard
    level: 5
    title: 十大知识领域落回自己的项目
    body_md: |
      从十大知识领域中挑 4 个，各写出你手上某个真实项目在对应领域的一项**具体产出物**。

      要求：不要写「范围管理计划」这类空名，要写实际的东西，例如「需求清单 37 条，含优先级」。
    options: []
    answer: "四个领域各自的真实产出物；每条都能看出具体内容；能对应回知识领域"
    explanation_md: |
      这道题的目的不是背十大领域，而是**把你项目里已有的东西挂到标准框架上**。
      例如：范围 →「需求清单 37 条带优先级」；进度 →「甘特图，含 5 个里程碑」；
      风险 →「风险登记册 12 条，3 条高」；沟通 →「周报 + 双周评审会」。

      凡是写不出来的领域，就是你项目里真实缺失的管理动作——这比背书有用得多。
    source: manual

  - id: RK-S1-014
    module_id: S1
    kp_id: KP-0101
    category: 中项·S1 项目管理框架
    type: 实操
    difficulty: hard
    level: 5
    title: 用自己项目解释「渐进明细」
    body_md: |
      举一个你项目里「渐进明细」的例子：开始时以为什么、后来明确成什么、是什么触发了这次细化。
    options: []
    answer: "有初始的粗略判断；有明确化之后的具体结果；说清了触发细化的原因"
    explanation_md: |
      合格答案的样子：立项时以为「就是做一个数据看板」，做完需求调研才发现要对接三个部门的异构数据源，
      范围从「一个页面」变成「一套数据接入 + 治理 + 展示」，触发点是需求评审时发现口径对不上。

      不合格的答案：把「渐进明细」的定义再解释一遍，不落到自己的项目。
      这题考的是「能不能用概念解释经验」，正是案例题的核心能力。
    source: manual

  - id: RK-S1-015
    module_id: S1
    kp_id: KP-0105
    category: 中项·S1 项目管理框架
    type: 实操
    difficulty: hard
    level: 5
    title: 没有人事权怎么推动跨部门
    body_md: |
      你在项目中没有直接人事权，但需要推动三个部门配合。写出你会用的 3 个**具体动作**。

      要求：要能落地，不写「加强沟通」「提高意识」这类话。
    options: []
    answer: "用正式授权；建立共同利益点；用机制固化协作；保留升级路径"
    explanation_md: |
      参考方向（答到 3 条即可）：
      1. **用正式授权**：把配合事项写进项目章程或高层签发的任务书，让「配合」有出处；
      2. **找共同利益**：把项目目标翻译成对方部门的考核指标（例如帮他们减少手工报表）；
      3. **机制固化**：指定各部门接口人、固定双周接口会、把交付物写进里程碑；
      4. **保留升级路径**：明确「什么情况下升级到项目指导委员会」，而不是私下抱怨。

      这题练的正是案例题里「没有权力怎么做事」的答法——要写动作，不写态度。
    source: manual

  # ── 第一批补题（2026-10-27）：S3 补齐到每层 5 题 ──────────────
  - id: RK-S3-004
