      - 信息网络
      - 信息化人才
    answer: "A"
    explanation_md: |
      六要素：信息技术应用、信息资源、信息网络、信息技术和产业、信息化人才、信息化政策法规和标准规范。
      其中**信息技术应用**是龙头——其它要素都围绕「用起来」展开。
    source: manual

  - id: RK-S3-005
    module_id: S3
    kp_id: KP-0307
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: easy
    level: 1
    title: 系统集成不包括什么
    body_md: |
      信息系统系统集成通常不包括下列哪一项？
    options:
      - 硬件设备集成
      - 网络系统集成
      - 应用软件集成
      - 组织结构重组
    answer: "D"
    explanation_md: |
      系统集成是技术层面的整合（硬件、网络、软件、数据），组织架构调整属于管理变革，不是集成的内容。
      这条容易和「业务流程重组」混——后者是管理咨询范畴，不是系统集成。
    source: manual

  - id: RK-S3-006
    module_id: S3
    kp_id: KP-0303
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: easy
    level: 1
    title: IT 服务的生命周期
    body_md: |
      按信息技术服务标准，IT 服务的生命周期应覆盖哪几个阶段？
    options:
      - 规划设计、部署实施、服务运营、持续改进、监督管理
      - 需求分析、概要设计、详细设计、编码、测试
      - 立项、招标、实施、验收、结算
      - 采集、存储、计算、分析、展示
    answer: "A"
    explanation_md: |
      ITSS 的服务生命周期是五个阶段：规划设计 → 部署实施 → 服务运营 → 持续改进 → 监督管理。
      注意 B 是**软件开发**的生命周期，两者极易混淆——一个管「服务」，一个管「软件」。
    source: manual

  - id: RK-S3-007
    module_id: S3
    kp_id: KP-0304
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: easy
    level: 1
    title: 分层架构里的表示层
    body_md: |
      在典型的分层架构中，负责「用户交互与信息展示」的是哪一层？
    options:
      - 表示层
      - 业务逻辑层
      - 数据访问层
      - 基础设施层
    answer: "A"
    explanation_md: |
      分层架构常见三层：表示层（界面 / 交互）→ 业务逻辑层（规则 / 计算）→ 数据访问层（读写数据）。
      分层的目的把「界面变化」和「业务变化」隔开，改界面不牵动业务代码。
    source: manual

  - id: RK-S3-008
    module_id: S3
    kp_id: KP-0302
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 2
    title: 大数据 5V
    body_md: |
      大数据的「5V」特征不包括下列哪一项？
    options:
      - Volume（数据量大）
      - Velocity（产生速度快）
      - Veracity（真实性）
      - Virtualization（虚拟化）
    answer: "D"
    explanation_md: |
      5V = Volume / Velocity / Variety（多样）/ Value（价值）/ Veracity（真实性）。
      虚拟化是一种技术手段，不是大数据的特征——它常和云计算放在一起考，注意别串。
    source: manual

  - id: RK-S3-009
    module_id: S3
    kp_id: KP-0305
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 2
    title: 系统测试与验收测试的区别
    body_md: |
      关于系统测试与验收测试，下列说法正确的是？
    options:
      - 系统测试由开发方组织、对照需求规格进行；验收测试由用户方组织、对照业务需要进行
      - 两者都由开发方组织，只是阶段不同
      - 验收测试在系统测试之前进行
      - 两者没有区别，只是叫法不同
    answer: "A"
    explanation_md: |
      关键差别有两个：**谁来做**（开发方 vs 用户方）和**对照什么**（需求规格 vs 业务需要）。
      顺序上一定是系统测试在前、验收测试在后。这一组混淆是选择题的高频陷阱。
    source: manual

  - id: RK-S3-010
    module_id: S3
    kp_id: KP-0308
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 2
    title: 数字签名用的是哪把钥匙
    body_md: |
      在非对称加密体系中，数字签名的正确做法是？
    options:
      - 用发送方的私钥签名，接收方用发送方的公钥验签
      - 用发送方的公钥签名，接收方用发送方的私钥验签
      - 用对称密钥签名，双方共享同一把钥匙
      - 签名不需要密钥
    answer: "A"
    explanation_md: |
      非对称体系里一对钥匙各有分工：**私钥自己留着**、公钥公开。
      数字签名是「用私钥签、用公钥验」，解决的是**不可否认性**；而加密传输是「用对方公钥加密、对方私钥解密」，
      解决的是**机密性**。两者方向相反，这是最容易记混的一点。
    source: manual

  - id: RK-S3-011
    module_id: S3
    kp_id: KP-0305
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 3
    title: 软件测试的执行顺序
    body_md: |
      按软件测试的执行顺序，下列排列正确的是？
    options:
      - 单元测试 → 集成测试 → 系统测试 → 验收测试
      - 集成测试 → 单元测试 → 验收测试 → 系统测试
      - 系统测试 → 单元测试 → 集成测试 → 验收测试
      - 单元测试 → 系统测试 → 集成测试 → 验收测试
    answer: "A"
    explanation_md: |
      顺序的逻辑是「先小后大」：单个模块（单元）→ 模块之间（集成）→ 整个系统（系统）→ 用户验收（验收）。
      记住这条链，判断题里把「验收」放在前面的一定错。
    source: manual

  - id: RK-S3-012
    module_id: S3
    kp_id: KP-0306
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 3
    title: 数据仓库的分层顺序
    body_md: |
      典型数据仓库分层中，贴源层（ODS）之后、面向应用之前，承担「清洗与轻度汇总」的是？
    options:
      - 数据明细层（DWD）
      - 数据应用层（ADS）
      - 维度层（DIM）
      - 操作数据层（ODS）
    answer: "A"
    explanation_md: |
      常见四层：**ODS**（贴源，几乎不做加工）→ **DWD**（明细，清洗与规范化）→
      **DWS**（汇总，按主题聚合）→ **ADS**（应用，直接供报表 / 接口）。
      判断口诀：越往下越「原始」，越往上越「面向某个具体应用」。
    source: manual

  - id: RK-S3-013
    module_id: S3
    kp_id: KP-0304
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 3
    title: SOA 与微服务的区别
    body_md: |
      关于面向服务的架构（SOA）与微服务架构，下列说法最准确的是？
    options:
      - SOA 通常依赖企业服务总线做集中式集成，微服务强调去中心化、服务自治与独立部署
      - 两者完全等价，只是名字不同
      - 微服务必须使用 ESB 进行通信
      - SOA 只能用于内部系统，微服务只能用于互联网系统
    answer: "A"
    explanation_md: |
      关键差别在「集成方式」与「自治程度」：SOA 常通过 ESB 做集中编排，服务可以较粗粒度；
      微服务强调每个服务独立部署、独立演化，通信走轻量协议，不要中心总线。
      考试里常见错误选项就是「微服务用 ESB」——正好说反了。
    source: manual

  - id: RK-S3-014
    module_id: S3
    kp_id: KP-0302
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 3
    title: 容器与虚拟机的本质区别
    body_md: |
      容器与虚拟机最本质的区别是？
    options:
      - 容器共享宿主机内核、以进程级隔离运行；虚拟机各自运行完整的客户操作系统
      - 容器必须有独立操作系统，虚拟机不需要
      - 虚拟机启动速度比容器快
      - 容器不能做资源限制
    answer: "A"
    explanation_md: |
      一句话记牢：**容器共享内核，虚拟机各带一套系统**。
      由此推出所有结果：容器更轻、启动更快、密度更高；虚拟机隔离更彻底、能跑不同内核。
      B 和 C 正好说反，D 不符合事实（容器可以做 CPU / 内存限制）。
    source: manual

  - id: RK-S3-015
    module_id: S3
    kp_id: KP-0308
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 3
    title: 等保五级的监管强度
    body_md: |
      关于网络安全等级保护的五个等级，下列说法正确的是？
    options:
      - 第一级为自主保护，级别越高监管越严，第五级为专控保护
      - 第一级监管最严，第五级仅需自主保护
      - 五个等级的监管要求完全相同
      - 第三级以上只需备案，不需要测评
    answer: "A"
    explanation_md: |
      从第一级到第五级，受侵害客体与侵害程度逐级加重，监管也逐级加严：一级自主保护、二级指导保护、
      三级监督保护、四级强制保护、五级专控保护。
      第三级及以上通常需要**测评**（不只是备案）——这一条在政务项目里是硬要求。
    source: manual

  - id: RK-S3-016
    module_id: S3
    kp_id: KP-0308
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 4
    title: 从业务影响反推等保级别
    body_md: |
      某市级政务数据共享平台涉及大量自然人信息，一旦遭到破坏，会对社会秩序和公共利益造成严重损害。
      按等保要求，它最低应达到几级？
    options:
      - 一级
      - 二级
      - 三级
      - 四级
    answer: "C"
    explanation_md: |
      定级看两个维度：**受侵害的客体** + **侵害程度**。
      「损害社会秩序和公共利益」且程度为「严重」⇒ 三级。
      答四级是把「严重」和「特别严重」混了；答二级是只按数据量猜，没看客体。
    source: manual

  - id: RK-S3-017
    module_id: S3
    kp_id: KP-0304
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 4
    title: 异构老系统怎么集成
    body_md: |
      某企业内部有 8 个不同年代、不同技术栈的老系统，要求既能复用已有能力，又要让新系统方便接入。
      最合适的架构方向是？
    options:
      - 把 8 个系统全部推倒，重建为一个单体应用
      - 将各系统能力服务化，通过标准接口进行集成，逐步替换
      - 各系统独立建设，彼此不集成
      - 只做一个前端门户，后台数据靠人工同步
    answer: "B"
    explanation_md: |
      老系统改造的核心约束是「不能停摆」，所以答案一定是「渐进式」而不是「推倒重来」。
      服务化 + 标准接口能让新老系统并存、逐块替换，是这类场景的标准解。
      A 风险最高、C 等于没解决、D 会制造新的数据不一致。
    source: manual

  - id: RK-S3-018
    module_id: S3
    kp_id: KP-0303
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 4
    title: 运维服务该补哪个阶段
    body_md: |
      某单位的系统已上线运行两年，运维团队每天忙于救火：故障频发、反复处理同类问题、没有服务记录。
      按 IT 服务生命周期看，最该补的是？
    options:
      - 规划设计阶段，重新做一遍架构设计
      - 部署实施阶段，重装一遍系统
      - 持续改进阶段，建立问题管理与知识沉淀机制
      - 不需要补，多招人就行
    answer: "C"
    explanation_md: |
      「反复处理同类问题 + 没有记录」是典型的**缺少持续改进**：问题没有从「事件」升级为「问题」被根治。
      正确动作是建立问题管理、根因分析与知识库。加人只能提高救火速度，不能减少火情。
    source: manual

  - id: RK-S3-019
    module_id: S3
    kp_id: KP-0301
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 4
    title: 一网通办真正的瓶颈
    body_md: |
      某市要建「一网通办」平台，需要打通 20 个委办局的业务系统。从项目实践看，最关键的制约因素通常是？
    options:
      - 服务器性能不足
      - 前端界面不够美观
      - 数据共享与业务协同的机制（权责、标准、审批链条）
      - 编程语言选型不当
    answer: "C"
    explanation_md: |
      这类跨部门项目的瓶颈几乎从来不是技术，而是**机制**：数据谁负责、按什么标准提供、出了问题谁担责。
      技术方案再漂亮，机制不通就落不了地。这条经验在案例分析里非常好用——遇到「政务 / 跨部门」，
      优先往机制上找原因，而不是往技术上找。
    source: manual

  - id: RK-S3-020
    module_id: S3
    kp_id: KP-0307
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 4
    title: 集成项目里的接口争议
    body_md: |
      系统集成项目中，甲方认为乙方提供的接口「不好用」，乙方认为按合同已经交付。双方争执不下。
      从项目管理角度看，问题的根源最可能是？
    options:
      - 乙方技术水平不够
      - 甲方要求太高
      - 接口的技术标准与验收标准在合同 / 需求阶段没有定义清楚
      - 服务器配置太低
    answer: "C"
    explanation_md: |
      交付争议的根源基本都在**验收标准没有可判定**。接口算不算「好用」，必须在需求阶段就写成
      可验证的条件（响应时间、错误码、字段完整性、并发能力）。
      这也正是 v4 这套东西为什么要给每条验收标准写「能一次判定」——判不了的验收，一定吵架。
    source: manual

  - id: RK-S3-021
    module_id: S3
    kp_id: KP-0302
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 5
    title: 自己项目的云服务落位
    body_md: |
      看你手上某个项目用到的云服务，逐项判断它们分别属于 IaaS / PaaS / SaaS 的哪一层，并说明判断依据。
    options: []
    answer: "能逐项归类；判断依据用「谁管操作系统」这条轴，而不是凭名字猜"
    explanation_md: |
      合格答案的样子：ECS 云主机 = IaaS（操作系统自己装自己管）；云数据库 RDS = PaaS
      （数据库引擎服务商维护，数据自己管）；对象存储 = IaaS / PaaS 边界（按是否托管运维判断）；
      企业邮箱 = SaaS（开箱即用）。

      关键是**说出判断轴**：谁的运维责任到哪一层。写不出依据、只报名字，等于没掌握。
    source: manual

  - id: RK-S3-022
    module_id: S3
    kp_id: KP-0306
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 5
    title: 项目里的数据治理到底有没有
    body_md: |
      描述你项目中数据治理的实际状况：谁对数据质量负责？口径不一致时谁裁决？有没有落成制度？
    options: []
    answer: "能说清责任归属与裁决机制；能区分「有管理动作」和「有治理机制」"
    explanation_md: |
      这一题是照妖镜。多数项目的真实答案是没有治理、只有管理：各部门各自做报表，口径对不上时靠开会吵。

      合格答案会说清三件事：**谁负责**（数据 owner）、**怎么裁决**（有争议时的决策路径）、
      **有没有落到制度**（写进流程还是靠人情）。三件都缺，就说明治理是空的——这正好可以作为你项目里的改进项。
    source: manual

  - id: RK-S3-023
    module_id: S3
    kp_id: KP-0308
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 5
    title: 给自己的系统定级
    body_md: |
      为你手上的一个系统写一段定级说明：定几级、依据是受侵害的客体和程度分别是什么、需要做什么测评。
    options: []
    answer: "级数、客体、程度三者对得上；知道三级及以上要测评"
    explanation_md: |
      合格答案要出现三个要素：**业务信息 / 系统服务被破坏后侵害谁**（公民法人权益 / 社会秩序公共利益 / 国家安全）、
      **侵害程度**（一般 / 严重 / 特别严重）、**由此得出的级别**。

      最常见的错误是只说「我们数据多所以要三级」——数据量不是定级依据，客体和程度才是。
    source: manual

  - id: RK-S3-024
    module_id: S3
    kp_id: KP-0301
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 5
    title: 把项目拆到信息化六要素上
    body_md: |
      用国家信息化体系六要素，逐项说明你项目里对应的具体内容（哪一项缺失也照实写）。
    options: []
    answer: "六要素逐项落位；缺的那几项要照实写，不硬凑"
    explanation_md: |
      六要素：信息技术应用、信息资源、信息网络、信息技术和产业、信息化人才、政策法规与标准规范。

      实操价值在于：**缺什么一眼就看出来**。多数业务项目缺的是「信息资源」（数据资产没盘清）和
      「政策法规与标准规范」（没有数据标准）。照实写缺失项，比硬凑成六项都有用。
    source: manual

  - id: RK-S3-025
    module_id: S3
    kp_id: KP-0305
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 5
    title: 你的项目打算怎么测
    body_md: |
      给你手上正在做的系统写一份最小测试策略：测哪几个阶段、每个阶段谁来做、准入与准出的判据是什么。
    options: []
    answer: "阶段划分清楚；每个阶段的责任方明确；准入准出判据可判定"
    explanation_md: |
      合格答案要能回答三个问题：**测到哪一步为止**（阶段与范围）、**谁签字**（责任方）、
      **什么条件才算过**（判据）。

      最常缺的是「准出判据」——写「测试通过后上线」等于没写。可判定的写法是
      「遗留缺陷中无严重及以上、一般缺陷 ≤5 个且均有规避方案」。
    source: manual

  # ── 第二批补题（2026-10-27）：S2 主战场，补齐到每层 4 题 ──────
  - id: RK-S2-004
    module_id: S2
    kp_id: KP-0201
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 项目章程的签发人
    body_md: |
      项目章程通常由谁签发？
    options:
      - 项目经理
      - 项目管理办公室
      - 客户方的项目经理
      - 项目发起人或高层管理者
    answer: "D"
    explanation_md: |
      项目章程的作用之一是**授权**项目经理动用组织资源，所以不能由项目经理自己签发——
      自己给自己授权，形式上不成立。这一点在判断题里几乎必考。
    source: manual

  - id: RK-S2-005
    module_id: S2
    kp_id: KP-0202
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: WBS 的最底层
    body_md: |
      工作分解结构（WBS）分解到最底层，得到的单元称为什么？
    options:
      - 工作包
      - 里程碑
      - 活动
      - 控制账户
    answer: "A"
    explanation_md: |
      WBS 分解到**工作包**为止；工作包再往下拆才是「活动」（进度管理做的事）。
      这个层级的区别常被考：WBS 管「交付什么」，活动管「怎么一步步做出来」。
    source: manual

  - id: RK-S2-006
    module_id: S2
    kp_id: KP-0204
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 监控过程组干什么
    body_md: |
      监控过程组的主要作用是？
    options:
      - 跟踪、审查和调整项目进展与绩效，识别变更并启动相应变更
      - 制定项目计划
      - 分配任务给团队成员
      - 关闭项目合同
    answer: "A"
    explanation_md: |
      监控 = **看偏差 + 动手纠正**。注意「识别变更并启动变更」也在监控里——
      很多人以为监控只是"看"，其实发现问题后推动变更同样是监控的职责。
    source: manual

  - id: RK-S2-007
    module_id: S2
    kp_id: KP-0203
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 质量保证属于哪个过程组
    body_md: |
      质量保证（Quality Assurance）属于哪个过程组？它管的是什么？
    options:
      - 监控过程组；检查最终产品是否合格
      - 收尾过程组；验收质量
      - 规划过程组；制定质量目标
      - 执行过程组；保证做事的**过程**符合质量要求
    answer: "D"
    explanation_md: |
      口诀：**质量保证管过程（执行），质量控制管结果（监控）**。
      这一组是选择题的高频陷阱 —— 上一版首次诊断你就栽在这里，所以单独列一题反复练。
    source: manual

  - id: RK-S2-008
    module_id: S2
    kp_id: KP-0204
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 质量控制属于哪个过程组
    body_md: |
      质量控制（Quality Control）属于哪个过程组？
    options:
      - 执行过程组
      - 启动过程组
      - 规划过程组
      - 监控过程组
    answer: "D"
    explanation_md: |
      质量控制是「检查结果对不对」，属于**监控**。
      与上一题成对记：保证管过程在执行，控制管结果在监控。
    source: manual

  - id: RK-S2-009
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 从 CPI 与 SPI 读出状态
    body_md: |
      某项目 CPI = 1.1，SPI = 0.9。下列关于该项目状态的说法，正确的是？
    options:
      - 成本超支，进度超前
      - 成本超支，进度落后
      - 成本节约，进度超前
      - 成本节约，进度落后
    answer: "D"
    explanation_md: |
      两个指数都拿 1 当基准：**>1 是好事，<1 是坏事**。
      CPI > 1 ⇒ 花得比计划少（成本节约）；SPI < 1 ⇒ 干得比计划慢（进度落后）。
      记不住就把「CPI 管钱、SPI 管时间」先钉死，再判方向。
    source: manual

  - id: RK-S2-010
    module_id: S2
    kp_id: KP-0205
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 收尾过程组要做的事
    body_md: |
      下列哪一组工作全部属于收尾过程组？
    options:
      - 合同关闭、经验教训归档、资源释放
      - 确认范围、控制质量
      - 制定 WBS、估算成本
      - 组建团队、管理冲突
    answer: "A"
    explanation_md: |
      收尾不等于「交付完」。客户验收属于监控过程组里的「确认范围」，
      合同关闭、经验教训归档、资源释放、归档项目文件才是收尾。
    source: manual

  - id: RK-S2-011
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 3
    title: 算完 CPI 再判断
    body_md: |
      某项目 EV = 600 万元，AC = 500 万元，PV = 700 万元。关于成本绩效，下列说法正确的是？
    options:
      - CPI = 1.2，成本节约
      - CPI = 0.83，成本超支
      - CPI = 1.4，成本节约
      - 信息不足，无法判断
    answer: "A"
    explanation_md: |
      CPI = EV / AC = 600 / 500 = **1.2**，大于 1 ⇒ 成本节约（同样的钱创造了更多价值）。

      干扰项 B 是拿 EV / PV 算出来的（那是 SPI ≈ 0.857，管进度不是管成本）；
      干扰项 C 是 AC / EV 的反向算法。**公式方向记错是这一章最常见的失分点。**
    source: manual

  - id: RK-S2-012
    module_id: S2
    kp_id: KP-0202
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 3
    title: 关键路径怎么算
    body_md: |
      某项目活动：A（2 天）。A 之后并行两条路径：A→B（5 天）→D；A→C（4 天）→D。D 需 3 天。
      关键路径与总工期分别是？
    options:
      - A→C→D，9 天
      - A→B→D，10 天
      - A→B→D，12 天
      - A→C→D，7 天
    answer: "B"
    explanation_md: |
      两条路径：A→B→D = 2+5+3 = **10 天**；A→C→D = 2+4+3 = 9 天。
      关键路径 = **最长**的那条 = A→B→D，总工期取最长路径 10 天。

      常见错误是把中间某条段相加（得出 12）、或把关键路径当成最短路径。
      记住：关键路径最长，因为它决定了项目最早能什么时候完工。
    source: manual

  - id: RK-S2-013
    module_id: S2
    kp_id: KP-0207
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: 变更场景里什么才是主干问题
    body_md: |
      客户口头要求增加一个报表，开发组长认为工作量不大，当天改完直接上线，未通知测试与其他干系人。
      从变更管理角度，最严重的问题是？
    options:
      - 没有提交书面变更申请
      - 未做变更影响分析、未走 CCB 审批、未更新基准
      - 没有做回归测试
      - 没有让客户签字确认
    answer: "B"
    explanation_md: |
      A / C / D 都是流程枝节，B 是**流程主干**：影响分析、审批、更新基准这三步缺了，
      范围就已经失控，其余问题都是它的后果。

      案例题里遇到「哪个是最主要的问题」，先问自己：哪一条缺了会让整件事失控？
    source: manual

  - id: RK-S2-014
    module_id: S2
    kp_id: KP-0205
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: 验收了是不是就结束了
    body_md: |
      某项目主体交付已完成、客户已签字验收，但合同尚未正式关闭、经验教训尚未归档。
      此时项目处于什么状态？
    options:
      - 仍在执行过程组
      - 已转入运维阶段
      - 项目已经结束
      - 已进入收尾过程组，但还有工作未完成
    answer: "D"
    explanation_md: |
      验收 ≠ 收尾。合同关闭、经验教训归档、资源释放都属于收尾过程组，
      做完这些项目才算真正结束。这个判断在案例题里经常作为"项目管理不到位"的论据。
    source: manual

  - id: RK-S2-015
    module_id: S2
    kp_id: KP-0201
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: 只有一句话的项目目标
    body_md: |
      某项目刚立项，项目经理拿到的只有一句「做个数据看板」的口头目标，领导要求下周开始开发。
      项目经理首先应该做的是？
    options:
      - 立刻排开发计划并安排人手
      - 先做技术选型
      - 推动签发正式项目章程，明确目标、边界、关键干系人与授权
      - 先招人，边做边想
    answer: "C"
    explanation_md: |
      没有章程就没有授权、没有边界、没有验收依据——后面所有计划都建在沙子上。
      这一步是启动过程组的核心动作。
      **实务提示**：内网/政务项目里这一步常被跳过，最后扯皮全从这里开始。
    source: manual

  - id: RK-S2-016
    module_id: S2
    kp_id: KP-0203
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: 开发与测试互撕
    body_md: |
      项目执行中，开发组认为测试组报的缺陷太多、影响进度；测试组认为开发质量差、返工多。
      双方在例会上争执不下。项目经理首先应该做的是？
    options:
      - 要求测试组放宽缺陷判定标准
      - 要求开发组加班修复
      - 识别冲突根源（是缺陷标准不清，还是质量确实不达标），再按团队管理过程处理
      - 立即上报高层，由领导裁决
    answer: "C"
    explanation_md: |
      这道题考的是**先归因、再处置**。如果是「标准不清」，动作是统一定义缺陷分级；
      如果是「质量确实差」，动作是查根因（评审缺失、测试左移）。
      两者的解法完全不同——不先分清就动手，一定会返工。
    source: manual

  - id: RK-S2-017
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 5
    title: 用自己项目算一次挣值
    body_md: |
      拿你手上一个真实项目（可以是粗估数），写出 EV、PV、AC、BAC，算出 SV、CV、SPI、CPI，
      并说明它反映出的真实情况。

      要求：数字可以是估的，但**要写出结论和你打算怎么应对**。
    options: []
    answer: "四个基础量齐全；四个派生量公式正确；结论与应对能对上"
    explanation_md: |
      这题的目的不是算对，是**把公式套到真实项目上**。

      合格答案会自然暴露出两件事：① 你项目里到底有没有 PV（基准）；
      ② 没有基准的话，挣值根本算不了——这本身就是项目管理的一个缺口。

      如果你发现「PV 说不出来」，那比算错更有价值：说明没有基线，进度和成本都没法量化控制。
    source: manual

  - id: RK-S2-018
    module_id: S2
    kp_id: KP-0207
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 5
    title: 把一次真实变更重写一遍
    body_md: |
      回忆你项目里一次真实的变更（客户加需求、领导改方向都算），按标准流程把它重写一遍：
      每一步你实际做了什么、标准要求做什么、差在哪。
    options: []
    answer: "对照标准流程逐步骤写；能明确指出自己漏了哪一步及后果"
    explanation_md: |
      合格答案会呈现「实际 vs 标准」的对照，并指出漏的那一步造成了什么后果。

      最常见的是漏 **CCB 审批** 和 **更新基准**——真实项目里往往是「领导一句话就改了」。
      把这层差写出来，案例题里就有素材了：案例分析考的正是「你觉得哪里有问题、该怎么改」。
    source: manual

  - id: RK-S2-019
    module_id: S2
    kp_id: KP-0202
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 5
    title: 给自己项目画三层 WBS
    body_md: |
      给你手上的项目画出三层 WBS：第一层按可交付成果分，第二层拆到子系统/模块，第三层拆到工作包。
      并说明你的分解依据是什么。
    options: []
    answer: "三层分解完整；第一层是可交付成果而不是部门/阶段；能说出分解依据"
    explanation_md: |
      最常见的错误是**按部门或按阶段拆**（"开发部、测试部"或"需求、设计、开发"）。
      WBS 必须按**可交付成果**拆：用户管理模块、订单模块、报表模块……

      因为 WBS 要回答的是「项目要交出哪些东西」，不是「谁来做、按什么顺序做」。
    source: manual

  - id: RK-S2-020
    module_id: S2
    kp_id: KP-0205
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 5
    title: 写一份项目收尾清单
    body_md: |
      为你手上的项目写一份收尾清单（不少于 6 项），每项要写清「谁负责、交付什么、怎么算完成」。
    options: []
    answer: "条目覆盖合同/验收/资料/经验/资源/移交；每项责任人与完成判据清楚"
    explanation_md: |
      合格清单通常包含：客户验收签字、合同/尾款结算、文档归档、经验教训总结、
      资源释放与人员回归、运维移交、账号与权限回收。

      **最容易漏的是「账号与权限回收」**——政务/内网项目里这属于安全问题，验收时会被追问。
    source: manual

  - id: RK-S4-002
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: easy
    level: 1
    title: PMO 的三种类型
    body_md: |
      关于项目管理办公室（PMO）的三种类型，下列说法正确的是？
    options:
      - 控制型 PMO 要求项目遵循既定流程，控制力中等
      - 支持型 PMO 对项目拥有最强的控制力
      - 指令型 PMO 只提供模板和培训，不介入项目
      - 三种类型的区别只在于配备人员的数量
    answer: "A"
    explanation_md: |
      控制力由弱到强：**支持型**（顾问角色，提供模板、最佳实践、培训，控制力弱）→
      **控制型**（要求遵循流程，控制力中等）→ **指令型**（直接管理项目，控制力最强）。
      这个顺序不能记反，案例题里问「PMO 该不该直接指挥项目经理」，答案取决于它是哪一种。
    source: manual

  - id: RK-S4-003
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: easy
    level: 1
    title: 配置项与基线
    body_md: |
      关于配置项和基线，下列理解正确的是？
    options:
      - 项目中的所有文档和代码自动都是配置项，无需识别
      - 基线是经过评审确认的配置项集合，建立后变更须走变更控制
      - 基线一经建立就永久冻结，任何情况下都不允许变更
      - 只有可执行程序才能作为配置项
    answer: "B"
    explanation_md: |
      配置项是「**纳入**配置管理的工作产品」，需要主动识别和标识，不是自动全算（A 错）。
      基线可以变更，但必须走正式变更控制（C 错）——「受控」不等于「冻结」。
      文档、代码、数据、环境配置参数都可以是配置项（D 错）。
    source: manual

  - id: RK-S4-004
    module_id: S4
    kp_id: KP-0402
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: easy
    level: 1
    title: 监理单位的角色定位
    body_md: |
      信息系统工程监理单位的角色定位是？
    options:
      - 承建方的质量管理部门
      - 建设方的内部审计部门
      - 独立于建设方和承建方的第三方
      - 政府主管部门的派出机构
    answer: "C"
    explanation_md: |
      监理是**受建设方委托**、独立于建设方与承建方的第三方。
      它替建设方管项目，但不是建设方的内设部门（B 错）；与承建方是监理与被监理关系，
      不是上下级（A 错）；它不是行政机构，没有行政处罚权（D 错）。
    source: manual

  - id: RK-S4-005
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: medium
    level: 2
    title: 配置库的三库划分
    body_md: |
      配置管理中的三个库，按工作产品的流转顺序排列，正确的是？
    options:
      - 开发库（动态库）→ 受控库（主库）→ 产品库（静态库）
      - 产品库 → 受控库 → 开发库
      - 受控库 → 开发库 → 产品库
      - 三个阶段共用同一个库，靠目录区分
    answer: "A"
    explanation_md: |
      开发库存开发过程中的工作产品，修改相对自由；受控库存**基线**，改动须走变更控制；
      产品库存最终交付版本，只读。流向是单向的：开发 → 受控 → 产品。

      **最容易记反的是「受控库≠产品库」**：受控库存的是过程中的基线（可能有好几个），
      产品库才是最终交付物。
    source: manual

  - id: RK-S4-006
    module_id: S4
    kp_id: KP-0402
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: medium
    level: 2
    title: 监理的三种现场工作方式
    body_md: |
      监理工程师在关键工序、关键部位实施全过程现场监督，这种方式称为？
    options:
      - 巡视
      - 抽查
      - 平行检验
      - 旁站
    answer: "D"
    explanation_md: |
      **旁站**＝在关键部位、关键工序**全过程**现场监督；
      **巡视**＝定期或不定期到现场查看（不保证全程）；
      **平行检验**＝监理方用自有设备独立检测，与承建方的数据比对。

      三者的区别就一条：**是否全程在场、是否有独立数据**。监理实施细则里要写清哪些工序必须旁站，
      否则事后无法证明监理履职。
    source: manual

  - id: RK-S4-007
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: medium
    level: 2
    title: 配置管理员的职责边界
    body_md: |
      下列哪一项**不属于**配置管理员的职责？
    options:
      - 建立和维护配置库
      - 标识配置项并记录其状态
      - 审批变更申请是否符合项目目标
      - 执行配置审计并记录结果
    answer: "C"
    explanation_md: |
      审批变更是**变更控制委员会（CCB）**的职责。配置管理员只负责受理、登记、分发、归档，
      **不判定这个变更该不该做**。

      这条区分是案例题的高频考点：配置管理员＝执行者，CCB＝决策者，项目经理＝变更的提出者或推动者。
      三者混淆是答错的主要原因。
    source: manual

  - id: RK-S4-008
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: medium
    level: 3
    title: 配置项数量核算
    body_md: |
      某项目初始有配置项 120 个。建立基线后共发生 3 次变更，每次新增配置项 15 个、废止 5 个。
      当前有效配置项数量是多少？
    options:
      - "135"
      - "120"
      - "165"
      - "150"
    answer: "D"
    explanation_md: |
      每次净增 15−5＝10 个，3 次共净增 30 个，120＋30＝**150**。

      **「废止」不等于「删除」**：废止的配置项在配置库中仍要保留记录以备追溯，只是不再计入有效配置项。
      如果题目问的是「配置库中的记录总数」，那就该算 120＋45＝165（新增全算、废止不删）——
      看清题目问的是「有效」还是「记录总数」。
    source: manual

  - id: RK-S4-009
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: medium
    level: 3
    title: 质量保证金的返还
    body_md: |
      某项目合同价 800 万元，约定质量保证金比例为 5%。缺陷责任期满且期间未发生应由承建方承担的
      质量问题，建设方应返还的质量保证金是多少？
    options:
      - 40 万元
      - 20 万元
      - 80 万元
      - 不返还，作为项目节余留存
    answer: "A"
    explanation_md: |
      800×5%＝**40 万元**。

      **质保金是「预留」不是「扣罚」**：只要缺陷责任期内没有发生应由承建方承担的质量问题，
      就应全额返还，不能以「没出问题所以不用给」为由扣下。这个认知错误在实际项目结算里很常见。
    source: manual

  - id: RK-S4-010
    module_id: S4
    kp_id: KP-0402
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: hard
    level: 3
    title: 监理费的计算口径
    body_md: |
      某信息系统工程投资额 2000 万元，合同约定监理费按投资额的 3% 计取，监理服务期 6 个月。
      监理费总额是多少？
    options:
      - 30 万元
      - 200 万元
      - 120 万元
      - 60 万元
    answer: "D"
    explanation_md: |
      2000×3%＝**60 万元**。

      **服务期 6 个月是干扰项**——按投资额比例计取时，服务成本已包含在费率里，不再另乘月份。
      只有当合同改成「按人月计费」（多少人 × 多少月 × 单价）时，服务期才进入计算。
      这类题考的不是算术，是**看清计费口径**。
    source: manual

  - id: RK-S4-011
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: hard
    level: 4
    title: 绕过变更控制直接改受控库
    body_md: |
      项目已建立基线。开发组长发现一个严重缺陷，为赶进度直接在受控库中修改了代码并提交测试。
      作为配置管理员，你**首先**应该做什么？
    options:
      - 认可这次修改，因为缺陷确实严重，改对了就行
      - 立即冻结该配置项，补充变更申请并提交 CCB 追溯评审
      - 直接把代码回滚到修改前，不做任何记录
      - 把这次修改直接记为下一个基线的正常内容
    answer: "B"
    explanation_md: |
      关键动作是「**先止血 + 补流程**」，既不是一票否决，也不是默认接受。

      严重缺陷不能不改（所以不能简单回滚了事），但也不能不备案：冻结 → 补变更申请 →
      CCB 追溯评审 → 按结论决定保留或回退，全过程留痕。
      选 C 的毛病是**没有留痕**，事后无法审计，也无法解释基线为什么和记录对不上。
    source: manual

  - id: RK-S4-012
    module_id: S4
    kp_id: KP-0402
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: hard
    level: 4
    title: 隐蔽工程未验收即覆盖
    body_md: |
      监理在巡检中发现承建方已将隐蔽工程的管线敷设覆盖，且此前未通知监理验收。
      监理的正确做法是？
    options:
      - 要求剥离覆盖层重新验收，由此产生的费用与工期延误由承建方承担
      - 视为验收合格，在监理日志中补记一笔
      - 直接下达停工令并上报政府主管部门
      - 要求承建方补拍现场照片即可通过
    answer: "A"
    explanation_md: |
      隐蔽工程必须**先验收、后覆盖**。未经验收即覆盖的，监理有权要求剥离复验，
      费用与工期责任由承建方承担。

      **不要一上来就选停工令**：停工适用于重大质量或安全隐患，本题属于程序违规，
      先剥离复验、据结果再定；补拍照片无法证明覆盖前的状态，不构成验收依据。
    source: manual

  - id: RK-S4-013
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: hard
    level: 4
    title: PMO 的介入边界
    body_md: |
      某矩阵型组织中，项目经理与职能经理在人员调配上的冲突已影响关键路径。
      PMO 是控制型 PMO，它恰当的介入方式是？
    options:
      - 直接替项目经理决定人员如何分配
      - 不介入，这属于项目经理与职能经理之间的事
      - 依据组织级资源管理流程组织协调，并记录冲突处理结论
      - 上报客户，由客户裁定人员分配
    answer: "C"
    explanation_md: |
      **控制型 PMO 是「建规则 + 促遵循」，不是「代人决策」**——直接决定人员分配是指令型 PMO 的做法。

      不介入是失职：跨部门资源冲突正是 PMO 该协调的组织级问题。
      上报客户更不对：内部管理问题上交客户，等于把矛盾转移给甲方，还会损害信任。
    source: manual

  - id: RK-S4-014
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 实操
    difficulty: hard
    level: 5
    title: 写一份配置管理计划要点
    body_md: |
      为你手上的项目写一份配置管理计划要点（不少于 5 项），每项写清「做什么、谁负责、产出什么」。
    options: []
    answer: "覆盖配置项识别、库与权限、基线划分、变更控制流程、配置审计与状态报告；每项有责任人与产出物"
    explanation_md: |
      合格要点通常包含：① 配置项识别与命名规则 ② 三库划分及访问权限 ③ 基线划分时点
      （需求基线、设计基线、产品基线）④ 变更控制流程与 CCB 组成 ⑤ 配置审计
      （功能配置审计 FCA、物理配置审计 PCA）⑥ 配置状态报告机制。

      **最容易漏的是「权限」**——只写「建三个库」而不写谁能写、谁只能读，
      等于没做控制，评审时会被直接打回。
    source: manual

  - id: RK-S4-015
    module_id: S4
    kp_id: KP-0402
    category: 中项·S4 组织保障与监理
    type: 实操
    difficulty: hard
    level: 5
    title: 写一份旁站监理记录要点
    body_md: |
      写一份旁站监理记录的要点（不少于 5 项）。假设旁站对象是机房综合布线的线缆敷设。
    options: []
    answer: "覆盖时间地点、旁站部位与工序、施工依据、现场实测数据、问题与处理、双方签认"
    explanation_md: |
      合格记录包含：① 旁站时间、地点 ② 旁站的具体部位与工序 ③ 施工依据（图纸号、规范号）
      ④ 现场实测数据（线缆型号、长度、弯曲半径、牵引力）⑤ 发现的问题、处理意见与整改结果
      ⑥ 承建方与监理方签认。

      **没有实测数据的旁站记录等于没去现场**。这是监理资料审查最常见的退回原因——
      只写「已旁站，情况正常」的记录，事后无法作为履职证据。
    source: manual

  - id: RK-S4-016
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 实操
    difficulty: hard
    level: 5
    title: 写一份项目立项评审清单
    body_md: |
      写一份项目立项评审清单（不少于 6 项），用于判断一个立项申请是否应该批准。
      每项要有可判断的判据，不要写「很重要」这类无法验证的表述。
    options: []
    answer: "覆盖业务价值、目标可衡量、范围边界、可行性、预算与资源、里程碑、风险、验收标准"
    explanation_md: |
      合格清单：① 业务价值与战略一致性 ② 目标可衡量（SMART）③ 范围边界清晰
      ④ 技术与实施可行性 ⑤ 预算与资源落实 ⑥ 里程碑与关键路径 ⑦ 主要风险与应对
      ⑧ 验收标准与责任主体。

      **最容易漏的是「不做什么」**——范围里只写要做什么、不写排除项，后期必然扯皮。
      评审清单的价值不在条目多，而在每条都能给出「过 / 不过」的判定。
    source: manual

  - id: RK-S5-002
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: easy
    level: 1
    title: 中标通知书的法律效力
    body_md: |
      关于中标通知书的法律效力，下列说法正确的是？
    options:
      - 中标通知书发出后，招标人改变中标结果只需退还投标保证金
      - 中标通知书对招标人和中标人均具有法律效力，发出后改变结果须承担法律责任
      - 中标通知书在签订书面合同后才生效
      - 中标通知书属于要约邀请，不具有约束力
    answer: "B"
    explanation_md: |
      《招标投标法》明确：**中标通知书对招标人和中标人具有法律效力**。
      发出后，招标人改变中标结果、或中标人放弃中标的，都要依法承担法律责任。

      法律定性链条：招标公告＝**要约邀请**，投标＝**要约**，中标通知书＝**承诺**。
      既然它是承诺，就自**发出**时生效，不是等到签合同才生效（C 错）。
    source: manual

  - id: RK-S5-003
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: easy
    level: 1
    title: 软件著作权的保护期
    body_md: |
      某公司 2020 年开发完成一套软件并首次发表。该软件著作权的保护期是？
    options:
      - 自首次发表起 50 年
      - 自开发完成起 10 年
      - 自首次发表起 20 年
      - 永久保护
    answer: "A"
    explanation_md: |
      法人或其他组织的软件著作权，保护期为 **50 年**，截止于软件**首次发表后**第 50 年的 12 月 31 日。
      自然人的软件著作权保护期为**自然人终生及其死亡后 50 年**。

      注意区分主体：单位开发看「首次发表起 50 年」，个人开发看「终生加死后 50 年」。
      另外，**开发完成但未发表**的，保护期自开发完成起算 50 年。
    source: manual

  - id: RK-S5-004
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: medium
    level: 1
    title: 必须招标的金额门槛
    body_md: |
      按现行规定，使用国有资金投资的项目，其**施工**单项合同估算价达到多少，必须招标？
    options:
      - 100 万元人民币以上
      - 200 万元人民币以上
      - 400 万元人民币以上
      - 1000 万元人民币以上
    answer: "C"
    explanation_md: |
      三个门槛要分开记，**别混成一个数**：
      施工 **400 万**；重要设备、材料等货物 **200 万**；勘察、设计、监理等服务 **100 万**。

      记忆锚点：**服务最低、货物居中、施工最高**。三者都是「单项合同估算价」，
      不是项目总投资——这是最常见的理解错误。
    source: manual

  - id: RK-S5-005
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: medium
    level: 2
    title: 招标投标中的要约与承诺
    body_md: |
      在招标投标过程中，下列对应关系正确的是？
    options:
      - 招标公告是要约，投标是承诺
      - 招标公告是承诺，中标通知书是要约
      - 招标公告是要约邀请，投标是要约，中标通知书是承诺
      - 三者都属要约邀请，均无法律约束力
    answer: "C"
    explanation_md: |
      **招标公告＝要约邀请**（邀请别人来提条件，自己不受约束）；
      **投标＝要约**（提出具体条件，一旦被接受就受约束）；
      **中标通知书＝承诺**（接受该要约，合同成立）。

      这条链决定了「投标截止后能不能撤标」这类题的答案：投标是要约，撤回有严格时间限制。
    source: manual

  - id: RK-S5-006
    module_id: S5
    kp_id: KP-0502
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: medium
    level: 2
    title: 标准的五个层级
    body_md: |
      按《标准化法》，我国标准的层级不包括下列哪一项？
    options:
      - 国家标准
      - 行业标准
      - 项目标准
      - 团体标准
    answer: "C"
    explanation_md: |
      五个层级：**国家标准、行业标准、地方标准、团体标准、企业标准**。
      「项目标准」是编出来的干扰项，标准化法里没有这个层级。

      常见的混淆点：把「团体标准、企业标准」当成非正式标准——它们都是法定层级，
      只是**团体标准和企业标准不得低于强制性国家标准的相关技术要求**。
    source: manual

  - id: RK-S5-007
    module_id: S5
    kp_id: KP-0502
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: medium
    level: 2
    title: 强制性标准与推荐性标准
    body_md: |
      关于强制性国家标准和推荐性国家标准，下列说法正确的是？
    options:
      - 强制性标准代号为 GB/T，推荐性标准代号为 GB
      - 推荐性标准一经发布，相关方必须执行
      - 强制性标准必须执行，推荐性标准国家鼓励采用
      - 行业标准一律为强制性标准
    answer: "C"
    explanation_md: |
      代号别记反：**GB＝强制性**，**GB/T＝推荐性**（T 即「推」）。
      强制性标准必须执行，推荐性标准国家鼓励采用（合同约定采用后即对当事方有约束力）。

      行业标准、地方标准**都是推荐性的**（D 错）；只有国家标准可以是强制性标准。
      判断某标准是否强制，看代号和是否属于保障人身健康、生命财产安全等范围。
    source: manual

  - id: RK-S5-008
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: hard
    level: 3
    title: 投标保证金的上限
    body_md: |
      某依法必须招标的项目，招标项目估算价为 5000 万元。招标文件要求投标人提交投标保证金，
      其最高限额是多少？
    options:
      - 50 万元
      - 500 万元
      - 100 万元
      - 80 万元
    answer: "D"
    explanation_md: |
      两个上限**取小**：① 不得超过招标项目估算价的 **2%**（5000×2%＝100 万）；
      ② 最高不得超过 **80 万元**。所以答案是 **80 万元**。

      这是典型的「双重限额」题——只算 2% 会得出 100 万，正好落在干扰项上。
      看到「不得超过……且最高不超过……」这种表述，一定要两个条件都过一遍。
    source: manual

  - id: RK-S5-009
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: hard
    level: 3
    title: 定金的法定上限
    body_md: |
      甲乙双方签订合同，合同标的额为 200 万元。双方约定定金担保，依法可以产生定金效力的
      最高金额是多少？
    options:
      - 20 万元
      - 200 万元
      - 60 万元
      - 40 万元
    answer: "D"
    explanation_md: |
      定金不得超过主合同标的额的 **20%**：200×20%＝**40 万元**。

      关键细节：**超过 20% 的部分不产生定金效力**，不是整个约定无效。比如约定 60 万定金，
      其中 40 万有定金效力，多出的 20 万按预付款处理。

      另外记住定金罚则的方向：**给付方违约不得请求返还，收受方违约应双倍返还**。
    source: manual

  - id: RK-S5-010
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: hard
    level: 3
    title: 履约保证金的上限
    body_md: |
      某项目中标合同金额为 1200 万元。招标文件要求中标人提交履约保证金，
      该履约保证金的最高限额是多少？
    options:
      - 24 万元
      - 60 万元
      - 120 万元
      - 240 万元
    answer: "C"
    explanation_md: |
      履约保证金**不得超过中标合同金额的 10%**：1200×10%＝**120 万元**。

      三个「保证金」要分清，别串：
      **投标保证金**＝估算价 2%，最高 80 万；**履约保证金**＝合同金额 10%；
      **质量保证金**＝结算价 5% 左右（按合同约定）。考试常把它们混在一个选项里考。
    source: manual

  - id: RK-S5-011
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: hard
    level: 4
    title: 招标文件指定品牌
    body_md: |
      某政务项目招标文件中写明「投标产品数据库必须为某国外品牌」。作为投标方，
      你对该条款的正确判断是？
    options:
      - 合理，招标人有权规定技术路线
      - 不合理，招标人不得以不合理条件限制、排斥潜在投标人
      - 合理，只要在招标公告中提前公示即可
      - 不合理，但只能在中标后再提异议
    answer: "B"
    explanation_md: |
      《招标投标法》禁止招标人以不合理条件限制或排斥潜在投标人、实行歧视待遇。

      技术需求应当写**性能指标和功能要求**（如「支持 SQL-92、单表千万级查询响应 ≤2 秒」），
      而不是指定品牌。确实无法用其他方式准确描述时，才可写「参照某品牌」并注明「相当于或优于」。

      **异议要在投标截止前提出**（D 错）——中标后再提，程序上已经晚了。
    source: manual

  - id: RK-S5-012
    module_id: S5
    kp_id: KP-0503
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: hard
    level: 4
    title: 客户环境中的第三方代码
    body_md: |
      你在为客户做系统运维时，在客户服务器上发现一段源码，明显是竞争对手产品的核心算法，
      且没有任何授权说明。你的正确做法是？
    options:
      - 直接复用，代码在客户服务器上就属于客户资产
      - 记录备案后暂不处理，等客户主动说明
      - 立即停止使用该代码，书面报告客户并建议核查来源与授权，未获合法授权前予以隔离
      - 删除该文件，避免给自己带来风险
    answer: "C"
    explanation_md: |
      正确处理是三件事：**停用、报告、核查授权**。

      选 A 是侵权——部署位置不改变著作权归属；选 B 是消极不作为，知情后仍继续使用会扩大风险；
      选 D 更糟，**擅自删除客户环境中的文件本身就是越权操作**，还破坏了证据链。

      这题测的是职业道德里最难的一条：**遇到可能违法的事，要留痕上报，而不是自己处理掉**。
    source: manual

  - id: RK-S5-013
    module_id: S5
    kp_id: KP-0502
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: hard
    level: 4
    title: 未生效标准作为验收依据
    body_md: |
      客户要求把一项尚未发布实施的国家标准草案写入合同，作为项目验收依据。
      作为承建方，恰当的处理方式是？
    options:
      - 直接同意，客户的要求优先
      - 拒绝写入合同，验收只能依据现行有效标准
      - 明确草案的版本与条款范围并写入合同作为约定依据，同时声明涉及强制性要求仍执行现行有效标准
      - 口头答应，验收时再按现行标准执行
    answer: "C"
    explanation_md: |
      两个层面要分开：
      **约定层面**——合同可以约定采用某个技术文件（含草案），但必须写清**版本号和适用范围**，
      否则将来草案改了，双方对「按哪一版验收」必然吵架。
      **强制层面**——涉及人身健康、生命财产安全的强制性要求，只能执行**现行有效**的强制性标准，
      不能拿草案替代。

      选 B 过于绝对（合同自由允许约定技术依据），选 D 是埋雷。
    source: manual

  - id: RK-S5-014
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 实操
    difficulty: hard
    level: 5
    title: 写一份合同关键条款风险清单
    body_md: |
      写一份信息系统集成合同的关键条款风险清单（不少于 6 项）。每项写清「哪条容易出问题、
      出问题后的后果、怎么在合同里写死」。
    options: []
    answer: "覆盖范围与变更、验收标准、付款节点、工期与顺延、知识产权归属、保密与违约、质保与运维"
    explanation_md: |
      高风险条款通常集中在：① 范围与变更（未约定变更计价方式）② 验收标准（写「满足客户需求」
      这类不可判定的表述）③ 付款节点（与验收脱钩，导致干完收不到钱）④ 工期顺延条件
      （未约定客户原因导致的延误如何处理）⑤ 知识产权归属（定制开发成果归谁）
      ⑥ 保密与数据安全责任 ⑦ 质保期起算点与响应时限 ⑧ 违约责任的封顶与例外。

      **最致命的一条是验收标准**：写「达到客户满意」等于把验收权完全交给对方。
      合格写法是「按 GB/T 8566 及本合同附件《验收测试用例》全部通过」。
    source: manual

  - id: RK-S5-015
    module_id: S5
    kp_id: KP-0502
    category: 中项·S5 法规与职业道德
    type: 实操
    difficulty: hard
    level: 5
    title: 写一份项目应遵循的标准清单
    body_md: |
      为「政务数据共享交换平台」项目列出应遵循的标准清单（不少于 6 项），
      每项写明「标准类别（强制/推荐）、适用环节、为什么必须遵循」。
    options: []
    answer: "覆盖安全等级保护、数据分类分级、接口与数据交换、文档编制、质量与测试、验收；区分强制与推荐"
    explanation_md: |
      合格清单应覆盖：① 网络安全等级保护相关标准（定级、设计、测评）② 数据分类分级与
      个人信息保护相关要求 ③ 数据交换接口规范（如政务信息资源目录与交换体系标准）
      ④ 软件文档编制规范（GB/T 8567）⑤ 软件工程与质量相关标准（GB/T 8566、GB/T 25000 系列）
      ⑥ 系统验收与测评要求。

      **答题关键是分清强制与推荐**：等保相关要求属必须执行，文档编制类多为推荐但合同约定后即成义务。
      只列一串标准号而不说「适用哪个环节」，是这类题的常见失分点。
    source: manual

  - id: RK-S5-016
    module_id: S5
    kp_id: KP-0503
    category: 中项·S5 法规与职业道德
    type: 实操
    difficulty: hard
    level: 5
    title: 写一段利益冲突情形的处理说明
    body_md: |
      情形：你是某项目的技术负责人，该项目正在评标。你配偶所在的公司也参与了本次投标。
      请写出你的处理说明（不少于 4 条），说明你怎么做、依据是什么。
    options: []
    answer: "主动申报、申请回避、不接触评审信息、留存书面记录、服从组织安排"
    explanation_md: |
      合格答案包含：① **主动书面申报**该关联关系（不等人来问）② **申请回避**与评标相关的
      一切工作 ③ 在回避决定做出前，**不接触、不传递任何评审信息** ④ 不对外讨论该项目投标情况
      ⑤ 留存申报与回避的书面记录 ⑥ 服从单位的回避安排，不因回避影响正常工作交接。

      **这道题的分水岭在「主动」二字**：等被发现再说明，性质就从「合规申报」变成「隐瞒关联」。
      职业道德考的是这个区别，不是背条款。
    source: manual

  - id: RK-S6-003
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 单选
    difficulty: easy
    level: 1
    title: 英文术语 WBS
    body_md: |
      项目管理中的 WBS 指的是？
    options:
      - 工作分解结构
      - 工作说明书
      - 挣值管理
      - 关键路径法
    answer: "A"
    explanation_md: |
      **WBS＝Work Breakdown Structure，工作分解结构**。它把项目范围逐层分解为可管理的工作包，
      是范围管理的核心输出，也是估算工期和成本的依据。

      容易混的三个：**SOW**（Statement of Work，工作说明书，属于采购/合同文件）、
      **WBS**（分解结构，属于范围基准）、**OBS**（Organizational Breakdown Structure，组织分解结构）。
    source: manual

  - id: RK-S6-004
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 单选
    difficulty: easy
    level: 1
    title: 英文术语 SPI 与 CPI
    body_md: |
      EVM 体系中，SPI 和 CPI 分别表示？
    options:
      - 进度绩效指数、成本绩效指数
      - 成本绩效指数、进度绩效指数
      - 计划价值、实际成本
      - 完工估算、完工尚需估算
    answer: "A"
    explanation_md: |
      **SPI＝Schedule Performance Index，进度绩效指数**＝EV/PV；
      **CPI＝Cost Performance Index，成本绩效指数**＝EV/AC。

      对应记忆：**S 打头管进度（Schedule），C 打头管成本（Cost）**。
      另外三个值：PV 计划价值、EV 挣值、AC 实际成本；两个预测：EAC 完工估算、ETC 完工尚需估算。
    source: manual

  - id: RK-S6-005
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 1
    title: 英文术语 CCB 与 RFP
    body_md: |
      CCB 和 RFP 分别指？
    options:
      - 变更控制委员会、建议邀请书
      - 配置控制基线、需求建议书
      - 变更控制委员会、工作说明书
      - 质量保证、请求批准
    answer: "A"
    explanation_md: |
      **CCB＝Change Control Board，变更控制委员会**——变更的决策机构。
      **RFP＝Request for Proposal，建议邀请书**（也译需求建议书），采购中邀请卖方提交方案的正式文件。

      与采购相关的三个别混：**RFI**（信息邀请书，先摸底）、**RFQ**（报价邀请书，问价格）、
      **RFP**（建议邀请书，要方案）。**IFB**（Invitation for Bid，招标书）用于价格为主要因素的采购。
    source: manual

  - id: RK-S6-006
    module_id: S6
    kp_id: KP-0602
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 2
    title: 关键路径的判定标准
    body_md: |
      关于关键路径，下列说法正确的是？
    options:
      - 关键路径是网络图中活动数量最多的路径
      - 关键路径是网络图中总工期最长的路径，其上活动总时差为 0
      - 关键路径是网络图中总工期最短的路径
      - 一个项目网络中可能存在多条关键路径，但总工期不同
    answer: "B"
    explanation_md: |
      **关键路径＝最长路径**，它决定项目最短工期；其上活动**总时差为 0**，任何延误都会直接推迟工期。

      干扰项逐个看：A 错在「活动数量最多」——关键路径看**工期之和**，不看活动个数（一个 1 天活动
      和三个 3 天活动，后者路径更长但数量少）。
      C 把最长记成最短，是最常见的记反。
      D 前半句对（可以有多条），后半句错——多条关键路径的**总工期必然相同**，否则长的才算关键。
    source: manual

  - id: RK-S6-007
    module_id: S6
    kp_id: KP-0601
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 2
    title: 挣值的三个基本值
    body_md: |
      关于 PV、EV、AC 三个基本值，下列说法正确的是？
    options:
      - PV 是「实际花了多少钱」，AC 是「应该花多少钱」
      - EV 是「实际完成工作的预算价值」，不是实际花费
      - 三者都按实际支出统计，区别只在统计口径
      - EV 一定等于 PV，因为都按预算计算
    answer: "B"
    explanation_md: |
      **EV 是「干了多少活，按预算折算成钱」**，不是实际花了多少钱——这是挣值法最关键、
      也最容易错的一点。

      三个值的口径：
      **PV**＝按计划到此刻应该完成的工作，值多少预算；
      **EV**＝实际已完成的工作，值多少预算；
      **AC**＝完成这些工作实际花了多少钱。

      只有 AC 是真实支出，PV 和 EV 都是**预算口径**。A 把 PV 和 AC 说反了。
    source: manual

  - id: RK-S6-008
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 实操
    difficulty: medium
    level: 2
    title: 写一份中英术语对照表
    body_md: |
      写一份中项考试常用的中英术语对照表（不少于 10 组）。每组写上英文全称、缩写、中文，
      并在括号里标一句「在哪个过程用到」。
    options: []
    answer: "覆盖 WBS、SOW、CCB、EVM、PV/EV/AC、SPI/CPI、EAC/ETC、RFP、QA/QC、CPM 等，且标明使用场景"
    explanation_md: |
      高频 10 组：① WBS 工作分解结构 ② SOW 工作说明书 ③ CCB 变更控制委员会
      ④ EVM 挣值管理 ⑤ PV/EV/AC 计划价值/挣值/实际成本 ⑥ SPI/CPI 进度/成本绩效指数
      ⑦ EAC/ETC 完工估算/完工尚需估算 ⑧ RFP 建议邀请书 ⑨ QA/QC 质量保证/质量控制
      ⑩ CPM 关键路径法。

      **光背缩写没用**——上午题常给一个项目经理的邮件或报告片段，让你判断「他在做什么」。
      能说出「这个术语出现在哪个过程」才算真认得。
    source: manual

  - id: RK-S6-009
    module_id: S6
    kp_id: KP-0601
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 3
    title: 挣值指标计算与判定
    body_md: |
      某项目当前 PV＝100 万元，EV＝80 万元，AC＝90 万元。下列关于项目状态的说法正确的是？
    options:
      - 成本节约 10 万元，进度提前
      - 成本超支 10 万元，进度落后，CPI＝0.89，SPI＝0.80
      - 成本超支 20 万元，进度落后，CPI＝0.80，SPI＝0.89
      - 进度落后 20 万元，成本节约 10 万元
    answer: "B"
    explanation_md: |
      四个公式走一遍：
      **CV＝EV−AC＝80−90＝−10 万**（负＝成本超支）
      **SV＝EV−PV＝80−100＝−20 万**（负＝进度落后）
      **CPI＝EV/AC＝80/90≈0.89**（＜1＝成本超支）
      **SPI＝EV/PV＝80/100＝0.80**（＜1＝进度落后）

      判定口诀：**差值看正负，指数看是否小于 1**。两者必然一致，如果算出来不一致，
      就是公式记错了——这是自查的好办法。C 把 CPI 和 SPI 的分子分母调换了。
    source: manual

  - id: RK-S6-010
    module_id: S6
    kp_id: KP-0602
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 3
    title: 关键路径与最短工期
    body_md: |
      某项目活动及依赖关系如下（工期单位：周）：
      A 无前置，工期 3；B 前置 A，工期 4；C 前置 A，工期 6；D 前置 B、C，工期 5。
      项目的最短工期是多少？
    options:
      - 12 周
      - 18 周
      - 15 周
      - 14 周
    answer: "D"
    explanation_md: |
      把所有路径列出来算总长：
      **A→B→D＝3＋4＋5＝12 周**
      **A→C→D＝3＋6＋5＝14 周**

      最长的是 14 周，所以**最短工期＝14 周**，关键路径是 **A→C→D**。

      注意「最短工期」和「最长路径」是同一件事的两个说法——项目工期由最长的路径决定，
      这是网络图题的第一原理，也是 12 这个错误选项的来源。
    source: manual

  - id: RK-S6-011
    module_id: S6
    kp_id: KP-0602
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 3
    title: 总时差的计算
    body_md: |
      沿用上题：A 无前置工期 3；B 前置 A 工期 4；C 前置 A 工期 6；D 前置 B、C 工期 5。
      活动 B 的总时差是多少？
    options:
      - 0 周
      - 2 周
      - 4 周
      - 6 周
    answer: "B"
    explanation_md: |
      **总时差＝关键路径工期 − 该活动所在最长路径工期**。
      B 所在的最长路径是 A→B→D＝12 周，关键路径 14 周，所以总时差＝**2 周**。

      换个算法验证：B 最早完成＝3＋4＝7 周；D 最早开始＝max(3+4, 3+6)＝9 周；
      B 有 9−7＝2 周的活动空间。两种算法结果一致。

      **关键路径上的活动总时差为 0**（C 是 0），这是快速自查的方法。
    source: manual

  - id: RK-S6-012
    module_id: S6
    kp_id: KP-0601
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 4
    title: 进度落后且成本超支的处置
    body_md: |
      某项目 CPI＝0.85，SPI＝0.90，客户要求工期不能延后。作为项目经理，你**首先**应该做什么？
    options:
      - 立即增加人员赶工，把进度追回来
      - 缩减测试范围，把时间让给开发
      - 直接向客户申请延长工期
      - 核实挣值数据的准确性并分析偏差原因，再评估可选措施及其成本影响
    answer: "D"
    explanation_md: |
      先**核实数据、分析原因**，再谈措施——这是所有偏差处置题的第一动作。

      **为什么不选赶工**：CPI 已经 0.85（成本超支），赶工通常要加钱，会让成本进一步恶化，
      属于「用一个问题换另一个更大的问题」。赶工只能作为分析后的可选项之一，且要先评估
      「加多少成本、能追回多少天」。

      不选 C：客户已明确工期不能延后，直接申请延期等于没回应约束。
      不选 D：缩减测试范围是**降低质量**，在政务/金融类项目里往往直接违约。
    source: manual

  - id: RK-S6-013
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 4
    title: 案例背景信息互相矛盾时的答法
    body_md: |
      案例背景写「项目启动时已完成需求确认」，但后面又写「开发期间客户多次提出新需求，
      项目经理均安排开发人员直接实现」。作答时应当？
    options:
      - 指出背景描述有矛盾，拒绝作答该问
      - 以「需求已确认」为准，说明问题出在客户不守约
      - 抓住「直接实现」这一事实，指出变更未走控制流程、需求未形成基线，并给出对应措施
      - 只回答后半段的措施，不分析前因
    answer: "C"
    explanation_md: |
      案例题**永远按「事实行为」判，不按「说法」判**。「已确认需求」是一句声明，
      「多次提出新需求且直接实现」是可观察的行为——后者才是问题所在。

      正确的分析链：需求确认后**未建立基线** → 新需求**未走变更控制** → 变更**未评估影响**
      → 导致范围蔓延。对应措施要落到动作上：建立需求基线、补变更流程、设 CCB、变更必须评估
      对进度成本的影响后再实施。

      选 A 直接丢分（案例题没有「拒绝作答」这个选项）；选 B 把责任推给客户，不解决自己的管理问题，
      阅卷按「归因错误」扣分。
    source: manual

  - id: RK-S6-014
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 4
    title: 上午卷的时间分配
    body_md: |
      上午基础知识卷共 75 道单选题，考试时间 150 分钟。关于时间分配，下列做法最合理的是？
    options:
      - 严格按顺序作答，每题不限时，确保每题都想透
      - 全部做完后再统一涂卡，不预留检查时间
      - 先做最后 20 道题，因为后面的题通常更难、分值更高
      - 平均每题 2 分钟，超过 3 分钟仍无思路的先标记跳过，最后统一回看并留足涂卡时间
    answer: "D"
    explanation_md: |
      75 题 / 150 分钟＝**平均 2 分钟一题**。合理策略是：**先拿稳分，再攻难题，留足涂卡时间**。

      不选 A：一道题卡 8 分钟，等于挤掉 4 道会做的题，这是上午卷最常见的失分方式。
      不选 C：中项上午卷每题**分值相同**（各 1 分），不存在「后面题分值高」这回事。
      不选 D：全部做完再涂卡，一旦时间不够就是整卷作废——**边做边涂或分段涂卡**。

      记住一条：上午卷是「75 分制、45 分及格」，**容错空间有 30 分**，
      不需要每题都做对，需要的是把会做的都拿到。
    source: manual

  - id: RK-S6-015
    module_id: S6
    kp_id: KP-0602
    category: 中项·S6 应试专项
    type: 实操
    difficulty: hard
    level: 5
    title: 画网络图并标出关键路径
    body_md: |
      已知活动与依赖：A 无前置（5 天）；B 前置 A（8 天）；C 前置 A（4 天）；
      D 前置 B（6 天）；E 前置 C（10 天）；F 前置 D、E（3 天）。
      请画出单代号网络图，列出全部路径及各自长度，标出关键路径与总工期，
      并说明活动 C 的总时差。
    options: []
    answer: "路径 A-B-D-F=22、A-C-E-F=22，两条关键路径，总工期 22 天，C 总时差为 0"
    explanation_md: |
      路径枚举：
      **A→B→D→F＝5＋8＋6＋3＝22 天**
      **A→C→E→F＝5＋4＋10＋3＝22 天**

      两条路径**等长**，所以有**两条关键路径**，总工期 22 天。C 在关键路径上，**总时差＝0**。

      这题的陷阱是「两条关键路径」——很多人只找到一条就下结论。**多条关键路径意味着
      任何一条上的任何活动延误都会推迟工期，风险是成倍放大的**，案例题里问「该项目的主要风险」
      就该答这一点。答题时必须把路径逐条列出来，只写答案不给路径过程，过程分会全丢。
    source: manual

  - id: RK-S6-016
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 实操
    difficulty: hard
    level: 5
    title: 写一道案例题的完整答案
    body_md: |
      案例：某政务平台项目合同工期 12 个月。实施到第 8 个月时，客户新增 3 项功能要求，
      项目经理安排开发直接实现，未办理任何手续。第 11 个月系统进入测试，发现部分模块与
      原设计不符，客户拒绝验收，项目延期 2 个月。
      请写出完整答案：指出问题（不少于 4 条）+ 对应改进措施（每条对应一个问题）。
    options: []
    answer: "问题与措施一一对应，覆盖变更控制、范围基线、需求确认、测试与验收、进度管理"
    explanation_md: |
      **问题**：① 新增需求未走变更控制流程（无申请、无评审、无批准）
      ② 需求未形成基线，范围边界不清 ③ 变更未评估对进度、成本、质量的影响
      ④ 开发直接实现需求，缺少设计与需求的双向追溯 ⑤ 测试阶段才发现与原设计不符，
      说明缺少阶段评审和过程质量控制 ⑥ 进度无缓冲，变更影响未纳入进度计划。

      **措施（一一对应）**：① 建立变更控制流程并设 CCB，任何变更须书面申请、评审、批准
      ② 建立需求基线，明确范围与排除项 ③ 变更前做影响分析，输出对工期/成本/质量的评估结论
      ④ 建立需求-设计-代码-测试的追溯矩阵 ⑤ 在关键节点设阶段评审，测试前做设计符合性检查
      ⑥ 重排进度计划，为变更预留缓冲。

      **答题铁律：问题与措施必须编号对应**。只写一堆措施不对应问题，阅卷只给一半分——
      这是案例题最普遍的丢分方式。
    source: manual

  - id: RK-S6-017
    module_id: S6
    kp_id: KP-0601
    category: 中项·S6 应试专项
    type: 实操
    difficulty: hard
    level: 5
    title: 写挣值分析题的解题步骤
    body_md: |
      写出你在考场上解一道挣值计算题的完整步骤（不少于 5 步），
      要能直接照着做，包括怎么自查结果对不对。
    options: []
    answer: "列已知量、写公式、代入计算、判定正负与大小、用差值指数交叉验证、给结论"
    explanation_md: |
      可执行步骤：① 从题干摘出 PV、EV、AC（注意单位统一，别把万元和元混用）
      ② 先写公式再代入，不要跳步：CV=EV−AC、SV=EV−PV、CPI=EV/AC、SPI=EV/PV
      ③ 算出数值并保留两位小数 ④ 判定：差值**负为不利**，指数**小于 1 为不利**
      ⑤ **交叉自查**：CV<0 必须对应 CPI<1，SV<0 必须对应 SPI<1，不一致就是公式错了
      ⑥ 落到结论句：成本超支/节约多少，进度提前/落后多少。

      **第 ⑤ 步是保命动作**——考场上没时间重算一遍，但用差值和指数互相验证只要 10 秒，
      能拦住绝大多数公式记反的错误。另外注意 EAC 类题要看清是「按当前绩效继续」
      （EAC=BAC/CPI）还是「剩余工作按计划绩效」（EAC=AC+BAC−EV）。
    source: manual

  - id: RK-S1-016
    module_id: S1
    kp_id: KP-0102
    category: 中项·S1 项目管理框架
    type: 实操
    difficulty: medium
    level: 2
    title: 写出五大过程组各自的产出
    body_md: |
      不看资料，写出五大过程组（启动、规划、执行、监控、收尾）各自的核心产出。
      每个过程组至少写 2 项，并说明「这一步不做会出什么问题」。
    options: []
    answer: "五组各≥2项产出，且每组都说明缺失后果；监控要写变更控制，收尾要写验收与归档"
    explanation_md: |
      参考答案：**启动**→项目章程、干系人登记册（缺了就没有授权，项目经理名不正言不顺）；
      **规划**→项目管理计划、范围/进度/成本基准、风险登记册（缺了就没有基准，后面无处对比偏差）；
      **执行**→可交付成果、团队建设成果、质量数据（缺了就没有产出）；
      **监控**→绩效报告、变更请求及控制结果（缺了偏差无人发现，范围无声蔓延）；
      **收尾**→验收文件、最终产品移交、经验教训、资源释放（缺了项目关不掉，尾款收不回）。

      **这题的价值在「缺了会怎样」这一列**：只背产出清单是 L2 的记忆，
      能说出后果才证明你真的理解每个过程组的作用。
    source: manual

  - id: RK-S1-017
    module_id: S1
    kp_id: KP-0104
    category: 中项·S1 项目管理框架
    type: 实操
    difficulty: hard
    level: 4
    title: 选组织结构并说明理由
    body_md: |
      场景：某公司同时承接 12 个政务项目，各项目共用一批数据库和安全工程师。
      公司希望统一调配专家资源、又要保证每个项目有人对结果负责。
      请判断该用哪种组织结构（职能型/项目型/矩阵型，矩阵型还要说明弱、平衡、强），
      并写出你的判断依据与这种结构的两个主要风险。
    options: []
    answer: "选强矩阵或平衡矩阵，依据是资源共享需求+项目经理需对结果负责；风险是双重汇报与资源争夺"
    explanation_md: |
      判断链条：**需要跨项目共享稀缺专家**（否定项目型——那会按项目切分资源，专家无法复用）；
      **又要求有人对项目结果负责**（否定职能型——职能型里项目经理没有实权）。

      落到**强矩阵或平衡矩阵**：项目经理对进度成本负责，职能经理管人与技术标准。

      两个主要风险：① **双重汇报**——成员同时听项目经理和职能经理，冲突时不知道该听谁；
      ② **资源争夺**——12 个项目抢同一批专家，必须有组织级优先级机制（这正是 PMO 该管的）。

      答题要点：结论 + 依据 + 风险三段齐全，只写「选强矩阵」不写依据，最多得三分之一的分。
    source: manual

  - id: RK-S2-021
    module_id: S2
    kp_id: KP-0201
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: medium
    level: 2
    title: 写项目章程的要点
    body_md: |
      写一份项目章程应包含的要点（不少于 6 项）。假设项目是「某市政务数据共享平台建设」。
      每项写清「写什么内容」，不要只写标题。
    options: []
    answer: "覆盖项目目的、可交付成果、里程碑、预算、项目经理授权、主要干系人、审批要求"
    explanation_md: |
      合格章程包含：① 项目目的与业务背景 ② 可测量的项目目标（范围/进度/成本/质量）
      ③ 主要可交付成果 ④ 总体里程碑 ⑤ 总体预算 ⑥ **项目经理的授权范围**（能签多少、能调动什么）
      ⑦ 主要干系人与发起人 ⑧ 审批要求与批准人。

      **最容易漏也最关键的是第 ⑥ 项「授权」**——章程的本质是**授权文件**，不是项目简介。
      没有授权条款，项目经理在跨部门协调时没有任何依据，这是很多项目一开局就卡住的原因。
    source: manual

  - id: RK-S2-022
    module_id: S2
    kp_id: KP-0203
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 4
    title: 写团队冲突的处理行动清单
    body_md: |
      场景：项目进入联调阶段，开发和测试两个小组互相指责——开发说测试用例不合理、
      测试说开发提交质量差。冲突已经影响每日站会。
      写出你的处理行动清单（不少于 5 条），每条要写「谁做什么、什么时候、达到什么效果」。
    options: []
    answer: "先隔离情绪再对事实、共同评审用例与准入标准、定缺陷分级与回归规则、设升级机制、跟踪验证"
    explanation_md: |
      可执行清单：① **分别听取双方事实**（不是先开会互怼），各 30 分钟，产出问题清单
      ② 组织**共同评审测试用例与提测准入标准**，把「什么叫可提测」写成可判定条目
      ③ 明确**缺陷分级标准**与回归责任，避免互相推诿 ④ 设**升级机制**：争议超过 1 天由项目经理裁定
      ⑤ 一周后复盘，看站会是否恢复正常节奏。

      处理冲突的关键顺序是**先对事实、再对规则、最后才谈态度**。一上来就讲「大家要团结」，
      问题一件没解决，两周后照旧。
    source: manual

  - id: RK-S2-023
    module_id: S2
    kp_id: KP-0204
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 4
    title: 写一份项目状态报告要点
    body_md: |
      写一份月度项目状态报告的要点（不少于 6 项）。要求：读报告的人能在 3 分钟内判断
      「项目现在到底什么状态、需不需要他做决定」。
    options: []
    answer: "结论前置、进度成本偏差及原因、风险与问题、需决策事项、下月计划、附数据口径"
    explanation_md: |
      合格结构：① **一句话结论**（绿灯/黄灯/红灯 + 核心理由）② 进度与成本的偏差数据
      （用挣值：SPI/CPI 或实际 vs 基准）③ 偏差原因分析 ④ 主要风险与已发生问题及应对
      ⑤ **需要上级决策的事项**（写清「请你决定什么、什么时候要答复」）⑥ 下月关键计划
      ⑦ 数据口径与截止日期。

      **两个最常见的问题**：一是结论藏在最后，领导读三屏还不知道项目好坏；
      二是只报状态不提决策请求，报告变成了「通知」，等出事后才说「当时报过」。
    source: manual

  - id: RK-S3-026
    module_id: S3
    kp_id: KP-0303
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 4
    title: 写一份 IT 服务目录与 SLA 要点
    body_md: |
      为某单位写一份 IT 服务目录与 SLA 的要点（不少于 6 项）。
      要区分「哪些服务必须有 SLA、哪些不必」，并说明理由。
    options: []
    answer: "覆盖服务分类、服务级别指标、响应与解决时限、可用性、计费、评价；区分核心与一般服务"
    explanation_md: |
      合格内容：① 服务分类（基础设施/应用/桌面/安全等）② **服务级别指标**（可用性、响应时间、
      解决时限、恢复时间 RTO）③ 服务时间与除外情形 ④ 双方责任边界 ⑤ 计费或成本分摊方式
      ⑥ 服务评价与违约处理。

      **必须区分轻重**：核心业务系统（如审批、支付）要有明确 SLA 和赔付条款；
      一般办公类服务写清「尽力而为」即可。给所有服务都套最高 SLA，等于没有 SLA——
      成本扛不住，承诺也无法兑现。
    source: manual

  - id: RK-S3-027
    module_id: S3
    kp_id: KP-0304
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 4
    title: 写一份架构决策记录
    body_md: |
      场景：团队在「单体应用」与「微服务拆分」之间争论了两周。请写出你的架构决策记录（ADR）
      要点（不少于 5 项），要求让三个月后接手的人能看懂「为什么这么选」。
    options: []
    answer: "覆盖背景与约束、备选方案、决策结论、理由与取舍、影响与后续条件"
    explanation_md: |
      ADR 标准结构：① **背景与约束**（团队规模、交付周期、运维能力、预算）
      ② **备选方案**（至少两个，写清各自代价）③ **决策结论**（选哪个）
      ④ **理由与取舍**（选了它放弃了什么）⑤ **影响**（对开发、部署、运维、后续演进的影响）
      ⑥ **失效条件**（什么情况下该重新评估这个决策）。

      **最容易被跳过的是第 ⑥ 项**——不写「什么时候该推翻它」，这个决策就会变成永久包袱。
      比如「团队超过 15 人且模块间独立发布需求强烈时，重新评估拆分」，这一句能省掉未来半年的争论。
    source: manual

  - id: RK-S3-028
    module_id: S3
    kp_id: KP-0307
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 4
    title: 写一份系统集成测试方案要点
    body_md: |
      为「机房改造 + 网络设备 + 服务器 + 应用系统」的一体化项目写集成测试方案要点（不少于 6 项）。
      要说明「为什么集成测试不能由各厂商各测各的」。
    options: []
    answer: "覆盖测试范围与边界、环境与数据、接口测试、性能与压力、故障切换、责任划分与准出判据"
    explanation_md: |
      合格方案：① 测试范围与接口清单（谁和谁对接）② 测试环境与数据准备 ③ **接口联调测试**
      （协议、字段、时序、异常返回）④ 性能与压力测试 ⑤ **故障切换与回退验证**
      ⑥ 各方责任划分与问题定界方法 ⑦ **准出判据**（缺陷等级与数量门槛）。

      **为什么不能各测各的**：每个厂商只验证「自己的设备在实验室正常」，而系统故障
      绝大多数出在**交界处**——接口字段不一致、时序不匹配、单点故障无人负责。
      集成测试的核心价值就是**把责任边界上的灰区暴露出来并提前定责**，否则上线后互相推诿。
    source: manual

  - id: RK-S5-017
    module_id: S5
    kp_id: KP-0503
    category: 中项·S5 法规与职业道德
    type: 实操
    difficulty: hard
    level: 5
    title: 写一段拒绝隐瞒延期的说明
    body_md: |
      情形：项目已确定延期 3 周，客户方对接人私下要求你「先别说，等他向上汇报完再提」。
      请写出你的应对说明（不少于 4 条）：你怎么回应、依据是什么、后续怎么留痕。
    options: []
    answer: "说明必须如实报告、给出缓冲时间但不隐瞒、书面留痕、按合同约定渠道通报"
    explanation_md: |
      合格答案：① **明确拒绝隐瞒**，但给对方留出沟通窗口（如「今天内我不发正式函，
      但最迟明天下班前必须按合同约定通报」）② 说明依据：延期属重大事项，合同通常约定
      知情与通报义务，隐瞒会扩大双方损失，也违反职业诚信 ③ **书面留痕**：把沟通结果邮件确认
      （「按今日沟通，于 X 时前正式通报延期情况」）④ 按约定渠道向客户项目负责人与监理报告
      ⑤ 同步内部，让公司知晓风险。

      **这道题的关键是「不全盘顺从、也不硬刚」**：直接翻脸会把关系搞僵，
      完全照办则把职业风险全揽到自己身上。正确做法是**给出有限的缓冲 + 明确截止 + 全程留痕**。
      留痕不是防人，是让事后能说清「谁在什么时候知道了什么」。
    source: manual

  # ── 2026-10-29 补格：S1 空缺的 12 个「知识点 × 层级」 ──
  # 判据：L1 认得（识别名词/产出）· L2 说得出（讲清区别）· L3 套用（按规则判）
  #      L4 判得准（给情境判对错）· L5 迁得动（落到自己项目）
  - id: RK-S1-018
    module_id: S1
    kp_id: KP-0101
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 3
    title: 新增需求但工期预算都不许动
    body_md: |
      某政务项目已执行 6 个月，客户要求在原有范围内新增一个数据共享接口，
      同时明确「工期不能延、预算不能加」。按项目管理的三重约束，项目经理应当：
    options:
      - 直接安排开发，因为接口工作量不大
      - 走变更流程评估影响，请客户在「延长工期、追加预算、削减等量范围」中做出取舍
      - 拒绝变更，因为合同已经签订
      - 先做出来，验收时和其他变更一起结算
    answer: "B"
    explanation_md: |
      范围、进度、成本三者联动，任何一方增加，另两方必受影响。客户要求「加范围、不加时间也不加钱」，
      这在三重约束下是不成立的——必须有一方让步，而**让步由谁做是客户的决策，不是项目经理自作主张**。

      A 与 D 的错法本质相同：都是绕开流程先干，结果是范围无声蔓延、后期无人认账。
      C 看似守规矩，但项目管理不禁止变更，禁止的是**不评估就接受**。

      判据一句话：**变更可以接，但「接」的动作必须包含影响分析和一次明确的取舍确认。**
    source: manual

  - id: RK-S1-019
    module_id: S1
    kp_id: KP-0101
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: hard
    level: 4
    title: 关于渐进明细与项目终点的四个判断
    body_md: |
      关于项目特征与项目管理，下列说法正确的是：
    options:
      - 项目开始时需求说不清楚，说明项目经理的前期工作没做到位
      - 渐进明细意味着早期只有大方向是正常的，应据此安排分阶段评审，让细节随推进逐步确定
      - 项目结束的标志是把产品交付给客户
      - 项目一旦立项，范围和目标就应当固定下来不再调整
    answer: "B"
    explanation_md: |
      渐进明细是项目的**固有属性**，不是管理失职。早期只有大方向、需求随推进逐步清晰，是正常状态；
      管理动作对应的是**分阶段评审与逐步细化**，不是要求一开始就全说清。所以 A 错、B 对。

      C 错在不完整：交付只是其中一步，收尾过程组还要求验收、移交、归档、经验教训总结、资源释放。
      实务上「交付了但没验收、没归档」的项目，事后追责和二期复用都无处下手。

      D 错在把「可变更」当成「不应变」。项目本来就是在不确定中推进的，正确做法是**让变更走流程、
      留痕迹、更新基准**，而不是禁止变更。

      这题的四个选项分别踩中四个常见误区：把属性当失误、把交付当结束、把稳定当不变。
    source: manual

  - id: RK-S1-020
    module_id: S1
    kp_id: KP-0102
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: easy
    level: 1
    title: 哪个产出属于监控过程组
    body_md: |
      下列产出中，属于监控过程组的是：
    options:
      - 项目章程
      - 工作绩效报告与变更请求
      - 可交付成果
      - 项目最终验收与归档文件
    answer: "B"
    explanation_md: |
      五个过程组的典型产出要能一一对上：

      | 过程组 | 典型产出 |
      | --- | --- |
      | 启动 | 项目章程、相关方登记册 |
      | 规划 | 各专项计划、范围/进度/成本基准 |
      | 执行 | 可交付成果、工作绩效数据 |
      | 监控 | 工作绩效报告、变更请求、变更控制结果 |
      | 收尾 | 最终验收、移交、归档、经验教训 |

      A 是启动，C 是执行，D 是收尾。**注意「工作绩效数据」和「工作绩效报告」不是一回事**：
      数据是执行中产生的原始记录（属执行），报告是经过分析比对的结论（属监控）。这一对是中项卷面上
      反复出现的细节点。
    source: manual

  - id: RK-S1-021
    module_id: S1
    kp_id: KP-0102
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 3
    title: 质量保证与质量控制分别落在哪个过程组
    body_md: |
      关于质量保证与质量控制，下列说法正确的是：
    options:
      - 两者都属于执行过程组，只是叫法不同
      - 质量保证属执行过程组（保证过程符合标准），质量控制属监控过程组（检查结果是否合格）
      - 质量保证属监控过程组，质量控制属执行过程组
      - 两者都属于监控过程组，区别只在检查的时机
    answer: "B"
    explanation_md: |
      记忆法：**保证是「做事时保证」，控制是「做完后检查」**。

      - 质量保证（执行）：查的是**过程**——按不按规程做、有没有用对工具，动作发生在生产过程中
      - 质量控制（监控）：查的是**结果**——抽检、测试、比对规格，动作发生在产出之后

      所以归属不同：前者在执行过程组，后者在监控过程组。

      A 与 D 都把两者合并了，而它们在过程组归属上恰恰是分开的——考题就爱在这里设陷阱。
      C 是把两者对调，属于最常见的误答：因为「保证」听起来更像监督，实际它是过程中的动作。

      判据一句话：**问「过程对不对」→ 执行；问「结果合不合格」→ 监控。**
    source: manual

  - id: RK-S1-022
    module_id: S1
    kp_id: KP-0102
    category: 中项·S1 项目管理框架
    type: 实操
    difficulty: medium
    level: 5
    title: 把自己项目套进五个过程组并找出最弱的一环
    body_md: |
      拿一个你实际参与过的项目（或正在做的项目），完成三件事：
      1. 为五个过程组各写出 2 个真实发生过的具体动作（要能对应到具体时间或产物，不要写「进行了规划」这种空话）
      2. 指出哪个过程组在你的项目里最薄弱
      3. 写出判断它薄弱的**证据**（缺了什么产物、出了什么后果）
    options: []
    answer: "五组各2个可追溯的具体动作；指出最弱一组；用「缺了什么产物→导致什么后果」给出证据"
    explanation_md: |
      这题考的是迁移能力，评分重心在**第 3 问的证据**，不是第 1 问的清单。

      合格的样子（以某政务数据平台为例）：
      - **启动**：2026-03 召开项目启动会；2026-03 底签发项目章程（含审批签字页）
      - **规划**：4 月完成 WBS 三级分解；4 月 20 日出范围基准与进度基准
      - **执行**：5-8 月完成三个子系统开发；7 月组织两次团队建设与角色交接
      - **监控**：每两周出一次进度偏差报告；9 月对两次范围变更走了 CCB 审批
      - **收尾**：11 月完成验收测试报告；11 月底移交运维并归档文档

      **最弱的一环通常落在收尾或监控**，因为这两块最容易被「反正要上线了」挤掉。

      判断薄弱的证据必须成对出现：「没做 X」+「导致 Y」。例如
      「缺收尾的经验教训总结 → 二期同样的接口返工问题又出现一次，团队没人知道一期怎么解的」；
      「缺监控的变更记录 → 客户最后核对时对不上账，验收拖了三周」。

      只写「收尾做得不好」不构成证据，跟案例题里「只说缺收尾不给分」是同一条判据。
    source: manual

  - id: RK-S1-023
    module_id: S1
    kp_id: KP-0103
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 2
    title: 资源管理与采购管理的边界
    body_md: |
      关于资源管理与采购管理的分工，下列说法正确的是：
    options:
      - 从外部供应商采购服务器属于资源管理，因为服务器是项目要用的资源
      - 内部团队人员调配属于采购管理，因为人员也需要「获取」
      - 从外部采购货物或服务属于采购管理，内部团队人员的获取与建设属于资源管理
      - 两者是同一件事的两种叫法，取决于组织习惯
    answer: "C"
    explanation_md: |
      判据只看一条：**这个东西是「我们自己的」还是「从外面买来的」**。

      - 自己人（内部团队）、自有设备 → **资源管理**（获取资源、建设团队、管理团队）
      - 外购的货物、服务、外包成果 → **采购管理**（规划采购、实施采购、控制采购、结束采购）

      A 的错法很典型：被「资源」二字带走。服务器确实是资源，但**来源是外部采购**，
      按领域归属算采购管理。B 同理，内部人员调配不涉及外部合同，属资源管理。

      D 把两个领域合并了。它们在教材里是分开的两章，考试要求能分辨。
      一句话记忆：**买来的归采购，自己有的归资源。**
    source: manual

  - id: RK-S1-024
    module_id: S1
    kp_id: KP-0103
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: hard
    level: 4
    title: 从现象反推管理薄弱的领域
    body_md: |
      某系统上线后一个月内，客户提交了 60 多个缺陷，其中多数是功能能打开但计算结果不对、
      导出格式错乱。合同要求的功能点已全部交付，进度也按期完成。
      该项目最可能薄弱的环节是：
    options:
      - 范围管理
      - 沟通管理
      - 进度管理
      - 质量管理
    answer: "D"
    explanation_md: |
      用现象反推领域，判据是「问题出在哪一类事上」：

      - 功能**没做**、需求反复变 → 范围管理
      - 功能**做了但做错了**、缺陷率高、返工多 → **质量管理**
      - 一直延期、没有里程碑 → 进度管理
      - 各方理解不一致、会上才发现 → 沟通管理

      题干给了两个关键信号：**功能点全部交付**（排除范围）、**按期完成**（排除进度），
      而问题集中在「计算不对、格式错乱」——这是产出**合格不合格**的问题，属质量控制失守。

      讲义里那张反推表要当成硬判据背：**「做没做全」是范围，「做得好不好」是质量。**
      这题如果把「交付后被退回返工」误读成「需求没对齐」，就会错选 A。
    source: manual

  - id: RK-S1-025
    module_id: S1
    kp_id: KP-0104
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: easy
    level: 1
    title: 哪个不属于通用项目生命周期阶段
    body_md: |
      通用项目生命周期（预测型）的典型阶段是「启动 → 组织与准备 → 执行项目工作 → 结束项目」。
      下列不属于这四个阶段的是：
    options:
      - 启动
      - 组织与准备
      - 执行项目工作
      - 项目后评价
    answer: "D"
    explanation_md: |
      四个阶段对应的是**项目从生到死的四段**：启动（授权开始）、组织与准备（搭班子、定计划）、
      执行项目工作（干活）、结束项目（验收移交收尾）。

      **项目后评价不属于项目生命周期**。它发生在项目正式结束之后，由组织层（或上级主管部门）
      对项目效果、投资回报、运营表现做事后评估。把它算进生命周期，会把「项目内可控的事」
      和「项目外由组织承担的事」混为一谈。

      这也是判断题爱考的点：「项目后评价是项目收尾过程组的工作」——错，收尾是项目内的正式结束，
      后评价是项目外的组织行为。
    source: manual

  - id: RK-S1-026
    module_id: S1
    kp_id: KP-0104
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 2
    title: 生命周期三条曲线的规律
    body_md: |
      关于项目生命周期中「成本与人力投入」「风险与不确定性」「变更的代价」三条曲线，
      下列说法正确的是：
    options:
      - 风险与不确定性在执行阶段最高，因为那时工作最密集
      - 成本与人力投入在启动阶段最高，因为要组建团队
      - 变更的代价在项目早期最低，越往后越高
      - 三条曲线在生命周期内基本平稳，只在收尾时下降
    answer: "C"
    explanation_md: |
      三条曲线的规律一句话：**越早改越便宜，但越早越看不清。**

      | 维度 | 峰值/走势 |
      | --- | --- |
      | 成本与人力投入 | **执行阶段**最高（人最多、花钱最快） |
      | 风险与不确定性 | **启动阶段**最高（越往后越清楚，风险递减） |
      | 变更的代价 | 启动时最低，**越往后越高**（收尾改一个需求极贵） |

      A 与 B 都是把「感觉上最忙的阶段」当成了答案：执行阶段确实最忙（成本人力峰值），
      但风险最高的是最看不清的启动阶段。这两条**反直觉**，正是卷面上的高频错项。

      C 对。它的实践含义是：多花时间在前期需求评审与原型验证上，比后期返工便宜得多。
    source: manual

  - id: RK-S1-027
    module_id: S1
    kp_id: KP-0104
    category: 中项·S1 项目管理框架
    type: 实操
    difficulty: medium
    level: 5
    title: 用三个信号判断自己组织的结构
    body_md: |
      判断你所在组织（或你上一个项目所在的团队）属于哪种组织结构——职能型 / 弱矩阵 / 平衡矩阵 /
      强矩阵 / 项目型。要求：
      1. 用三个信号分别作答：团队成员是全职还是兼职、绩效考核权在谁手上、项目预算由谁批
      2. 写出结论，并说明依据是否一致（若三个信号打架，按哪一项定，为什么）
      3. 写出这种结构给你带来的**一个具体困难**，以及你实际用过或打算用的对策
    options: []
    answer: "三信号逐一作答→给结论→说明不一致时按权力最弱项定→指出一个结构性困难与对策"
    explanation_md: |
      评分重心在第 2 问「信号打架时怎么定」和第 3 问的「结构性困难」，不是结论本身。

      三个信号是判据，按顺序看：
      1. 团队**全职还是兼职** → 兼职多半是职能型或矩阵
      2. **绩效考核权**在部门经理手上 = 弱；在项目经理手上 = 强或项目型
      3. **预算谁批** → 部门批 = 弱；项目经理批 = 强或项目型

      **信号不一致时，按「权力最小的那一项」定**。因为组织结构对项目经理的真实约束，
      由最弱的那个环节体现——比如预算权在你手上、但考核权在部门经理，实际仍是弱矩阵，
      因为成员真正在意的是谁给他打绩效。

      第 3 问的合格答案要具体。反例：「困难是沟通不畅，对策是加强沟通」——不得分。
      正例：「成员考核在部门，我调度他们加班没有依据，只能靠人情；对策是让发起人在项目章程里
      写明项目优先级高于部门日常任务，并把关键节点的资源承诺写进部门经理的季度目标」。

      注意第 3 问的困难必须是**结构性**的（源于权力或资源安排），不是个人能力或态度问题。
    source: manual

  - id: RK-S1-028
    module_id: S1
    kp_id: KP-0105
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 2
    title: 五种权力来源的持久性
    body_md: |
      关于项目经理的五种权力来源及其持久性，下列说法正确的是：
    options:
      - 法定权最持久，因为它来自组织的正式任命
      - 惩罚权最持久，因为约束力最强、见效最快
      - 专家权与参照权最持久，惩罚权最容易失效
      - 奖励权与惩罚权最持久，因为它们直接关系个人利益
    answer: "C"
    explanation_md: |
      五种权力按「服从的理由」区分，持久性差别很大：

      | 权力 | 服从的理由 | 持久性 |
      | --- | --- | --- |
      | 法定权 | 他是这个职位 | 中（离岗即失） |
      | 奖励权 | 跟着有好处 | 弱（无奖励即失） |
      | 惩罚权 | 怕被罚 | 最弱（用多必反） |
      | 专家权 | 他真懂 | 强 |
      | 参照权 | 认同这个人 | 最强 |

      **法定权看起来最稳，其实只是「在位期间有效」**——一旦调岗或项目结束，权力立刻消失。
      **惩罚权见效最快但最不持久**：短期压得住，长期换来的抵触与离职。

      专家权与参照权不依赖职位，跟着人走，所以最持久。这也是为什么案例题里
      「项目经理靠处罚推项目、团队离心」的标准答法方向是「改用专业判断与信任建立」。

      记忆抓手：**靠位置来的权力会随位置消失，靠人来的权力才留得住。**
    source: manual

  - id: RK-S1-029
    module_id: S1
    kp_id: KP-0105
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 3
    title: 情境判断权力来源
    body_md: |
      新任项目经理小陈，团队里有几位比他年长、资历更深的工程师，起初对他并不信服。
      小陈的做法是：每次技术方案评审前自己先做一遍推演，评审时把关键假设、风险和取舍讲透，
      并主动承认自己判断错的地方。两个月后，工程师们遇到技术分歧会主动找他讨论，说「按他的思路走基本不会踩坑」。

      小陈主要依靠的是哪种权力？
    options:
      - 法定权
      - 奖励权
      - 惩罚权
      - 专家权
    answer: "D"
    explanation_md: |
      判据是「服从的理由」，题干的理由写得很明确：**「按他的思路走基本不会踩坑」**——
      团队听他的，是因为他判断得准、讲得透，这是**专家权**。

      为什么不是法定权（A）：法定权也能让人配合，但配合的理由是「他是这个职位」。
      题干特意写了「起初对他并不信服」，说明职位本身没有换来认同——这正是法定权的边界。

      为什么不是奖励权（D）：题干没有任何关于奖励、晋升、绩效的描述。

      **专家权与参照权容易混**，区分点是：佩服他的**本事**（懂行、判断准）是专家权；
      佩服他的**人**（愿意跟他干、信他这个人）是参照权。题干落在「思路不会踩坑」，
      指向本事，所以是专家权。

      补一句实践含义：小陈做对的地方是**主动承认判断错误**——这让专家权不变成「压人」，
      团队才敢提不同意见。只靠专业权威而不留纠错空间，长期会退化成单点依赖。
    source: manual

  # ── 2026-10-29 补格：S2 空缺的 14 个格子 ──
  - id: RK-S2-024
    module_id: S2
    kp_id: KP-0201
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 3
    title: 章程与项目管理计划的分工
    body_md: |
      关于项目章程与项目管理计划，下列说法正确的是：
    options:
      - 两者都由项目经理编制并发布
      - 章程是授权文件，回答「准不准做、谁负责」，发布权在发起人；计划是执行依据，回答「怎么做」，由项目经理整合编制、批准后执行
      - 章程批准后不得再修改，计划可以随时修改
      - 项目管理计划是章程的输入，先编计划再写章程
    answer: "B"
    explanation_md: |
      两者的关系是**授权在前、执行在后**，不能颠倒：

      | 对比项 | 项目章程 | 项目管理计划 |
      | --- | --- | --- |
      | 性质 | 授权文件 | 执行依据 |
      | 回答什么 | 准不准做、谁负责、边界在哪 | 怎么做、分几步、花多少 |
      | 谁发布 | 发起人 | 项目经理编制，批准后执行 |

      A 错在把两者都归给项目经理：项目经理可以**执笔**章程，但发布权在发起人——
      自己给自己授权的逻辑不成立。

      C 错在章程「不得修改」：章程批准后**可以改，但要走变更流程**。这一点和计划的区别
      只是「变更影响面更大」，不是「不可变」。

      D 把输入输出关系完全弄反了：章程是计划的**输入**，没有章程就没有授权，
      计划编制也失去依据。
    source: manual

  - id: RK-S2-025
    module_id: S2
    kp_id: KP-0201
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: medium
    level: 5
    title: 复盘自己项目立项时缺了什么
    body_md: |
      选一个你参与过的项目，做一次立项复盘：
      1. 该项目有没有正式的项目章程？谁签发的？章程里写没写「项目经理的授权范围」？
      2. 若章程缺失或内容不全，写出因此导致的一个具体后果（要能指出时间与事件）
      3. 写出如果重来一次，你会在章程里补哪三项内容，为什么是这三项
    options: []
    answer: "如实回答有无章程与授权条款；给出缺失导致的具体后果；补的三项要能对应到该后果"
    explanation_md: |
      这题不要求项目「有章程」，**没有也是有效答案**——重点在第 2、3 问的因果链。

      常见且合格的回答形态：
      - 事实：没有章程，只有一份会议纪要，项目经理的权限没写
      - 后果：第 3 个月要抽调运维部两名工程师，对方部门以「不在年初计划内」为由拒绝，
        理由是纪要上没有授权条款，最终由分管领导协调，项目停滞 11 天
      - 补三项：**项目经理的职责职权（能调什么、能签多少）**、**可测量的项目目标**、
        **发起人姓名与职权**（谁认账、升级找谁）

      为什么是这三项：它们分别对应「能不能动资源」「做成什么样算成功」「出了问题找谁」，
      是立项阶段最容易在后期引发争议的三处。

      反面答案：写「补项目背景和意义」——这类内容写在立项报告里就够了，
      章程的核心是**授权与边界**，不是项目简介。
    source: manual

  - id: RK-S2-026
    module_id: S2
    kp_id: KP-0202
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 三大基准各由什么构成
    body_md: |
      关于范围、进度、成本三大基准，下列说法正确的是：
    options:
      - 成本基准等于项目总预算，包含管理储备
      - 范围基准由范围说明书、WBS 与 WBS 词典构成，用来判断「做没做完」
      - 进度基准就是那张甘特图文件，改了重新导出即可
      - 三大基准一经批准不得修改
    answer: "B"
    explanation_md: |
      三大基准合起来构成**绩效测量基准**，各自对应一个判断问题：

      | 基准 | 构成 | 用来判断 |
      | --- | --- | --- |
      | 范围基准 | 范围说明书 + WBS + WBS 词典 | 做没做完 |
      | 进度基准 | 经批准的进度模型（含里程碑） | 快还是慢 |
      | 成本基准 | 经批准的分时段预算，**不含管理储备** | 超没超 |

      A 错在管理储备：**成本基准不含管理储备**，管理储备在此之外，动用需高层批准。
      这条几乎每套卷子都会设一个选项来考。

      C 错在把「基准」当成「文件」：基准的实质是**经过批准、受变更控制**的那份计划，
      甘特图只是它的表现形式。随手改了就重新导出，等于没有基准。

      D 错在「不得修改」：可以改，但**必须走变更控制流程**并同步更新。
    source: manual

  - id: RK-S2-027
    module_id: S2
    kp_id: KP-0202
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: 三份计划都做了，偏差却说不清
    body_md: |
      某项目按要求编制了范围、进度、成本三份计划，但都只经过项目组内部讨论，未提交审批。
      执行三个月后进度明显落后，项目经理拿实际进度与计划比对，却给不出「落后多少」的结论。
      若要求你判断根本问题，最准确的是：
    options:
      - 团队执行力不足，进度没有跟上
      - 计划未经批准，不构成基准，因此无法作为偏差比较的依据
      - 缺少关键路径分析，进度无法量化
      - 客户需求变更频繁，导致计划失效
    answer: "B"
    explanation_md: |
      题干的关键信息是**「未提交审批」**，不是「进度落后」。计划与基准的差别就在这道审批上：
      未批准的计划是内部草案，批准后的计划才是基准，基准才是比对的尺子。

      这解释了为什么项目经理「说不清落后多少」——不是他不会算，是**没有合法的比较对象**。
      拿草案当基准，任何偏差数字都站不住，一旦上会就会被质疑。

      A 把现象当原因；C 与 D 都属于「没有证据支撑的推测」——题干没有提到关键路径缺失，
      也没有提到需求变更。

      实践含义：**没有基准的项目，监控过程组整条链条是断的**——测量、比较、纠偏三步里
      第二步无对象。这也是为什么评审与批准不能被「反正是内部计划」跳过。
    source: manual

  - id: RK-S2-028
    module_id: S2
    kp_id: KP-0203
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 哪个活动属于执行过程组
    body_md: |
      下列活动中，属于执行过程组的是：
    options:
      - 制定项目章程
      - 创建 WBS
      - 建设团队与管理团队
      - 控制质量
    answer: "C"
    explanation_md: |
      判据是「在定规矩，还是在按规矩干活」：

      - 制定项目章程 → **启动**
      - 创建 WBS → **规划**（规划组的前三步是收集需求、定义范围、创建 WBS）
      - 建设团队与管理团队 → **执行**（跟人打交道的活大多在执行组）
      - 控制质量 → **监控**

      执行过程组的核心特征是「把计划变成成果，同时把人管住」，典型过程包括
      指导与管理项目工作、管理项目知识、获取资源、建设团队、管理团队、管理沟通、
      实施风险应对、实施采购、管理相关方参与。

      一个易错点：**控制质量容易被归到执行**，因为它发生在生产现场。但「控制」两个字
      决定了它属于监控——它在检查结果，不是在产出结果。
    source: manual

  - id: RK-S2-029
    module_id: S2
    kp_id: KP-0203
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 3
    title: 判断团队处在塔克曼哪一阶段
    body_md: |
      某项目团队组建两个月后，成员已认同共同约定的评审流程与分工，日常协作顺畅，
      偶有技术分歧也能按既定规则自行解决，整体效率明显回升。
      按塔克曼阶梯，该团队当前处于：
    options:
      - 形成期
      - 震荡期
      - 规范期
      - 成熟期
    answer: "C"
    explanation_md: |
      塔克曼五阶段顺序固定：**形成期 → 震荡期 → 规范期 → 成熟期 → 解散期**。

      各阶段的判别信号：

      | 阶段 | 典型表现 |
      | --- | --- |
      | 形成期 | 客气、试探，依赖项目经理指派 |
      | 震荡期 | 冲突集中，方案争执、角色不清 |
      | **规范期** | 规则建立并被接受，协作开始顺畅，分歧能按规则解决 |
      | 成熟期 | 高度自组织，无需项目经理推动即可高效运转 |

      题干三个信号都指向规范期：**已认同规则**、**按既定规则解决分歧**、**效率回升**
      （说明刚走出震荡）。选成熟期（D）的偏差在于：成熟期的特征是「不需要项目经理推动」，
      题干还在强调「按约定规则」，说明规则仍在起作用而非内化。

      为什么要分清这两阶段：**规范期是建立规则的窗口，成熟期是授权与扩责的窗口**。
      在规范期就大撒手，团队会退回震荡；在成熟期仍事必躬亲，团队会退化成依赖。
    source: manual

  - id: RK-S2-030
    module_id: S2
    kp_id: KP-0203
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 5
    title: 给落在震荡期的团队写建设动作
    body_md: |
      场景：团队组建 5 周，成员对技术路线分歧严重，两次评审会不欢而散，
      已有 1 名骨干提出调岗。项目经理只有协调权，无考核权。
      请写出你的团队建设动作清单（不少于 5 条），每条写「做什么、什么时候、预期改变什么」。
      另外回答一句：为什么这个阶段不建议直接更换提调岗的成员？
    options: []
    answer: "5条可执行动作（建立决策规则/明确角色/一对一沟通/小范围试点/认可机制）；换人会把团队重置回形成期"
    explanation_md: |
      先定性：这是典型的**震荡期**，不是管理失败，是团队成长的必要阶段。动作方向是
      「建规则、明角色」，不是「压冲突、换人」。

      合格的动作清单（无考核权时的打法）：
      1. **一周内分别与 5 名核心成员一对一沟通**，各自说清分歧点与真实顾虑，产出问题清单
      2. **两周内组织一次技术路线评审会**，会前明确规则：只对事、每方各 15 分钟陈述、
         争议点当场记录，不当场表决
      3. **明确角色与决策方式**：谁定技术方案、争议超过 1 天谁裁定，写成一页纸贴在项目看板
      4. **选一个小模块做并行试点**（两条路线各做一周），用数据代替争论
      5. **建立认可机制**：对提出有效反驳的成员公开认可（奖励「说清楚问题」，
         而不是奖励「加班最晚」）
      6. 一个月后复盘：站会是否恢复节奏、分歧是否在会前解决

      **为什么不建议直接换人**：更换成员会把团队**重置回形成期**——新人进来，
      信任与默契要从头建立，震荡期再来一遍。而且「提出不同意见就走人」会形成示范效应，
      剩下的人不再说真话，冲突转入地下，比明面争执更难处理。

      注意第 5 条的细节：奖励加班属于**反向激励**，会诱导无效加班，这是教材明确点过的坑。
    source: manual

  - id: RK-S2-031
    module_id: S2
    kp_id: KP-0204
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 3
    title: 成本有余量但对返工敏感时怎么压缩工期
    body_md: |
      项目进度落后 3 周，客户要求按原日期交付。当前成本尚有结余，但项目对返工风险高度敏感
      （系统要过等保测评，返工会导致重新送审）。
      若必须压缩工期，应优先采用：
    options:
      - 快速跟进，把原本顺序执行的活动改为并行
      - 赶工，增加资源或安排加班，用成本换时间
      - 直接削减部分非核心功能
      - 与客户协商调整里程碑日期
    answer: "B"
    explanation_md: |
      两种进度压缩手段的代价不同，选哪个看**项目怕什么**：

      | 手段 | 做法 | 代价 |
      | --- | --- | --- |
      | 赶工 | 加资源、加班 | **推高成本**，风险基本不变 |
      | 快速跟进 | 顺序工作改并行 | 增加**返工与质量风险** |

      题干把条件写全了：**成本有余量**（能承受赶工的代价）、**对返工风险敏感**（不能承受并行的代价），
      所以选赶工。

      C 削减范围属于范围变更，要走变更流程并由客户确认，不是项目组的进度手段。
      D 是放弃目标，不是压缩工期。

      **反向情形要记住**：如果是「成本已被锁死、但可以接受一定返工」，就该选快速跟进。
      考题只是把这两个条件对调，答案就反过来——所以不能只背「压缩工期用赶工」。
    source: manual

  - id: RK-S2-032
    module_id: S2
    kp_id: KP-0204
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 5
    title: 写一条完整的偏差处理链条
    body_md: |
      场景：某项目第 4 个月末的监控数据显示，开发模块的实际进度比计划落后约 15%，
      成本已花掉预算的 22%。团队解释是「接口对接比预想复杂」。
      请按监控过程组的逻辑，写出你的完整处理链条（不少于 5 步），每步写「做什么、产出什么」。
      最后说明：什么情况下你会提出变更请求，而不是自己纠偏？
    options: []
    answer: "测量→定性(是否关键路径)→分析原因→提出纠偏→更新计划与留痕；影响基准时必须走变更"
    explanation_md: |
      标准链条是「发现偏差 → 分析原因 → 提出纠偏或变更 → 更新计划 → 跟踪验证」，缺一环就断。

      合格的作答（每步带产出）：
      1. **核实数据**：确认 15% 落后的口径（按什么基准、含不含未验收部分），产出偏差说明
      2. **判断影响**：查落后的是否在关键路径上、总时差是否够——**不在关键路径且时差足够，
         完工日期可能不受影响**，这一步决定后面是「纠偏」还是「只观察」
      3. **分析原因**：接口复杂的真实原因是什么（对方系统无文档、联调窗口不足、需求未冻结），
         产出根因清单
      4. **提出纠偏措施**：加派接口联调人力、与对方约定联调窗口、先做桩测试，
         产出措施清单与责任人
      5. **更新计划并留痕**：更新进度计划与偏差记录，产出更新的项目文件
      6. **跟踪验证**：两周后复查是否回到偏差阈值内

      **什么时候必须提变更请求而不是自己纠偏**：当处理方式会**改动基准或已批准的范围/进度/成本**
      时——比如要延长工期、追加预算、削减交付内容。这些已超出项目经理的处置权限，
      必须走整体变更控制。

      自己纠偏只适用于**不触碰基准的调整**，比如重排人力、优化联调顺序。
      这条界线画不清，就会出现「项目经理私自延期」这类严重问题。
    source: manual

  - id: RK-S2-033
    module_id: S2
    kp_id: KP-0205
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 哪项不属于收尾阶段的工作
    body_md: |
      下列工作中，不属于收尾过程组应完成的是：
    options:
      - 移交最终产品并取得接收方确认
      - 归档项目文件与合同资料
      - 释放项目资源，安排人员返岗
      - 编制下一阶段的风险应对计划
    answer: "D"
    explanation_md: |
      收尾过程组只有一个过程——**结束项目或阶段**，但要完成六件事：
      ① 确认全部计划工作已完成并通过验收 ② 移交最终成果 ③ 归档项目文件
      ④ 释放资源 ⑤ 总结并归档经验教训 ⑥ 人员安置与必要庆功。

      A、B、C 分别对应第 ②③④ 项。D 属于**规划过程组**的工作：风险应对计划是项目计划的一部分，
      即使是为后续阶段编制，也发生在规划里，不是收尾动作。

      这类题的错误选项常常「看起来跟结束有关」——比如「编制下一阶段计划」。
      判据是：**收尾是关闭，不是开启**。凡是「为下一步做准备」的，都不在收尾组。
    source: manual

  - id: RK-S2-034
    module_id: S2
    kp_id: KP-0205
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 3
    title: 五份合同的收尾次数
    body_md: |
      某项目在执行期间共签订 5 份采购合同，项目正常完工。
      关于收尾执行的次数，正确的是：
    options:
      - 行政收尾 5 次，合同收尾 1 次
      - 行政收尾与合同收尾各 5 次
      - 行政收尾与合同收尾各 1 次
      - 行政收尾 1 次，合同收尾 5 次
    answer: "D"
    explanation_md: |
      分清两者的对象就自然清楚了：

      | 对比项 | 行政收尾 | 合同收尾 |
      | --- | --- | --- |
      | 对象 | 整个项目或阶段 | **每一份具体合同** |
      | 关注 | 文档归档、验收完成、资源释放 | 条款履行完毕、索赔结清、尾款支付 |
      | 在哪完成 | 结束项目或阶段 | **控制采购**（旧版单列「结束采购」） |

      一个项目只有一个整体，所以**行政收尾只做一次**；有几份合同就要结几次，
      所以**合同收尾做 5 次**。

      **两个附带考点**：① 合同收尾的归属过程是控制采购，不在收尾过程组——这是判断题的高频坑；
      ② 即使是分阶段项目，行政收尾按阶段各做一次，但合同收尾的次数仍然由合同数量决定。
    source: manual

  - id: RK-S2-035
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: 偏差已纠正时 EAC 该用哪个公式
    body_md: |
      某项目 BAC = 500 万元。检查点时 EV = 180 万元，PV = 200 万元，AC = 200 万元。
      项目经理查明超支源于前期一次性的设备采购溢价，已与供应商重新议价，
      剩余工作将按原预算执行。则 EAC 为：
    options:
      - 约 555.6 万元（BAC ÷ CPI）
      - 520 万元（AC + (BAC − EV)）
      - 500 万元（BAC）
      - 约 476.2 万元（EV ÷ CPI）
    answer: "B"
    explanation_md: |
      这题考的不是算术，是**公式选择**——「已议价纠正、剩余按原预算」＝**非典型偏差**。

      非典型偏差（偏差是偶发的、已纠正）：**EAC = AC + (BAC − EV)** = 200 + (500 − 180) = **520 万元**。

      典型偏差（偏差会持续到完工）：EAC = BAC ÷ CPI = 500 ÷ (180÷200) = 500 ÷ 0.9 ≈ 555.6 万元，
      正是 A 项——**这是最像的干扰项**，算得对但前提不成立。

      C 项等于假设「超支的那 20 万不用补」，忽略了已花出去的钱不可追回。
      D 项公式本身就错（EAC 不可能小于 BAC，除非节约）。

      判据记牢：题里出现「**已纠正**」「**查明原因并采取措施**」「剩余**按原计划**」→ 非典型；
      出现「**按当前趋势继续**」「**未采取任何措施**」→ 典型。
      看清这一句再动手算，比先算完再猜要省时间。
    source: manual

  - id: RK-S2-036
    module_id: S2
    kp_id: KP-0207
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 变更流程的第一步
    body_md: |
      按标准的变更控制流程，接到变更诉求后的第一步是：
    options:
      - 组织影响分析，评估对范围、进度、成本的影响
      - 提交 CCB 审批
      - 提出书面变更申请并纳入变更日志
      - 更新相关基准与配置项
    answer: "C"
    explanation_md: |
      六步流程的顺序不能换：**① 提出书面变更申请 → ② 记录并初审 → ③ 影响分析 →
      ④ CCB 审批 → ⑤ 实施变更 → ⑥ 验证并归档**。

      所以第一步是**书面化**，不是影响分析。A 是第三步，B 是第四步，D 是第六步的内容。

      **为什么第一步必须是书面申请**：口头诉求无法界定范围、无法追溯、无法作为后续
      审批与验收的依据。先书面化，才有对象可分析、可审批、可记录。

      **两个附带考点**：
      - CCB 是**审批机构**，不是执行机构——它决定做不做、什么时候做，不负责写方案、
        不改代码。
      - 变更**被否决也要记录**，用来避免同一变更被反复提出，也为复盘留依据。
    source: manual

  - id: RK-S2-037
    module_id: S2
    kp_id: KP-0207
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 变更控制与配置管理是什么关系
    body_md: |
      关于变更控制与配置管理的关系，下列说法正确的是：
    options:
      - 两者是同一件事的不同叫法，选一个执行即可
      - 配置管理是变更控制的底座：变更批准后须同步更新配置项版本与基线，否则会出现文档是旧的、系统是新的
      - 配置管理只在项目收尾时统一做一次
      - 变更控制只管理文档类变更，代码变更不属于其范围
    answer: "B"
    explanation_md: |
      两者的分工是**管状态 vs 管变动**：

      - 配置管理回答「现在是什么版本、谁改了什么」——四个动作：识别配置项、建立基线、
        **版本控制**、配置审计
      - 变更控制回答「能不能改、改完怎么落地」——六步流程，批准后同步更新基准

      没有配置管理，变更控制就会「改完找不到新旧版本」；没有变更控制，配置管理只剩
      「存了一堆版本」而没有约束。所以 B 说的「底座」关系是准确的。

      A 把两者合并，忽略了它们解决的是不同问题；C 错在「只在收尾做一次」——
      版本控制是持续动作；D 错在把代码排除在配置项之外，**代码、配置、文档都是配置项**。

      一句话记住：**变更批准后不更新配置项版本，下一次监控就会拿新实际比旧基准，
      偏差全是假的。**
    source: manual

  # ── 2026-10-29 补格：S3 空缺的 16 个格子 ──
  - id: RK-S3-029
    module_id: S3
    kp_id: KP-0301
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 2
    title: 新基建三类怎么分
    body_md: |
      关于新型基础设施建设的三类划分，下列说法正确的是：
    options:
      - 信息基础设施指被数字化改造的传统基础设施
      - 融合基础设施指新建的通信网络、算力与新技术平台
      - 创新基础设施指支撑科学研究与技术开发的设施，如重大科技基础设施、产业技术创新平台
      - 三类基础设施互相独立，一个项目只能属于其中一类
    answer: "C"
    explanation_md: |
      三类的判别口径是**「新建的数字底座、被改造的老基建、搞研发用的」**：

      | 类别 | 指向 | 例子 |
      | --- | --- | --- |
      | 信息基础设施 | 通信网络、新技术、算力 | 5G、数据中心、人工智能平台、工业互联网 |
      | 融合基础设施 | 传统基建被数字化改造 | 智能交通、智慧能源、智慧水利 |
      | 创新基础设施 | 支撑科研与技术开发 | 重大科技基础设施、科教基础设施、产业技术创新设施 |

      A 与 B 正好把前两类对调了——这是本题最像的干扰项。判别的关键在**对象是不是既有的传统设施**：
      数据中心原来不存在，属新建（信息）；供水管网本来就存在，属改造（融合）。

      D 错在绝对化。一个项目可以同时具备多重属性，比如智慧高速既含新建的感知网络，
      也含对既有道路的改造。分类是**看主要矛盾**，不是排他性归属。
    source: manual

  - id: RK-S3-030
    module_id: S3
    kp_id: KP-0301
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 3
    title: 数字产业化还是产业数字化
    body_md: |
      某市规划四个项目：① 引进芯片封装测试生产线；② 建设面向本地制造企业的工业互联网平台；
      ③ 培育本地云服务与软件外包产业；④ 对全市柑橘种植基地做数字化改造。
      按数字经济的构成，属于「产业数字化」的是：
    options:
      - ①③
      - ③④
      - ①②
      - ②④
    answer: "D"
    explanation_md: |
      数字经济的两个组成部分，判别口径是「**谁在用信息技术**」：

      | 类型 | 含义 | 判别 |
      | --- | --- | --- |
      | 数字产业化 | 把信息技术本身做成产业（芯片、软件、云服务） | 产出的是**信息技术产品与服务** |
      | 产业数字化 | 用信息技术改造传统产业 | 主体是**传统产业**，用技术提升自己 |

      - ① 芯片封装测试 → 产出半导体，属数字产业化
      - ② 工业互联网平台服务本地制造企业 → 传统制造业被改造，属产业数字化
      - ③ 云服务与软件外包 → 产出软件服务，属数字产业化
      - ④ 柑橘基地数字化改造 → 农业被改造，属产业数字化

      结论是 ②④，选 B。

      **附带一条高频判断**：**产业数字化是主战场**，因为传统产业的体量远大于信息产业本身。
      考题常把「数字产业化是主战场」作为错误选项。
    source: manual

  - id: RK-S3-031
    module_id: S3
    kp_id: KP-0302
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: easy
    level: 1
    title: 哪些设备属于物联网感知层
    body_md: |
      按物联网三层架构，下列设备中属于感知层的是：
    options:
      - 核心交换机
      - 温湿度传感器与 RFID 读写器
      - 数据中心的业务应用服务器
      - 5G 基站
    answer: "B"
    explanation_md: |
      物联网三层架构是必考，各层职责如下：

      | 层 | 干什么 | 典型组成 |
      | --- | --- | --- |
      | **感知层** | 采集数据、识别对象 | 传感器、RFID、摄像头、二维码 |
      | 网络层 | 传输数据 | 接入网、承载网、5G 基站、交换机 |
      | 应用层 | 处理数据、支撑业务 | 业务平台、应用服务器、行业应用 |

      所以 B 属感知层。A 与 D 属网络层，C 属应用层。

      感知层的关键词是「**采集与识别**」——凡是「把物理世界的状态变成数据」的，都在这一层。
      RFID 的核心价值是非接触式自动识别，常用于物流与资产管理，这一点也常单独考。
    source: manual

  - id: RK-S3-032
    module_id: S3
    kp_id: KP-0302
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 4
    title: 政务存证该选哪种链
    body_md: |
      某市要把 12 个委办局的审批结果做成不可篡改的电子存证，参与方固定为这 12 家单位，
      不对外公开，且要求出现争议时能追溯完整操作记录。技术上最合适的选择是：
    options:
      - 公有链，任何人都可以参与记账
      - 联盟链，由 12 家单位共同组成准入联盟
      - 私有链，由牵头单位单独运维、其他单位只读
      - 用传统数据库加定时备份即可，不需要区块链
    answer: "B"
    explanation_md: |
      区块链按准入分三类，选型判据是「**谁能参与、要谁认账**」：

      | 类型 | 谁能参与 | 典型场景 |
      | --- | --- | --- |
      | 公有链 | 任何人 | 加密货币 |
      | **联盟链** | 特定机构组成的联盟 | 供应链金融、**政务存证** |
      | 私有链 | 单一组织内部 | 内部审计 |

      题干三个条件正好指向联盟链：**参与方固定（12 家）**、**不对外公开（准入控制）**、
      **需要多方互认（争议时能追溯）**。

      A 的公有链任何人都能参与，与「参与方固定、不公开」矛盾，且性能与合规都不适配政务场景。
      C 的私有链由一家单独运维，等于「裁判和运动员同一家」，其他单位不会认可其公信力——
      存证的价值恰恰在于**多方共同背书**。

      D 是常见误答：数据库加备份解决的是「不丢」，解决不了「谁改过、谁认账」。
      不可篡改与可追溯是区块链的立身之本，也是争议场景的核心诉求。

      **考试趋势**：近年更爱考联盟链，因为它才对应绝大多数企业级与政务场景。
    source: manual

  - id: RK-S3-033
    module_id: S3
    kp_id: KP-0303
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 2
    title: IT 服务生命周期的闭环特征
    body_md: |
      关于 IT 服务生命周期五个阶段，下列说法正确的是：
    options:
      - 顺序是规划设计 → 部署实施 → 服务运营 → 监督管理 → 持续改进，到持续改进结束
      - 顺序是规划设计 → 部署实施 → 服务运营 → 持续改进 → 监督管理，且持续改进与监督管理会反馈回规划设计形成闭环
      - 五个阶段只走一遍，走完服务就结束了
      - 服务运营是起点，规划设计属于项目阶段，不属于服务生命周期
    answer: "B"
    explanation_md: |
      五阶段顺序必须记牢：**规划设计 → 部署实施 → 服务运营 → 持续改进 → 监督管理**。

      但它**是闭环不是直线**：持续改进与监督管理的结果会反馈回规划设计，开启新一轮。

      这正是「服务生命周期」区别于「项目生命周期」的核心——**项目有终点，服务没有**。
      所以 C 错：服务不是走一遍就结束，而是持续循环。

      A 把后两阶段顺序对调了。判别依据：**先度量改进（持续改进），再评估监督（监督管理）**——
      改进是执行动作，监督是对结果的评价。

      D 错在把规划设计划出服务之外：规划设计的产出就是服务目录与服务级别，
      它是服务的起点，不是项目阶段。

      **判断题高频**：「服务生命周期到运营结束」——错，后面还有持续改进与监督管理。
    source: manual

  - id: RK-S3-034
    module_id: S3
    kp_id: KP-0303
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 3
    title: 这几件运维活各属于哪一类
    body_md: |
      某运维团队本月做了四件事：① 每日巡检机房温湿度并记录 ② 处理 37 起用户报障
      ③ 对数据库慢查询做索引优化 ④ 为明年的容量规划出具建议报告。
      按运维服务的四类活动，依次对应正确的是：
    options:
      - 例行操作、响应支持、优化改善、咨询评估
      - 响应支持、例行操作、咨询评估、优化改善
      - 例行操作、优化改善、响应支持、咨询评估
      - 咨询评估、响应支持、优化改善、例行操作
    answer: "A"
    explanation_md: |
      运维四类活动的判别口径：

      | 类别 | 干什么 | 关键词 |
      | --- | --- | --- |
      | 例行操作 | 按计划重复做的 | 巡检、备份、日志检查 |
      | 响应支持 | 被动响应事件与请求 | 报障、工单、故障处理 |
      | 优化改善 | 主动提升现有性能或质量 | 调优、扩容、架构优化 |
      | 咨询评估 | 出建议、做评估，不直接改系统 | 规划建议、评估报告、方案咨询 |

      逐一对应：① 巡检 → 例行操作；② 报障处理 → 响应支持；③ 慢查询索引优化 → 优化改善；
      ④ 容量规划建议 → 咨询评估。

      **最容易混的是 ③ 与 ④**：两者都是主动的，区别在**有没有直接改系统**。
      改了就属优化改善；只出报告不出手，属咨询评估。

      另一对易混是 ① 与 ②：**有计划的叫例行，被叫上门的叫响应**。
    source: manual

  - id: RK-S3-035
    module_id: S3
    kp_id: KP-0303
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 5
    title: 给自家运维做一次持续改进
    body_md: |
      拿你单位（或你负责）的一个信息系统运维场景，完成三件事：
      1. 写出当前的服务目录至少 3 项（每项写清「提供什么、给谁、什么时间可用」）
      2. 找出一个反复出现的问题，用服务生命周期的语言定性：它属于哪个阶段没做好
      3. 写出一项持续改进措施，必须包含**可度量的指标**（改前多少、目标多少、怎么采集）
    options: []
    answer: "3项可读的服务目录；问题能定位到生命周期某阶段；改进措施带改前/目标/采集方式三个要素"
    explanation_md: |
      评分重心在第 3 问的**可度量性**——「加强管理」「提升效率」这类表述不得分。

      合格示例：
      1. 服务目录：
         - 办公终端故障处理｜面向全体职工｜工作日 8:30-17:30，紧急故障 7×24
         - 业务系统账号开通｜面向各科室负责人｜工作日 2 小时内办结
         - 数据库备份与恢复｜面向系统运维组｜每日 2:00 自动备份，保留 30 天
      2. 问题定性：「每月都有 3-5 次业务系统登录失败投诉，事后查明多为密码过期未提示」——
         这属于**服务运营**阶段的用户体验设计不足，同时也暴露**持续改进**没跟上的问题
         （同一问题重复出现，说明没有形成改进闭环）。
      3. 改进措施：登录页增加密码到期提醒并支持自助重置。
         **改前**：每月登录失败投诉 3-5 次，平均处理耗时 40 分钟；
         **目标**：降到每月 ≤1 次，平均处理耗时 ≤10 分钟；
         **采集方式**：服务台工单系统按「登录失败」标签统计，每月 1 日出报表。

      为什么要卡「可度量」：SLA 指标的写法同理——写「及时响应」等于没写，
      写「2 小时内响应、8 小时内解决」才能追责与改进。这是本章的核心工程习惯。
    source: manual

  - id: RK-S3-036
    module_id: S3
    kp_id: KP-0304
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 2
    title: 这四样东西各属于哪个架构视图
    body_md: |
      企业架构四视图中，下列内容归属正确的是：
    options:
      - 数据分布与数据标准 → 应用架构
      - 应用清单与系统间集成关系 → 应用架构
      - 中间件选型与技术标准 → 业务架构
      - 业务流程模型与岗位职责 → 技术架构
    answer: "B"
    explanation_md: |
      四个视图各回答一个问题，用「问什么」对位即可：

      | 视图 | 回答什么问题 | 主要产物 |
      | --- | --- | --- |
      | 业务架构 | 做什么业务、流程怎么走 | 业务流程模型、组织与职责 |
      | 数据架构 | 有哪些数据、怎么流转 | 数据模型、数据分布、数据标准 |
      | **应用架构** | 有哪些系统、怎么交互 | **应用清单、集成关系** |
      | 技术架构 | 用什么技术支撑 | 技术标准、中间件、基础设施 |

      所以 B 对。A 是数据架构，C 是技术架构，D 是业务架构——三项全部错位，
      这正是这类题的常见出法：把四个视图的产物打乱后两两互换。

      记忆抓手：**业务问做什么、数据问有什么、应用问用哪个系统、技术问靠什么实现。**
    source: manual

  - id: RK-S3-037
    module_id: S3
    kp_id: KP-0304
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 5
    title: 给自己系统的架构做一次盘点
    body_md: |
      选一个你熟悉的信息系统，按分层架构五层做一次盘点：
      1. 逐层写出该系统里对应的具体组件或产品（每层至少 1 项；确实没有的层要写明「缺失」）
      2. 指出这套架构里最强的一层与最弱的一层，各给一个证据
      3. 若三年后业务量翻三倍，你认为最先撑不住的是哪一层？为什么？
    options: []
    answer: "五层逐项落位（缺失要写明）；强弱各带证据；指出瓶颈层并说明依据"
    explanation_md: |
      分层架构五层（由下往上）：**基础设施层 → 数据资源层 → 应用支撑层 → 业务应用层 → 展现层**，
      另外还有贯穿各层的**安全保障体系**与**运维管理体系**两条竖线。

      合格盘点的样子（以某政务审批系统为例）：
      1. - 基础设施层：政务云 8 台虚机、集中存储 20T
         - 数据资源层：Oracle 业务库、达梦交换库、Hive 分析库
         - 应用支撑层：统一认证中心（SSO）、消息队列、日志平台
         - 业务应用层：事项管理、审批流转、电子证照三个子系统
         - 展现层：政务门户 PC 端、移动端小程序、大厅大屏
         - 两条竖线：等保三级的安全体系、带值班表与工单的运维体系

      2. **最强**的证据要指向「有明确机制」：如「应用支撑层的统一认证已覆盖 12 个委办局，
         新系统接入只需配置，不再各自开发」。
         **最弱**的证据要指向「缺失或靠人扛」：如「数据资源层没有元数据与血缘，
         报表数字对不上时只能逐个系统翻，定位一次平均 2 天」。

      3. 瓶颈判断要落到**架构特征**而非「服务器会不够」：比如
         「最先撑不住的是数据资源层——分析库与应用库共用一套存储，且没有分库分表，
         业务量翻三倍后报表查询会拖垮业务库。对策是先做读写分离与冷热分层。」

      评分看的是第 2、3 问的**因果链**，不是组件清单是否齐全。只列产品不谈问题，
      等于做了一份资产台账，不是架构盘点。
    source: manual

  - id: RK-S3-038
    module_id: S3
    kp_id: KP-0305
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: easy
    level: 1
    title: 哪个模型的标志是风险驱动
    body_md: |
      下列软件开发模型中，以「风险驱动、每一轮先做风险分析再开发」为标志的是：
    options:
      - 瀑布模型
      - 原型模型
      - 螺旋模型
      - 敏捷模型
    answer: "C"
    explanation_md: |
      各模型的标志性特征：

      | 模型 | 标志 |
      | --- | --- |
      | 瀑布 | 阶段严格串行，需求稳定才适用 |
      | 原型 | 用可运行界面把需求问出来 |
      | **螺旋** | **风险驱动**，每圈先风险分析再开发，适合大型高风险项目 |
      | 敏捷 | 短周期小步交付，拥抱变化 |

      「螺旋」这个名字本身就提示了结构：一圈一圈往外扩，每圈四个象限——
      定目标、**风险分析**、开发验证、下一轮计划。风险分析是它区别于其他模型的核心。

      注意别把它和增量/迭代混为一谈：增量与迭代是**交付方式**，螺旋是**风险控制方式**，
      虽然螺旋也带迭代特征，但判据是「有没有把风险分析当成每轮必做的前置动作」。
    source: manual

  - id: RK-S3-039
    module_id: S3
    kp_id: KP-0305
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 4
    title: 选错了模型的项目为什么反复返工
    body_md: |
      某项目合同要求按瀑布模型执行，各阶段需提交文档并经客户签字确认后进入下一阶段。
      实施中客户业务部门每月都提出流程调整，每次调整都要走变更、重签文档、重做已完成部分，
      项目已延期两次。从软件工程角度看，最本质的问题是：
    options:
      - 客户不守信用，应严格按合同拒绝变更
      - 开发团队技术能力不足，导致返工量大
      - 开发模型与需求稳定性不匹配：需求本身高度不确定，却采用了以需求稳定为前提的瀑布模型
      - 文档提交得太少，应该增加文档数量以固定需求
    answer: "C"
    explanation_md: |
      模型选择的判据是**需求确定性**，不是合同偏好：

      - 瀑布的前提是**需求明确稳定**、技术成熟、合同严格
      - 题干里「每月提出流程调整」说明需求本身高度不确定，与瀑布的前提直接冲突

      冲突的结果就是每次变更都要**回退到前面阶段重做**，而瀑布的后期变更代价极大。
      所以最本质的问题是**模型与场景不匹配**，不是执行不力。

      A 把管理问题当道德问题：拒绝变更在政务/企业项目里通常不可行，且变更本身是常态。
      B 与 D 都是「在错的模型里加大投入」——能力越强、文档越多，返工的成本只会更高。

      **对策方向**（案例题常连着问）：改用迭代或原型逐步确认需求、把长周期拆成短交付、
      建立变更控制、对已确认部分冻结范围。**换模型，而不是加人加班。**
    source: manual

  - id: RK-S3-040
    module_id: S3
    kp_id: KP-0306
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 1
    title: 数据仓库的四个特征
    body_md: |
      关于数据仓库的特征，下列说法正确的是：
    options:
      - 面向业务过程组织数据，与业务系统的表结构保持一致
      - 数据实时更新，与源系统保持同步
      - 面向主题组织、集成多源数据、相对稳定、反映历史变化
      - 只存汇总数据，不保留明细数据
    answer: "C"
    explanation_md: |
      数据仓库四特征要能背，且要能逐条判断对错：

      | 特征 | 含义 |
      | --- | --- |
      | **面向主题** | 按分析主题（客户、产品、财务）组织，**不按业务系统** |
      | **集成** | 多源数据经统一编码、命名、度量口径后入库 |
      | **相对稳定** | 以查询分析为主，一次装入很少修改 |
      | **反映历史变化** | 保留时间维度，能看趋势与同比 |

      A 错在方向：与业务系统表结构一致的是业务库（OLTP），数据仓库恰恰要**脱离**源系统的结构，
      按分析主题重组。

      B 错在「实时同步」：数据仓库相对稳定，通常**批量装载**（T+1 是常态）。这是判断题高频陷阱。

      D 错在只存汇总：数据仓库既存明细也存汇总，明细是汇总的基础，也是钻取分析的前提。

      一句话区分：**业务库是为「记账」设计的，仓库是为「看趋势」设计的。**
    source: manual

  - id: RK-S3-041
    module_id: S3
    kp_id: KP-0306
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 4
    title: 各系统录入都对，报表却对不上
    body_md: |
      某集团月度经营分析会上，财务部报出营收 1.2 亿、运营部报出 1.35 亿、管理层看到的
      大屏显示 1.28 亿。经核查：三个系统的原始录入都没有错误，各自的统计逻辑也都能自圆其说。
      最可能的根因是：
    options:
      - 数据录入人员操作失误，需加强培训
      - 缺少统一的数据标准与指标口径，同一指标在不同系统按不同规则计算
      - 数据仓库容量不足，导致数据丢失
      - 网络传输延迟，报表未取到最新数据
    answer: "B"
    explanation_md: |
      题干给了两个排除性条件：**录入都没错**（排除 A）、**各自逻辑都能自圆其说**（排除偶发错误）。
      剩下的是**口径问题**——同一指标（营收）在三处的定义不同：含不含税、含不含退货、
      按签收还是按开票确认，任一处不一致就会差出一千多万。

      这类问题的治理顺序是：**建数据标准（统一编码、命名、口径）→ 管主数据 → 建质量规则与稽核
      → 建元数据与血缘 → 定安全分级**。第一步永远是标准，因为口径不统一时，
      任何集成、任何报表工具都只是把分歧搬到了新地方。

      C 与 D 属于「先怀疑技术」的惯性思维：数据丢失通常表现为**缺数或空值**，
      网络延迟通常表现为**延迟**，都不会表现为「三个数都合理但互不相等」。

      判据一句话：**三个数各自都能自圆其说，就不是数据错，是定义不同。**
    source: manual

  - id: RK-S3-042
    module_id: S3
    kp_id: KP-0307
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 2
    title: OSI 与 TCP/IP 的层间对应
    body_md: |
      关于 OSI 七层模型与 TCP/IP 四层模型的对应关系，下列说法正确的是：
    options:
      - OSI 的传输层对应 TCP/IP 的网络接口层
      - OSI 的应用层、表示层、会话层对应 TCP/IP 的应用层
      - OSI 的网络层对应 TCP/IP 的传输层
      - OSI 的数据链路层与物理层对应 TCP/IP 的网际层
    answer: "B"
    explanation_md: |
      对应关系一次记清：

      | OSI 七层 | 功能 | TCP/IP 四层 |
      | --- | --- | --- |
      | 应用层、表示层、会话层 | 面向应用的数据处理与对话 | **应用层** |
      | 传输层 | 端到端可靠传输（TCP）或无连接传输（UDP） | 传输层 |
      | 网络层 | 路由与寻址（IP） | 网际层 |
      | 数据链路层、物理层 | 帧传输与物理介质 | 网络接口层 |

      所以 B 对，其余三项都把层对错了位。

      **配套要记的端口**（几乎每年抽一两个考）：HTTP 80、HTTPS 443、FTP 20/21、SSH 22、
      Telnet 23、SMTP 25、DNS 53、SNMP 161。

      **一个高频错项**：「交换机工作在网络层」——普通交换机工作在**数据链路层**，
      只有三层交换机才具备路由功能。这条与层间对应是同一类考点。
    source: manual

  - id: RK-S3-043
    module_id: S3
    kp_id: KP-0307
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 3
    title: 这段布线属于哪个子系统
    body_md: |
      某办公楼共 9 层，一层设中心机房。设计如下：办公工位的信息插座经双绞线接至本层配线间；
      各楼层配线间经光纤接至一层中心机房的主配线架；主配线架与核心交换机安装在中心机房内。
      其中「各楼层配线间经光纤接至一层中心机房」属于：
    options:
      - 水平子系统
      - 建筑群子系统
      - 设备间子系统
      - 垂直干线子系统
    answer: "D"
    explanation_md: |
      综合布线六子系统的判别方法只有一个：**看两端接哪里**。

      | 子系统 | 连接范围 |
      | --- | --- |
      | 工作区 | 终端到信息插座（含跳线） |
      | 水平 | 信息插座到**本层**配线架（同一楼层平面内） |
      | **垂直干线** | 楼层配线架到设备间主配线架（**跨层**） |
      | 设备间 | 主配线架、网络设备所在 |
      | 管理 | 配线架与跳线管理 |
      | 建筑群 | **楼与楼之间** |

      题干「各楼层配线间 → 一层中心机房」跨越了楼层，属于**垂直干线子系统**，
      光纤正是干线的常见介质。

      干扰项提示：同一题里「信息插座到本层配线间」是水平子系统（同一楼层平面内），
      「主配线架与核心交换机」在设备间子系统内。建筑群只用于**不同建筑物**之间，
      同一栋楼内再怎么跨层也不是建筑群——这是本题最像的误选项。
    source: manual

  - id: RK-S3-044
    module_id: S3
    kp_id: KP-0307
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 5
    title: 定位自己项目的集成难点在哪一层
    body_md: |
      选一个你参与过的集成类项目（多厂商设备、多个系统对接都算），完成三件事：
      1. 按「设备 → 网络 → 软件 → 数据 → 应用」五个层面，写出这个项目实际做了哪几层集成
      2. 指出最难的一层，并给出一个具体的困难事件（时间、现象、影响）
      3. 写出你在接口责任划分上的做法或教训：出问题时，怎么判断是谁的责任
    options: []
    answer: "五层按实际落位；最难一层带具体事件；接口责任要有可判定的依据"
    explanation_md: |
      五层面从低到高：**设备 → 网络 → 软件 → 数据 → 应用**，
      **层次越高价值越大、难度也越大**，因为越往上越牵涉业务流程。

      合格示例（某机房改造 + 三系统对接项目）：
      1. 做了设备（服务器与存储上架）、网络（核心与接入交换机、VLAN 规划）、
         软件（中间件与操作系统适配）、应用（三个系统的接口对接）四层；
         数据层只做了基础的数据字典核对，未做统一口径。
      2. 最难的是**应用层**：2026-05 联调时，A 系统把审批状态设计成 4 种，B 系统只认 3 种，
         互相等对方改，联调停工 9 天。根因是接口文档只约定了字段名，没约定**枚举值域**。
      3. 责任划分的做法：把接口规范写成三方签字的技术附件，明确字段、类型、**取值范围**、
         异常返回、超时重试、日志落盘位置；出问题时按「谁的数据不符合附件」判定，
         争议超 1 天由总集成方裁定。

      **最容易被忽略的一条**：接口责任不清时，各方都会说「我这边测试是好的」——
      因为各自只测了自己的边界。判据是**有没有一份写明值域与时序的技术附件**，
      而不是谁的设备更贵。

      评分看第 2 问的事件是否具体、第 3 问的依据是否可判定。只写「沟通不畅，需加强协调」
      不得分——那正是这个知识点要治的病。
    source: manual

  # ── 2026-10-29 补格：S5 空缺的 5 个格子 ──
  - id: RK-S5-018
    module_id: S5
    kp_id: KP-0502
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: easy
    level: 1
    title: GB、GB/T、GB/Z 各是什么性质
    body_md: |
      按我国标准体系，代号 GB、GB/T、GB/Z 分别表示：
    options:
      - 强制性国家标准、推荐性国家标准、指导性技术文件
      - 推荐性国家标准、强制性国家标准、行业标准
      - 国家标准化指导文件、强制性国家标准、推荐性国家标准
      - 国家标准、行业标准、企业标准
    answer: "A"
    explanation_md: |
      三个代号的区别在**第三位字母**：

      | 代号 | 性质 | 约束力 |
      | --- | --- | --- |
      | **GB** | 强制性国家标准 | **必须执行** |
      | **GB/T** | 推荐性国家标准 | 自愿采用（被引用后在该范围内强制） |
      | **GB/Z** | 指导性技术文件 | 供参考 |

      记忆法：**T 是推荐（Tuijian）的首字母，Z 是指导（Zhidao）的首字母**。

      标准的五个层级从高到低是：国家标准（GB）、行业标准（如 SJ/Y D）、地方标准（DB）、
      团体标准（T）、企业标准（Q）。层级的硬规矩是：**下一级不得与上一级相抵触，
      但企业标准可以严于国家标准，不能低于。**

      一个高频错项：把「GB/T 可以不执行」当成绝对结论——**被合同或法规引用后就具有约束力**，
      这是判断题的经典陷阱（见本节 L3 那题）。
    source: manual

  - id: RK-S5-019
    module_id: S5
    kp_id: KP-0502
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: medium
    level: 3
    title: 企业标准比国标更严合规吗
    body_md: |
      某企业的内部技术标准规定：数据备份保留 180 天，故障响应时间不超过 1 小时。
      而对应的国家标准（推荐性）要求备份保留 90 天、响应时间不超过 2 小时。
      该企业在投标文件中声明执行自己的内部标准。以下判断正确的是：
    options:
      - 不合规，企业标准不得与国家标准不一致
      - 合规，企业标准可以严于国家标准，该声明对投标方具有约束力
      - 不合规，必须严格按国家标准执行，不得自定更严的指标
      - 是否合规由评标委员会决定
    answer: "B"
    explanation_md: |
      标准层级关系的硬规矩是：**下一级标准不得与上一级标准相抵触；
      但企业标准可以严于国家标准，不能低于。**

      本题企业标准在两项指标上都**更严**（180 天 > 90 天、1 小时 < 2 小时），
      属于「严于国标」，合规；且写进投标文件后，成为承诺内容，**对投标方产生约束力**。

      A 与 C 都把「不得抵触」误解成「必须一致」。抵触指的是**低于或违背**，
      不是「不能更好」。D 混淆了权限：适用性由标准体系本身与合同约定决定，
      评委只能判断是否响应招标要求，不能重新解释标准层级。

      **反向情形要一并记住**：如果企业标准写成「备份保留 30 天」，低于国标的 90 天，
      那就构成抵触，不合规，且不得据此交付。

      **另一半考点**：推荐性标准一旦**被合同引用**，在该合同范围内即具有强制约束力——
      这是「GB/T 可以不执行」这句话唯一的破口。
    source: manual

  - id: RK-S5-020
    module_id: S5
    kp_id: KP-0503
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: easy
    level: 1
    title: 职业道德的六条基本要求
    body_md: |
      信息系统项目管理相关职业道德的基本要求通常概括为六条，下列不属于这六条的是：
    options:
      - 遵纪守法、诚实守信
      - 客观公正、爱岗敬业
      - 保守秘密、终身学习
      - 服从上级、维护企业利益最大化
    answer: "D"
    explanation_md: |
      六条基本要求：**遵纪守法、诚实守信、客观公正、爱岗敬业、保守秘密、终身学习**。

      D 的问题在于把「服从」和「企业利益最大化」当成职业准则——这两条恰恰是职业道德题里
      **最常被推翻的辩解**：

      - 「领导让我这么做的」不是免责理由，**服从管理不等于服从违法指令**
      - 企业利益不能凌驾于法律与公众安全之上；涉及公共安全的已知风险，
      职业责任优先于合同义务与企业利益

      所以 D 不但不属于六条，还与其中三条直接冲突（守法、公正、诚信）。

      判据一句话：**六条讲的都是「对事实、对公众、对专业负责」，
      没有一条是「对上级负责」。**
    source: manual

  - id: RK-S5-021
    module_id: S5
    kp_id: KP-0503
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: medium
    level: 2
    title: 保密义务管到什么时候、管到哪些东西
    body_md: |
      关于项目中的保密义务，下列说法正确的是：
    options:
      - 保密义务在劳动合同终止或项目结束后自动解除
      - 保密范围包括客户业务数据、商业机密、系统漏洞信息与合同价格，且保密义务不因离职而终止
      - 只有签了保密协议的人才有保密义务，未签的人不受约束
      - 项目结束后可以把项目资料整理成个人作品用于分享，只要不涉及价格
    answer: "B"
    explanation_md: |
      保密义务的两个关键点，题干已经给出正确答案：

      **一、范围比想象的大**：客户业务数据、商业机密、**系统漏洞信息**、合同价格，
      都在保密范围内。漏洞信息尤其容易被忽略——它常被认为「反正是技术细节」，
      但泄露漏洞等于给攻击者指路。

      **二、期限不随离职终止**：保密义务是**持续义务**，不因劳动关系终止、
      项目结束而自动解除。A 是最常见的错误认知。

      C 错在把义务的来源限死在「签了协议」：保密义务既来自合同约定，
      也来自法律（反不正当竞争、数据安全、个人信息保护）与职业规范。

      D 是最隐蔽的一种违规：把项目资料整理成作品分享，即使隐去价格，
      仍可能泄露客户业务结构与系统设计。**未经授权不得将项目资料用于其他用途**，
      包括写进个人作品与案例分享。

      另一条边界：发现严重漏洞时的正确动作是**内部报告并推动修复，不对外公开**。
    source: manual

  - id: RK-S5-022
    module_id: S5
    kp_id: KP-0503
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: medium
    level: 3
    title: 供应商的这份礼该怎么处理
    body_md: |
      项目进入设备选型阶段，三家供应商参与比选。其中一家供应商的销售负责人
      以「技术交流」为名约你吃饭，席间表示「无论选不选我们，这点心意都请收下」，
      并递来一张购物卡。你与该供应商的报价评估直接相关。最恰当的处理是：
    options:
      - 收下但不影响判断，因为对方说了「选不选都给」
      - 当场婉拒；无法当场退还的，登记并上交，同时向项目负责人申报该利益冲突并申请回避
      - 收下后转交给团队作为团建经费，个人不占便宜即可
      - 不必处理，等选型结果出来后再说
    answer: "B"
    explanation_md: |
      这道题的考点是**「申报回避」比「拒绝」更专业**。

      正确动作有三层，缺一层都不完整：
      1. **不当场接受**（婉拒）
      2. **无法退还的登记上交**（留痕，证明自己没有占为己有）
      3. **申报利益冲突并申请回避**——因为题干写明「你与该供应商的报价评估直接相关」，
      继续参与评估本身就会让结论失去公信力，哪怕你自认为公正

      A 的错在「不影响判断」这个自我保证：利益冲突的判断标准不是**结果是否公正**，
      而是**是否存在影响公正的可能性**。收了卡，后续无论怎么评都会被质疑。

      C 把问题转移了：个人不占便宜不等于合规，转交团建经费仍属接受利益输送，
      而且会让整个团队被绑定。

      D 是拖延，等于把风险留到既成事实之后。

      判据一句话：**利益冲突不看你有没有被影响，看你有没有处在可能被影响的位置。**
    source: manual

  # ── 2026-10-29 补格：S6 空缺的 9 个格子 ──
  - id: RK-S6-018
    module_id: S6
    kp_id: KP-0601
    category: 中项·S6 应试专项
    type: 单选
    difficulty: easy
    level: 1
    title: 三点估算的期望工期公式
    body_md: |
      三点估算（PERT）中，期望工期的计算公式是：
    options:
      - （乐观 + 最可能 + 悲观）÷ 3
      - （乐观 + 4 × 最可能 + 悲观）÷ 6
      - （乐观 + 悲观）÷ 2
      - （最可能 + 悲观）÷ 2
    answer: "B"
    explanation_md: |
      PERT 两个公式要成对记：

      - **期望工期 = (乐观 + 4 × 最可能 + 悲观) ÷ 6**
      - **标准差 = (悲观 − 乐观) ÷ 6**

      A 是**简单算术平均**，最可能的权重不是 1 而是 4——这是最普遍的错法，
      一旦这里算错，后面基于期望值的概率题全部连带错。

      C 是只取两端的中点，完全不考虑最可能值。D 只用了两个值。

      **标准差的用途**：判断概率区间——正负 1 个标准差约 68.26%，2 个约 95.46%，
      3 个约 99.73%。题问「多少天内完成的概率约 95%」，就答「期望工期 ± 2 个标准差」。
      另外，**标准差越小说明估算越集中、风险越小**，这个方向别弄反。
    source: manual

  - id: RK-S6-019
    module_id: S6
    kp_id: KP-0602
    category: 中项·S6 应试专项
    type: 单选
    difficulty: easy
    level: 1
    title: 单代号、双代号与虚活动
    body_md: |
      关于网络图，下列说法正确的是：
    options:
      - 单代号网络图中，箭线表示活动，节点表示事件
      - 双代号网络图中，节点表示活动，箭线表示逻辑关系
      - 双代号网络图中的虚活动只表示逻辑关系，不消耗时间也不消耗资源，工期为 0
      - 虚活动消耗资源但不消耗时间
    answer: "C"
    explanation_md: |
      两种网络图的表示方式是**反的**，这是最容易记错的点：

      | 类型 | 节点表示 | 箭线表示 | 简称 |
      | --- | --- | --- | --- |
      | **单代号** | **活动** | 逻辑关系 | AON |
      | **双代号** | 事件 | **活动** | AOA |

      所以 A 与 B 都把两者说反了。判别窍门看名字：**「单代号」＝一个节点写一个代号（活动）**，
      「双代号」＝一条箭线两端各一个代号（事件），活动在线上。

      **虚活动**（虚箭线）：只表达逻辑依赖关系，**既不消耗时间也不消耗资源，工期为 0**。
      它的作用是让两条并行路径的依赖关系表达清楚，避免画错。

      D 是常见误答——「不耗时」是对的，「消耗资源」是错的，两个都不消耗。
    source: manual

  - id: RK-S6-020
    module_id: S6
    kp_id: KP-0602
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 4
    title: 非关键活动延误了，总工期变不变
    body_md: |
      某项目关键路径为 A-B-D-E，总工期 15 天。活动 C 与 B 并行（路径 A-C-D-E），
      C 的工期 2 天、**总时差 2 天**。若 C 实际延误 4 天，其余活动按期完成，则总工期：
    options:
      - 不受影响，仍是 15 天
      - 延长 2 天，变为 17 天
      - 延长 4 天，变为 19 天
      - 延长 6 天，变为 21 天
    answer: "B"
    explanation_md: |
      判据只有一条：**拿延误天数与总时差比**。

      - 延误 ≤ 总时差 → 不影响总工期
      - 延误 > 总时差 → 总工期顺延**超出部分**（延误 − 总时差）

      本题 C 延误 4 天、总时差 2 天，超出 2 天，所以**总工期延长 2 天，变为 17 天**。

      C 的错法是把整个延误天数算进去——被总时差吸收的那 2 天不占工期。
      A 的错法是完全忽略「超过时差」这层：如果延误只有 2 天，才是 A。
      D 是乱加。

      **更深一层的性质**：C 延误超过时差后，路径 A-C-D-E 变成 17 天，
      与 A-B-D-E 的 15 天相比成了新的最长路——**关键路径转移了**。
      此后要继续压缩工期，得压 C 这条新关键路径上的活动，压 B 已经没用。
      这一步是高分点，选择题不一定问，但案例题里问「该怎么办」时是核心答案。
    source: manual

  - id: RK-S6-021
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 3
    title: Scope Creep 指的是什么
    body_md: |
      Which of the following best describes "scope creep"?
    options:
      - 经变更控制流程批准的正式范围变更
      - 未经控制的、逐步累积的范围扩大
      - 项目结束时对范围进行最终确认
      - 因客户组织调整导致相关方变更
    answer: "B"
    explanation_md: |
      **Scope Creep = 范围蔓延**，定义的核心是**未经控制**且**逐步累积**：
      不是一次大的变更，而是一连串「顺手做一下吧」的小增补，每次都不走流程，
      累积起来让范围、进度、成本全失控。

      A 是**正常变更**（Approved Scope Change），与蔓延的区别就在「有没有走变更控制流程」。
      这两个概念在案例题里是核心对立项：**变更控制不是拒绝变更，而是防止蔓延**。

      C 描述的是确认范围（Verify Scope），D 描述的是相关方变化，都与 scope creep 无关。

      **配套要记的同组术语**：
      - Baseline 基线（不是「底线」）
      - Milestone 里程碑（工期为 0 的检查点）
      - Deliverable 可交付成果
      - Crashing 赶工（加资源）/ Fast Tracking 快速跟进（改并行）

      做英文题的技巧：不逐词翻译，先抓**关键词**——出现 uncontrolled、gradually、
      incremental 这类词，多半指向 creep。
    source: manual

  - id: RK-S6-022
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 4
    title: 英文题干里判断哪句话对
    body_md: |
      Which of the following statements about milestones is correct?
    options:
      - A milestone has a duration equal to its preceding activity.
      - A milestone is a checkpoint with zero duration.
      - A milestone consumes resources but takes no time.
      - A milestone is the same as a deliverable.
    answer: "B"
    explanation_md: |
      **Milestone（里程碑）= 工期为 0 的检查点**，它标记一个重要节点（如「需求评审通过」），
      不占工期、不消耗资源。所以 B 对。

      A 错在把里程碑当成活动：活动有历时，里程碑没有（duration = 0）。
      C 错在「消耗资源」——里程碑既不占时间也不占资源，它只是一个标记。
      D 错在把里程碑与可交付成果等同：**可交付成果是产出的东西**（如系统、文档），
      **里程碑是时间上的节点**（如「系统上线完成」）。一个里程碑往往关联某个可交付成果的完成，
      但两者不是一回事。

      **英文判断题通用经验**（讲义里明确点过）：重点看否定词与量词 not / all / only，
      **含 all 与 only 的表述通常错**。本题四个选项都没有这些词，所以只能靠概念本身判。

      顺带记住同组的两个易混词：**Float / Slack 都指时差**（同义），
      **Crashing 赶工 / Fast Tracking 快速跟进**（不同手段）。
    source: manual

  - id: RK-S6-023
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 实操
    difficulty: hard
    level: 5
    title: 给自己项目做一份中英对照术语表
    body_md: |
      拿你手上的一个项目，做一份**自用**的中英对照术语表（不少于 8 条），要求：
      1. 每条写「英文全称 + 缩写 + 中文」，并注明它在你项目里对应哪份文档或哪个动作
      2. 从这 8 条里挑 2 条，用一句英文写出它的作用（不超过 20 词）
      3. 写出你在阅读英文招标文件或外方技术附件时，最容易误解的一个术语，并说明差在哪
    options: []
    answer: "8条术语落在自己项目上；2句英文表达准确；指出一个真实误解与差异"
    explanation_md: |
      这题的目的不是背单词，而是**把术语钉到自己项目的具体物件上**——
      只有落到「哪份文档、哪个动作」，考试时才能在题干里一眼认出来。

      合格示例（节选）：
      | 英文 | 缩写 | 中文 | 在自己项目里对应 |
      | --- | --- | --- | --- |
      | Work Breakdown Structure | WBS | 工作分解结构 | 《某平台建设 WBS》三级分解表 |
      | Statement of Work | SOW | 工作说明书 | 合同附件二的采购范围描述 |
      | Change Control Board | CCB | 变更控制委员会 | 每月一次的变更评审会 |
      | Earned Value Management | EVM | 挣值管理 | 月度状态报告里的 SPI/CPI |
      | Service Level Agreement | SLA | 服务级别协议 | 运维合同附件的响应时限表 |
      | User Acceptance Testing | UAT | 用户验收测试 | 上线前的业务方验收轮 |
      | Proof of Concept | POC | 概念验证 | 选型阶段的两周试点 |
      | Total Cost of Ownership | TCO | 总拥有成本 | 三年期成本对比表 |

      英文表述（示例）：
      - "A WBS breaks the project scope into manageable work packages."
      - "The CCB decides whether a change request is approved, rejected, or deferred."

      **第 3 问才是真正的价值所在**。常见误解举例：
      「把 Baseline 当成『底线』，实际它是**经批准、受变更控制的基准**，
      不能随口说『这是我的底线，不能改』——基准可以改，但要走变更流程」；
      或「把 Milestone 当成一个有工期的阶段，实际它是工期为 0 的检查点」。

      评分看第 1 问是否落到自己项目、第 3 问的误解是否具体。只抄一张缩写表不构成答案。
    source: manual

  - id: RK-S6-024
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 单选
    difficulty: easy
    level: 1
    title: 案例题的四步答题骨架
    body_md: |
      信息系统项目管理师下午卷案例题，推荐的答题骨架是：
    options:
      - 定位 → 原因 → 对策 → 依据
      - 背景 → 分析 → 总结 → 展望
      - 定义 → 举例 → 对比 → 结论
      - 结论 → 论证 → 反驳 → 重申
    answer: "A"
    explanation_md: |
      四步骨架的作用是**让阅卷老师能在 30 秒内找到得分点**：

      1. **定位**：问题出在哪个管理过程（点出过程名，按术语给分）
      2. **原因**：缺什么（缺文件、缺流程、缺角色、缺评审）
      3. **对策**：补什么、谁来做、什么时候做、做到什么程度
      4. **依据**：教材条目或规范要求，一句话即可

      B、C、D 都是写作或议论文的套路，与案例题无关。案例题不考文采，
      而是考**能不能把管理动作说清楚**——它是「技术写作」，不是「作文」。

      **案例题的分值结构**要清楚：下午卷三道案例，每题含若干小问，
      小问类型就五种——找问题、析原因、提措施、算指标、判是非，且常组合出现。
      所以按小问逐个答，**不要写成一篇连贯的文章**。
    source: manual

  - id: RK-S6-025
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 2
    title: 得分点长什么样
    body_md: |
      案例题得分点通常具备四个特征，下列不属于这四个特征的是：
    options:
      - 分条编号，每行一个点
      - 用动宾结构，动词开头
      - 使用教材术语，不用口语
      - 尽量写成完整的长句，把道理讲透
    answer: "D"
    explanation_md: |
      得分点四特征：**分条、动宾结构、术语准确、有量化**。

      D 恰恰是反例：**长句会把得分点埋起来**。阅卷是按关键词给分，
      一长段话里即使说对了，也可能因为找不到关键词而丢分。

      其余四特征的对照：

      | 特征 | 好 | 坏 |
      | --- | --- | --- |
      | 分条 | 1. 建立变更控制流程 | 一段话连续叙述 |
      | 动宾 | 组织需求评审 | 「需求评审很重要」 |
      | 术语 | 未建立范围基准 | 「没有范围标准」 |
      | 量化 | 每周一次例会、2 小时内响应 | 「加强沟通」 |

      **失分的五类典型**（讲义里点明的）：只写结论不写动作、空话套话、
      不分条、问题与对策不对应、漏答小问。其中**漏答小问是最大的非技术失分**——
      每题控制在 30 分钟内，留 10 分钟专门检查有没有漏答。
    source: manual

  - id: RK-S6-026
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 3
    title: 这段答案为什么拿不到分
    body_md: |
      某考生在案例题「请指出该项目存在的主要问题」下作答：
      「该项目管理不规范，项目经理责任心不强，团队执行力差，
      建议加强管理、提高认识、强化沟通，确保项目按期完成。」
      按案例题的评分特征，这段答案的主要问题是：
    options:
      - 字数太少，信息量不足
      - 评价了人而不是指出管理事实，且全是空话，没有对应的过程与动作，无法命中得分点
      - 没有引用教材原文，缺少理论依据
      - 没有写计算过程
    answer: "B"
    explanation_md: |
      这段话踩了三个典型失分点：

      1. **评价人而不是说事实**——「责任心不强」「执行力差」是道德评价，
         案例题要的是「未编制项目管理计划」「未建立变更控制流程」这类**可核对的管理事实**
      2. **全是空话**——「加强管理」「提高认识」「强化沟通」是讲义里点名的五类失分典型之二，
         没有主体、没有动作、没有时点
      3. **不命中得分点**——阅卷按过程名与术语给分，这段话里一个术语都没有

      A 错在方向：案例题**不看字数看命中**，五条精准的短句远胜一段空话。
      C 错在「引用原文」：依据只需一句话点到，不需要成段引用。
      D 错在答非所问：本题问的是「问题」，不涉及计算。

      **改进写法对照**（同一道题）：
      - 未编制经批准的项目管理计划，缺少范围、进度、成本基准
      - 未建立变更控制流程，客户新增需求未经影响分析与 CCB 审批即实施
      - 未识别关键相关方，验收标准未在前期达成一致
      - 未组织阶段验收，缺少验收记录与确认范围过程
      - 未开展经验教训总结，同类问题重复发生

      这五条每条都是「缺什么」，术语准确、动宾结构、可核对——这才是拿分的形态。
    source: manual

  # ── 2026-10-29 补格（二批）：S2 五大过程组的 33 个「单题格」补齐到 2 题 ──
  # 只补题量不足 2 的格子；已有 2 题以上的（KP-0203 L4、KP-0206 L3）不动。
  - id: RK-S2-038
    module_id: S2
    kp_id: KP-0201
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 识别相关方的产出是哪一份
    body_md: |
      识别相关方过程的主要产出是：
    options:
      - 相关方登记册
      - 沟通管理计划
      - 项目章程
      - 相关方参与计划
    answer: "A"
    explanation_md: |
      四个选项分属不同过程，按产出反推过程即可：

      | 产出 | 属于哪个过程 | 在哪个过程组 |
      | --- | --- | --- |
      | 项目章程 | 制定项目章程 | 启动 |
      | **相关方登记册** | **识别相关方** | **启动** |
      | 沟通管理计划 | 规划沟通管理 | 规划 |
      | 相关方参与计划 | 规划相关方参与 | 规划 |

      B 与 D 是最像的干扰项，因为都跟「人」有关。判别依据是**这一步在不在问「谁」**：
      识别相关方的唯一任务是找出「谁受影响、谁能影响」，产出就是一张名单加分类评估；
      沟通计划关心「怎么传信息」，参与计划关心「怎么让他支持」，两者都以登记册为输入。

      顺序上记一句：**先有名单，才谈策略。** 名单在启动组，策略在规划组。
    source: manual

  - id: RK-S2-039
    module_id: S2
    kp_id: KP-0201
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 商业论证与项目章程是什么关系
    body_md: |
      关于商业论证与项目章程的关系，下列说法正确的是：
    options:
      - 项目章程是商业论证的输入，先有章程才能开展论证
      - 商业论证回答「为什么值得做」，是项目章程的输入；章程回答「已获授权、谁负责」
      - 两者是同一份文件在不同阶段的叫法
      - 两者都由项目经理编写，只是提交对象不同
    answer: "B"
    explanation_md: |
      两者的先后与分工是一次性讲清的事：

      | 文档 | 回答什么 | 谁主导 | 位置 |
      | --- | --- | --- | --- |
      | 商业论证 | 为什么值得做、投入产出是否成立 | 发起方 / 商务 | 章程之前 |
      | 项目章程 | 已批准立项、谁负责、边界在哪 | 发起人发布 | 商业论证之后 |

      A 把输入方向弄反了。没有「值得做」的结论，就不会有立项授权——**论证在前，授权在后**。

      C 把两份文件合并。商业论证是**决策材料**，章程是**授权文件**，一份给决策者看，
      一份给执行者用，混成一份的结果是两头都不好用。

      D 错在编写主体。项目经理可以参与商业论证，但那份文件的性质是「论证给别人批」，
      由提出立项的一方主导；章程的发布权在发起人（章程由项目经理执笔是常见做法，
      但发布与批准不是他的权力）。
    source: manual

  - id: RK-S2-040
    module_id: S2
    kp_id: KP-0201
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 3
    title: 这个项目的章程该由谁签发
    body_md: |
      某公司中标市级政务云平台项目，合同已签订。公司安排技术副总老王担任项目负责人，
      由他组建团队并推进实施。项目需要从三个部门抽调人力，并申请一笔专项采购预算。

      按项目管理规范，该项目的章程应由谁签发？
    options:
      - 项目负责人老王
      - 客户方项目对接人
      - 能够为项目提供资源、并对项目结果负责的发起人
      - 公司项目管理办公室（PMO）
    answer: "C"
    explanation_md: |
      判据是**谁出资源、谁认账**。题干里两个信息是关键：需要从三个部门抽调人力、
      需要申请专项预算——能给这两样东西的人，才是发起人。

      A 是被授权者。老王可以执笔写章程（实际上多数项目就是这么干的），但**授权者必须比
      被授权者层级高**，自己签发等于自己给自己授权。

      B 是相关方，但不是发起人。客户方对接人既不出你公司的人力，也不批你公司的预算。
      客户可以是发起人——但前提是**这个项目的钱和资源主要来自客户**，本题不是。

      D 的 PMO 常被误认为「管项目的部门就管授权」。PMO 提供方法论、模板、监控与资源协调，
      但**授权是发起人的职责**，PMO 不能替代。

      一句话判据：**问「章程谁签」，先找「谁给钱给人、谁承担失败后果」。**
    source: manual

  - id: RK-S2-041
    module_id: S2
    kp_id: KP-0201
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: 相关方登记册该什么时候动
    body_md: |
      关于相关方登记册，下列说法正确的是：
    options:
      - 在启动阶段一次性完成，之后作为存档不再修改
      - 只在相关方主动提出诉求时才更新
      - 由客户方填写后交项目经理保管
      - 在全过程持续更新：新识别到相关方、相关方态度或影响力发生变化时都要更新
    answer: "D"
    explanation_md: |
      登记册是**动态文档**，这是它与其他启动阶段产出最不一样的地方。

      理由很实际：项目初期没人能穷举所有相关方。组织调整、监管介入、分包商更换、
      关键人调岗，都会带来新的相关方或改变既有相关方的影响力。A 的「一次性完成」
      会导致后期出现「这个人早该管，但名单上没有」的典型事故。

      B 只承认被动更新。但很多相关方不会主动找你——**监管方、审计方、上级主管部门
      往往在你出事时才出现**，等他们提诉求就已经晚了。正确做法是定期扫描。

      C 把填写权给了客户。登记册是项目经理维护的内部管理文件，里面通常包含对相关方的
      态度评估（支持 / 中立 / 反对）与影响力判断，这些内容不适合由客户填写。

      判据：**登记册回答「现在谁在场、他什么态度、有多大影响」，这三个变量都会变。**
    source: manual

  - id: RK-S2-042
    module_id: S2
    kp_id: KP-0201
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: medium
    level: 5
    title: 给自己项目做一次相关方盘点
    body_md: |
      选一个你正在做或做过的项目，完成三件事：
      1. 列出不少于 8 个相关方（写明身份与对该项目的具体诉求，不要只写「领导」「客户」）
      2. 按「权力—利益」两个维度把它们分到四类：重点管理 / 令其满意 / 随时告知 / 花最小精力监督
      3. 挑出其中 1 个你认为**最容易被漏掉**的相关方，说明漏掉会发生什么（要能指出具体后果）
    options: []
    answer: "8个带具体诉求的相关方；四类分档合理；指出一个易漏相关方并给出具体后果"
    explanation_md: |
      评分重心在第 1 问的**具体性**和第 3 问的**后果**，不在分类是否漂亮。

      合格示例（某政务数据共享项目）：
      | 相关方 | 具体诉求 | 权力 | 利益 | 分档 |
      | --- | --- | --- | --- | --- |
      | 市大数据局（业主） | 按期上线、通过考核 | 高 | 高 | 重点管理 |
      | 12 个委办局业务处室 | 少改流程、数据别出错 | 中 | 高 | 重点管理 |
      | 委办局信息中心 | 系统别给他们添运维负担 | 中 | 中 | 令其满意 |
      | 财政局 | 预算不超、程序合规 | 高 | 低 | 令其满意 |
      | 等保测评机构 | 按标准整改到位 | 中 | 低 | 随时告知 |
      | 一线窗口人员 | 操作简单、少录数据 | 低 | 高 | 随时告知 |
      | 运维外包商 | 明确交接界面与责任 | 低 | 中 | 随时告知 |
      | 审计部门 | 留痕完整、可追溯 | 高 | 低 | 令其满意 |

      **最容易被漏掉的往往是三类**：监管与审计口（平时不出现，出事才出现）、
      一线使用者（没权力但有真实反馈）、运维接手方（交付之后才痛）。

      合格的后果描述要能落到时间和事件上，例如：
      「漏了审计部门 → 项目验收前被要求补全变更与验收留痕，而我们前期按口头确认推进，
      补材料花了三周，验收延后一个月」；
      「漏了一线窗口人员 → 系统上线首周收到 60 多条工单，全是因为表单字段比原流程多，
      实际操作走不下去，被迫紧急改版」。

      不合格的写法：「漏了领导，会导致支持不足」——没说什么领导、什么支持、什么后果。
    source: manual

  - id: RK-S2-043
    module_id: S2
    kp_id: KP-0202
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 滚动式规划指的是什么
    body_md: |
      关于滚动式规划，下列说法正确的是：
    options:
      - 近期工作分解到工作包级别，远期只分解到规划包，随项目推进逐步细化
      - 每周重新排一次进度计划，保证计划最新
      - 按组织结构逐层分解，每一层由该层负责人编制
      - 计划编完后按季度整体修订一次
    answer: "A"
    explanation_md: |
      滚动式规划的核心是**粒度随时间变化**：近细远粗。

      A 说清了两个动作——近期到工作包（可估算、可派工）、远期到规划包（只到可以判断
      范围的粗度），并随推进细化。它解决的是一个真实矛盾：**远期的事本来就看不清楚，
      强行拆细只能靠编**。

      B 把「滚动」误解成「频繁重排」。重排是对已定计划的调整，滚动是分解深度的推进，
      两者不是一回事。而且每周重排会让团队对计划失去信任。

      C 讲的是 WBS 的分解方向错误。WBS 要面向可交付成果分解，不按组织结构分解——
      按部门拆会让同一个成果被切到多个部门，责任边界反而模糊。

      D 是「定期修订」，只说了频率没说粒度。滚动式规划的关键不是多久改一次，
      而是**远期的部分允许不细**。

      一句话：**滚动式规划解释的是「为什么前期计划只能粗」，它是正确做法，不是失职。**
    source: manual

  - id: RK-S2-044
    module_id: S2
    kp_id: KP-0202
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 项目管理计划是一份还是一套
    body_md: |
      关于项目管理计划的构成，下列说法正确的是：
    options:
      - 只有进度计划与成本预算两份，其余内容按需补充
      - 由各知识领域的专项子计划、三大基准与其他组件整合而成，整合责任在项目经理
      - 由各专业负责人分别编制，各自生效，不需要整合
      - 等同于项目章程，只是名称不同
    answer: "B"
    explanation_md: |
      「项目管理计划」字面上像一份文件，实质上是一套：**各专项子计划 + 三大基准 + 其他组件**。

      子计划按知识领域来：范围、进度、成本、质量、资源、沟通、风险、采购、相关方参与，
      九份起步；三大基准是范围、进度、成本；此外还有变更管理计划、配置管理计划、
      需求管理计划这类横向规则。

      A 少得太多。只有进度和成本两项，范围、质量、风险、沟通全无依据，
      项目一开工就会在「做什么、做到什么程度算好」上打架。

      C 错在「不需要整合」。各专业各写一份、各自生效，会出现三份计划互相矛盾——
      范围计划说做 10 个模块、进度计划排了 8 个模块的人力。**整合是项目经理不可外包的职责**，
      这也是「整合管理」排在十大领域第一位的原因。

      D 混淆了章程与计划。章程是**授权**（准不准做、谁负责），计划是**执行依据**
      （怎么做、分几步、花多少），前者由发起人发布，后者由项目经理编制并批准后执行。
    source: manual

  - id: RK-S2-045
    module_id: S2
    kp_id: KP-0202
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 3
    title: 这个 WBS 分支错在哪
    body_md: |
      某 WBS 的「系统测试」分支如下：父节点「系统测试」估算 120 小时，
      其下子节点为「单元测试」40 小时、「集成测试」35 小时。

      对该分支的评价，最准确的是：
    options:
      - 没有问题，测试工作本来就应留出余量
      - 粒度太粗，应继续拆分到 8 小时以下
      - 违反 100% 规则：子层工作之和必须等于父层，此处说明有工作被遗漏或父层估算偏高
      - 违反 100% 规则，应直接把父层估算改成 75 小时
    answer: "C"
    explanation_md: |
      100% 规则要求：**子层全部工作之和必须等于父层，不多不少**。

      40 + 35 = 75，与父层的 120 差 45 小时。这个差额只有两种解释，必须查清是哪一种：
      有工作没拆出来（例如「性能测试」「回归测试」「测试环境准备」），或父层估算本身偏高。

      A 把差额解释成「余量」。这是常见误判——**储备是单独管理的（应急储备 / 管理储备），
      不能默默藏在分解结构里**。藏在 WBS 里的余量既看不见也管不住。

      B 判断错了问题类型。工作包粒度的参考区间是 8 到 80 小时，40 与 35 小时都落在区间内，
      粒度不是问题。这道题的缺口在**加总**，不在**粗细**。

      D 是最像的干扰项，因为它看起来「解决了不一致」。但直接改父层等于**用数字抹平缺口**：
      如果缺的是漏拆的工作，改完父层后这块工作就永远从计划里消失了，验收时也无人认账。
      正确顺序是**先查漏，再定父层数字**。

      判据：**对不上就先找漏掉的工作，不要先改数字。**
    source: manual

  - id: RK-S2-046
    module_id: S2
    kp_id: KP-0202
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: 后期的测试阶段只写了两个字
    body_md: |
      项目启动会上，分管领导翻到进度计划的测试阶段，发现只有一行「系统测试」，
      没有分解、没有工期、没有责任人，当场质问：「为什么后面的测试这么粗？计划不完整就等于没计划。」

      项目经理的回应，最恰当的是：
    options:
      - 因为到时候还不确定，等确定了再补，现在没法写
      - 这是行业惯例，详细计划只在执行前才编
      - 应该承认计划不完整，承诺一周内把所有阶段都拆到工作包
      - 说明这是滚动式规划：远期按规划包管理、随推进细化，同时给出细化时点与责任人
    answer: "D"
    explanation_md: |
      这题考的是**能不能用专业语言解释一个正确的做法**。滚动式规划本身没问题，
      但「远期可以粗」必须配上「什么时候细化、谁负责」，否则就真成了拖延的借口。

      A 是错的答法：它只说「现在没法写」，没给机制也没给时点，听起来就是推脱，
      而且隐含「到那时自然就清楚了」的错误假设。

      B 拿惯例当理由，同样没有机制。领导质疑的正是「凭什么可以粗」，需要一个可检验的安排。

      C 表面态度最好，实际最不可取：**把远期全部拆到工作包，等于用编造的数字填满计划**。
      1800 个工作包的管理成本会压垮项目，而且那些数字在执行时必然全部作废——
      既浪费了时间，又让团队从此不信计划。

      D 三步齐全：给出方法（滚动式规划）、给出边界（远期只到规划包）、给出承诺
      （细化时点与责任人）。合格的补充说法例如：
      「测试阶段在开发完成前 4 周细化到工作包，责任人是测试组长，届时提交评审」。

      判据：**解释一个「看起来不完整」的做法时，必须同时给出可检验的下一步。**
    source: manual

  - id: RK-S2-047
    module_id: S2
    kp_id: KP-0202
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 5
    title: 把一个项目切成「近细远粗」两段
    body_md: |
      选一个你参与过的项目（周期不少于 3 个月），按滚动式规划做一次切分：
      1. 写出未来 4 周内的工作，至少 5 项，每项到「可派工、可估算」的粒度（写清谁做、几天）
      2. 写出 4 周之后的部分，只到「规划包」粒度（写清这一段要产出什么，但不必拆到活动）
      3. 说明你打算在什么时点、由谁、依据什么把远期细化成近期
    options: []
    answer: "近期5项可派工；远期按规划包写清产出；细化时点/责任人/依据三要素齐全"
    explanation_md: |
      评分重心在第 3 问——**细化机制**。前两问只证明你理解了粒度，第三问才证明你能落地。

      合格示例（某数据共享平台项目，当前处于第 2 个月）：
      1. 未来 4 周（可派工）：
         - 接口规范定稿并三方签字｜接口组小李｜5 个工作日
         - 完成 3 个委办局的库表摸底｜数据组小张｜8 个工作日
         - 搭建开发与测试环境｜运维老陈｜3 个工作日
         - 统一认证对接联调｜后端小王｜6 个工作日
         - 第一轮原型评审并出纪要｜项目经理｜2 个工作日
      2. 4 周之后（规划包）：
         - 「批量数据接入」：完成剩余 9 个委办局的数据接入与校验
         - 「业务功能开发」：事项管理、审批流转、电子证照三个子系统
         - 「测评与上线」：等保整改、第三方测评、试运行与培训
      3. 细化机制：**每两周的迭代规划会上，由各组长把下一个 4 周的规划包拆到工作包**；
         依据是上一轮的实际速度、接口方反馈、以及等保测评的时间约束；
         拆完的结果进入进度基准的变更流程（改动超过 10% 走 CCB）。

      三个常见不合格：
      - 近期工作写成「推进开发」「配合测试」——不可派工也不可估算
      - 远期直接写成「剩下的事」——没有产出描述，等于没规划
      - 第 3 问写「到时候再说」——这正是滚动式规划被滥用时的样子

      **判据一句话**：滚动式规划的合法性来自**细化机制的存在**，不是来自「远期可以粗」。
    source: manual

  - id: RK-S2-048
    module_id: S2
    kp_id: KP-0203
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 哪一条是工作绩效数据
    body_md: |
      下列四条记录中，属于工作绩效数据的是：
    options:
      - 本周完成 3 个模块，累计支出 12 万元
      - 进度落后计划 8%，成本超支 5%
      - 月度项目状态报告（含趋势分析与建议）
      - 客户提出的一项范围变更请求
    answer: "A"
    explanation_md: |
      三件套的区别只看一句话：**有没有经过对比与汇总**。

      | 层级 | 长什么样 | 谁产出 |
      | --- | --- | --- |
      | **工作绩效数据** | 原始记录，还没跟计划比 | 执行过程组 |
      | 工作绩效信息 | 与基准对比后的结论 | 各控制过程 |
      | 工作绩效报告 | 汇总成决策材料 | 监控项目工作 |

      A 是原始记录：完成了多少、花了多少，都是事实，不含判断，属于**数据**。

      B 已经做了对比（「落后 8%」「超支 5%」），是**信息**。
      C 是汇总后的决策材料，是**报告**。
      D 是变更请求，它是很多过程的输出，但不属于绩效三件套中的任何一级。

      这条区分在案例题里很实用：问「项目缺少哪些监控动作」，
      如果只产出数据、从没做对比，答案就是「缺少工作绩效信息的生成，监控未形成结论」。
    source: manual

  - id: RK-S2-049
    module_id: S2
    kp_id: KP-0203
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 建设团队与管理团队的分工
    body_md: |
      关于建设团队与管理团队，下列说法正确的是：
    options:
      - 两者是同一件事的两种叫法，取决于组织习惯
      - 建设团队提升能力与凝聚力（培训、集中办公、团队活动、认可奖励），管理团队跟踪绩效、解决冲突、处理问题成员
      - 建设团队由人力资源部门负责，管理团队由项目经理负责
      - 建设团队只在团队组建时做一次，之后不再需要
    answer: "B"
    explanation_md: |
      两者的动作对象不同：**建设团队对着「能力与关系」，管理团队对着「绩效与冲突」**。

      建设团队的手段：培训、集中办公、虚拟团队协作、团队建设活动、认可与奖励、制定团队章程。
      目标是让人「会干、愿意一起干」。

      管理团队的动作：跟踪团队成员绩效、提供反馈、解决冲突、管理变更以优化团队绩效。
      目标是让「干得不对的地方被纠正」。

      A 把两者合并。合并的后果很实际：只会做团建不会处理问题成员，团队氛围好但进度拖；
      只会盯绩效不会建设，人走光。

      C 错在把建设团队推给 HR。HR 提供培训资源与制度支持，但**团队怎么建是项目经理的事**——
      谁该学什么、谁和谁不在一地、奖励什么行为，只有项目经理判断得了。

      D 错在「只做一次」。团队在不同阶段需求不同：形成期要明确目标、震荡期要建规则、
      规范期要巩固流程、成熟期要授权扩责。塔克曼阶梯的每一段都对应不同的建设动作。
    source: manual

  - id: RK-S2-050
    module_id: S2
    kp_id: KP-0203
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 3
    title: 时间紧、双方各有道理，用哪种冲突处理方式
    body_md: |
      两位核心成员在接口方案上争执两周：A 主张用消息队列解耦，B 主张直接同步调用。
      双方都有部分道理，但项目下周必须进入联调，不能再拖。

      作为项目经理，此刻最合适的冲突处理方式是：
    options:
      - 强迫：由项目经理直接拍板采用 A 方案，要求 B 执行
      - 回避：先搁置争议，让两人各自继续做手头其他工作
      - 妥协：促成双方各让一步，形成「核心链路同步、非核心异步」的折中方案并当场确认
      - 缓和：强调两人都是团队骨干、关系最重要，方案分歧先放一放
    answer: "C"
    explanation_md: |
      五种冲突处理方式的适用条件要能对上场景：

      | 方式 | 什么时候用 |
      | --- | --- |
      | 合作 / 解决问题 | 时间充裕、双方目标可兼容，追求双赢 |
      | **妥协** | **时间紧、双方各有部分道理，需要一个都能接受的方案** |
      | 强迫 | 紧急且必须快速决断、或涉及安全底线 |
      | 回避 | 议题不重要，或需要冷却情绪 |
      | 缓和 | 关系比议题重要，先维持表面一致 |

      题干给了两个条件：**下周必须联调（时间紧）**、**双方各有部分道理（没有一方明显错）**。
      这正好落在妥协的适用区间，而且 C 给的是具体折中方案，不是空谈「各让一步」。

      A 的强迫不是不能用，但用在这里代价高：B 的主张有道理却被否，后续联调出问题时
      不会主动补位，而且团队会学到「争不过就闭嘴」。

      B 与 D 都是回避型。搁置的结果是下周联调时方案还没定；强调关系不解决技术分歧，
      只把分歧推到更晚、更贵的时候。

      判据：**先看时间和道理在谁那边，再选方式。** 时间紧 + 各有道理 = 妥协。
    source: manual

  - id: RK-S2-051
    module_id: S2
    kp_id: KP-0203
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: medium
    level: 5
    title: 写一页能用的经验教训登记册
    body_md: |
      选一个你参与过的项目，写一页经验教训登记册（不少于 4 条），要求：
      1. 每条写清「发生了什么（事件）→ 影响是什么（量化）→ 下次怎么做（动作）」
      2. 至少 1 条是**负面**的（做错的事），至少 1 条是**正面**的（做对的事）
      3. 说明这页登记册打算交给谁、用在哪里
    options: []
    answer: "4条三段式（事件→影响→动作）；含正负各一条；写清交给谁与用在哪"
    explanation_md: |
      评分重心在**第三段「下次怎么做」**是否可执行，以及第 3 问的**流向**。

      合格示例：
      | 事件 | 影响 | 下次怎么做 |
      | --- | --- | --- |
      | 接口文档只约定了字段名，未约定枚举值域 | 联调停工 9 天，A 系统 4 种状态、B 系统只认 3 种 | 接口规范模板增加「取值范围 / 异常返回 / 超时重试」三栏，三方签字后开发 |
      | 需求评审只走业务处室，未拉一线窗口人员 | 上线首周 60 余条工单，被迫紧急改版 | 评审清单增加「一线使用者」必到项，缺席则评审不通过 |
      | 每周五固定出一次偏差简报，抄送三方 | 客户在问题变大前就知情，两次范围争议都在周内解决 | 保留该机制，写进项目管理计划的沟通章节 |
      | 等保测评在开发完成后才启动 | 整改返工 3 轮，上线延后 6 周 | 设计阶段即引入测评机构做预评估 |

      **正面经验也要写**。很多人的登记册只记事故，结果组织学不到「为什么这次做对了」，
      同样的正确做法无法复制。

      第 3 问的合格回答要具体：
      「交项目经理汇总，进入公司的项目复盘库；下个同类项目的启动会上作为必读材料，
      并把接口规范模板、评审清单两处直接更新进组织模板。」

      不合格的样子：「加强沟通」「提高认识」「下次注意」——没有动作、没有对象、没有时点，
      这种条目写十页也不产生任何改变。
    source: manual

  - id: RK-S2-052
    module_id: S2
    kp_id: KP-0204
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 确认范围由谁来做
    body_md: |
      确认范围过程的执行主体是：
    options:
      - 项目团队内部的质量小组
      - 组织的质量管理部门
      - 第三方监理单位
      - 客户或发起人
    answer: "D"
    explanation_md: |
      确认范围做的是**正式验收**——判断成果能不能被接收。所以做的人是**有权接收的人**：
      客户或发起人。

      A 与 B 做的是控制质量：按标准检查成果合格不合格，是内部动作。

      两者的区别可以一句话记住：

      | 对比项 | 控制质量 | 确认范围 |
      | --- | --- | --- |
      | 谁做 | 团队内部 | 客户 / 发起人 |
      | 验什么 | 符合不符合质量标准 | 满足不满足需求、能不能收 |
      | 顺序 | 先 | 后 |

      C 的监理是独立第三方，负责监督过程与质量，可以参与验收但**不是接收方**；
      接收的权力在客户。

      顺序上还有一条实务判据：**先自检，再送验**。跳过控制质量直接送客户，
      返工代价高且损伤信任。
    source: manual

  - id: RK-S2-053
    module_id: S2
    kp_id: KP-0204
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 监控项目工作的核心产出
    body_md: |
      监控项目工作过程的主要产出是：
    options:
      - 工作绩效报告
      - 工作绩效数据
      - 可交付成果
      - 变更请求的审批结论
    answer: "A"
    explanation_md: |
      三个层级的产出与过程的对应关系：

      | 产出 | 由谁产出 |
      | --- | --- |
      | 工作绩效数据 | 执行过程组（指导与管理项目工作） |
      | 工作绩效信息 | 各控制过程（控制范围、控制进度、控制成本……） |
      | **工作绩效报告** | **监控项目工作** |

      B 是执行组的产出，方向反了。
      C 是执行组的产出（做出来的东西），而且它是「输入」给监控去比对的，不是监控的输出。
      D 的审批结论由 CCB 给出（实施整体变更控制），不是监控项目工作的产出。

      记住这条链：**数据在下面长出来（执行）→ 信息在控制过程算出来（对比）→ 报告在监控里汇总上去（决策）。**
      监控项目工作的职责就是最后这一步：把散在各处的信息汇总成状态报告、进展报告、仪表盘。
    source: manual

  - id: RK-S2-054
    module_id: S2
    kp_id: KP-0204
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 3
    title: 合同收尾在哪个过程完成
    body_md: |
      某项目在收尾阶段需要完成 6 份采购合同的收尾工作。按现行过程划分，合同收尾在哪个过程中完成？
    options:
      - 结束项目或阶段
      - 控制采购
      - 实施采购
      - 规划采购管理
    answer: "B"
    explanation_md: |
      合同收尾归属**控制采购**，这是判断题与单选题的高频坑。

      历史原因是这条规定的来源：早期版本单列过「结束采购」这个过程，
      后来被并入控制采购。所以旧教材的答案「结束采购」在今天算错，正确答案是控制采购。

      四个过程的分工：

      | 过程 | 管什么 |
      | --- | --- |
      | 规划采购管理 | 决定买什么、怎么买、合同类型 |
      | 实施采购 | 选卖方、签合同 |
      | **控制采购** | 履约管理、验收、**合同收尾**、索赔与变更 |
      | 结束项目或阶段 | 行政收尾：验收、归档、释放资源、经验教训 |

      A 是最像的干扰项——「收尾」两个字直接出现在选项里。判别依据是**对象**：
      结束项目或阶段管的是整个项目（收一次），控制采购管的是每一份合同（几份收几次）。

      本题 6 份合同，就是 6 次合同收尾，全部在控制采购里完成。
    source: manual

  - id: RK-S2-055
    module_id: S2
    kp_id: KP-0204
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: 监控到底什么时候做
    body_md: |
      某项目在收尾阶段才发现成本已超支 40%。复盘时发现：前 5 个月只做月度汇总，
      数据到第 6 个月才第一次与基准比对，此前的偏差从未被识别。

      针对该项目的监控过程组执行情况，最准确的判断是：
    options:
      - 监控本身就是后期工作，前期以规划和执行为主，属于正常节奏
      - 监控只需在里程碑节点做，月度汇总已经足够
      - 监控贯穿项目全程：前期偏差未及时识别与纠偏，会累积到后期无法挽回
      - 问题出在成本估算不准，与监控无关
    answer: "C"
    explanation_md: |
      题干里最关键的一句是「**前 5 个月只做汇总，从未与基准比对**」——数据有了，
      但没有做「比较」这一步，监控就等于没做。

      监控 = 测量 + **比较** + 纠偏。缺了比较，只剩记录。

      A 错在把监控当成后期动作。这是最常见也最贵的误解：前期偏差小、纠正便宜；
      等到后期才发现，往往已经无法通过调整挽回，只能追加预算或延期。

      B 把频率定得太低。里程碑之间可能隔两三个月，这期间偏差足以把预算吃掉一半。
      监控频率应随风险高低调整，高风险阶段要更密。

      D 把监控问题归给估算。即使估算不准，若第一个月就比对出偏差，
      调整的范围也远小于 5 个月后才发现。**估算不准是常态，监控就是为它存在的。**

      判据：**监控的价值不在发现问题，在于「早」发现。** 越晚发现，可选动作越少。
    source: manual

  - id: RK-S2-056
    module_id: S2
    kp_id: KP-0204
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 5
    title: 设计一次真正的验收
    body_md: |
      你负责的系统即将交付。请设计这次验收，写清四件事：
      1. 验收前团队内部要做哪些动作（顺序写清）
      2. 验收由谁组织、谁签字、依据什么文件判断通过
      3. 如果不通过，退回流程怎么走（谁决定返工、返工后怎么复验）
      4. 写出一条你认为最容易被跳过、但后果最严重的环节，并说明后果
    options: []
    answer: "自检在前、验收主体与依据明确、退回与复验流程闭环、指出最易被跳过的环节及后果"
    explanation_md: |
      评分重心在第 1 问的**顺序**与第 3 问的**闭环**。

      合格示例：
      1. 内部动作（按顺序）：
         - 控制质量：按测试用例完成功能、性能、安全检查，缺陷收敛到约定阈值
         - 整理验收材料：需求对照表（逐条标明实现情况）、测试报告、部署与回滚方案、
           培训记录、运维交接清单
         - 内部预验收：项目经理组织，逐条走需求对照表，缺口先补
      2. 验收组织：客户方业务负责人组织，客户项目负责人与公司项目负责人共同签字；
         依据是合同附件中的需求规格说明书与验收标准（不是口头约定，也不是演示效果）
      3. 退回流程：不通过项逐条记录为缺陷单，明确责任方与整改期限；
         整改完成后**只复验不通过项 + 相关回归范围**，由原验收组复验并签字；
         影响范围的重大缺口走变更或补充协议，不默默延后
      4. 最易被跳过：**需求对照表的逐条核对**。跳过它的后果是验收变成「看演示」——
         演示走的是准备好的路径，而业务上的边界情况全被绕过，
         上线后逐条暴露，届时已过验收签字，责任与整改成本都落到运维。

      三个常见不合格：
      - 只写「组织客户验收」——没有依据文件，验收就变成比谁嗓门大
      - 退回流程只写「返工」——没说谁决定、谁复验，返工完没人认账
      - 第 4 问答「培训容易被跳过」——后果说得笼统，不如需求对照表致命

      **判据一句话**：验收的本质是**用文件对账**，不是用演示取信。
    source: manual

  - id: RK-S2-057
    module_id: S2
    kp_id: KP-0205
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 收尾过程组有几个过程
    body_md: |
      在五大过程组中，收尾过程组包含的过程数量是：
    options:
      - 五个
      - 三个
      - 两个
      - 一个
    answer: "D"
    explanation_md: |
      收尾过程组**只有一个过程：结束项目或阶段**。它是五个过程组里过程最少的一组。

      数量少不代表事少——这一个过程要完成六件事：确认工作已完成并验收、移交成果、
      归档文件、释放资源、总结经验教训、人员安置。

      「只有两个」这个干扰项来自把「行政收尾」与「合同收尾」当成两个过程。
      实际上它们是两种收尾**动作**，行政收尾在结束项目或阶段里完成，
      **合同收尾在控制采购里完成**，不在收尾过程组。

      对照记一下各过程组的过程数量级（不必背精确数字，记相对多少即可）：
      启动 2 个（最少之外）、收尾 1 个（最少）、规划最多、执行与监控居中。
    source: manual

  - id: RK-S2-058
    module_id: S2
    kp_id: KP-0205
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 行政收尾与合同收尾的区别
    body_md: |
      关于行政收尾与合同收尾，下列说法正确的是：
    options:
      - 行政收尾对整个项目或阶段做一次；合同收尾对每一份合同各做一次
      - 两者完全等价，只是不同教材的叫法不同
      - 行政收尾由客户执行，合同收尾由项目经理执行
      - 两者都在结束项目或阶段过程中完成
    answer: "A"
    explanation_md: |
      判别依据是**对象的数量**：

      | 对比项 | 行政收尾 | 合同收尾 |
      | --- | --- | --- |
      | 对象 | 整个项目或阶段 | 每一份具体合同 |
      | 次数 | 一个项目一次（分阶段则每阶段一次） | 有几份合同就几次 |
      | 在哪完成 | 结束项目或阶段 | **控制采购** |

      B 把两者合并。它们的关注点不同：行政收尾关心项目整体是否完整结束（文档、验收、
      资源、经验教训），合同收尾关心每一份合同的权利义务是否结清（条款履行、索赔、尾款）。

      C 把执行主体对错了。行政收尾由项目经理组织，合同收尾由采购与商务口配合完成，
      两者的执行者都不是客户。

      D 是最常见的错误——**合同收尾不在收尾过程组**，它在控制采购里。这一条几乎是必考点。
    source: manual

  - id: RK-S2-059
    module_id: S2
    kp_id: KP-0205
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 3
    title: 项目被叫停之后怎么办
    body_md: |
      某政务系统项目执行到第 8 个月，因机构改革被主管部门要求终止，剩余工作不再进行。
      项目已投入 260 万元，与三家供应商签有合同，其中两家尚有未结算款项。

      项目经理接下来最恰当的做法是：
    options:
      - 立即解散团队、通知成员返回原部门，项目终止即告结束
      - 执行收尾：与供应商清算已完成工程量与合同关系，归档项目文档，释放资源，
        总结并归档经验教训，形成正式的终止记录
      - 把剩余工作整体移交给运维部门继续推进
      - 等主管部门出具正式书面文件后再做任何处理
    answer: "B"
    explanation_md: |
      核心判据：**提前终止 ≠ 免收尾**。无论正常完工、被叫停、预算被砍还是需求消失，
      都必须执行收尾。

      B 列的几件事正是终止场景下最容易漏、代价最大的：合同清算（涉及已完工程量结算、
      可能的违约金与预付款追回）、文档归档、资源释放、经验教训。
      题干特意给了「三家供应商、两家未结算」，这就是在提示合同清算不能跳过。

      A 是最常见的错误做法。团队一散、人一调岗，两个月后要核对工程量时已经找不到人，
      账算不清就只能按对方报的数认。

      C 把终止变成转交。运维接手要有人、有预算、有明确的交接界面，
      这些条件都不具备时「转给运维」只是把问题挪了个地方。

      D 的等待看似稳妥，实际风险最大：**在等待期间合同仍在计时、资源仍在占位**。
      正确做法是立即启动可控部分的收尾（冻结支出、保全文档、通知供应商暂停），
      同时并行等书面文件，而不是停摆。
    source: manual

  - id: RK-S2-060
    module_id: S2
    kp_id: KP-0205
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: 项目不顺利，还要总结经验教训吗
    body_md: |
      某项目严重延期、客户投诉不断，团队士气低落。项目结束时，项目经理认为
      「这次做得不好，没什么可总结的，等下次做成一个漂亮项目再说」。

      对这个判断的评价，最准确的是：
    options:
      - 合理，失败项目的过程本身不规范，总结出来的经验不可靠
      - 合理，等有成功案例后再沉淀，对团队更有正面作用
      - 不正确：经验教训是必须项，越是出问题的项目，其教训对组织过程资产的价值越大
      - 不正确，但可以先口头沟通，不必形成书面记录
    answer: "C"
    explanation_md: |
      经验教训是**必须项，不是加分项**，这一点不因项目成败而改变。

      从组织角度看得更清楚：成功项目的经验往往难以复制（有运气、有特定的人），
      而**失败项目暴露的是流程与制度的缺口**——这些缺口在下一个项目里同样存在。
      所以失败项目的教训对组织过程资产的价值反而更高。

      讲义里点过这个逻辑：项目结束不总结，等于把学费白交。

      A 把「过程不规范」当成不总结的理由，恰好说反了：过程不规范正是需要被记录下来的东西。

      B 的「等成功再说」在实务中等于永远不做——项目总有遗憾，永远等不到那个「漂亮项目」。

      D 退了一步，但仍错。口头沟通不进入经验教训登记册，就无法沉淀为模板改进、
      估算参数校正、风险清单更新这些可复用的资产。**没写下来的经验，下一个人拿不到。**
    source: manual

  - id: RK-S2-061
    module_id: S2
    kp_id: KP-0205
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 5
    title: 写一份提前终止的收尾方案
    body_md: |
      场景：你负责的项目已执行 7 个月，累计投入 180 万元，总预算 300 万元。
      客户方因机构调整决定终止项目，剩余功能不再开发。项目有 4 家供应商，
      其中 2 家服务期未满，1 家已交付未验收，团队 9 人。

      请写出这份终止收尾方案，至少包含五块内容，每块写清「做什么、谁负责、什么时候完成」。
      另外回答一句：这种情况下，哪一块最容易被认为是「不必要」的，为什么它其实必要？
    options: []
    answer: "五块：合同与结算、交付物与验收、文档归档、资源释放、经验教训，各带责任人与时点；指出最易被省掉的一块并说明代价"
    explanation_md: |
      评分重心在**责任人与时点是否落地**，以及最后那句「哪一块最容易被省掉」的判断。

      合格方案的五块（对照看自己的答案缺哪块）：
      1. **合同与结算**（商务 + 项目经理，2 周内）：逐份核对已完成工程量与付款进度；
         2 家服务期未满的按合同条款协商终止与补偿；1 家已交付未验收的立即组织验收再结算；
         形成终止协议与结算清单
      2. **交付物与验收**（项目经理 + 客户对接人，3 周内）：已完成部分逐条对照需求清单确认，
         取得客户对「已完成范围」的书面确认——**这一步决定了已投入的 180 万能不能算数**
      3. **文档归档**（项目经理 + 文档管理员，4 周内）：需求、设计、测试、变更、会议纪要、
         验收记录全部归档；代码与数据按客户要求移交或封存
      4. **资源释放**（项目经理 + 部门经理，2 周内）：9 人分批返岗并确认接收部门；
         服务器与云资源退订（**这一项不办就一直产生费用**）；账号与权限回收
      5. **经验教训**（项目经理，终止后 2 周内）：重点记录「终止的预警信号何时出现、
         当时为什么没处理」，进入组织复盘库

      **最容易被认为不必要的是第 2 块（已完成部分的书面确认）**，理由往往是
      「项目都停了，还验收什么」。它其实最必要：没有客户对已完成范围的书面确认，
      已投入的 180 万元在结算与审计时无法证明对应的工作已经完成，
      最坏情况是按未完成处理、全额退回或无法结算——**项目可以停，钱不能不认账**。

      次容易被省的是第 4 块里的资源退订：团队散了没人管服务器，
      云账单继续按月扣，几个月后才被发现。
    source: manual

  - id: RK-S2-062
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 挣值 EV 到底是什么
    body_md: |
      挣值分析中，EV（挣值）的含义是：
    options:
      - 到检查点为止实际花掉的钱
      - 到检查点为止计划要完成的工作的预算
      - 整个项目的总预算
      - 到检查点为止实际已完成的工作所对应的预算价值
    answer: "D"
    explanation_md: |
      EV 是四个基础量里最容易认错的一个，四个选项正好对应四个量：

      | 选项 | 其实是 |
      | --- | --- |
      | A 实际花掉的钱 | AC（实际成本） |
      | B 计划要完成的工作的预算 | PV（计划价值） |
      | C 整个项目的总预算 | BAC（完工预算） |
      | **D 已完成工作的预算价值** | **EV（挣值）** |

      关键是两个词：**已完成**（不是计划要完成）+ **预算价值**（不是实际花的钱）。

      理解它的作用：EV 把「进度」翻译成「钱」，这样进度和成本才能放在同一把尺子上比。
      完成了 35% 的工作，就按预算的 35% 计价值——至于这 35% 实际花了多少，那是 AC 的事。

      最常见的两种错法：拿 AC 当 EV（这样 CPI 恒等于 1，永远算不出超支），
      拿 PV 当 EV（这样 SPI 恒等于 1，永远算不出落后）。两个都错，且都不会报错，
      只是结论全假。
    source: manual

  - id: RK-S2-063
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 这四个数字分别说明什么
    body_md: |
      某项目检查点的数据为：PV = 200 万元，EV = 180 万元，AC = 210 万元，BAC = 500 万元。

      对这四个数字的解读，正确的是：
    options:
      - 计划完成 200 万元的活，实际完成 180 万元的活，已花掉 210 万元，项目总预算 500 万元
      - 实际完成 200 万元的活，计划完成 180 万元的活，已花掉 500 万元，项目总预算 210 万元
      - 计划花 210 万元，实际花 180 万元，剩余预算 200 万元，总预算 500 万元
      - 四个数字都是累计实际支出，只是统计口径不同
    answer: "A"
    explanation_md: |
      四个量的口径一次认清（它们都是「到检查点为止」的累计值）：

      | 符号 | 名字 | 一句话 |
      | --- | --- | --- |
      | PV | 计划价值 | **按计划**此刻本该完成多少活（折成预算） |
      | EV | 挣值 | **实际**完成了多少活（折成预算） |
      | AC | 实际成本 | 实际花掉多少钱 |
      | BAC | 完工预算 | 整个项目的总预算 |

      套本题：计划该做完 200 万的活，实际只做完 180 万的活，钱花了 210 万，总预算 500 万。
      由此还能直接读出状态：进度落后（EV < PV）、成本超支（EV < AC）。

      B 把 PV 与 EV 对调，并错配了 AC 与 BAC。
      C 把 AC 当成了「计划花」，PV 与 AC 的关系搞反了。
      D 把四个量都当成实际支出——若真如此，四个数字应当相等，读它们就没有意义了。

      **口径记法**：PV 与 EV 都是「预算口径」，区别只在计划与实际；AC 是唯一一个「实际花钱口径」；
      BAC 是全程的总盘子。
    source: manual

  - id: RK-S2-064
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: SV 为负就一定延期吗
    body_md: |
      某项目检查点算出进度偏差 SV = −30 万元。项目经理据此判断「项目一定延期」，并要求全员加班赶工。

      对这个判断的评价，最准确的是：
    options:
      - 正确，SV 为负就说明进度落后，落后必然导致完工延期
      - 正确，只要立即赶工就能把进度追回来，越早行动越好
      - 不完全正确：SV 为负说明进度落后，但若落后的活动不在关键路径且总时差足够，
        完工日期可能不受影响，应先判断关键路径再决定是否赶工
      - 错误，SV 为负实际表示成本超支，与进度无关
    answer: "C"
    explanation_md: |
      这道题的分水岭是**「进度落后」与「完工延期」不是一回事**。

      SV 为负只说明到检查点为止完成的工作少于计划（挣值口径），
      它不回答「最终能不能按期交付」——那要看**关键路径**。

      如果落后的活动不在关键路径上、且延误没有超过它的总时差，后续有充足时间补上，
      完工日期不受影响。此时全面赶工不但浪费成本，还会因为加人带来新的协调成本与质量风险。

      A 是最普遍的错法：把检查点的偏差直接等同于最终交付结果。

      B 更危险：在没判断路径性质前就加班，等于用成本去买一个可能并不需要的进度。

      D 把 SV 与 CV 弄混了。SV = EV − PV 管进度，CV = EV − AC 管成本，
      字母只差一个，含义完全不同。

      正确的动作顺序：**先看落后的是不是关键活动、总时差还剩多少，再决定赶工、快速跟进还是只观察。**
      （这条与 S2 监控过程组那道「偏差处理链条」是同一个判据。）
    source: manual

  - id: RK-S2-065
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 5
    title: 用真实数字写一份挣值月报
    body_md: |
      场景：某项目总预算 BAC = 400 万元，计划工期 10 个月，现进入第 5 个月末。
      数据：到本期末按计划应完成 50% 的工作（PV = 200 万），实际完成 42%（EV = 168 万），
      已支出 195 万元（AC = 195 万）。项目经理判断：超支主要来自前期一次性采购溢价，
      已通过重新议价纠正，剩余工作可按原预算执行。

      请完成：
      1. 算出 CV、SV、CPI、SPI，并各用一句话说明它的含义
      2. 判断该用哪个 EAC 公式，算出 EAC 与 VAC
      3. 给出接下来三个月的措施（不少于 3 条），每条写清预期改变哪个指标
    options: []
    answer: "CV=-27万 SV=-32万 CPI=0.86 SPI=0.84；非典型偏差 EAC=427万 VAC=-27万；3条措施各自对应指标"
    explanation_md: |
      评分重心在**第 2 问的公式选择理由**与第 3 问「措施对应指标」的对应关系。

      1. 四个指标：
         - **CV = EV − AC = 168 − 195 = −27 万元**，负数表示成本超支 27 万
         - **SV = EV − PV = 168 − 200 = −32 万元**，负数表示进度落后 32 万（按预算折算）
         - **CPI = EV ÷ AC = 168 ÷ 195 ≈ 0.86**，小于 1 表示钱花得比计划快，
           每花 1 元只挣回 0.86 元的价值
         - **SPI = EV ÷ PV = 168 ÷ 200 = 0.84**，小于 1 表示进度落后，只完成了计划的 84%

         一句话概括状态：**又慢又超支**。

      2. EAC 的公式选择：题干写明「已通过重新议价纠正、剩余可按原预算执行」，
         这是**非典型偏差**，用 **EAC = AC + (BAC − EV) = 195 + (400 − 168) = 427 万元**。
         **VAC = BAC − EAC = 400 − 427 = −27 万元**，即最终会超 27 万——正好等于已发生的 CV，
         这本来就是非典型偏差的性质：**超支的那部分已经花掉，追不回来，但不会继续扩大**。

         如果误判成典型偏差，会算出 EAC = BAC ÷ CPI = 400 ÷ 0.86 ≈ 465 万元，
         多算 38 万，会导致过度紧缩预算、砍掉不该砍的工作。

      3. 措施要能对上指标：
         - 对 SPI：把非关键路径上的测试准备提前并行（快速跟进），预期把接下来两个月的
           SPI 拉回 0.95 以上；同时每周出一次偏差简报，偏差超 5% 就纠偏
         - 对 CPI：对剩余采购按框架协议集采、并把外包单价重谈，预期把接下来三个月的
           单位成本降 8%，CPI 回到 0.95 以上
         - 对进度真实含义：先确认落后的 32 万是否涉及关键路径——若不在关键路径且总时差足够，
           只做局部调整，不搞全员加班（**否则会为了账面上的 SPI 牺牲真实成本**）
         - 对预测：一个月后重算 EAC，若发现超支又开始累积，说明「已纠正」的判断不成立，
           应改用典型偏差公式重新预测

      常见失分：只算不判（算完四个数就结束）、措施写「加强成本控制」（对不上任何指标）、
      公式用反（该用非典型却用了 BAC ÷ CPI）。
    source: manual

  - id: RK-S2-066
    module_id: S2
    kp_id: KP-0207
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: CCB 是干什么的机构
    body_md: |
      关于变更控制委员会（CCB），下列说法正确的是：
    options:
      - 变更的执行机构，负责编写实施方案并落地改动
      - 由项目经理一人组成，以便快速决策
      - 变更的审批机构，负责决定批准、否决或推迟，不负责实施
      - 只在项目收尾阶段成立，用于处理遗留变更
    answer: "C"
    explanation_md: |
      CCB 的定位只有一句话：**决策机构，不是执行机构**。

      它决定「做不做、什么时候做、按哪个方案做」，至于怎么写代码、怎么改配置，
      那是执行团队的事。这个边界不清，就会变成「审批的人也在干活」，
      既没有制衡，也拖慢决策。

      A 把两个角色合并了。B 与 A 相反方向的错：CCB 通常由发起人、客户代表、
      技术负责人、商务负责人组成，**项目经理往往是被评审方之一**，让他一个人说了算
      等于取消了这道关。

      D 错在成立时机。CCB 在项目早期（规划阶段编制变更管理计划时）就要明确成员与议事规则，
      而且要贯穿全程——变更在任何阶段都会发生，尤其在执行期最频繁。

      顺带记住三条配套规则：
      - 基准变更**必须**经 CCB 批准（项目经理无权自行改基准）
      - 变更**被否决也要记录**，避免同一变更被反复提出
      - 紧急变更可边处置边报批，但事后要补齐审批与记录
    source: manual

  - id: RK-S2-067
    module_id: S2
    kp_id: KP-0207
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 变更都从哪儿来
    body_md: |
      关于变更的来源，下列说法正确的是：
    options:
      - 只有客户提出的需求调整才算变更
      - 只有内部技术方案调整才算变更
      - 只有法规与标准更新引起的调整才算变更
      - 客户需求调整、法规标准更新、技术方案变更、执行偏差需纠偏、风险发生后的应对，
        都属于变更来源；来源不同，但走的流程相同
    answer: "D"
    explanation_md: |
      变更的来源至少有五类：

      | 来源 | 典型例子 |
      | --- | --- |
      | 客户需求调整 | 新增一个导出功能、改审批流程 |
      | 法规与标准更新 | 等保标准换版、数据合规新规 |
      | 技术方案变更 | 中间件替换、架构调整 |
      | 执行偏差纠偏 | 进度落后需要调整基准 |
      | 风险发生后的应对 | 供应商断供，改用备选方案 |

      A、B、C 都把来源限定为单一类型，是典型的「只见过一种变更」的答法。

      **本题更重要的一半是最后一句：来源不同，流程相同。**
      变更控制**没有例外通道**——不管是谁提的、什么原因提的，都要走同一套流程：
      书面申请 → 记录初审 → 影响分析 → CCB 审批 → 实施 → 验证归档。

      实务中最常破的口子恰恰来自「内部原因」：技术方案调整常被认为「我们自己决定就行」，
      结果改动没留痕、基准没更新，后期对不上账。

      判据：**判断一件事是不是要走变更流程，看它是否影响基准，不看它由谁提出。**
    source: manual

  - id: RK-S2-068
    module_id: S2
    kp_id: KP-0207
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 3
    title: 影响分析做完了，下一步做什么
    body_md: |
      客户已提交书面变更申请，项目经理已组织完成对范围、进度、成本、质量、风险的影响分析，
      分析结论是「会延长工期 2 周、增加成本 18 万元」。

      按变更控制六步流程，下一步应当：
    options:
      - 提交 CCB 审批
      - 直接安排实施变更
      - 更新范围、进度、成本基准
      - 验证变更结果并归档
    answer: "A"
    explanation_md: |
      六步顺序是：**书面申请 → 记录初审 → 影响分析 → CCB 审批 → 实施 → 验证归档**。

      题干已经完成前三步（申请、记录、分析），下一步就是**提交 CCB 审批**。

      B 跳过了审批。影响分析给出了「延期 2 周、加 18 万」的结论，这已经触碰基准，
      项目经理无权自己批——这正是变更控制存在的意义。

      C 是第五步之后才做的事，且顺序不能反：**先批准，后更新基准**。
      没批就改基准，等于事后追认一个还没被批准的变更。

      D 是最后一步。

      一个实务细节值得记住：影响分析做完了再报批，**报批材料里必须带上那个结论**
      （延期 2 周、加 18 万）。CCB 批的不是「要不要这个功能」，而是「要不要用 2 周 + 18 万
      去换这个功能」。没有影响分析的审批只是拍脑袋，有了它才是决策。
    source: manual

  - id: RK-S2-069
    module_id: S2
    kp_id: KP-0207
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: 生产故障等不了审批流程
    body_md: |
      周六凌晨，生产系统出现故障，业务全部中断。修复必须改动一处已上线的接口逻辑，
      属于范围与配置的变更。CCB 成员分散在各地，最快也要周一才能开会。

      项目经理的处理方式，最恰当的是：
    options:
      - 紧急情况下可以完全不走流程，直接改，事后再看是否需要补
      - 先组织处置恢复业务，同时向 CCB 成员通报并取得口头授权，事后补齐审批与变更记录；
        并复盘这次紧急变更，判断流程是否需要设立应急通道
      - 严格等 CCB 开会批准后再处置，不能破坏流程的严肃性
      - 交由运维部门自行处理，项目经理不介入技术变更
    answer: "B"
    explanation_md: |
      紧急变更的正确口径是：**可以边处置边报批，但事后必须补齐审批与记录。**

      B 包含了三件事，缺一件都不完整：
      1. **先处置**（业务中断的每一分钟都是真损失，不能等）
      2. **同步通报并取得口头授权**（有授权来源，不是自行其是）
      3. **事后补齐审批与记录，并复盘流程**

      第三条的后半句是加分点：如果紧急变更频繁发生，说明**流程本身缺一条应急通道**
      （预案、预授权范围、值班决策人），该改流程而不是每次靠事后补。

      A 的「完全不走」把紧急当成了豁免。事后补不补、怎么补都没定，
      结果通常是补不上——半年后审计翻出这次改动，没有任何记录。

      C 把流程的严肃性放在业务连续性之前。这是看似正确实则严重的判断错误：
      **流程的目的是让变更有序，不是让业务停摆等签字。**

      D 把责任推出去了。变更涉及范围与配置，项目经理必须知情并留痕，
      运维可以执行但责任不能转移。
    source: manual

  - id: RK-S2-070
    module_id: S2
    kp_id: KP-0207
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 5
    title: 写一份能过会的变更申请
    body_md: |
      场景：客户业务部门要求在原系统上增加「移动端审批」功能，理由是领导出差时无法及时审批。
      初步估算：新增 25 个工作日、成本约 12 万元，会影响原定的上线时间。

      请完成两份东西：
      1. 写一份变更申请单（包含变更内容、理由、期望时间、提出人、影响范围初判）
      2. 写一份影响分析（范围 / 进度 / 成本 / 质量 / 风险 / 资源 六个维度各一句，
         并给出你的建议：批准、批准但分期、否决，说明理由）
    options: []
    answer: "申请单要素齐全；六维影响分析具体；建议有明确取舍理由（含替代方案）"
    explanation_md: |
      评分重心在**第 2 问的六维分析是否具体**，以及建议是否给出取舍逻辑而不是简单说「批准」。

      合格示例（申请单）：
      | 字段 | 内容 |
      | --- | --- |
      | 变更编号 | CR-2026-014 |
      | 提出人 / 日期 | 客户方业务处室 张主任 / 2026-10-29 |
      | 变更内容 | 新增移动端审批功能：待办列表、审批通过/驳回、附件预览 |
      | 变更理由 | 领导出差期间无法及时审批，平均积压 2-3 天，影响业务时效 |
      | 期望时间 | 12 月 15 日前上线（年底考核前） |
      | 初判影响面 | 涉及审批引擎接口改造、移动端新增页面、权限体系扩展 |

      合格示例（影响分析，六维各一句）：
      - **范围**：新增 1 个功能模块（3 个页面 + 1 个接口改造），原范围不变
      - **进度**：需 25 个工作日，按现有人力会与「电子证照」模块争抢同一批后端资源，
        若不增人，上线时间从 12 月 20 日推至 1 月 18 日
      - **成本**：人力 12 万元；另需移动端适配测试 1.5 万元
      - **质量**：审批逻辑属核心链路，需补充 40 条回归用例，测试周期增加 5 天
      - **风险**：① 权限体系扩展可能影响现有 12 个委办局的账号模型（高）；
        ② 年底考核前上线，试运行时间不足（中）
      - **资源**：需后端 1 人全职 25 天，或外借 1 名移动端开发（约 3 万元）

      **建议要给出取舍**，合格的一种：**批准但分期**——12 月先上「待办列表 + 审批通过/驳回」
      （15 个工作日，不影响原上线日期），附件预览与批量审批放到 1 月版本。
      理由是：解决「积压 2-3 天」的核心痛点是能及时审批，附件预览是增强而非必需；
      分期既满足年底考核，又避免与电子证照争抢资源。

      不合格的三种：
      - 六维写成「影响范围较大」「进度有一定影响」——形容词不构成分析
      - 建议只写「建议批准，因为是客户要求」——没有取舍，CCB 无法据此决策
      - 漏掉「不做的替代方案」——成熟的影响分析应包含「若不变更会怎样」（本例：继续积压 2-3 天，
        可通过授权代理人缓解）
    source: manual

  # ── 2026-10-29 补格（二批）：S6 应试专项的 17 个「单题格」补齐到 2 题 ──
  - id: RK-S6-027
    module_id: S6
    kp_id: KP-0601
    category: 中项·S6 应试专项
    type: 单选
    difficulty: easy
    level: 1
    title: 沟通渠道数的公式
    body_md: |
      n 个人之间的沟通渠道数计算公式是（n 含项目经理）：
    options:
      - n × (n − 1)
      - n × (n − 1) ÷ 2
      - n × n ÷ 2
      - (n − 1) ÷ 2
    answer: "B"
    explanation_md: |
      渠道数是「两两配对」的数量，所以除以 2：**n × (n − 1) ÷ 2**。

      为什么除以 2：A 与 B 之间只有一条渠道，不区分方向。若算成 n × (n − 1)，等于把
      「A 找 B」和「B 找 A」算成两条，结果翻倍。

      验算一下最常用的几组数（考场上直接套，比现推快）：
      5 人 10 条、8 人 28 条、10 人 45 条、12 人 66 条、15 人 105 条、20 人 190 条。

      **人数翻倍，渠道接近四倍**——这是这条公式最常被考的意义：
      「团队从 8 人增到 16 人」时渠道从 28 条涨到 120 条，增加 92 条。
      它是布鲁克斯定律（加人反而更慢）的算术来源。

      算「增加了多少条」时务必**用新值减旧值**，不要只算新增成员内部的渠道数（那是常见错法）。
    source: manual

  - id: RK-S6-028
    module_id: S6
    kp_id: KP-0601
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 2
    title: 资源平滑与资源平衡的区别
    body_md: |
      关于资源平滑（Resource Smoothing）与资源平衡（Resource Leveling），下列说法正确的是：
    options:
      - 两者是同一方法的不同译法，效果完全一致
      - 资源平衡只在时差内调整、不延长工期；资源平滑会改变关键路径并可能延长工期
      - 资源平滑只在时差内调整、不延长工期；资源平衡可能改变关键路径并延长工期
      - 两者都不改变关键路径
    answer: "C"
    explanation_md: |
      两者的区别就是一句话：**平滑只动「有余量的部分」，平衡敢动关键路径。**

      | 方法 | 调整范围 | 是否可能改变关键路径 | 是否可能延长工期 |
      | --- | --- | --- | --- |
      | **资源平滑** | 只在活动时差内挪动 | 不会 | **不延长** |
      | **资源平衡** | 可以超出时差，甚至重排关键活动 | 会 | **通常会延长** |

      选择依据是**约束在谁身上**：
      - 资源用量有硬上限、工期不能动 → 用平滑（代价是峰值需求可能压不下来）
      - 资源是硬约束且必须削峰（比如只有 2 个测试工程师） → 用平衡，接受工期延长

      A 把两者合并。B 把两者对调了——这是最常见的错法，因为中文名「平衡」听起来更像
      「在中间取平」，容易让人以为它更温和。

      记忆抓手：**平滑 = 温柔，只在小范围内挪；平衡 = 强硬，为了资源不惜动工期。**

      D 错在「都不改变」。平衡恰恰会改变关键路径，这也是它可能延长工期的原因。
    source: manual

  - id: RK-S6-029
    module_id: S6
    kp_id: KP-0601
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 3
    title: 加了 5 个人，渠道增加多少条
    body_md: |
      某项目团队原有 10 人（含项目经理）。因进度压力新增 5 名成员后，
      团队内部的沟通渠道数增加了多少条？
    options:
      - 60 条
      - 105 条
      - 45 条
      - 20 条
    answer: "A"
    explanation_md: |
      先算两个总量，再相减：

      - 原 10 人：10 × 9 ÷ 2 = **45 条**
      - 增到 15 人：15 × 14 ÷ 2 = **105 条**
      - 增加：105 − 45 = **60 条**

      B 的 105 是**总数**不是增量——这是最常见的错法，看到题里的「增加」要确认自己算的是差值。
      C 的 45 是原有总数。D 的 20 是只算了新增 5 人内部的渠道（5 × 4 ÷ 2 = 10，连 10 都不到），
      或者算成 5 × 4 = 20——**漏掉了新人与老人之间的交叉渠道**，而交叉渠道才是增量的大头
      （5 × 10 = 50 条）。

      这个结果值得记一句：**加 5 个人，沟通渠道翻了一倍多（45 → 105）。**
      这就是为什么「加人」在软件项目里往往不能线性提速——协调成本是二次增长的。
    source: manual

  - id: RK-S6-030
    module_id: S6
    kp_id: KP-0601
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 4
    title: 两个方案该选哪个
    body_md: |
      某项目有两个可选方案：

      - **方案 A**：投入 50 万元。成功概率 60%，成功收益 200 万元；失败概率 40%，失败收益 40 万元
      - **方案 B**：投入 30 万元。成功概率 80%，成功收益 120 万元；失败概率 20%，失败收益 20 万元

      按期望货币值（EMV）决策，应当选择：
    options:
      - 方案 A，因为它的总收益 240 万元高于方案 B 的 140 万元
      - 方案 B，因为它的成功概率 80% 高于方案 A 的 60%
      - 两个方案净期望值相同，可任选
      - 方案 A：净期望值 86 万元，高于方案 B 的 70 万元
    answer: "D"
    explanation_md: |
      决策树算的是**净期望值**，三步不能少：算各分支期望 → 求和 → **减去投入**。

      **方案 A**：0.6 × 200 + 0.4 × 40 = 120 + 16 = 136 万元（毛期望值）
      净期望值 = 136 − 50 = **86 万元**

      **方案 B**：0.8 × 120 + 0.2 × 20 = 96 + 4 = 100 万元
      净期望值 = 100 − 30 = **70 万元**

      所以选 A（86 > 70）。

      A 项错在拿「毛收益」比较且口径混乱：把 200 + 40 = 240 当总收益，实际上这两个数
      是按概率互斥出现的，不能直接相加。

      B 项只看概率不看金额。成功概率高不代表划算——B 即使成功也只赚 120 万。

      C 项忽略了投入差异：其实毛期望值 A 是 136、B 是 100，净期望值 A 是 86、B 是 70，
      两个口径下 A 都更优。

      **最经典的错法是忘记减投入**：直接答「136 > 100，选 A」。结论碰巧对，
      但过程丢分——而且如果换成「A 投入 60 万、B 投入 30 万」，不减投入就会选错。
    source: manual

  - id: RK-S6-031
    module_id: S6
    kp_id: KP-0601
    category: 中项·S6 应试专项
    type: 实操
    difficulty: hard
    level: 5
    title: 一道题里连算三件事
    body_md: |
      场景：某活动乐观工期 10 天、最可能 16 天、悲观 34 天。
      项目团队原有 9 人（含项目经理），因该活动关键，临时增加 3 人。

      请完成（每问写出公式再代入数字，结果带单位）：
      1. 该活动的期望工期与标准差
      2. 若客户要求「有约 95% 的把握完成」，应承诺多少天？说明依据
      3. 团队人数从 9 人增到 12 人，沟通渠道增加了多少条
      4. 用一句话说明：为什么「加 3 人」不一定能缩短这个活动的工期
    options: []
    answer: "期望18天 标准差4天；约95%承诺26天（±2个标准差）；渠道增加33条；加人受布鲁克斯定律与学习曲线限制"
    explanation_md: |
      评分重心在**公式写在数字前面**与第 4 问的判断，纯结果对但没公式只能拿一半。

      1. **期望工期** = (10 + 4 × 16 + 34) ÷ 6 = (10 + 64 + 34) ÷ 6 = 108 ÷ 6 = **18 天**
         **标准差** = (34 − 10) ÷ 6 = 24 ÷ 6 = **4 天**

      2. 约 95% 的把握对应 **±2 个标准差**：
         18 + 2 × 4 = **26 天**（区间是 10 到 26 天，取上限作为承诺值）

         依据：正态分布下 ±1σ 约 68.26%、±2σ 约 95.46%、±3σ 约 99.73%。
         注意「承诺值」要取**上限**（26 天），不能答「18 ± 8 天」——
         客户要的是一个日期，不是一个区间。

      3. 原 9 人：9 × 8 ÷ 2 = 36 条；增到 12 人：12 × 11 ÷ 2 = 66 条；
         **增加 30 条**。

         （常见错法：算成 3 × 2 ÷ 2 = 3 条，只算新人内部；或算成 3 × 9 = 27 条，
         只算新老交叉而漏了新人彼此。）

      4. 三条理由任一说得清即可：
         - **沟通渠道二次增长**（36 → 66 条），协调开销吃掉了新增人力的一部分产能
         - **学习曲线**：新人熟悉业务与代码需要时间，短期产出为负（还要占用老成员带人）
         - **活动本身的可并行度有限**：一个活动能被拆给几个人同时干的部分是有限的，
           加到一定程度后新增人力无处安置（布鲁克斯定律）

         只写「加人不一定有用」不给分，要落到上面任一条机制上。

      **判据一句话**：三点估算题的分不在算术，在「先公式后数字」与「区间还是点值」的判断。
    source: manual

  - id: RK-S6-032
    module_id: S6
    kp_id: KP-0602
    category: 中项·S6 应试专项
    type: 单选
    difficulty: easy
    level: 1
    title: 四个时间参数怎么算
    body_md: |
      关于活动时间参数的计算规则，下列说法正确的是：
    options:
      - EF = ES + 历时；一个活动的 ES 取其所有紧前活动 EF 的最大值
      - EF = ES − 历时；ES 取其所有紧前活动 EF 的最小值
      - LS = LF + 历时；一个活动的 LF 取其所有紧后活动 LS 的最大值
      - 正推时取最小值，逆推时取最大值
    answer: "A"
    explanation_md: |
      四个参数与两条规则：

      | 参数 | 含义 | 算法 |
      | --- | --- | --- |
      | ES 最早开始 | 最早能什么时候开始 | 取所有紧前活动 EF 的**最大值** |
      | EF 最早完成 | 最早能什么时候完成 | EF = ES + 历时 |
      | LS 最晚开始 | 最晚必须什么时候开始 | LS = LF − 历时 |
      | LF 最晚完成 | 最晚必须什么时候完成 | 取所有紧后活动 LS 的**最小值** |

      B 把加减法弄反了，还把取大取小也说反。
      C 的 LS 公式错（应是 LF − 历时），LF 也应取紧后 LS 的最小值。
      D 把两条规则完全颠倒——这是最典型的错法。

      **为什么正推取大**：一个活动要等**所有**前置都完成才能开始，所以取最晚的那个
      （最大的 EF）。**为什么逆推取小**：不能拖累**任何一个**紧后活动，所以取最早的那个
      （最小的 LS）。

      记忆口诀：**正推取大、逆推取小。** 八个字，考场上比推导快。
    source: manual

  - id: RK-S6-033
    module_id: S6
    kp_id: KP-0602
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 2
    title: 总时差与自由时差的区别
    body_md: |
      关于总时差（Total Float）与自由时差（Free Float），下列说法正确的是：
    options:
      - 两者在数值上总是相等
      - 总时差是不影响总工期的机动时间；自由时差是不影响紧后活动最早开始的机动时间；总时差 ≥ 自由时差
      - 自由时差 ≥ 总时差，因为自由时差只受一个活动约束
      - 自由时差只与项目的终点有关，总时差只与紧后活动有关
    answer: "B"
    explanation_md: |
      两者的参照点不同，这是唯一的区别：

      | 时差 | 参照什么 | 公式 |
      | --- | --- | --- |
      | **总时差** TF | 项目**总工期** | LS − ES = LF − EF |
      | **自由时差** FF | **紧后活动的最早开始** | 紧后活动 ES 的最小值 − 本活动 EF |

      因为「不影响总工期」比「不影响紧后活动」宽松得多，所以**总时差 ≥ 自由时差**
      （关键活动上两者都为 0）。

      A 错在「总是相等」。它们只在特定情况下相等（例如某活动的紧后活动本身时差为 0），
      一般不等。

      C 把大小关系说反了。

      D 把参照点对调了。**总时差才与终点挂钩**（它是整条路径的余量），
      自由时差只与紧后活动挂钩。

      **实务用法**：判断某活动延误是否影响总工期，看**总时差**（延误 ≤ 总时差则不影响）；
      判断是否影响后续活动开工，看**自由时差**。案例题问「是否影响交付」时，
      写总时差更有说服力。
    source: manual

  - id: RK-S6-034
    module_id: S6
    kp_id: KP-0602
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 4
    title: 两条路径一样长，怎么压工期
    body_md: |
      某网络图有两条路径：A-B-D 与 A-C-D，两者的历时之和都是 12 天。项目经理将 B 的工期压缩 2 天。

      对这个动作的评价，正确的是：
    options:
      - 有效，总工期会从 12 天缩短到 10 天
      - 关键路径唯一，因为两条路径的活动数相同，需再比较活动工期
      - 无效：两条路径都是关键路径，只压 B 会使关键路径转移到 A-C-D，总工期仍是 12 天；
        要缩短工期必须让两条路径同时缩短
      - 说明该网络图有错误，关键路径不可能有两条
    answer: "C"
    explanation_md: |
      题干的关键信息是**两条路径历时相同**（都是 12 天）——**两条都是关键路径**。

      关键路径的定义是「历时最长的路径」，不是「唯一最长的路径」。有并列最长时，
      它们**全部**都是关键路径。

      只压 B 2 天：A-B-D 变成 10 天，但 A-C-D 仍是 12 天，此时最长的是 A-C-D，
      **关键路径转移了**，总工期仍为 12 天。所以单独压 B 完全无效——白花了压缩成本。

      要真正缩短总工期，必须**同时压 A、C、D 上的活动**（任意一条路径没压到就还是 12 天），
      或者压两条路径共有的 A 或 D——这才是有效率的选择。

      A 是最常见的错法：以为关键路径只有一条，压它就一定有效。
      B 编了一个「活动数相同还要比工期」的规则，不存在。
      D 把正常的并列关键路径当成图画错了。

      **判据一句话**：压缩工期前，先数清关键路径有几条；有几条就压几条（或压它们的公共段）。
    source: manual

  - id: RK-S6-035
    module_id: S6
    kp_id: KP-0602
    category: 中项·S6 应试专项
    type: 实操
    difficulty: hard
    level: 5
    title: 算清一个活动的四个参数
    body_md: |
      网络图如下（活动｜历时｜紧前活动）：

      - A｜4｜—
      - B｜6｜A
      - C｜3｜A
      - D｜5｜B、C
      - E｜2｜D

      请完成：
      1. 列出所有路径并算出各自的历时，指出关键路径与总工期
      2. 算出 C 的 ES、EF、LS、LF、总时差、自由时差（写清每一步用的是哪个公式）
      3. 若 C 实际延误 4 天（其余按期完成），总工期变成多少天？关键路径有变化吗？
    options: []
    answer: "关键路径A-B-D-E总工期17天；C的ES=4 EF=7 LS=7 LF=10 TF=3 FF=3；C延误4天超出时差1天，总工期18天、关键路径转移为A-C-D-E"
    explanation_md: |
      评分重心在第 2 问的**公式来源**与第 3 问的**结论**，不要只报数字。

      1. 路径：
         - A-B-D-E = 4 + 6 + 5 + 2 = **17 天**
         - A-C-D-E = 4 + 3 + 5 + 2 = **14 天**

         最长的是 17 天，所以**关键路径是 A-B-D-E，总工期 17 天**，
         A、B、D、E 的总时差均为 0。

      2. C 的六个参数：
         - **ES = 4**（紧前只有 A，A 的 EF = 4）
         - **EF = ES + 历时 = 4 + 3 = 7**
         - 逆推求 LF：E 的 LF = 17，LS(E) = 15；D 的 LF = LS(E) = 15，LS(D) = 10；
           C 的紧后只有 D，**LF(C) = LS(D) = 10**
         - **LS = LF − 历时 = 10 − 3 = 7**
         - **总时差 TF = LS − ES = 7 − 4 = 3 天**（也可算 LF − EF = 10 − 7 = 3）
         - **自由时差 FF = 紧后活动 ES 的最小值 − 本活动 EF = ES(D) − EF(C) = 10 − 7 = 3 天**

         本题 TF 与 FF 恰好都等于 3（因为 C 只有一个紧后，且该紧后本身在关键路径上）。

      3. C 延误 4 天（关键一步：**要把延误加到哪条路径上，再重新比长度**）：

         - C 在 A-C-D-E 上，原 14 天，C 延误 4 天 → **18 天**
         - A-B-D-E 不受影响，仍 **17 天**

         18 > 17，所以：

         - **总工期变成 18 天**
         - **关键路径转移为 A-C-D-E**（原来的 A-B-D-E 不再是关键路径）

         注意「延误是否超过时差」与「关键路径是否转移」是两个判断，本题恰好同时成立，
         但推理不能省：**先算总工期（取两条路径的新长度最大值），再看哪条最长。**
         只比「延误 4 > 时差 3」就得出「工期 +1」，会算出 18 而理由写错。

         一个常见的错法是把「超出时差 1 天」直接当成结论，
         答成「总工期 18 天，关键路径不变」——总工期碰巧对，但关键路径已经转移到
         A-C-D-E，后续要压缩工期必须压 C 所在路径，压 B 已经没有用了。
    source: manual

  - id: RK-S6-036
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 2
    title: 五个过程组的英文名
    body_md: |
      Initiating、Planning、Executing、Monitoring and Controlling、Closing
      依次对应的中文是：
    options:
      - 启动、规划、监控、执行、收尾
      - 立项、计划、实施、检查、结项
      - 启动、设计、执行、监控、验收
      - 启动、规划、执行、监控、收尾
    answer: "D"
    explanation_md: |
      五大过程组的英文必须能对上，因为题干常直接用英文表述：

      | 英文 | 中文 |
      | --- | --- |
      | Initiating | 启动 |
      | Planning | 规划 |
      | **Executing** | **执行** |
      | **Monitoring and Controlling** | **监控** |
      | Closing | 收尾 |

      A 把执行与监控的顺序对调了。这是本题最像的干扰项，也是英文题里最常见的陷阱：
      中文里「监控」经常被说在前面，但英文的固定顺序是 Executing 在 Monitoring 之前。

      B 用了口语化译法（立项、计划、实施、检查、结项），不是标准术语。
      教材里这五个词是固定译名，答题必须用标准译名。

      C 把 Planning 译成「设计」、Closing 译成「验收」。设计与规划不是一回事，
      验收只是收尾的其中一项工作。

      顺带记：十大知识领域的英文首字母连起来是 I-S-S-C-Q-R-C-R-P-S
      （Integration、Scope、Schedule、Cost、Quality、Resource、Communications、Risk、
      Procurement、Stakeholder），按顺序背下来，遇到题干问 knowledge area 时能直接定位。
    source: manual

  - id: RK-S6-037
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 3
    title: 哪个术语指「经批准、只能走变更才能改」
    body_md: |
      Which term refers to the approved version of a schedule that can only be changed
      through formal change control?
    options:
      - Schedule Baseline
      - Milestone
      - Float
      - Deliverable
    answer: "A"
    explanation_md: |
      题干两个限定词就是判据：**approved**（已经批准的）+ **only changed through formal
      change control**（只能走正式变更控制才能改）——这是**基线（Baseline）** 的定义。

      - **Schedule Baseline** 进度基准：经批准、受变更控制的进度计划，是判断「快还是慢」的尺子
      - **Milestone** 里程碑：工期为 0 的检查点，只是一个标记
      - **Float / Slack** 时差：活动的机动时间
      - **Deliverable** 可交付成果：产出的东西

      B 的 Milestone 是常被误当成「基准」的词，因为两者都跟时间节点有关。
      区分点：里程碑是**一个点**，基线是**一整套计划**。

      **Baseline 的中文最容易译错**：它常被口语化成「底线」，但底线是「不可退让的界限」，
      基线是「用来比较的参照版本」——**基线可以改，只是要走变更流程**。
      把基线当底线，会在案例题里写出「基准不能修改」这种错答。

      这类题的做题方法：不逐词翻译，先找**定义性关键词**——
      authorize/exists 指向章程，approved + change control 指向基线，
      zero duration 指向里程碑。
    source: manual

  - id: RK-S6-038
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 4
    title: 已经发生的问题记在哪本册子里
    body_md: |
      A critical server failure has already occurred and is currently blocking the testing team.
      In which document should this be recorded and tracked?
    options:
      - Risk Register
      - Issue Log
      - Lessons Learned Register
      - Change Log
    answer: "B"
    explanation_md: |
      判据是**已经发生 vs 尚未发生**：

      | 文档 | 记什么 | 时态 |
      | --- | --- | --- |
      | Risk Register 风险登记册 | 可能发生、尚未发生的风险及应对 | 将来 |
      | **Issue Log 问题日志** | **已经发生、正在影响项目的问题** | 现在 |
      | Lessons Learned Register | 已积累的经验与教训 | 过去（沉淀） |
      | Change Log 变更日志 | 变更请求及其状态 | 流程记录 |

      题干两处信号：**has already occurred**（已发生）+ **currently blocking**（正在阻塞）——
      正在发生且正在造成影响，这是问题（issue），不是风险（risk）。

      A 是最像的干扰项。风险与问题的分界线是**时态**：一旦风险发生，它就转成问题，
      要从风险登记册转到问题日志里跟踪。这个「转化」动作本身也是考点。

      C 记的是教训，它的作用是避免同类问题再发生，不是跟踪当前这个问题的处置进度。

      D 记的是变更请求，与故障处置无关（除非处置过程产生了变更，那才另记一条变更）。

      **一句话记忆**：**风险是「可能会」，问题是「已经了」。**
    source: manual

  - id: RK-S6-039
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 实操
    difficulty: hard
    level: 5
    title: 从一段英文要求里摘术语
    body_md: |
      下面是一段英文招标文件的技术要求（节选）：

      > The Contractor shall submit a Statement of Work defining all deliverables and
      > milestones. A Work Breakdown Structure shall be provided to at least three levels.
      > Any change to the approved baseline must be processed through the Change Control
      > Board. The Contractor shall maintain a Risk Register and an Issue Log throughout
      > the project, and deliver monthly Earned Value reports showing SPI and CPI. Final
      > acceptance requires successful User Acceptance Testing and a valid SLA for
      > post-implementation support.

      请完成：
      1. 摘出其中出现的英文术语，写出「英文全称 + 缩写（有则写）+ 中文」，不少于 8 条
      2. 把这段要求翻译成中文（不超过 120 字，保留术语）
      3. 指出这段要求里哪一条最容易在投标响应时被漏掉，说明后果
    options: []
    answer: "≥8条术语对照正确；译文保留术语且通顺；指出最易漏项并给出后果"
    explanation_md: |
      评分重心在**术语对照是否准确**与第 3 问的判断，第 2 问的译文只要通顺即可。

      1. 术语（至少这 9 条）：
         | 英文 | 缩写 | 中文 |
         | --- | --- | --- |
         | Statement of Work | SOW | 工作说明书 |
         | Deliverable | — | 可交付成果 |
         | Milestone | — | 里程碑 |
         | Work Breakdown Structure | WBS | 工作分解结构 |
         | Baseline | — | 基线 |
         | Change Control Board | CCB | 变更控制委员会 |
         | Risk Register | — | 风险登记册 |
         | Issue Log | — | 问题日志 |
         | Earned Value | EV | 挣值 |
         | Schedule Performance Index | SPI | 进度绩效指数 |
         | Cost Performance Index | CPI | 成本绩效指数 |
         | User Acceptance Testing | UAT | 用户验收测试 |
         | Service Level Agreement | SLA | 服务级别协议 |

      2. 译文示例：
         「承包方须提交工作说明书，明确全部可交付成果与里程碑；提供至少三级的 WBS；
         对已批准基线的任何变更须经 CCB 处理；全过程维护风险登记册与问题日志；
         按月提交含 SPI、CPI 的挣值报告；最终验收须通过用户验收测试，
         并提供实施后支持的有效 SLA。」

      3. **最容易被漏掉的是最后一条 SLA（实施后支持的响应时限）**。
         理由：前几条都是开发期动作，投标时容易关注「做什么功能」；
         而 SLA 涉及**交付之后**的服务承诺——响应时间、解决时限、可用性指标、
         违约赔偿。漏掉的后果很直接：投标时没算运维人力成本，
         中标后按 SLA 履约就是持续亏损，或者做不到而被扣款。
         次容易漏的是「至少三级 WBS」这类**数量要求**——写方案时容易只给两级。

      不合格的答案：
      - 只摘缩写不写全称（WBS、SPI 写了，但 Deliverable、Baseline 这类没缩写就跳过）
      - 第 3 问答「都容易漏」——没有判断等于没答
    source: manual

  - id: RK-S6-040
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 单选
    difficulty: easy
    level: 1
    title: 案例题的小问有哪几类
    body_md: |
      信息系统项目管理师下午卷的案例题，小问类型通常包括：
    options:
      - 只有「找问题」与「提措施」两类
      - 只有计算题，其余都是主观发挥
      - 找问题、析原因、提措施、算指标、判是非五类，且常在同一道题里组合出现
      - 只有论述题，考察文字表达能力
    answer: "C"
    explanation_md: |
      五类小问，按出现频率：**找问题 > 提措施 > 析原因 > 算指标 > 判是非**。

      | 类型 | 典型问法 | 答题落点 |
      | --- | --- | --- |
      | 找问题 | 「指出该项目存在的主要问题」 | 客观事实，缺什么 |
      | 析原因 | 「分析造成上述问题的原因」 | 流程与制度缺口 |
      | 提措施 | 「提出改进建议」 | 可执行动作，与前文一一对应 |
      | 算指标 | 「计算 SPI 与 CPI 并判断状态」 | 先公式后数字，带单位 |
      | 判是非 | 「该做法是否正确，说明理由」 | 先定性再给依据 |

      知道有五类，直接的好处是**答题时不漏问**：看到题目先数有几问、各是什么类型，
      再逐问作答。**漏答小问是下午卷最大的非技术失分**。

      A 少了两类，还漏了「常组合出现」这个特点——很多题是「先找问题，再提措施」，
      两问分开给分。

      B 与 D 是两个极端。案例题既不是纯计算，也不是作文：它考的是**能不能把管理动作说清楚**，
      属于技术写作。
    source: manual

  - id: RK-S6-041
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 2
    title: 三类高频小问各自该怎么答
    body_md: |
      关于「指出问题」「说明原因」「提出措施」三类小问的答法，下列说法正确的是：
    options:
      - 三类答法相同，都要把道理讲透，写得越完整越好
      - 「指出问题」时应顺手写出对策，「提出措施」时应先分析原因，这样更完整
      - 「指出问题」只写结论不写动作，「提出措施」只写原则不写具体做法
      - 「指出问题」只说事实不评价人；「说明原因」往流程与制度上找，不往个人品质上找；
        「提出措施」必须可执行且与上文问题一一对应
    answer: "D"
    explanation_md: |
      三类小问的答法边界：

      | 小问 | 该写什么 | 不该写什么 |
      | --- | --- | --- |
      | 指出问题 | 「未编制项目管理计划」「未建立变更控制流程」 | 「项目经理能力不足」「责任心不强」 |
      | 说明原因 | 「缺少评审机制」「未设变更控制委员会」 | 「团队素质差」「客户不配合」 |
      | 提出措施 | 「建立变更控制流程，所有变更书面提出并经 CCB 审批」 | 「加强管理」「提高认识」 |

      A 把三类混成一种。混的后果很实际：问问题答措施、问措施答原因，**都不给分**——
      阅卷按小问给分，答非所问等于没答。

      B 是最常见的「写多了反而丢分」：**问「问题」时顺手写对策**，看起来更完整，
      但阅卷老师在小问「问题」下只找事实陈述，写进去的措施一律不计分，
      还占用了答题空间与时间。

      C 把两侧都说反了。问题要写具体事实（不是空结论），措施要写具体动作（不是原则）。

      **一句话判据**：**小问问什么就答什么，多写不加分，答偏要扣分。**
    source: manual

  - id: RK-S6-042
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 3
    title: 针对这三个问题，该提哪些措施
    body_md: |
      案例背景：某项目启动后直接安排开发，需求边做边确认；客户中途多次口头提出新增需求，
      项目经理均安排实现；验收时客户以部分功能与初期理解不符拒收。

      若题目要求「针对上述问题提出改进措施」，下列答案最可能得高分的是：
    options:
      - 加强项目管理，提高团队意识，强化与客户的沟通，确保项目按期交付
      - ① 组织需求评审并取得客户签字确认，形成需求规格说明书；② 建立变更控制流程，
        所有变更书面提出、做影响分析、经 CCB 审批后实施并更新基准；
        ③ 建立相关方登记册并制定参与策略，验收标准在项目前期与客户书面确认
      - 更换项目经理，重新组建团队，追究相关人员责任
      - 增加项目投入，补充人力与预算，重新排定进度计划
    answer: "B"
    explanation_md: |
      判据只有一条：**措施是否与前文问题一一对应，且每条都是可执行动作**。

      背景里的三个问题 → B 的三条措施，正好对上：
      | 背景问题 | 对应措施 |
      | --- | --- |
      | 需求边做边确认 | ① 组织需求评审并取得签字，形成需求规格说明书 |
      | 口头新增需求直接实现 | ② 建立变更控制流程（书面、影响分析、CCB、更新基准） |
      | 验收标准未前期达成一致 | ③ 建立相关方登记册与参与策略，前期书面确认验收标准 |

      A 是典型的空话答案，讲义里点名的失分五类里占了两类（只写结论不写动作、空话套话）。
      「加强管理」没有主体、没有动作、没有时点——写在卷面上几乎不得分。

      C 把管理问题当人的问题。案例题考的是**流程与制度**的修补，换人既不能解决
      需求未确认的问题，也不符合「对事不对人」的答题口径。

      D 是最隐蔽的错答：增加投入是应对「进度/资源」问题的手段，而本题的问题是
      **需求与变更管理缺失**。加人加钱只是把同样的问题做得更大。

      **判据一句话**：**数一数背景里有几个问题，措施就该有几个，且一一对应。**
      答得漂亮不如对得上。
    source: manual

  - id: RK-S6-043
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 实操
    difficulty: hard
    level: 5
    title: 完整作答一道案例题
    body_md: |
      请按四步骨架（定位 → 原因 → 对策 → 依据），完整回答下面这道案例题。

      **背景**：某市政务数据共享平台项目，合同工期 8 个月。项目经理在需求调研阶段只走访了
      大数据局一个部门，未与其他委办局确认数据接口。开发进行到第 4 个月，各委办局陆续提出
      数据口径不一致、接口字段缺失，项目经理安排开发逐个适配，未做变更记录。
      项目延期 3 个月，成本超支 25%。上线后第一个月，有三个委办局的业务出现数据错乱，
      被市里通报。

      **问题**：
      1. 请指出该项目在管理上存在的主要问题（不少于 5 条）
      2. 针对上述问题，提出改进措施（每条与问题对应）
      3. 若你是接手的项目经理，请写出接下来两周的处置动作（不少于 4 条）
    options: []
    answer: "问题≥5条且为客观事实；措施与问题一一对应；两周动作可执行且带责任人与产出"
    explanation_md: |
      评分重心在**第 1 问是否为客观事实**、第 2 问**是否一一对应**、第 3 问**是否可执行**。

      **第 1 问：主要问题（每条都是「缺什么」，不评价人）**
      1. 范围管理：需求调研只覆盖单一部门，未识别全部数据提供方，范围定义不完整
      2. 相关方管理：未识别 12 个委办局为关键相关方，未建立相关方登记册与参与策略
      3. 需求管理：未形成经各方确认的数据标准与接口规范（字段、口径、值域）
      4. 变更管理：接口适配变更未书面化、未做影响分析、未经 CCB 审批、未更新基准
      5. 进度与成本管理：未建立经批准的基准，偏差未及时监控与纠偏，导致延期 3 个月、超支 25%
      6. 质量管理：数据口径未统一即上线，未做跨部门联调与数据校验（直接导致业务数据错乱）
      7. 沟通管理：未建立跨部门协调机制与例会，问题在各委办局自行暴露

      **第 2 问：措施（与问题逐条对应）**
      | 问题 | 措施 |
      | --- | --- |
      | 需求调研不全 | 补做需求调研，覆盖全部 12 个委办局，形成需求规格说明书并逐家签字 |
      | 相关方未识别 | 建立相关方登记册，按权力—利益分档并制定参与策略，指定对接人 |
      | 缺数据标准 | 组织数据标准评审，明确字段、口径、值域、更新频率，形成接口规范并三方签字 |
      | 变更未受控 | 建立变更控制流程与变更日志，所有接口调整书面提出、影响分析、CCB 审批 |
      | 无基准无监控 | 重建范围/进度/成本基准并报批，恢复周度挣值与偏差简报机制 |
      | 质量失守 | 制定数据校验规则（完整性、一致性、值域），上线前完成跨部门联调与数据比对 |
      | 沟通不畅 | 建立周例会与月度协调会机制，形成会议纪要与待办跟踪表 |

      **第 3 问：两周处置动作（要能落地）**
      1. **第一周**：与市大数据局确认停工范围与整改计划，取得书面授权（避免边整改边被追责）
      2. **第一周**：召集 12 个委办局开一次协调会，当场确认各方数据责任人、接口清单与口径争议点
      3. **第二周**：发布数据接口规范 v1.0（含字段、值域、更新频率），各方签字确认
      4. **第二周**：对已上线数据做一次全量比对，出具数据错乱清单与修复方案，优先修三个被通报的委办局
      5. **持续**：建立变更日志与周报机制，两周后向市里提交整改报告与新的进度承诺

      常见不合格：
      - 第 1 问写「项目经理经验不足」「团队执行力差」——评价人而不是陈述事实
      - 第 2 问只写「加强需求管理」——不是可执行动作
      - 第 3 问写「全面整改」——没有责任人、没有时点、没有产出

      **判据一句话**：案例题得分靠**结构**（每条都能被核对），不靠文采。
    source: manual

  # ── 高项新增两个模块的题（2026-10-29）──────────────────────
  # 全部是 L5 实操：论文与高级考点本质上是「给新场景能不能做对」，
  # 而且它们在 L1—L4 没有可判分题，所以不进能力诊断（见 diagnostic.ts 的模块级跳过）。
  - id: RK-S7-001
    module_id: S7
    kp_id: KP-0701
    category: 高项·S7 论文
    type: 实操
    difficulty: hard
    level: 5
    title: 写「范围管理」的论文五段提纲
    body_md: |
      选一个**你自己真做过**的项目，按五段骨架写出「范围管理」的论文提纲。不写全文，只写提纲。

      1. **摘要**（3—5 句）：项目是什么、你是什么角色、重点论述哪个领域、结果如何
      2. **背景**（4—6 句）：建设单位、建设内容、工期、合同额、团队规模、你的职责
      3. **过程论述**（主体）：按收集需求 → 定义范围 → 创建 WBS → 确认范围 → 控制范围
         五个过程，每个写「做了什么动作 + 产出什么文档」
      4. **问题与对策**：写 1—2 个真实遇到的问题，每个配一条可执行对策
      5. **结尾**：至少一个量化结果 + 一处不足

      **硬要求**：全篇至少出现 5 个数字（工期、人数、金额、次数、比例任选）。
    options: []
    answer: "五段齐全；过程论述覆盖五个过程且每个都有动作与文档；问题带对策；结尾有量化数字；全篇≥5个数字"
    explanation_md: |
      **判据不在写得好不好，在有没有「只有你真做过才写得出的东西」。**

      自查四件事：

      1. **每个过程是不是都有文档名**。写「我组织收集需求」是空话；
         写「输出《需求规格说明书》并经建设方与 6 个区县签字确认」才有分。
         教材里每个过程的输出物是固定的，写不准就是没学到位。
      2. **问题是不是真的**。「沟通不畅」这种人人都会写的等于没写；
         要写「某区县数据格式与省级标准不一致，导致接口返工两次」这种带具体来源的问题。
      3. **对策是不是可执行**。对应上一条应该是「建立数据标准评审机制，
         三方签字后进入开发」——有动作、有角色、有时点。
      4. **数字够不够**。阅卷老师判断真假项目，靠的就是数字密度。
         一个真做过的人随口能说出工期、人数、金额、变更次数、验收轮次。

      常见不合格：
      - 五段都写了，但过程论述只有过程组名字，没有动作和文档
      - 通篇没有一处「我」，读起来像教材摘抄
      - 结尾写「项目顺利完成」——没有数字，也没有不足

  - id: RK-S7-002
    module_id: S7
    kp_id: KP-0701
    category: 高项·S7 论文
    type: 实操
    difficulty: hard
    level: 5
    title: 写「风险管理」的论文五段提纲
    body_md: |
      还是同一个项目，这次换成「风险管理」这个领域写五段提纲。

      风险管理的过程链与范围管理不同，要按它的顺序写：
      规划风险管理 → 识别风险 → 定性分析 → 定量分析 → 规划应对 → 实施应对 → 监督风险。

      **额外要求**：至少写出**两个具体的风险条目**，格式为
      「风险描述 + 概率/影响判断 + 应对策略（规避/转移/减轻/接受）」。

      **加分项**：写出一个「风险真的发生了，你是按预案处理的」的情节。
    options: []
    answer: "五段齐全；过程链按七步走；≥2 个风险条目含概率影响与应对策略；有一个风险真实发生并按预案处理的情节"
    explanation_md: |
      **风险管理是最好写出「真假」的领域**，因为编出来的风险都是「进度延期」「成本超支」
      这种同义反复，真做过的人写的是「某厂商的等保测评排期排到了三个月后」。

      三个得分点：

      1. **风险条目要具体到可判定**。「技术风险」不是风险条目；
         「区县自建库的数据字典与省级标准不一致的概率高、影响大」才是。
      2. **应对策略必须四选一且说清理由**。选「转移」就要说清转给谁（比如把等保测评外包给有资质的机构）；
         选「减轻」要说清降低了什么（把概率从高降到中）。
      3. **风险真实发生的那段最值钱**。它同时证明了「你识别过」和「你的预案有效」，
         是阅卷时区分真假项目的关键段落。

      常见不合格：
      - 风险清单写了十条，全是「需求变更风险」「人员流失风险」这类通用条目
      - 只写识别不写应对，或者应对全是「加强监控」
      - 定量分析整段跳过（很多人不知道这步要算，直接定性就到应对了）

  - id: RK-S7-003
    module_id: S7
    kp_id: KP-0701
    category: 高项·S7 论文
    type: 实操
    difficulty: hard
    level: 5
    title: 从项目里提炼 3 个「问题与对策」并配量化数据
    body_md: |
      论文里最容易写空的是「问题与对策」这一段。这一题只练这一段。

      从你的项目里提炼 **3 个真实问题**，每个按下面四行写：

      ```
      问题：（一句话，说事实不说评价）
      影响：（量化——耽误多少天、多花多少钱、返工多少次）
      对策：（动词开头的可执行动作，带角色和时点）
      结果：（对策之后指标变成什么）
      ```

      **完成后自查**：三个问题是否分属不同知识领域（不要三个都是进度问题）。
    options: []
    answer: "3 个问题各自带量化影响、可执行对策与结果；问题为客观事实不评价人；分属不同知识领域"
    explanation_md: |
      **这一段单独练，是因为它能复用到任何题目上。** 无论抽到哪个领域的论文，
      「问题与对策」都可以从这三个里挑一个最贴题的改写。

      四条判据：

      - **问题说事实不说评价**。写「未建立变更控制流程」而不是「管理混乱」。
        评价性表述阅卷时拿不到分，因为它不可核对。
      - **影响必须量化**。「影响了进度」不算；「导致上线延后 21 天」才算。
        这一步是把「编的」和「做过的」分开的地方——没做过的人给不出数字。
      - **对策动词开头 + 有角色 + 有时点**。「建立变更控制流程，由 PMO 每周评审，
        所有变更走书面申请」是合格的；「加强变更管理」不合格。
      - **结果要能和影响对上**。前面说延后 21 天，后面就要说「变更响应周期从 5 天降到 2 天，
        后续未再出现同类延期」。

      三个问题分属不同领域（比如范围、风险、干系人各一个），
      这样考场抽到任何题目都有现成素材可改。

  - id: RK-S8-001
    module_id: S8
    kp_id: KP-0801
    category: 高项·S8 高项新增考点
    type: 实操
    difficulty: medium
    level: 5
    title: 判断三个场景属于项目、项目集还是项目组合
    body_md: |
      分别判断下面三个场景属于**项目**、**项目集**还是**项目组合**，并各给一句理由。

      **场景 A**：某市要建一体化政务服务平台，含统一身份认证、事项梳理、数据共享三个子工程，
      三个子工程共用一套安全体系和一套运维团队，只有合在一起上线才能实现「一网通办」。

      **场景 B**：某集团信息中心今年手上同时有智慧园区、财务系统升级、数据中台三摊事，
      预算一共 6000 万，年底要决定明年砍掉哪一摊。

      **场景 C**：某气象局要在 8 个月内完成观测数据质控系统的开发与上线。

      **追问**：场景 A 的三个子工程，能不能各自独立立项、分别验收？为什么？
    options: []
    answer: "A=项目集（共用安全体系与运维、合起来才有一网通办收益）；B=项目组合（核心是按战略在项目间做投资取舍）；C=项目（单一独特产物、明确起止）；追问：不宜，收益依赖协同，单独验收会丢失整体目标"
    explanation_md: |
      **这一组辨析几乎每次综合知识都会出**，判据不是「规模大小」，是「管什么」。

      | | 管什么 | 成功判据 |
      | --- | --- | --- |
      | 项目 | 交付一个独特产物 | 按基准交付 |
      | 项目集 | 一组**相互关联**的项目，协调管理以获得单独管拿不到的收益 | 收益实现 |
      | 项目组合 | 一组项目的**投资集合**，按战略优先级配置资源 | 投资回报与战略一致 |

      逐条看：

      - **A 是项目集**。关键线索有两个：一是「共用安全体系和运维团队」——存在共享资源，
        必须协调；二是「合在一起上线才能一网通办」——收益是整体的，拆开就没有。
        这两条正是项目集的定义特征。
      - **B 是项目组合**。核心动作是「预算有限、年底决定砍哪个」——这是**投资取舍与优先级排序**，
        属于组合层面。注意它管的是「哪些事该做」，不是「怎么把事做好」。
      - **C 是项目**。单一产物、8 个月起止、明确目标，标准项目。

      **追问的答案是不宜独立验收。** 三个子工程的价值绑定在「一网通办」这个整体目标上，
      单独验收能过，但整体收益可能实现不了——这恰恰是项目集要解决的问题：
      **在子项目层面各自达标、在整体层面却失败**，是项目集管理最典型的失败模式。

      常见错误：
      - 看到 A 有三个子工程就答「项目组合」——组合的关键是投资取舍，不是数量多
      - 看到 B 有钱有预算就答「项目集」——项目集要求各项目之间**相互关联**，
        智慧园区和财务升级之间没有收益协同
      - 答对了但理由写「因为规模大」——判据错，考试按理由给分

  - id: RK-S8-002
    module_id: S8
    kp_id: KP-0803
    category: 高项·S8 高项新增考点
    type: 实操
    difficulty: hard
    level: 5
    title: 说清绩效域与十大知识领域是什么关系
    body_md: |
      第 4 版引入了「绩效域」，很多人的第一反应是「那十大知识领域还考不考」。

      请回答三个小问：

      1. 绩效域和十大知识领域是**替代**关系还是**两套切法**？各管什么？
      2. 举一个知识领域，说明它对应到绩效域时关注点发生了什么变化。
      3. 考试遇到「某做法体现了哪个绩效域」这类题，你的判断步骤是什么？
    options: []
    answer: "两套切法不是替代：知识领域管「管哪些方面」、绩效域管「要做出什么结果」；变化示例：范围管理从「走完五个过程」变成「交付物被验收且价值被承认」；判断步骤：先看动作产生了什么结果，再对应到结果类型的绩效域，最后回查涉及的知识领域"
    explanation_md: |
      **第一问的答案：两套切法，不是替代。**

      - **十大知识领域**回答「管哪些方面」——范围、进度、成本、质量、资源、沟通、
        风险、采购、干系人、整合。它是一张**分类清单**。
      - **绩效域**回答「要做出什么结果」——它描述的是项目在若干方面应该呈现出什么状态，
        是一组**结果视角**。

      同一个事实可以被两种方式描述：做 WBS 这件事，按领域归类属于「范围管理」，
      按结果视角看它服务于「规划」与「交付」相关的绩效。

      **第二问的示例（以范围管理为例）**：

      传统领域视角下，范围管理是「走完收集需求、定义范围、创建 WBS、确认范围、控制范围五个过程」，
      做到就算完成。绩效域视角下会追问：**交付物真的被干系人验收了吗？它真的解决了业务问题吗？**
      关注点从「过程走完」移到「结果被承认」。

      这个转变值得记住，因为它解释了很多项目「流程全做了但还是失败」的原因。

      **第三问的判断步骤**（考场可直接用）：

      1. **先看动作产生了什么结果**，不要先想它属于哪个领域
      2. 把结果归到对应类型的绩效域（是规划出了东西？是交付了？是团队状态变好了？）
      3. 再回查这个动作涉及哪些知识领域——这一步用来写理由，因为**理由按领域术语给分**

      常见错误：
      - 答「绩效域取代了知识领域」——教材两套都讲，不存在取代
      - 只背绩效域的名字，不记它描述的结果状态，遇到场景题就无从判断
      - 判断对了但理由只写绩效域名，不写对应的知识领域活动

  - id: RK-S8-003
    module_id: S8
    kp_id: KP-0802
    category: 高项·S8 高项新增考点
    type: 实操
    difficulty: hard
    level: 5
    title: 从组织级角度补答一道案例追问
    body_md: |
      高项案例题常以一个「组织级」追问收尾。这一题练那条追问怎么答。

      **背景**：某集团同时在建 12 个信息化项目，由不同部门各自立项、各自找承建商。
      今年出现三个问题：① 两个项目重复采购了同一套中间件；② 数据中台项目和财务升级项目
      的数据标准不一致，对接时返工；③ 年底预算削减 20%，没人说得清该砍哪个。

      **小问一**：从**项目管理**层面看，这三个问题分别暴露了什么？
      **小问二**：从**组织级（OPM）**看，根子上的缺失是什么？请至少写三条。
      **小问三**：如果集团让你建一套组织级机制，你最先建哪一样？为什么是它？
    options: []
    answer: "小问一：①采购管理无统筹②数据标准未统一、缺架构管控③无投资取舍依据；小问二：缺项目组合管理（无投资优先级与资源统筹）、缺项目集管理（关联项目未协同）、缺组织级标准与架构治理、缺统一的项目管理办公室；小问三：先建项目组合管理（含项目清单与优先级排序），因为没有取舍依据时其他机制都无从落地"
    explanation_md: |
      **这类题的分水岭是能不能把三个问题从「项目层」升到「组织层」。** 多数人只答第一问。

      **小问一（项目层面）**，逐条对应：
      - ① 重复采购 → 采购管理在单个项目内是合格的，问题出在没有跨项目统筹
      - ② 数据标准不一致 → 两个项目各自没有错，错在缺组织级的数据标准与架构管控
      - ③ 说不清该砍谁 → 项目层根本没有这个职责，它属于投资决策

      注意这里的写法：**每条都先说「项目层没错」，再指出边界之外缺了什么**。
      这样答能体现你分得清层级，比笼统说「管理混乱」高一个档。

      **小问二（组织级缺失）**，至少三条：
      1. **缺项目组合管理**：没有统一的项目清单、没有按战略优先级排序、没有资源统筹
      2. **缺项目集管理**：数据中台与财务升级明显是有关联的项目，却没有做收益协同
      3. **缺组织级标准与架构治理**：数据标准、技术选型没有统一归口
      4. 缺项目管理办公室（PMO）承担跨项目协调与制度落地

      **小问三**，推荐答「先建项目组合管理」，理由是可论证的：
      **其余机制的落地都要以「有哪些项目、谁优先」为前提**——没有项目清单和优先级，
      资源统筹无处下手、架构治理排不出先后、PMO 也无从判断该管谁。
      答题时把这个依赖关系说出来，比单纯罗列更得分。

      常见不合格：
      - 小问二答「加强领导重视」「提高全员意识」——不是机制，是口号
      - 小问三答「全面建立组织级管理体系」——没有取舍，等于没答
      - 三问答案互相重复，没有层级递进

  - id: RK-S8-004
    module_id: S8
    kp_id: KP-0801
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: easy
    level: 1
    title: 项目集与项目组合的核心区别
    body_md: |
      下列关于项目集与项目组合的说法，正确的是？
    options:
      - 项目集是一组相互关联的项目，协调管理以获得单独管理拿不到的收益
      - 项目组合就是一个规模特别大的项目集
      - 项目集的核心特征是它管的项目数量多
      - 项目组合的成功判据是每个子项目的进度与成本都达标
    answer: "A"
    explanation_md: |
      **判据是「管什么」，不是「有多大」。**

      | | 管什么 | 成功判据 |
      | --- | --- | --- |
      | 项目集 | 一组**相互关联**的项目，协调管理以获得单独拿不到的收益 | 收益实现（1+1>2） |
      | 项目组合 | 一组项目和项目集的**投资集合**，按战略优先级配置资源 | 投资回报与战略一致 |

      逐项看：
      - **A 对**，是项目集的标准定义。
      - **B 错**。项目组合不是「大项目集」，它里面完全可以是互不相关的项目——
        组合的关键是**投资取舍**，项目集的关键是**关联**。这是两件事。
      - **C 错**。数量不是判据。十个互不相关的项目放一起也不叫项目集。
      - **D 错**。这是**项目**的判据。组合不关心某个子项目按期没按期，
        它关心钱投得对不对、整体回报如何。

      常见坑：看到「很多项目」就选项目组合。**先问一句「它们之间有收益协同吗」——
      有就是项目集，没有就是组合。**
    source: manual

  - id: RK-S8-005
    module_id: S8
    kp_id: KP-0801
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: hard
    level: 4
    title: 三个抱怨分别该由哪一层回应
    body_md: |
      某市在建智慧交通项目，出现三个抱怨：

      ① 某路口的信号优化迟迟不上线；
      ② 交通与城管两套系统数据对不上，联动处置形同虚设；
      ③ 明年市级信息化预算要砍 30%，交通这条线该不该保，没人说得清。

      这三个抱怨分别该由哪一层回应？
    options:
      - ① 项目组合层 ② 项目集层 ③ 项目层
      - ① 项目集层 ② 项目层 ③ 组织级治理层
      - ① 项目层 ② 项目集层 ③ 项目组合层
      - ① 项目层 ② 项目层 ③ 项目集层
    answer: "C"
    explanation_md: |
      **这类题的唯一方法是把抱怨翻译成「谁有权做这个决定」。**

      - **①信号优化不上线** → 单一交付物的进度问题，**项目层**能解决。项目经理加人、调排期就行。
      - **②两套系统数据对不上** → 两个项目之间的协同失效。单看每个项目都没错，
        错在没人在中间协调数据标准与联动接口，这是**项目集层**。
      - **③该不该保这条线** → 预算有限下在若干条线之间做取舍，这是**项目组合层**的
        投资优先级决策。

      所以是「项目 → 项目集 → 项目组合」自下而上三层，选 C。

      干扰项 B（「组织级治理层」）看起来更高级，但**组合层就是组织级治理在投资上的体现**，
      题目问的是「哪一层回应这个具体决策」，答组合层才落地。

      **判据一句话**：项目层管「怎么干成」，项目集层管「合起来有没有用」，
      组合层管「这钱该不该花」。
    source: manual

  - id: RK-S8-006
    module_id: S8
    kp_id: KP-0802
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: easy
    level: 1
    title: PMO 三种类型的权力边界
    body_md: |
      关于项目管理办公室（PMO）的三种类型，说法正确的是？
    options:
      - 支持型 PMO 直接接管项目，项目经理向它汇报
      - 控制型 PMO 只提供模板与培训，不要求项目遵守
      - 指令型 PMO 权力最小，本质上是顾问角色
      - 控制型 PMO 要求项目按统一流程执行并做检查考核，但不直接接管项目
    answer: "D"
    explanation_md: |
      三种类型的区别只有一条主线：**它有多大权**。

      | 类型 | 角色 | 做什么 | 权力 |
      | --- | --- | --- | --- |
      | 支持型 | 顾问 | 给模板、培训、工具，不强制 | 最小 |
      | 控制型 | 警察 | 要求按统一流程走，有检查与考核 | 居中 |
      | 指令型 | 老板 | 直接管项目，项目经理向 PMO 汇报 | 最大 |

      逐项看：
      - **A 错**，这是指令型的描述。
      - **B 错**，这是支持型的描述。
      - **C 错**，说反了，指令型权力最大。
      - **D 对**。控制型的关键特征是「**管流程、管考核，但不接管项目**」——
        项目还是项目经理负责，PMO 检查你有没有按规矩来。

      常见坑：把「控制型」理解成「控制项目」。它控制的是**流程合规**，
      不是项目本身——一旦它开始直接指挥项目，就已经升到指令型了。
    source: manual

  - id: RK-S8-007
    module_id: S8
    kp_id: KP-0802
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: medium
    level: 3
    title: 成熟度提升的第一步该做什么
    body_md: |
      某集团现状：各部门自定流程、模板五花八门，同一个交付物有五六种写法。
      集团想先把做法统一起来，并能落地考核，但不想一上来就激化部门矛盾。

      按组织级项目管理成熟度的提升路径，第一步该做什么？
    options:
      - 先建量化度量体系，用数据评比各部门
      - 直接建指令型 PMO，统一接管所有项目
      - 先做标准化，统一流程与模板，再逐步推进到可度量
      - 先做持续改进，鼓励各部门自行优化做法
    answer: "C"
    explanation_md: |
      成熟度的提升路径是**固定顺序，跳步会白费**：

      **标准化 → 可度量 → 可控制 → 持续改进**

      为什么不能跳，这一题恰好三个干扰项各踩一个坑：

      - **A（先上度量）**：各家做法都不一样，量出来的数不可比——
        甲部门「按期率 90%」用的是宽松口径，乙部门 70% 用的是严格口径，
        放在一起评比只会制造矛盾，不是管理。
      - **B（先上指令型）**：题干已经说了「不想激化矛盾」。指令型在部门墙硬的
        组织里通常先撞墙，制度推不下去。
      - **C（先标准化）对**：「统一做法」正是标准化的定义，而且它**不涉及考核**，
        阻力最小。做完再谈度量，数据才有可比性。
      - **D（先持续改进）**：连统一做法都没有，「改进」改的是各自的做法，
        结果只会更分散。

      **判据一句话**：成熟度的每一级都是下一级的前提，
      题目里「现状是什么」往往直接指向「该补哪一级」。
    source: manual

  - id: RK-S8-008
    module_id: S8
    kp_id: KP-0803
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: medium
    level: 2
    title: 哪一组全部属于绩效域
    body_md: |
      下列哪一组**全部**属于项目绩效域？
    options:
      - 干系人、团队、规划、交付
      - 范围、进度、成本、质量
      - 整合、沟通、风险、采购
      - 标准化、可度量、可控制、持续改进
    answer: "A"
    explanation_md: |
      这一题考的是「绩效域、知识领域、成熟度路径」三样东西不能混。

      **八个绩效域**：干系人、团队、开发方法与生命周期、规划、项目工作、交付、测量、不确定性。
      按四组记：**人**（干系人、团队）— **法**（开发方法与生命周期、规划）—
      **干**（项目工作、交付）— **看**（测量、不确定性）。

      逐项看：
      - **A 对**，四个都在八个绩效域里。
      - **B 错**，范围、进度、成本、质量是**知识领域**（管哪些方面）。
      - **C 错**，整合、沟通、风险、采购同样是**知识领域**。
      - **D 错**，这是 OPM **成熟度的提升路径**，和绩效域没有关系。

      **判据一句话**：绩效域名偏「结果状态」（干系人参与了、交付了、测量了），
      知识领域名偏「管理方面」（范围、进度、成本）。名字的语感就能分辨大半。
    source: manual

  - id: RK-S8-009
    module_id: S8
    kp_id: KP-0803
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: hard
    level: 4
    title: 系统验收通过但没人用，断在哪一环
    body_md: |
      某政务系统按期上线、验收通过，一年后使用率不足 10%，业务办理时长没变。

      按价值交付链条看，问题主要断在哪一环？
    options:
      - 项目 → 产品
      - 产品 → 成果
      - 成果 → 价值
      - 没断，这属于运营问题，不在项目管辖范围
    answer: "B"
    explanation_md: |
      **价值交付链条：项目 → 产品 → 成果 → 价值**

      - 项目产出**产品**（可交付物）
      - 产品被使用才产生**成果**（业务指标真的变了）
      - 成果带来**价值**（对组织或干系人的好处）

      逐项看：
      - **A 错**。产品已经出来了，而且验收通过，这一环是通的。
      - **B 对**。产品有了，但**没人用**（使用率 10%）、**指标没变**（办理时长没动），
        说明「产品 → 成果」断了。产品只是存在，没有产生业务改变。
      - **C 错**。成果都还没发生，谈不上成果到价值。
      - **D 错**。这是这类题最常见的错误答法。把它推给运营，等于承认项目只对
        「交出东西」负责——而高项的绩效域视角恰恰要求项目对「结果」负责。

      **答题时要说清补法**，否则只答 B 拿不到满分：重定义的「交付」要包含
      「被使用」，测量要加业务指标（使用率、办理时长、差错率），
      而不是加更多的进度报表。

      **判据一句话**：验收通过说明产品环通了；没人用、指标没变说明成果环断了。
    source: manual

  - id: RK-S8-010
    module_id: S8
    kp_id: KP-0804
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: easy
    level: 1
    title: 哪些动作属于 IT 治理
    body_md: |
      下列动作中，属于 **IT 治理**而不是 IT 管理的是？
    options:
      - 制定系统上线前的测试方案与验收标准
      - 组织运维团队处理生产环境故障
      - 编写数据库设计说明书与接口规范
      - 审批超过 200 万的 IT 投资，并确定这类决策由谁做出
    answer: "D"
    explanation_md: |
      **治理管「做正确的事」（评估、指导、监督），管理管「把事做对」（计划、构建、运行）。**

      最实用的判据是问一句：**这个动作是在定「谁有权决定」，还是在定「怎么执行」？**

      逐项看：
      - **A 错**，测试方案怎么定，是执行层面的方法选择，属于管理。
      - **B 错**，故障处置是运行活动，属于管理（具体是 ITSM 里的事件管理）。
      - **C 错**，技术设计文档属于构建过程，是管理。
      - **D 对**。它同时含两个治理要素：**审批门槛**（什么事必须上报）与
        **决策权归属**（谁说了算）。这两个都是治理的核心动作。

      容易混的一点：**「审批」不等于治理，「确定审批权归谁」才是治理。**
      如果题目说的是「按既定流程审批这个金额」，那已经在执行治理定下的规则，属于管理。
    source: manual

  - id: RK-S8-011
    module_id: S8
    kp_id: KP-0804
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: medium
    level: 2
    title: IT 审计的流程顺序
    body_md: |
      IT 审计的标准流程是下面哪一个？
    options:
      - 审计实施 → 审计准备 → 审计报告 → 后续审计
      - 审计准备 → 审计实施 → 审计报告 → 后续审计
      - 审计准备 → 审计报告 → 审计实施 → 后续审计
      - 审计准备 → 审计实施 → 后续审计 → 审计报告
    answer: "B"
    explanation_md: |
      **四阶段：审计准备 → 审计实施 → 审计报告 → 后续审计**

      各阶段在做什么：
      1. **审计准备**：确定范围与目标、组建审计组、了解被审计对象、制定审计方案
      2. **审计实施**：收集证据（访谈、检查、测试、观察、穿行测试）、形成审计发现
      3. **审计报告**：出具审计意见书、与被审计方沟通、提出整改建议
      4. **后续审计**：跟踪整改落实情况——**这一环最容易被忘，也最常考**

      逐项看：C 把报告放到实施前，没有证据就出结论；D 把报告放最后，
      等于整改完了才出意见书，逻辑颠倒。

      **为什么要记住最后一环**：审计的价值不在于发现问题，在于问题被改掉。
      报告交完就结束的审计，在案例题里会被判为「未闭环」。

      **判据一句话**：先准备、再取证、再出结论、最后盯整改。
    source: manual

  - id: RK-S8-012
    module_id: S8
    kp_id: KP-0804
    category: 高项·S8 高项新增考点
    type: 实操
    difficulty: hard
    level: 5
    title: 判断该组织缺的是治理还是管理，并排出先后
    body_md: |
      某集团 CIO 被董事会问「我们的 IT 到底管得好不好」。现状三条：

      - IT 预算由各部门自己报、各自找承建商，没有统一的 IT 决策机构；
      - 系统出了故障才有人管，事后也没人分析为什么反复出；
      - 没有任何 IT 绩效指标，评价标准只有一句「有没有按时上线」。

      **小问一**：这些问题主要是治理缺失还是管理缺失？分别缺在哪？
      **小问二**：给出三条治理层应当先建的机制。
      **小问三**：为什么现在不适合先搞一轮 IT 审计？

    options: []
    answer: "小问一：主要是治理缺失——缺决策机构与决策权归属、缺绩效目标与评价体系；管理层面也有缺（问题管理缺失、无指标），但根子在治理没定目标和规则；小问二：①成立 IT 治理委员会，明确哪类投资由谁决策②定义四条 IT 绩效指标（业务一致、数据利用、风险可控、绩效可衡量）并纳入汇报③建立 IT 战略与年度投资计划的对齐机制；小问三：审计要对照标准判断，现在没有决策规则与绩效标准，审计无判据可用，且独立性与整改机制都未建立，容易变成一次性检查"
    explanation_md: |
      这一题的考点是**分层**：能不能把一堆现象归到「治理没定规则」而不是「执行不力」。

      **小问一**：主要是**治理**缺失。逐条对应：
      - 没有统一决策机构 → 缺治理主体（评估、指导、监督的人不在）
      - 只看「有没有按时上线」→ 缺治理目标与绩效评价体系
      - 故障反复发生、没人分析根因 → 这一条是**管理**层面的缺失（问题管理没做）

      所以准确的答法是：**根子在治理，表现里有一条是管理**。
      只答「都是治理」不够，会显得没有分层。

      **小问二**，三条要有先后逻辑，不要并列罗列：
      1. **成立 IT 治理委员会并明确决策权归属**——哪类投资、哪个金额以上由谁批。
         （没有这一条，后面两条无处落地）
      2. **定义 IT 绩效指标**，教材给的四个方向：与业务目标一致、有效利用信息与数据、
         风险可控、绩效可衡量。指标要能拿到数，不是写口号。
      3. **建立 IT 战略与年度投资计划的对齐机制**——每年投资清单必须回答
         「支持哪条业务目标」。

      **小问三（分水岭）**：审计的前提是**有标准可比**。
      现在没有决策规则、没有绩效指标，审计师拿到一堆现象却找不到判据；
      而且被审计方连整改机制都没有，报告出来也没人跟。
      **先有治理标准，审计才有对象**——这个先后关系说出来，这题就满分了。

      常见不合格：
      - 小问二答「加强重视、提高意识、完善制度」——三个都不是机制
      - 小问三答「因为还没到审计的时候」——没给理由
      - 三问之间没有依赖关系，像是三个独立问题
    source: manual

  - id: RK-S8-013
    module_id: S8
    kp_id: KP-0805
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: medium
    level: 3
    title: 决策树的净期望收益
    body_md: |
      某方案需投入 120 万。三种市场情形：

      | 情形 | 概率 | 收益 |
      | --- | --- | --- |
      | 好 | 0.4 | 300 万 |
      | 中 | 0.4 | 150 万 |
      | 差 | 0.2 | 40 万 |

      该方案的**净期望收益**是多少？
    options:
      - 188 万
      - 68 万
      - 48 万
      - 120 万
    answer: "B"
    explanation_md: |
      **两步，不能只算一步。**

      **第一步算毛期望值（EMV）：**

      0.4×300 + 0.4×150 + 0.2×40 = 120 + 60 + 8 = **188 万**

      **第二步减投入：**

      188 − 120 = **68 万**（净期望收益）

      所以答案是 68 万，选 B。

      干扰项就是在考你停在哪一步：
      - **A（188）**：算对了 EMV 但忘了减投入。题干问的是**净**期望收益。
      - **C（48）**：大概是把某个数减错了，属于计算错误。
      - **D（120）**：直接拿了投入金额。

      **判据一句话**：题目问「EMV / 期望货币值」就到 188 为止；
      问「净期望收益 / 净现值」就要减投入。**两个词差一个字，答案差 120 万。**

      顺带记一条：这类题里如果出现「已投入 80 万」这种数字，它**不参与计算**——
      沉没成本不影响决策。
    source: manual

  - id: RK-S8-014
    module_id: S8
    kp_id: KP-0805
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: medium
    level: 3
    title: 盈亏平衡产量与是否该做
    body_md: |
      某产品固定成本 60 万元，单价 500 元，单位变动成本 300 元。
      市场调研显示最多只能卖出 2500 件。

      盈亏平衡产量是多少？该产品是否应该做？
    options:
      - 2000 件，应该做
      - 1200 件，不应该做
      - 3000 件，不应该做
      - 3000 件，应该做
    answer: "C"
    explanation_md: |
      **公式：盈亏平衡产量 = 固定成本 ÷ (单价 − 单位变动成本)**

      代入：

      600000 ÷ (500 − 300) = 600000 ÷ 200 = **3000 件**

      市场最多卖 2500 件 < 3000 件，**达不到保本点，不应该做**。所以选 C。

      分母「单价 − 单位变动成本」叫**边际贡献**，是这一节的题眼。
      每题都先算它：边际贡献 = 200 元/件，意味着每多卖一件只能覆盖 200 元固定成本。

      **两个干扰项的设计意图**：
      - **A（2000 件）**：可能是把固定成本按 300 算了（600000÷300=2000），
        用错了分母。分母必须是**边际贡献**，不是单位变动成本。
      - **D（3000 件，应该做）**：算对了产量，但没比市场容量。
        **算完要回头看一眼「能不能卖得掉」**——这是案例题最常丢的分。

      **进阶判据**：如果边际贡献 ≤ 0（单价不高于单位变动成本），
      产量再大也亏，连算都不用算，直接不做。题目里降价幅度过大的情形，
      就是在考这一条。
    source: manual

  - id: RK-S8-015
    module_id: S8
    kp_id: KP-0805
    category: 高项·S8 高项新增考点
    type: 实操
    difficulty: hard
    level: 5
    title: 给现金流表算 NPV 与回收期并决策
    body_md: |
      某项目初始投资 1000 万元，之后四年净现金流如下（单位：万元）：

      | 年份 | 0 | 1 | 2 | 3 | 4 |
      | --- | --- | --- | --- | --- | --- |
      | 净现金流 | −1000 | 300 | 400 | 400 | 300 |

      折现率（基准收益率）为 10%。

      **小问一**：计算该项目的净现值 NPV（保留整数），并判断是否可行。
      **小问二**：计算静态投资回收期（保留两位小数）。
      **小问三**：若基准收益率提高到 15%，结论会变吗？请定性说明理由，不必重算全部数字。

    options: []
    answer: "小问一：NPV≈109万（272.73+330.58+300.53+204.90−1000=108.74），NPV>0，可行；小问二：累计现金流−1000、−700、−300、+100，第3年转正，回收期=2+300/400=2.75年；小问三：会变——15%时四项折现合计约998万，NPV约−2万略小于0，不可行，说明内部收益率IRR约在14.8%—15%之间，刚好卡在基准线上"
    explanation_md: |
      **小问一：逐项折现，一项都不能漏。**

      | 年 | 净现金流 | 折现系数 1/(1.1)^t | 折现值 |
      | --- | --- | --- | --- |
      | 1 | 300 | 0.9091 | 272.73 |
      | 2 | 400 | 0.8264 | 330.58 |
      | 3 | 400 | 0.7513 | 300.53 |
      | 4 | 300 | 0.6830 | 204.90 |

      合计 1108.74，减初始投资 1000 → **NPV ≈ 109 万元**。
      **NPV > 0，项目可行。**

      **小问二：回收期靠逐期累加，找到变号那年。**

      累计：−1000 → −700 → −300 → **+100**（第 3 年转正）

      回收期 = 2 + 300 ÷ 400 = **2.75 年**

      注意小数部分的算法：**上年累计的绝对值 ÷ 当年现金流**。
      写成 3 年是错的（第 3 年才转正，但不是在年末才转）。

      **小问三：这是这题最值钱的一问。**

      15% 时折现系数变小，四项合计掉到约 998 万，NPV ≈ **−2 万**，由正转负。
      所以结论会变，项目不再可行。

      这组数字不是随便设计的：**它正好卡在临界点上**，说明该项目的
      **内部收益率 IRR 约 14.8%—15%**。而 IRR 的定义就是「让 NPV = 0 的折现率」，
      这里两者正好对上了。

      **答题时把这个联系说出来**，比只答「会变，因为折现率高了」多一档分。

      常见错误：
      - NPV 算成 108.74 却不判断可行性（题目问了两件事）
      - 回收期写成 3 年（漏了小数部分）
      - 小问三直接答「会变」不给量化依据
    source: manual

  - id: RK-S8-016
    module_id: S8
    kp_id: KP-0806
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: easy
    level: 1
    title: 组织战略链条的顺序
    body_md: |
      组织从方向到年度行动，下面哪个顺序是正确的？
    options:
      - 使命 → 愿景 → 战略目标 → 年度经营目标
      - 愿景 → 使命 → 战略目标 → 年度经营目标
      - 战略目标 → 使命 → 愿景 → 年度经营目标
      - 年度经营目标 → 战略目标 → 愿景 → 使命
    answer: "A"
    explanation_md: |
      **顺序是：使命 → 愿景 → 战略目标 → 年度经营目标 → 部门与项目目标**

      四者各自的定位：
      - **使命**：我们为什么存在（回答「做什么、为谁做」）
      - **愿景**：要成为什么样子（回答「未来到哪儿」）
      - **战略目标**：分几步走到那个样子（通常三五年）
      - **年度经营目标**：今年做到哪一步（可量化、可考核）

      逐项看：
      - **A 对**。先有存在理由，才有未来图景，才有路径，才有年度拆解。
      - **B 错**。愿景放在使命前面——**先知道「为什么存在」，才谈「要成为什么」**。
        这两者顺序是最常考的一处。
      - **C、D 错**。从执行反向推回去，因果颠倒了。

      **为什么这题值得记**：案例题问「项目目标与组织战略脱节，问题出在哪」，
      答法就是从这条链往上找断点——通常断在「年度目标没有拆解到项目」这一环，
      而不是「项目经理执行力不够」。
    source: manual

  - id: RK-S8-017
    module_id: S8
    kp_id: KP-0806
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: medium
    level: 2
    title: 这两个动作分别属于 SECI 的哪一步
    body_md: |
      某公司做了两件事：

      ① 把资深项目经理的经验整理成《项目风险应对手册》；
      ② 把这份手册与已有的《质量管理手册》一起，整合进公司统一的项目管理模板库。

      按 SECI 模型，这两件事主要属于哪两步？
    options:
      - 社会化 → 外化
      - 外化 → 组合化
      - 组合化 → 内化
      - 内化 → 社会化
    answer: "B"
    explanation_md: |
      **SECI 四步：社会化 → 外化 → 组合化 → 内化**

      | 步骤 | 在做什么 | 典型动作 |
      | --- | --- | --- |
      | 社会化 | 人与人待在一起，靠观察模仿传经验 | 师徒带、跟岗、复盘会 |
      | 外化 | 把经验说出来写下来，变成可复用文档 | 写手册、写案例、录SOP |
      | 组合化 | 把零散文档整理成体系与模板库 | 合并规范、建模板库、编知识地图 |
      | 内化 | 别人学完变成自己的能力再去实践 | 培训考核、照SOP实操并改进 |

      - **① 写成手册** → **外化**。关键动作是「经验离开人，落到文档上」。
      - **② 与已有手册整合进统一模板库** → **组合化**。关键动作是「文档之间建立体系」，
        从零散变成成套。

      所以选 B。

      **干扰项 A 的陷阱**：题干的「资深项目经理」容易让人联想「社会化」。
      但社会化指的是**当面传递**（带人、跟岗），而题目描述的动作是**写成文档**——
      这一步已经跨过去了。**看动作，不看谁在做。**

      **为什么要单独记外化**：四步里外化最关键，它决定经验能不能离开人。
      组织里最缺的通常也正是这一步——人一走经验就没了。
    source: manual

  - id: RK-S8-018
    module_id: S8
    kp_id: KP-0806
    category: 高项·S8 高项新增考点
    type: 实操
    difficulty: hard
    level: 5
    title: 设计一套能被检查的知识管理机制
    body_md: |
      某公司常年出现同一种情况：项目做完团队就散，下一个同类项目又从零开始，
      同样的坑再踩一遍。公司也发过文件要求「项目结束后做好总结」，
      但没人交、也没人查。

      **小问一**：按知识管理看，缺的是哪一步（或哪几步）？为什么？
      **小问二**：给出三个可被检查的动作，每个都要写清「谁做、什么时候做、产出什么」。
      **小问三**：怎么验证这套机制真的生效？不许用「提高意识」「加强培训」这类指标。

    options: []
    answer: "小问一：缺外化，连带缺组合化与内化——经验留在个人身上未落成文档，即使有文档也未整理成模板库，更没有下次立项时的强制复用；小问二：①项目经理在结项评审前提交《经验教训登记册》，不提交不予结项②PMO每季度把登记册条目提炼进风险清单与模板库并发布版本号③新项目立项时必须检索模板库并说明沿用了哪几条，写进项目计划；小问三：看可核对的痕迹——同类问题重复发生率、模板库条目被引用次数、结项材料中经验教训登记册的齐备率、新项目风险清单里有多少条来自历史库"
    explanation_md: |
      这一题的分水岭在**小问二和第三问**：能不能把「总结一下」变成「有人做、有人查」。

      **小问一**：缺的主要是**外化**，连带缺组合化与内化。
      - 经验留在个人身上 → 隐性知识没转成显性（**外化**缺失）
      - 即使零散写了，也没整合成模板库 → **组合化**缺失
      - 下次立项没人去查 → **内化**断在最后一环

      公司发过文件却没人交，恰好说明问题不在「有没有要求」，而在**没有落点**。

      **小问二**，三个动作要构成闭环，缺一环链条就断：

      1. **项目经理**，**结项评审前**，提交《经验教训登记册》——
         **不提交不予结项**。这一条给的是强制力，也是最关键的一条：
         把知识产出挂到流程关口上，而不是挂在「自觉」上。
      2. **PMO**，**每季度**，把登记册条目提炼进风险清单与模板库，**发布版本号**。
         这一条做的是组合化，同时让知识有「可检索的入口」。
      3. **新项目经理**，**立项时**，检索模板库并说明沿用了哪几条，写进项目计划。
         这一条把「查了没查」变成可核对的文字。

      三条合起来是：**产出有强制、整理有归口、复用有检查**。

      **小问三**，指标必须能拿到数据：
      - 同类问题**重复发生率**（去年踩过、今年又踩的次数）
      - 模板库条目**被引用次数**
      - 结项材料中登记册的**齐备率**
      - 新项目风险清单里**来自历史库的条目占比**

      这四个都是能从系统里统计出来的。答「员工知识管理意识提升」不成立——
      它既拿不到数，也无法证伪。
    source: manual

  - id: RK-S8-019
    module_id: S8
    kp_id: KP-0807
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: easy
    level: 1
    title: 多方互不信任又要留痕，用什么技术
    body_md: |
      多个互不信任的委办局之间需要共享数据，各方的操作都要留存、
      事后不可被任何一方篡改。最贴切的技术是？
    options:
      - 云计算
      - 数字孪生
      - 大数据
      - 区块链
    answer: "D"
    explanation_md: |
      **判据是三个条件同时出现：多方参与 + 互不信任 + 需要不可篡改的留痕。**
      这三条凑齐就是分布式账本要解决的问题。

      - **D 区块链**：分布式账本由各方共同维护，单方改不了历史记录，
        配合共识机制与智能合约还能把「谁在什么时候做了什么」固化下来。
      - **A 云计算**：解决的是「算力和资源从哪来、按需取用」，不解决信任问题。
      - **B 数字孪生**：给物理实体造数字镜像，用于仿真与预测性维护，和存证无关。
      - **C 大数据**：解决「数据量大到常规工具处理不了」，是处理能力问题。

      **必须说清的边界（案例题常追问）**：区块链解决的是**信任与存证**，
      它**不解决数据质量与标准**。两个局的数据字段定义不一样，上了链也还是对不上——
      那要靠数据治理。把这两件事混着答，是这类题最常见的丢分点。

      **判据一句话**：问「数据从哪来」找物联网，问「算力在哪」找云，
      问「怎么从历史数据里预测」找 AI，问「多方怎么互信」才找区块链。
    source: manual

  - id: RK-S8-020
    module_id: S8
    kp_id: KP-0807
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: medium
    level: 2
    title: 城市大脑属于哪一类新型基础设施
    body_md: |
      某市建设「城市大脑」，把交通、城管、应急等部门的运行数据接入，
      实现联动指挥与智能调度。它属于新型基础设施中的哪一类？
    options:
      - 信息基础设施
      - 创新基础设施
      - 不属于新型基础设施
      - 融合基础设施
    answer: "D"
    explanation_md: |
      **新型基础设施三类：**

      | 类型 | 是什么 | 例子 |
      | --- | --- | --- |
      | 信息基础设施 | 网络、算力、数据这些「技术底座」本身 | 5G 基站、数据中心、智算中心 |
      | 融合基础设施 | 传统基础设施 + 数字化改造 | 智慧交通、智慧能源、城市大脑 |
      | 创新基础设施 | 支撑科研与产业创新的平台 | 国家重点实验室、产业创新中心 |

      **判据是问一句「它改造了哪个传统领域」**：
      城市大脑服务的是**城市运行**（交通、城管、应急），属于给传统城市管理加数字化改造，
      所以是**融合基础设施**，选 D。

      干扰项辨析：
      - **信息基础设施**：如果题目说的是「建一个智算中心给各部门提供算力」，
        那才是信息基础设施——它只提供底座，不改造某个具体领域。
      - **创新基础设施**：它的产出是科研成果或产业孵化，不是城市运行能力。

      **判据一句话**：看它**服务于谁**。服务「算力与网络」是信息类，
      服务「某个传统行业的运行」是融合类，服务「科研与创新」是创新类。
    source: manual

  - id: RK-S8-021
    module_id: S8
    kp_id: KP-0807
    category: 高项·S8 高项新增考点
    type: 实操
    difficulty: hard
    level: 5
    title: 系统都上了但流程没变，缺的是什么
    body_md: |
      某单位三年上了 OA、财务、人事三套系统，投入不小。但实际情况是：
      办事还是靠微信群催、审批还是先线下签完再补录、三套系统各存一份人员数据。

      **小问一**：按数字化转型的三个层面看，它缺的是什么？逐条对应说明。
      **小问二**：给出一条能立刻验证「是不是真转型了」的指标。
      **小问三**：为什么「再上一套数据中台」解决不了这个问题？

    options: []
    answer: "小问一：缺流程重构（线下签完再补录说明流程没改）、缺数据治理与统一标准（三套系统各存一份人员数据）、缺组织与能力匹配（仍靠微信群催，职责与考核没跟着变）；小问二：看流程是否在系统内闭环——如「线上发起且线上完成审批的单据占比」或「补录率」，补录率降不下来就说明流程没搬进系统；小问三：中台解决的是数据汇聚与共享，前提是各系统数据标准统一、源头质量可控；现在流程没改、标准没定，中台只是把脏数据搬到一处，反而多一层维护成本"
    explanation_md: |
      这题考的是**能不能分清「上系统」和「转型」**。

      **小问一**：数字化转型的三件事是**数据驱动决策、业务流程重构、组织与能力匹配**。
      逐条对照题干：

      - **流程重构缺失**：「先线下签完再补录」是最典型的证据——现实流程没变，
        系统只是被当成事后登记本。**判断转型真假只看一条：流程是不是在系统里走完的。**
      - **数据治理缺失**：「三套系统各存一份人员数据」说明没有统一数据标准与主数据管理，
        每套系统都在自己的口径里正确，合起来就是错的。
      - **组织与能力匹配缺失**：「还靠微信群催」说明职责、考核、权限没跟着流程调整，
        系统上线了但没人必须用它。

      **小问二**，指标要能立刻验证，推荐两个：
      - **补录率**：事后补录的单据占比。降不下来就说明流程没搬进系统。
      - **线上闭环率**：线上发起且在线上完成审批的单据占比。

      这两个都是从系统日志能直接统计的，不依赖问卷，也做不了假。
      比「用户满意度」「系统使用率」硬得多——**使用率可以靠考核刷出来，闭环率刷不出来**。

      **小问三（这一问最见水平）**：数据中台的功能是**汇聚、加工、共享**，
      它的前提是「各系统有统一标准、源头数据可信」。

      现在流程没改（数据产生的时点就是错的）、标准没定（字段口径不一致），
      中台拿到的是一堆口径不同的数据，只能把它们堆到一处——
      **脏数据搬一次家仍然是脏数据，还多了一层要维护**。

      正确顺序是：**先定标准与主数据 → 再改流程让数据在源头产生 → 最后才谈汇聚**。
      这个先后关系说出来，这题就答到位了。

      常见不合格：
      - 小问一答「信息化程度不够」——三套系统都上了，问题恰恰不是程度不够
      - 小问二答「员工满意度提升」——拿不到数，也无法证伪
      - 小问三答「中台太贵」——答的是成本，不是逻辑
    source: manual

  - id: RK-S8-022
    module_id: S8
    kp_id: KP-0801
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: easy
    level: 2
    title: 项目集的成功判据写错了
    body_md: |
      某集团把「项目集管理」的考核标准写成：**各子项目均按期、按预算完成**。

      这个判据错在哪？
    options:
      - 项目集的成功判据是收益实现，子项目各自达标不等于整体收益达成
      - 判据没错，子项目都达标了，整体自然达标
      - 错在漏了质量指标，应该加上质量才算完整
      - 错在项目集不应该设成功判据
    answer: "A"
    explanation_md: |
      **项目集的成功判据是「收益实现」，不是「子项目都达标」。**

      这不是文字游戏，恰恰是项目集管理存在的理由。项目集管的是「一组**相互关联**的项目，
      协调管理以获得单独管理拿不到的收益」——如果子项目各自达标就等于项目集成功，
      那就不需要项目集管理了，管好每个项目就行。

      为什么两者会脱钩：子项目各自按自己的目标优化，很容易在整体上互相抵消。
      典型例子：三个子项目都按时上线，但三套系统之间没打通，
      「一网通办」这个整体目标实现不了——**每个都及格，合起来不及格**。

      逐项看：
      - **A 对**。
      - **B 错**，正是上面说的脱钩情形。
      - **C 错**，加质量指标也没解决问题——问题在**判据的层级**，不在指标数量。
      - **D 错**，项目集当然有成功判据，就是收益实现。

      **判据一句话**：项目看基准，项目集看收益，组合看投资回报。
      三者混用是最常见的失分点。
    source: manual

  - id: RK-S8-023
    module_id: S8
    kp_id: KP-0801
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: medium
    level: 3
    title: 交付完成了但客户说没效果，该找哪一层
    body_md: |
      某项目经理按时按预算交付了系统，验收也通过了。但半年后客户说：
      「系统在用，可我们要解决的审批积压问题没改善。」

      这个问题该由哪一层回应，理由是什么？
    options:
      - 项目管理层，继续优化交付质量与性能
      - 项目组合层，要求追加预算重建
      - 项目集层——收益实现归它管，单个项目交付完成不等于收益达成
      - 不需要谁回应，这是客户的使用问题，与项目无关
    answer: "C"
    explanation_md: |
      **「交付完成但收益没实现」是项目集层的问题，不是项目层的问题。**

      分层看：
      - **项目层**的职责到「按基准交付、验收通过」为止，这一环它做到了。
      - **收益实现**需要多个条件同时成立：系统被使用、流程被改、岗位职责跟上、
        上下游数据打通。**这些条件没有一个在单个项目的控制范围内**，
        所以收益实现被划给项目集层（或更高）。

      逐项看：
      - **A 错**。优化性能和交付质量不会让「审批积压」改善——
        积压的原因很可能是流程没改、人手没调，不是系统慢。
      - **B 错**。追加预算重建是解决方案之一，但不是「该由哪一层回应」的答案。
      - **C 对**。项目集管理的存在意义就是盯着收益，协调各子项目的产出合成业务结果。
      - **D 错**。绩效域视角下项目要对结果负责，推给「使用问题」是这类题最典型的错误答法。

      **延伸一步（案例题加分）**：答完层级还应说清补法——
      补一个「收益实现计划」，明确收益指标、责任人和验证时点，
      并把流程改造写进项目范围。**光定指标不改流程，收益照样不会发生。**
    source: manual

  - id: RK-S8-024
    module_id: S8
    kp_id: KP-0802
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: easy
    level: 2
    title: OPM 三个层面各对谁负责
    body_md: |
      关于组织级项目管理（OPM）的三个层面，说法正确的是？
    options:
      - 项目组合管理关注单个项目的执行偏差
      - 项目集管理的成功判据是各子项目按时完成
      - 项目管理关注战略优先级排序
      - 项目组合管理按战略优先级配置资源，项目集管理关注收益实现，项目管理关注按基准交付
    answer: "D"
    explanation_md: |
      三个层面是一条递进的链，各有各的判据：

      | 层面 | 核心问题 | 成功判据 |
      | --- | --- | --- |
      | 项目组合管理 | 该做哪些事 | 投资回报与战略一致 |
      | 项目集管理 | 这组关联的事合起来能拿到什么 | 收益实现 |
      | 项目管理 | 这件事怎么干成 | 按基准交付 |

      逐项看：
      - **A 错**，执行偏差是**项目层**的事；组合层看的是整体投资回报，不是某个项目的偏差。
      - **B 错**，收益实现才是判据，子项目达标不等于收益达成。
      - **C 错**，优先级排序是**组合层**的职责，不是项目层。
      - **D 对**，三句话各自对应一层，一句不错位。

      **记忆方法**：把三个问题按顺序问一遍——
      「钱该投哪」→「合起来有没有用」→「怎么干成」。
      答不对的时候，回到这三问，看题目在问哪一个。
    source: manual

  - id: RK-S8-025
    module_id: S8
    kp_id: KP-0802
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: hard
    level: 4
    title: 成立哪种 PMO，代价是什么
    body_md: |
      某集团三个重点项目同时延期半年，集团决定成立 PMO **直接接管**这些项目，
      项目经理改向 PMO 汇报。

      这属于哪种类型的 PMO？它最可能带来的代价是什么？
    options:
      - 指令型；代价是职能经理被架空，资源协调反而更难，且 PMO 一旦自身能力不足会放大风险
      - 控制型；代价是流程增加，文档变多
      - 支持型；代价是缺乏约束力，项目照样各行其是
      - 指令型；没有代价，这是治理失控时的标准做法
    answer: "A"
    explanation_md: |
      **「直接接管、项目经理向 PMO 汇报」是指令型的定义特征。**
      支持型给模板，控制型查流程，只有指令型自己下场管项目。

      所以先排除 B 与 C。**真正的考点在剩下两个之间选：要不要承认代价。**

      - **A 对**。指令型确实能在失控时迅速收权，但代价是真实的：
        ① 职能经理失去对人员与资源的实际调配权，矩阵里的双线汇报变成空转，
        资源反而更难调；② PMO 自己成了执行主体，它一旦判断失误，
        错的是所有项目而不只是一个——**风险从分散变成集中**。
      - **D 错**。任何组织措施都有代价，答「没有代价」在案例题里几乎必然扣分。

      **这题的答题范式值得记住**：题目问「是什么类型 + 带来的问题」时，
      答案必须包含「它在什么条件下是对的，在什么条件下会反噬」。
      只说好不说代价，是初级答法。

      **补充一句可用于案例的**：指令型适合**短期危机收口**，
      不适合长期运行——收口之后应退回控制型，把项目管理权还给项目经理。
    source: manual

  - id: RK-S8-026
    module_id: S8
    kp_id: KP-0803
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: easy
    level: 1
    title: 哪个绩效域管「用数据判断进展」
    body_md: |
      「用数据判断项目进展、识别偏差并采取行动」描述的是哪个绩效域？
    options:
      - 交付
      - 规划
      - 测量
      - 不确定性
    answer: "C"
    explanation_md: |
      **八个绩效域各自回答一个结果状态**，这一题问的是「测量」。

      - **测量**：用数据判断进展与偏差。关键词是**数据、指标、偏差、评估**。
        注意它不等于「做报表」——绩效域视角要求「测量的结果真的被用来决策」，
        量了不看等于没测。
      - **交付**：交付物被验收并产生预期价值。关注的是**东西交出去且有用**。
      - **规划**：计划协调一致、可执行、能调整。关注的是**计划的质地**。
      - **不确定性**：风险与模糊性被主动应对。关注的是**对未知的处理**。

      **四个选项的区别可以用一句话切开**：
      交付问「交出去了吗」，规划问「计划靠谱吗」，测量问「数据说话了吗」，
      不确定性问「意外来了扛得住吗」。

      **常见混淆是「测量」与「交付」**：验收通过属于交付，
      验收之后统计使用率、对比目标值属于测量。**同一个项目里两者都有，看动作。**
    source: manual

  - id: RK-S8-027
    module_id: S8
    kp_id: KP-0803
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: medium
    level: 3
    title: 外部依赖延期后调整迭代顺序
    body_md: |
      项目组发现某个外部依赖的系统接口要延期两个月，于是当天调整了迭代顺序，
      先交付不依赖该接口的模块，把受影响的模块往后挪。

      这个做法主要体现哪个绩效域？
    options:
      - 团队
      - 干系人
      - 开发方法与生命周期
      - 不确定性
    answer: "D"
    explanation_md: |
      **绩效域的判断方法：先看动作产生了什么结果，再归到结果类型。**

      这个动作的结果是：**一个外部不确定性（接口延期）被识别并被主动应对了**，
      而且应对方式不是硬等，是调整交付顺序。这正是「不确定性」绩效域要做的事。

      - **D 不确定性 对**。它的内涵不只是「登记风险」，还包括对模糊与变化的
        主动应对——包括调整顺序、留缓冲、做备选方案。
      - **A 团队 错**。团队绩效域看的是共同目标、协作、能力成长，
        题目里没有任何关于人的线索。
      - **B 干系人 错**。外部系统是别的团队在交付，看起来像干系人问题，
        但题目描述的动作是**我方调整计划**，不是去争取对方。
        如果写的是「与对方协商要到了接口排期承诺」，那才是干系人。
      - **C 开发方法与生命周期 错**。这是最像的一个干扰项：调整迭代顺序确实是
        敏捷/迭代方法里的常规动作。但**绩效域看的是「为什么调」**——
        因为外部变化而调，落点是不确定性；因为业务优先级变化而调，才是方法与生命周期。

      **判据一句话**：同样的动作可能落在不同绩效域，区别在**动因**。
      答题时把动因写出来，理由就站得住。
    source: manual

  - id: RK-S8-028
    module_id: S8
    kp_id: KP-0804
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: medium
    level: 3
    title: 与被审计部门核对问题属于哪个阶段
    body_md: |
      审计组已完成访谈与配置检查，整理出 5 条问题，正在与被审计部门逐条核对事实。

      这属于 IT 审计的哪个阶段？
    options:
      - 审计准备
      - 审计报告
      - 审计实施
      - 后续审计
    answer: "C"
    explanation_md: |
      **四阶段：审计准备 → 审计实施 → 审计报告 → 后续审计**

      这题的关键在于「核对事实」这个动作的性质：**它是在确认证据是否成立，
      还没到出结论**。所以属于**审计实施**。

      - **审计准备**：定范围、组队、了解对象、定方案。**还没开始取证**。
      - **审计实施 对**：收集证据（访谈、检查、测试、观察、穿行测试）、
        形成审计发现、**与被审计方核对事实**。
        核对事实属于取证的一部分——避免拿错数据得出错结论。
      - **审计报告**：出具审计意见书、提出整改建议。这一步是**下结论**，
        不是核对事实。
      - **后续审计**：跟踪整改落实。

      **这两个阶段最容易混**，判据是：
      **还在问「事实是什么」→ 实施；已经在说「这属于什么问题、该怎么改」→ 报告。**

      **为什么核对事实必须放在实施阶段**：审计结论要经得起被审计方质证，
      事实没核对就写进报告，一旦被推翻，整份报告的可信度都会受影响。
      这一条在案例题里答「审计质量靠什么保证」时很好用。
    source: manual

  - id: RK-S8-029
    module_id: S8
    kp_id: KP-0804
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: hard
    level: 4
    title: 每次都能两小时恢复，三个月出了九次
    body_md: |
      某医院信息系统频繁故障。IT 部门每次都能在 2 小时内恢复，用户对此评价还不错。
      但同一类故障三个月内出现了 9 次。

      最该补的是什么？
    options:
      - 问题管理——只处理了事件没消除根因，故障会一直反复
      - IT 治理——应先成立 IT 治理委员会
      - 事件管理——2 小时恢复还不够快，应压缩到 30 分钟
      - 变更管理——应禁止所有变更以杜绝故障
    answer: "A"
    explanation_md: |
      **这是事件管理与问题管理的经典分界题。**

      两个概念的区别：
      - **事件**：已经发生的故障。目标是在**尽量短的时间内恢复服务**，允许用临时方案顶住。
      - **问题**：故障背后的**根因**。目标是**彻底消除**，方法通常是改配置、改流程、改设计。

      题干里「每次 2 小时恢复、用户评价还不错」说明**事件管理是有效的**——
      恢复够快，业务能接受。但**同一类故障 9 次**说明：
      **从来没有人去查「为什么会这样」，也就没有改任何东西。**

      逐项看：
      - **A 对**。这正是「只做事件、不做问题」的典型症状。
      - **B 错**。治理层面没有问题——有明确的服务目标、有人负责、恢复达标。
        往治理上答，是把管理缺失说成治理缺失。
      - **C 错**。把 2 小时压到 30 分钟只是让事件处理更快，
        第 10 次、第 11 次故障照样来。**优化的是症状，不是病因。**
      - **D 错**。禁止所有变更会让系统无法演进，而且变更不是唯一根因。

      **这一题的价值在判据**：**恢复快 ≠ 管得好。**
      衡量 IT 服务不能只看可用性与恢复时长，还要看**重复故障率**——
      后者才反映问题管理有没有真的做。
    source: manual

  - id: RK-S8-030
    module_id: S8
    kp_id: KP-0805
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: easy
    level: 1
    title: NPV 与 IRR 的关系
    body_md: |
      关于净现值（NPV）与内部收益率（IRR），说法正确的是？
    options:
      - IRR 大于 0 就说明项目可行
      - NPV 越大的方案，IRR 一定越高
      - IRR 是使 NPV 等于 0 的折现率，判断标准是与基准收益率比较
      - 这两个指标在任何情况下都可以互相替代
    answer: "C"
    explanation_md: |
      **两个指标的定义与判据：**

      | 指标 | 定义 | 可行判据 |
      | --- | --- | --- |
      | NPV | Σ[CFt ÷ (1+i)^t] − 初始投资 | **NPV > 0** |
      | IRR | 使 NPV = 0 的那个折现率 | **IRR > 基准收益率** |

      逐项看：
      - **A 错**。IRR 大于 0 没有意义——几乎所有正收益项目的 IRR 都大于 0。
        判据是**与基准收益率比较**（基准收益率反映资金的机会成本），不是与 0 比较。
      - **B 错**。NPV 是绝对额，IRR 是速率。**一个大投资、低回报率的项目，
        NPV 可能很大而 IRR 很低。** 两者不必同向。
      - **C 对**。
      - **D 错**。互斥方案比选时**以 NPV 为准**——NPV 直接对应价值增量，
        IRR 不考虑规模。IRR 高的方案往往投资小，赚的绝对额反而不如 NPV 大的方案。

      **判据一句话**：NPV 答「赚多少」，IRR 答「赚得多快」。
      要钱就用 NPV，要效率才看 IRR。
    source: manual

  - id: RK-S8-031
    module_id: S8
    kp_id: KP-0805
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: hard
    level: 4
    title: 已投入五百万，还要不要继续
    body_md: |
      某项目已投入 500 万元（无法收回）。现在面临继续还是停止的决策：

      - 继续：需**再投 300 万元**，未来净现金流折现后为 **350 万元**
      - 停止：不再投入，也不产生任何未来现金流

      按决策原则，该不该继续？
    options:
      - 不该，因为一共投入 800 万元只换回 350 万元
      - 不该，因为已经亏了 500 万元，不能越陷越深
      - 该继续，因为 350 > 300，追加投资本身净赚 50 万元
      - 该继续，因为不继续那 500 万元就白投了
    answer: "C"
    explanation_md: |
      **决策只看未来增量，不看历史投入——这就是「沉没成本不参与决策」。**

      把两个选择的**未来**摊开比：

      | 选择 | 未来还需投入 | 未来可收回 | 未来净额 |
      | --- | --- | --- | --- |
      | 继续 | 300 万 | 350 万 | **+50 万** |
      | 停止 | 0 | 0 | 0 |

      继续的未来净额是 +50 万，停止是 0，所以**该继续**，选 C。

      **逐项看错在哪：**
      - **A 错**。把已投入的 500 万算进了比较。那 500 万**无论继续还是停止都收不回**，
        它不随选择变化，因此不该出现在决策里。
      - **B 错**。这是最符合直觉、也是错得最彻底的答法——「已经亏了就别再投」
        看着像止损，实际是**再放弃 50 万的增量**。
      - **D 错**。结论对，理由错。「不继续就白投了」正是沉没成本谬误的表述，
        按理由给分的题会判错。**理由必须是「350 > 300」**。
      - **C 对**，理由成立。

      **判据一句话**：把「已投入」从纸面上划掉，只比两个选择的未来。
      题目里故意给「已投入 500 万」「无法收回」这些细节，就是来考这一条的。

      **注意 A 与 C 的差别**：如果题目问的是「这个项目整体赚不赚钱」，
      答案是亏 450 万（350 − 800）；但问的是「现在该不该继续」，
      答案是继续。**同一个项目，两个问题的答案相反——看清问的是哪一个。**
    source: manual

  - id: RK-S8-032
    module_id: S8
    kp_id: KP-0805
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: easy
    level: 2
    title: 资源约束下求最大利润，属于哪类方法
    body_md: |
      某厂要在**设备工时**和**原料供应**两个约束下，决定 A、B 两种产品各生产多少，
      使总利润最大。

      这属于哪类问题？该用哪类方法？
    options:
      - 资源约束下的最优配置，用线性规划
      - 排队等待问题，用排队论
      - 多阶段依次决策问题，用动态规划
      - 双方策略对抗问题，用博弈论
    answer: "A"
    explanation_md: |
      **运筹学这类题的解法是记「问题形态 → 方法」的对应表：**

      | 问题形态 | 方法 |
      | --- | --- |
      | 资源有限、要让目标最大或最小 | **线性规划** |
      | 多阶段依次决策 | 动态规划 |
      | 排队等待、定服务能力 | 排队论 |
      | 双方策略互相影响 | 博弈论 |
      | 最短路径、最小生成树 | 图论 |

      题干的关键词是「**约束**」和「**使……最大**」——这是线性规划的标准形态：
      一组线性约束 + 一个线性目标函数。

      逐项看：
      - **B 错**，排队论解决的是「几个窗口/几台服务器够用」这类等待问题，
        没有排队就没有它。
      - **C 错**，动态规划的前提是**分阶段**决策，本题是一次性定产量。
      - **D 错**，博弈论的前提是**有对手**，本题对手只有资源约束，不是对抗。

      **考试时注意到什么程度就够**：案例里出现线性规划，通常只要求列约束与目标函数，
      不要求求解。**把「要最大化什么」写一行、「每个约束」写一行，分就拿到了。**

      **判据一句话**：看到「约束 + 最优」直接选线性规划，这是最稳的一条。
    source: manual

  - id: RK-S8-033
    module_id: S8
    kp_id: KP-0806
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: medium
    level: 3
    title: 把四十份周报编成统一汇编
    body_md: |
      某公司把分散在各项目组的 40 份周报，按知识领域重新归类、编号，
      编成《公司项目管理实践汇编》并发布统一版本。

      按 SECI 模型，这主要属于哪一步？
    options:
      - 社会化
      - 外化
      - 内化
      - 组合化
    answer: "D"
    explanation_md: |
      **SECI 四步的关键区别在「知识形态怎么变」：**

      - **社会化**：隐性 → 隐性。靠**当面**传递（带人、跟岗、复盘会）。
      - **外化**：隐性 → 显性。把经验**写下来**，变成文档。
      - **组合化**：显性 → 显性。把**零散的文档整理成体系**。
      - **内化**：显性 → 隐性。别人**学完变成自己的能力**。

      本题的动作是「把已有的 40 份周报归类、编号、编成汇编」——
      **输入已经是文档，输出也是文档，只是从零散变成成套**。这是**组合化**。

      逐项看：
      - **A 错**。全程没有人对人传递。
      - **B 错**。这是最像的干扰项：编汇编看起来像「把东西写下来」。
        但**外化的输入是人心里的经验**，本题的输入是**已经存在的周报**——
        写作那一步之前已经有人做过了。
      - **C 错**。没有人学完去实践。
      - **D 对**。

      **判据一句话**：看**输入是什么形态**——
      输入是人的经验 → 外化；输入是已有的文档 → 组合化。

      **顺带记一个组织常见问题**：很多公司只做组合化（建知识库、编汇编），
      不做外化（没人写经验）。结果是库很整齐，里面全是会议纪要和周报，
      **关键的经验一条都没有**——因为经验还在人身上。
    source: manual

  - id: RK-S8-034
    module_id: S8
    kp_id: KP-0806
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: hard
    level: 4
    title: 要人要不来，成员考核不在我手里
    body_md: |
      某公司项目经理反映：「要人要不来，项目成员的考核不在我手里，
      只能靠私下协调推动。」

      按组织架构看，这最可能是什么结构？该怎么改善？
    options:
      - 项目型；应减少项目经理的行政负担
      - 强矩阵；应削弱职能经理对资源的控制
      - 弱矩阵或职能型——项目经理没有考核权与资源调配权，应在制度上明确授权边界
      - 平衡矩阵；这是正常现象，不需要改善
    answer: "C"
    explanation_md: |
      **判断组织架构的核心线索是「谁考核项目成员」。**

      | 架构 | 项目经理角色 | 权限来源 |
      | --- | --- | --- |
      | 职能型 | 协调员 | 靠沟通，无正式授权 |
      | 弱矩阵 | 协调员 | 制度给的一点授权 |
      | 平衡矩阵 | 有明确职责，与职能经理分权 | 制度规定 |
      | 强矩阵 | 真正的管理者 | 制度授予考核权 |
      | 项目型 | 管理者，成员向项目汇报 | 直接管人管钱 |

      题干三个症状——「要人要不来」「考核不在我手里」「只能私下协调」——
      全部指向**项目经理没有制度性权力**，典型是**职能型或弱矩阵**。

      逐项看：
      - **A 错**。项目型里项目经理直接管人，不会出现「要不来人」。
      - **B 错**。强矩阵里项目经理有考核权，症状相反。
      - **C 对**。
      - **D 错**。平衡矩阵里项目经理已有明确职责与部分考核参与权，
        题干说的「完全没有」比平衡矩阵更弱。

      **改善要说成制度，不能说成态度**：
      ① 明确项目经理在项目期内对成员的**绩效评价权重**（比如占 30%）；
      ② 资源调配走**统一的资源池与优先级机制**，而不是项目经理自己去求人；
      ③ 项目成员的**双线汇报规则**写清楚——哪些事听项目经理、哪些听职能经理。

      **判据一句话**：症状是「推不动」，根子是「没有权」，
      解法只能是「改制度授权」，不是「加强沟通协调」。
    source: manual

  - id: RK-S8-035
    module_id: S8
    kp_id: KP-0807
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: medium
    level: 3
    title: 不想管服务器只想部署应用，选哪一层
    body_md: |
      某创业公司不想维护服务器和操作系统，只想把写好的应用部署上去、按用量付费。

      它应该选择哪一层云服务？
    options:
      - PaaS——不用管服务器与操作系统，只负责自己的应用
      - IaaS——自己装操作系统与中间件，控制力最强
      - SaaS——直接用现成软件，不需要开发
      - 私有云——数据在自己机房里更安全
    answer: "A"
    explanation_md: |
      **云三层看的是「服务边界停在哪」：**

      | 层 | 提供什么 | 用户负责什么 |
      | --- | --- | --- |
      | IaaS | 虚拟机、存储、网络 | 操作系统、中间件、应用全都要自己管 |
      | PaaS | 运行环境与平台服务 | **只管自己的应用** |
      | SaaS | 可直接使用的软件 | 只管用，不管开发与运维 |

      题干的关键句是「**不想管服务器和操作系统，只想部署应用**」——
      边界正好卡在「应用」这一层，所以是 **PaaS**。

      逐项看：
      - **B 错**。IaaS 恰恰要用户自己管操作系统和中间件，与题干诉求相反。
      - **C 错**。SaaS 是「用别人的软件」，题干说的「把写好的应用部署上去」，
        说明自己有应用要跑。
      - **D 错**。私有云回答的是「部署在哪里」（谁的机房），
        不回答「管到哪一层」。**这是两个不同维度**，题干问的是后者。

      **判据一句话**：问「我能管到哪一层」→ 云三层；
      问「放在谁的机房」→ 公有云/私有云/混合云。**两个维度别混。**
    source: manual

  - id: RK-S8-036
    module_id: S8
    kp_id: KP-0807
    category: 高项·S8 高项新增考点
    type: 单选
    difficulty: hard
    level: 4
    title: 上链能不能解决检验结果互认
    body_md: |
      某市希望解决「各医院检验结果互不承认、患者重复检查」的问题，
      有厂商建议「把检验结果全部上链」。

      单纯上链能解决这个问题吗？
    options:
      - 能，上链后数据不可篡改，医院之间自然就敢互认了
      - 不能，应该改用大数据平台统一存储，集中管理才好办
      - 不能，须先统一检验项目的编码与质控标准，区块链只解决信任与存证，不解决数据标准
      - 不能，因为区块链的性能不足以承载这么多数据
    answer: "C"
    explanation_md: |
      **这题考的是技术的边界，不是技术的能力。**

      互认难的真实原因有三层，逐层看：
      1. **信任层**：医院担心对方数据被动过、出问题担责 → **区块链能解决**（不可篡改、可追溯）
      2. **标准层**：各医院的检验项目编码不同、单位不同、参考区间不同，
         「同一项检查」在对家系统里可能根本对不上 → **区块链解决不了**
      3. **责任层**：互认之后出了误诊谁负责 → 靠制度与协议，技术解决不了

      所以答案是「不能」——**但理由必须是标准层**。

      逐项看：
      - **A 错**。只看到信任层。数据没对齐，链上存得再牢也是两份对不上的东西。
      - **B 错**。换成集中存储只是换了存放地点，**标准不统一的问题一点没变**。
        而且集中存储会引出新的信任与责任问题。
      - **C 对**。指出了真正的卡点，也说清了区块链的能力边界。
      - **D 错**。性能是可以工程解决的问题（联盟链、分层、摘要上链），
        不是这件事的根因。**用「性能不足」否掉一个技术方案，通常是想当然。**

      **这一题的答法可以直接迁移到所有「新技术能不能解决 X」的题**：
      先问 X 的卡点在哪一层（信任？标准？流程？责任？），
      再看这个技术落在哪一层。**两层对不上，就是不能。**

      顺带记一句边界表述：**区块链解决信任与存证，不解决数据质量与标准；
      数据标准要靠数据治理，两者不能互相替代。**
    source: manual
