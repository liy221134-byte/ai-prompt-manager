modules:
  - id: S1
    order: 1
    name: 项目管理框架
    scope_chapters: [9]
    weight: 0.30
    expected_gap: 2
    planned_hours: 90
    entry_criteria: 能说出项目与运营的区别；知道项目管理管的是"临时性 + 独特性"这件事
    exit_criteria: 不看资料说清五大过程组各自产出什么；拿到任一知识点能归到某个知识领域
    common_mistakes:
      - 把五大过程组当成时间先后顺序，实际是逻辑分组，可交叠
      - 把十大知识领域和阶段搞混
    min_project: 用自己做过的可信数据空间项目，画出它的五大过程组映射，并标出哪个过程组做得最弱

  - id: S2
    order: 3
    name: 五大过程组实操
    scope_chapters: [10, 11, 12, 13, 14]
    weight: 0.20
    expected_gap: 3
    planned_hours: 100
    entry_criteria: 不看资料说出五大过程组各自产出什么；拿任一知识点能归到某个知识领域
    exit_criteria: 给一个场景能判断落在哪个过程组；能独立算完一道挣值分析题；能写出变更管理完整流程
    common_mistakes:
      - 挣值公式记混（SV 对应进度、CV 对应成本）
      - 把"质量保证"（执行）和"质量控制"（监控）放错过程组
      - 变更控制流程漏掉 CCB 审批环节
    min_project: 把自己项目里一次真实的变更，按标准变更流程重写一遍

  - id: S3
    order: 2
    name: 信息技术基础
    scope_chapters: [1, 2, 3, 4, 5, 6, 7, 8]
    weight: 0.28
    expected_gap: 3
    planned_hours: 90
    entry_criteria: 无。诊断显示已有实战接触（云、等保、数据治理），不是零基础，从概念校准开始
    exit_criteria: 能用一句话解释云计算三层服务模型的区别；能说清等保分几级、每级管什么；能给一个业务场景选出合适的集成技术
    common_mistakes:
      - IaaS/PaaS/SaaS 边界记混（记住：谁管操作系统）
      - 把数据治理和数据管理当成同义词
      - 等保级别与业务重要性对应关系记错
    min_project: 用自己项目的沙箱平台，画出它涉及的技术栈，标注每一项对应教材哪一章
    note: 实测客观题 6/9、L4 场景题全对 ⇒ 原有「零基础」判断作废，工时从 130 减到 90。这一块靠日常项目已在接触，缺的是标准表述，不是理解

  - id: S4
    order: 5
    name: 组织保障与监理
    scope_chapters: [15, 16]
    weight: 0.07
    expected_gap: 3
    planned_hours: 25
    entry_criteria: 能独立算完一道挣值分析题；写得出变更管理的完整流程（含 CCB 审批）
    exit_criteria: 说清 PMO 三种类型区别；说清监理「四控两管一协调」具体指什么
    common_mistakes:
      - 把监理和项目管理混为一谈（监理是第三方）
      - PMO 类型记混（支持型/控制型/指令型）
    min_project: 用自己的项目说清：谁是建设方、谁是承建方、有没有第三方监理

  - id: S5
    order: 4
    name: 法规与职业道德
    scope_chapters: [17, 18]
    weight: 0.10
    expected_gap: 4
    planned_hours: 45
    entry_criteria: 无
    exit_criteria: 能判断一个采购场景适用招标投标法还是政府采购法；说清数据安全法对数据流通项目的约束
    common_mistakes:
      - 招标公告 / 投标文件 / 中标通知书三者的法律性质搞混
      - 混淆《网络安全法》与《数据安全法》的管辖范围
    min_project: 用自己的项目写一段合规说明：这个数据流通场景受哪几部法规约束

  - id: S6
    order: 6
    name: 应试专项
    scope_chapters: []
    weight: 0.05
    expected_gap: 4
    planned_hours: 30
    entry_criteria: 能独立算完挣值题；能说清等保分级与云计算三层服务模型的区别
    exit_criteria: 机考模拟两套卷均在 45 分以上；计算题单题耗时 ≤15 分钟
    common_mistakes:
      - 案例题只写结论不写过程（计算题给分看点）
      - 英文题直接放弃（5 分也是分）
    min_project: 完整做一套机考模拟，记录每部分耗时

