# ── 知识点树 ─────────────────────────────────────────────
# 题目挂 kp_id，kp 挂 module_id；parent 支持层级，用于根因归因（错题向上归因）
#
knowledge_points:
  # S1 的五个知识点带讲义（note），所以从 flow style 改成 block style ——
  # 单行 {...} 里塞不下多行正文。其余模块仍是 flow style，两种写法 js-yaml 一视同仁。
  - id: KP-0101
    module_id: S1
    parent: null
    name: 项目与项目管理的基本概念
    ref: "第9章"
    note:
      summary: 项目是为创造独特产物而做的临时性工作，管的是「一次做成」，与重复性的运营相对。
      body: |
        ### 要素

        **项目三个特征**，判别一个事是不是项目只看这三条：
        - 临时性：有明确起点和终点，做完就结束，不是长期存在
        - 独特性：产出是以前没做过的，哪怕类似也不完全相同
        - 渐进明细：一开始只有大方向，细节随推进逐步清晰

        任一条件不满足，它就不是项目。最常见的误判是「长期重复」——每月出报表、每年做审计，都是运营。

        **项目与运营的区别**，考试问到时按三条答：
        | 比较项 | 项目 | 运营 |
        | --- | --- | --- |
        | 目的 | 创造新东西，改变现状 | 维持业务正常转 |
        | 特性 | 临时、独特 | 持续、重复 |
        | 结束 | 有明确终点，交付即结束 | 没有终点，是持续过程 |

        **项目管理的三重约束**：范围、进度、成本。三者联动，任何一方变动另两方必受影响（这就是为什么要走变更流程，见 S2）。

        现代口径在铁三角之外补两个：质量与相关方满意。教材里把它表述为「项目成功不仅要按期按预算交付，还要让相关方满意」。

        **项目管理**的定义：把知识、技能、工具与技术应用于项目活动，以满足项目的要求。注意落脚点是「满足要求」，不是「管住人」。

        ### 例题

        某市政务云平台建设项目，合同工期 18 个月，为全市 40 个委办局搭建统一数据交换环境。以下判断正确的是：

        A. 该项目属于运营，因为它要长期对外提供服务
        B. 该项目属于项目，因为建设期有明确终点、产出是一次性的
        C. 该项目既有项目属性又有运营属性，无法归类
        D. 该项目是项目还是运营，取决于投资规模

        **答案 B。** 判别依据是「建设这件事」而不是「建成后怎么用」。建设期 18 个月有终点（临时性），40 个委办局的交换环境是第一次建（独特性），所以它是项目。建成后的运维才是运营。

        C 看起来像个"聪明"的选项，但教材不给「两者兼有」这种归类——一个事要么是项目要么是运营，判别标准只看当前做的这件事。这是最常见的失分点：被"长期提供服务"这个描述带偏。

        ### 怎么考

        **单选题**最爱考「下列属于项目的是 / 不属于项目的是」。判别只用三条：临时、独特、渐进明细。凡出现「每月」「每年」「日常」「例行」「持续」，一律运营。

        **判断题**爱考两句：
        - 「项目管理就是管好进度和成本」——错，范围、质量、相关方也在里面
        - 「项目结束的标志是产品交付」——不完整，还要完成验收、移交、归档、经验教训总结（收尾过程组）

        **下午卷简答题**问「项目与运营的区别」，标准答法是上面那张表的三行。不要写「项目更重要」这类评价语，阅卷看点只认区别本身。

        **一层容易漏的**：渐进明细常被忽略。它意味着「一开始说不清全部需求」是正常的，不是项目经理失职——这一点在案例题里用来解释「为什么需求变更频繁」。

  - id: KP-0102
    module_id: S1
    parent: null
    name: 五大过程组
    ref: "第9章"
    note:
      summary: 五大过程组是按「做什么类型的事」做的逻辑分组，不是时间先后顺序，同一时间可以并行。
      body: |
        ### 要素

        五个过程组，以及各自的核心动作与产出：

        | 过程组 | 干的事 | 典型产出 |
        | --- | --- | --- |
        | 启动 | 定义一个项目或阶段，授权它开始 | 项目章程、识别相关方 |
        | 规划 | 定目标、定路线、定怎么做 | 各专项管理计划、基准 |
        | 执行 | 照计划干活，把资源变成成果 | 可交付成果、工作绩效数据 |
        | 监控 | 跟踪进展、比对计划、纠偏 | 变更请求、工作绩效报告 |
        | 收尾 | 正式结束项目或阶段 | 验收移交、归档、经验教训 |

        **最重要的一句**：过程组是逻辑分组，不是阶段。它们可以交叠、可以反复：
        - 规划不是「只在开头做一次」——每到一个新阶段要重新规划
        - 执行和监控同时进行——一边干一边看
        - 收尾在一个阶段结束时也要做，不必等整个项目完

        把它当阶段背，就会答错「以下属于监控过程组的是」这类题：节点不在时间轴上，在动作性质上。

        **监控的两个动作要分清**：监控项目工作（整体看进展，确认是否偏离）与实施整体变更控制（有人提变更时，走流程决定批不批）。后者属于监控过程组，很多人误答成执行。

        **执行与监控里最易混的一对**：
        - 质量保证 → 执行（保证过程对）
        - 质量控制 → 监控（检查结果对不对）

        记忆法：保证是「做事时保证」，控制是「做完后检查」。前者在执行中发生，后者在监控中发生。

        ### 例题

        项目经理正在组织团队编写用户操作手册，同时安排专人核对已完工程的验收报告。这两个活动分别属于：

        A. 都是执行过程组
        B. 编写手册属执行，核对验收报告属监控
        C. 编写手册属规划，核对验收报告属收尾
        D. 都是监控过程组

        **答案 B。** 抓动词：「编写」是产出可交付成果 → 执行；「核对」是比对与审查 → 监控。

        C 的陷阱在「验收报告」。看到「验收」就想到收尾是常见误判——收尾是正式验收移交整个项目或阶段，而「核对一份已完工程的验收报告」是过程中的检查动作，属监控（控制质量／确认范围）。判据是：这一动作是在**产生**成果，还是在**检查**成果。

        ### 怎么考

        **单选题**最高频的形态是「以下活动属于哪个过程组」。判据抓动词，五组各一组词：
        - 启动：授权、批准、发起、识别相关方
        - 规划：制定、编制、规划、估算、定义
        - 执行：实施、指导、管理、产出、组建、建设
        - 监控：监督、控制、核实、审查、比对、变更控制
        - 收尾：正式结束、移交、归档、总结

        注意「实施」两个字有坑：「实施整体变更控制」含「实施」但属监控，因为它的实质是审批。这类只能靠记住名单，不能靠猜动词。

        **判断题**常考「五大过程组必须按顺序依次进行」——错。以及「项目开始时五个过程组各执行一次就够」——错，每个阶段都会重走。

        **案例题**爱问「这个项目缺了哪个过程组的工作」，要能给证据。答法：「缺少收尾过程组的工作，表现为项目交付后未做验收归档与经验教训总结，导致同类问题在二期重复出现」。只说「缺收尾」不给证据不给分。

  - id: KP-0103
    module_id: S1
    parent: null
    name: 十大知识领域
    ref: "第9章"
    note:
      summary: 十知识领域是按「管什么」划分的十个专业方向，每个方向横跨多个过程组，与过程组构成二维矩阵。
      body: |
        ### 要素

        十个知识领域（第 6 版口径，中项教材按此讲）：

        1. 整合管理 — 统领其余九个，唯一横跨全部五个过程组
        2. 范围管理 — 做什么、不做什么
        3. 进度管理 — 什么时候做完
        4. 成本管理 — 花多少钱
        5. 质量管理 — 做到什么程度算合格
        6. 资源管理 — 谁来做、用什么做
        7. 沟通管理 — 信息怎么对齐
        8. 风险管理 — 可能出什么岔子
        9. 采购管理 — 哪些从外面买
        10. 相关方管理 — 谁在意这个项目

        **记忆法**：先记「整合」是横着的那条线，其余九个对应「要管的一件具体东西」——范围、时间、钱、质量、人、信息、风险、外部、相关方。九个各自是一个维度，不需要背顺序，需要能「看到一件事就归到某个维度」。

        **三个容易混的边界**：
        - **资源 vs 采购**：团队自己人属资源；从外部买来的（货物、服务、外包）属采购
        - **沟通 vs 相关方**：相关方是「对象」，沟通是「对对象做的事」。识别相关方属相关方管理，制定沟通计划属沟通管理
        - **质量 vs 范围**：范围问「做没做全」，质量问「做得好不好」。少做一个功能是范围问题，功能能跑但天天崩是质量问题

        **整合管理为什么独一份**：范围、进度、成本三个计划各自最优，合起来未必最优——取舍只能由整合管理来做。制定项目管理计划、实施整体变更控制、结束项目或阶段，这三个核心过程都在整合管理里。

        这也解释了案例题里一个高频问法：「各专业计划都做了，项目还是失控」——答「缺整合，各计划之间没有对齐，没有统一基准」。

        ### 例题

        项目经理正在做以下四件事：①编制 WBS ②估算各活动所需工时 ③制定风险管理计划 ④确定项目需要采购哪些外部服务。它们分别属于：

        A. 范围、进度、风险、采购
        B. 范围、成本、风险、采购
        C. 整合、进度、质量、采购
        D. 范围、进度、风险、资源

        **答案 A。** ①WBS 是范围管理的核心工具；②「估算活动所需工时」是进度管理的活动持续时间估算（估**工时/工期**属进度，估**钱**才属成本）；③明写风险；④明写采购。

        B 是最容易选的错项：看到「估算」就归成本。判据是估算对象——`估算活动持续时间` → 进度；`估算成本` → 成本。这两个过程名只差几个字，考题就爱在这里做文章。

        ### 怎么考

        **单选题**形态稳定：给活动问知识领域。这类题没有推理空间，只能靠「动词 + 对象」的配对记忆。给几个高频配对：
        - 出现 WBS、范围基准、确认范围、控制范围 → 范围
        - 出现活动、里程碑、关键路径、历时、进度压缩 → 进度
        - 出现 PV / EV / AC / 挣值 / 储备分析（成本）→ 成本
        - 出现质量审计、测试、因果图、控制图 → 质量
        - 出现 RACI、团队建设、冲突管理 → 资源

        **判断题**有两个固定错项：
        - 「十大知识领域就是项目的十个阶段」——错，领域是横向的，阶段是纵向的
        - 「整合管理只发生在启动阶段」——错，整合贯穿全程，这正是它特殊的地方

        **案例题**常问「这个项目在哪个知识领域管理薄弱」，要求从现象反推。典型对应：
        - 需求反复变、没有变更记录 → 范围管理
        - 反复延期、没有里程碑 → 进度管理
        - 超支但说不清花在哪 → 成本管理
        - 交付后被退回返工 → 质量管理
        - 关键人一走就停摆 → 资源管理
        - 各方理解不一致、会上才发现 → 沟通管理
        - 出了问题才说「没想到」 → 风险管理
        - 供应商交付不合格却已付款 → 采购管理

        这张反推表比分清十个名字有用得多——案例题给的都是现象，不是术语。

  - id: KP-0104
    module_id: S1
    parent: null
    name: 项目生命周期与组织结构
    ref: "第9章"
    note:
      summary: 生命周期把项目切成阶段，组织结构决定项目经理有多大实权，两者共同决定这个项目好不好管。
      body: |
        ### 要素

        **通用生命周期四阶段**（预测型）：启动 → 组织与准备 → 执行项目工作 → 结束项目。

        **生命周期的三条曲线**，考试直接用：

        | 维度 | 什么时候最高 | 说明 |
        | --- | --- | --- |
        | 成本与人力投入 | 执行阶段 | 干活的人最多、花钱最快 |
        | 风险与不确定性 | 启动阶段 | 越往后越清楚，风险越低 |
        | 变更的代价 | 启动时最低，越往后越高 | 改需求在开头很便宜，在收尾极贵 |

        这三条要合起来记一句话：**越早改越便宜，但越早越看不清**。所以变更管理要在早期多做评审，不是拖到后期救火。

        **开发方法的三种形态**：
        - 预测型（瀑布）：需求一开始就能定清，按阶段推进
        - 迭代型 / 增量型：分块交付，逐步完善
        - 适应型（敏捷）：需求高度不确定，短周期小步走

        选型判据是「需求确定性」，不是「项目大小」。

        **组织结构三类（加矩阵的强弱）**，判据只有一个：**项目经理对资源和预算有没有控制权**。

        | 结构 | PM 的角色 | 团队 | 预算权 |
        | --- | --- | --- | --- |
        | 职能型 | 协调员，无实权 | 兼职，分散在各职能 | 无 |
        | 弱矩阵 | 协调员，仍无实权 | 兼职 | 无或极弱 |
        | 平衡矩阵 | 项目经理，有部分权 | 部分专职 | 部分 |
        | 强矩阵 | 项目经理，有较大权 | 多为专职 | 有 |
        | 项目型 | 项目经理，完全权 | 全职集中 | 完全 |

        从职能型往项目型走，PM 的权力单调递增。考「哪种结构下 PM 权力最大」→ 项目型；「最容易资源冲突」→ 职能型和弱矩阵。

        ### 例题

        某公司项目经理小王负责一个数据中台项目。他需要的人由各技术部门经理指派，成员绩效考核由部门经理决定，项目预算也需部门审批。小王每周只能召集一次例会同步进度。这个组织属于：

        A. 项目型
        B. 强矩阵
        C. 弱矩阵
        D. 职能型

        **答案 C。** 三个信号都对上弱矩阵：人由部门指派（不专职）、考核权在部门（PM 无实权）、预算需部门批（无预算权）。

        D 与 C 的区分常被混淆：题干里明确出现了「项目经理」这个身份，说明已经有跨部门的项目角色（哪怕没实权），所以是弱矩阵而不是纯职能型。纯职能型的描述里通常连「项目经理」都不出现，只写「由某部门牵头」。这条区分点很细，但卷面上就是靠「有没有 PM 这个岗位」来分。

        ### 怎么考

        **单选题**给一段组织描述问类型。只抓三个信号，按顺序判：
        1. 团队成员是全职还是兼职 → 兼职多半在矩阵或职能
        2. 绩效考核权在谁手上 → 在部门经理 = 弱；在 PM = 强或项目型
        3. 预算谁批 → 部门批 = 弱；PM 批 = 强或项目型

        三个信号一致时直接定；不一致时按「权力最小的那一项」定，因为组织形态的约束性由最弱的环节体现。

        **判断题**高频两个：
        - 「项目生命周期中风险最高的阶段是执行阶段」——错，是启动阶段（越不确定越靠前）
        - 「变更在项目后期提出代价最小」——错，越往后越贵

        这两条几乎是轮流出现，因为它们反直觉：人的直觉是「越往后越熟练、改起来越容易」，实际是「越往后牵连的已完成工作和已签合同越多」。

        **案例题**会借组织结构出题：「项目经理反复协调不动资源，进度停滞，请分析原因并给对策」。标准答法两段：
        - 原因：组织为弱矩阵（或职能型），PM 无人事权与预算权，只有协调权
        - 对策：短期靠发起人升级、建立项目章程明确授权；长期建议转为强矩阵或设置专职 PM，把考核权与预算权一部分给项目

        只答「加强沟通」不得分——题目问的是结构性原因，沟通解决不了权力问题。

  - id: KP-0105
    module_id: S1
    parent: null
    name: 项目经理的角色与职责
    ref: "第9章"
    note:
      summary: 项目经理不自己干活，而是把事、人、信息三样在约束下调出结果；在矩阵环境里他常常没有直接人事权。
      body: |
        ### 要素

        **三重角色**：
        - 管理者：定计划、分资源、控进度
        - 领导者：给方向、带团队、解决冲突
        - 整合者：把各专业、各相关方的诉求拧成一个方案

        三者里「整合者」最容易被忽略，而它恰恰是 PM 不可替代的部分——各专业工程师都能把本专业做到最好，只有 PM 负责在它们之间做取舍。

        **五种权力来源**（法兰奇与雷文），判据是「服从是因为什么」：

        | 权力 | 服从的理由 | 典型表现 | 持久性 |
        | --- | --- | --- | --- |
        | 法定权 | 他是这个职位 | 「按制度该听他的」 | 中（离岗即失） |
        | 奖励权 | 跟着有好处 | 「干好了给奖金」 | 弱（无奖励即失） |
        | 惩罚权（强制权） | 怕被罚 | 「不干就扣绩效」 | 最弱（用多必反） |
        | 专家权 | 他真懂 | 「听他的不会错」 | 强 |
        | 参照权 | 认同这个人 | 「我愿意跟他干」 | 最强 |

        一句可用的结论：**专家权与参照权最持久，惩罚权最易失效**。案例题里凡是「PM 靠处罚推项目，团队离心」的题，答案方向都是「改用具专业判断与信任建立的方式」。

        **PMI 人才三角**（三种能力）：技术项目管理、领导力、战略与商业管理。中项考「项目经理最需要补哪一块」时，三种都可能，看题干缺什么。

        **职责清单**（答简答题时按序列）：
        1. 对项目目标负责（范围、进度、成本、质量）
        2. 组建团队并建设团队
        3. 识别与管理相关方期望
        4. 识别风险并制定应对
        5. 建立并维护沟通机制
        6. 推动变更走流程，而不是绕流程

        **两条容易答错的边界**：
        - PM 对项目**目标**负责，但项目成败还受组织环境、发起人支持、市场变化影响 —— 说「负全部责任」不准确
        - PM 与发起人的分工：发起人**授权并提供资源**（签章程、给预算、关键时刻升级），PM**执行并交付**

        ### 例题

        项目中期，团队两名核心成员因技术方案争执不下，进度受影响。项目经理老张把两人叫来，用自己十五年的架构经验当场判定了方案，并要求按此执行。此后两人不再争执，但遇到技术分歧都直接找老张，老张成了瓶颈，进度反而更慢。

        老张这次主要用了哪种权力？问题出在哪？

        A. 法定权；问题是他越权
        B. 专家权；问题是他没有培养团队的决策能力，形成单点依赖
        C. 惩罚权；问题是他态度强硬
        D. 参照权；问题是他过于受欢迎

        **答案 B。** 团队服从是因为「他真懂」（十五年架构经验），这是专家权。问题不在用错权力，而在**只用了这一种**：每次都由他判定，团队既没建立判断标准，也没获得授权，于是所有分歧都上浮到他这里。

        注意这题不是问「哪种权力最好」。专家权本身是持久的、正面的，问题在于把个人能力当成组织能力用，结果制造了瓶颈。这类题的正确选项往往带「而没有……」这层转折，只夸权力类型不指出副作用的选项，通常不是答案。

        ### 怎么考

        **单选题**给情境判权力类型，判据是「服从的理由」：
        - 因为职位/制度 → 法定权
        - 因为能带来好处 → 奖励权
        - 因为怕后果 → 惩罚权
        - 因为专业能力过硬 → 专家权
        - 因为认同、佩服这个人 → 参照权

        题干里出现「佩服」「愿意跟随」「人品」→ 参照权；出现「懂行」「经验丰富」「判断准确」→ 专家权。这两个最容易混，区别是：佩服他的**本事**是专家权，佩服他的**人**是参照权。

        **案例题**高频问法是「项目经理应该怎么做」。答题套路固定四步，不要答「加强沟通」「提高重视」这类空话：
        1. 先了解事实（分别沟通，搞清分歧点在哪）
        2. 再分析影响（对范围/进度/成本的影响有多大）
        3. 然后按规则处理（技术分歧找专家评审，需求变更走变更流程）
        4. 最后留痕与同步（记录结论，通知相关方）

        阅卷看的是这四步有没有走全，而不是结论多正确。

        **判断题**两个固定错项：
        - 「项目经理应该是团队里技术最强的人」——错，PM 的核心是整合与协调
        - 「项目经理对项目成败负全部责任」——不准确，PM 对目标负责，成败还受组织与发起人影响

  - id: KP-0201
    module_id: S2
    parent: null
    name: 启动过程组
    ref: "第10章"
    note:
      summary: 启动过程组只有两个过程——制定项目章程和识别相关方，作用是让项目正式立项、有人认账。
      body: |-
        ### 要素

        **启动过程组只有两个过程**，是五大组里最少的一组。少了反而不容易混，考试问「下列属于启动过程组的是」时，只要记住这两件事，干扰项一眼就能排除：

        - **制定项目章程**：由项目发起人签发，正式宣布项目存在，并授予项目经理动用组织资源的权力
        - **识别相关方**：找出所有受项目影响、或能影响项目的人与组织，产出相关方登记册

        **为什么章程必须由发起人签发**：章程是授权文件，授权者必须比被授权者层级高。项目经理自己写章程等于自己给自己授权，逻辑上不成立。项目经理可以**参与编写**（实际上常常是主要执笔人），但发布与批准权在发起人。

        **章程里必须有这几项**，问「章程应包含什么」按这个清单答：

        | 内容 | 作用 |
        | --- | --- |
        | 项目目的与可测量的目标 | 判断成败的依据 |
        | 高层级需求与项目边界 | 划清做什么、不做什么 |
        | 总体里程碑与总体预算 | 高层级的时间与钱 |
        | 审批要求与退出标准 | 谁批、什么情况可以停 |
        | 委派的项目经理及职责职权 | 授权凭据 |
        | 发起人姓名与职权 | 谁认账 |

        **章程与项目管理计划的区别**是关键对比。章程是**授权**，回答「准不准做、谁负责」；计划是**执行依据**，回答「怎么做、分几步、花多少」。章程由发起人批，计划由项目经理编、批准后执行。章程一旦批准，改动要走变更流程。

        **识别相关方为什么放在启动阶段**：越晚识别，返工代价越大。教材强调的是「尽早」加「持续」——相关方登记册在整个项目期间都在更新，不是一次性文档。登记册至少记三类：身份信息（姓名职务联系方式）、评估信息（期望、影响、态度）、分类信息（内外部、支持中立反对、权力与利益）。

        ### 例题

        某市政数据中心项目已获市发改委批复，公司任命老张为项目经理。老张上任后第一件事是召集技术骨干编写项目章程，写完后提交公司总经理批准。以下说法正确的是：

        A. 做法正确，项目经理本就该负责编写章程
        B. 做法错误，章程应由项目发起人发布，项目经理可参与编写但无权发布
        C. 做法正确，只要最终由总经理批准即可
        D. 做法错误，章程应由客户发布，公司无权批准

        **答案 B。** 错在把「发布者」和「执笔人」混成一件事。项目经理参与编写完全正常，但章程的发布主体必须是发起人。

        C 的迷惑性在于「有批准」看起来流程完整，但批准不等于发布——授权链的起点必须是那个为项目出资源、对结果认账的人。

        D 的干扰来自把「客户」等同于「发起人」。发起人可以是客户，也可以是本公司高层，看项目性质。判断题不能只看头衔，要看「谁出钱、谁认账」。

        ### 怎么考

        **单选题**两个高频点：「项目章程由谁发布」（发起人）、「项目经理何时被任命」（在章程中被授权，早于计划编制）。

        **判断题**常见两句：
        - 「项目经理应独自编写项目章程」——错，是参与编写
        - 「相关方登记册在启动时一次性完成」——错，要持续识别更新

        **案例题**常考「立项流程缺失」：项目没有章程就直接开工，后期无人对范围负责、资源调不动。标准答法三步：点出未制定章程导致缺乏正式授权，补识别相关方并建立登记册，再说明章程应包含目标、边界、里程碑、预算与项目经理授权。

        **一层容易漏的**：章程里的目标必须**可测量**。写「提升管理水平」不算目标；写「2027 年 6 月前完成 40 个委办局数据接入，接入率 100%」才是。问「项目目标存在什么问题」，答「目标不可测量、无法作为验收依据」是标准得分点。

  - id: KP-0202
    module_id: S2
    parent: null
    name: 规划过程组
    ref: "第11章"
    note:
      summary: 规划过程组是五大组里过程最多的一组，产出各专项计划与三大基准，原则是近细远粗、渐进明细。
      body: |-
        ### 要素

        **规划过程组在五大组里过程最多**，原因很直接：每个知识领域都要先做计划再干活，而知识领域有十个。所以「下列属于规划过程组的是」这种题，反而不该靠数字记，要靠「这件事是在定规矩还是在干活」来判断。

        **三大基准**是规划过程组最硬的产出，三者合起来构成**绩效测量基准**：

        | 基准 | 由什么构成 | 后面拿来比什么 |
        | --- | --- | --- |
        | 范围基准 | 范围说明书 + WBS + WBS 词典 | 判断「做没做完」 |
        | 进度基准 | 经批准的进度模型（含里程碑） | 判断「快还是慢」 |
        | 成本基准 | 经批准的分时段预算（不含管理储备） | 判断「超没超」 |

        **注意成本基准不含管理储备**，管理储备在成本基准之外，动用要高层批准——这是常考细节。

        **项目管理计划不是一份文件，是一套**：各专项子计划（范围、进度、成本、质量、资源、沟通、风险、采购、相关方参与）加三大基准，再加其他附件，整合成一份。整合的责任人是项目经理，不是各专业各自为政。

        **范围管理的前三步全在规划组**：收集需求 → 定义范围 → 创建 WBS。（第四步「控制范围」在监控组，这是常见归属陷阱。）

        **WBS 四条硬规矩**：
        - 面向**可交付成果**分解，不按部门或职能分解
        - **100% 规则**：子层全部工作相加必须等于父层，不多不少
        - 工作包粒度参考 **8 到 80 小时**，太粗无法估算，太细管理成本反超收益
        - 每个工作包有**唯一责任人**，WBS 词典补上验收标准、资源、成本、质量要求

        **进度计划的编制链条**：活动定义 → 排列活动顺序（四种依赖：完成到 Start、Start 到 Start、完成到完成、Start 到完成，最常用是完成到 Start）→ 估算活动资源 → 估算活动历时（三点估算最常考）→ 制定进度计划（关键路径法）。

        **滚动式规划**是这个组的灵魂：近期的工作分解到工作包级别，远期只分到规划包，随项目推进再细化。它解释了为什么「一开始计划不可能很细」不是失职，而是正确做法。

        ### 例题

        某系统集成项目 WBS 共分四层，第一层按项目阶段分为「需求、设计、开发、测试、上线」五项，第二层把所有工作包继续拆到 2 小时粒度，共 1800 个工作包。项目经理认为这样管控最细最安全。以下评价正确的是：

        A. 正确，分解越细越容易控制
        B. 正确，符合 100% 规则
        C. 不正确，工作包过细会使管理成本超过收益，一般以 8 到 80 小时为宜
        D. 不正确，WBS 应按组织结构而不是阶段分解

        **答案 C。** WBS 的粒度是有成本的：1800 个工作包意味着 1800 次进度更新、1800 份完成确认，管理开销会把项目压垮。100% 规则讲的是「工作量加总对不对」，不管粒度——所以 B 偷换了概念。

        D 的错在方向：按组织结构分解恰恰是 WBS 要避开的，那样会让同一个可交付成果被切到多个部门，责任边界反而模糊。

        ### 怎么考

        **单选题**三类：一是归属判断（哪件事属于规划过程组），二是 WBS 100% 规则的含义，三是滚动式规划指什么。

        **判断题**常考两句：
        - 「三大基准一经确定不得更改」——错，可以改，但要走变更控制流程
        - 「项目管理计划由各专业负责人分别编制」——错，由项目经理整合

        **案例题**在规划组失分最集中的三种情形：没有编制计划就开工、计划未经评审与批准（等于没有基准）、WBS 分解不完整导致范围遗漏。答这类题要落到「缺少什么、导致什么、应该补什么」，不要只写「计划不完善」。

        **一层容易漏的**：规划过程组是可反复的。项目执行中发现新信息，回到规划组细化计划是正常循环，不是「计划失败了」。这一点在解释「为什么项目要定期滚动修订计划」时用得上。

  - id: KP-0203
    module_id: S2
    parent: null
    name: 执行过程组
    ref: "第12章"
    note:
      summary: 执行过程组按计划干活并管人，产出可交付成果与工作绩效数据，凡是跟人打交道的活大多在这一组。
      body: |-
        ### 要素

        **执行过程组的定位**：把计划变成成果，同时把人管住。判断「这件事属于执行还是规划」，看它是「在定规矩」还是「在按规矩干活」。

        **核心过程与产出**：

        | 过程 | 主要产出 |
        | --- | --- |
        | 指导与管理项目工作 | 可交付成果、工作绩效数据、变更请求、问题日志更新 |
        | 管理项目知识 | 经验教训登记册更新 |
        | 获取资源 | 实物资源与团队派工 |
        | 建设团队 | 团队绩效提升、团队章程 |
        | 管理团队 | 冲突解决、变更请求 |
        | 管理沟通 | 沟通记录、项目信息发布 |
        | 实施风险应对 | 风险应对执行记录 |
        | 实施采购 | 选定的卖方、协议 |
        | 管理相关方参与 | 相关方参与计划更新 |

        **工作绩效数据在执行组产生**，这是绩效三件套的起点，务必分清三级：

        | 层级 | 长什么样 | 谁产出 |
        | --- | --- | --- |
        | 工作绩效数据 | 原始记录，如「已完成 3 个模块、花了 12 万」 | 执行组 |
        | 工作绩效信息 | 与计划对比后的结论，如「进度落后 8%」 | 各控制过程 |
        | 工作绩效报告 | 汇总成决策材料，如状态报告、仪表盘 | 监控项目工作 |

        **塔克曼阶梯**是执行组最常考的知识点，五个阶段顺序固定：形成期 → 震荡期 → 规范期 → 成熟期 → 解散期。

        关键在于**震荡期冲突最多，这是团队成长的必要阶段，不是管理失败**。此时项目经理的动作是引导建立规则、明确角色与决策方式，而不是压制冲突或换人。跳过震荡直接想进成熟期，基本等于把矛盾压到后面爆发。

        **建设团队的具体手段**：集中办公（同地点办公，最有效但成本高）、虚拟团队、培训、团队建设活动、认可与奖励、制定团队章程。奖励要奖励**可达成且与目标一致**的行为，教材特别提醒：奖励加班会诱导无效加班，属于反向激励。

        **管理团队与建设团队的区别**：建设团队是「提升能力、凝聚人心」，管理团队是「跟踪绩效、解决冲突、处理问题成员」。选择题常把两者混在一起考。

        ### 例题

        某项目团队组建三周，成员对技术方案分歧很大，会上经常争执，有两名骨干提出调岗。项目经理的做法中，最恰当的是：

        A. 立即更换提出调岗的两名骨干，避免影响进度
        B. 由项目经理拍板确定技术方案，禁止继续争论
        C. 引导团队建立决策规则与角色分工，推动团队进入规范期
        D. 取消例会，减少成员接触以降低冲突

        **答案 C。** 三周、方案分歧、争执——典型的**震荡期**特征。震荡期的任务就是建立规则、理顺角色，C 正对这个阶段。

        B 的问题在于用权力压掉了过程，方案分歧会转入私下抵制，冲突不会消失只会延后。

        A 与 D 都是回避型处理，成本高或掩盖问题。替换成员会把震荡期重置——新人进来团队又回形成期。

        ### 怎么考

        **单选题**三个高频：绩效数据、信息、报告分别由谁产出；塔克曼五阶段的顺序与特征；冲突处理方式的适用场景（合作、妥协、缓和、强迫、回避）。

        **判断题**常见两句：
        - 「经验教训只能在项目结束时总结」——错，执行期就要持续更新登记册
        - 「团队冲突应当尽量消除」——错，适度冲突对决策有益，要管理而非消灭

        **案例题**执行组失分点集中在三处：团队建设缺失（无团队章程、无培训、无激励）、沟通机制缺失（无例会、无信息分发渠道）、相关方参与不足（关键相关方未纳入）。答题要写具体动作，比如「应制定团队章程并明确角色职责」，而不是「应加强团队管理」。

        **一层容易漏的**：管理项目知识的过程产出是**经验教训登记册**，它是收尾阶段的输入。执行期不记，收尾时写不出来——这是案例题里解释「项目结束无法沉淀经验」的直接原因。

  - id: KP-0204
    module_id: S2
    parent: null
    name: 监控过程组
    ref: "第13章"
    note:
      summary: 监控过程组拿实际比计划，产出变更请求与绩效报告，确认范围虽在这一组，做的人却是客户。
      body: |-
        ### 要素

        **监控过程组的动作是测量、比较、纠偏**，它不产出产品，产出的判断和变更请求。

        **过程清单**：监控项目工作、实施整体变更控制、确认范围、控制范围、控制进度、控制成本、控制质量、控制资源、监控沟通、监控风险、控制采购、监督相关方参与。（「监督相关方参与」有的版本译作「监控相关方参与」，指同一个过程。）

        **确认范围是这一组最容易被误解的过程**。它做的是**正式验收已完成的核可交付成果**，验完通过就更新验收状态、走移交。两条关键区分：

        | 对比项 | 确认范围 | 控制质量 |
        | --- | --- | --- |
        | 谁做 | 客户或发起人 | 项目团队内部 |
        | 验什么 | 是否满足需求、能不能接收 | 是否符合质量标准 |
        | 什么时候 | 成果完成后 | 过程中与完成后都可 |
        | 不通过的后果 | 不能交付，退回处理 | 返工，内部消化 |

        顺序上一般是**先控制质量、后确认范围**：自己先检查合格，再请客户验收。跳过自检直接送客户，返工代价高且影响信任。

        **监控项目工作的输出是工作绩效报告**，它把各控制过程算出的工作绩效信息汇总成状态报告、进展报告、仪表盘。这一份报告是决策与沟通的输入，不是给人看热闹的。

        **控制采购包含合同收尾**。老版本单列过「结束采购」，现行口径已并入控制采购——这是判断题爱设的坑：问「合同收尾属于哪个过程」，答控制采购。

        **进度控制的两把刀**：赶工（Crash，加资源或加班，会推高成本）与快速跟进（Fast Tracking，把顺序工作改成并行，会增加返工风险）。考试常问「在成本受限时选哪个」——选快速跟进；「在风险敏感时选哪个」——选赶工。

        **成本控制的主武器就是挣值分析**（见 KP-0206），这里不重复，但要记住监控组的成本控制输出同样是变更请求与预测更新。

        ### 例题

        某项目模块开发完成，项目团队先做了内部测试，发现 12 个缺陷并已修复。随后项目经理提交客户验收，客户提出 3 项与合同需求不符之处。以下说法正确的是：

        A. 客户提出的问题属于质量问题，应由开发团队返工
        B. 客户的验收活动属于确认范围，发现的是需求符合性问题
        C. 内部测试属于确认范围，客户验收属于质量控制
        D. 已通过内部测试即说明成果合格，客户无权拒收

        **答案 B。** 内部测试是控制质量（是否符合标准），客户验收是确认范围（是否满足需求）。客户挑出的是「与合同需求不符」，属需求符合性，不是质量缺陷。

        C 把两者完全对调了，是本题最像的干扰项。判断方法很简单：**内部做的都是质量控制，外部（客户、发起人）做的才是确认范围。**

        D 错在把「符合标准」当成「满足需求」。这两个是不同维度：可以每个指标都达标，但做出来的不是客户要的东西。

        ### 怎么考

        **单选题**四个高频：确认范围与质量控制的区别（几乎每年都有）、绩效数据、信息、报告的流转、进度压缩两法的代价、合同收尾归属。

        **判断题**常见两句：
        - 「确认范围由项目团队执行」——错，由客户或发起人执行
        - 「监控过程组只在项目后期进行」——错，全过程组并行贯穿

        **案例题**监控组是最容易出分的地方，因为失分点高度固定：变更未走整体变更控制、进度偏差未采取纠偏、质量未做过程控制只做终检、验收未形成书面记录。答题时把「发现偏差 → 分析原因 → 提出纠偏或变更 → 更新计划」这条链条写全，比罗列问题得分高。

        **一层容易漏的**：监控是**贯穿全程**的，不是后期才做。项目一开始就要有监控，否则前期偏差会累积到无法纠正——这一点在解释「为什么项目后期才发现严重超支」时是核心答案。

  - id: KP-0205
    module_id: S2
    parent: null
    name: 收尾过程组
    ref: "第14章"
    note:
      summary: 收尾过程组只做一件事——把项目或阶段正式关闭，核心产物是移交、归档和经验教训。
      body: |-
        ### 要素

        **收尾过程组只有一个过程：结束项目或阶段**。过程少不代表事少，它要做完六件事才算真收尾：

        1. 确认全部计划工作已完成并通过验收
        2. 移交最终产品、服务或成果给接收方
        3. 归档项目文件（合同、变更记录、验收单、财务凭证）
        4. 释放项目资源（人员返岗、设备退租、账户回收）
        5. 总结并归档经验教训
        6. 人员安置与必要的庆功

        **行政收尾与合同收尾必须分清**：

        | 对比项 | 行政收尾 | 合同收尾 |
        | --- | --- | --- |
        | 对象 | 整个项目或阶段 | 每一份具体合同 |
        | 关注 | 文档归档、验收完成、资源释放 | 合同条款履行完毕、索赔结清、尾款支付 |
        | 在哪完成 | 结束项目或阶段 | 控制采购（旧版单列「结束采购」） |

        一个项目有多份合同时，**合同收尾要做多次，行政收尾只做一次**。这是常考的数量关系。

        **提前终止也要收尾**。无论项目是正常完工、被客户叫停、预算被砍还是需求消失，都必须执行收尾。原因很实际：合同要结、资源要还、文档要归、经验要沉淀。判断题问「项目被取消可以不收尾」，答案是不行。

        **经验教训是必须项，不是加分项**。它的价值不在本次项目，而在组织过程资产：经验教训库、模板改进、估算参数校正，都是下一个项目的输入。项目结束不总结，等于把学费白交。

        **收尾的产物里最容易被忽略的是组织过程资产更新**。很多人只记得「交付物移交」，其实更新的资产清单更长：经验教训登记册、项目档案、历史估算数据、风险清单、供应商绩效记录。

        ### 例题

        某政务系统项目在实施 8 个月后，因机构改革被主管部门要求终止，剩余工作不再进行。项目经理随即解散团队、通知成员回原部门，并停止了所有记录工作。以下评价正确的是：

        A. 正确，项目终止后无需再履行项目流程
        B. 不正确，项目终止仍须执行收尾，完成合同清算、文档归档与经验教训总结
        C. 正确，只要客户不再支付费用即可终止
        D. 不正确，必须先完成全部剩余工作才能收尾

        **答案 B。** 终止不等于免收尾。B 列的三件事正好是终止场景下最容易被跳过的：合同清算（可能涉及违约金与已完工程量结算）、文档归档、经验教训。

        A 是典型错误认知，也是案例题最爱设的失分点。

        D 走过头了——提前终止的定义就是「剩余工作不做」，收尾针对的是已完成部分和合同关系，不是把活干完。

        ### 怎么考

        **单选题**常考：收尾过程组有几个过程（一个）、合同收尾属于哪个过程（控制采购）、行政收尾与合同收尾的区别、经验教训登记册的归属。

        **判断题**常见三句：
        - 「项目被取消可以不收尾」——错
        - 「经验教训总结是可选的」——错，是必须的
        - 「收尾就是交付产品」——不完整，还有归档、释放资源、总结

        **案例题**问「项目收尾阶段存在哪些问题」，标准得分点：未组织正式验收、文档未归档、资源未释放、未总结经验教训、合同未清算、未移交运维。六条能覆盖绝大多数题目。

        **一层容易漏的**：收尾不仅是行政动作，也是**相关方关系收尾**。客户、供应商、监管方的关系要有明确结束交代，否则后续运维交接会扯皮。这一点在案例题里答出来，明显高于只答文档归档的答案。

  - id: KP-0206
    module_id: S2
    parent: KP-0204
    name: 挣值分析（EVM）
    ref: "第13章"
    note:
      summary: 挣值分析把进度与成本合成一把尺子，SPI 看快慢、CPI 看贵贱，两者都小于 1 就是又慢又超支。
      body: |-
        ### 要素

        **四个基础量必须先认清**，认错一个，后面全错：

        | 符号 | 名称 | 口径 |
        | --- | --- | --- |
        | PV | 计划价值 | 到检查点为止，**计划**要完成的工作的预算 |
        | EV | 挣值 | 到检查点为止，**实际已完成**的工作的预算 |
        | AC | 实际成本 | 到检查点为止，**实际花掉**的钱 |
        | BAC | 完工预算 | 整个项目的总预算 |

        **最关键的一条**：EV 用的是「已完成工作的**预算**价值」，不是实际花的钱，也不是计划量。它是把「进度」翻译成「钱」的桥。

        **两个偏差，看正负**：

        - 进度偏差 SV = EV − PV。小于 0 表示进度落后，大于 0 表示提前
        - 成本偏差 CV = EV − AC。小于 0 表示成本超支，大于 0 表示节约

        **两个指数，看是否大于 1**：

        - 进度绩效指数 SPI = EV ÷ PV。小于 1 表示比计划慢
        - 成本绩效指数 CPI = EV ÷ AC。小于 1 表示比计划贵

        SPI 与 CPI 同时小于 1，就是「又慢又超支」——这是案例题最常见的描述，答「进度滞后且成本超支」即可。

        **预测三件套**：

        - ETC：完工尚需估算，剩余工作还要花多少
        - EAC：完工估算，整个项目最终要花多少
        - VAC：完工偏差 = BAC − EAC，正数表示还剩，负数表示会超

        **EAC 的两种算法，选哪种取决于「偏差会不会继续」**：

        | 情形 | 判断依据 | 公式 |
        | --- | --- | --- |
        | 典型偏差 | 当前偏差会持续到完工，没采取纠正 | EAC = BAC ÷ CPI |
        | 非典型偏差 | 偏差是偶发的，已纠正，剩余按计划走 | EAC = AC + (BAC − EV) |

        **这道判断是整道题的分数所在**。题里出现「按当前趋势继续」「未采取任何措施」就是典型；出现「已查明原因并纠正」「剩余工作按原计划执行」就是非典型。

        **TCPI（完工尚需绩效指数）** = (BAC − EV) ÷ (BAC − AC)，含义是「剩余每一元钱要干出多少产值的活才不超预算」。大于 1 说明必须比原效率更高才行，通常意味着要动措施。

        ### 例题

        某项目总预算 BAC = 800 万元。到检查点时，计划应完成 40% 的工作，实际完成 35%，实际已支出 320 万元。项目经理判断当前偏差会持续到项目结束。则 CPI 与 EAC 分别为：

        **先算基础量**：EV = 800 × 35% = 280 万元，PV = 800 × 40% = 320 万元，AC = 320 万元。

        **CPI** = EV ÷ AC = 280 ÷ 320 = **0.875**，小于 1，成本超支。

        **EAC**（典型偏差）= BAC ÷ CPI = 800 ÷ 0.875 = **914.3 万元**，比原预算超约 114 万元。

        顺带可算 SPI = 280 ÷ 320 = 0.875，也是慢。SV = −40 万元，CV = −40 万元。

        **常见错误**有三种：把 PV 与 EV 弄反（算出 SPI 大于 1 的假提前）、用 AC 当 EV（算出 CPI 恒等于 1）、该用非典型公式时用了典型公式（EAC 算成 AC + 剩余预算 = 320 + 520 = 840 万元）。看清题干那句「偏差会持续」再选公式。

        ### 怎么考

        **上午卷计算题必考**，通常一到两道，分值稳定。出题形式固定：给 PV、EV、AC 或给比例，问 SPI、CPI、EAC、项目状态。

        **判断题**常考概念辨析：
        - 「CV 为负表示进度落后」——错，CV 管成本
        - 「SPI 为 1.2 表示进度超前 20%」——对，但要注意这不一定意味着能提前交付，关键路径才是决定因素

        **案例题**里挣值常作为「判断项目状态」的工具出现，答题要点三句：先算指标、再判状态、最后给措施。只算不判会丢一半分。

        **一层容易漏的**：SV 为负并不必然导致最终延期。如果落后的是非关键路径上的活动，且总时差足够，完工日期可能不受影响。这一点在问「进度落后是否一定影响交付」时是区分高分的答案。

  - id: KP-0207
    module_id: S2
    parent: KP-0204
    name: 变更控制流程
    ref: "第13章"
    note:
      summary: 变更控制的核心是没审批不许动，六步流程跳一步就是失分点，口头变更一律先书面化。
      body: |-
        ### 要素

        **变更的来源**要先能说清：客户需求调整、法规或标准更新、技术方案变更、执行偏差需要纠偏、风险发生后的应对。来源不同，但走的流程完全相同——**没有例外通道**。

        **变更控制六步，顺序不能换**：

        1. **提出书面变更申请**：申请人填变更申请单，写清变更内容、理由、期望时间
        2. **记录并初审**：纳入变更日志，判断是否属于变更（有的只是澄清，不走流程）
        3. **影响分析**：分析对范围、进度、成本、质量、风险、资源的影响，这是最实质的一步
        4. **CCB 审批**：变更控制委员会决定批准、否决或推迟
        5. **实施变更**：批准后由执行团队按更新后的计划实施
        6. **验证并归档**：确认变更结果符合预期，更新基准与配置项，记录归档

        **CCB 的定位要清楚**：它是**审批机构**，不是执行机构。成员通常包括发起人、客户代表、技术负责人、商务负责人。CCB 不负责改代码、不负责写方案，只负责决定「做不做、什么时候做」。

        **基准必须跟着变更走**。批准变更后如果不更新范围基准、进度基准、成本基准，下一次挣值分析就会拿新实际比旧基准，偏差全是假的。这是案例题里「为什么监控数据不可信」的标准答案之一。

        **配置管理是变更控制的底座**，四个动作：识别配置项、建立基线、版本控制、配置审计。变更实施后要同步更新配置项版本，否则会出现「文档是旧的、系统是新的」。

        **口头变更一律不接受**。哪怕是客户负责人口头同意，也要先书面化再进流程。这不是官僚，是留证据——项目后期扯皮几乎都源于「当时说好的」没有纸面记录。

        **紧急变更**可以边处置边报批，但必须在事后补齐审批与记录，不能变成「先做后不报」的常态。

        ### 例题

        项目已进入开发阶段，客户方业务部门负责人在例会上口头要求增加一个数据导出功能，称「这个很简单，你们顺手做了吧」。项目经理最恰当的处理是：

        A. 需求简单，安排开发人员直接实现，避免影响客户关系
        B. 记录为待办事项，等下个版本一起做
        C. 请客户提交书面变更申请，组织影响分析后提交 CCB 审批，批准后实施并更新基准
        D. 拒绝客户要求，说明已进入开发阶段不再接受变更

        **答案 C。** 完整走完六步是唯一正确路径。注意 C 里三个动作一个都不能少：书面化、影响分析、CCB 审批。

        A 是最常见也最危险的做法——「顺手做」的变更没有记录、没有评估、没有更新基准，最终表现为「进度莫名延期、成本莫名超支」。

        B 的问题是「下个版本」这个承诺本身就没经过评估，等于私下批准了变更。

        D 走另一个极端。变更控制不是拒绝变更，而是让变更可控。开发阶段当然可以变，只是要走流程。

        ### 怎么考

        **案例题最高频考点，几乎没有之一**。题干通常描述「客户提出新需求，项目经理直接安排实施」，问存在什么问题、应该怎么做。

        标准答法按四层写：
        - 问题：未建立变更控制流程，变更未书面化、未做影响分析、未经 CCB 审批
        - 影响：范围蔓延、基准失真、进度与成本失控、验收争议
        - 措施：建立变更控制流程，所有变更书面提出，组织影响分析，提交 CCB 决策，批准后更新基准与配置项，实施后验证归档
        - 配套：建立变更日志，配置管理与变更控制联动

        **单选题**常考：变更流程的第一步是什么（提出书面申请，不是影响分析）、CCB 的职责（审批不是实施）、谁有权批准基准变更（CCB）。

        **判断题**常见两句：
        - 「紧急变更可以先实施，事后无需补审批」——错，要补
        - 「变更被否决后不需要记录」——错，否决也要记录，供后续参考

        **一层容易漏的**：变更日志要记录**被否决的变更**。它的价值在于避免同一个变更被反复提出，也为将来复盘提供依据。答题时提这一句，明显比只写「记录批准的变更」完整。


  - id: KP-0301
    module_id: S3
    parent: null
    name: 信息化发展
    ref: "第1章"
    note:
      summary: 信息化是把信息资源转化为生产力的长期过程，本章考的是新基建、工业互联网、数字中国这一层概念。
      body: |-
        ### 要素

        **信息化的基本内涵**：在社会生产和社会活动中，通过普遍采用信息技术、深入开发利用信息资源，推动经济发展和社会进步，使信息经济在国民经济中的比重逐步上升直至占主导地位的过程。注意三个隐含特征——**长期性**（不是一次性工程）、**全方位**（不只经济领域）、**以信息资源为核心**（不是以设备为核心）。

        **现代化基础设施：新基建三大类**，这是本章最稳定的考点：

        | 类别 | 指向 | 典型例子 |
        | --- | --- | --- |
        | 信息基础设施 | 通信网络、新技术、算力 | 5G、数据中心、人工智能平台、工业互联网 |
        | 融合基础设施 | 传统基建被数字化改造 | 智能交通、智慧能源、智慧水利 |
        | 创新基础设施 | 支撑科研与技术开发 | 重大科技基础设施、科教基础设施、产业技术创新设施 |

        判别方法：**「新建的数字底座」是信息，「被改造的老基建」是融合，「搞研发用的」是创新**。三者常混在选项里，靠这个口径区分最快。

        **工业互联网三大体系**：网络（基础，含标识解析）、平台（核心，承载工业知识与模型）、安全（保障）。教材强调平台是核心，因为它把数据、模型、应用聚在一起。

        **数字经济的两条腿**：
        - **数字产业化**：把信息技术本身做成产业（芯片、软件、云服务），是**基础**
        - **产业数字化**：用信息技术改造传统产业（智能制造、智慧农业），是**主战场**

        考试爱问「产业数字化与数字产业化哪个是主战场」，答案是产业数字化——因为传统产业的体量远大于信息产业本身。

        **数字中国的基本框架**：数字经济（发展引擎）、数字政府（治理现代化）、数字社会（民生服务）、数字生态（数据要素与环境）。数字政府的抓手是「一网通办」「跨省通办」「最多跑一次」，指向的是政务数据共享与流程再造。

        **两化融合**指信息化与工业化融合，路径是「信息化带动工业化、工业化促进信息化」。它在概念上与产业数字化重叠，但更强调工业侧。

        ### 例题

        某市拟建设三类项目：① 建设全市统一的政务云数据中心；② 对现有供水管网加装智能监测终端并接入调度平台；③ 建设面向本地半导体产业的中试研发平台。以下归类正确的是：

        A. ①②③均属信息基础设施
        B. ①属信息基础设施，②属融合基础设施，③属创新基础设施
        C. ①属融合基础设施，②属信息基础设施，③属创新基础设施
        D. ①②属信息基础设施，③属融合基础设施

        **答案 B。** 按「新建数字底座、改造老基建、支撑研发」三条判：政务云是新建的数字底座，供水管网是既有设施被数字化改造，中试平台是研发支撑。

        C 把①②对调，是最像的干扰项。判断关键在**对象是不是既有的传统设施**：数据中心本来不存在，属于新建；供水管网本来就存在，属于改造。

        D 的错在把研发平台当成融合。中试平台不面向公众提供服务，也不改造传统设施，它是给技术开发用的。

        ### 怎么考

        **单选题**三类：新基建三类归属、数字经济两条腿的定位、工业互联网三大体系哪个是核心。

        **判断题**常见两句：
        - 「信息化是一次性的系统建设」——错，是长期持续过程
        - 「数字产业化是主战场」——错，产业数字化才是

        **问答题**在下午卷偶有出现，问「工业互联网的三大体系及关系」。标准答法：网络是基础，提供连接与标识解析；平台是核心，沉淀工业知识与模型、承载应用；安全是保障，贯穿全程。三者相互支撑，缺一不可。

        **一层容易漏的**：本章概念多但都很浅，真正的失分点是**把相近概念的值域记混**。比如把「数字政府」与「智慧城市」当同义——数字政府侧重治理与政务服务，智慧城市侧重城市运行管理。这类题不需要深挖，只需要不混。

  - id: KP-0302
    module_id: S3
    parent: null
    name: 信息技术发展（云大物移智区）
    ref: "第2章"
    note:
      summary: 云大物移智区是本章主线，考的是每种技术的分层、服务模式与关键特征，而不是技术细节。
      body: |-
        ### 要素

        **云计算**。五个基本特征：按需自助服务、广泛的网络访问、资源池化、快速弹性伸缩、可计量付费。三种服务模式必须能分辨：

        | 模式 | 用户拿到什么 | 用户自己管什么 |
        | --- | --- | --- |
        | IaaS | 虚拟机、存储、网络 | 操作系统以上全自己管 |
        | PaaS | 开发运行环境、中间件、数据库 | 只管应用与数据 |
        | SaaS | 直接可用的软件 | 什么都不用管 |

        判别口诀：**IaaS 给地基，PaaS 给工地，SaaS 给成品房**。四种部署形态：公有云、私有云、混合云、社区云。

        **大数据**。特征用 5V 记：Volume（量大）、Velocity（速度快）、Variety（类型多）、Veracity（真实性）、Value（价值密度低）。处理流程五段：采集 → 存储 → 处理 → 分析 → 呈现。典型技术栈：HDFS 存储、MapReduce 批处理、YARN 资源调度、Hive 数据仓库、HBase 列式存储、Spark 内存计算。

        **物联网**。**三层架构是必考**：感知层（采集，传感器、RFID、摄像头）、网络层（传输，接入网与承载网）、应用层（处理与业务）。四大支撑技术：RFID、传感器、嵌入式系统、纳米与微机电技术。RFID 的核心价值是**非接触式自动识别**，常用于物流与资产管理。

        **区块链**。本质是**分布式账本**，四个特征：去中心化、不可篡改、可追溯、公开透明（联盟链是部分透明）。共识机制常见 PoW（工作量证明）、PoS（权益证明）。智能合约是「自动执行的代码化合约」。按准入分三类：

        | 类型 | 谁能参与 | 典型场景 |
        | --- | --- | --- |
        | 公有链 | 任何人 | 加密货币 |
        | 联盟链 | 特定机构组成的联盟 | 供应链金融、政务存证 |
        | 私有链 | 单一组织内部 | 内部审计 |

        **考试最近爱考联盟链**，因为它才对应绝大多数企业级与政务场景。

        **5G 三大应用场景**：eMBB（增强移动宽带，大带宽，如高清视频）、mMTC（海量机器通信，大连接，如物联网）、uRLLC（超可靠低时延，如工业控制、远程手术）。三个场景对应三组不同指标，别混。

        **边缘计算与云计算的关系**：不是替代，是分工。云做全局、长周期、大数据量分析；边缘做本地、实时、低时延处理。工业现场的控制指令不能等云端往返，所以要下沉到边缘。

        ### 例题

        某制造企业希望实现车间设备状态实时监控与毫秒级异常停机保护，同时把历史数据汇总到总部做产能分析。以下技术组合最合理的是：

        A. 全部数据上传公有云，由云端统一做实时控制
        B. 车间部署边缘计算节点做实时控制，历史数据汇聚到云端做分析
        C. 车间本地部署私有云完成全部功能，不与总部联通
        D. 使用区块链存储设备数据，实现实时控制

        **答案 B。** 题里有两个矛盾的需求：**毫秒级实时**与**历史数据全局分析**。边缘计算解决前者，云计算解决后者，这正是两者分工的标准场景。

        A 的错在时延：公网往返达不到毫秒级，而且断网即停机，风险不可接受。

        C 的错在割裂：总部要做产能分析就必须汇聚数据，本地闭环满足不了。

        D 混淆了区块链的定位。区块链擅长的是不可篡改的存证与多方互信，不是实时控制，也不是高频数据的高效存储。

        ### 怎么考

        **单选题**极高频：IaaS、PaaS、SaaS 的分辨（每年必考至少一题）、物联网三层架构、5G 三大场景对应关系、区块链的分类与特征。

        **判断题**常见三句：
        - 「SaaS 用户需要自己维护操作系统」——错，那是 IaaS
        - 「区块链数据不可篡改所以不需要备份」——错，不可篡改不等于不会丢
        - 「边缘计算将取代云计算」——错，是互补分工

        **案例题**里这些技术通常作为**方案要素**出现，考的是「选得对不对、理由说不说得通」。答题时不要只罗列技术名词，要写清「这个技术解决哪个具体问题」，例如「采用边缘计算降低现场控制时延」。

        **一层容易漏的**：大数据 5V 里的 **Value 是「价值密度低」**，不是「价值高」。这个反向表述是判断题的经典陷阱：海量数据里真正有用的比例很低，所以需要清洗与挖掘。

  - id: KP-0303
    module_id: S3
    parent: null
    name: 信息技术服务
    ref: "第3章"
    note:
      summary: 信息技术服务考的是 ITSS 体系与 IT 服务生命周期的五个阶段，核心是把服务当产品来管。
      body: |-
        ### 要素

        **IT 服务的定义**：供方为满足需方的业务需求，基于信息技术所提供的服务。关键在「**基于信息技术**」与「**满足业务需求**」——不是卖硬件，也不是单纯修电脑，落点是业务价值。

        **ITSS（信息技术服务标准）体系**是本章骨架，按性质分四类：

        | 类别 | 作用 |
        | --- | --- |
        | 基础标准 | 术语、分类、代码等共同语言 |
        | 服务管控标准 | 服务治理、服务管理（对齐 ISO 20000 思路） |
        | 服务业务标准 | 针对咨询、设计、运维、运营、数据等具体业务 |
        | 服务安全标准 | 服务过程中的安全要求 |

        **IT 服务生命周期五个阶段**，顺序必须记牢：

        1. **规划设计**：从需方业务战略出发，做服务目录、服务级别、能力规划
        2. **部署实施**：把规划落地，完成资源调配、流程上线、人员到位
        3. **服务运营**：日常提供服务，处理请求与事件，保证 SLA 达成
        4. **持续改进**：度量服务绩效，找短板，做优化
        5. **监督管理**：对服务质量、过程、合规性进行监督与评价

        **这五个阶段是闭环不是直线**：持续改进与监督管理会反馈回规划设计，这是「服务生命周期」区别于「项目生命周期」的核心——项目有终点，服务没有。

        **SLA（服务级别协议）**是服务管理的核心工具，写清四件事：服务内容与范围、服务水平指标（可用性、响应时间、解决时间）、双方责任、违约处理。与 SLA 配套的还有**服务目录**（有哪些服务可选）和**服务台**（唯一联系入口）。

        **运维服务的四类活动**：例行操作（巡检、备份）、响应支持（事件与请求处理）、优化改善（性能调优）、咨询评估（规划建议）。这四类常被拿来问「某活动属于哪一类」。

        **服务模式**：远程服务（成本低、响应快，适合标准化问题）、现场服务（适合硬件与复杂问题）、混合服务（最常见）。

        ### 例题

        某单位将办公终端运维外包，合同约定：服务台 7×24 小时受理，一般故障 2 小时内响应、8 小时内解决，关键业务系统中断 30 分钟内到场。运行三个月后，需方发现有 12 起一般故障超过 8 小时才解决，但供方称「已按 2 小时响应，不算违约」。以下判断正确的是：

        A. 供方说法正确，响应达标即履约完成
        B. 供方说法错误，8 小时解决时限是服务水平指标，未达成即构成违约
        C. 该约定不属于 SLA，只是服务承诺
        D. 只有关键业务系统中断才构成违约

        **答案 B。** 合同里同时约定了**响应时限**与**解决时限**，这是两个独立指标，不能用一个满足来抵消另一个。这题的实质是考查「SLA 指标是并列条件」这一常识。

        A 的错在概念偷换：响应只是「开始处理」，解决才是「问题消除」。

        C 错在定性：写清了服务内容、指标、责任的合同附件就是 SLA。

        D 错在抽样理解：三类指标都在合同里，任何一类未达成都是违约。

        ### 怎么考

        **单选题**三类：IT 服务生命周期五阶段的顺序、ITSS 四类标准的归属、运维四类活动的分类。

        **判断题**常见两句：
        - 「IT 服务就是 IT 运维」——错，运维只是服务业务之一，还有咨询、设计、运营、数据服务
        - 「服务生命周期到运营结束」——错，还有持续改进与监督管理，且形成闭环

        **案例题**常以「运维服务质量不达标」出现，问原因与改进。标准答法从四个角度写：服务目录不清（提供什么没界定）、SLA 指标不可度量（写「及时」而不写「2 小时」）、服务过程无记录（无法举证）、缺少持续改进机制（问题重复发生）。

        **一层容易漏的**：**服务台是单一联系点（SPOC）**，不是「修电脑的地方」。它的职责是受理、分类、派单、跟踪、关闭，而不是自己解决所有问题。把服务台当技术支援组，是案例题里很常见的认知错误。

  - id: KP-0304
    module_id: S3
    parent: null
    name: 信息系统架构
    ref: "第4章"
    note:
      summary: 信息系统架构考的是分层怎么分、服务怎么松耦合，重点在企业架构四视图与 SOA、微服务的区别。
      body: |-
        ### 要素

        **架构的定义**：系统的基本组织结构，包括组成元素、元素之间的关系、以及指导其设计与演进的原则。注意「演进」二字——架构不是一次性设计，它要能支撑变化。

        **企业架构四视图**，这是最稳定的考点：

        | 视图 | 回答什么问题 | 主要产物 |
        | --- | --- | --- |
        | 业务架构 | 做什么业务、流程怎么走 | 业务流程模型、组织与职责 |
        | 数据架构 | 有哪些数据、怎么流转 | 数据模型、数据分布、数据标准 |
        | 应用架构 | 有哪些系统、怎么交互 | 应用清单、集成关系 |
        | 技术架构 | 用什么技术支撑 | 技术标准、中间件、基础设施 |

        判断某个内容属于哪个视图，用「业务问做什么、数据问有什么、应用问用哪个系统、技术问靠什么实现」四句话对位即可。

        **分层架构的常见五层**（由下往上）：

        1. 基础设施层：网络、服务器、存储、机房
        2. 数据资源层：数据库、数据仓库、数据湖
        3. 应用支撑层：中间件、公共服务组件、统一认证
        4. 业务应用层：具体业务系统
        5. 展现层：门户、移动端、大屏

        贯穿各层的还有**安全保障体系**与**运维管理体系**，两条竖线，这也是常考的「两体系」。

        **SOA（面向服务的架构）的要点**：把业务能力封装成**可复用、松耦合、粗粒度**的服务，通过标准接口对外提供，服务之间通过企业服务总线（ESB）进行路由、转换与编排。SOA 的价值在于复用与解耦，代价是 ESB 本身容易变成单点与瓶颈。

        **微服务与 SOA 的区别**，这是高频对比：

        | 对比项 | SOA | 微服务 |
        | --- | --- | --- |
        | 服务粒度 | 粗粒度，按业务域 | 细粒度，按业务能力 |
        | 通信方式 | 重，常经 ESB | 轻，常用 REST/HTTP 或消息 |
        | 数据管理 | 倾向共享数据库 | 每服务独立数据库 |
        | 部署 | 常整体部署 | 独立部署、独立扩缩 |
        | 治理 | 中心化 | 去中心化 |

        **中间件的定位**：位于操作系统与应用之间，屏蔽底层差异、提供通用能力。常见类型：应用服务器、消息队列、事务中间件、数据访问中间件。

        **单点登录（SSO）** 解决的是「多个系统一次登录」，技术路径通常是统一认证中心加令牌（票据）传递。它是应用支撑层的典型组件，考试常问「SSO 属于哪一层」——答应用支撑层。

        ### 例题

        某集团有 20 个业务系统，各自维护用户与权限，员工离职后账号在部分系统中未被停用。集团计划改造为统一身份认证，并支持一次登录访问全部系统。以下方案中最符合架构分层原则的是：

        A. 在每个业务系统内各自增加账号同步脚本
        B. 在应用支撑层建设统一认证中心，通过令牌实现单点登录，各系统对接认证接口
        C. 在数据资源层建一张用户总表，各系统直接读取该表
        D. 在展现层做统一门户，门户内嵌各系统的登录页面

        **答案 B。** 认证是**跨系统的公共能力**，属于应用支撑层的职责。B 把能力上收到公共层，各业务系统只负责校验令牌，职责清晰。

        A 是把公共能力分散到 N 个地方，20 个系统就有 20 套逻辑，维护成本随系统数线性增长——这正是当前故障的成因。

        C 看似集中，但让业务系统直接读用户总表意味着**认证逻辑仍在各系统内**，且数据库层被多系统直连，耦合更重。

        D 最容易迷惑：门户内嵌登录页只是「同一个地方点开多个登录框」，本质仍是多次登录，不是 SSO。

        ### 怎么考

        **单选题**四类：企业架构四视图的归属、分层架构中各组件属于哪一层、SOA 与微服务的区别、ESB 的作用。

        **判断题**常见两句：
        - 「微服务就是更细的 SOA」——不准确，两者在数据管理与治理思路上有本质差异（去中心化 vs 中心化）
        - 「分层越多系统越好」——错，层数增加会带来调用链变长与性能损耗

        **案例题**常考「系统烟囱式建设」的问题与改造思路。标准答法：问题是各系统独立建设、数据不通、重复投资、公共能力重复实现；改造思路是梳理业务架构与数据架构，抽取公共能力到应用支撑层（统一认证、统一消息、统一日志），通过标准化接口集成，并建立架构管控机制。

        **一层容易漏的**：架构评估里有个常被忽略的维度是**可演进性**。只评价当前功能是否满足是不够的，还要问「三年后业务变了，这套架构改得动吗」。答题时提这一句，能明显区分深度。

  - id: KP-0305
    module_id: S3
    parent: null
    name: 软件工程
    ref: "第5章"
    note:
      summary: 软件工程考开发模型的选择、UML 图的用途与测试的分层，落脚点是过程可控而不是技术先进。
      body: |-
        ### 要素

        **软件生命周期**六个阶段：可行性研究与计划、需求分析、设计（概要设计与详细设计）、编码、测试、运行维护。注意**维护占成本比例最高**，教材常引用「维护成本占全生命周期的大部分」。

        **开发模型怎么选**，这是本章的核心判断能力：

        | 模型 | 适用条件 | 风险 |
        | --- | --- | --- |
        | 瀑布 | 需求明确稳定、技术成熟、合同严格 | 后期变更代价极大 |
        | 原型 | 需求不清、需要与用户确认 | 原型易被当成成品 |
        | 增量 | 可拆分交付、希望早期见效 | 需良好架构支撑 |
        | 迭代 | 需求逐步清晰 | 迭代节奏与范围管理难 |
        | 螺旋 | 大型高风险项目 | 管理复杂、成本高 |
        | 敏捷 | 需求变化快、小团队、可频繁交付 | 对文档与合同形式要求高时不适配 |

        **螺旋模型的标志是「风险驱动」**——每一圈都先做风险分析再开发。这个特征在选择题里几乎是唯一判据。

        **敏捷与 Scrum**：三个角色（产品负责人、Scrum Master、开发团队）、四个会议（冲刺计划、每日站会、冲刺评审、冲刺回顾）、三个产物（产品待办列表、冲刺待办列表、增量）。核心是短周期（通常 2 到 4 周）交付可用增量。

        **UML 图的用途要能分辨**：

        | 图 | 画什么 | 判据 |
        | --- | --- | --- |
        | 用例图 | 谁用系统做什么 | 出现参与者与用例 |
        | 类图 | 静态结构与关系 | 出现类、属性、关联 |
        | 时序图 | 对象间消息的先后 | 有生命线与按时间排列的消息 |
        | 活动图 | 业务流程与并发 | 有判断、分支、并行 |
        | 状态图 | 一个对象的状态迁移 | 有状态与迁移条件 |
        | 部署图 | 软硬件部署关系 | 有节点与构件 |

        **用例图三要素**：参与者（Actor）、用例（Use Case）、关系（关联、包含、扩展、泛化）。参与者是**角色不是人**——同一个人可以有多个角色。

        **测试分层**：单元测试（开发做，针对函数或模块）、集成测试（模块间接口）、系统测试（整系统功能与非功能）、验收测试（用户做，含 Alpha 内部试用与 Beta 外部试用）。**顺序是从小到大，责任从开发转向用户**。

        **黑盒与白盒**：黑盒不看内部结构，方法有等价类划分、边界值分析、因果图、场景法、错误推测；白盒看代码逻辑，方法有语句覆盖、判定覆盖、条件覆盖、路径覆盖。**边界值最常考**——因为绝大多数缺陷出现在边界上。

        **CMMI 五级**：初始级（混乱）、已管理级（项目级可管理）、已定义级（组织级标准过程）、量化管理级（用数据管理）、优化级（持续改进）。顺序与关键词都要记。

        **软件维护四类**：改正性（修 bug）、适应性（适应环境变化）、改善性也称完善性（加功能、提性能）、预防性（提前改造以防未来问题）。**改善性维护占比最高**，这是常考事实。

        ### 例题

        某项目需求在签约时只有概要描述，客户内部对流程细节意见不一，且要求 3 个月内看到可运行的界面以争取预算。以下开发模型最合适的是：

        A. 瀑布模型
        B. 螺旋模型
        C. 原型模型
        D. CMMI 模型

        **答案 C。** 两个条件同时指向原型：需求不清（需要边做边确认）、需要尽早看到界面（可视化反馈）。原型的本质就是**用可运行的界面把需求问出来**。

        A 的前提恰恰是需求稳定，与题干相反。

        B 的判据是风险驱动与大型项目，题干没有给出高风险特征，且 3 个月的时间窗撑不起多圈螺旋。

        D 不是开发模型，是过程能力成熟度模型——这是最常见的概念混淆项，CMMI 评的是组织能力，不是选来开发某个项目的方法。

        ### 怎么考

        **单选题**四类：模型选择的适用场景、UML 图的识别、测试类型的顺序与责任、CMMI 等级特征。

        **判断题**常见两句：
        - 「单元测试由用户执行」——错，开发人员执行
        - 「敏捷开发不需要文档」——错，是「可工作的软件重于详尽的文档」，不是不要文档

        **案例题**常考「需求变更频繁导致返工」，问原因与对策。标准角度：需求阶段未充分确认（缺原型或原型未评审）、采用瀑布模型而需求本身不稳定（模型与场景不匹配）、缺少变更控制、缺少迭代交付导致问题暴露晚。对策对应写：引入原型确认需求、改用迭代或敏捷、建立变更流程、缩短交付周期。

        **一层容易漏的**：**验收测试的两个变体**——Alpha 由开发方组织、用户在开发场所测试；Beta 由用户在实际使用环境中测试。这两个的差别在「谁组织、在哪测」，常被简写成「都是用户测」而丢分。

  - id: KP-0306
    module_id: S3
    parent: null
    name: 数据工程
    ref: "第6章"
    note:
      summary: 数据工程考的是数据仓库的四个特征与数据治理的六个域，核心是把数据当资产管理而不是当副产物。
      body: |-
        ### 要素

        **数据仓库的四个特征**，必须能背：

        - **面向主题**：按分析主题组织（如客户、产品、财务），不按业务系统组织
        - **集成**：来自多个源系统的数据经统一编码、命名、度量口径后入库
        - **相对稳定**：以查询分析为主，数据一次装入很少修改
        - **反映历史变化**：保留时间维度，能看趋势与同比

        **OLTP 与 OLAP 的分工**：

        | 对比项 | OLTP（业务库） | OLAP（数据仓库） |
        | --- | --- | --- |
        | 用途 | 日常交易处理 | 分析与决策 |
        | 操作 | 增删改查，频繁小事务 | 大批量读与聚合 |
        | 数据 | 当前明细 | 历史汇总 |
        | 设计 | 规范化，减少冗余 | 反规范化，容忍冗余换查询效率 |

        **ETL 三步**：抽取（Extract）、转换（Transform，含清洗与标准化）、加载（Load）。转换是最重的一步，也是数据质量的主要控制点。

        **维度建模的两个核心表**：
        - **事实表**：存业务度量值（金额、数量），行多列少，外键指向维度
        - **维度表**：存描述性属性（时间、地区、产品），行少列多

        **星型模型 vs 雪花模型**：星型的维度表不再规范化，结构像星星，查询快、易理解；雪花的维度表继续规范化拆分层级，冗余少但关联多、查询慢。**做分析优先星型**。

        **数据湖与数据仓库的区别**：数据湖存原始格式（结构化、半结构化、非结构化都能放），先存后算，适合探索与机器学习；数据仓库存加工后的结构化数据，先建模后存，适合稳定报表。实务中常并存，形成「湖仓一体」。

        **数据治理的六个域**：

        | 域 | 管什么 |
        | --- | --- |
        | 数据标准 | 统一编码、命名、口径 |
        | 元数据 | 数据的数据（结构、来源、血缘） |
        | 主数据 | 跨系统共享的核心实体（客户、组织、产品） |
        | 数据质量 | 完整性、准确性、一致性、及时性、唯一性、有效性 |
        | 数据安全 | 分类分级、权限、脱敏、审计 |
        | 数据生命周期 | 产生、存储、使用、归档、销毁 |

        **数据分类分级**按影响程度分三级：一般数据、重要数据、核心数据。**级别越高，管控越严**，核心数据通常要求境内存储、最严审批。

        ### 例题

        某集团有 12 个业务系统，同一客户在不同系统中编号不同、名称写法不一致，导致月度经营分析中客户数出现三个不同口径。以下治理措施中最先应做的是：

        A. 建数据仓库，把 12 个系统的数据全部抽过来做报表
        B. 识别客户为主数据，建立统一编码与唯一标识，各系统按标准改造
        C. 采购数据可视化工具，让各部门自行取数
        D. 要求各系统每月导出 Excel 由人工核对

        **答案 B。** 症状是「同一实体多个标识」，这是**主数据缺失**的典型表现。治理顺序必须是先解决主数据与数据标准，再谈集成与分析——否则把脏数据搬进仓库，只是把问题换了个地方。

        A 是常见错误顺序：不先统一口径就集成，仓库里会同时存在三份客户数据，报表依旧对不上。

        C 只解决展示，不解决口径。工具越方便，错得越快。

        D 是人工兜底，成本随系统数增长，且无法根治。

        ### 怎么考

        **单选题**四类：数据仓库四特征、OLTP 与 OLAP 的区别、星型与雪花模型的取舍、数据质量维度。

        **判断题**常见两句：
        - 「数据仓库的数据是实时更新的」——错，相对稳定，通常是批量装载
        - 「数据湖就是更大的数据仓库」——错，两者在存储格式与建模时序上不同

        **案例题**常考「数据不一致、报表对不上」，问原因与治理方案。标准答法：先定位是标准问题（编码与口径不统一）、主数据问题（同一实体多标识）、还是质量问题（录入缺失与错误）；对策按「建标准 → 管主数据 → 建质量规则与稽核 → 建元数据与血缘 → 定安全分级」的顺序写，顺序本身就是得分点。

        **一层容易漏的**：元数据的价值在于**血缘分析**——能追出「这个报表数字从哪个系统的哪个字段、经过哪几步加工得来」。案例题里出现「数据出错无法定位来源」，标准答案就是「缺少元数据管理」。

  - id: KP-0307
    module_id: S3
    parent: null
    name: 软硬件系统集成
    ref: "第7章"
    note:
      summary: 软硬件系统集成考的是集成分类、网络分层与综合布线六子系统，全是可背可判的硬知识。
      body: |-
        ### 要素

        **系统集成的五个层面**，从低到高：

        | 层面 | 集成什么 | 难点 |
        | --- | --- | --- |
        | 设备集成 | 硬件设备的物理连接与选型 | 接口与兼容性 |
        | 网络集成 | 网络架构、协议、地址规划 | 性能与可靠性 |
        | 软件集成 | 操作系统、中间件、应用的适配 | 版本与依赖 |
        | 数据集成 | 数据格式、编码、同步 | 口径与一致性 |
        | 应用集成 | 业务流程与系统间的协同 | 业务逻辑耦合 |

        **层次越高价值越大、难度也越大**。考试问「系统集成最难的是哪一层」，答案通常指应用集成（业务集成），因为它牵涉流程再造。

        **OSI 七层与 TCP/IP 四层的对应**是必考：

        | OSI 七层 | 主要功能 | TCP/IP |
        | --- | --- | --- |
        | 应用层、表示层、会话层 | 面向应用的数据处理与对话 | 应用层 |
        | 传输层 | 端到端可靠传输（TCP）或无连接传输（UDP） | 传输层 |
        | 网络层 | 路由与寻址（IP） | 网际层 |
        | 数据链路层、物理层 | 帧传输与物理介质 | 网络接口层 |

        **常见协议与端口要记**：HTTP 80、HTTPS 443、FTP 20 与 21、SSH 22、Telnet 23、SMTP 25、DNS 53、SNMP 161。这些几乎每年抽一两个考。

        **局域网技术**：以太网是主流，交换机负责二层转发，VLAN 用于逻辑隔离广播域。三层交换机兼具路由功能。**VLAN 的价值是隔离广播、划分安全域、简化管理**。

        **综合布线六个子系统**，这是本章最稳的考点：

        1. **工作区子系统**：终端到信息插座（含跳线）
        2. **水平子系统**：信息插座到楼层配线架
        3. **垂直干线子系统**：楼层配线架到设备间主配线架
        4. **设备间子系统**：主配线架、网络设备所在
        5. **管理子系统**：配线架与跳线管理（有的教材并入设备间）
        6. **建筑群子系统**：楼与楼之间的连接

        判别方法：**看两端接哪里**。工作区是「终端到插座」，水平是「插座到楼层架」，垂直是「楼层架到主机房」，建筑群是「楼到楼」。

        **机房工程要点**：UPS 保障断电续航、精密空调控制温湿度、防雷接地、气体消防（不能用喷水）、防静电地板、门禁与监控。

        ### 例题

        某办公楼共 12 层，需建设办公网络。设计要求：每层设楼层配线间，一层设中心机房，各楼层信息点至本层配线间采用双绞线，楼层配线间至中心机房采用光纤。以下对应正确的是：

        A. 信息点到本层配线间属垂直干线子系统
        B. 楼层配线间至中心机房属垂直干线子系统
        C. 楼层配线间至中心机房属建筑群子系统
        D. 信息插座本身属于设备间子系统

        **答案 B。** 楼层配线间到中心机房（设备间）的跨层连接就是**垂直干线子系统**，题干里的光纤正是干线的常见介质。

        A 把水平与垂直弄反了。信息点到本层配线架是水平子系统，因为它在**同一楼层平面内**。

        C 错在建筑群的定义：那是**不同建筑物之间**的连接。同一栋楼内的跨层不是建筑群。

        D 把末端部件归错了层，信息插座属于工作区子系统的边界。

        ### 怎么考

        **单选题**四类：OSI 分层与协议归属、端口号、综合布线六子系统的判别、集成五个层面的定位。

        **判断题**常见两句：
        - 「交换机工作在网络层」——错，普通交换机工作在数据链路层（三层交换机才具路由功能）
        - 「水平子系统使用光纤」——通常错，水平子系统一般用双绞线，光纤用于垂直干线

        **案例题**常考「网络改造或机房建设方案评审」，问方案缺陷。常见失分点：未做地址与 VLAN 规划、未考虑冗余（单链路、单电源）、机房消防用了水喷淋、综合布线未按六子系统划分导致责任不清。

        **一层容易漏的**：**集成不只是技术活，还包括接口责任的界定**。多个厂商的设备拼在一起，出问题时谁负责？标准做法是明确接口规范与联调责任，必要时由总集成方统一负责。案例题里出现「互相推诿」，答案就要落到「缺少集成总体责任与接口管理」。

  - id: KP-0308
    module_id: S3
    parent: null
    name: 信息安全工程
    ref: "第8章"
    note:
      summary: 信息安全工程考 CIA 三要素、等级保护五级、对称与非对称加密的分工，落脚点是可落地的防护措施。
      body: |-
        ### 要素

        **信息安全的基本属性**，CIA 三要素先记牢：

        - **保密性**：信息不被未授权者获取（靠加密、权限、脱敏）
        - **完整性**：信息不被未授权篡改（靠哈希校验、数字签名）
        - **可用性**：授权者需要时能正常访问（靠冗余、备份、抗攻击）

        在此之上常补两条：**可控性**（信息传播可控）与**不可否认性**（行为不可抵赖，靠数字签名实现）。

        **等级保护五个级别**，对应关系要清楚：

        | 级别 | 名称 | 侵害客体与程度 |
        | --- | --- | --- |
        | 第一级 | 自主保护 | 公民、法人合法权益，轻微损害 |
        | 第二级 | 指导保护 | 公民法人权益或社会秩序，严重损害 |
        | 第三级 | 监督保护 | 社会秩序与公共利益，严重损害 |
        | 第四级 | 强制保护 | 社会秩序与公共利益，特别严重损害 |
        | 第五级 | 专控保护 | 国家安全，特别严重损害 |

        **多数政务与重要行业系统定三级**，这是常识性判断依据。

        **对称加密与非对称加密的分工**是本章最核心的对比：

        | 对比项 | 对称加密 | 非对称加密 |
        | --- | --- | --- |
        | 密钥 | 一把，加解密同一把 | 一对，公钥与私钥 |
        | 算法 | DES、3DES、AES、SM4 | RSA、ECC、SM2 |
        | 速度 | 快 | 慢（约为对称的千分之一量级） |
        | 用途 | 大量数据加密 | 密钥交换、签名、身份认证 |
        | 难点 | 密钥分发 | 计算开销大 |

        **实务中两者配合**：用非对称加密安全地传递对称密钥，再用对称密钥加密业务数据，这就是**混合加密**，HTTPS 就是这么做的。

        **哈希与数字签名**：哈希（MD5、SHA 系列）是单向摘要，用于校验完整性。**数字签名用私钥签名、公钥验证**——注意方向与加密相反（加密是公钥加密、私钥解密），这个反直觉点是必考陷阱。

        **数字证书与 PKI**：CA 为公钥签发证书，解决「公钥是不是真的属于他」的问题。PKI 提供证书签发、吊销、验证的整套体系。

        **常见安全设备与部署位置**：

        | 设备 | 作用 | 部署 |
        | --- | --- | --- |
        | 防火墙 | 访问控制，按规则过滤 | 网络边界，串联 |
        | IDS | 入侵检测，只报警不阻断 | 旁路 |
        | IPS | 入侵防御，检测并阻断 | 串联 |
        | WAF | 防护 Web 应用攻击 | Web 服务器前 |
        | 堡垒机 | 运维操作审计与管控 | 运维入口 |
        | VPN | 加密远程接入 | 边界 |

        **IDS 旁路、IPS 串联**是高频判别点。

        **风险评估四要素**：资产、威胁、脆弱性、风险。关系是「威胁利用脆弱性，对资产造成影响，形成风险」。安全措施的作用是降低脆弱性或削减威胁影响。

        **应急响应四阶段**：准备（预案与演练）、检测（发现与研判）、处置（遏制、根除、恢复）、总结（复盘与改进）。

        ### 例题

        某单位要求：业务数据在网络传输中要防止被窃听，同时要能证明数据确实由指定发送方发出、且中途未被篡改。以下方案正确的是：

        A. 仅用对称加密传输数据即可满足两项要求
        B. 用对称加密保护数据机密性，同时用发送方私钥对数据摘要签名
        C. 用接收方私钥加密数据，即可同时保证机密性与来源真实性
        D. 用哈希算法加密数据，既保密又能验证来源

        **答案 B。** 两个需求对应两种机制：机密性靠加密（对称即可，效率高），来源真实与完整性靠数字签名（发送方私钥签名、接收方用其公钥验证）。

        A 只解决机密性。对称加密无法证明是谁发的，也无法防篡改。

        C 混淆了密钥方向。用**接收方私钥**加密，只有接收方能解，其他人也能用接收方公钥解，等于没有机密性，而且完全不涉及发送方身份。

        D 把哈希当加密。哈希是单向摘要，不可逆，不能用来还原数据，只能校验完整性。

        ### 怎么考

        **单选题**极高频：CIA 三属性的对应措施、等级保护级别判断、对称与非对称的算法归类、IDS 与 IPS 的部署方式、数字签名的密钥方向。

        **判断题**常见三句：
        - 「数字签名用公钥签名、私钥验证」——错，正好相反
        - 「IDS 可以主动阻断攻击」——错，那是 IPS
        - 「等级保护三级由企业自主定级即可」——错，需经专家评审与主管部门备案

        **案例题**常考「安全方案评审」，问缺失项。标准角度：缺边界防护（防火墙、WAF）、缺入侵检测与审计（IDS、日志、堡垒机）、缺数据加密与脱敏、缺权限与身份管理（最小权限、双因素）、缺备份与应急演练、未做等级保护定级备案。

        **一层容易漏的**：**安全是管理与技术两条腿**。只上设备不改制度，等于把门锁好却把钥匙挂在门上。案例题问「安全事件原因」，答「制度缺失、权限过大、无审计、无演练」往往比答「未部署某设备」更得分。


  - id: KP-0401
    module_id: S4
    parent: null
    name: 组织保障（PMO/配置管理）
    ref: "第15章"
    note:
      summary: 组织保障讲两件事——组织结构决定项目经理有多大权，配置管理保证成果不被改乱。
      body: |-
        ### 要素

        **组织结构有三种基本形态，判别标准是「项目经理对资源与预算的控制力」**：

        | 类型 | 项目经理角色 | 权力 | 特点 |
        | --- | --- | --- | --- |
        | 职能型 | 协调员，无实权 | 最小 | 按部门分工，项目跨部门协调难 |
        | 弱矩阵 | 协调员 | 较小 | 有项目组但仍以部门为主 |
        | 平衡矩阵 | 项目经理 | 中等 | 有正式任命的项目经理，权力与职能经理平衡 |
        | 强矩阵 | 项目经理 | 较大 | 有专职项目管理部门，项目经理对资源控制强 |
        | 项目型 | 项目经理 | 最大 | 资源专属项目，项目结束人员解散 |

        权力从小到大排：**职能型 < 弱矩阵 < 平衡矩阵 < 强矩阵 < 项目型**。这个序列几乎每年考一次。

        **矩阵型的固有矛盾**是**双重汇报**——成员同时向职能经理和项目经理汇报，容易出现资源争夺与考核冲突。题目问「矩阵型组织的主要缺点」，答这一条。

        **PMO 的三种类型，按控制力从弱到强**：

        - **支持型**：顾问角色，提供模板、培训、最佳实践与经验库，不要求服从
        - **控制型**：不仅提供支持，还要求项目遵循组织标准与流程，做合规检查
        - **指令型**：直接管理与控制项目，项目经理向 PMO 汇报

        判别口诀：**支持型给工具、控制型查合规、指令型直接管**。

        **组织过程资产与事业环境因素必须分清**，这是高频对比：

        | 对比项 | 组织过程资产 | 事业环境因素 |
        | --- | --- | --- |
        | 性质 | 组织内部积累，越用越多 | 客观存在，通常不可影响 |
        | 能否改变 | 项目可以更新它 | 项目只能适应 |
        | 例子 | 流程、模板、经验教训库、历史数据、配置管理知识库 | 组织文化、行业标准、法规、市场条件、现有基础设施、现有人力资源状况 |

        判别方法：**「能被项目改的」是过程资产，「只能被动接受的」是环境因素**。

        **配置管理四个活动**：配置项识别、配置控制（含变更控制）、配置状态记录、配置审计。

        **配置库分三库，这是本章最稳的考点**：

        | 库 | 性质 | 谁能改 |
        | --- | --- | --- |
        | 开发库（动态库） | 开发过程中随意修改 | 开发人员 |
        | 受控库（主库） | 存入基线，修改要审批 | 经变更批准后由配置管理员操作 |
        | 产品库（静态库） | 对外发布的成品，只读 | 不允许修改 |

        **基线**是「经批准的快照」，一旦建立，只能通过变更控制流程修改。这正是变更控制与配置管理联动的地方：变更批准的产物，落到配置管理上就是「基线更新」。

        **配置审计分两种**：功能配置审计（FCA）验证**功能与性能是否符合需求**；物理配置审计（PCA）验证**实际交付的组成部分与文档是否与基线一致**。一个查「做得对不对」，一个查「给得全不全」。

        **RACI 责任矩阵**：R 负责执行、A 最终批准、C 需咨询、I 需告知。**A 只能有一个**——这是 RACI 的硬规矩，出现两个 A 就是责任不清。

        ### 例题

        某公司设立项目管理办公室，要求所有项目必须使用统一模板、按季度提交合规自查报告，但项目经理的汇报关系仍在本部门。同时开发人员可直接修改需求文档，上线前再由配置管理员统一归档到发布库。以下判断正确的是：

        A. 该 PMO 属指令型；配置管理做法正确
        B. 该 PMO 属控制型；配置管理做法错误，需求文档应纳入受控库管理
        C. 该 PMO 属支持型；配置管理做法正确
        D. 该 PMO 属控制型；配置管理做法正确

        **答案 B。** 两个判断点都要对。

        PMO 判型看是否「管项目」：它只要求模板与合规，不接管项目经理的汇报关系，所以是**控制型**而不是指令型。

        配置管理判错点更关键：需求文档是**基线的一部分**，必须先入受控库、修改走变更审批。题干里「开发人员可直接修改」意味着基线可以被随意改动，后续所有基于需求的工作都会失真。归档到发布库不等于受控——发布库是成品，不是过程管控。

        ### 怎么考

        **单选题**四类：组织结构对应的项目经理权力排序、PMO 三型的判别、三库归属、组织过程资产与事业环境因素的区分。

        **判断题**常见两句：
        - 「强矩阵组织中项目经理对资源有完全控制权」——错，那是项目型
        - 「配置管理只管代码」——错，文档、计划、基线都是配置项

        **案例题**常考「版本混乱、需求对不上」，标准答法：未建立配置管理（配置项未识别、未建基线）；变更未走审批直接改文件；三库不分（开发与受控混用）；未做配置审计。对策对应写：识别配置项、建立基线、三库分离、变更与配置联动、定期配置审计。

        **一层容易漏的**：配置管理员是**独立角色**，不该由开发人员兼任。自己改自己审等于没有控制。案例题里出现「开发兼配置管理」，是可以直接指出的失分点。

  - id: KP-0402
    module_id: S4
    parent: null
    name: 监理基础知识
    ref: "第16章"
    note:
      summary: 监理的四控三管一协调是本章主线，考的是各阶段做什么，以及监理与承建单位的边界在哪。
      body: |-
        ### 要素

        **监理的三方关系必须先立住**：建设单位（业主）委托监理单位，监理单位**对承建单位实施监督**。三个约束：

        - 监理单位与承建单位**不得有隶属关系或其他利害关系**（否则监督无效）
        - 监理单位**只对建设单位负责**，不对承建单位负责
        - 监理**不替代**承建单位的项目管理，也不替代建设单位的决策

        **四控三管一协调**是记忆主干：

        | 类别 | 内容 |
        | --- | --- |
        | 四控 | 投资控制、进度控制、质量控制、变更控制 |
        | 三管 | 合同管理、信息管理、安全管理 |
        | 一协调 | 协调建设方、承建方及相关方关系 |

        **注意「变更控制」在四控里**，不在三管里——这是最常见的记忆错位。

        **监理的三个阶段**：

        - **设计阶段**：审查设计方案与概算的合理性、可实施性，控制设计质量与投资
        - **实施阶段**：这是主战场——审查开工条件、审批施工方案、旁站与巡视、检查材料设备、验收隐蔽工程、审核进度款、处理变更与索赔
        - **验收阶段**：组织或参与验收、审查竣工资料、出具监理报告、协助移交

        **三级监理文件，编制人与审批人要分清**：

        | 文件 | 谁编 | 谁批 | 用途 |
        | --- | --- | --- | --- |
        | 监理大纲 | 监理单位 | 单位技术负责人 | 投标时用，说明怎么监理 |
        | 监理规划 | 总监理工程师 | 监理单位技术负责人 | 中标后编制，指导整个监理工作 |
        | 监理细则 | 专业监理工程师 | 总监理工程师 | 针对具体专业或工序，可操作 |

        顺序是「大纲 →（中标后）规划 →（分专业）细则」，粒度越来越细。

        **监理的四种现场手段**：

        - **旁站**：关键部位、关键工序全过程现场跟班监督
        - **巡视**：日常巡回检查
        - **平行检验**：监理方独立按比例抽检，与承建方自检并行
        - **见证取样**：材料取样送检时监理在场见证，保证样品真实

        判别：「关键工序全程盯着」是旁站；「按比例自己再查一遍」是平行检验；「看着取样封样」是见证取样。

        **总监理工程师的职责边界**：主持监理工作、签发监理文件与指令、审批施工组织设计、组织工程验收、签发工程款支付证书。**总监不得同时担任多个项目的总监**（有数量与条件限制），这一点在判断题里出现过。

        ### 例题

        某政务信息化项目实施阶段，承建单位完成核心机房隐蔽工程施工后，直接封板并通知监理验收。监理工程师要求拆开检查，承建单位以「工期紧」为由拒绝。以下处理正确的是：

        A. 监理可同意先封板，后续再抽查
        B. 隐蔽工程未经验收不得覆盖，承建单位应拆除检查，费用与工期责任由承建单位承担
        C. 由建设单位决定是否拆开，监理无权要求
        D. 只要承建单位出具自检合格报告即可免检

        **答案 B。** 隐蔽工程的核心规则就是「**未经验收不得覆盖**」，因为一旦覆盖就无法验证。责任也在承建单位：未通知验收就自行覆盖，属于程序违规，拆检费用与工期由其承担。

        A 把规则让位于工期压力，等于放弃了质量控制的唯一窗口。

        C 混淆了权限：监理依合同授权实施质量监督，不需要为每个技术判断请示建设单位。

        D 用自检替代他检，这是监理存在的意义所在——平行检验与旁站正是为了不依赖承建方自检。

        ### 怎么考

        **单选题**四类：四控三管一协调的归类、三级监理文件的编制与审批人、四种现场手段的判别、监理与承建单位的关系。

        **判断题**常见三句：
        - 「监理单位可同时接受承建单位委托」——错，存在利害冲突
        - 「监理规划由专业监理工程师编制」——错，由总监理工程师编制
        - 「旁站适用于所有工序」——错，只用于关键部位与关键工序

        **案例题**常考「监理履职不到位」，问问题与改进。标准角度：未审查开工条件、未审批施工方案、关键工序未旁站、材料未见证取样、变更未审核、进度款未核实即签认。改进对策对应到监理手段与文件上。

        **一层容易漏的**：监理的**信息管理**包含会议纪要、监理日志、月报、往来文函的归档。案例题里出现「过程无记录、事后无法举证」，答案就要落到「监理信息管理缺失」——这是很容易被忽略的一条三管。


  - id: KP-0501
    module_id: S5
    parent: null
    name: 法律法规
    ref: "第17章"
    note:
      summary: 法规考的是合同、招标投标、知识产权三条线，重点在时限、金额与责任划分这些硬数字。
      body: |-
        ### 要素

        **合同编要点**：合同成立经**要约**与**承诺**两个环节，承诺生效时合同成立。违约责任四种承担方式：继续履行、采取补救措施、赔偿损失、支付违约金（或定金）。

        两条硬规则：
        - **定金不得超过主合同标的额的 20%**，超过部分不产生定金效力
        - 不可抗力导致不能履行的，**部分或全部免除责任**，但迟延履行后发生不可抗力的不免责

        **招标投标法的硬数字，这一组最容易考**：

        | 事项 | 时限或金额 |
        | --- | --- |
        | 招标文件发售期 | 不少于 5 日 |
        | 投标文件编制时间（发出至截止） | 不少于 20 日 |
        | 中标候选人公示期 | 不少于 3 日 |
        | 中标通知书发出后签订合同 | 30 日内 |
        | 投标保证金 | 不超过招标项目估算价的 2% |
        | 履约保证金 | 不超过中标合同金额的 10% |
        | 邀请招标的被邀请人 | 不少于 3 家 |

        **必须招标的范围**（三条任一即属）：大型基础设施与公用事业等关系社会公共利益、公众安全的项目；全部或部分使用国有资金投资或国家融资的项目；使用国际组织或外国政府资金的项目。

        **废标与无效投标的常见情形**：投标文件未按要求密封、无单位盖章与法人签字、逾期送达、报价超过最高限价、投标人不具备资格。**串通投标**与**以他人名义投标**属违法行为，中标无效。

        **政府采购的六种方式**：公开招标（主方式）、邀请招标、竞争性谈判、单一来源采购、询价、竞争性磋商。**单一来源**适用条件最严：只能从唯一供应商处采购、发生不可预见的紧急情况、需保证一致性或服务配套且追加金额不超过原合同金额 10%。

        **知识产权三类的期限，必须分清起算点**：

        | 类型 | 保护期 | 起算 |
        | --- | --- | --- |
        | 发明专利 | 20 年 | 自申请日 |
        | 实用新型 | 10 年 | 自申请日 |
        | 外观设计 | 15 年 | 自申请日 |
        | 商标权 | 10 年，可无限续展 | 自核准注册日 |
        | 软件著作权（自然人） | 终生加死后 50 年 | — |
        | 软件著作权（法人） | 50 年 | 自首次发表 |

        **专利与商标的期限从申请或注册日起算，不是从授权日起算**，这个差别是典型的失分点。

        **数据与网络三条法律的定位**：网络安全法管网络运行安全与关键信息基础设施保护；数据安全法管数据分类分级与数据出境；个人信息保护法管个人信息处理的合法性基础。个人信息处理的核心原则：**合法、正当、必要、最小化，告知并取得同意**。

        ### 例题

        某国有投资的公司办公系统升级项目，估算价 800 万元。招标文件于 3 月 1 日发出，投标截止定在 3 月 12 日。评标结束后 4 月 10 日发出中标通知书，5 月 20 日签订合同。投标人按要求提交保证金 20 万元。以下说法正确的是：

        A. 该项目可不招标，因属企业内部系统
        B. 投标截止时间与合同签订时间均违反法定时限
        C. 保证金金额符合规定，时限也均合法
        D. 仅合同签订时间违法，投标时间可协商确定

        **答案 B。** 两个违规点：

        投标文件编制时间只有 11 天，**法定不少于 20 日**；合同应在中标通知书发出后 **30 日内**签订，4 月 10 日到 5 月 20 日已 40 天。

        A 错在资金来源：国有资金投资项目属必须招标范围，与「内部系统」无关。

        C 的保证金部分是对的（800 万的 2% 是 16 万，交 20 万其实**已超**），所以 C 整体仍错——这类题要看全每个条件，别只看时限。

        D 错在「可协商」：法定时限是强制性规定，不能由双方约定缩短。

        ### 怎么考

        **单选题**三组高频：招标投标的时限与金额、知识产权保护期与起算点、政府采购方式的适用条件。

        **判断题**常见三句：
        - 「定金可以超过合同额的 30%」——错，上限 20%
        - 「专利权自授权日起算」——错，自申请日
        - 「单一来源采购无需任何论证」——错，需论证与审批

        **案例题**常以「合同纠纷」出现，问责任划分。答题顺序：先定合同是否有效成立，再看是否有一方违约，再看是否有免责事由（不可抗力），最后落到违约责任的承担方式与金额。

        **一层容易漏的**：**软件著作权归属默认规则**——职务作品原则上归单位，委托开发则按合同约定，**合同未约定的归受托方（开发者）**。这一条与直觉相反，是案例题的高频陷阱：甲方出钱开发，若合同没写归属，著作权可能在乙方手里。

  - id: KP-0502
    module_id: S5
    parent: null
    name: 标准规范
    ref: "第17章"
    note:
      summary: 标准规范考的是标准分级与强制、推荐性的区分，以及信息技术服务与文档标准这类可背的号。
      body: |-
        ### 要素

        **标准的五个层级，从高到低**：

        | 层级 | 代号 | 说明 |
        | --- | --- | --- |
        | 国家标准 | GB、GB/T、GB/Z | 全国范围内统一 |
        | 行业标准 | 如 SJ、YD、JR | 某行业范围内统一，需报国务院标准化主管部门备案 |
        | 地方标准 | DB 加行政区划代码 | 本行政区域内统一 |
        | 团体标准 | T 加团体代号 | 学会、协会等社会团体制定，供自愿采用 |
        | 企业标准 | Q 加企业代号 | 企业内部统一 |

        **层级关系**：下一级标准不得与上一级标准相抵触；**企业标准可以严于国家标准，不能低于**。这是常考的一句。

        **代号第三位最能区分性质**：

        - **GB**：强制性国家标准，**必须执行**
        - **GB/T**：推荐性国家标准，**自愿采用**
        - **GB/Z**：指导性技术文件，供参考

        **推荐性标准的约束力有一个转折**：一旦被法律法规引用、或被合同约定采用，就**在该范围内具有强制约束力**。这一条是判断题的经典考点——「推荐性标准可以不执行」这句话只在不被引用时成立。

        **标准化法（2018 年修订）的两个变化**：一是确立**团体标准**的法律地位；二是实行**企业标准自我声明公开**制度，企业不再需要逐级备案，但要公开声明并接受监督。

        **信息技术服务标准（ITSS）** 是国内 IT 服务领域的标准体系，覆盖咨询设计、运维、运营、数据服务等业务，与 KP-0303 的生命周期五阶段配套使用。

        **软件文档标准**：GB/T 8567 规定了软件文档的编制要求。核心文档类型包括可行性研究报告、项目开发计划、软件需求规格说明、概要设计说明、详细设计说明、数据库设计说明、测试计划、测试报告、用户手册、操作手册、开发进度月报、项目开发总结报告。

        **判别用法**：题目问「某文档属于哪个阶段」，按「可行性 → 计划 → 需求 → 设计 → 测试 → 用户文档 → 总结」的顺序对位即可。

        **系统集成资质的变化要清楚**：计算机信息系统集成企业资质**已取消行政审批**，转为行业自律与第三方评估。考试若问「是否仍需取得行政审批」，答不需要。

        ### 例题

        某项目合同技术附件中写明「系统安全设计应符合 GB/T 22239 的要求」，实际实施时承建方称「GB/T 是推荐性标准，可以不执行」，仍按自己的内部规范实施。以下判断正确的是：

        A. 承建方说法正确，推荐性标准不具有约束力
        B. 承建方说法错误，GB/T 一旦被合同引用即在该合同范围内具有约束力
        C. 承建方说法正确，除非该标准被法律法规强制引用
        D. 应由监理单位决定是否采用该标准

        **答案 B。** 推荐性标准的「推荐」是针对**未被引用**的一般情形。合同引用后，它成为双方的约定内容，不执行就是违约——约束力来源从「标准本身」变成了「合同」。

        A 与 C 都在讲标准自身效力，忽略了合同这一层。

        C 把约束力来源限死在「法规引用」，漏掉合同引用这条更常见的路径。

        D 混淆了权限：标准适用性由合同约定，监理只能监督执行，不能替代合同解释。

        ### 怎么考

        **单选题**四类：标准代号的强制性判读（GB、GB/T、GB/Z）、标准层级关系、标准被引用后的效力、常见标准号的适用领域。

        **判断题**常见三句：
        - 「企业标准不得高于国家标准」——错，可以严于
        - 「推荐性标准一律可以不执行」——错，被引用后具有约束力
        - 「系统集成资质仍为行政审批」——错，已取消

        **案例题**偶考「未按标准实施」，问责任。答题要点：先确认该标准是否被合同或法规引用（决定是否强制），再确认承建方偏离的事实，最后落到违约责任与整改要求。

        **一层容易漏的**：标准的**版本时效**。引用标准时要写明年号（如 GB/T 8567-2006），否则默认适用最新版本。案例题里出现「按旧版标准交付导致不达标」，答案就是「未明确标准版本、未跟踪标准更新」。

  - id: KP-0503
    module_id: S5
    parent: null
    name: 职业道德规范
    ref: "第18章"
    note:
      summary: 职业道德考的是几条内核，落到案例上就是该不该做、出了问题报不报，边界比条文重要。
      body: |-
        ### 要素

        **职业道德的六条基本要求**：遵纪守法、诚实守信、客观公正、爱岗敬业、保守秘密、终身学习。

        落到信息系统项目管理师这个角色上，重点在三条**容易产生冲突的场景**：

        **第一，客观公正与利益冲突**。职业判断不能受利益影响：不得收受供应商回扣、礼品、宴请；不得在与项目有利益关系的单位兼职或持股；评估与验收结论必须基于事实而非关系。**遇到利益冲突要主动申报并回避**，「申报回避」这个动作比「拒绝」更专业。

        **第二，保密义务**。范围包括客户业务数据、商业机密、系统漏洞信息、合同价格。关键点有两个：**保密义务不因离职而终止**；**未经授权不得将项目资料用于其他用途**（包括写进自己的作品与案例分享）。

        **第三，发现问题必须报告**。这是职业道德里最容易被考的场景：上级要求伪造测试记录、要求隐瞒质量缺陷、要求虚报进度以领取进度款。正确处理是**拒绝执行并向上级或更高层报告，必要时向监管方反映**。

        注意这里的边界：**服从管理不等于服从违法指令**。以「领导让我这么做的」作为辩解，在职业道德题里永远是错误选项。

        **知识产权与正版化**：不擅自复制、传播他人软件与文档；项目中使用的第三方组件要确认授权；不使用盗版工具开发交付物。这一条与 KP-0501 的知识产权部分相互支撑。

        **对公众安全的责任**。当项目涉及公共安全（如医疗、交通、政务系统）且存在已知风险时，职业责任优先于合同义务与企业利益。典型题：客户要求先上线后补安全整改，项目经理应如实报告风险并坚持整改后再上线。

        **常见的行为边界清单**：

        | 场景 | 正确做法 |
        | --- | --- |
        | 客户送购物卡 | 婉拒，无法拒绝时登记上交 |
        | 上级要求改测试结论 | 拒绝并书面报告，留痕 |
        | 离职后带走项目资料 | 不得带走，保密义务延续 |
        | 供应商邀请旅游 | 拒绝，属利益输送 |
        | 发现系统有严重漏洞 | 内部报告并推动修复，不对外公开 |

        ### 例题

        项目临近验收，测试发现关键模块存在两个高危缺陷。客户方负责人表示「先验收上线，下个版本再修」，项目经理的上级也同意，并暗示「验收报告可以按通过写」。项目经理的正确做法是：

        A. 按上级与客户意见办理，验收报告写通过，缺陷记入下期
        B. 在验收报告如实记录缺陷与风险，书面说明高危缺陷的影响，坚持整改或取得客户书面风险确认后再上线
        C. 直接向媒体或公众披露缺陷，倒逼整改
        D. 辞职并拒绝在验收报告上签字

        **答案 B。** 关键在「如实记录 + 书面留痕 + 风险确认」。项目可能因业务原因必须上线，但**记录不能假**，风险要让决策方书面确认。这样既守住职业底线，也没有越权替客户做决策。

        A 是伪造记录，属明确的职业道德违背，也是本题唯一绝对不能选的。

        C 走过头了：对外披露不是首选路径，应先走内部与监管渠道，且可能违反保密义务。

        D 是回避问题。职业道德要求的是「坚持正确做法」，不是「退出」。

        ### 怎么考

        **单选题**三类：利益冲突的处理方式、保密义务的范围与期限、发现问题的正确处置路径。

        **判断题**常见三句：
        - 「离职后保密义务自动解除」——错
        - 「为赶工期可以简化测试并口头告知客户」——错，缺陷与简化必须书面记录
        - 「客户要求就是最高准则」——错，违法与违背职业规范的要求应拒绝

        **案例题**极少单独考职业道德，但它常作为「质量与验收」类题目的隐含得分点。答「如实记录缺陷并书面报告」比答「与客户协商」更得分，因为前者体现职业底线。

        **一层容易漏的**：职业道德还包括**对同行与团队的公正**。例如不把团队成果据为己有、不因个人好恶评价成员绩效。这类内容在案例题里以「团队士气低落、骨干离职」的形式出现，答「绩效评价不客观、缺少认可机制」即可。


  - id: KP-0601
    module_id: S6
    parent: null
    name: 计算题专项
    ref: "第13章"
    note:
      summary: 计算题专项把上午卷会算的几类题集中练，核心是公式记准、单位统一、先判条件再代数字。
      body: |-
        ### 要素

        **一、三点估算（PERT）**

        - 期望工期 = (乐观 + 4 × 最可能 + 悲观) ÷ 6
        - 标准差 = (悲观 − 乐观) ÷ 6

        标准差用来判断概率：**正负 1 个标准差约 68.26%，正负 2 个约 95.46%，正负 3 个约 99.73%**。题目问「在多少天内完成的概率约 95%」，就是期望值加减两个标准差。

        **二、沟通渠道数**

        渠道数 = n × (n − 1) ÷ 2，n 是包括项目经理在内的人数。

        算「增加了多少条渠道」要用新值减旧值。例：8 人时 28 条，增到 12 人时 66 条，增加 38 条。**人数翻倍，渠道接近四倍**，这是它常被用来解释「团队越大沟通越难」的原因。

        **三、决策树与期望货币值（EMV）**

        各分支用「概率 × 损益」求和，再减去投入，得到净期望值，选净期望值最大的方案。

        **四、净现值与投资回收期**

        - 静态回收期 = 累计净现金流转正的前一年数 + （上年累计绝对值 ÷ 当年净现金流）
        - 净现值为正说明按给定折现率是划算的；多方案比较选净现值大者
        - **动态回收期一定长于静态回收期**，因为折现把未来的钱打折了

        **五、加权评分**

        各方案按权重乘得分求和。注意权重之和须为 1（或 100%），否则先归一化。

        **六、资源平衡与资源平滑**

        | 方法 | 是否改变关键路径 | 是否延长工期 |
        | --- | --- | --- |
        | 资源平衡 | 会 | 通常会延长 |
        | 资源平滑 | 不会（只在时差内调） | 不延长 |

        这是判断题的高频点：**资源平滑不延长工期，资源平衡可能延长**。

        **七、成本估算四法**

        类比估算（自上而下，快、粗、依赖历史数据）、参数估算（用模型与参数，如每功能点成本）、自下而上估算（最准、最费时）、三点估算（应对不确定性）。

        **八、常见失分点清单**

        - 单位不统一（万元与元混用、天与周混用）
        - 把 PV 当 EV（见 KP-0206）
        - 时差算成「两个活动工期之差」
        - 概率题忘记把标准差加减到期望值上，直接拿悲观值回答
        - 决策树忘记减去投入

        ### 例题

        某活动乐观工期 8 天、最可能 12 天、悲观 28 天。项目团队共 8 人，业主要求增加 4 名成员参与。以下两个结果正确的是：

        **第一问：期望工期与标准差**

        期望工期 = (8 + 4×12 + 28) ÷ 6 = (8 + 48 + 28) ÷ 6 = 84 ÷ 6 = **14 天**

        标准差 = (28 − 8) ÷ 6 = 20 ÷ 6 ≈ **3.33 天**

        **第二问：沟通渠道增加数**

        原 8 人：8 × 7 ÷ 2 = 28 条
        增到 12 人：12 × 11 ÷ 2 = 66 条
        增加 **38 条**

        **三个常见错法**：期望值算成 (8+12+28)÷3 = 16（那是简单平均，不是 PERT）；标准差算成 (28−8)÷2 = 10（除错了分母）；沟通渠道只算新增 4 人内部的 6 条（漏掉新人与老人的交叉渠道）。

        顺带一句判断：团队从 8 人增到 12 人，渠道增加 38 条远超原有 28 条，这就是「加人反而更慢」的算术依据——布鲁克斯定律的量化来源。

        ### 怎么考

        **上午卷计算题固定 1 到 3 道**，考法极其稳定：三点估算、沟通渠道、挣值、关键路径、净现值、决策树轮换出现。

        **答题纪律三条**：先写公式再代数字（部分分靠这个）、单位写在结果后面、算出多个结果时按题号分行写清。

        **判断题**常考：资源平滑是否延长工期、动态与静态回收期的大小关系、标准差越小说明风险越大还是越小（越小说明估算越集中、风险越小）。

        **案例题**里计算常作为一小问出现，例如「计算当前 SPI 与 CPI 并判断状态」。这类小问必须拿满，因为它是客观给分，不依赖文字表述。

        **一层容易漏的**：三点估算里「最可能」的权重是 4，不是平均值参与。很多人习惯性除以 3，这是最普遍的错，且一旦错，后面基于期望值的概率题全错。

  - id: KP-0602
    module_id: S6
    parent: null
    name: 关键路径与网络图
    ref: "第11章"
    note:
      summary: 关键路径是网络图里最长的一条路，路径上总时差为零，压缩工期只能压关键活动。
      body: |-
        ### 要素

        **两种网络图必须先分清**：

        | 类型 | 表示方式 | 简称 |
        | --- | --- | --- |
        | 单代号网络图 | 节点表示活动，箭线表示逻辑关系 | AON |
        | 双代号网络图 | 箭线表示活动，节点表示事件 | AOA |

        **双代号里有「虚活动」**：只表示逻辑关系，**不消耗时间也不消耗资源**，用虚箭线表示，作用是把两条并行路径的依赖关系表达清楚。问「虚活动的工期是多少」，答 0。

        **四个时间参数与算法**：

        - ES 最早开始、EF 最早完成：EF = ES + 历时（**正推，取最大值**）
        - LS 最晚开始、LF 最晚完成：LS = LF − 历时（**逆推，取最小值**）
        - 总时差 TF = LS − ES = LF − EF
        - 自由时差 FF = 紧后活动的最早开始最小值 − 本活动最早完成

        记忆要点：**正推取大、逆推取小**。取大是因为一个活动要等所有前置都完成才能开始；取小是因为不能拖累任何一个紧后活动。

        **关键路径的两条等价定义**：

        1. 从起点到终点**历时最长**的路径
        2. 路径上所有活动的**总时差为 0**

        两个定义互为验证。关键路径**可能不止一条**，这一点常被忽略——如果两条路径历时相同，两条都是关键路径。

        **关键路径会变化**，这是最需要理解的动态性质：非关键路径上的活动延误，一旦超过它的总时差，这条路径就变成新的关键路径，原关键路径随之失去关键地位。

        **压缩工期的三条限制**：

        - 只能压**关键活动**，压非关键活动对总工期没用
        - 压到一定程度会出现**关键路径转移**，继续压原来那条不再缩短总工期
        - 压缩有代价：赶工增加成本，快速跟进增加返工风险

        ### 例题

        某项目活动及依赖关系如下：A 历时 3 天；B 历时 4 天，紧前 A；C 历时 2 天，紧前 A；D 历时 5 天，紧前 B 与 C；E 历时 3 天，紧前 D。求关键路径、总工期，以及 C 的总时差与自由时差。

        **第一步，列出所有路径**：

        - 路径一：A → B → D → E = 3 + 4 + 5 + 3 = **15 天**
        - 路径二：A → C → D → E = 3 + 2 + 5 + 3 = **13 天**

        最长的是路径一，所以**关键路径是 A-B-D-E，总工期 15 天**，A、B、D、E 的总时差都是 0。

        **第二步，算 C 的时差**：

        ES(C) = 3（A 完成时），EF(C) = 3 + 2 = 5
        D 的最晚开始 LS(D) = LF(D) − 5，而 LF(D) = LS(E) = 15 − 3 = 12，所以 LS(D) = 7
        LS(C) = LS(D) − 2 = 7 − 2 = 5
        **总时差 TF(C) = LS(C) − ES(C) = 5 − 3 = 2 天**

        **自由时差 FF(C) = ES(D) − EF(C) = 7 − 5 = 2 天**

        两者的含义不同：C 可以晚 2 天开始而不影响总工期（总时差），且晚 2 天也**不影响 D 的最早开始**（自由时差）。此题两者恰好相等，但一般不等。

        **三个常见错法**：把关键路径当成「活动最多的路径」（应看历时之和）；把总时差算成「本活动工期减去最短路径」（没有这个概念）；忘记 D 有两个紧前，导致漏算路径二。

        ### 怎么考

        **上午卷必考一到两道**，形式固定：给活动表求关键路径、总工期、某活动的总时差或自由时差、压缩某活动后的工期变化。

        **判断题**常见三句：
        - 「关键路径只有一条」——错，可能多条
        - 「压缩任何活动都能缩短工期」——错，只能压关键活动
        - 「虚活动消耗资源但不耗时」——错，两个都不消耗

        **案例题**里的用法是「工期延误分析」：某活动延误 5 天，是否影响总工期？判断方法就是拿延误天数与它的总时差比较——小于等于总时差不影响，大于才影响，超出部分顺延。

        **一层容易漏的**：自由时差与总时差不等时，**总时差大的活动更安全**。因为总时差是与终点挂钩的余量，自由时差只与紧后活动挂钩。答题时若只写一个，写总时差更有说服力。

  - id: KP-0603
    module_id: S6
    parent: null
    name: 英文专业术语
    ref: "全篇"
    note:
      summary: 英文题只考术语对应关系，把高频缩写与全称对上号就够，不考语法也不考长句理解。
      body: |-
        ### 要素

        **英文题的真实难度很低**：题面通常是一句定义或一个场景，四个选项是术语。所以准备方法是**只记对应，不背语法**。

        **五大过程组**：

        | 英文 | 中文 |
        | --- | --- |
        | Initiating | 启动 |
        | Planning | 规划 |
        | Executing | 执行 |
        | Monitoring and Controlling | 监控 |
        | Closing | 收尾 |

        **十大知识领域**（按英文首字母顺序更好记）：

        | 英文 | 中文 |
        | --- | --- |
        | Integration | 整合（整体） |
        | Scope | 范围 |
        | Schedule | 进度 |
        | Cost | 成本 |
        | Quality | 质量 |
        | Resource | 资源 |
        | Communications | 沟通 |
        | Risk | 风险 |
        | Procurement | 采购 |
        | Stakeholder | 相关方 |

        **高频缩写对照**：

        | 缩写 | 全称 | 中文 |
        | --- | --- | --- |
        | WBS | Work Breakdown Structure | 工作分解结构 |
        | PMO | Project Management Office | 项目管理办公室 |
        | CCB | Change Control Board | 变更控制委员会 |
        | EVM | Earned Value Management | 挣值管理 |
        | PV / EV / AC | Planned / Earned / Actual Value（Cost） | 计划值 / 挣值 / 实际成本 |
        | SPI / CPI | Schedule / Cost Performance Index | 进度 / 成本绩效指数 |
        | ETC / EAC | Estimate To Complete / At Completion | 完工尚需 / 完工估算 |
        | SLA | Service Level Agreement | 服务级别协议 |
        | RFP | Request for Proposal | 请求建议书 |
        | SOW | Statement of Work | 工作说明书 |
        | RACI | Responsible, Accountable, Consulted, Informed | 责任分配矩阵 |
        | UAT | User Acceptance Testing | 用户验收测试 |
        | POC | Proof of Concept | 概念验证 |
        | ROI | Return on Investment | 投资回报率 |
        | TCO | Total Cost of Ownership | 总拥有成本 |

        **角色与文档**：

        | 英文 | 中文 |
        | --- | --- |
        | Project Sponsor | 项目发起人 |
        | Steering Committee | 指导委员会 |
        | Functional Manager | 职能经理 |
        | Project Charter | 项目章程 |
        | Business Case | 商业论证 |
        | Scope Statement | 范围说明书 |
        | Risk Register | 风险登记册 |
        | Lessons Learned | 经验教训 |
        | Issue Log | 问题日志 |

        **几个最容易混的术语**：

        - **Baseline** 基线，不是「底线」
        - **Milestone** 里程碑，**工期为 0** 的检查点
        - **Float / Slack** 时差，两个词同义
        - **Crashing** 赶工（加资源），**Fast Tracking** 快速跟进（改并行）
        - **Scope Creep** 范围蔓延，指未经控制的逐步扩范围
        - **Deliverable** 可交付成果，不只是「交付物」

        ### 例题

        Which of the following best describes a document that formally authorizes the existence of a project and gives the project manager authority to apply organizational resources?

        A. Business Case
        B. Project Charter
        C. Scope Statement
        D. Work Breakdown Structure

        **答案 B。** 题干三个关键词分别是「正式授权项目存在」「授予项目经理动用组织资源的权力」——这正是 Project Charter 的定义。

        A 的 Business Case 是**立项前的可行性论证**，说明「为什么值得做」，它不授权，是章程的输入。

        C 的 Scope Statement 描述范围，是规划阶段产物，晚于章程。

        D 的 WBS 是范围分解结果，更晚。

        **做这类题的技巧**：不逐词翻译，先抓「时间定位」——这份文档出现在项目哪个阶段？章程是最早的正式文件，凡题干出现 authorize（授权）、exists（存在）这类词，基本都指向它。

        ### 怎么考

        **单选题一到两道**，考法两种：给英文定义选术语、给中文术语选英文缩写。

        **判断题**（少数年份出现英文判断）：重点看否定词与量词，如 not、all、only。**含 all 与 only 的表述通常错**，这是英文题的通用经验。

        **不考的内容要明确**：不考长句语法、不考阅读理解、不考专业文献翻译。所以不要在英文语法上耗时间，把缩写表背熟即可。

        **一层容易漏的**：答题时注意题干里的 **process group**（过程组）与 **knowledge area**（知识领域）是两个维度，选项里常把范围管理的活动与规划过程组混着放。看清问的是哪个维度再选。

  - id: KP-0604
    module_id: S6
    parent: null
    name: 案例题答题结构
    ref: "第10-14章"
    note:
      summary: 案例题得分靠结构不靠文采，按找问题、析原因、给对策、上依据四步写，每条都落到动作。
      body: |-
        ### 要素

        **案例题的分值结构**：下午卷三道案例，每题含若干小问，小问类型就五种——找问题、析原因、提措施、算指标、判是非。**同一道题里通常组合出现**。

        **四步答题骨架**：

        1. **定位**：这个问题出在哪个管理过程（点出过程名，阅卷老师按术语给分）
        2. **原因**：缺什么（缺文件、缺流程、缺角色、缺评审）
        3. **对策**：补什么、谁来做、什么时候做、做到什么程度
        4. **依据**：教材条目或规范要求（一句话即可）

        **得分点的四个特征**，写完自查：

        - **分条**：每行一个点，编号 1.2.3.，不要写成一段
        - **动宾结构**：动词开头。「建立变更控制流程」「组织需求评审」「更新范围基准」
        - **术语准确**：用教材术语，别用口语。写「未建立范围基准」而不是「没有范围标准」
        - **有量化**：写「每周例会」「不超过 2 小时响应」，比「加强沟通」得分高

        **常考领域的万能框架**，按知识领域备好即可套用：

        | 领域 | 常见问题 | 标准对策 |
        | --- | --- | --- |
        | 范围 | 需求未确认、无 WBS、范围蔓延 | 收集需求并签字确认、创建 WBS、建立变更控制 |
        | 进度 | 无进度计划、未识别关键路径、无纠偏 | 编制进度计划、识别关键路径、定期跟踪与纠偏 |
        | 成本 | 无预算、无成本基准、未做挣值分析 | 编制成本基准、用挣值监控、设储备 |
        | 质量 | 无质量标准、只做终检、无评审 | 制定质量计划、过程控制与终检结合、组织评审 |
        | 风险 | 未识别、无应对、无责任人 | 建风险登记册、做定性定量分析、定应对与责任人 |
        | 沟通 | 无机制、无记录、信息不对称 | 定沟通计划、定期例会、形成会议纪要 |
        | 采购 | 合同不清、无验收标准、无索赔管理 | 明确 SOW 与验收标准、按合同验收、建索赔流程 |
        | 相关方 | 未识别关键相关方、参与不足 | 建相关方登记册、定参与策略、定期沟通 |

        **三类高频题的答法要点**：

        - **「指出存在的问题」**：只说事实，不评价人。写「未编制项目管理计划」而不是「项目经理能力不足」
        - **「说明原因」**：往流程与制度上找，不往个人品质上找
        - **「提出改进措施」**：必须可执行，且与前文问题一一对应，不要答非所问

        **计算小问的处理**：先列公式，再代数字，写清单位，最后加一句状态判断。公式本身有分，别直接写结果。

        **时间与卷面**：先通读三题，挑最有把握的先做；每题控制在 30 分钟内；留 10 分钟检查错别字与漏答小问。**漏答小问是下午卷最大的非技术失分**。

        ### 例题

        某系统集成项目合同工期 6 个月，项目经理在启动后直接安排开发，边做边确认需求。开发中期客户提出多项新增需求，项目经理为维护关系均安排实现。项目延期 2 个月，成本超支 30%。验收时客户以部分功能与初期理解不符为由拒绝签收。请指出该项目存在的主要问题。

        **参考答案按四层写**：

        **1. 范围管理问题**
        - 未充分收集并确认需求，未形成经客户签字的需求规格说明书
        - 未创建 WBS，范围边界不清，无法判断新增需求是否属于原范围
        - 未建立变更控制流程，新增需求未经影响分析与审批即实施，形成范围蔓延

        **2. 进度与成本管理问题**
        - 未编制经批准的进度基准与成本基准，无比较依据
        - 未定期监控进度与成本偏差，未在偏差出现初期采取纠偏措施
        - 未识别关键路径，压缩与调整缺乏依据

        **3. 相关方与沟通问题**
        - 未识别关键相关方并制定参与策略，验收标准未在前期达成一致
        - 未建立定期沟通与确认机制，需求理解偏差直到验收才暴露

        **4. 收尾与验收问题**
        - 未在阶段完成时组织确认范围，未形成阶段验收记录
        - 验收标准未写入合同或需求文档，导致争议无据可依

        **这份答案为什么能得分**：每条都是「缺什么」的客观陈述；术语准确（范围基准、变更控制、确认范围）；四条对应四个知识领域，覆盖面广；没有一句在评价个人。

        ### 怎么考

        **下午卷三道案例，共 75 分的一半左右**，是及格的关键。选择题可以蒙，案例题只能靠结构。

        **失分的五类典型**：
        - 只写结论不写动作（「管理不规范」）
        - 空话套话（「加强管理」「提高认识」）
        - 不分条，一大段文字
        - 问题与对策不对应（问问题答措施）
        - 漏答小问

        **一层容易漏的**：**问「问题」时不要顺手写对策**。很多人习惯性把「应该怎么做」混进「存在什么问题」里，看似多写，实际可能不给分——因为阅卷是按小问给分的。问题归问题，措施归措施，分开写。


question_policy:
  source_policy: [ai, web, manual]
  per_kp_min: 3
  types: [单选, 多选, 判断, 实操]
  # 每个 kp 至少 1 道非选择题（判断/实操），否则诊断会退化成"认题"
  require_open_question_per_kp: true

# ── 示例题（12 道，用于验证链路，不是完整题库）────────────────
# 字段对齐现有 practice_questions 表，导入时无需转换
#
questions:
  - id: RK-S1-001
    module_id: S1
    kp_id: KP-0101
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: easy
    level: 1
    title: 项目与运营的区别
    body_md: |
      下列关于项目与运营的说法，正确的是？
    options:
      - 项目具有临时性和独特性，运营是持续重复的
      - 项目是持续性的，运营是临时性的
      - 项目不需要明确目标，运营需要
      - 项目和运营都由同一套组织流程管理，无区别
    answer: "A"
    explanation_md: |
      项目的两个本质特征是**临时性**（有明确起止）和**独特性**（产出物唯一）。运营是持续、重复、以维持业务为目的。这是全书最基础的一对概念，后续所有过程组都建立在这个区分上。
    source: manual

  - id: RK-S1-002
    module_id: S1
    kp_id: KP-0102
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 2
    title: 五大过程组的逻辑关系
    body_md: |
      关于五大过程组，下列说法错误的是？
    options:
      - 启动过程组的输出之一是项目章程
      - 五大过程组在项目生命周期中会重复出现
      - 五大过程组必须严格按顺序执行，前一阶段不结束不能进入下一阶段
      - 收尾过程组可能出现在项目的每个阶段末
    answer: "C"
    explanation_md: |
      五大过程组是**逻辑分组**，不是时间顺序。它们在实际项目中高度交叠、循环往复——监控过程组贯穿全程，收尾在每个阶段末都会发生。选 C 的错误在于把逻辑分组当成了瀑布式时序。
    source: manual

  - id: RK-S2-001
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 挣值分析：进度偏差的含义
    body_md: |
      某项目 EV=800，PV=1000，AC=900。关于该项目当前状态，正确的是？
    options:
      - 进度超前，成本节约
      - 进度落后，成本超支
      - 进度落后，成本节约
      - 进度超前，成本超支
    answer: "B"
    explanation_md: |
      SV = EV − PV = 800 − 1000 = **−200**，小于 0 ⇒ 进度落后。CV = EV − AC = 800 − 900 = **−100**，小于 0 ⇒ 成本超支。记忆锚点：SV 看进度、CV 看成本，两个都是「EV 减后面那个」。
    source: manual

  - id: RK-S2-002
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 3
    title: 挣值分析：完整指标计算
    body_md: |
      某项目当前状态：EV=800 万元，PV=1000 万元，AC=900 万元，BAC=2000 万元。

      请计算并写出过程：
      1. 进度偏差 SV、成本偏差 CV
      2. 进度绩效指数 SPI、成本绩效指数 CPI
      3. 按当前绩效预测完工估算 EAC（用 CPI 法）
      4. 逐项判断进度与成本状态
    options: []
    answer: "SV=-200万元（进度落后）；CV=-100万元（成本超支）；SPI=0.8；CPI≈0.889；EAC=BAC/CPI≈2250万元"
    explanation_md: |
      1. SV = EV − PV = 800 − 1000 = −200（<0 进度落后）
      2. CV = EV − AC = 800 − 900 = −100（<0 成本超支）
      3. SPI = EV / PV = 800 / 1000 = 0.8
      4. CPI = EV / AC = 800 / 900 ≈ 0.889
      5. EAC = BAC / CPI = 2000 / 0.889 ≈ **2250 万元**（按当前成本绩效外推，完工要多花 250 万）

      **给分点**：每项写公式 + 代值 + 结论。案例题只写数字不写过程会大量丢分，这是最常见的失分原因。
    source: manual

  - id: RK-S2-003
    module_id: S2
    kp_id: KP-0207
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: medium
    level: 3
    title: 变更管理流程
    body_md: |
      项目执行中，客户提出一项范围变更。请按标准流程写出处理步骤（不少于 5 步）。
    options: []
    answer: "提出变更申请 → 分析变更影响（范围/进度/成本/质量）→ 提交 CCB 审批 → 批准后更新相关计划与基准 → 实施变更 → 验证并记录 → 通知干系人"
    explanation_md: |
      关键是要出现 **CCB（变更控制委员会）审批** 和 **更新基准** 两步，这两步是判分核心。
      常见错误：直接从"客户提出"跳到"开始改"，跳过影响分析和审批——这在真实项目里就是范围失控的起点。

      对照你自己的项目想一遍：上次客户临时加需求，有没有走完这个流程？
    source: manual

  - id: RK-S3-001
    module_id: S3
    kp_id: KP-0302
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 2
    title: 云计算三层服务模型
    body_md: |
      用户只需管理自己的应用和数据，操作系统及以下由云服务商负责。这属于哪种服务模型？
    options:
      - IaaS
      - DaaS
      - SaaS
      - PaaS
    answer: "D"
    explanation_md: |
      判断口诀——**看操作系统归谁管**：
      IaaS = 只给基础设施（虚拟机/存储/网络），操作系统以上自己管；
      PaaS = 平台也给，操作系统和运行时由服务商管，用户只管应用和数据；
      SaaS = 连应用都是别人的，用户只管用。

      本题「操作系统由服务商负责、用户管应用和数据」⇒ PaaS。
    source: manual

  - id: RK-S3-002
    module_id: S3
    kp_id: KP-0308
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: easy
    level: 1
    title: 网络安全等级保护分级
    body_md: |
      我国网络安全等级保护制度将信息系统分为几个安全保护等级？
    options:
      - "3 级"
      - "4 级"
      - "5 级"
      - "6 级"
    answer: "C"
    explanation_md: |
      等保分为**五级**，从第一级（自主保护）到第五级（专控保护），级别越高监管越严。
      政务类系统通常要求三级及以上——这一条和你手上的数据空间项目直接相关，甲方验收会查等保测评报告。
    source: manual

  - id: RK-S3-003
    module_id: S3
    kp_id: KP-0306
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 2
    title: 数据治理与数据管理的区别
    body_md: |
      下列关于数据治理与数据管理的说法，正确的是？
    options:
      - 数据治理是决策权与问责机制的安排，数据管理是具体执行活动
      - 两者是同义词，可以互换使用
      - 数据管理层次高于数据治理
      - 数据治理只关注数据质量
    answer: "A"
    explanation_md: |
      **治理管"谁来决定、谁负责"，管理管"具体怎么做"。**
      类比：治理是董事会定规则，管理是部门按规则干活。数据中台项目里最容易出的问题就是只有管理动作、没有治理机制，
      结果各部门口径不一致，对不上数。
    source: manual

  - id: RK-S4-001
    module_id: S4
    kp_id: KP-0402
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: medium
    level: 1
    title: 信息系统监理的职责范围
    body_md: |
      信息系统工程监理的"四控两管一协调"中，"四控"指的是？
    options:
      - 质量、进度、投资、安全
      - 范围、进度、成本、质量
      - 质量、进度、合同、信息
      - 投资、质量、风险、变更
    answer: "A"
    explanation_md: |
      四控 = **质量、进度、投资、安全**；两管 = 合同管理、信息管理；一协调 = 组织协调。
      注意别和项目管理的"范围/进度/成本/质量"搞混——那是项目管理的四要素，监理的四控里是**投资和安全**，不是范围和成本。
    source: manual

  - id: RK-S5-001
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: hard
    level: 2
    title: 招标投标中的法律性质
    body_md: |
      根据《招标投标法》，中标通知书的法律性质是？
    options:
      - 要约邀请
      - 要约
      - 承诺
      - 意向书
    answer: "C"
    explanation_md: |
      三方链条要记牢：
      **招标公告 = 要约邀请**（请别人来报价）
      **投标文件 = 要约**（正式报价）
      **中标通知书 = 承诺**（接受报价，合同成立）
      这条几乎年年考，也是最容易记反的一组。
    source: manual

  - id: RK-S6-001
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 单选
    difficulty: easy
    level: 1
    title: 英文专业术语（EVM）
    body_md: |
      In project management, "EVM" stands for:
    options:
      - Earned Value Management
      - Enterprise Value Management
      - Estimated Value Method
      - Evaluation and Verification Model
    answer: "A"
    explanation_md: |
      EVM = **Earned Value Management**（挣值管理）。英文题只考术语原义，不考语法。
      备考方式：把十大知识领域、五大过程组的英文对照表过一遍即可，5 道题能拿 3-4 分就是赚的。
    source: manual

  - id: RK-S6-002
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 实操
    difficulty: hard
    level: 4
    title: 案例题答题结构训练
    body_md: |
      某项目进度严重滞后，客户投诉频繁，团队加班严重但产出不增。
      请从项目管理角度分析存在的问题，并提出改进建议。

      要求：问题不少于 4 条，建议必须与问题一一对应。
    options: []
    answer: "问题可从范围/进度/质量/沟通/资源五个方面拆解；建议须一一对应，且要写出具体动作，不能只写「加强管理」"
    explanation_md: |
      **答题结构**（这类题有固定套路，练模板比练知识更有效）：
      1. 先分类，不要一锅端——范围、进度、成本、质量、资源、沟通、风险，逐项扫
      2. 每条问题写成「现象 + 对应管理过程缺失」，例如：
         「加班多但产出不增 ⇒ 进度计划未做资源平衡，未识别关键路径」
      3. 建议必须与问题**一一对应**，且是具体动作：
         ✗「加强进度管理」 → ✓「重排 WBS，识别关键路径，对非关键任务削减投入」
      4. 字数控制：问题 4-5 条、建议 4-5 条，宁少勿滥

      **失分点**：只写问题不写建议、建议与问题不对应、写大词不写动作。
    source: manual

  # ── 第一批补题（2026-10-27）：S1 补齐到每层 3 题 ──────────────
  - id: RK-S1-003
    module_id: S1
    kp_id: KP-0103
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: easy
    level: 1
    title: 十大知识领域：范围管理
    body_md: |
      十大知识领域中，负责「确保项目包含且仅包含成功完成项目所需的工作」的是？
    options:
      - 范围管理
      - 进度管理
      - 质量管理
      - 整合管理
    answer: "A"
    explanation_md: |
      范围管理管的是「做什么、不做什么」，核心产出是需求文件与 WBS。
      进度管理管「什么时候做完」，质量管理管「合格不合格」，整合管理管「各条线怎么拧成一股」。
    source: manual

  - id: RK-S1-004
    module_id: S1
    kp_id: KP-0105
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: easy
    level: 1
    title: 项目经理的核心作用
    body_md: |
      关于项目经理在项目中的核心作用，下列描述最准确的是？
    options:
      - 通过整合资源、协调干系人，达成项目目标
      - 完成技术方案设计与关键代码实现
      - 监督团队成员的考勤与日常纪律
      - 签署项目涉及的全部合同
    answer: "A"
    explanation_md: |
      项目经理的核心是**整合**——把不同专业、不同部门、不同利益的人组织起来达成目标。
      技术方案由技术负责人做，合同签署通常由授权代表或商务负责，考勤属于职能管理。
    source: manual

  - id: RK-S1-005
    module_id: S1
    kp_id: KP-0101
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 2
    title: 衡量项目成功的标准
    body_md: |
      关于衡量项目是否成功，下列说法最正确的是？
    options:
      - 只要在预算内完成就算成功
      - 团队没有加班就算成功
      - 在范围、进度、成本、质量等约束下达成目标，并使关键干系人满意
      - 交付的功能数量越多越成功
    answer: "C"
    explanation_md: |
      项目成功不等于「没超预算」。传统三约束（范围 / 进度 / 成本）之外还要看质量与干系人满意度——
      交付物再准时，如果客户不用、不认，项目仍然失败。这一条在案例题里经常作为失分点出现。
    source: manual

  - id: RK-S1-006
    module_id: S1
    kp_id: KP-0102
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 2
    title: 项目章程的归属与作用
    body_md: |
      项目章程在哪个过程组制定？它的核心作用是什么？
    options:
      - 启动过程组；正式授权项目存在，并授权项目经理动用组织资源
      - 规划过程组；确定详细的项目范围
      - 执行过程组；给团队成员分配具体任务
      - 监控过程组；控制变更是否被批准
    answer: "A"
    explanation_md: |
      项目章程属于**启动过程组**，是项目的「出生证明」，同时是项目经理的「授权书」。
      因为它要授权项目经理，所以不能由项目经理自己签发——这是判断题的高频陷阱。
    source: manual

  - id: RK-S1-007
    module_id: S1
    kp_id: KP-0104
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 3
    title: 职能型组织里的项目经理
    body_md: |
      在职能型组织中，项目经理通常扮演什么角色？
    options:
      - 对项目成员拥有完全指挥权
      - 与职能经理权限完全相同
      - 直接管理项目预算与人员绩效
      - 协调员或联络员，主要靠沟通推动，对资源没有直接控制权
    answer: "D"
    explanation_md: |
      职能型组织里，资源与考核都在职能经理手上，项目经理只能「协调」。
      这也是为什么职能型组织下项目经理常常「责任大、权力小」——这个矛盾是案例题的常客。
    source: manual

  - id: RK-S1-008
    module_id: S1
    kp_id: KP-0104
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 3
    title: 项目型组织的特点
    body_md: |
      与职能型组织相比，项目型组织的主要特点是？
    options:
      - 项目经理权力最小，由职能经理主导
      - 不需要设置项目管理办公室
      - 资源可以在多个项目之间高效共享
      - 项目经理拥有最大权限，但团队成员在项目结束后需要重新安置
    answer: "D"
    explanation_md: |
      项目型组织里，人和资源都归项目，项目经理权力最大，代价是**资源利用率低**——
      项目一结束，团队就要重新找归属。这正好和职能型组织的优缺点互为镜像，常成对考。
    source: manual

  - id: RK-S1-009
    module_id: S1
    kp_id: KP-0103
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 3
    title: 把高层需求拆成工作包属于哪个领域
    body_md: |
      某项目需要把客户的概括性需求逐层分解为可管理、可估算的工作包。这个动作属于哪个知识领域？
    options:
      - 范围管理
      - 进度管理
      - 资源管理
      - 质量管理
    answer: "A"
    explanation_md: |
      逐层分解形成 WBS（工作分解结构），是**范围管理**的核心工具。
      容易混的是进度管理——进度管理用的是 WBS 的产物（工作包）来排活动，但「拆 WBS」这一步属于范围。
    source: manual

  - id: RK-S1-010
    module_id: S1
    kp_id: KP-0104
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: hard
    level: 4
    title: 从资源申请方式反推组织结构
    body_md: |
      某公司项目经理要为本项目申请一名测试工程师，必须向测试部经理提出申请、由测试部经理安排人员，
      且项目经理无权考核该成员的绩效。这最可能是什么组织结构？
    options:
      - 项目型
      - 强矩阵型
      - 职能型
      - 复合型
    answer: "C"
    explanation_md: |
      判据是「资源怎么来、考核在谁手上」：要**申请**、且**无权考核** ⇒ 资源完全在职能经理手里 ⇒ 职能型。
      强矩阵里项目经理对资源有实质调配权，不需要逐次申请；项目型里人本来就归项目。
    source: manual

  - id: RK-S1-011
    module_id: S1
    kp_id: KP-0105
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: hard
    level: 4
    title: 关键干系人不参与怎么办
    body_md: |
      项目进入执行阶段，一名关键干系人（业务部门负责人）始终不参加需求评审，导致需求反复变更。
      项目经理首先应该做的是？
    options:
      - 把该干系人从干系人名单中剔除
      - 先按现有需求开发，出了问题再说
      - 直接上报高层投诉其不配合
      - 识别其对项目的影响与真实诉求，制定针对性的沟通策略
    answer: "D"
    explanation_md: |
      干系人管理的顺序是「识别 → 分析（权力 / 利益）→ 制定策略 → 执行」。跳过分析直接上手段，
      无论是剔除、上报还是硬推，都是把症状当原因。
      案例题里，凡是「首先应该做什么」，答案几乎都落在识别与分析这一步。
    source: manual

  - id: RK-S1-012
    module_id: S1
    kp_id: KP-0102
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: hard
    level: 4
    title: 判断工作落在哪个过程组
    body_md: |
      团队正在制定 WBS、估算工期与成本、识别风险，并汇总形成项目管理计划。这些工作属于哪个过程组？
    options:
      - 启动
      - 规划
      - 执行
      - 监控
    answer: "B"
    explanation_md: |
      「制定计划类」的工作都在**规划过程组**：范围、进度、成本、风险各条线的计划都在这里生成，
      最后整合成项目管理计划。判断口诀：还在「想清楚要怎么做」= 规划；已经「动手做」= 执行。
    source: manual

  - id: RK-S1-013
    module_id: S1
    kp_id: KP-0103
    category: 中项·S1 项目管理框架
    type: 实操
    difficulty: hard
    level: 5
    title: 十大知识领域落回自己的项目
    body_md: |
      从十大知识领域中挑 4 个，各写出你手上某个真实项目在对应领域的一项**具体产出物**。

      要求：不要写「范围管理计划」这类空名，要写实际的东西，例如「需求清单 37 条，含优先级」。
    options: []
    answer: "四个领域各自的真实产出物；每条都能看出具体内容；能对应回知识领域"
    explanation_md: |
      这道题的目的不是背十大领域，而是**把你项目里已有的东西挂到标准框架上**。
      例如：范围 →「需求清单 37 条带优先级」；进度 →「甘特图，含 5 个里程碑」；
      风险 →「风险登记册 12 条，3 条高」；沟通 →「周报 + 双周评审会」。

      凡是写不出来的领域，就是你项目里真实缺失的管理动作——这比背书有用得多。
    source: manual

  - id: RK-S1-014
    module_id: S1
    kp_id: KP-0101
    category: 中项·S1 项目管理框架
    type: 实操
    difficulty: hard
    level: 5
    title: 用自己项目解释「渐进明细」
    body_md: |
      举一个你项目里「渐进明细」的例子：开始时以为什么、后来明确成什么、是什么触发了这次细化。
    options: []
    answer: "有初始的粗略判断；有明确化之后的具体结果；说清了触发细化的原因"
    explanation_md: |
      合格答案的样子：立项时以为「就是做一个数据看板」，做完需求调研才发现要对接三个部门的异构数据源，
      范围从「一个页面」变成「一套数据接入 + 治理 + 展示」，触发点是需求评审时发现口径对不上。

      不合格的答案：把「渐进明细」的定义再解释一遍，不落到自己的项目。
      这题考的是「能不能用概念解释经验」，正是案例题的核心能力。
    source: manual

  - id: RK-S1-015
    module_id: S1
    kp_id: KP-0105
    category: 中项·S1 项目管理框架
    type: 实操
    difficulty: hard
    level: 5
    title: 没有人事权怎么推动跨部门
    body_md: |
      你在项目中没有直接人事权，但需要推动三个部门配合。写出你会用的 3 个**具体动作**。

      要求：要能落地，不写「加强沟通」「提高意识」这类话。
    options: []
    answer: "用正式授权；建立共同利益点；用机制固化协作；保留升级路径"
    explanation_md: |
      参考方向（答到 3 条即可）：
      1. **用正式授权**：把配合事项写进项目章程或高层签发的任务书，让「配合」有出处；
      2. **找共同利益**：把项目目标翻译成对方部门的考核指标（例如帮他们减少手工报表）；
      3. **机制固化**：指定各部门接口人、固定双周接口会、把交付物写进里程碑；
      4. **保留升级路径**：明确「什么情况下升级到项目指导委员会」，而不是私下抱怨。

      这题练的正是案例题里「没有权力怎么做事」的答法——要写动作，不写态度。
    source: manual

  # ── 第一批补题（2026-10-27）：S3 补齐到每层 5 题 ──────────────
  - id: RK-S3-004
    module_id: S3
    kp_id: KP-0301
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: easy
    level: 1
    title: 国家信息化体系的龙头
    body_md: |
      国家信息化体系的六要素中，处于龙头（核心）地位的是？
    options:
      - 信息技术应用
      - 信息资源
      - 信息网络
      - 信息化人才
    answer: "A"
    explanation_md: |
      六要素：信息技术应用、信息资源、信息网络、信息技术和产业、信息化人才、信息化政策法规和标准规范。
      其中**信息技术应用**是龙头——其它要素都围绕「用起来」展开。
    source: manual

  - id: RK-S3-005
    module_id: S3
    kp_id: KP-0307
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: easy
    level: 1
    title: 系统集成不包括什么
    body_md: |
      信息系统系统集成通常不包括下列哪一项？
    options:
      - 硬件设备集成
      - 网络系统集成
      - 应用软件集成
      - 组织结构重组
    answer: "D"
    explanation_md: |
      系统集成是技术层面的整合（硬件、网络、软件、数据），组织架构调整属于管理变革，不是集成的内容。
      这条容易和「业务流程重组」混——后者是管理咨询范畴，不是系统集成。
    source: manual

  - id: RK-S3-006
    module_id: S3
    kp_id: KP-0303
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: easy
    level: 1
    title: IT 服务的生命周期
    body_md: |
      按信息技术服务标准，IT 服务的生命周期应覆盖哪几个阶段？
    options:
      - 规划设计、部署实施、服务运营、持续改进、监督管理
      - 需求分析、概要设计、详细设计、编码、测试
      - 立项、招标、实施、验收、结算
      - 采集、存储、计算、分析、展示
    answer: "A"
    explanation_md: |
      ITSS 的服务生命周期是五个阶段：规划设计 → 部署实施 → 服务运营 → 持续改进 → 监督管理。
      注意 B 是**软件开发**的生命周期，两者极易混淆——一个管「服务」，一个管「软件」。
    source: manual

  - id: RK-S3-007
    module_id: S3
    kp_id: KP-0304
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: easy
    level: 1
    title: 分层架构里的表示层
    body_md: |
      在典型的分层架构中，负责「用户交互与信息展示」的是哪一层？
    options:
      - 表示层
      - 业务逻辑层
      - 数据访问层
      - 基础设施层
    answer: "A"
    explanation_md: |
      分层架构常见三层：表示层（界面 / 交互）→ 业务逻辑层（规则 / 计算）→ 数据访问层（读写数据）。
      分层的目的把「界面变化」和「业务变化」隔开，改界面不牵动业务代码。
    source: manual

  - id: RK-S3-008
    module_id: S3
    kp_id: KP-0302
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 2
    title: 大数据 5V
    body_md: |
      大数据的「5V」特征不包括下列哪一项？
    options:
      - Volume（数据量大）
      - Velocity（产生速度快）
      - Veracity（真实性）
      - Virtualization（虚拟化）
    answer: "D"
    explanation_md: |
      5V = Volume / Velocity / Variety（多样）/ Value（价值）/ Veracity（真实性）。
      虚拟化是一种技术手段，不是大数据的特征——它常和云计算放在一起考，注意别串。
    source: manual

  - id: RK-S3-009
    module_id: S3
    kp_id: KP-0305
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 2
    title: 系统测试与验收测试的区别
    body_md: |
      关于系统测试与验收测试，下列说法正确的是？
    options:
      - 系统测试由开发方组织、对照需求规格进行；验收测试由用户方组织、对照业务需要进行
      - 两者都由开发方组织，只是阶段不同
      - 验收测试在系统测试之前进行
      - 两者没有区别，只是叫法不同
    answer: "A"
    explanation_md: |
      关键差别有两个：**谁来做**（开发方 vs 用户方）和**对照什么**（需求规格 vs 业务需要）。
      顺序上一定是系统测试在前、验收测试在后。这一组混淆是选择题的高频陷阱。
    source: manual

  - id: RK-S3-010
    module_id: S3
    kp_id: KP-0308
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 2
    title: 数字签名用的是哪把钥匙
    body_md: |
      在非对称加密体系中，数字签名的正确做法是？
    options:
      - 用发送方的私钥签名，接收方用发送方的公钥验签
      - 用发送方的公钥签名，接收方用发送方的私钥验签
      - 用对称密钥签名，双方共享同一把钥匙
      - 签名不需要密钥
    answer: "A"
    explanation_md: |
      非对称体系里一对钥匙各有分工：**私钥自己留着**、公钥公开。
      数字签名是「用私钥签、用公钥验」，解决的是**不可否认性**；而加密传输是「用对方公钥加密、对方私钥解密」，
      解决的是**机密性**。两者方向相反，这是最容易记混的一点。
    source: manual

  - id: RK-S3-011
    module_id: S3
    kp_id: KP-0305
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 3
    title: 软件测试的执行顺序
    body_md: |
      按软件测试的执行顺序，下列排列正确的是？
    options:
      - 单元测试 → 集成测试 → 系统测试 → 验收测试
      - 集成测试 → 单元测试 → 验收测试 → 系统测试
      - 系统测试 → 单元测试 → 集成测试 → 验收测试
      - 单元测试 → 系统测试 → 集成测试 → 验收测试
    answer: "A"
    explanation_md: |
      顺序的逻辑是「先小后大」：单个模块（单元）→ 模块之间（集成）→ 整个系统（系统）→ 用户验收（验收）。
      记住这条链，判断题里把「验收」放在前面的一定错。
    source: manual

  - id: RK-S3-012
    module_id: S3
    kp_id: KP-0306
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 3
    title: 数据仓库的分层顺序
    body_md: |
      典型数据仓库分层中，贴源层（ODS）之后、面向应用之前，承担「清洗与轻度汇总」的是？
    options:
      - 数据明细层（DWD）
      - 数据应用层（ADS）
      - 维度层（DIM）
      - 操作数据层（ODS）
    answer: "A"
    explanation_md: |
      常见四层：**ODS**（贴源，几乎不做加工）→ **DWD**（明细，清洗与规范化）→
      **DWS**（汇总，按主题聚合）→ **ADS**（应用，直接供报表 / 接口）。
      判断口诀：越往下越「原始」，越往上越「面向某个具体应用」。
    source: manual

  - id: RK-S3-013
    module_id: S3
    kp_id: KP-0304
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 3
    title: SOA 与微服务的区别
    body_md: |
      关于面向服务的架构（SOA）与微服务架构，下列说法最准确的是？
    options:
      - SOA 通常依赖企业服务总线做集中式集成，微服务强调去中心化、服务自治与独立部署
      - 两者完全等价，只是名字不同
      - 微服务必须使用 ESB 进行通信
      - SOA 只能用于内部系统，微服务只能用于互联网系统
    answer: "A"
    explanation_md: |
      关键差别在「集成方式」与「自治程度」：SOA 常通过 ESB 做集中编排，服务可以较粗粒度；
      微服务强调每个服务独立部署、独立演化，通信走轻量协议，不要中心总线。
      考试里常见错误选项就是「微服务用 ESB」——正好说反了。
    source: manual

  - id: RK-S3-014
    module_id: S3
    kp_id: KP-0302
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 3
    title: 容器与虚拟机的本质区别
    body_md: |
      容器与虚拟机最本质的区别是？
    options:
      - 容器共享宿主机内核、以进程级隔离运行；虚拟机各自运行完整的客户操作系统
      - 容器必须有独立操作系统，虚拟机不需要
      - 虚拟机启动速度比容器快
      - 容器不能做资源限制
    answer: "A"
    explanation_md: |
      一句话记牢：**容器共享内核，虚拟机各带一套系统**。
      由此推出所有结果：容器更轻、启动更快、密度更高；虚拟机隔离更彻底、能跑不同内核。
      B 和 C 正好说反，D 不符合事实（容器可以做 CPU / 内存限制）。
    source: manual

  - id: RK-S3-015
    module_id: S3
    kp_id: KP-0308
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 3
    title: 等保五级的监管强度
    body_md: |
      关于网络安全等级保护的五个等级，下列说法正确的是？
    options:
      - 第一级为自主保护，级别越高监管越严，第五级为专控保护
      - 第一级监管最严，第五级仅需自主保护
      - 五个等级的监管要求完全相同
      - 第三级以上只需备案，不需要测评
    answer: "A"
    explanation_md: |
      从第一级到第五级，受侵害客体与侵害程度逐级加重，监管也逐级加严：一级自主保护、二级指导保护、
      三级监督保护、四级强制保护、五级专控保护。
      第三级及以上通常需要**测评**（不只是备案）——这一条在政务项目里是硬要求。
    source: manual

  - id: RK-S3-016
    module_id: S3
    kp_id: KP-0308
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 4
    title: 从业务影响反推等保级别
    body_md: |
      某市级政务数据共享平台涉及大量自然人信息，一旦遭到破坏，会对社会秩序和公共利益造成严重损害。
      按等保要求，它最低应达到几级？
    options:
      - 一级
      - 二级
      - 三级
      - 四级
    answer: "C"
    explanation_md: |
      定级看两个维度：**受侵害的客体** + **侵害程度**。
      「损害社会秩序和公共利益」且程度为「严重」⇒ 三级。
      答四级是把「严重」和「特别严重」混了；答二级是只按数据量猜，没看客体。
    source: manual

  - id: RK-S3-017
    module_id: S3
    kp_id: KP-0304
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 4
    title: 异构老系统怎么集成
    body_md: |
      某企业内部有 8 个不同年代、不同技术栈的老系统，要求既能复用已有能力，又要让新系统方便接入。
      最合适的架构方向是？
    options:
      - 把 8 个系统全部推倒，重建为一个单体应用
      - 将各系统能力服务化，通过标准接口进行集成，逐步替换
      - 各系统独立建设，彼此不集成
      - 只做一个前端门户，后台数据靠人工同步
    answer: "B"
    explanation_md: |
      老系统改造的核心约束是「不能停摆」，所以答案一定是「渐进式」而不是「推倒重来」。
      服务化 + 标准接口能让新老系统并存、逐块替换，是这类场景的标准解。
      A 风险最高、C 等于没解决、D 会制造新的数据不一致。
    source: manual

  - id: RK-S3-018
    module_id: S3
    kp_id: KP-0303
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 4
    title: 运维服务该补哪个阶段
    body_md: |
      某单位的系统已上线运行两年，运维团队每天忙于救火：故障频发、反复处理同类问题、没有服务记录。
      按 IT 服务生命周期看，最该补的是？
    options:
      - 规划设计阶段，重新做一遍架构设计
      - 部署实施阶段，重装一遍系统
      - 持续改进阶段，建立问题管理与知识沉淀机制
      - 不需要补，多招人就行
    answer: "C"
    explanation_md: |
      「反复处理同类问题 + 没有记录」是典型的**缺少持续改进**：问题没有从「事件」升级为「问题」被根治。
      正确动作是建立问题管理、根因分析与知识库。加人只能提高救火速度，不能减少火情。
    source: manual

  - id: RK-S3-019
    module_id: S3
    kp_id: KP-0301
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 4
    title: 一网通办真正的瓶颈
    body_md: |
      某市要建「一网通办」平台，需要打通 20 个委办局的业务系统。从项目实践看，最关键的制约因素通常是？
    options:
      - 服务器性能不足
      - 前端界面不够美观
      - 数据共享与业务协同的机制（权责、标准、审批链条）
      - 编程语言选型不当
    answer: "C"
    explanation_md: |
      这类跨部门项目的瓶颈几乎从来不是技术，而是**机制**：数据谁负责、按什么标准提供、出了问题谁担责。
      技术方案再漂亮，机制不通就落不了地。这条经验在案例分析里非常好用——遇到「政务 / 跨部门」，
      优先往机制上找原因，而不是往技术上找。
    source: manual

  - id: RK-S3-020
    module_id: S3
    kp_id: KP-0307
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 4
    title: 集成项目里的接口争议
    body_md: |
      系统集成项目中，甲方认为乙方提供的接口「不好用」，乙方认为按合同已经交付。双方争执不下。
      从项目管理角度看，问题的根源最可能是？
    options:
      - 乙方技术水平不够
      - 甲方要求太高
      - 接口的技术标准与验收标准在合同 / 需求阶段没有定义清楚
      - 服务器配置太低
    answer: "C"
    explanation_md: |
      交付争议的根源基本都在**验收标准没有可判定**。接口算不算「好用」，必须在需求阶段就写成
      可验证的条件（响应时间、错误码、字段完整性、并发能力）。
      这也正是 v4 这套东西为什么要给每条验收标准写「能一次判定」——判不了的验收，一定吵架。
    source: manual

  - id: RK-S3-021
    module_id: S3
    kp_id: KP-0302
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 5
    title: 自己项目的云服务落位
    body_md: |
      看你手上某个项目用到的云服务，逐项判断它们分别属于 IaaS / PaaS / SaaS 的哪一层，并说明判断依据。
    options: []
    answer: "能逐项归类；判断依据用「谁管操作系统」这条轴，而不是凭名字猜"
    explanation_md: |
      合格答案的样子：ECS 云主机 = IaaS（操作系统自己装自己管）；云数据库 RDS = PaaS
      （数据库引擎服务商维护，数据自己管）；对象存储 = IaaS / PaaS 边界（按是否托管运维判断）；
      企业邮箱 = SaaS（开箱即用）。

      关键是**说出判断轴**：谁的运维责任到哪一层。写不出依据、只报名字，等于没掌握。
    source: manual

  - id: RK-S3-022
    module_id: S3
    kp_id: KP-0306
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 5
    title: 项目里的数据治理到底有没有
    body_md: |
      描述你项目中数据治理的实际状况：谁对数据质量负责？口径不一致时谁裁决？有没有落成制度？
    options: []
    answer: "能说清责任归属与裁决机制；能区分「有管理动作」和「有治理机制」"
    explanation_md: |
      这一题是照妖镜。多数项目的真实答案是没有治理、只有管理：各部门各自做报表，口径对不上时靠开会吵。

      合格答案会说清三件事：**谁负责**（数据 owner）、**怎么裁决**（有争议时的决策路径）、
      **有没有落到制度**（写进流程还是靠人情）。三件都缺，就说明治理是空的——这正好可以作为你项目里的改进项。
    source: manual

  - id: RK-S3-023
    module_id: S3
    kp_id: KP-0308
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 5
    title: 给自己的系统定级
    body_md: |
      为你手上的一个系统写一段定级说明：定几级、依据是受侵害的客体和程度分别是什么、需要做什么测评。
    options: []
    answer: "级数、客体、程度三者对得上；知道三级及以上要测评"
    explanation_md: |
      合格答案要出现三个要素：**业务信息 / 系统服务被破坏后侵害谁**（公民法人权益 / 社会秩序公共利益 / 国家安全）、
      **侵害程度**（一般 / 严重 / 特别严重）、**由此得出的级别**。

      最常见的错误是只说「我们数据多所以要三级」——数据量不是定级依据，客体和程度才是。
    source: manual

  - id: RK-S3-024
    module_id: S3
    kp_id: KP-0301
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 5
    title: 把项目拆到信息化六要素上
    body_md: |
      用国家信息化体系六要素，逐项说明你项目里对应的具体内容（哪一项缺失也照实写）。
    options: []
    answer: "六要素逐项落位；缺的那几项要照实写，不硬凑"
    explanation_md: |
      六要素：信息技术应用、信息资源、信息网络、信息技术和产业、信息化人才、政策法规与标准规范。

      实操价值在于：**缺什么一眼就看出来**。多数业务项目缺的是「信息资源」（数据资产没盘清）和
      「政策法规与标准规范」（没有数据标准）。照实写缺失项，比硬凑成六项都有用。
    source: manual

  - id: RK-S3-025
    module_id: S3
    kp_id: KP-0305
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 5
    title: 你的项目打算怎么测
    body_md: |
      给你手上正在做的系统写一份最小测试策略：测哪几个阶段、每个阶段谁来做、准入与准出的判据是什么。
    options: []
    answer: "阶段划分清楚；每个阶段的责任方明确；准入准出判据可判定"
    explanation_md: |
      合格答案要能回答三个问题：**测到哪一步为止**（阶段与范围）、**谁签字**（责任方）、
      **什么条件才算过**（判据）。

      最常缺的是「准出判据」——写「测试通过后上线」等于没写。可判定的写法是
      「遗留缺陷中无严重及以上、一般缺陷 ≤5 个且均有规避方案」。
    source: manual

  # ── 第二批补题（2026-10-27）：S2 主战场，补齐到每层 4 题 ──────
  - id: RK-S2-004
    module_id: S2
    kp_id: KP-0201
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 项目章程的签发人
    body_md: |
      项目章程通常由谁签发？
    options:
      - 项目经理
      - 项目管理办公室
      - 客户方的项目经理
      - 项目发起人或高层管理者
    answer: "D"
    explanation_md: |
      项目章程的作用之一是**授权**项目经理动用组织资源，所以不能由项目经理自己签发——
      自己给自己授权，形式上不成立。这一点在判断题里几乎必考。
    source: manual

  - id: RK-S2-005
    module_id: S2
    kp_id: KP-0202
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: WBS 的最底层
    body_md: |
      工作分解结构（WBS）分解到最底层，得到的单元称为什么？
    options:
      - 工作包
      - 里程碑
      - 活动
      - 控制账户
    answer: "A"
    explanation_md: |
      WBS 分解到**工作包**为止；工作包再往下拆才是「活动」（进度管理做的事）。
      这个层级的区别常被考：WBS 管「交付什么」，活动管「怎么一步步做出来」。
    source: manual

  - id: RK-S2-006
    module_id: S2
    kp_id: KP-0204
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 监控过程组干什么
    body_md: |
      监控过程组的主要作用是？
    options:
      - 跟踪、审查和调整项目进展与绩效，识别变更并启动相应变更
      - 制定项目计划
      - 分配任务给团队成员
      - 关闭项目合同
    answer: "A"
    explanation_md: |
      监控 = **看偏差 + 动手纠正**。注意「识别变更并启动变更」也在监控里——
      很多人以为监控只是"看"，其实发现问题后推动变更同样是监控的职责。
    source: manual

  - id: RK-S2-007
    module_id: S2
    kp_id: KP-0203
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 质量保证属于哪个过程组
    body_md: |
      质量保证（Quality Assurance）属于哪个过程组？它管的是什么？
    options:
      - 监控过程组；检查最终产品是否合格
      - 收尾过程组；验收质量
      - 规划过程组；制定质量目标
      - 执行过程组；保证做事的**过程**符合质量要求
    answer: "D"
    explanation_md: |
      口诀：**质量保证管过程（执行），质量控制管结果（监控）**。
      这一组是选择题的高频陷阱 —— 上一版首次诊断你就栽在这里，所以单独列一题反复练。
    source: manual

  - id: RK-S2-008
    module_id: S2
    kp_id: KP-0204
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 质量控制属于哪个过程组
    body_md: |
      质量控制（Quality Control）属于哪个过程组？
    options:
      - 执行过程组
      - 启动过程组
      - 规划过程组
      - 监控过程组
    answer: "D"
    explanation_md: |
      质量控制是「检查结果对不对」，属于**监控**。
      与上一题成对记：保证管过程在执行，控制管结果在监控。
    source: manual

  - id: RK-S2-009
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 从 CPI 与 SPI 读出状态
    body_md: |
      某项目 CPI = 1.1，SPI = 0.9。下列关于该项目状态的说法，正确的是？
    options:
      - 成本超支，进度超前
      - 成本超支，进度落后
      - 成本节约，进度超前
      - 成本节约，进度落后
    answer: "D"
    explanation_md: |
      两个指数都拿 1 当基准：**>1 是好事，<1 是坏事**。
      CPI > 1 ⇒ 花得比计划少（成本节约）；SPI < 1 ⇒ 干得比计划慢（进度落后）。
      记不住就把「CPI 管钱、SPI 管时间」先钉死，再判方向。
    source: manual

  - id: RK-S2-010
    module_id: S2
    kp_id: KP-0205
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 收尾过程组要做的事
    body_md: |
      下列哪一组工作全部属于收尾过程组？
    options:
      - 合同关闭、经验教训归档、资源释放
      - 确认范围、控制质量
      - 制定 WBS、估算成本
      - 组建团队、管理冲突
    answer: "A"
    explanation_md: |
      收尾不等于「交付完」。客户验收属于监控过程组里的「确认范围」，
      合同关闭、经验教训归档、资源释放、归档项目文件才是收尾。
    source: manual

  - id: RK-S2-011
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 3
    title: 算完 CPI 再判断
    body_md: |
      某项目 EV = 600 万元，AC = 500 万元，PV = 700 万元。关于成本绩效，下列说法正确的是？
    options:
      - CPI = 1.2，成本节约
      - CPI = 0.83，成本超支
      - CPI = 1.4，成本节约
      - 信息不足，无法判断
    answer: "A"
    explanation_md: |
      CPI = EV / AC = 600 / 500 = **1.2**，大于 1 ⇒ 成本节约（同样的钱创造了更多价值）。

      干扰项 B 是拿 EV / PV 算出来的（那是 SPI ≈ 0.857，管进度不是管成本）；
      干扰项 C 是 AC / EV 的反向算法。**公式方向记错是这一章最常见的失分点。**
    source: manual

  - id: RK-S2-012
    module_id: S2
    kp_id: KP-0202
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 3
    title: 关键路径怎么算
    body_md: |
      某项目活动：A（2 天）。A 之后并行两条路径：A→B（5 天）→D；A→C（4 天）→D。D 需 3 天。
      关键路径与总工期分别是？
    options:
      - A→C→D，9 天
      - A→B→D，10 天
      - A→B→D，12 天
      - A→C→D，7 天
    answer: "B"
    explanation_md: |
      两条路径：A→B→D = 2+5+3 = **10 天**；A→C→D = 2+4+3 = 9 天。
      关键路径 = **最长**的那条 = A→B→D，总工期取最长路径 10 天。

      常见错误是把中间某条段相加（得出 12）、或把关键路径当成最短路径。
      记住：关键路径最长，因为它决定了项目最早能什么时候完工。
    source: manual

  - id: RK-S2-013
    module_id: S2
    kp_id: KP-0207
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: 变更场景里什么才是主干问题
    body_md: |
      客户口头要求增加一个报表，开发组长认为工作量不大，当天改完直接上线，未通知测试与其他干系人。
      从变更管理角度，最严重的问题是？
    options:
      - 没有提交书面变更申请
      - 未做变更影响分析、未走 CCB 审批、未更新基准
      - 没有做回归测试
      - 没有让客户签字确认
    answer: "B"
    explanation_md: |
      A / C / D 都是流程枝节，B 是**流程主干**：影响分析、审批、更新基准这三步缺了，
      范围就已经失控，其余问题都是它的后果。

      案例题里遇到「哪个是最主要的问题」，先问自己：哪一条缺了会让整件事失控？
    source: manual

  - id: RK-S2-014
    module_id: S2
    kp_id: KP-0205
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: 验收了是不是就结束了
    body_md: |
      某项目主体交付已完成、客户已签字验收，但合同尚未正式关闭、经验教训尚未归档。
      此时项目处于什么状态？
    options:
      - 仍在执行过程组
      - 已转入运维阶段
      - 项目已经结束
      - 已进入收尾过程组，但还有工作未完成
    answer: "D"
    explanation_md: |
      验收 ≠ 收尾。合同关闭、经验教训归档、资源释放都属于收尾过程组，
      做完这些项目才算真正结束。这个判断在案例题里经常作为"项目管理不到位"的论据。
    source: manual

  - id: RK-S2-015
    module_id: S2
    kp_id: KP-0201
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: 只有一句话的项目目标
    body_md: |
      某项目刚立项，项目经理拿到的只有一句「做个数据看板」的口头目标，领导要求下周开始开发。
      项目经理首先应该做的是？
    options:
      - 立刻排开发计划并安排人手
      - 先做技术选型
      - 推动签发正式项目章程，明确目标、边界、关键干系人与授权
      - 先招人，边做边想
    answer: "C"
    explanation_md: |
      没有章程就没有授权、没有边界、没有验收依据——后面所有计划都建在沙子上。
      这一步是启动过程组的核心动作。
      **实务提示**：内网/政务项目里这一步常被跳过，最后扯皮全从这里开始。
    source: manual

  - id: RK-S2-016
    module_id: S2
    kp_id: KP-0203
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: 开发与测试互撕
    body_md: |
      项目执行中，开发组认为测试组报的缺陷太多、影响进度；测试组认为开发质量差、返工多。
      双方在例会上争执不下。项目经理首先应该做的是？
    options:
      - 要求测试组放宽缺陷判定标准
      - 要求开发组加班修复
      - 识别冲突根源（是缺陷标准不清，还是质量确实不达标），再按团队管理过程处理
      - 立即上报高层，由领导裁决
    answer: "C"
    explanation_md: |
      这道题考的是**先归因、再处置**。如果是「标准不清」，动作是统一定义缺陷分级；
      如果是「质量确实差」，动作是查根因（评审缺失、测试左移）。
      两者的解法完全不同——不先分清就动手，一定会返工。
    source: manual

  - id: RK-S2-017
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 5
    title: 用自己项目算一次挣值
    body_md: |
      拿你手上一个真实项目（可以是粗估数），写出 EV、PV、AC、BAC，算出 SV、CV、SPI、CPI，
      并说明它反映出的真实情况。

      要求：数字可以是估的，但**要写出结论和你打算怎么应对**。
    options: []
    answer: "四个基础量齐全；四个派生量公式正确；结论与应对能对上"
    explanation_md: |
      这题的目的不是算对，是**把公式套到真实项目上**。

      合格答案会自然暴露出两件事：① 你项目里到底有没有 PV（基准）；
      ② 没有基准的话，挣值根本算不了——这本身就是项目管理的一个缺口。

      如果你发现「PV 说不出来」，那比算错更有价值：说明没有基线，进度和成本都没法量化控制。
    source: manual

  - id: RK-S2-018
    module_id: S2
    kp_id: KP-0207
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 5
    title: 把一次真实变更重写一遍
    body_md: |
      回忆你项目里一次真实的变更（客户加需求、领导改方向都算），按标准流程把它重写一遍：
      每一步你实际做了什么、标准要求做什么、差在哪。
    options: []
    answer: "对照标准流程逐步骤写；能明确指出自己漏了哪一步及后果"
    explanation_md: |
      合格答案会呈现「实际 vs 标准」的对照，并指出漏的那一步造成了什么后果。

      最常见的是漏 **CCB 审批** 和 **更新基准**——真实项目里往往是「领导一句话就改了」。
      把这层差写出来，案例题里就有素材了：案例分析考的正是「你觉得哪里有问题、该怎么改」。
    source: manual

  - id: RK-S2-019
    module_id: S2
    kp_id: KP-0202
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 5
    title: 给自己项目画三层 WBS
    body_md: |
      给你手上的项目画出三层 WBS：第一层按可交付成果分，第二层拆到子系统/模块，第三层拆到工作包。
      并说明你的分解依据是什么。
    options: []
    answer: "三层分解完整；第一层是可交付成果而不是部门/阶段；能说出分解依据"
    explanation_md: |
      最常见的错误是**按部门或按阶段拆**（"开发部、测试部"或"需求、设计、开发"）。
      WBS 必须按**可交付成果**拆：用户管理模块、订单模块、报表模块……

      因为 WBS 要回答的是「项目要交出哪些东西」，不是「谁来做、按什么顺序做」。
    source: manual

  - id: RK-S2-020
    module_id: S2
    kp_id: KP-0205
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 5
    title: 写一份项目收尾清单
    body_md: |
      为你手上的项目写一份收尾清单（不少于 6 项），每项要写清「谁负责、交付什么、怎么算完成」。
    options: []
    answer: "条目覆盖合同/验收/资料/经验/资源/移交；每项责任人与完成判据清楚"
    explanation_md: |
      合格清单通常包含：客户验收签字、合同/尾款结算、文档归档、经验教训总结、
      资源释放与人员回归、运维移交、账号与权限回收。

      **最容易漏的是「账号与权限回收」**——政务/内网项目里这属于安全问题，验收时会被追问。
    source: manual

  - id: RK-S4-002
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: easy
    level: 1
    title: PMO 的三种类型
    body_md: |
      关于项目管理办公室（PMO）的三种类型，下列说法正确的是？
    options:
      - 控制型 PMO 要求项目遵循既定流程，控制力中等
      - 支持型 PMO 对项目拥有最强的控制力
      - 指令型 PMO 只提供模板和培训，不介入项目
      - 三种类型的区别只在于配备人员的数量
    answer: "A"
    explanation_md: |
      控制力由弱到强：**支持型**（顾问角色，提供模板、最佳实践、培训，控制力弱）→
      **控制型**（要求遵循流程，控制力中等）→ **指令型**（直接管理项目，控制力最强）。
      这个顺序不能记反，案例题里问「PMO 该不该直接指挥项目经理」，答案取决于它是哪一种。
    source: manual

  - id: RK-S4-003
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: easy
    level: 1
    title: 配置项与基线
    body_md: |
      关于配置项和基线，下列理解正确的是？
    options:
      - 项目中的所有文档和代码自动都是配置项，无需识别
      - 基线是经过评审确认的配置项集合，建立后变更须走变更控制
      - 基线一经建立就永久冻结，任何情况下都不允许变更
      - 只有可执行程序才能作为配置项
    answer: "B"
    explanation_md: |
      配置项是「**纳入**配置管理的工作产品」，需要主动识别和标识，不是自动全算（A 错）。
      基线可以变更，但必须走正式变更控制（C 错）——「受控」不等于「冻结」。
      文档、代码、数据、环境配置参数都可以是配置项（D 错）。
    source: manual

  - id: RK-S4-004
    module_id: S4
    kp_id: KP-0402
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: easy
    level: 1
    title: 监理单位的角色定位
    body_md: |
      信息系统工程监理单位的角色定位是？
    options:
      - 承建方的质量管理部门
      - 建设方的内部审计部门
      - 独立于建设方和承建方的第三方
      - 政府主管部门的派出机构
    answer: "C"
    explanation_md: |
      监理是**受建设方委托**、独立于建设方与承建方的第三方。
      它替建设方管项目，但不是建设方的内设部门（B 错）；与承建方是监理与被监理关系，
      不是上下级（A 错）；它不是行政机构，没有行政处罚权（D 错）。
    source: manual

  - id: RK-S4-005
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: medium
    level: 2
    title: 配置库的三库划分
    body_md: |
      配置管理中的三个库，按工作产品的流转顺序排列，正确的是？
    options:
      - 开发库（动态库）→ 受控库（主库）→ 产品库（静态库）
      - 产品库 → 受控库 → 开发库
      - 受控库 → 开发库 → 产品库
      - 三个阶段共用同一个库，靠目录区分
    answer: "A"
    explanation_md: |
      开发库存开发过程中的工作产品，修改相对自由；受控库存**基线**，改动须走变更控制；
      产品库存最终交付版本，只读。流向是单向的：开发 → 受控 → 产品。

      **最容易记反的是「受控库≠产品库」**：受控库存的是过程中的基线（可能有好几个），
      产品库才是最终交付物。
    source: manual

  - id: RK-S4-006
    module_id: S4
    kp_id: KP-0402
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: medium
    level: 2
    title: 监理的三种现场工作方式
    body_md: |
      监理工程师在关键工序、关键部位实施全过程现场监督，这种方式称为？
    options:
      - 巡视
      - 抽查
      - 平行检验
      - 旁站
    answer: "D"
    explanation_md: |
      **旁站**＝在关键部位、关键工序**全过程**现场监督；
      **巡视**＝定期或不定期到现场查看（不保证全程）；
      **平行检验**＝监理方用自有设备独立检测，与承建方的数据比对。

      三者的区别就一条：**是否全程在场、是否有独立数据**。监理实施细则里要写清哪些工序必须旁站，
      否则事后无法证明监理履职。
    source: manual

  - id: RK-S4-007
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: medium
    level: 2
    title: 配置管理员的职责边界
    body_md: |
      下列哪一项**不属于**配置管理员的职责？
    options:
      - 建立和维护配置库
      - 标识配置项并记录其状态
      - 审批变更申请是否符合项目目标
      - 执行配置审计并记录结果
    answer: "C"
    explanation_md: |
      审批变更是**变更控制委员会（CCB）**的职责。配置管理员只负责受理、登记、分发、归档，
      **不判定这个变更该不该做**。

      这条区分是案例题的高频考点：配置管理员＝执行者，CCB＝决策者，项目经理＝变更的提出者或推动者。
      三者混淆是答错的主要原因。
    source: manual

  - id: RK-S4-008
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: medium
    level: 3
    title: 配置项数量核算
    body_md: |
      某项目初始有配置项 120 个。建立基线后共发生 3 次变更，每次新增配置项 15 个、废止 5 个。
      当前有效配置项数量是多少？
    options:
      - "135"
      - "120"
      - "165"
      - "150"
    answer: "D"
    explanation_md: |
      每次净增 15−5＝10 个，3 次共净增 30 个，120＋30＝**150**。

      **「废止」不等于「删除」**：废止的配置项在配置库中仍要保留记录以备追溯，只是不再计入有效配置项。
      如果题目问的是「配置库中的记录总数」，那就该算 120＋45＝165（新增全算、废止不删）——
      看清题目问的是「有效」还是「记录总数」。
    source: manual

  - id: RK-S4-009
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: medium
    level: 3
    title: 质量保证金的返还
    body_md: |
      某项目合同价 800 万元，约定质量保证金比例为 5%。缺陷责任期满且期间未发生应由承建方承担的
      质量问题，建设方应返还的质量保证金是多少？
    options:
      - 40 万元
      - 20 万元
      - 80 万元
      - 不返还，作为项目节余留存
    answer: "A"
    explanation_md: |
      800×5%＝**40 万元**。

      **质保金是「预留」不是「扣罚」**：只要缺陷责任期内没有发生应由承建方承担的质量问题，
      就应全额返还，不能以「没出问题所以不用给」为由扣下。这个认知错误在实际项目结算里很常见。
    source: manual

  - id: RK-S4-010
    module_id: S4
    kp_id: KP-0402
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: hard
    level: 3
    title: 监理费的计算口径
    body_md: |
      某信息系统工程投资额 2000 万元，合同约定监理费按投资额的 3% 计取，监理服务期 6 个月。
      监理费总额是多少？
    options:
      - 30 万元
      - 200 万元
      - 120 万元
      - 60 万元
    answer: "D"
    explanation_md: |
      2000×3%＝**60 万元**。

      **服务期 6 个月是干扰项**——按投资额比例计取时，服务成本已包含在费率里，不再另乘月份。
      只有当合同改成「按人月计费」（多少人 × 多少月 × 单价）时，服务期才进入计算。
      这类题考的不是算术，是**看清计费口径**。
    source: manual

  - id: RK-S4-011
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: hard
    level: 4
    title: 绕过变更控制直接改受控库
    body_md: |
      项目已建立基线。开发组长发现一个严重缺陷，为赶进度直接在受控库中修改了代码并提交测试。
      作为配置管理员，你**首先**应该做什么？
    options:
      - 认可这次修改，因为缺陷确实严重，改对了就行
      - 立即冻结该配置项，补充变更申请并提交 CCB 追溯评审
      - 直接把代码回滚到修改前，不做任何记录
      - 把这次修改直接记为下一个基线的正常内容
    answer: "B"
    explanation_md: |
      关键动作是「**先止血 + 补流程**」，既不是一票否决，也不是默认接受。

      严重缺陷不能不改（所以不能简单回滚了事），但也不能不备案：冻结 → 补变更申请 →
      CCB 追溯评审 → 按结论决定保留或回退，全过程留痕。
      选 C 的毛病是**没有留痕**，事后无法审计，也无法解释基线为什么和记录对不上。
    source: manual

  - id: RK-S4-012
    module_id: S4
    kp_id: KP-0402
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: hard
    level: 4
    title: 隐蔽工程未验收即覆盖
    body_md: |
      监理在巡检中发现承建方已将隐蔽工程的管线敷设覆盖，且此前未通知监理验收。
      监理的正确做法是？
    options:
      - 要求剥离覆盖层重新验收，由此产生的费用与工期延误由承建方承担
      - 视为验收合格，在监理日志中补记一笔
      - 直接下达停工令并上报政府主管部门
      - 要求承建方补拍现场照片即可通过
    answer: "A"
    explanation_md: |
      隐蔽工程必须**先验收、后覆盖**。未经验收即覆盖的，监理有权要求剥离复验，
      费用与工期责任由承建方承担。

      **不要一上来就选停工令**：停工适用于重大质量或安全隐患，本题属于程序违规，
      先剥离复验、据结果再定；补拍照片无法证明覆盖前的状态，不构成验收依据。
    source: manual

  - id: RK-S4-013
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: hard
    level: 4
    title: PMO 的介入边界
    body_md: |
      某矩阵型组织中，项目经理与职能经理在人员调配上的冲突已影响关键路径。
      PMO 是控制型 PMO，它恰当的介入方式是？
    options:
      - 直接替项目经理决定人员如何分配
      - 不介入，这属于项目经理与职能经理之间的事
      - 依据组织级资源管理流程组织协调，并记录冲突处理结论
      - 上报客户，由客户裁定人员分配
    answer: "C"
    explanation_md: |
      **控制型 PMO 是「建规则 + 促遵循」，不是「代人决策」**——直接决定人员分配是指令型 PMO 的做法。

      不介入是失职：跨部门资源冲突正是 PMO 该协调的组织级问题。
      上报客户更不对：内部管理问题上交客户，等于把矛盾转移给甲方，还会损害信任。
    source: manual

  - id: RK-S4-014
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 实操
    difficulty: hard
    level: 5
    title: 写一份配置管理计划要点
    body_md: |
      为你手上的项目写一份配置管理计划要点（不少于 5 项），每项写清「做什么、谁负责、产出什么」。
    options: []
    answer: "覆盖配置项识别、库与权限、基线划分、变更控制流程、配置审计与状态报告；每项有责任人与产出物"
    explanation_md: |
      合格要点通常包含：① 配置项识别与命名规则 ② 三库划分及访问权限 ③ 基线划分时点
      （需求基线、设计基线、产品基线）④ 变更控制流程与 CCB 组成 ⑤ 配置审计
      （功能配置审计 FCA、物理配置审计 PCA）⑥ 配置状态报告机制。

      **最容易漏的是「权限」**——只写「建三个库」而不写谁能写、谁只能读，
      等于没做控制，评审时会被直接打回。
    source: manual

  - id: RK-S4-015
    module_id: S4
    kp_id: KP-0402
    category: 中项·S4 组织保障与监理
    type: 实操
    difficulty: hard
    level: 5
    title: 写一份旁站监理记录要点
    body_md: |
      写一份旁站监理记录的要点（不少于 5 项）。假设旁站对象是机房综合布线的线缆敷设。
    options: []
    answer: "覆盖时间地点、旁站部位与工序、施工依据、现场实测数据、问题与处理、双方签认"
    explanation_md: |
      合格记录包含：① 旁站时间、地点 ② 旁站的具体部位与工序 ③ 施工依据（图纸号、规范号）
      ④ 现场实测数据（线缆型号、长度、弯曲半径、牵引力）⑤ 发现的问题、处理意见与整改结果
      ⑥ 承建方与监理方签认。

      **没有实测数据的旁站记录等于没去现场**。这是监理资料审查最常见的退回原因——
      只写「已旁站，情况正常」的记录，事后无法作为履职证据。
    source: manual

  - id: RK-S4-016
    module_id: S4
    kp_id: KP-0401
    category: 中项·S4 组织保障与监理
    type: 实操
    difficulty: hard
    level: 5
    title: 写一份项目立项评审清单
    body_md: |
      写一份项目立项评审清单（不少于 6 项），用于判断一个立项申请是否应该批准。
      每项要有可判断的判据，不要写「很重要」这类无法验证的表述。
    options: []
    answer: "覆盖业务价值、目标可衡量、范围边界、可行性、预算与资源、里程碑、风险、验收标准"
    explanation_md: |
      合格清单：① 业务价值与战略一致性 ② 目标可衡量（SMART）③ 范围边界清晰
      ④ 技术与实施可行性 ⑤ 预算与资源落实 ⑥ 里程碑与关键路径 ⑦ 主要风险与应对
      ⑧ 验收标准与责任主体。

      **最容易漏的是「不做什么」**——范围里只写要做什么、不写排除项，后期必然扯皮。
      评审清单的价值不在条目多，而在每条都能给出「过 / 不过」的判定。
    source: manual

  - id: RK-S5-002
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: easy
    level: 1
    title: 中标通知书的法律效力
    body_md: |
      关于中标通知书的法律效力，下列说法正确的是？
    options:
      - 中标通知书发出后，招标人改变中标结果只需退还投标保证金
      - 中标通知书对招标人和中标人均具有法律效力，发出后改变结果须承担法律责任
      - 中标通知书在签订书面合同后才生效
      - 中标通知书属于要约邀请，不具有约束力
    answer: "B"
    explanation_md: |
      《招标投标法》明确：**中标通知书对招标人和中标人具有法律效力**。
      发出后，招标人改变中标结果、或中标人放弃中标的，都要依法承担法律责任。

      法律定性链条：招标公告＝**要约邀请**，投标＝**要约**，中标通知书＝**承诺**。
      既然它是承诺，就自**发出**时生效，不是等到签合同才生效（C 错）。
    source: manual

  - id: RK-S5-003
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: easy
    level: 1
    title: 软件著作权的保护期
    body_md: |
      某公司 2020 年开发完成一套软件并首次发表。该软件著作权的保护期是？
    options:
      - 自首次发表起 50 年
      - 自开发完成起 10 年
      - 自首次发表起 20 年
      - 永久保护
    answer: "A"
    explanation_md: |
      法人或其他组织的软件著作权，保护期为 **50 年**，截止于软件**首次发表后**第 50 年的 12 月 31 日。
      自然人的软件著作权保护期为**自然人终生及其死亡后 50 年**。

      注意区分主体：单位开发看「首次发表起 50 年」，个人开发看「终生加死后 50 年」。
      另外，**开发完成但未发表**的，保护期自开发完成起算 50 年。
    source: manual

  - id: RK-S5-004
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: medium
    level: 1
    title: 必须招标的金额门槛
    body_md: |
      按现行规定，使用国有资金投资的项目，其**施工**单项合同估算价达到多少，必须招标？
    options:
      - 100 万元人民币以上
      - 200 万元人民币以上
      - 400 万元人民币以上
      - 1000 万元人民币以上
    answer: "C"
    explanation_md: |
      三个门槛要分开记，**别混成一个数**：
      施工 **400 万**；重要设备、材料等货物 **200 万**；勘察、设计、监理等服务 **100 万**。

      记忆锚点：**服务最低、货物居中、施工最高**。三者都是「单项合同估算价」，
      不是项目总投资——这是最常见的理解错误。
    source: manual

  - id: RK-S5-005
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: medium
    level: 2
    title: 招标投标中的要约与承诺
    body_md: |
      在招标投标过程中，下列对应关系正确的是？
    options:
      - 招标公告是要约，投标是承诺
      - 招标公告是承诺，中标通知书是要约
      - 招标公告是要约邀请，投标是要约，中标通知书是承诺
      - 三者都属要约邀请，均无法律约束力
    answer: "C"
    explanation_md: |
      **招标公告＝要约邀请**（邀请别人来提条件，自己不受约束）；
      **投标＝要约**（提出具体条件，一旦被接受就受约束）；
      **中标通知书＝承诺**（接受该要约，合同成立）。

      这条链决定了「投标截止后能不能撤标」这类题的答案：投标是要约，撤回有严格时间限制。
    source: manual

  - id: RK-S5-006
    module_id: S5
    kp_id: KP-0502
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: medium
    level: 2
    title: 标准的五个层级
    body_md: |
      按《标准化法》，我国标准的层级不包括下列哪一项？
    options:
      - 国家标准
      - 行业标准
      - 项目标准
      - 团体标准
    answer: "C"
    explanation_md: |
      五个层级：**国家标准、行业标准、地方标准、团体标准、企业标准**。
      「项目标准」是编出来的干扰项，标准化法里没有这个层级。

      常见的混淆点：把「团体标准、企业标准」当成非正式标准——它们都是法定层级，
      只是**团体标准和企业标准不得低于强制性国家标准的相关技术要求**。
    source: manual

  - id: RK-S5-007
    module_id: S5
    kp_id: KP-0502
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: medium
    level: 2
    title: 强制性标准与推荐性标准
    body_md: |
      关于强制性国家标准和推荐性国家标准，下列说法正确的是？
    options:
      - 强制性标准代号为 GB/T，推荐性标准代号为 GB
      - 推荐性标准一经发布，相关方必须执行
      - 强制性标准必须执行，推荐性标准国家鼓励采用
      - 行业标准一律为强制性标准
    answer: "C"
    explanation_md: |
      代号别记反：**GB＝强制性**，**GB/T＝推荐性**（T 即「推」）。
      强制性标准必须执行，推荐性标准国家鼓励采用（合同约定采用后即对当事方有约束力）。

      行业标准、地方标准**都是推荐性的**（D 错）；只有国家标准可以是强制性标准。
      判断某标准是否强制，看代号和是否属于保障人身健康、生命财产安全等范围。
    source: manual

  - id: RK-S5-008
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: hard
    level: 3
    title: 投标保证金的上限
    body_md: |
      某依法必须招标的项目，招标项目估算价为 5000 万元。招标文件要求投标人提交投标保证金，
      其最高限额是多少？
    options:
      - 50 万元
      - 500 万元
      - 100 万元
      - 80 万元
    answer: "D"
    explanation_md: |
      两个上限**取小**：① 不得超过招标项目估算价的 **2%**（5000×2%＝100 万）；
      ② 最高不得超过 **80 万元**。所以答案是 **80 万元**。

      这是典型的「双重限额」题——只算 2% 会得出 100 万，正好落在干扰项上。
      看到「不得超过……且最高不超过……」这种表述，一定要两个条件都过一遍。
    source: manual

  - id: RK-S5-009
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: hard
    level: 3
    title: 定金的法定上限
    body_md: |
      甲乙双方签订合同，合同标的额为 200 万元。双方约定定金担保，依法可以产生定金效力的
      最高金额是多少？
    options:
      - 20 万元
      - 200 万元
      - 60 万元
      - 40 万元
    answer: "D"
    explanation_md: |
      定金不得超过主合同标的额的 **20%**：200×20%＝**40 万元**。

      关键细节：**超过 20% 的部分不产生定金效力**，不是整个约定无效。比如约定 60 万定金，
      其中 40 万有定金效力，多出的 20 万按预付款处理。

      另外记住定金罚则的方向：**给付方违约不得请求返还，收受方违约应双倍返还**。
    source: manual

  - id: RK-S5-010
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: hard
    level: 3
    title: 履约保证金的上限
    body_md: |
      某项目中标合同金额为 1200 万元。招标文件要求中标人提交履约保证金，
      该履约保证金的最高限额是多少？
    options:
      - 24 万元
      - 60 万元
      - 120 万元
      - 240 万元
    answer: "C"
    explanation_md: |
      履约保证金**不得超过中标合同金额的 10%**：1200×10%＝**120 万元**。

      三个「保证金」要分清，别串：
      **投标保证金**＝估算价 2%，最高 80 万；**履约保证金**＝合同金额 10%；
      **质量保证金**＝结算价 5% 左右（按合同约定）。考试常把它们混在一个选项里考。
    source: manual

  - id: RK-S5-011
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: hard
    level: 4
    title: 招标文件指定品牌
    body_md: |
      某政务项目招标文件中写明「投标产品数据库必须为某国外品牌」。作为投标方，
      你对该条款的正确判断是？
    options:
      - 合理，招标人有权规定技术路线
      - 不合理，招标人不得以不合理条件限制、排斥潜在投标人
      - 合理，只要在招标公告中提前公示即可
      - 不合理，但只能在中标后再提异议
    answer: "B"
    explanation_md: |
      《招标投标法》禁止招标人以不合理条件限制或排斥潜在投标人、实行歧视待遇。

      技术需求应当写**性能指标和功能要求**（如「支持 SQL-92、单表千万级查询响应 ≤2 秒」），
      而不是指定品牌。确实无法用其他方式准确描述时，才可写「参照某品牌」并注明「相当于或优于」。

      **异议要在投标截止前提出**（D 错）——中标后再提，程序上已经晚了。
    source: manual

  - id: RK-S5-012
    module_id: S5
    kp_id: KP-0503
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: hard
    level: 4
    title: 客户环境中的第三方代码
    body_md: |
      你在为客户做系统运维时，在客户服务器上发现一段源码，明显是竞争对手产品的核心算法，
      且没有任何授权说明。你的正确做法是？
    options:
      - 直接复用，代码在客户服务器上就属于客户资产
      - 记录备案后暂不处理，等客户主动说明
      - 立即停止使用该代码，书面报告客户并建议核查来源与授权，未获合法授权前予以隔离
      - 删除该文件，避免给自己带来风险
    answer: "C"
    explanation_md: |
      正确处理是三件事：**停用、报告、核查授权**。

      选 A 是侵权——部署位置不改变著作权归属；选 B 是消极不作为，知情后仍继续使用会扩大风险；
      选 D 更糟，**擅自删除客户环境中的文件本身就是越权操作**，还破坏了证据链。

      这题测的是职业道德里最难的一条：**遇到可能违法的事，要留痕上报，而不是自己处理掉**。
    source: manual

  - id: RK-S5-013
    module_id: S5
    kp_id: KP-0502
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: hard
    level: 4
    title: 未生效标准作为验收依据
    body_md: |
      客户要求把一项尚未发布实施的国家标准草案写入合同，作为项目验收依据。
      作为承建方，恰当的处理方式是？
    options:
      - 直接同意，客户的要求优先
      - 拒绝写入合同，验收只能依据现行有效标准
      - 明确草案的版本与条款范围并写入合同作为约定依据，同时声明涉及强制性要求仍执行现行有效标准
      - 口头答应，验收时再按现行标准执行
    answer: "C"
    explanation_md: |
      两个层面要分开：
      **约定层面**——合同可以约定采用某个技术文件（含草案），但必须写清**版本号和适用范围**，
      否则将来草案改了，双方对「按哪一版验收」必然吵架。
      **强制层面**——涉及人身健康、生命财产安全的强制性要求，只能执行**现行有效**的强制性标准，
      不能拿草案替代。

      选 B 过于绝对（合同自由允许约定技术依据），选 D 是埋雷。
    source: manual

  - id: RK-S5-014
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 实操
    difficulty: hard
    level: 5
    title: 写一份合同关键条款风险清单
    body_md: |
      写一份信息系统集成合同的关键条款风险清单（不少于 6 项）。每项写清「哪条容易出问题、
      出问题后的后果、怎么在合同里写死」。
    options: []
    answer: "覆盖范围与变更、验收标准、付款节点、工期与顺延、知识产权归属、保密与违约、质保与运维"
    explanation_md: |
      高风险条款通常集中在：① 范围与变更（未约定变更计价方式）② 验收标准（写「满足客户需求」
      这类不可判定的表述）③ 付款节点（与验收脱钩，导致干完收不到钱）④ 工期顺延条件
      （未约定客户原因导致的延误如何处理）⑤ 知识产权归属（定制开发成果归谁）
      ⑥ 保密与数据安全责任 ⑦ 质保期起算点与响应时限 ⑧ 违约责任的封顶与例外。

      **最致命的一条是验收标准**：写「达到客户满意」等于把验收权完全交给对方。
      合格写法是「按 GB/T 8566 及本合同附件《验收测试用例》全部通过」。
    source: manual

  - id: RK-S5-015
    module_id: S5
    kp_id: KP-0502
    category: 中项·S5 法规与职业道德
    type: 实操
    difficulty: hard
    level: 5
    title: 写一份项目应遵循的标准清单
    body_md: |
      为「政务数据共享交换平台」项目列出应遵循的标准清单（不少于 6 项），
      每项写明「标准类别（强制/推荐）、适用环节、为什么必须遵循」。
    options: []
    answer: "覆盖安全等级保护、数据分类分级、接口与数据交换、文档编制、质量与测试、验收；区分强制与推荐"
    explanation_md: |
      合格清单应覆盖：① 网络安全等级保护相关标准（定级、设计、测评）② 数据分类分级与
      个人信息保护相关要求 ③ 数据交换接口规范（如政务信息资源目录与交换体系标准）
      ④ 软件文档编制规范（GB/T 8567）⑤ 软件工程与质量相关标准（GB/T 8566、GB/T 25000 系列）
      ⑥ 系统验收与测评要求。

      **答题关键是分清强制与推荐**：等保相关要求属必须执行，文档编制类多为推荐但合同约定后即成义务。
      只列一串标准号而不说「适用哪个环节」，是这类题的常见失分点。
    source: manual

  - id: RK-S5-016
    module_id: S5
    kp_id: KP-0503
    category: 中项·S5 法规与职业道德
    type: 实操
    difficulty: hard
    level: 5
    title: 写一段利益冲突情形的处理说明
    body_md: |
      情形：你是某项目的技术负责人，该项目正在评标。你配偶所在的公司也参与了本次投标。
      请写出你的处理说明（不少于 4 条），说明你怎么做、依据是什么。
    options: []
    answer: "主动申报、申请回避、不接触评审信息、留存书面记录、服从组织安排"
    explanation_md: |
      合格答案包含：① **主动书面申报**该关联关系（不等人来问）② **申请回避**与评标相关的
      一切工作 ③ 在回避决定做出前，**不接触、不传递任何评审信息** ④ 不对外讨论该项目投标情况
      ⑤ 留存申报与回避的书面记录 ⑥ 服从单位的回避安排，不因回避影响正常工作交接。

      **这道题的分水岭在「主动」二字**：等被发现再说明，性质就从「合规申报」变成「隐瞒关联」。
      职业道德考的是这个区别，不是背条款。
    source: manual

  - id: RK-S6-003
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 单选
    difficulty: easy
    level: 1
    title: 英文术语 WBS
    body_md: |
      项目管理中的 WBS 指的是？
    options:
      - 工作分解结构
      - 工作说明书
      - 挣值管理
      - 关键路径法
    answer: "A"
    explanation_md: |
      **WBS＝Work Breakdown Structure，工作分解结构**。它把项目范围逐层分解为可管理的工作包，
      是范围管理的核心输出，也是估算工期和成本的依据。

      容易混的三个：**SOW**（Statement of Work，工作说明书，属于采购/合同文件）、
      **WBS**（分解结构，属于范围基准）、**OBS**（Organizational Breakdown Structure，组织分解结构）。
    source: manual

  - id: RK-S6-004
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 单选
    difficulty: easy
    level: 1
    title: 英文术语 SPI 与 CPI
    body_md: |
      EVM 体系中，SPI 和 CPI 分别表示？
    options:
      - 进度绩效指数、成本绩效指数
      - 成本绩效指数、进度绩效指数
      - 计划价值、实际成本
      - 完工估算、完工尚需估算
    answer: "A"
    explanation_md: |
      **SPI＝Schedule Performance Index，进度绩效指数**＝EV/PV；
      **CPI＝Cost Performance Index，成本绩效指数**＝EV/AC。

      对应记忆：**S 打头管进度（Schedule），C 打头管成本（Cost）**。
      另外三个值：PV 计划价值、EV 挣值、AC 实际成本；两个预测：EAC 完工估算、ETC 完工尚需估算。
    source: manual

  - id: RK-S6-005
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 1
    title: 英文术语 CCB 与 RFP
    body_md: |
      CCB 和 RFP 分别指？
    options:
      - 变更控制委员会、建议邀请书
      - 配置控制基线、需求建议书
      - 变更控制委员会、工作说明书
      - 质量保证、请求批准
    answer: "A"
    explanation_md: |
      **CCB＝Change Control Board，变更控制委员会**——变更的决策机构。
      **RFP＝Request for Proposal，建议邀请书**（也译需求建议书），采购中邀请卖方提交方案的正式文件。

      与采购相关的三个别混：**RFI**（信息邀请书，先摸底）、**RFQ**（报价邀请书，问价格）、
      **RFP**（建议邀请书，要方案）。**IFB**（Invitation for Bid，招标书）用于价格为主要因素的采购。
    source: manual

  - id: RK-S6-006
    module_id: S6
    kp_id: KP-0602
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 2
    title: 关键路径的判定标准
    body_md: |
      关于关键路径，下列说法正确的是？
    options:
      - 关键路径是网络图中活动数量最多的路径
      - 关键路径是网络图中总工期最长的路径，其上活动总时差为 0
      - 关键路径是网络图中总工期最短的路径
      - 一个项目网络中可能存在多条关键路径，但总工期不同
    answer: "B"
    explanation_md: |
      **关键路径＝最长路径**，它决定项目最短工期；其上活动**总时差为 0**，任何延误都会直接推迟工期。

      干扰项逐个看：A 错在「活动数量最多」——关键路径看**工期之和**，不看活动个数（一个 1 天活动
      和三个 3 天活动，后者路径更长但数量少）。
      C 把最长记成最短，是最常见的记反。
      D 前半句对（可以有多条），后半句错——多条关键路径的**总工期必然相同**，否则长的才算关键。
    source: manual

  - id: RK-S6-007
    module_id: S6
    kp_id: KP-0601
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 2
    title: 挣值的三个基本值
    body_md: |
      关于 PV、EV、AC 三个基本值，下列说法正确的是？
    options:
      - PV 是「实际花了多少钱」，AC 是「应该花多少钱」
      - EV 是「实际完成工作的预算价值」，不是实际花费
      - 三者都按实际支出统计，区别只在统计口径
      - EV 一定等于 PV，因为都按预算计算
    answer: "B"
    explanation_md: |
      **EV 是「干了多少活，按预算折算成钱」**，不是实际花了多少钱——这是挣值法最关键、
      也最容易错的一点。

      三个值的口径：
      **PV**＝按计划到此刻应该完成的工作，值多少预算；
      **EV**＝实际已完成的工作，值多少预算；
      **AC**＝完成这些工作实际花了多少钱。

      只有 AC 是真实支出，PV 和 EV 都是**预算口径**。A 把 PV 和 AC 说反了。
    source: manual

  - id: RK-S6-008
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 实操
    difficulty: medium
    level: 2
    title: 写一份中英术语对照表
    body_md: |
      写一份中项考试常用的中英术语对照表（不少于 10 组）。每组写上英文全称、缩写、中文，
      并在括号里标一句「在哪个过程用到」。
    options: []
    answer: "覆盖 WBS、SOW、CCB、EVM、PV/EV/AC、SPI/CPI、EAC/ETC、RFP、QA/QC、CPM 等，且标明使用场景"
    explanation_md: |
      高频 10 组：① WBS 工作分解结构 ② SOW 工作说明书 ③ CCB 变更控制委员会
      ④ EVM 挣值管理 ⑤ PV/EV/AC 计划价值/挣值/实际成本 ⑥ SPI/CPI 进度/成本绩效指数
      ⑦ EAC/ETC 完工估算/完工尚需估算 ⑧ RFP 建议邀请书 ⑨ QA/QC 质量保证/质量控制
      ⑩ CPM 关键路径法。

      **光背缩写没用**——上午题常给一个项目经理的邮件或报告片段，让你判断「他在做什么」。
      能说出「这个术语出现在哪个过程」才算真认得。
    source: manual

  - id: RK-S6-009
    module_id: S6
    kp_id: KP-0601
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 3
    title: 挣值指标计算与判定
    body_md: |
      某项目当前 PV＝100 万元，EV＝80 万元，AC＝90 万元。下列关于项目状态的说法正确的是？
    options:
      - 成本节约 10 万元，进度提前
      - 成本超支 10 万元，进度落后，CPI＝0.89，SPI＝0.80
      - 成本超支 20 万元，进度落后，CPI＝0.80，SPI＝0.89
      - 进度落后 20 万元，成本节约 10 万元
    answer: "B"
    explanation_md: |
      四个公式走一遍：
      **CV＝EV−AC＝80−90＝−10 万**（负＝成本超支）
      **SV＝EV−PV＝80−100＝−20 万**（负＝进度落后）
      **CPI＝EV/AC＝80/90≈0.89**（＜1＝成本超支）
      **SPI＝EV/PV＝80/100＝0.80**（＜1＝进度落后）

      判定口诀：**差值看正负，指数看是否小于 1**。两者必然一致，如果算出来不一致，
      就是公式记错了——这是自查的好办法。C 把 CPI 和 SPI 的分子分母调换了。
    source: manual

  - id: RK-S6-010
    module_id: S6
    kp_id: KP-0602
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 3
    title: 关键路径与最短工期
    body_md: |
      某项目活动及依赖关系如下（工期单位：周）：
      A 无前置，工期 3；B 前置 A，工期 4；C 前置 A，工期 6；D 前置 B、C，工期 5。
      项目的最短工期是多少？
    options:
      - 12 周
      - 18 周
      - 15 周
      - 14 周
    answer: "D"
    explanation_md: |
      把所有路径列出来算总长：
      **A→B→D＝3＋4＋5＝12 周**
      **A→C→D＝3＋6＋5＝14 周**

      最长的是 14 周，所以**最短工期＝14 周**，关键路径是 **A→C→D**。

      注意「最短工期」和「最长路径」是同一件事的两个说法——项目工期由最长的路径决定，
      这是网络图题的第一原理，也是 12 这个错误选项的来源。
    source: manual

  - id: RK-S6-011
    module_id: S6
    kp_id: KP-0602
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 3
    title: 总时差的计算
    body_md: |
      沿用上题：A 无前置工期 3；B 前置 A 工期 4；C 前置 A 工期 6；D 前置 B、C 工期 5。
      活动 B 的总时差是多少？
    options:
      - 0 周
      - 2 周
      - 4 周
      - 6 周
    answer: "B"
    explanation_md: |
      **总时差＝关键路径工期 − 该活动所在最长路径工期**。
      B 所在的最长路径是 A→B→D＝12 周，关键路径 14 周，所以总时差＝**2 周**。

      换个算法验证：B 最早完成＝3＋4＝7 周；D 最早开始＝max(3+4, 3+6)＝9 周；
      B 有 9−7＝2 周的活动空间。两种算法结果一致。

      **关键路径上的活动总时差为 0**（C 是 0），这是快速自查的方法。
    source: manual

  - id: RK-S6-012
    module_id: S6
    kp_id: KP-0601
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 4
    title: 进度落后且成本超支的处置
    body_md: |
      某项目 CPI＝0.85，SPI＝0.90，客户要求工期不能延后。作为项目经理，你**首先**应该做什么？
    options:
      - 立即增加人员赶工，把进度追回来
      - 缩减测试范围，把时间让给开发
      - 直接向客户申请延长工期
      - 核实挣值数据的准确性并分析偏差原因，再评估可选措施及其成本影响
    answer: "D"
    explanation_md: |
      先**核实数据、分析原因**，再谈措施——这是所有偏差处置题的第一动作。

      **为什么不选赶工**：CPI 已经 0.85（成本超支），赶工通常要加钱，会让成本进一步恶化，
      属于「用一个问题换另一个更大的问题」。赶工只能作为分析后的可选项之一，且要先评估
      「加多少成本、能追回多少天」。

      不选 C：客户已明确工期不能延后，直接申请延期等于没回应约束。
      不选 D：缩减测试范围是**降低质量**，在政务/金融类项目里往往直接违约。
    source: manual

  - id: RK-S6-013
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 4
    title: 案例背景信息互相矛盾时的答法
    body_md: |
      案例背景写「项目启动时已完成需求确认」，但后面又写「开发期间客户多次提出新需求，
      项目经理均安排开发人员直接实现」。作答时应当？
    options:
      - 指出背景描述有矛盾，拒绝作答该问
      - 以「需求已确认」为准，说明问题出在客户不守约
      - 抓住「直接实现」这一事实，指出变更未走控制流程、需求未形成基线，并给出对应措施
      - 只回答后半段的措施，不分析前因
    answer: "C"
    explanation_md: |
      案例题**永远按「事实行为」判，不按「说法」判**。「已确认需求」是一句声明，
      「多次提出新需求且直接实现」是可观察的行为——后者才是问题所在。

      正确的分析链：需求确认后**未建立基线** → 新需求**未走变更控制** → 变更**未评估影响**
      → 导致范围蔓延。对应措施要落到动作上：建立需求基线、补变更流程、设 CCB、变更必须评估
      对进度成本的影响后再实施。

      选 A 直接丢分（案例题没有「拒绝作答」这个选项）；选 B 把责任推给客户，不解决自己的管理问题，
      阅卷按「归因错误」扣分。
    source: manual

  - id: RK-S6-014
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 4
    title: 上午卷的时间分配
    body_md: |
      上午基础知识卷共 75 道单选题，考试时间 150 分钟。关于时间分配，下列做法最合理的是？
    options:
      - 严格按顺序作答，每题不限时，确保每题都想透
      - 全部做完后再统一涂卡，不预留检查时间
      - 先做最后 20 道题，因为后面的题通常更难、分值更高
      - 平均每题 2 分钟，超过 3 分钟仍无思路的先标记跳过，最后统一回看并留足涂卡时间
    answer: "D"
    explanation_md: |
      75 题 / 150 分钟＝**平均 2 分钟一题**。合理策略是：**先拿稳分，再攻难题，留足涂卡时间**。

      不选 A：一道题卡 8 分钟，等于挤掉 4 道会做的题，这是上午卷最常见的失分方式。
      不选 C：中项上午卷每题**分值相同**（各 1 分），不存在「后面题分值高」这回事。
      不选 D：全部做完再涂卡，一旦时间不够就是整卷作废——**边做边涂或分段涂卡**。

      记住一条：上午卷是「75 分制、45 分及格」，**容错空间有 30 分**，
      不需要每题都做对，需要的是把会做的都拿到。
    source: manual

  - id: RK-S6-015
    module_id: S6
    kp_id: KP-0602
    category: 中项·S6 应试专项
    type: 实操
    difficulty: hard
    level: 5
    title: 画网络图并标出关键路径
    body_md: |
      已知活动与依赖：A 无前置（5 天）；B 前置 A（8 天）；C 前置 A（4 天）；
      D 前置 B（6 天）；E 前置 C（10 天）；F 前置 D、E（3 天）。
      请画出单代号网络图，列出全部路径及各自长度，标出关键路径与总工期，
      并说明活动 C 的总时差。
    options: []
    answer: "路径 A-B-D-F=22、A-C-E-F=22，两条关键路径，总工期 22 天，C 总时差为 0"
    explanation_md: |
      路径枚举：
      **A→B→D→F＝5＋8＋6＋3＝22 天**
      **A→C→E→F＝5＋4＋10＋3＝22 天**

      两条路径**等长**，所以有**两条关键路径**，总工期 22 天。C 在关键路径上，**总时差＝0**。

      这题的陷阱是「两条关键路径」——很多人只找到一条就下结论。**多条关键路径意味着
      任何一条上的任何活动延误都会推迟工期，风险是成倍放大的**，案例题里问「该项目的主要风险」
      就该答这一点。答题时必须把路径逐条列出来，只写答案不给路径过程，过程分会全丢。
    source: manual

  - id: RK-S6-016
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 实操
    difficulty: hard
    level: 5
    title: 写一道案例题的完整答案
    body_md: |
      案例：某政务平台项目合同工期 12 个月。实施到第 8 个月时，客户新增 3 项功能要求，
      项目经理安排开发直接实现，未办理任何手续。第 11 个月系统进入测试，发现部分模块与
      原设计不符，客户拒绝验收，项目延期 2 个月。
      请写出完整答案：指出问题（不少于 4 条）+ 对应改进措施（每条对应一个问题）。
    options: []
    answer: "问题与措施一一对应，覆盖变更控制、范围基线、需求确认、测试与验收、进度管理"
    explanation_md: |
      **问题**：① 新增需求未走变更控制流程（无申请、无评审、无批准）
      ② 需求未形成基线，范围边界不清 ③ 变更未评估对进度、成本、质量的影响
      ④ 开发直接实现需求，缺少设计与需求的双向追溯 ⑤ 测试阶段才发现与原设计不符，
      说明缺少阶段评审和过程质量控制 ⑥ 进度无缓冲，变更影响未纳入进度计划。

      **措施（一一对应）**：① 建立变更控制流程并设 CCB，任何变更须书面申请、评审、批准
      ② 建立需求基线，明确范围与排除项 ③ 变更前做影响分析，输出对工期/成本/质量的评估结论
      ④ 建立需求-设计-代码-测试的追溯矩阵 ⑤ 在关键节点设阶段评审，测试前做设计符合性检查
      ⑥ 重排进度计划，为变更预留缓冲。

      **答题铁律：问题与措施必须编号对应**。只写一堆措施不对应问题，阅卷只给一半分——
      这是案例题最普遍的丢分方式。
    source: manual

  - id: RK-S6-017
    module_id: S6
    kp_id: KP-0601
    category: 中项·S6 应试专项
    type: 实操
    difficulty: hard
    level: 5
    title: 写挣值分析题的解题步骤
    body_md: |
      写出你在考场上解一道挣值计算题的完整步骤（不少于 5 步），
      要能直接照着做，包括怎么自查结果对不对。
    options: []
    answer: "列已知量、写公式、代入计算、判定正负与大小、用差值指数交叉验证、给结论"
    explanation_md: |
      可执行步骤：① 从题干摘出 PV、EV、AC（注意单位统一，别把万元和元混用）
      ② 先写公式再代入，不要跳步：CV=EV−AC、SV=EV−PV、CPI=EV/AC、SPI=EV/PV
      ③ 算出数值并保留两位小数 ④ 判定：差值**负为不利**，指数**小于 1 为不利**
      ⑤ **交叉自查**：CV<0 必须对应 CPI<1，SV<0 必须对应 SPI<1，不一致就是公式错了
      ⑥ 落到结论句：成本超支/节约多少，进度提前/落后多少。

      **第 ⑤ 步是保命动作**——考场上没时间重算一遍，但用差值和指数互相验证只要 10 秒，
      能拦住绝大多数公式记反的错误。另外注意 EAC 类题要看清是「按当前绩效继续」
      （EAC=BAC/CPI）还是「剩余工作按计划绩效」（EAC=AC+BAC−EV）。
    source: manual

  - id: RK-S1-016
    module_id: S1
    kp_id: KP-0102
    category: 中项·S1 项目管理框架
    type: 实操
    difficulty: medium
    level: 2
    title: 写出五大过程组各自的产出
    body_md: |
      不看资料，写出五大过程组（启动、规划、执行、监控、收尾）各自的核心产出。
      每个过程组至少写 2 项，并说明「这一步不做会出什么问题」。
    options: []
    answer: "五组各≥2项产出，且每组都说明缺失后果；监控要写变更控制，收尾要写验收与归档"
    explanation_md: |
      参考答案：**启动**→项目章程、干系人登记册（缺了就没有授权，项目经理名不正言不顺）；
      **规划**→项目管理计划、范围/进度/成本基准、风险登记册（缺了就没有基准，后面无处对比偏差）；
      **执行**→可交付成果、团队建设成果、质量数据（缺了就没有产出）；
      **监控**→绩效报告、变更请求及控制结果（缺了偏差无人发现，范围无声蔓延）；
      **收尾**→验收文件、最终产品移交、经验教训、资源释放（缺了项目关不掉，尾款收不回）。

      **这题的价值在「缺了会怎样」这一列**：只背产出清单是 L2 的记忆，
      能说出后果才证明你真的理解每个过程组的作用。
    source: manual

  - id: RK-S1-017
    module_id: S1
    kp_id: KP-0104
    category: 中项·S1 项目管理框架
    type: 实操
    difficulty: hard
    level: 4
    title: 选组织结构并说明理由
    body_md: |
      场景：某公司同时承接 12 个政务项目，各项目共用一批数据库和安全工程师。
      公司希望统一调配专家资源、又要保证每个项目有人对结果负责。
      请判断该用哪种组织结构（职能型/项目型/矩阵型，矩阵型还要说明弱、平衡、强），
      并写出你的判断依据与这种结构的两个主要风险。
    options: []
    answer: "选强矩阵或平衡矩阵，依据是资源共享需求+项目经理需对结果负责；风险是双重汇报与资源争夺"
    explanation_md: |
      判断链条：**需要跨项目共享稀缺专家**（否定项目型——那会按项目切分资源，专家无法复用）；
      **又要求有人对项目结果负责**（否定职能型——职能型里项目经理没有实权）。

      落到**强矩阵或平衡矩阵**：项目经理对进度成本负责，职能经理管人与技术标准。

      两个主要风险：① **双重汇报**——成员同时听项目经理和职能经理，冲突时不知道该听谁；
      ② **资源争夺**——12 个项目抢同一批专家，必须有组织级优先级机制（这正是 PMO 该管的）。

      答题要点：结论 + 依据 + 风险三段齐全，只写「选强矩阵」不写依据，最多得三分之一的分。
    source: manual

  - id: RK-S2-021
    module_id: S2
    kp_id: KP-0201
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: medium
    level: 2
    title: 写项目章程的要点
    body_md: |
      写一份项目章程应包含的要点（不少于 6 项）。假设项目是「某市政务数据共享平台建设」。
      每项写清「写什么内容」，不要只写标题。
    options: []
    answer: "覆盖项目目的、可交付成果、里程碑、预算、项目经理授权、主要干系人、审批要求"
    explanation_md: |
      合格章程包含：① 项目目的与业务背景 ② 可测量的项目目标（范围/进度/成本/质量）
      ③ 主要可交付成果 ④ 总体里程碑 ⑤ 总体预算 ⑥ **项目经理的授权范围**（能签多少、能调动什么）
      ⑦ 主要干系人与发起人 ⑧ 审批要求与批准人。

      **最容易漏也最关键的是第 ⑥ 项「授权」**——章程的本质是**授权文件**，不是项目简介。
      没有授权条款，项目经理在跨部门协调时没有任何依据，这是很多项目一开局就卡住的原因。
    source: manual

  - id: RK-S2-022
    module_id: S2
    kp_id: KP-0203
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 4
    title: 写团队冲突的处理行动清单
    body_md: |
      场景：项目进入联调阶段，开发和测试两个小组互相指责——开发说测试用例不合理、
      测试说开发提交质量差。冲突已经影响每日站会。
      写出你的处理行动清单（不少于 5 条），每条要写「谁做什么、什么时候、达到什么效果」。
    options: []
    answer: "先隔离情绪再对事实、共同评审用例与准入标准、定缺陷分级与回归规则、设升级机制、跟踪验证"
    explanation_md: |
      可执行清单：① **分别听取双方事实**（不是先开会互怼），各 30 分钟，产出问题清单
      ② 组织**共同评审测试用例与提测准入标准**，把「什么叫可提测」写成可判定条目
      ③ 明确**缺陷分级标准**与回归责任，避免互相推诿 ④ 设**升级机制**：争议超过 1 天由项目经理裁定
      ⑤ 一周后复盘，看站会是否恢复正常节奏。

      处理冲突的关键顺序是**先对事实、再对规则、最后才谈态度**。一上来就讲「大家要团结」，
      问题一件没解决，两周后照旧。
    source: manual

  - id: RK-S2-023
    module_id: S2
    kp_id: KP-0204
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 4
    title: 写一份项目状态报告要点
    body_md: |
      写一份月度项目状态报告的要点（不少于 6 项）。要求：读报告的人能在 3 分钟内判断
      「项目现在到底什么状态、需不需要他做决定」。
    options: []
    answer: "结论前置、进度成本偏差及原因、风险与问题、需决策事项、下月计划、附数据口径"
    explanation_md: |
      合格结构：① **一句话结论**（绿灯/黄灯/红灯 + 核心理由）② 进度与成本的偏差数据
      （用挣值：SPI/CPI 或实际 vs 基准）③ 偏差原因分析 ④ 主要风险与已发生问题及应对
      ⑤ **需要上级决策的事项**（写清「请你决定什么、什么时候要答复」）⑥ 下月关键计划
      ⑦ 数据口径与截止日期。

      **两个最常见的问题**：一是结论藏在最后，领导读三屏还不知道项目好坏；
      二是只报状态不提决策请求，报告变成了「通知」，等出事后才说「当时报过」。
    source: manual

  - id: RK-S3-026
    module_id: S3
    kp_id: KP-0303
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 4
    title: 写一份 IT 服务目录与 SLA 要点
    body_md: |
      为某单位写一份 IT 服务目录与 SLA 的要点（不少于 6 项）。
      要区分「哪些服务必须有 SLA、哪些不必」，并说明理由。
    options: []
    answer: "覆盖服务分类、服务级别指标、响应与解决时限、可用性、计费、评价；区分核心与一般服务"
    explanation_md: |
      合格内容：① 服务分类（基础设施/应用/桌面/安全等）② **服务级别指标**（可用性、响应时间、
      解决时限、恢复时间 RTO）③ 服务时间与除外情形 ④ 双方责任边界 ⑤ 计费或成本分摊方式
      ⑥ 服务评价与违约处理。

      **必须区分轻重**：核心业务系统（如审批、支付）要有明确 SLA 和赔付条款；
      一般办公类服务写清「尽力而为」即可。给所有服务都套最高 SLA，等于没有 SLA——
      成本扛不住，承诺也无法兑现。
    source: manual

  - id: RK-S3-027
    module_id: S3
    kp_id: KP-0304
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 4
    title: 写一份架构决策记录
    body_md: |
      场景：团队在「单体应用」与「微服务拆分」之间争论了两周。请写出你的架构决策记录（ADR）
      要点（不少于 5 项），要求让三个月后接手的人能看懂「为什么这么选」。
    options: []
    answer: "覆盖背景与约束、备选方案、决策结论、理由与取舍、影响与后续条件"
    explanation_md: |
      ADR 标准结构：① **背景与约束**（团队规模、交付周期、运维能力、预算）
      ② **备选方案**（至少两个，写清各自代价）③ **决策结论**（选哪个）
      ④ **理由与取舍**（选了它放弃了什么）⑤ **影响**（对开发、部署、运维、后续演进的影响）
      ⑥ **失效条件**（什么情况下该重新评估这个决策）。

      **最容易被跳过的是第 ⑥ 项**——不写「什么时候该推翻它」，这个决策就会变成永久包袱。
      比如「团队超过 15 人且模块间独立发布需求强烈时，重新评估拆分」，这一句能省掉未来半年的争论。
    source: manual

  - id: RK-S3-028
    module_id: S3
    kp_id: KP-0307
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 4
    title: 写一份系统集成测试方案要点
    body_md: |
      为「机房改造 + 网络设备 + 服务器 + 应用系统」的一体化项目写集成测试方案要点（不少于 6 项）。
      要说明「为什么集成测试不能由各厂商各测各的」。
    options: []
    answer: "覆盖测试范围与边界、环境与数据、接口测试、性能与压力、故障切换、责任划分与准出判据"
    explanation_md: |
      合格方案：① 测试范围与接口清单（谁和谁对接）② 测试环境与数据准备 ③ **接口联调测试**
      （协议、字段、时序、异常返回）④ 性能与压力测试 ⑤ **故障切换与回退验证**
      ⑥ 各方责任划分与问题定界方法 ⑦ **准出判据**（缺陷等级与数量门槛）。

      **为什么不能各测各的**：每个厂商只验证「自己的设备在实验室正常」，而系统故障
      绝大多数出在**交界处**——接口字段不一致、时序不匹配、单点故障无人负责。
      集成测试的核心价值就是**把责任边界上的灰区暴露出来并提前定责**，否则上线后互相推诿。
    source: manual

  - id: RK-S5-017
    module_id: S5
    kp_id: KP-0503
    category: 中项·S5 法规与职业道德
    type: 实操
    difficulty: hard
    level: 5
    title: 写一段拒绝隐瞒延期的说明
    body_md: |
      情形：项目已确定延期 3 周，客户方对接人私下要求你「先别说，等他向上汇报完再提」。
      请写出你的应对说明（不少于 4 条）：你怎么回应、依据是什么、后续怎么留痕。
    options: []
    answer: "说明必须如实报告、给出缓冲时间但不隐瞒、书面留痕、按合同约定渠道通报"
    explanation_md: |
      合格答案：① **明确拒绝隐瞒**，但给对方留出沟通窗口（如「今天内我不发正式函，
      但最迟明天下班前必须按合同约定通报」）② 说明依据：延期属重大事项，合同通常约定
      知情与通报义务，隐瞒会扩大双方损失，也违反职业诚信 ③ **书面留痕**：把沟通结果邮件确认
      （「按今日沟通，于 X 时前正式通报延期情况」）④ 按约定渠道向客户项目负责人与监理报告
      ⑤ 同步内部，让公司知晓风险。

      **这道题的关键是「不全盘顺从、也不硬刚」**：直接翻脸会把关系搞僵，
      完全照办则把职业风险全揽到自己身上。正确做法是**给出有限的缓冲 + 明确截止 + 全程留痕**。
      留痕不是防人，是让事后能说清「谁在什么时候知道了什么」。
    source: manual

  # ── 2026-10-29 补格：S1 空缺的 12 个「知识点 × 层级」 ──
  # 判据：L1 认得（识别名词/产出）· L2 说得出（讲清区别）· L3 套用（按规则判）
  #      L4 判得准（给情境判对错）· L5 迁得动（落到自己项目）
  - id: RK-S1-018
    module_id: S1
    kp_id: KP-0101
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 3
    title: 新增需求但工期预算都不许动
    body_md: |
      某政务项目已执行 6 个月，客户要求在原有范围内新增一个数据共享接口，
      同时明确「工期不能延、预算不能加」。按项目管理的三重约束，项目经理应当：
    options:
      - 直接安排开发，因为接口工作量不大
      - 走变更流程评估影响，请客户在「延长工期、追加预算、削减等量范围」中做出取舍
      - 拒绝变更，因为合同已经签订
      - 先做出来，验收时和其他变更一起结算
    answer: "B"
    explanation_md: |
      范围、进度、成本三者联动，任何一方增加，另两方必受影响。客户要求「加范围、不加时间也不加钱」，
      这在三重约束下是不成立的——必须有一方让步，而**让步由谁做是客户的决策，不是项目经理自作主张**。

      A 与 D 的错法本质相同：都是绕开流程先干，结果是范围无声蔓延、后期无人认账。
      C 看似守规矩，但项目管理不禁止变更，禁止的是**不评估就接受**。

      判据一句话：**变更可以接，但「接」的动作必须包含影响分析和一次明确的取舍确认。**
    source: manual

  - id: RK-S1-019
    module_id: S1
    kp_id: KP-0101
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: hard
    level: 4
    title: 关于渐进明细与项目终点的四个判断
    body_md: |
      关于项目特征与项目管理，下列说法正确的是：
    options:
      - 项目开始时需求说不清楚，说明项目经理的前期工作没做到位
      - 渐进明细意味着早期只有大方向是正常的，应据此安排分阶段评审，让细节随推进逐步确定
      - 项目结束的标志是把产品交付给客户
      - 项目一旦立项，范围和目标就应当固定下来不再调整
    answer: "B"
    explanation_md: |
      渐进明细是项目的**固有属性**，不是管理失职。早期只有大方向、需求随推进逐步清晰，是正常状态；
      管理动作对应的是**分阶段评审与逐步细化**，不是要求一开始就全说清。所以 A 错、B 对。

      C 错在不完整：交付只是其中一步，收尾过程组还要求验收、移交、归档、经验教训总结、资源释放。
      实务上「交付了但没验收、没归档」的项目，事后追责和二期复用都无处下手。

      D 错在把「可变更」当成「不应变」。项目本来就是在不确定中推进的，正确做法是**让变更走流程、
      留痕迹、更新基准**，而不是禁止变更。

      这题的四个选项分别踩中四个常见误区：把属性当失误、把交付当结束、把稳定当不变。
    source: manual

  - id: RK-S1-020
    module_id: S1
    kp_id: KP-0102
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: easy
    level: 1
    title: 哪个产出属于监控过程组
    body_md: |
      下列产出中，属于监控过程组的是：
    options:
      - 项目章程
      - 工作绩效报告与变更请求
      - 可交付成果
      - 项目最终验收与归档文件
    answer: "B"
    explanation_md: |
      五个过程组的典型产出要能一一对上：

      | 过程组 | 典型产出 |
      | --- | --- |
      | 启动 | 项目章程、相关方登记册 |
      | 规划 | 各专项计划、范围/进度/成本基准 |
      | 执行 | 可交付成果、工作绩效数据 |
      | 监控 | 工作绩效报告、变更请求、变更控制结果 |
      | 收尾 | 最终验收、移交、归档、经验教训 |

      A 是启动，C 是执行，D 是收尾。**注意「工作绩效数据」和「工作绩效报告」不是一回事**：
      数据是执行中产生的原始记录（属执行），报告是经过分析比对的结论（属监控）。这一对是中项卷面上
      反复出现的细节点。
    source: manual

  - id: RK-S1-021
    module_id: S1
    kp_id: KP-0102
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 3
    title: 质量保证与质量控制分别落在哪个过程组
    body_md: |
      关于质量保证与质量控制，下列说法正确的是：
    options:
      - 两者都属于执行过程组，只是叫法不同
      - 质量保证属执行过程组（保证过程符合标准），质量控制属监控过程组（检查结果是否合格）
      - 质量保证属监控过程组，质量控制属执行过程组
      - 两者都属于监控过程组，区别只在检查的时机
    answer: "B"
    explanation_md: |
      记忆法：**保证是「做事时保证」，控制是「做完后检查」**。

      - 质量保证（执行）：查的是**过程**——按不按规程做、有没有用对工具，动作发生在生产过程中
      - 质量控制（监控）：查的是**结果**——抽检、测试、比对规格，动作发生在产出之后

      所以归属不同：前者在执行过程组，后者在监控过程组。

      A 与 D 都把两者合并了，而它们在过程组归属上恰恰是分开的——考题就爱在这里设陷阱。
      C 是把两者对调，属于最常见的误答：因为「保证」听起来更像监督，实际它是过程中的动作。

      判据一句话：**问「过程对不对」→ 执行；问「结果合不合格」→ 监控。**
    source: manual

  - id: RK-S1-022
    module_id: S1
    kp_id: KP-0102
    category: 中项·S1 项目管理框架
    type: 实操
    difficulty: medium
    level: 5
    title: 把自己项目套进五个过程组并找出最弱的一环
    body_md: |
      拿一个你实际参与过的项目（或正在做的项目），完成三件事：
      1. 为五个过程组各写出 2 个真实发生过的具体动作（要能对应到具体时间或产物，不要写「进行了规划」这种空话）
      2. 指出哪个过程组在你的项目里最薄弱
      3. 写出判断它薄弱的**证据**（缺了什么产物、出了什么后果）
    options: []
    answer: "五组各2个可追溯的具体动作；指出最弱一组；用「缺了什么产物→导致什么后果」给出证据"
    explanation_md: |
      这题考的是迁移能力，评分重心在**第 3 问的证据**，不是第 1 问的清单。

      合格的样子（以某政务数据平台为例）：
      - **启动**：2026-03 召开项目启动会；2026-03 底签发项目章程（含审批签字页）
      - **规划**：4 月完成 WBS 三级分解；4 月 20 日出范围基准与进度基准
      - **执行**：5-8 月完成三个子系统开发；7 月组织两次团队建设与角色交接
      - **监控**：每两周出一次进度偏差报告；9 月对两次范围变更走了 CCB 审批
      - **收尾**：11 月完成验收测试报告；11 月底移交运维并归档文档

      **最弱的一环通常落在收尾或监控**，因为这两块最容易被「反正要上线了」挤掉。

      判断薄弱的证据必须成对出现：「没做 X」+「导致 Y」。例如
      「缺收尾的经验教训总结 → 二期同样的接口返工问题又出现一次，团队没人知道一期怎么解的」；
      「缺监控的变更记录 → 客户最后核对时对不上账，验收拖了三周」。

      只写「收尾做得不好」不构成证据，跟案例题里「只说缺收尾不给分」是同一条判据。
    source: manual

  - id: RK-S1-023
    module_id: S1
    kp_id: KP-0103
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 2
    title: 资源管理与采购管理的边界
    body_md: |
      关于资源管理与采购管理的分工，下列说法正确的是：
    options:
      - 从外部供应商采购服务器属于资源管理，因为服务器是项目要用的资源
      - 内部团队人员调配属于采购管理，因为人员也需要「获取」
      - 从外部采购货物或服务属于采购管理，内部团队人员的获取与建设属于资源管理
      - 两者是同一件事的两种叫法，取决于组织习惯
    answer: "C"
    explanation_md: |
      判据只看一条：**这个东西是「我们自己的」还是「从外面买来的」**。

      - 自己人（内部团队）、自有设备 → **资源管理**（获取资源、建设团队、管理团队）
      - 外购的货物、服务、外包成果 → **采购管理**（规划采购、实施采购、控制采购、结束采购）

      A 的错法很典型：被「资源」二字带走。服务器确实是资源，但**来源是外部采购**，
      按领域归属算采购管理。B 同理，内部人员调配不涉及外部合同，属资源管理。

      D 把两个领域合并了。它们在教材里是分开的两章，考试要求能分辨。
      一句话记忆：**买来的归采购，自己有的归资源。**
    source: manual

  - id: RK-S1-024
    module_id: S1
    kp_id: KP-0103
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: hard
    level: 4
    title: 从现象反推管理薄弱的领域
    body_md: |
      某系统上线后一个月内，客户提交了 60 多个缺陷，其中多数是功能能打开但计算结果不对、
      导出格式错乱。合同要求的功能点已全部交付，进度也按期完成。
      该项目最可能薄弱的环节是：
    options:
      - 范围管理
      - 沟通管理
      - 进度管理
      - 质量管理
    answer: "D"
    explanation_md: |
      用现象反推领域，判据是「问题出在哪一类事上」：

      - 功能**没做**、需求反复变 → 范围管理
      - 功能**做了但做错了**、缺陷率高、返工多 → **质量管理**
      - 一直延期、没有里程碑 → 进度管理
      - 各方理解不一致、会上才发现 → 沟通管理

      题干给了两个关键信号：**功能点全部交付**（排除范围）、**按期完成**（排除进度），
      而问题集中在「计算不对、格式错乱」——这是产出**合格不合格**的问题，属质量控制失守。

      讲义里那张反推表要当成硬判据背：**「做没做全」是范围，「做得好不好」是质量。**
      这题如果把「交付后被退回返工」误读成「需求没对齐」，就会错选 A。
    source: manual

  - id: RK-S1-025
    module_id: S1
    kp_id: KP-0104
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: easy
    level: 1
    title: 哪个不属于通用项目生命周期阶段
    body_md: |
      通用项目生命周期（预测型）的典型阶段是「启动 → 组织与准备 → 执行项目工作 → 结束项目」。
      下列不属于这四个阶段的是：
    options:
      - 启动
      - 组织与准备
      - 执行项目工作
      - 项目后评价
    answer: "D"
    explanation_md: |
      四个阶段对应的是**项目从生到死的四段**：启动（授权开始）、组织与准备（搭班子、定计划）、
      执行项目工作（干活）、结束项目（验收移交收尾）。

      **项目后评价不属于项目生命周期**。它发生在项目正式结束之后，由组织层（或上级主管部门）
      对项目效果、投资回报、运营表现做事后评估。把它算进生命周期，会把「项目内可控的事」
      和「项目外由组织承担的事」混为一谈。

      这也是判断题爱考的点：「项目后评价是项目收尾过程组的工作」——错，收尾是项目内的正式结束，
      后评价是项目外的组织行为。
    source: manual

  - id: RK-S1-026
    module_id: S1
    kp_id: KP-0104
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 2
    title: 生命周期三条曲线的规律
    body_md: |
      关于项目生命周期中「成本与人力投入」「风险与不确定性」「变更的代价」三条曲线，
      下列说法正确的是：
    options:
      - 风险与不确定性在执行阶段最高，因为那时工作最密集
      - 成本与人力投入在启动阶段最高，因为要组建团队
      - 变更的代价在项目早期最低，越往后越高
      - 三条曲线在生命周期内基本平稳，只在收尾时下降
    answer: "C"
    explanation_md: |
      三条曲线的规律一句话：**越早改越便宜，但越早越看不清。**

      | 维度 | 峰值/走势 |
      | --- | --- |
      | 成本与人力投入 | **执行阶段**最高（人最多、花钱最快） |
      | 风险与不确定性 | **启动阶段**最高（越往后越清楚，风险递减） |
      | 变更的代价 | 启动时最低，**越往后越高**（收尾改一个需求极贵） |

      A 与 B 都是把「感觉上最忙的阶段」当成了答案：执行阶段确实最忙（成本人力峰值），
      但风险最高的是最看不清的启动阶段。这两条**反直觉**，正是卷面上的高频错项。

      C 对。它的实践含义是：多花时间在前期需求评审与原型验证上，比后期返工便宜得多。
    source: manual

  - id: RK-S1-027
    module_id: S1
    kp_id: KP-0104
    category: 中项·S1 项目管理框架
    type: 实操
    difficulty: medium
    level: 5
    title: 用三个信号判断自己组织的结构
    body_md: |
      判断你所在组织（或你上一个项目所在的团队）属于哪种组织结构——职能型 / 弱矩阵 / 平衡矩阵 /
      强矩阵 / 项目型。要求：
      1. 用三个信号分别作答：团队成员是全职还是兼职、绩效考核权在谁手上、项目预算由谁批
      2. 写出结论，并说明依据是否一致（若三个信号打架，按哪一项定，为什么）
      3. 写出这种结构给你带来的**一个具体困难**，以及你实际用过或打算用的对策
    options: []
    answer: "三信号逐一作答→给结论→说明不一致时按权力最弱项定→指出一个结构性困难与对策"
    explanation_md: |
      评分重心在第 2 问「信号打架时怎么定」和第 3 问的「结构性困难」，不是结论本身。

      三个信号是判据，按顺序看：
      1. 团队**全职还是兼职** → 兼职多半是职能型或矩阵
      2. **绩效考核权**在部门经理手上 = 弱；在项目经理手上 = 强或项目型
      3. **预算谁批** → 部门批 = 弱；项目经理批 = 强或项目型

      **信号不一致时，按「权力最小的那一项」定**。因为组织结构对项目经理的真实约束，
      由最弱的那个环节体现——比如预算权在你手上、但考核权在部门经理，实际仍是弱矩阵，
      因为成员真正在意的是谁给他打绩效。

      第 3 问的合格答案要具体。反例：「困难是沟通不畅，对策是加强沟通」——不得分。
      正例：「成员考核在部门，我调度他们加班没有依据，只能靠人情；对策是让发起人在项目章程里
      写明项目优先级高于部门日常任务，并把关键节点的资源承诺写进部门经理的季度目标」。

      注意第 3 问的困难必须是**结构性**的（源于权力或资源安排），不是个人能力或态度问题。
    source: manual

  - id: RK-S1-028
    module_id: S1
    kp_id: KP-0105
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 2
    title: 五种权力来源的持久性
    body_md: |
      关于项目经理的五种权力来源及其持久性，下列说法正确的是：
    options:
      - 法定权最持久，因为它来自组织的正式任命
      - 惩罚权最持久，因为约束力最强、见效最快
      - 专家权与参照权最持久，惩罚权最容易失效
      - 奖励权与惩罚权最持久，因为它们直接关系个人利益
    answer: "C"
    explanation_md: |
      五种权力按「服从的理由」区分，持久性差别很大：

      | 权力 | 服从的理由 | 持久性 |
      | --- | --- | --- |
      | 法定权 | 他是这个职位 | 中（离岗即失） |
      | 奖励权 | 跟着有好处 | 弱（无奖励即失） |
      | 惩罚权 | 怕被罚 | 最弱（用多必反） |
      | 专家权 | 他真懂 | 强 |
      | 参照权 | 认同这个人 | 最强 |

      **法定权看起来最稳，其实只是「在位期间有效」**——一旦调岗或项目结束，权力立刻消失。
      **惩罚权见效最快但最不持久**：短期压得住，长期换来的抵触与离职。

      专家权与参照权不依赖职位，跟着人走，所以最持久。这也是为什么案例题里
      「项目经理靠处罚推项目、团队离心」的标准答法方向是「改用专业判断与信任建立」。

      记忆抓手：**靠位置来的权力会随位置消失，靠人来的权力才留得住。**
    source: manual

  - id: RK-S1-029
    module_id: S1
    kp_id: KP-0105
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 3
    title: 情境判断权力来源
    body_md: |
      新任项目经理小陈，团队里有几位比他年长、资历更深的工程师，起初对他并不信服。
      小陈的做法是：每次技术方案评审前自己先做一遍推演，评审时把关键假设、风险和取舍讲透，
      并主动承认自己判断错的地方。两个月后，工程师们遇到技术分歧会主动找他讨论，说「按他的思路走基本不会踩坑」。

      小陈主要依靠的是哪种权力？
    options:
      - 法定权
      - 奖励权
      - 惩罚权
      - 专家权
    answer: "D"
    explanation_md: |
      判据是「服从的理由」，题干的理由写得很明确：**「按他的思路走基本不会踩坑」**——
      团队听他的，是因为他判断得准、讲得透，这是**专家权**。

      为什么不是法定权（A）：法定权也能让人配合，但配合的理由是「他是这个职位」。
      题干特意写了「起初对他并不信服」，说明职位本身没有换来认同——这正是法定权的边界。

      为什么不是奖励权（D）：题干没有任何关于奖励、晋升、绩效的描述。

      **专家权与参照权容易混**，区分点是：佩服他的**本事**（懂行、判断准）是专家权；
      佩服他的**人**（愿意跟他干、信他这个人）是参照权。题干落在「思路不会踩坑」，
      指向本事，所以是专家权。

      补一句实践含义：小陈做对的地方是**主动承认判断错误**——这让专家权不变成「压人」，
      团队才敢提不同意见。只靠专业权威而不留纠错空间，长期会退化成单点依赖。
    source: manual

  # ── 2026-10-29 补格：S2 空缺的 14 个格子 ──
  - id: RK-S2-024
    module_id: S2
    kp_id: KP-0201
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 3
    title: 章程与项目管理计划的分工
    body_md: |
      关于项目章程与项目管理计划，下列说法正确的是：
    options:
      - 两者都由项目经理编制并发布
      - 章程是授权文件，回答「准不准做、谁负责」，发布权在发起人；计划是执行依据，回答「怎么做」，由项目经理整合编制、批准后执行
      - 章程批准后不得再修改，计划可以随时修改
      - 项目管理计划是章程的输入，先编计划再写章程
    answer: "B"
    explanation_md: |
      两者的关系是**授权在前、执行在后**，不能颠倒：

      | 对比项 | 项目章程 | 项目管理计划 |
      | --- | --- | --- |
      | 性质 | 授权文件 | 执行依据 |
      | 回答什么 | 准不准做、谁负责、边界在哪 | 怎么做、分几步、花多少 |
      | 谁发布 | 发起人 | 项目经理编制，批准后执行 |

      A 错在把两者都归给项目经理：项目经理可以**执笔**章程，但发布权在发起人——
      自己给自己授权的逻辑不成立。

      C 错在章程「不得修改」：章程批准后**可以改，但要走变更流程**。这一点和计划的区别
      只是「变更影响面更大」，不是「不可变」。

      D 把输入输出关系完全弄反了：章程是计划的**输入**，没有章程就没有授权，
      计划编制也失去依据。
    source: manual

  - id: RK-S2-025
    module_id: S2
    kp_id: KP-0201
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: medium
    level: 5
    title: 复盘自己项目立项时缺了什么
    body_md: |
      选一个你参与过的项目，做一次立项复盘：
      1. 该项目有没有正式的项目章程？谁签发的？章程里写没写「项目经理的授权范围」？
      2. 若章程缺失或内容不全，写出因此导致的一个具体后果（要能指出时间与事件）
      3. 写出如果重来一次，你会在章程里补哪三项内容，为什么是这三项
    options: []
    answer: "如实回答有无章程与授权条款；给出缺失导致的具体后果；补的三项要能对应到该后果"
    explanation_md: |
      这题不要求项目「有章程」，**没有也是有效答案**——重点在第 2、3 问的因果链。

      常见且合格的回答形态：
      - 事实：没有章程，只有一份会议纪要，项目经理的权限没写
      - 后果：第 3 个月要抽调运维部两名工程师，对方部门以「不在年初计划内」为由拒绝，
        理由是纪要上没有授权条款，最终由分管领导协调，项目停滞 11 天
      - 补三项：**项目经理的职责职权（能调什么、能签多少）**、**可测量的项目目标**、
        **发起人姓名与职权**（谁认账、升级找谁）

      为什么是这三项：它们分别对应「能不能动资源」「做成什么样算成功」「出了问题找谁」，
      是立项阶段最容易在后期引发争议的三处。

      反面答案：写「补项目背景和意义」——这类内容写在立项报告里就够了，
      章程的核心是**授权与边界**，不是项目简介。
    source: manual

  - id: RK-S2-026
    module_id: S2
    kp_id: KP-0202
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 三大基准各由什么构成
    body_md: |
      关于范围、进度、成本三大基准，下列说法正确的是：
    options:
      - 成本基准等于项目总预算，包含管理储备
      - 范围基准由范围说明书、WBS 与 WBS 词典构成，用来判断「做没做完」
      - 进度基准就是那张甘特图文件，改了重新导出即可
      - 三大基准一经批准不得修改
    answer: "B"
    explanation_md: |
      三大基准合起来构成**绩效测量基准**，各自对应一个判断问题：

      | 基准 | 构成 | 用来判断 |
      | --- | --- | --- |
      | 范围基准 | 范围说明书 + WBS + WBS 词典 | 做没做完 |
      | 进度基准 | 经批准的进度模型（含里程碑） | 快还是慢 |
      | 成本基准 | 经批准的分时段预算，**不含管理储备** | 超没超 |

      A 错在管理储备：**成本基准不含管理储备**，管理储备在此之外，动用需高层批准。
      这条几乎每套卷子都会设一个选项来考。

      C 错在把「基准」当成「文件」：基准的实质是**经过批准、受变更控制**的那份计划，
      甘特图只是它的表现形式。随手改了就重新导出，等于没有基准。

      D 错在「不得修改」：可以改，但**必须走变更控制流程**并同步更新。
    source: manual

  - id: RK-S2-027
    module_id: S2
    kp_id: KP-0202
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: 三份计划都做了，偏差却说不清
    body_md: |
      某项目按要求编制了范围、进度、成本三份计划，但都只经过项目组内部讨论，未提交审批。
      执行三个月后进度明显落后，项目经理拿实际进度与计划比对，却给不出「落后多少」的结论。
      若要求你判断根本问题，最准确的是：
    options:
      - 团队执行力不足，进度没有跟上
      - 计划未经批准，不构成基准，因此无法作为偏差比较的依据
      - 缺少关键路径分析，进度无法量化
      - 客户需求变更频繁，导致计划失效
    answer: "B"
    explanation_md: |
      题干的关键信息是**「未提交审批」**，不是「进度落后」。计划与基准的差别就在这道审批上：
      未批准的计划是内部草案，批准后的计划才是基准，基准才是比对的尺子。

      这解释了为什么项目经理「说不清落后多少」——不是他不会算，是**没有合法的比较对象**。
      拿草案当基准，任何偏差数字都站不住，一旦上会就会被质疑。

      A 把现象当原因；C 与 D 都属于「没有证据支撑的推测」——题干没有提到关键路径缺失，
      也没有提到需求变更。

      实践含义：**没有基准的项目，监控过程组整条链条是断的**——测量、比较、纠偏三步里
      第二步无对象。这也是为什么评审与批准不能被「反正是内部计划」跳过。
    source: manual

  - id: RK-S2-028
    module_id: S2
    kp_id: KP-0203
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 哪个活动属于执行过程组
    body_md: |
      下列活动中，属于执行过程组的是：
    options:
      - 制定项目章程
      - 创建 WBS
      - 建设团队与管理团队
      - 控制质量
    answer: "C"
    explanation_md: |
      判据是「在定规矩，还是在按规矩干活」：

      - 制定项目章程 → **启动**
      - 创建 WBS → **规划**（规划组的前三步是收集需求、定义范围、创建 WBS）
      - 建设团队与管理团队 → **执行**（跟人打交道的活大多在执行组）
      - 控制质量 → **监控**

      执行过程组的核心特征是「把计划变成成果，同时把人管住」，典型过程包括
      指导与管理项目工作、管理项目知识、获取资源、建设团队、管理团队、管理沟通、
      实施风险应对、实施采购、管理相关方参与。

      一个易错点：**控制质量容易被归到执行**，因为它发生在生产现场。但「控制」两个字
      决定了它属于监控——它在检查结果，不是在产出结果。
    source: manual

  - id: RK-S2-029
    module_id: S2
    kp_id: KP-0203
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 3
    title: 判断团队处在塔克曼哪一阶段
    body_md: |
      某项目团队组建两个月后，成员已认同共同约定的评审流程与分工，日常协作顺畅，
      偶有技术分歧也能按既定规则自行解决，整体效率明显回升。
      按塔克曼阶梯，该团队当前处于：
    options:
      - 形成期
      - 震荡期
      - 规范期
      - 成熟期
    answer: "C"
    explanation_md: |
      塔克曼五阶段顺序固定：**形成期 → 震荡期 → 规范期 → 成熟期 → 解散期**。

      各阶段的判别信号：

      | 阶段 | 典型表现 |
      | --- | --- |
      | 形成期 | 客气、试探，依赖项目经理指派 |
      | 震荡期 | 冲突集中，方案争执、角色不清 |
      | **规范期** | 规则建立并被接受，协作开始顺畅，分歧能按规则解决 |
      | 成熟期 | 高度自组织，无需项目经理推动即可高效运转 |

      题干三个信号都指向规范期：**已认同规则**、**按既定规则解决分歧**、**效率回升**
      （说明刚走出震荡）。选成熟期（D）的偏差在于：成熟期的特征是「不需要项目经理推动」，
      题干还在强调「按约定规则」，说明规则仍在起作用而非内化。

      为什么要分清这两阶段：**规范期是建立规则的窗口，成熟期是授权与扩责的窗口**。
      在规范期就大撒手，团队会退回震荡；在成熟期仍事必躬亲，团队会退化成依赖。
    source: manual

  - id: RK-S2-030
    module_id: S2
    kp_id: KP-0203
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 5
    title: 给落在震荡期的团队写建设动作
    body_md: |
      场景：团队组建 5 周，成员对技术路线分歧严重，两次评审会不欢而散，
      已有 1 名骨干提出调岗。项目经理只有协调权，无考核权。
      请写出你的团队建设动作清单（不少于 5 条），每条写「做什么、什么时候、预期改变什么」。
      另外回答一句：为什么这个阶段不建议直接更换提调岗的成员？
    options: []
    answer: "5条可执行动作（建立决策规则/明确角色/一对一沟通/小范围试点/认可机制）；换人会把团队重置回形成期"
    explanation_md: |
      先定性：这是典型的**震荡期**，不是管理失败，是团队成长的必要阶段。动作方向是
      「建规则、明角色」，不是「压冲突、换人」。

      合格的动作清单（无考核权时的打法）：
      1. **一周内分别与 5 名核心成员一对一沟通**，各自说清分歧点与真实顾虑，产出问题清单
      2. **两周内组织一次技术路线评审会**，会前明确规则：只对事、每方各 15 分钟陈述、
         争议点当场记录，不当场表决
      3. **明确角色与决策方式**：谁定技术方案、争议超过 1 天谁裁定，写成一页纸贴在项目看板
      4. **选一个小模块做并行试点**（两条路线各做一周），用数据代替争论
      5. **建立认可机制**：对提出有效反驳的成员公开认可（奖励「说清楚问题」，
         而不是奖励「加班最晚」）
      6. 一个月后复盘：站会是否恢复节奏、分歧是否在会前解决

      **为什么不建议直接换人**：更换成员会把团队**重置回形成期**——新人进来，
      信任与默契要从头建立，震荡期再来一遍。而且「提出不同意见就走人」会形成示范效应，
      剩下的人不再说真话，冲突转入地下，比明面争执更难处理。

      注意第 5 条的细节：奖励加班属于**反向激励**，会诱导无效加班，这是教材明确点过的坑。
    source: manual

  - id: RK-S2-031
    module_id: S2
    kp_id: KP-0204
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 3
    title: 成本有余量但对返工敏感时怎么压缩工期
    body_md: |
      项目进度落后 3 周，客户要求按原日期交付。当前成本尚有结余，但项目对返工风险高度敏感
      （系统要过等保测评，返工会导致重新送审）。
      若必须压缩工期，应优先采用：
    options:
      - 快速跟进，把原本顺序执行的活动改为并行
      - 赶工，增加资源或安排加班，用成本换时间
      - 直接削减部分非核心功能
      - 与客户协商调整里程碑日期
    answer: "B"
    explanation_md: |
      两种进度压缩手段的代价不同，选哪个看**项目怕什么**：

      | 手段 | 做法 | 代价 |
      | --- | --- | --- |
      | 赶工 | 加资源、加班 | **推高成本**，风险基本不变 |
      | 快速跟进 | 顺序工作改并行 | 增加**返工与质量风险** |

      题干把条件写全了：**成本有余量**（能承受赶工的代价）、**对返工风险敏感**（不能承受并行的代价），
      所以选赶工。

      C 削减范围属于范围变更，要走变更流程并由客户确认，不是项目组的进度手段。
      D 是放弃目标，不是压缩工期。

      **反向情形要记住**：如果是「成本已被锁死、但可以接受一定返工」，就该选快速跟进。
      考题只是把这两个条件对调，答案就反过来——所以不能只背「压缩工期用赶工」。
    source: manual

  - id: RK-S2-032
    module_id: S2
    kp_id: KP-0204
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 5
    title: 写一条完整的偏差处理链条
    body_md: |
      场景：某项目第 4 个月末的监控数据显示，开发模块的实际进度比计划落后约 15%，
      成本已花掉预算的 22%。团队解释是「接口对接比预想复杂」。
      请按监控过程组的逻辑，写出你的完整处理链条（不少于 5 步），每步写「做什么、产出什么」。
      最后说明：什么情况下你会提出变更请求，而不是自己纠偏？
    options: []
    answer: "测量→定性(是否关键路径)→分析原因→提出纠偏→更新计划与留痕；影响基准时必须走变更"
    explanation_md: |
      标准链条是「发现偏差 → 分析原因 → 提出纠偏或变更 → 更新计划 → 跟踪验证」，缺一环就断。

      合格的作答（每步带产出）：
      1. **核实数据**：确认 15% 落后的口径（按什么基准、含不含未验收部分），产出偏差说明
      2. **判断影响**：查落后的是否在关键路径上、总时差是否够——**不在关键路径且时差足够，
         完工日期可能不受影响**，这一步决定后面是「纠偏」还是「只观察」
      3. **分析原因**：接口复杂的真实原因是什么（对方系统无文档、联调窗口不足、需求未冻结），
         产出根因清单
      4. **提出纠偏措施**：加派接口联调人力、与对方约定联调窗口、先做桩测试，
         产出措施清单与责任人
      5. **更新计划并留痕**：更新进度计划与偏差记录，产出更新的项目文件
      6. **跟踪验证**：两周后复查是否回到偏差阈值内

      **什么时候必须提变更请求而不是自己纠偏**：当处理方式会**改动基准或已批准的范围/进度/成本**
      时——比如要延长工期、追加预算、削减交付内容。这些已超出项目经理的处置权限，
      必须走整体变更控制。

      自己纠偏只适用于**不触碰基准的调整**，比如重排人力、优化联调顺序。
      这条界线画不清，就会出现「项目经理私自延期」这类严重问题。
    source: manual

  - id: RK-S2-033
    module_id: S2
    kp_id: KP-0205
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 哪项不属于收尾阶段的工作
    body_md: |
      下列工作中，不属于收尾过程组应完成的是：
    options:
      - 移交最终产品并取得接收方确认
      - 归档项目文件与合同资料
      - 释放项目资源，安排人员返岗
      - 编制下一阶段的风险应对计划
    answer: "D"
    explanation_md: |
      收尾过程组只有一个过程——**结束项目或阶段**，但要完成六件事：
      ① 确认全部计划工作已完成并通过验收 ② 移交最终成果 ③ 归档项目文件
      ④ 释放资源 ⑤ 总结并归档经验教训 ⑥ 人员安置与必要庆功。

      A、B、C 分别对应第 ②③④ 项。D 属于**规划过程组**的工作：风险应对计划是项目计划的一部分，
      即使是为后续阶段编制，也发生在规划里，不是收尾动作。

      这类题的错误选项常常「看起来跟结束有关」——比如「编制下一阶段计划」。
      判据是：**收尾是关闭，不是开启**。凡是「为下一步做准备」的，都不在收尾组。
    source: manual

  - id: RK-S2-034
    module_id: S2
    kp_id: KP-0205
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 3
    title: 五份合同的收尾次数
    body_md: |
      某项目在执行期间共签订 5 份采购合同，项目正常完工。
      关于收尾执行的次数，正确的是：
    options:
      - 行政收尾 5 次，合同收尾 1 次
      - 行政收尾与合同收尾各 5 次
      - 行政收尾与合同收尾各 1 次
      - 行政收尾 1 次，合同收尾 5 次
    answer: "D"
    explanation_md: |
      分清两者的对象就自然清楚了：

      | 对比项 | 行政收尾 | 合同收尾 |
      | --- | --- | --- |
      | 对象 | 整个项目或阶段 | **每一份具体合同** |
      | 关注 | 文档归档、验收完成、资源释放 | 条款履行完毕、索赔结清、尾款支付 |
      | 在哪完成 | 结束项目或阶段 | **控制采购**（旧版单列「结束采购」） |

      一个项目只有一个整体，所以**行政收尾只做一次**；有几份合同就要结几次，
      所以**合同收尾做 5 次**。

      **两个附带考点**：① 合同收尾的归属过程是控制采购，不在收尾过程组——这是判断题的高频坑；
      ② 即使是分阶段项目，行政收尾按阶段各做一次，但合同收尾的次数仍然由合同数量决定。
    source: manual

  - id: RK-S2-035
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: hard
    level: 4
    title: 偏差已纠正时 EAC 该用哪个公式
    body_md: |
      某项目 BAC = 500 万元。检查点时 EV = 180 万元，PV = 200 万元，AC = 200 万元。
      项目经理查明超支源于前期一次性的设备采购溢价，已与供应商重新议价，
      剩余工作将按原预算执行。则 EAC 为：
    options:
      - 约 555.6 万元（BAC ÷ CPI）
      - 520 万元（AC + (BAC − EV)）
      - 500 万元（BAC）
      - 约 476.2 万元（EV ÷ CPI）
    answer: "B"
    explanation_md: |
      这题考的不是算术，是**公式选择**——「已议价纠正、剩余按原预算」＝**非典型偏差**。

      非典型偏差（偏差是偶发的、已纠正）：**EAC = AC + (BAC − EV)** = 200 + (500 − 180) = **520 万元**。

      典型偏差（偏差会持续到完工）：EAC = BAC ÷ CPI = 500 ÷ (180÷200) = 500 ÷ 0.9 ≈ 555.6 万元，
      正是 A 项——**这是最像的干扰项**，算得对但前提不成立。

      C 项等于假设「超支的那 20 万不用补」，忽略了已花出去的钱不可追回。
      D 项公式本身就错（EAC 不可能小于 BAC，除非节约）。

      判据记牢：题里出现「**已纠正**」「**查明原因并采取措施**」「剩余**按原计划**」→ 非典型；
      出现「**按当前趋势继续**」「**未采取任何措施**」→ 典型。
      看清这一句再动手算，比先算完再猜要省时间。
    source: manual

  - id: RK-S2-036
    module_id: S2
    kp_id: KP-0207
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 变更流程的第一步
    body_md: |
      按标准的变更控制流程，接到变更诉求后的第一步是：
    options:
      - 组织影响分析，评估对范围、进度、成本的影响
      - 提交 CCB 审批
      - 提出书面变更申请并纳入变更日志
      - 更新相关基准与配置项
    answer: "C"
    explanation_md: |
      六步流程的顺序不能换：**① 提出书面变更申请 → ② 记录并初审 → ③ 影响分析 →
      ④ CCB 审批 → ⑤ 实施变更 → ⑥ 验证并归档**。

      所以第一步是**书面化**，不是影响分析。A 是第三步，B 是第四步，D 是第六步的内容。

      **为什么第一步必须是书面申请**：口头诉求无法界定范围、无法追溯、无法作为后续
      审批与验收的依据。先书面化，才有对象可分析、可审批、可记录。

      **两个附带考点**：
      - CCB 是**审批机构**，不是执行机构——它决定做不做、什么时候做，不负责写方案、
        不改代码。
      - 变更**被否决也要记录**，用来避免同一变更被反复提出，也为复盘留依据。
    source: manual

  - id: RK-S2-037
    module_id: S2
    kp_id: KP-0207
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: medium
    level: 2
    title: 变更控制与配置管理是什么关系
    body_md: |
      关于变更控制与配置管理的关系，下列说法正确的是：
    options:
      - 两者是同一件事的不同叫法，选一个执行即可
      - 配置管理是变更控制的底座：变更批准后须同步更新配置项版本与基线，否则会出现文档是旧的、系统是新的
      - 配置管理只在项目收尾时统一做一次
      - 变更控制只管理文档类变更，代码变更不属于其范围
    answer: "B"
    explanation_md: |
      两者的分工是**管状态 vs 管变动**：

      - 配置管理回答「现在是什么版本、谁改了什么」——四个动作：识别配置项、建立基线、
        **版本控制**、配置审计
      - 变更控制回答「能不能改、改完怎么落地」——六步流程，批准后同步更新基准

      没有配置管理，变更控制就会「改完找不到新旧版本」；没有变更控制，配置管理只剩
      「存了一堆版本」而没有约束。所以 B 说的「底座」关系是准确的。

      A 把两者合并，忽略了它们解决的是不同问题；C 错在「只在收尾做一次」——
      版本控制是持续动作；D 错在把代码排除在配置项之外，**代码、配置、文档都是配置项**。

      一句话记住：**变更批准后不更新配置项版本，下一次监控就会拿新实际比旧基准，
      偏差全是假的。**
    source: manual

  # ── 2026-10-29 补格：S3 空缺的 16 个格子 ──
  - id: RK-S3-029
    module_id: S3
    kp_id: KP-0301
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 2
    title: 新基建三类怎么分
    body_md: |
      关于新型基础设施建设的三类划分，下列说法正确的是：
    options:
      - 信息基础设施指被数字化改造的传统基础设施
      - 融合基础设施指新建的通信网络、算力与新技术平台
      - 创新基础设施指支撑科学研究与技术开发的设施，如重大科技基础设施、产业技术创新平台
      - 三类基础设施互相独立，一个项目只能属于其中一类
    answer: "C"
    explanation_md: |
      三类的判别口径是**「新建的数字底座、被改造的老基建、搞研发用的」**：

      | 类别 | 指向 | 例子 |
      | --- | --- | --- |
      | 信息基础设施 | 通信网络、新技术、算力 | 5G、数据中心、人工智能平台、工业互联网 |
      | 融合基础设施 | 传统基建被数字化改造 | 智能交通、智慧能源、智慧水利 |
      | 创新基础设施 | 支撑科研与技术开发 | 重大科技基础设施、科教基础设施、产业技术创新设施 |

      A 与 B 正好把前两类对调了——这是本题最像的干扰项。判别的关键在**对象是不是既有的传统设施**：
      数据中心原来不存在，属新建（信息）；供水管网本来就存在，属改造（融合）。

      D 错在绝对化。一个项目可以同时具备多重属性，比如智慧高速既含新建的感知网络，
      也含对既有道路的改造。分类是**看主要矛盾**，不是排他性归属。
    source: manual

  - id: RK-S3-030
    module_id: S3
    kp_id: KP-0301
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 3
    title: 数字产业化还是产业数字化
    body_md: |
      某市规划四个项目：① 引进芯片封装测试生产线；② 建设面向本地制造企业的工业互联网平台；
      ③ 培育本地云服务与软件外包产业；④ 对全市柑橘种植基地做数字化改造。
      按数字经济的构成，属于「产业数字化」的是：
    options:
      - ①③
      - ③④
      - ①②
      - ②④
    answer: "D"
    explanation_md: |
      数字经济的两个组成部分，判别口径是「**谁在用信息技术**」：

      | 类型 | 含义 | 判别 |
      | --- | --- | --- |
      | 数字产业化 | 把信息技术本身做成产业（芯片、软件、云服务） | 产出的是**信息技术产品与服务** |
      | 产业数字化 | 用信息技术改造传统产业 | 主体是**传统产业**，用技术提升自己 |

      - ① 芯片封装测试 → 产出半导体，属数字产业化
      - ② 工业互联网平台服务本地制造企业 → 传统制造业被改造，属产业数字化
      - ③ 云服务与软件外包 → 产出软件服务，属数字产业化
      - ④ 柑橘基地数字化改造 → 农业被改造，属产业数字化

      结论是 ②④，选 B。

      **附带一条高频判断**：**产业数字化是主战场**，因为传统产业的体量远大于信息产业本身。
      考题常把「数字产业化是主战场」作为错误选项。
    source: manual

  - id: RK-S3-031
    module_id: S3
    kp_id: KP-0302
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: easy
    level: 1
    title: 哪些设备属于物联网感知层
    body_md: |
      按物联网三层架构，下列设备中属于感知层的是：
    options:
      - 核心交换机
      - 温湿度传感器与 RFID 读写器
      - 数据中心的业务应用服务器
      - 5G 基站
    answer: "B"
    explanation_md: |
      物联网三层架构是必考，各层职责如下：

      | 层 | 干什么 | 典型组成 |
      | --- | --- | --- |
      | **感知层** | 采集数据、识别对象 | 传感器、RFID、摄像头、二维码 |
      | 网络层 | 传输数据 | 接入网、承载网、5G 基站、交换机 |
      | 应用层 | 处理数据、支撑业务 | 业务平台、应用服务器、行业应用 |

      所以 B 属感知层。A 与 D 属网络层，C 属应用层。

      感知层的关键词是「**采集与识别**」——凡是「把物理世界的状态变成数据」的，都在这一层。
      RFID 的核心价值是非接触式自动识别，常用于物流与资产管理，这一点也常单独考。
    source: manual

  - id: RK-S3-032
    module_id: S3
    kp_id: KP-0302
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 4
    title: 政务存证该选哪种链
    body_md: |
      某市要把 12 个委办局的审批结果做成不可篡改的电子存证，参与方固定为这 12 家单位，
      不对外公开，且要求出现争议时能追溯完整操作记录。技术上最合适的选择是：
    options:
      - 公有链，任何人都可以参与记账
      - 联盟链，由 12 家单位共同组成准入联盟
      - 私有链，由牵头单位单独运维、其他单位只读
      - 用传统数据库加定时备份即可，不需要区块链
    answer: "B"
    explanation_md: |
      区块链按准入分三类，选型判据是「**谁能参与、要谁认账**」：

      | 类型 | 谁能参与 | 典型场景 |
      | --- | --- | --- |
      | 公有链 | 任何人 | 加密货币 |
      | **联盟链** | 特定机构组成的联盟 | 供应链金融、**政务存证** |
      | 私有链 | 单一组织内部 | 内部审计 |

      题干三个条件正好指向联盟链：**参与方固定（12 家）**、**不对外公开（准入控制）**、
      **需要多方互认（争议时能追溯）**。

      A 的公有链任何人都能参与，与「参与方固定、不公开」矛盾，且性能与合规都不适配政务场景。
      C 的私有链由一家单独运维，等于「裁判和运动员同一家」，其他单位不会认可其公信力——
      存证的价值恰恰在于**多方共同背书**。

      D 是常见误答：数据库加备份解决的是「不丢」，解决不了「谁改过、谁认账」。
      不可篡改与可追溯是区块链的立身之本，也是争议场景的核心诉求。

      **考试趋势**：近年更爱考联盟链，因为它才对应绝大多数企业级与政务场景。
    source: manual

  - id: RK-S3-033
    module_id: S3
    kp_id: KP-0303
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 2
    title: IT 服务生命周期的闭环特征
    body_md: |
      关于 IT 服务生命周期五个阶段，下列说法正确的是：
    options:
      - 顺序是规划设计 → 部署实施 → 服务运营 → 监督管理 → 持续改进，到持续改进结束
      - 顺序是规划设计 → 部署实施 → 服务运营 → 持续改进 → 监督管理，且持续改进与监督管理会反馈回规划设计形成闭环
      - 五个阶段只走一遍，走完服务就结束了
      - 服务运营是起点，规划设计属于项目阶段，不属于服务生命周期
    answer: "B"
    explanation_md: |
      五阶段顺序必须记牢：**规划设计 → 部署实施 → 服务运营 → 持续改进 → 监督管理**。

      但它**是闭环不是直线**：持续改进与监督管理的结果会反馈回规划设计，开启新一轮。

      这正是「服务生命周期」区别于「项目生命周期」的核心——**项目有终点，服务没有**。
      所以 C 错：服务不是走一遍就结束，而是持续循环。

      A 把后两阶段顺序对调了。判别依据：**先度量改进（持续改进），再评估监督（监督管理）**——
      改进是执行动作，监督是对结果的评价。

      D 错在把规划设计划出服务之外：规划设计的产出就是服务目录与服务级别，
      它是服务的起点，不是项目阶段。

      **判断题高频**：「服务生命周期到运营结束」——错，后面还有持续改进与监督管理。
    source: manual

  - id: RK-S3-034
    module_id: S3
    kp_id: KP-0303
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 3
    title: 这几件运维活各属于哪一类
    body_md: |
      某运维团队本月做了四件事：① 每日巡检机房温湿度并记录 ② 处理 37 起用户报障
      ③ 对数据库慢查询做索引优化 ④ 为明年的容量规划出具建议报告。
      按运维服务的四类活动，依次对应正确的是：
    options:
      - 例行操作、响应支持、优化改善、咨询评估
      - 响应支持、例行操作、咨询评估、优化改善
      - 例行操作、优化改善、响应支持、咨询评估
      - 咨询评估、响应支持、优化改善、例行操作
    answer: "A"
    explanation_md: |
      运维四类活动的判别口径：

      | 类别 | 干什么 | 关键词 |
      | --- | --- | --- |
      | 例行操作 | 按计划重复做的 | 巡检、备份、日志检查 |
      | 响应支持 | 被动响应事件与请求 | 报障、工单、故障处理 |
      | 优化改善 | 主动提升现有性能或质量 | 调优、扩容、架构优化 |
      | 咨询评估 | 出建议、做评估，不直接改系统 | 规划建议、评估报告、方案咨询 |

      逐一对应：① 巡检 → 例行操作；② 报障处理 → 响应支持；③ 慢查询索引优化 → 优化改善；
      ④ 容量规划建议 → 咨询评估。

      **最容易混的是 ③ 与 ④**：两者都是主动的，区别在**有没有直接改系统**。
      改了就属优化改善；只出报告不出手，属咨询评估。

      另一对易混是 ① 与 ②：**有计划的叫例行，被叫上门的叫响应**。
    source: manual

  - id: RK-S3-035
    module_id: S3
    kp_id: KP-0303
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 5
    title: 给自家运维做一次持续改进
    body_md: |
      拿你单位（或你负责）的一个信息系统运维场景，完成三件事：
      1. 写出当前的服务目录至少 3 项（每项写清「提供什么、给谁、什么时间可用」）
      2. 找出一个反复出现的问题，用服务生命周期的语言定性：它属于哪个阶段没做好
      3. 写出一项持续改进措施，必须包含**可度量的指标**（改前多少、目标多少、怎么采集）
    options: []
    answer: "3项可读的服务目录；问题能定位到生命周期某阶段；改进措施带改前/目标/采集方式三个要素"
    explanation_md: |
      评分重心在第 3 问的**可度量性**——「加强管理」「提升效率」这类表述不得分。

      合格示例：
      1. 服务目录：
         - 办公终端故障处理｜面向全体职工｜工作日 8:30-17:30，紧急故障 7×24
         - 业务系统账号开通｜面向各科室负责人｜工作日 2 小时内办结
         - 数据库备份与恢复｜面向系统运维组｜每日 2:00 自动备份，保留 30 天
      2. 问题定性：「每月都有 3-5 次业务系统登录失败投诉，事后查明多为密码过期未提示」——
         这属于**服务运营**阶段的用户体验设计不足，同时也暴露**持续改进**没跟上的问题
         （同一问题重复出现，说明没有形成改进闭环）。
      3. 改进措施：登录页增加密码到期提醒并支持自助重置。
         **改前**：每月登录失败投诉 3-5 次，平均处理耗时 40 分钟；
         **目标**：降到每月 ≤1 次，平均处理耗时 ≤10 分钟；
         **采集方式**：服务台工单系统按「登录失败」标签统计，每月 1 日出报表。

      为什么要卡「可度量」：SLA 指标的写法同理——写「及时响应」等于没写，
      写「2 小时内响应、8 小时内解决」才能追责与改进。这是本章的核心工程习惯。
    source: manual

  - id: RK-S3-036
    module_id: S3
    kp_id: KP-0304
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 2
    title: 这四样东西各属于哪个架构视图
    body_md: |
      企业架构四视图中，下列内容归属正确的是：
    options:
      - 数据分布与数据标准 → 应用架构
      - 应用清单与系统间集成关系 → 应用架构
      - 中间件选型与技术标准 → 业务架构
      - 业务流程模型与岗位职责 → 技术架构
    answer: "B"
    explanation_md: |
      四个视图各回答一个问题，用「问什么」对位即可：

      | 视图 | 回答什么问题 | 主要产物 |
      | --- | --- | --- |
      | 业务架构 | 做什么业务、流程怎么走 | 业务流程模型、组织与职责 |
      | 数据架构 | 有哪些数据、怎么流转 | 数据模型、数据分布、数据标准 |
      | **应用架构** | 有哪些系统、怎么交互 | **应用清单、集成关系** |
      | 技术架构 | 用什么技术支撑 | 技术标准、中间件、基础设施 |

      所以 B 对。A 是数据架构，C 是技术架构，D 是业务架构——三项全部错位，
      这正是这类题的常见出法：把四个视图的产物打乱后两两互换。

      记忆抓手：**业务问做什么、数据问有什么、应用问用哪个系统、技术问靠什么实现。**
    source: manual

  - id: RK-S3-037
    module_id: S3
    kp_id: KP-0304
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 5
    title: 给自己系统的架构做一次盘点
    body_md: |
      选一个你熟悉的信息系统，按分层架构五层做一次盘点：
      1. 逐层写出该系统里对应的具体组件或产品（每层至少 1 项；确实没有的层要写明「缺失」）
      2. 指出这套架构里最强的一层与最弱的一层，各给一个证据
      3. 若三年后业务量翻三倍，你认为最先撑不住的是哪一层？为什么？
    options: []
    answer: "五层逐项落位（缺失要写明）；强弱各带证据；指出瓶颈层并说明依据"
    explanation_md: |
      分层架构五层（由下往上）：**基础设施层 → 数据资源层 → 应用支撑层 → 业务应用层 → 展现层**，
      另外还有贯穿各层的**安全保障体系**与**运维管理体系**两条竖线。

      合格盘点的样子（以某政务审批系统为例）：
      1. - 基础设施层：政务云 8 台虚机、集中存储 20T
         - 数据资源层：Oracle 业务库、达梦交换库、Hive 分析库
         - 应用支撑层：统一认证中心（SSO）、消息队列、日志平台
         - 业务应用层：事项管理、审批流转、电子证照三个子系统
         - 展现层：政务门户 PC 端、移动端小程序、大厅大屏
         - 两条竖线：等保三级的安全体系、带值班表与工单的运维体系

      2. **最强**的证据要指向「有明确机制」：如「应用支撑层的统一认证已覆盖 12 个委办局，
         新系统接入只需配置，不再各自开发」。
         **最弱**的证据要指向「缺失或靠人扛」：如「数据资源层没有元数据与血缘，
         报表数字对不上时只能逐个系统翻，定位一次平均 2 天」。

      3. 瓶颈判断要落到**架构特征**而非「服务器会不够」：比如
         「最先撑不住的是数据资源层——分析库与应用库共用一套存储，且没有分库分表，
         业务量翻三倍后报表查询会拖垮业务库。对策是先做读写分离与冷热分层。」

      评分看的是第 2、3 问的**因果链**，不是组件清单是否齐全。只列产品不谈问题，
      等于做了一份资产台账，不是架构盘点。
    source: manual

  - id: RK-S3-038
    module_id: S3
    kp_id: KP-0305
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: easy
    level: 1
    title: 哪个模型的标志是风险驱动
    body_md: |
      下列软件开发模型中，以「风险驱动、每一轮先做风险分析再开发」为标志的是：
    options:
      - 瀑布模型
      - 原型模型
      - 螺旋模型
      - 敏捷模型
    answer: "C"
    explanation_md: |
      各模型的标志性特征：

      | 模型 | 标志 |
      | --- | --- |
      | 瀑布 | 阶段严格串行，需求稳定才适用 |
      | 原型 | 用可运行界面把需求问出来 |
      | **螺旋** | **风险驱动**，每圈先风险分析再开发，适合大型高风险项目 |
      | 敏捷 | 短周期小步交付，拥抱变化 |

      「螺旋」这个名字本身就提示了结构：一圈一圈往外扩，每圈四个象限——
      定目标、**风险分析**、开发验证、下一轮计划。风险分析是它区别于其他模型的核心。

      注意别把它和增量/迭代混为一谈：增量与迭代是**交付方式**，螺旋是**风险控制方式**，
      虽然螺旋也带迭代特征，但判据是「有没有把风险分析当成每轮必做的前置动作」。
    source: manual

  - id: RK-S3-039
    module_id: S3
    kp_id: KP-0305
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 4
    title: 选错了模型的项目为什么反复返工
    body_md: |
      某项目合同要求按瀑布模型执行，各阶段需提交文档并经客户签字确认后进入下一阶段。
      实施中客户业务部门每月都提出流程调整，每次调整都要走变更、重签文档、重做已完成部分，
      项目已延期两次。从软件工程角度看，最本质的问题是：
    options:
      - 客户不守信用，应严格按合同拒绝变更
      - 开发团队技术能力不足，导致返工量大
      - 开发模型与需求稳定性不匹配：需求本身高度不确定，却采用了以需求稳定为前提的瀑布模型
      - 文档提交得太少，应该增加文档数量以固定需求
    answer: "C"
    explanation_md: |
      模型选择的判据是**需求确定性**，不是合同偏好：

      - 瀑布的前提是**需求明确稳定**、技术成熟、合同严格
      - 题干里「每月提出流程调整」说明需求本身高度不确定，与瀑布的前提直接冲突

      冲突的结果就是每次变更都要**回退到前面阶段重做**，而瀑布的后期变更代价极大。
      所以最本质的问题是**模型与场景不匹配**，不是执行不力。

      A 把管理问题当道德问题：拒绝变更在政务/企业项目里通常不可行，且变更本身是常态。
      B 与 D 都是「在错的模型里加大投入」——能力越强、文档越多，返工的成本只会更高。

      **对策方向**（案例题常连着问）：改用迭代或原型逐步确认需求、把长周期拆成短交付、
      建立变更控制、对已确认部分冻结范围。**换模型，而不是加人加班。**
    source: manual

  - id: RK-S3-040
    module_id: S3
    kp_id: KP-0306
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 1
    title: 数据仓库的四个特征
    body_md: |
      关于数据仓库的特征，下列说法正确的是：
    options:
      - 面向业务过程组织数据，与业务系统的表结构保持一致
      - 数据实时更新，与源系统保持同步
      - 面向主题组织、集成多源数据、相对稳定、反映历史变化
      - 只存汇总数据，不保留明细数据
    answer: "C"
    explanation_md: |
      数据仓库四特征要能背，且要能逐条判断对错：

      | 特征 | 含义 |
      | --- | --- |
      | **面向主题** | 按分析主题（客户、产品、财务）组织，**不按业务系统** |
      | **集成** | 多源数据经统一编码、命名、度量口径后入库 |
      | **相对稳定** | 以查询分析为主，一次装入很少修改 |
      | **反映历史变化** | 保留时间维度，能看趋势与同比 |

      A 错在方向：与业务系统表结构一致的是业务库（OLTP），数据仓库恰恰要**脱离**源系统的结构，
      按分析主题重组。

      B 错在「实时同步」：数据仓库相对稳定，通常**批量装载**（T+1 是常态）。这是判断题高频陷阱。

      D 错在只存汇总：数据仓库既存明细也存汇总，明细是汇总的基础，也是钻取分析的前提。

      一句话区分：**业务库是为「记账」设计的，仓库是为「看趋势」设计的。**
    source: manual

  - id: RK-S3-041
    module_id: S3
    kp_id: KP-0306
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 4
    title: 各系统录入都对，报表却对不上
    body_md: |
      某集团月度经营分析会上，财务部报出营收 1.2 亿、运营部报出 1.35 亿、管理层看到的
      大屏显示 1.28 亿。经核查：三个系统的原始录入都没有错误，各自的统计逻辑也都能自圆其说。
      最可能的根因是：
    options:
      - 数据录入人员操作失误，需加强培训
      - 缺少统一的数据标准与指标口径，同一指标在不同系统按不同规则计算
      - 数据仓库容量不足，导致数据丢失
      - 网络传输延迟，报表未取到最新数据
    answer: "B"
    explanation_md: |
      题干给了两个排除性条件：**录入都没错**（排除 A）、**各自逻辑都能自圆其说**（排除偶发错误）。
      剩下的是**口径问题**——同一指标（营收）在三处的定义不同：含不含税、含不含退货、
      按签收还是按开票确认，任一处不一致就会差出一千多万。

      这类问题的治理顺序是：**建数据标准（统一编码、命名、口径）→ 管主数据 → 建质量规则与稽核
      → 建元数据与血缘 → 定安全分级**。第一步永远是标准，因为口径不统一时，
      任何集成、任何报表工具都只是把分歧搬到了新地方。

      C 与 D 属于「先怀疑技术」的惯性思维：数据丢失通常表现为**缺数或空值**，
      网络延迟通常表现为**延迟**，都不会表现为「三个数都合理但互不相等」。

      判据一句话：**三个数各自都能自圆其说，就不是数据错，是定义不同。**
    source: manual

  - id: RK-S3-042
    module_id: S3
    kp_id: KP-0307
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 2
    title: OSI 与 TCP/IP 的层间对应
    body_md: |
      关于 OSI 七层模型与 TCP/IP 四层模型的对应关系，下列说法正确的是：
    options:
      - OSI 的传输层对应 TCP/IP 的网络接口层
      - OSI 的应用层、表示层、会话层对应 TCP/IP 的应用层
      - OSI 的网络层对应 TCP/IP 的传输层
      - OSI 的数据链路层与物理层对应 TCP/IP 的网际层
    answer: "B"
    explanation_md: |
      对应关系一次记清：

      | OSI 七层 | 功能 | TCP/IP 四层 |
      | --- | --- | --- |
      | 应用层、表示层、会话层 | 面向应用的数据处理与对话 | **应用层** |
      | 传输层 | 端到端可靠传输（TCP）或无连接传输（UDP） | 传输层 |
      | 网络层 | 路由与寻址（IP） | 网际层 |
      | 数据链路层、物理层 | 帧传输与物理介质 | 网络接口层 |

      所以 B 对，其余三项都把层对错了位。

      **配套要记的端口**（几乎每年抽一两个考）：HTTP 80、HTTPS 443、FTP 20/21、SSH 22、
      Telnet 23、SMTP 25、DNS 53、SNMP 161。

      **一个高频错项**：「交换机工作在网络层」——普通交换机工作在**数据链路层**，
      只有三层交换机才具备路由功能。这条与层间对应是同一类考点。
    source: manual

  - id: RK-S3-043
    module_id: S3
    kp_id: KP-0307
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 3
    title: 这段布线属于哪个子系统
    body_md: |
      某办公楼共 9 层，一层设中心机房。设计如下：办公工位的信息插座经双绞线接至本层配线间；
      各楼层配线间经光纤接至一层中心机房的主配线架；主配线架与核心交换机安装在中心机房内。
      其中「各楼层配线间经光纤接至一层中心机房」属于：
    options:
      - 水平子系统
      - 建筑群子系统
      - 设备间子系统
      - 垂直干线子系统
    answer: "D"
    explanation_md: |
      综合布线六子系统的判别方法只有一个：**看两端接哪里**。

      | 子系统 | 连接范围 |
      | --- | --- |
      | 工作区 | 终端到信息插座（含跳线） |
      | 水平 | 信息插座到**本层**配线架（同一楼层平面内） |
      | **垂直干线** | 楼层配线架到设备间主配线架（**跨层**） |
      | 设备间 | 主配线架、网络设备所在 |
      | 管理 | 配线架与跳线管理 |
      | 建筑群 | **楼与楼之间** |

      题干「各楼层配线间 → 一层中心机房」跨越了楼层，属于**垂直干线子系统**，
      光纤正是干线的常见介质。

      干扰项提示：同一题里「信息插座到本层配线间」是水平子系统（同一楼层平面内），
      「主配线架与核心交换机」在设备间子系统内。建筑群只用于**不同建筑物**之间，
      同一栋楼内再怎么跨层也不是建筑群——这是本题最像的误选项。
    source: manual

  - id: RK-S3-044
    module_id: S3
    kp_id: KP-0307
    category: 中项·S3 信息技术基础
    type: 实操
    difficulty: hard
    level: 5
    title: 定位自己项目的集成难点在哪一层
    body_md: |
      选一个你参与过的集成类项目（多厂商设备、多个系统对接都算），完成三件事：
      1. 按「设备 → 网络 → 软件 → 数据 → 应用」五个层面，写出这个项目实际做了哪几层集成
      2. 指出最难的一层，并给出一个具体的困难事件（时间、现象、影响）
      3. 写出你在接口责任划分上的做法或教训：出问题时，怎么判断是谁的责任
    options: []
    answer: "五层按实际落位；最难一层带具体事件；接口责任要有可判定的依据"
    explanation_md: |
      五层面从低到高：**设备 → 网络 → 软件 → 数据 → 应用**，
      **层次越高价值越大、难度也越大**，因为越往上越牵涉业务流程。

      合格示例（某机房改造 + 三系统对接项目）：
      1. 做了设备（服务器与存储上架）、网络（核心与接入交换机、VLAN 规划）、
         软件（中间件与操作系统适配）、应用（三个系统的接口对接）四层；
         数据层只做了基础的数据字典核对，未做统一口径。
      2. 最难的是**应用层**：2026-05 联调时，A 系统把审批状态设计成 4 种，B 系统只认 3 种，
         互相等对方改，联调停工 9 天。根因是接口文档只约定了字段名，没约定**枚举值域**。
      3. 责任划分的做法：把接口规范写成三方签字的技术附件，明确字段、类型、**取值范围**、
         异常返回、超时重试、日志落盘位置；出问题时按「谁的数据不符合附件」判定，
         争议超 1 天由总集成方裁定。

      **最容易被忽略的一条**：接口责任不清时，各方都会说「我这边测试是好的」——
      因为各自只测了自己的边界。判据是**有没有一份写明值域与时序的技术附件**，
      而不是谁的设备更贵。

      评分看第 2 问的事件是否具体、第 3 问的依据是否可判定。只写「沟通不畅，需加强协调」
      不得分——那正是这个知识点要治的病。
    source: manual

  # ── 2026-10-29 补格：S5 空缺的 5 个格子 ──
  - id: RK-S5-018
    module_id: S5
    kp_id: KP-0502
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: easy
    level: 1
    title: GB、GB/T、GB/Z 各是什么性质
    body_md: |
      按我国标准体系，代号 GB、GB/T、GB/Z 分别表示：
    options:
      - 强制性国家标准、推荐性国家标准、指导性技术文件
      - 推荐性国家标准、强制性国家标准、行业标准
      - 国家标准化指导文件、强制性国家标准、推荐性国家标准
      - 国家标准、行业标准、企业标准
    answer: "A"
    explanation_md: |
      三个代号的区别在**第三位字母**：

      | 代号 | 性质 | 约束力 |
      | --- | --- | --- |
      | **GB** | 强制性国家标准 | **必须执行** |
      | **GB/T** | 推荐性国家标准 | 自愿采用（被引用后在该范围内强制） |
      | **GB/Z** | 指导性技术文件 | 供参考 |

      记忆法：**T 是推荐（Tuijian）的首字母，Z 是指导（Zhidao）的首字母**。

      标准的五个层级从高到低是：国家标准（GB）、行业标准（如 SJ/Y D）、地方标准（DB）、
      团体标准（T）、企业标准（Q）。层级的硬规矩是：**下一级不得与上一级相抵触，
      但企业标准可以严于国家标准，不能低于。**

      一个高频错项：把「GB/T 可以不执行」当成绝对结论——**被合同或法规引用后就具有约束力**，
      这是判断题的经典陷阱（见本节 L3 那题）。
    source: manual

  - id: RK-S5-019
    module_id: S5
    kp_id: KP-0502
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: medium
    level: 3
    title: 企业标准比国标更严合规吗
    body_md: |
      某企业的内部技术标准规定：数据备份保留 180 天，故障响应时间不超过 1 小时。
      而对应的国家标准（推荐性）要求备份保留 90 天、响应时间不超过 2 小时。
      该企业在投标文件中声明执行自己的内部标准。以下判断正确的是：
    options:
      - 不合规，企业标准不得与国家标准不一致
      - 合规，企业标准可以严于国家标准，该声明对投标方具有约束力
      - 不合规，必须严格按国家标准执行，不得自定更严的指标
      - 是否合规由评标委员会决定
    answer: "B"
    explanation_md: |
      标准层级关系的硬规矩是：**下一级标准不得与上一级标准相抵触；
      但企业标准可以严于国家标准，不能低于。**

      本题企业标准在两项指标上都**更严**（180 天 > 90 天、1 小时 < 2 小时），
      属于「严于国标」，合规；且写进投标文件后，成为承诺内容，**对投标方产生约束力**。

      A 与 C 都把「不得抵触」误解成「必须一致」。抵触指的是**低于或违背**，
      不是「不能更好」。D 混淆了权限：适用性由标准体系本身与合同约定决定，
      评委只能判断是否响应招标要求，不能重新解释标准层级。

      **反向情形要一并记住**：如果企业标准写成「备份保留 30 天」，低于国标的 90 天，
      那就构成抵触，不合规，且不得据此交付。

      **另一半考点**：推荐性标准一旦**被合同引用**，在该合同范围内即具有强制约束力——
      这是「GB/T 可以不执行」这句话唯一的破口。
    source: manual

  - id: RK-S5-020
    module_id: S5
    kp_id: KP-0503
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: easy
    level: 1
    title: 职业道德的六条基本要求
    body_md: |
      信息系统项目管理相关职业道德的基本要求通常概括为六条，下列不属于这六条的是：
    options:
      - 遵纪守法、诚实守信
      - 客观公正、爱岗敬业
      - 保守秘密、终身学习
      - 服从上级、维护企业利益最大化
    answer: "D"
    explanation_md: |
      六条基本要求：**遵纪守法、诚实守信、客观公正、爱岗敬业、保守秘密、终身学习**。

      D 的问题在于把「服从」和「企业利益最大化」当成职业准则——这两条恰恰是职业道德题里
      **最常被推翻的辩解**：

      - 「领导让我这么做的」不是免责理由，**服从管理不等于服从违法指令**
      - 企业利益不能凌驾于法律与公众安全之上；涉及公共安全的已知风险，
      职业责任优先于合同义务与企业利益

      所以 D 不但不属于六条，还与其中三条直接冲突（守法、公正、诚信）。

      判据一句话：**六条讲的都是「对事实、对公众、对专业负责」，
      没有一条是「对上级负责」。**
    source: manual

  - id: RK-S5-021
    module_id: S5
    kp_id: KP-0503
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: medium
    level: 2
    title: 保密义务管到什么时候、管到哪些东西
    body_md: |
      关于项目中的保密义务，下列说法正确的是：
    options:
      - 保密义务在劳动合同终止或项目结束后自动解除
      - 保密范围包括客户业务数据、商业机密、系统漏洞信息与合同价格，且保密义务不因离职而终止
      - 只有签了保密协议的人才有保密义务，未签的人不受约束
      - 项目结束后可以把项目资料整理成个人作品用于分享，只要不涉及价格
    answer: "B"
    explanation_md: |
      保密义务的两个关键点，题干已经给出正确答案：

      **一、范围比想象的大**：客户业务数据、商业机密、**系统漏洞信息**、合同价格，
      都在保密范围内。漏洞信息尤其容易被忽略——它常被认为「反正是技术细节」，
      但泄露漏洞等于给攻击者指路。

      **二、期限不随离职终止**：保密义务是**持续义务**，不因劳动关系终止、
      项目结束而自动解除。A 是最常见的错误认知。

      C 错在把义务的来源限死在「签了协议」：保密义务既来自合同约定，
      也来自法律（反不正当竞争、数据安全、个人信息保护）与职业规范。

      D 是最隐蔽的一种违规：把项目资料整理成作品分享，即使隐去价格，
      仍可能泄露客户业务结构与系统设计。**未经授权不得将项目资料用于其他用途**，
      包括写进个人作品与案例分享。

      另一条边界：发现严重漏洞时的正确动作是**内部报告并推动修复，不对外公开**。
    source: manual

  - id: RK-S5-022
    module_id: S5
    kp_id: KP-0503
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: medium
    level: 3
    title: 供应商的这份礼该怎么处理
    body_md: |
      项目进入设备选型阶段，三家供应商参与比选。其中一家供应商的销售负责人
      以「技术交流」为名约你吃饭，席间表示「无论选不选我们，这点心意都请收下」，
      并递来一张购物卡。你与该供应商的报价评估直接相关。最恰当的处理是：
    options:
      - 收下但不影响判断，因为对方说了「选不选都给」
      - 当场婉拒；无法当场退还的，登记并上交，同时向项目负责人申报该利益冲突并申请回避
      - 收下后转交给团队作为团建经费，个人不占便宜即可
      - 不必处理，等选型结果出来后再说
    answer: "B"
    explanation_md: |
      这道题的考点是**「申报回避」比「拒绝」更专业**。

      正确动作有三层，缺一层都不完整：
      1. **不当场接受**（婉拒）
      2. **无法退还的登记上交**（留痕，证明自己没有占为己有）
      3. **申报利益冲突并申请回避**——因为题干写明「你与该供应商的报价评估直接相关」，
      继续参与评估本身就会让结论失去公信力，哪怕你自认为公正

      A 的错在「不影响判断」这个自我保证：利益冲突的判断标准不是**结果是否公正**，
      而是**是否存在影响公正的可能性**。收了卡，后续无论怎么评都会被质疑。

      C 把问题转移了：个人不占便宜不等于合规，转交团建经费仍属接受利益输送，
      而且会让整个团队被绑定。

      D 是拖延，等于把风险留到既成事实之后。

      判据一句话：**利益冲突不看你有没有被影响，看你有没有处在可能被影响的位置。**
    source: manual

  # ── 2026-10-29 补格：S6 空缺的 9 个格子 ──
  - id: RK-S6-018
    module_id: S6
    kp_id: KP-0601
    category: 中项·S6 应试专项
    type: 单选
    difficulty: easy
    level: 1
    title: 三点估算的期望工期公式
    body_md: |
      三点估算（PERT）中，期望工期的计算公式是：
    options:
      - （乐观 + 最可能 + 悲观）÷ 3
      - （乐观 + 4 × 最可能 + 悲观）÷ 6
      - （乐观 + 悲观）÷ 2
      - （最可能 + 悲观）÷ 2
    answer: "B"
    explanation_md: |
      PERT 两个公式要成对记：

      - **期望工期 = (乐观 + 4 × 最可能 + 悲观) ÷ 6**
      - **标准差 = (悲观 − 乐观) ÷ 6**

      A 是**简单算术平均**，最可能的权重不是 1 而是 4——这是最普遍的错法，
      一旦这里算错，后面基于期望值的概率题全部连带错。

      C 是只取两端的中点，完全不考虑最可能值。D 只用了两个值。

      **标准差的用途**：判断概率区间——正负 1 个标准差约 68.26%，2 个约 95.46%，
      3 个约 99.73%。题问「多少天内完成的概率约 95%」，就答「期望工期 ± 2 个标准差」。
      另外，**标准差越小说明估算越集中、风险越小**，这个方向别弄反。
    source: manual

  - id: RK-S6-019
    module_id: S6
    kp_id: KP-0602
    category: 中项·S6 应试专项
    type: 单选
    difficulty: easy
    level: 1
    title: 单代号、双代号与虚活动
    body_md: |
      关于网络图，下列说法正确的是：
    options:
      - 单代号网络图中，箭线表示活动，节点表示事件
      - 双代号网络图中，节点表示活动，箭线表示逻辑关系
      - 双代号网络图中的虚活动只表示逻辑关系，不消耗时间也不消耗资源，工期为 0
      - 虚活动消耗资源但不消耗时间
    answer: "C"
    explanation_md: |
      两种网络图的表示方式是**反的**，这是最容易记错的点：

      | 类型 | 节点表示 | 箭线表示 | 简称 |
      | --- | --- | --- | --- |
      | **单代号** | **活动** | 逻辑关系 | AON |
      | **双代号** | 事件 | **活动** | AOA |

      所以 A 与 B 都把两者说反了。判别窍门看名字：**「单代号」＝一个节点写一个代号（活动）**，
      「双代号」＝一条箭线两端各一个代号（事件），活动在线上。

      **虚活动**（虚箭线）：只表达逻辑依赖关系，**既不消耗时间也不消耗资源，工期为 0**。
      它的作用是让两条并行路径的依赖关系表达清楚，避免画错。

      D 是常见误答——「不耗时」是对的，「消耗资源」是错的，两个都不消耗。
    source: manual

  - id: RK-S6-020
    module_id: S6
    kp_id: KP-0602
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 4
    title: 非关键活动延误了，总工期变不变
    body_md: |
      某项目关键路径为 A-B-D-E，总工期 15 天。活动 C 与 B 并行（路径 A-C-D-E），
      C 的工期 2 天、**总时差 2 天**。若 C 实际延误 4 天，其余活动按期完成，则总工期：
    options:
      - 不受影响，仍是 15 天
      - 延长 2 天，变为 17 天
      - 延长 4 天，变为 19 天
      - 延长 6 天，变为 21 天
    answer: "B"
    explanation_md: |
      判据只有一条：**拿延误天数与总时差比**。

      - 延误 ≤ 总时差 → 不影响总工期
      - 延误 > 总时差 → 总工期顺延**超出部分**（延误 − 总时差）

      本题 C 延误 4 天、总时差 2 天，超出 2 天，所以**总工期延长 2 天，变为 17 天**。

      C 的错法是把整个延误天数算进去——被总时差吸收的那 2 天不占工期。
      A 的错法是完全忽略「超过时差」这层：如果延误只有 2 天，才是 A。
      D 是乱加。

      **更深一层的性质**：C 延误超过时差后，路径 A-C-D-E 变成 17 天，
      与 A-B-D-E 的 15 天相比成了新的最长路——**关键路径转移了**。
      此后要继续压缩工期，得压 C 这条新关键路径上的活动，压 B 已经没用。
      这一步是高分点，选择题不一定问，但案例题里问「该怎么办」时是核心答案。
    source: manual

  - id: RK-S6-021
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 3
    title: Scope Creep 指的是什么
    body_md: |
      Which of the following best describes "scope creep"?
    options:
      - 经变更控制流程批准的正式范围变更
      - 未经控制的、逐步累积的范围扩大
      - 项目结束时对范围进行最终确认
      - 因客户组织调整导致相关方变更
    answer: "B"
    explanation_md: |
      **Scope Creep = 范围蔓延**，定义的核心是**未经控制**且**逐步累积**：
      不是一次大的变更，而是一连串「顺手做一下吧」的小增补，每次都不走流程，
      累积起来让范围、进度、成本全失控。

      A 是**正常变更**（Approved Scope Change），与蔓延的区别就在「有没有走变更控制流程」。
      这两个概念在案例题里是核心对立项：**变更控制不是拒绝变更，而是防止蔓延**。

      C 描述的是确认范围（Verify Scope），D 描述的是相关方变化，都与 scope creep 无关。

      **配套要记的同组术语**：
      - Baseline 基线（不是「底线」）
      - Milestone 里程碑（工期为 0 的检查点）
      - Deliverable 可交付成果
      - Crashing 赶工（加资源）/ Fast Tracking 快速跟进（改并行）

      做英文题的技巧：不逐词翻译，先抓**关键词**——出现 uncontrolled、gradually、
      incremental 这类词，多半指向 creep。
    source: manual

  - id: RK-S6-022
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 4
    title: 英文题干里判断哪句话对
    body_md: |
      Which of the following statements about milestones is correct?
    options:
      - A milestone has a duration equal to its preceding activity.
      - A milestone is a checkpoint with zero duration.
      - A milestone consumes resources but takes no time.
      - A milestone is the same as a deliverable.
    answer: "B"
    explanation_md: |
      **Milestone（里程碑）= 工期为 0 的检查点**，它标记一个重要节点（如「需求评审通过」），
      不占工期、不消耗资源。所以 B 对。

      A 错在把里程碑当成活动：活动有历时，里程碑没有（duration = 0）。
      C 错在「消耗资源」——里程碑既不占时间也不占资源，它只是一个标记。
      D 错在把里程碑与可交付成果等同：**可交付成果是产出的东西**（如系统、文档），
      **里程碑是时间上的节点**（如「系统上线完成」）。一个里程碑往往关联某个可交付成果的完成，
      但两者不是一回事。

      **英文判断题通用经验**（讲义里明确点过）：重点看否定词与量词 not / all / only，
      **含 all 与 only 的表述通常错**。本题四个选项都没有这些词，所以只能靠概念本身判。

      顺带记住同组的两个易混词：**Float / Slack 都指时差**（同义），
      **Crashing 赶工 / Fast Tracking 快速跟进**（不同手段）。
    source: manual

  - id: RK-S6-023
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 实操
    difficulty: hard
    level: 5
    title: 给自己项目做一份中英对照术语表
    body_md: |
      拿你手上的一个项目，做一份**自用**的中英对照术语表（不少于 8 条），要求：
      1. 每条写「英文全称 + 缩写 + 中文」，并注明它在你项目里对应哪份文档或哪个动作
      2. 从这 8 条里挑 2 条，用一句英文写出它的作用（不超过 20 词）
      3. 写出你在阅读英文招标文件或外方技术附件时，最容易误解的一个术语，并说明差在哪
    options: []
    answer: "8条术语落在自己项目上；2句英文表达准确；指出一个真实误解与差异"
    explanation_md: |
      这题的目的不是背单词，而是**把术语钉到自己项目的具体物件上**——
      只有落到「哪份文档、哪个动作」，考试时才能在题干里一眼认出来。

      合格示例（节选）：
      | 英文 | 缩写 | 中文 | 在自己项目里对应 |
      | --- | --- | --- | --- |
      | Work Breakdown Structure | WBS | 工作分解结构 | 《某平台建设 WBS》三级分解表 |
      | Statement of Work | SOW | 工作说明书 | 合同附件二的采购范围描述 |
      | Change Control Board | CCB | 变更控制委员会 | 每月一次的变更评审会 |
      | Earned Value Management | EVM | 挣值管理 | 月度状态报告里的 SPI/CPI |
      | Service Level Agreement | SLA | 服务级别协议 | 运维合同附件的响应时限表 |
      | User Acceptance Testing | UAT | 用户验收测试 | 上线前的业务方验收轮 |
      | Proof of Concept | POC | 概念验证 | 选型阶段的两周试点 |
      | Total Cost of Ownership | TCO | 总拥有成本 | 三年期成本对比表 |

      英文表述（示例）：
      - "A WBS breaks the project scope into manageable work packages."
      - "The CCB decides whether a change request is approved, rejected, or deferred."

      **第 3 问才是真正的价值所在**。常见误解举例：
      「把 Baseline 当成『底线』，实际它是**经批准、受变更控制的基准**，
      不能随口说『这是我的底线，不能改』——基准可以改，但要走变更流程」；
      或「把 Milestone 当成一个有工期的阶段，实际它是工期为 0 的检查点」。

      评分看第 1 问是否落到自己项目、第 3 问的误解是否具体。只抄一张缩写表不构成答案。
    source: manual

  - id: RK-S6-024
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 单选
    difficulty: easy
    level: 1
    title: 案例题的四步答题骨架
    body_md: |
      信息系统项目管理师下午卷案例题，推荐的答题骨架是：
    options:
      - 定位 → 原因 → 对策 → 依据
      - 背景 → 分析 → 总结 → 展望
      - 定义 → 举例 → 对比 → 结论
      - 结论 → 论证 → 反驳 → 重申
    answer: "A"
    explanation_md: |
      四步骨架的作用是**让阅卷老师能在 30 秒内找到得分点**：

      1. **定位**：问题出在哪个管理过程（点出过程名，按术语给分）
      2. **原因**：缺什么（缺文件、缺流程、缺角色、缺评审）
      3. **对策**：补什么、谁来做、什么时候做、做到什么程度
      4. **依据**：教材条目或规范要求，一句话即可

      B、C、D 都是写作或议论文的套路，与案例题无关。案例题不考文采，
      而是考**能不能把管理动作说清楚**——它是「技术写作」，不是「作文」。

      **案例题的分值结构**要清楚：下午卷三道案例，每题含若干小问，
      小问类型就五种——找问题、析原因、提措施、算指标、判是非，且常组合出现。
      所以按小问逐个答，**不要写成一篇连贯的文章**。
    source: manual

  - id: RK-S6-025
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 单选
    difficulty: medium
    level: 2
    title: 得分点长什么样
    body_md: |
      案例题得分点通常具备四个特征，下列不属于这四个特征的是：
    options:
      - 分条编号，每行一个点
      - 用动宾结构，动词开头
      - 使用教材术语，不用口语
      - 尽量写成完整的长句，把道理讲透
    answer: "D"
    explanation_md: |
      得分点四特征：**分条、动宾结构、术语准确、有量化**。

      D 恰恰是反例：**长句会把得分点埋起来**。阅卷是按关键词给分，
      一长段话里即使说对了，也可能因为找不到关键词而丢分。

      其余四特征的对照：

      | 特征 | 好 | 坏 |
      | --- | --- | --- |
      | 分条 | 1. 建立变更控制流程 | 一段话连续叙述 |
      | 动宾 | 组织需求评审 | 「需求评审很重要」 |
      | 术语 | 未建立范围基准 | 「没有范围标准」 |
      | 量化 | 每周一次例会、2 小时内响应 | 「加强沟通」 |

      **失分的五类典型**（讲义里点明的）：只写结论不写动作、空话套话、
      不分条、问题与对策不对应、漏答小问。其中**漏答小问是最大的非技术失分**——
      每题控制在 30 分钟内，留 10 分钟专门检查有没有漏答。
    source: manual

  - id: RK-S6-026
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 单选
    difficulty: hard
    level: 3
    title: 这段答案为什么拿不到分
    body_md: |
      某考生在案例题「请指出该项目存在的主要问题」下作答：
      「该项目管理不规范，项目经理责任心不强，团队执行力差，
      建议加强管理、提高认识、强化沟通，确保项目按期完成。」
      按案例题的评分特征，这段答案的主要问题是：
    options:
      - 字数太少，信息量不足
      - 评价了人而不是指出管理事实，且全是空话，没有对应的过程与动作，无法命中得分点
      - 没有引用教材原文，缺少理论依据
      - 没有写计算过程
    answer: "B"
    explanation_md: |
      这段话踩了三个典型失分点：

      1. **评价人而不是说事实**——「责任心不强」「执行力差」是道德评价，
         案例题要的是「未编制项目管理计划」「未建立变更控制流程」这类**可核对的管理事实**
      2. **全是空话**——「加强管理」「提高认识」「强化沟通」是讲义里点名的五类失分典型之二，
         没有主体、没有动作、没有时点
      3. **不命中得分点**——阅卷按过程名与术语给分，这段话里一个术语都没有

      A 错在方向：案例题**不看字数看命中**，五条精准的短句远胜一段空话。
      C 错在「引用原文」：依据只需一句话点到，不需要成段引用。
      D 错在答非所问：本题问的是「问题」，不涉及计算。

      **改进写法对照**（同一道题）：
      - 未编制经批准的项目管理计划，缺少范围、进度、成本基准
      - 未建立变更控制流程，客户新增需求未经影响分析与 CCB 审批即实施
      - 未识别关键相关方，验收标准未在前期达成一致
      - 未组织阶段验收，缺少验收记录与确认范围过程
      - 未开展经验教训总结，同类问题重复发生

      这五条每条都是「缺什么」，术语准确、动宾结构、可核对——这才是拿分的形态。
    source: manual
