# ── 示例题（12 道，用于验证链路，不是完整题库）────────────────
# 字段对齐现有 practice_questions 表，导入时无需转换
#
questions:
  - id: RK-S1-001
    module_id: S1
    kp_id: KP-0101
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: easy
    level: 1
    title: 项目与运营的区别
    body_md: |
      下列关于项目与运营的说法，正确的是？
    options:
      - 项目是持续性的，运营是临时性的
      - 项目具有临时性和独特性，运营是持续重复的
      - 项目不需要明确目标，运营需要
      - 项目和运营都由同一套组织流程管理，无区别
    answer: "B"
    explanation_md: |
      项目的两个本质特征是**临时性**（有明确起止）和**独特性**（产出物唯一）。运营是持续、重复、以维持业务为目的。这是全书最基础的一对概念，后续所有过程组都建立在这个区分上。
    source: manual

  - id: RK-S1-002
    module_id: S1
    kp_id: KP-0102
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 2
    title: 五大过程组的逻辑关系
    body_md: |
      关于五大过程组，下列说法错误的是？
    options:
      - 启动过程组的输出之一是项目章程
      - 五大过程组在项目生命周期中会重复出现
      - 五大过程组必须严格按顺序执行，前一阶段不结束不能进入下一阶段
      - 收尾过程组可能出现在项目的每个阶段末
    answer: "C"
    explanation_md: |
      五大过程组是**逻辑分组**，不是时间顺序。它们在实际项目中高度交叠、循环往复——监控过程组贯穿全程，收尾在每个阶段末都会发生。选 C 的错误在于把逻辑分组当成了瀑布式时序。
    source: manual

  - id: RK-S2-001
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 单选
    difficulty: easy
    level: 1
    title: 挣值分析：进度偏差的含义
    body_md: |
      某项目 EV=800，PV=1000，AC=900。关于该项目当前状态，正确的是？
    options:
      - 进度超前，成本节约
      - 进度落后，成本超支
      - 进度落后，成本节约
      - 进度超前，成本超支
    answer: "B"
    explanation_md: |
      SV = EV − PV = 800 − 1000 = **−200**，小于 0 ⇒ 进度落后。CV = EV − AC = 800 − 900 = **−100**，小于 0 ⇒ 成本超支。记忆锚点：SV 看进度、CV 看成本，两个都是「EV 减后面那个」。
    source: manual

  - id: RK-S2-002
    module_id: S2
    kp_id: KP-0206
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: hard
    level: 3
    title: 挣值分析：完整指标计算
    body_md: |
      某项目当前状态：EV=800 万元，PV=1000 万元，AC=900 万元，BAC=2000 万元。

      请计算并写出过程：
      1. 进度偏差 SV、成本偏差 CV
      2. 进度绩效指数 SPI、成本绩效指数 CPI
      3. 按当前绩效预测完工估算 EAC（用 CPI 法）
      4. 逐项判断进度与成本状态
    options: []
    answer: "SV=-200万元（进度落后）；CV=-100万元（成本超支）；SPI=0.8；CPI≈0.889；EAC=BAC/CPI≈2250万元"
    explanation_md: |
      1. SV = EV − PV = 800 − 1000 = −200（<0 进度落后）
      2. CV = EV − AC = 800 − 900 = −100（<0 成本超支）
      3. SPI = EV / PV = 800 / 1000 = 0.8
      4. CPI = EV / AC = 800 / 900 ≈ 0.889
      5. EAC = BAC / CPI = 2000 / 0.889 ≈ **2250 万元**（按当前成本绩效外推，完工要多花 250 万）

      **给分点**：每项写公式 + 代值 + 结论。案例题只写数字不写过程会大量丢分，这是最常见的失分原因。
    source: manual

  - id: RK-S2-003
    module_id: S2
    kp_id: KP-0207
    category: 中项·S2 五大过程组实操
    type: 实操
    difficulty: medium
    level: 3
    title: 变更管理流程
    body_md: |
      项目执行中，客户提出一项范围变更。请按标准流程写出处理步骤（不少于 5 步）。
    options: []
    answer: "提出变更申请 → 分析变更影响（范围/进度/成本/质量）→ 提交 CCB 审批 → 批准后更新相关计划与基准 → 实施变更 → 验证并记录 → 通知干系人"
    explanation_md: |
      关键是要出现 **CCB（变更控制委员会）审批** 和 **更新基准** 两步，这两步是判分核心。
      常见错误：直接从"客户提出"跳到"开始改"，跳过影响分析和审批——这在真实项目里就是范围失控的起点。

      对照你自己的项目想一遍：上次客户临时加需求，有没有走完这个流程？
    source: manual

  - id: RK-S3-001
    module_id: S3
    kp_id: KP-0302
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: medium
    level: 2
    title: 云计算三层服务模型
    body_md: |
      用户只需管理自己的应用和数据，操作系统及以下由云服务商负责。这属于哪种服务模型？
    options:
      - IaaS
      - PaaS
      - SaaS
      - DaaS
    answer: "B"
    explanation_md: |
      判断口诀——**看操作系统归谁管**：
      IaaS = 只给基础设施（虚拟机/存储/网络），操作系统以上自己管；
      PaaS = 平台也给，操作系统和运行时由服务商管，用户只管应用和数据；
      SaaS = 连应用都是别人的，用户只管用。

      本题「操作系统由服务商负责、用户管应用和数据」⇒ PaaS。
    source: manual

  - id: RK-S3-002
    module_id: S3
    kp_id: KP-0308
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: easy
    level: 1
    title: 网络安全等级保护分级
    body_md: |
      我国网络安全等级保护制度将信息系统分为几个安全保护等级？
    options:
      - "3 级"
      - "4 级"
      - "5 级"
      - "6 级"
    answer: "C"
    explanation_md: |
      等保分为**五级**，从第一级（自主保护）到第五级（专控保护），级别越高监管越严。
      政务类系统通常要求三级及以上——这一条和你手上的数据空间项目直接相关，甲方验收会查等保测评报告。
    source: manual

  - id: RK-S3-003
    module_id: S3
    kp_id: KP-0306
    category: 中项·S3 信息技术基础
    type: 单选
    difficulty: hard
    level: 2
    title: 数据治理与数据管理的区别
    body_md: |
      下列关于数据治理与数据管理的说法，正确的是？
    options:
      - 两者是同义词，可以互换使用
      - 数据治理是决策权与问责机制的安排，数据管理是具体执行活动
      - 数据管理层次高于数据治理
      - 数据治理只关注数据质量
    answer: "B"
    explanation_md: |
      **治理管"谁来决定、谁负责"，管理管"具体怎么做"。**
      类比：治理是董事会定规则，管理是部门按规则干活。数据中台项目里最容易出的问题就是只有管理动作、没有治理机制，
      结果各部门口径不一致，对不上数。
    source: manual

  - id: RK-S4-001
    module_id: S4
    kp_id: KP-0402
    category: 中项·S4 组织保障与监理
    type: 单选
    difficulty: medium
    level: 1
    title: 信息系统监理的职责范围
    body_md: |
      信息系统工程监理的"四控两管一协调"中，"四控"指的是？
    options:
      - 质量、进度、投资、安全
      - 范围、进度、成本、质量
      - 质量、进度、合同、信息
      - 投资、质量、风险、变更
    answer: "A"
    explanation_md: |
      四控 = **质量、进度、投资、安全**；两管 = 合同管理、信息管理；一协调 = 组织协调。
      注意别和项目管理的"范围/进度/成本/质量"搞混——那是项目管理的四要素，监理的四控里是**投资和安全**，不是范围和成本。
    source: manual

  - id: RK-S5-001
    module_id: S5
    kp_id: KP-0501
    category: 中项·S5 法规与职业道德
    type: 单选
    difficulty: hard
    level: 2
    title: 招标投标中的法律性质
    body_md: |
      根据《招标投标法》，中标通知书的法律性质是？
    options:
      - 要约邀请
      - 要约
      - 承诺
      - 意向书
    answer: "C"
    explanation_md: |
      三方链条要记牢：
      **招标公告 = 要约邀请**（请别人来报价）
      **投标文件 = 要约**（正式报价）
      **中标通知书 = 承诺**（接受报价，合同成立）
      这条几乎年年考，也是最容易记反的一组。
    source: manual

  - id: RK-S6-001
    module_id: S6
    kp_id: KP-0603
    category: 中项·S6 应试专项
    type: 单选
    difficulty: easy
    level: 1
    title: 英文专业术语（EVM）
    body_md: |
      In project management, "EVM" stands for:
    options:
      - Enterprise Value Management
      - Earned Value Management
      - Estimated Value Method
      - Evaluation and Verification Model
    answer: "B"
    explanation_md: |
      EVM = **Earned Value Management**（挣值管理）。英文题只考术语原义，不考语法。
      备考方式：把十大知识领域、五大过程组的英文对照表过一遍即可，5 道题能拿 3-4 分就是赚的。
    source: manual

  - id: RK-S6-002
    module_id: S6
    kp_id: KP-0604
    category: 中项·S6 应试专项
    type: 实操
    difficulty: hard
    level: 4
    title: 案例题答题结构训练
    body_md: |
      某项目进度严重滞后，客户投诉频繁，团队加班严重但产出不增。
      请从项目管理角度分析存在的问题，并提出改进建议。

      要求：问题不少于 4 条，建议必须与问题一一对应。
    options: []
    answer: "问题可从范围/进度/质量/沟通/资源五个方面拆解；建议须一一对应，且要写出具体动作，不能只写「加强管理」"
    explanation_md: |
      **答题结构**（这类题有固定套路，练模板比练知识更有效）：
      1. 先分类，不要一锅端——范围、进度、成本、质量、资源、沟通、风险，逐项扫
      2. 每条问题写成「现象 + 对应管理过程缺失」，例如：
         「加班多但产出不增 ⇒ 进度计划未做资源平衡，未识别关键路径」
      3. 建议必须与问题**一一对应**，且是具体动作：
         ✗「加强进度管理」 → ✓「重排 WBS，识别关键路径，对非关键任务削减投入」
      4. 字数控制：问题 4-5 条、建议 4-5 条，宁少勿滥

      **失分点**：只写问题不写建议、建议与问题不对应、写大词不写动作。
    source: manual

  # ── 第一批补题（2026-10-27）：S1 补齐到每层 3 题 ──────────────
  - id: RK-S1-003
    module_id: S1
    kp_id: KP-0103
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: easy
    level: 1
    title: 十大知识领域：范围管理
    body_md: |
      十大知识领域中，负责「确保项目包含且仅包含成功完成项目所需的工作」的是？
    options:
      - 范围管理
      - 进度管理
      - 质量管理
      - 整合管理
    answer: "A"
    explanation_md: |
      范围管理管的是「做什么、不做什么」，核心产出是需求文件与 WBS。
      进度管理管「什么时候做完」，质量管理管「合格不合格」，整合管理管「各条线怎么拧成一股」。
    source: manual

  - id: RK-S1-004
    module_id: S1
    kp_id: KP-0105
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: easy
    level: 1
    title: 项目经理的核心作用
    body_md: |
      关于项目经理在项目中的核心作用，下列描述最准确的是？
    options:
      - 完成技术方案设计与关键代码实现
      - 通过整合资源、协调干系人，达成项目目标
      - 监督团队成员的考勤与日常纪律
      - 签署项目涉及的全部合同
    answer: "B"
    explanation_md: |
      项目经理的核心是**整合**——把不同专业、不同部门、不同利益的人组织起来达成目标。
      技术方案由技术负责人做，合同签署通常由授权代表或商务负责，考勤属于职能管理。
    source: manual

  - id: RK-S1-005
    module_id: S1
    kp_id: KP-0101
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 2
    title: 衡量项目成功的标准
    body_md: |
      关于衡量项目是否成功，下列说法最正确的是？
    options:
      - 只要在预算内完成就算成功
      - 在范围、进度、成本、质量等约束下达成目标，并使关键干系人满意
      - 团队没有加班就算成功
      - 交付的功能数量越多越成功
    answer: "B"
    explanation_md: |
      项目成功不等于「没超预算」。传统三约束（范围 / 进度 / 成本）之外还要看质量与干系人满意度——
      交付物再准时，如果客户不用、不认，项目仍然失败。这一条在案例题里经常作为失分点出现。
    source: manual

  - id: RK-S1-006
    module_id: S1
    kp_id: KP-0102
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 2
    title: 项目章程的归属与作用
    body_md: |
      项目章程在哪个过程组制定？它的核心作用是什么？
    options:
      - 启动过程组；正式授权项目存在，并授权项目经理动用组织资源
      - 规划过程组；确定详细的项目范围
      - 执行过程组；给团队成员分配具体任务
      - 监控过程组；控制变更是否被批准
    answer: "A"
    explanation_md: |
      项目章程属于**启动过程组**，是项目的「出生证明」，同时是项目经理的「授权书」。
      因为它要授权项目经理，所以不能由项目经理自己签发——这是判断题的高频陷阱。
    source: manual

  - id: RK-S1-007
    module_id: S1
    kp_id: KP-0104
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 3
    title: 职能型组织里的项目经理
    body_md: |
      在职能型组织中，项目经理通常扮演什么角色？
    options:
      - 对项目成员拥有完全指挥权
      - 协调员或联络员，主要靠沟通推动，对资源没有直接控制权
      - 直接管理项目预算与人员绩效
      - 与职能经理权限完全相同
    answer: "B"
    explanation_md: |
      职能型组织里，资源与考核都在职能经理手上，项目经理只能「协调」。
      这也是为什么职能型组织下项目经理常常「责任大、权力小」——这个矛盾是案例题的常客。
    source: manual

  - id: RK-S1-008
    module_id: S1
    kp_id: KP-0104
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 3
    title: 项目型组织的特点
    body_md: |
      与职能型组织相比，项目型组织的主要特点是？
    options:
      - 项目经理权力最小，由职能经理主导
      - 项目经理拥有最大权限，但团队成员在项目结束后需要重新安置
      - 资源可以在多个项目之间高效共享
      - 不需要设置项目管理办公室
    answer: "B"
    explanation_md: |
      项目型组织里，人和资源都归项目，项目经理权力最大，代价是**资源利用率低**——
      项目一结束，团队就要重新找归属。这正好和职能型组织的优缺点互为镜像，常成对考。
    source: manual

  - id: RK-S1-009
    module_id: S1
    kp_id: KP-0103
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: medium
    level: 3
    title: 把高层需求拆成工作包属于哪个领域
    body_md: |
      某项目需要把客户的概括性需求逐层分解为可管理、可估算的工作包。这个动作属于哪个知识领域？
    options:
      - 范围管理
      - 进度管理
      - 资源管理
      - 质量管理
    answer: "A"
    explanation_md: |
      逐层分解形成 WBS（工作分解结构），是**范围管理**的核心工具。
      容易混的是进度管理——进度管理用的是 WBS 的产物（工作包）来排活动，但「拆 WBS」这一步属于范围。
    source: manual

  - id: RK-S1-010
    module_id: S1
    kp_id: KP-0104
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: hard
    level: 4
    title: 从资源申请方式反推组织结构
    body_md: |
      某公司项目经理要为本项目申请一名测试工程师，必须向测试部经理提出申请、由测试部经理安排人员，
      且项目经理无权考核该成员的绩效。这最可能是什么组织结构？
    options:
      - 项目型
      - 强矩阵型
      - 职能型
      - 复合型
    answer: "C"
    explanation_md: |
      判据是「资源怎么来、考核在谁手上」：要**申请**、且**无权考核** ⇒ 资源完全在职能经理手里 ⇒ 职能型。
      强矩阵里项目经理对资源有实质调配权，不需要逐次申请；项目型里人本来就归项目。
    source: manual

  - id: RK-S1-011
    module_id: S1
    kp_id: KP-0105
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: hard
    level: 4
    title: 关键干系人不参与怎么办
    body_md: |
      项目进入执行阶段，一名关键干系人（业务部门负责人）始终不参加需求评审，导致需求反复变更。
      项目经理首先应该做的是？
    options:
      - 把该干系人从干系人名单中剔除
      - 识别其对项目的影响与真实诉求，制定针对性的沟通策略
      - 直接上报高层投诉其不配合
      - 先按现有需求开发，出了问题再说
    answer: "B"
    explanation_md: |
      干系人管理的顺序是「识别 → 分析（权力 / 利益）→ 制定策略 → 执行」。跳过分析直接上手段，
      无论是剔除、上报还是硬推，都是把症状当原因。
      案例题里，凡是「首先应该做什么」，答案几乎都落在识别与分析这一步。
    source: manual

  - id: RK-S1-012
    module_id: S1
    kp_id: KP-0102
    category: 中项·S1 项目管理框架
    type: 单选
    difficulty: hard
    level: 4
    title: 判断工作落在哪个过程组
    body_md: |
      团队正在制定 WBS、估算工期与成本、识别风险，并汇总形成项目管理计划。这些工作属于哪个过程组？
    options:
      - 启动
      - 规划
      - 执行
      - 监控
    answer: "B"
    explanation_md: |
      「制定计划类」的工作都在**规划过程组**：范围、进度、成本、风险各条线的计划都在这里生成，
      最后整合成项目管理计划。判断口诀：还在「想清楚要怎么做」= 规划；已经「动手做」= 执行。
    source: manual

  - id: RK-S1-013
    module_id: S1
    kp_id: KP-0103
    category: 中项·S1 项目管理框架
    type: 实操
    difficulty: hard
    level: 5
    title: 十大知识领域落回自己的项目
    body_md: |
      从十大知识领域中挑 4 个，各写出你手上某个真实项目在对应领域的一项**具体产出物**。

      要求：不要写「范围管理计划」这类空名，要写实际的东西，例如「需求清单 37 条，含优先级」。
    options: []
    answer: "四个领域各自的真实产出物；每条都能看出具体内容；能对应回知识领域"
    explanation_md: |
      这道题的目的不是背十大领域，而是**把你项目里已有的东西挂到标准框架上**。
      例如：范围 →「需求清单 37 条带优先级」；进度 →「甘特图，含 5 个里程碑」；
      风险 →「风险登记册 12 条，3 条高」；沟通 →「周报 + 双周评审会」。

      凡是写不出来的领域，就是你项目里真实缺失的管理动作——这比背书有用得多。
    source: manual

  - id: RK-S1-014
    module_id: S1
    kp_id: KP-0101
    category: 中项·S1 项目管理框架
    type: 实操
    difficulty: hard
    level: 5
    title: 用自己项目解释「渐进明细」
    body_md: |
      举一个你项目里「渐进明细」的例子：开始时以为什么、后来明确成什么、是什么触发了这次细化。
    options: []
    answer: "有初始的粗略判断；有明确化之后的具体结果；说清了触发细化的原因"
    explanation_md: |
      合格答案的样子：立项时以为「就是做一个数据看板」，做完需求调研才发现要对接三个部门的异构数据源，
      范围从「一个页面」变成「一套数据接入 + 治理 + 展示」，触发点是需求评审时发现口径对不上。

      不合格的答案：把「渐进明细」的定义再解释一遍，不落到自己的项目。
      这题考的是「能不能用概念解释经验」，正是案例题的核心能力。
    source: manual

  - id: RK-S1-015
    module_id: S1
    kp_id: KP-0105
    category: 中项·S1 项目管理框架
    type: 实操
    difficulty: hard
    level: 5
    title: 没有人事权怎么推动跨部门
    body_md: |
      你在项目中没有直接人事权，但需要推动三个部门配合。写出你会用的 3 个**具体动作**。

      要求：要能落地，不写「加强沟通」「提高意识」这类话。
    options: []
    answer: "用正式授权；建立共同利益点；用机制固化协作；保留升级路径"
    explanation_md: |
      参考方向（答到 3 条即可）：
      1. **用正式授权**：把配合事项写进项目章程或高层签发的任务书，让「配合」有出处；
      2. **找共同利益**：把项目目标翻译成对方部门的考核指标（例如帮他们减少手工报表）；
      3. **机制固化**：指定各部门接口人、固定双周接口会、把交付物写进里程碑；
      4. **保留升级路径**：明确「什么情况下升级到项目指导委员会」，而不是私下抱怨。

      这题练的正是案例题里「没有权力怎么做事」的答法——要写动作，不写态度。
    source: manual

  # ── 第一批补题（2026-10-27）：S3 补齐到每层 5 题 ──────────────
  - id: RK-S3-004
