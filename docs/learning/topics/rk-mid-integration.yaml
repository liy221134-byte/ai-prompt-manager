# 中项主题包 · 系统集成项目管理工程师（中级·软考）
#
# 用途：v4 学习系统的第一个真实主题，用来反向验证主题包 schema 是否够用。
# 不是完整题库：示例题只用于验证「题目挂知识点 + 按 stage 出题」这条链路。
#
# 事实来源：
#   考试科目/合格线/机考时长 —— 官方批次通告 + 山东省 2026 年报考须知
#   教材章节结构 —— 《系统集成项目管理工程师教程（第3版）》清华社 2024.1，共 18 章
#   分值分布 —— 培训机构基于历年真题的统计（非官方），标为 estimate
#
