    common_mistakes:
      - IaaS/PaaS/SaaS 边界记混（记住：谁管操作系统）
      - 把数据治理和数据管理当成同义词
      - 等保级别与业务重要性对应关系记错
    min_project: 用自己项目的沙箱平台，画出它涉及的技术栈，标注每一项对应教材哪一章
